readcnt 的“读—改—写”以及“是否为第一个读者/最后一个读者”的判断成为原子操作。去掉它之后：两个读者可能同时读到 readcnt==0，于是都认为自己不是第一个读者而不去 P(&w)，导致写者可能与读者同时在临界区里（本来第一个读者必须拿到 w 以排斥写者）；反过来，两个读者同时读到 readcnt==1 时也可能都去执行 P(&w) 或都执行 V(&w)，造成死锁或提前放行写者。因此程序会出错，属于典型的竞争（race condition），根因是 readcnt 的更新不是原子操作。正确做法是保留 mutex 对 readcnt 的互斥保护（本题的考题正是“去掉 mutex 会怎样”）。踩坑点：w 保护的是“读者集合 vs 写者”，mutex 保护的是 readcnt 本身，两者缺一不可。","tags":["读者写者","竞争","原子性","信号量"],"options":null,"answer":["会出错：readcnt 的读-改-写不是原子操作，会出现竞争（race condition），可能导致写者与读者同时进入临界区","会出错，出现竞争（race），readcnt 会被算错","会出错：发生竞争（race condition）"],"kp":"同步与信号量"},{"id":"f2020-23","source":"2020 期末","origin":"exam","lecture":25,"topic":"指令重排与临界区顺序（逆序数）","type":"single","difficulty":3,"stem":"令 Li 表示加载共享变量到寄存器的指令，Ui 表示更新寄存器的指令，Si 表示将更新值存回到共享变量的指令。指令 L1、U1、S1、L3、U3、S3 操作共享变量 cnt，指令 L2、U2、S2、L4、U4、S4 操作共享变量 num。假定每次只允许交换相邻的两条指令，则将下列指令序列变为正确的至少需要交换多少次：","code":"原序列：L2、L1、U1、L3、L4、U4、U3、S1、U2、S4、S3、S2","explanation":"正确的执行必须保证“同一个共享变量的 L、U、S 三步按序完成，且不会被另一个变量的临界区打断到破坏一致性”。把序列整理成合法形式的一种最优全序是 L2, L1, U1, S1, L3, U2, S2, L4, U4, U3, S4, S3（即先把 num 与 cnt 的加载安排好，再让每个变量各自的 U/S 成对紧随其后，最后收尾），它与原序列相比的逆序数为 12，因此至少需要 12 次相邻交换，选 C。注意这类题的关键是：不能把 U 提到同变量 L 之前、也不能把 S 提到同变量 U 之前，同时不同变量的操作可以交错但要避免彼此嵌套成环。踩坑点：交换相邻两条指令的最小次数等于目标序列相对原序列的逆序数。","tags":["临界区","指令重排","逆序数","并发正确性"],"options":["10","11","12","13"],"answer":2,"kp":"并发编程"},{"id":"f2020-25","source":"2020 期末","origin":"exam","lecture":25,"topic":"多把信号量下死锁轨迹的判定","type":"single","difficulty":3,"stem":"有四个信号量，初值分别为 a=1, b=1, c=1, d=1。三个线程的执行序列如下，上面的程序执行时，下列哪一个执行轨迹执行后已经出现死锁？","code":"线程 1：①P(a) ②P(b) ③P(d) ④P(c) ⑤V(d) ⑥V(a) ⑦V(b) ⑧V(c)\n线程 2：⑨P(c) ⑩P(b) ⑪V(c) ⑫V(b) ⑬P(a) ⑭V(a)\n线程 3：⑮P(d) ⑯P(a) ⑰V(d) ⑱P(b) ⑲V(a) ⑳V(b)","explanation":"B（①⑨⑩②⑮⑯）：① 线程 1 拿到 a；⑨ 线程 2 拿到 c；⑩ 线程 2 又拿到 b，此时线程 2 持有 {b,c}；② 线程 1 请求 b 被阻塞（等待线程 2）；⑮ 线程 3 拿到 d；⑯ 线程 3 请求 a 被阻塞（等待线程 1）。于是线程 1 持 a 等 b、线程 2 持 b 等 a（⑬）、线程 3 持 d 等 a，形成循环等待：线程 2 虽然可以执行 ⑪V(c)、⑫V(b) 释放 b 让线程 1 继续，但线程 1 拿到 b 后紧接着 ③P(d) 又会等待线程 3 持有的 d，而线程 3 正在等线程 1 的 a，此时谁都退不出去——死锁已经形成。A、C、D 这些前缀执行后仍存在可行的完成顺序（例如 A 中线程 2 尚未取得 b，可以继续释放/申请而不形成环路；C 中线程 3 先拿到 d，但线程 1 先拿到 a，⑯ 请求 a 失败后线程 1 仍有推进空间；D 中线程 1 已拿到 a、b、d、c 全部四把锁，随后会依次释放，不会死锁）。踩坑点：死锁要看“持有并等待”是否形成环路，而不只是看有没有阻塞。","tags":["死锁","信号量","循环等待"],"options":["⑨①⑩②⑪⑮","①⑨⑩②⑮⑯","⑮①⑨⑩⑯②","①②③④⑨⑮"],"answer":1,"kp":"同步与信号量"},{"id":"f2021-27","source":"2021 期末","origin":"exam","lecture":25,"topic":"生产者-消费者中 P 操作的顺序与死锁","type":"single","difficulty":2,"stem":"下面是“生产者-消费者”问题的经典信号量解法（BUF_SIZE=3，mutex/empty/full 分别初始化为 1/BUF_SIZE/0，producer 的第 24、25 行依次为 ① P(&empty)、② P(&mutex)，consumer 的第 39、40 行依次为 ③ P(&full)、④ P(&mutex)）。如果交换 24 行与 25 行（两个 P 操作），则会：","code":"static sem_t mutex;   /* Mutual Exclusion */\nstatic sem_t empty;   /* How many empty slots */\nstatic sem_t full;    /* How many items */\n\nstatic void *producer(void *num) {\n    ①;                     /* 24 行：P(&empty) */\n    ②;                     /* 25 行：P(&mutex) */\n    /* Critical section begins */\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items++;\n    /* Critical section ends */\n    V(&mutex);\n    V(&full);\n    return NULL;\n}\n\nstatic void *consumer(void *num) {\n    ③;                     /* 39 行：P(&full) */\n    ④;                     /* 40 行：P(&mutex) */\n    /* Critical section begins */\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items--;\n    /* Critical section ends */\n    V(&mutex);\n    V(&empty);\n    return NULL;\n}","explanation":"正确的顺序是“先申请资源信号量（empty/full），再申请互斥锁（mutex）”。如果把生产者的两行交换，变成先 P(&mutex) 再 P(&empty)：当缓冲区已满（empty=0）时，生产者会先拿到 mutex、然后永远阻塞在 P(&empty) 上；此时消费者虽然想消费，却因为拿不到 mutex 而无法执行 P(&full) 和 V(&empty)，缓冲区永远不会变空——双方互相等待，形成死锁。故选 A（有可能死锁）。B 错：这里的问题不是长期得不到资源（饥饿），而是环路等待导致的死锁；C 显然不成立。踩坑点：互斥锁不能包住“等待资源”的动作，否则会把互斥锁变成死锁的锁环。","tags":["生产者消费者","死锁","信号量顺序"],"options":["有可能死锁","有可能饥饿","既不会死锁，也不会饥饿"],"answer":0,"kp":"同步与信号量"},{"id":"f2021-28","source":"2021 期末","origin":"exam","lecture":25,"topic":"V 操作的顺序是否影响正确性","type":"single","difficulty":2,"stem":"在上一题的生产者-消费者解法中，producer 退出临界区后依次执行第 32 行 V(&mutex) 和第 33 行 V(&full)。交换 32、33 行（两个 V 操作）是否可能造成同步错误？","code":"static void *producer(void *num) {\n    P(&empty);\n    P(&mutex);\n    /* Critical section begins */\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items++;\n    /* Critical section ends */\n    V(&mutex);   /* 32 行 */\n    V(&full);    /* 33 行 */\n    return NULL;\n}","explanation":"不可能。V 操作不会阻塞，只会把信号量的值加一并唤醒等待者，因此两个 V 的先后顺序不会破坏程序的安全性：无论先 V(&full) 还是先 V(&mutex)，缓冲区里的 item 数量与资源信号量的计数最终都是一致的（先把资源放出来、再放互斥锁也是安全的，因为拿到 full 的消费者随后会去竞争 mutex，最坏只是多等一会儿，不会算错 items，也不会形成等待环）。故选 B。对比上一题的 P 操作交换就会死锁，可见“P 的顺序敏感、V 的顺序不敏感”是信号量解法的一个重要规律。踩坑点：判断 V 的顺序时只需考虑“是否可能形成互相等待”，单纯的 V 交换不会造成环路。","tags":["生产者消费者","V操作","信号量顺序"],"options":["可能","不可能"],"answer":1,"kp":"同步与信号量"},{"id":"f2021-42","source":"2021 期末","origin":"exam","lecture":25,"topic":"补全生产者-消费者解法的 P 操作","type":"fill","difficulty":2,"stem":"下面是“生产者-消费者”问题的经典信号量解法（BUF_SIZE=3，mutex/empty/full 初值分别为 1/BUF_SIZE/0）。请补全 producer 与 consumer 开头的四个 P 操作（用选项字母回答，可重复选择）：选项 A. P(&mutex)  B. P(&empty)  C. P(&full)。① 是 producer 第 24 行，② 是 producer 第 25 行，③ 是 consumer 第 39 行，④ 是 consumer 第 40 行。","code":"static void *producer(void *num) {\n    ①;                       /* 24 行 */\n    ②;                       /* 25 行 */\n    /* Critical section begins */\n    items++;\n    /* Critical section ends */\n    V(&mutex);\n    V(&full);\n}\n\nstatic void *consumer(void *num) {\n    ③;                       /* 39 行 */\n    ④;                       /* 40 行 */\n    /* Critical section begins */\n    items--;\n    /* Critical section ends */\n    V(&mutex);\n    V(&empty);\n}","explanation":"必须“先申请资源信号量、再申请互斥锁”：生产者要先等一个空槽（① P(&empty)，即选项 B），拿到之后再进入用 mutex 保护的临界区（② P(&mutex)，选项 A）；消费者要先等一个可用 item（③ P(&full)，选项 C），再取互斥锁（④ P(&mutex)，选项 A）。因此四空依次为 B、A、C、A（官方答案即 BACA）。反过来写（先 P(&mutex) 再 P(&empty)）会在缓冲区满时持锁等待空槽，造成死锁（这正是下一题要考的点）。踩坑点：资源信号量一定要在互斥锁之外先申请。","tags":["生产者消费者","信号量","P操作顺序"],"options":null,"answer":["①B ②A ③C ④A","BACA","① P(&empty) ② P(&mutex) ③ P(&full) ④ P(&mutex)"],"kp":"同步与信号量"},{"id":"gen-c25-01","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"信号量与 P/V 操作语义","type":"single","difficulty":1,"stem":"关于信号量与 P/V 操作，下列说法**正确**的是：","code":null,"explanation":"讲义“Semaphores”一页给出定义：信号量是非负的全局整型同步变量，只由 P、V 两个操作修改。P(s) 在 s 非零时原子地减 1 并立即返回，在 s 为零时挂起线程，等某个 V 使之非零后被唤醒，醒来后完成减 1；V(s) 原子地把 s 加 1，若已有线程阻塞在 P 上则**恰好唤醒一个**，被唤醒者在 V 之后完成自己的减 1。语义可以写成 P(s)：`[ while (s == 0) wait(); s--; ]` 与 V(s)：`[ s++; ]`，方括号内的操作由内核保证不可分割，不变量是 s ≥ 0。选项 B 错在“唤醒所有”；选项 C 错在原子性正是语义的核心，否则两个线程可能同时通过 P 进入临界区；选项 D 错在实现上等待者由内核的等待队列记录，信号量的值不允许为负。","tags":["信号量","P 操作","V 操作","原子性"],"options":["信号量是非负的全局整型同步变量；P(s) 在 s 非零时原子地把 s 减 1 并立即返回，在 s 为零时挂起线程直到某个 V 操作唤醒它","V(s) 把 s 加 1；如果此时有多个线程阻塞在 P 上，内核会唤醒所有阻塞线程，让它们都完成 P","P 的“测试并减 1”和 V 的“加 1”不需要保证原子性，因为信号量本身就是一个整型变量","信号量的值可以是负数，负数的绝对值表示正在等待的线程个数"],"answer":0,"kp":"同步与信号量"},{"id":"gen-c25-02","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"共享变量实例分析","type":"single","difficulty":1,"stem":"按讲义“变量 x 是共享的，当且仅当多个线程引用了 x 的某个实例”的定义，下例中**是共享的**变量是：","code":"char **ptr;   /* 全局变量 */\n\nint main(int argc, char *argv[])\n{\n    long i;\n    pthread_t tid;\n    char *msgs[2] = { \"Hello from foo\", \"Hello from bar\" };\n\n    ptr = msgs;\n    for (i = 0; i < 2; i++)\n        Pthread_create(&tid, NULL, thread, (void *)i);\n    Pthread_exit(NULL);\n}\n\nvoid *thread(void *vargp)\n{\n    long myid = (long)vargp;\n    static int cnt = 0;\n    printf(\"[%ld]: %s (cnt=%d)\\n\", myid, ptr[myid], ++cnt);\n    return NULL;\n}","explanation":"`ptr` 是全局变量，在虚拟内存中只有一个实例，主线程与两个 peer 线程都引用它，因此共享。`cnt` 是 `thread` 内部的局部 `static` 变量，也只有一个实例（存放在数据段），被两个 peer 线程通过 `++cnt` 引用，因此共享——这也是讲义用它演示竞态的原因。`msgs` 虽然声明在 `main` 内（主线程的栈上），但两个 peer 线程通过全局 `ptr` 间接引用了它，按定义也是共享的，这一点最容易被“局部变量一定私有”的直觉蒙蔽。`i` 只被主线程引用（`i`.`m` 一个实例、只有一个引用者），`myid` 则是每个 peer 线程栈上各有一份实例、各自只被自己引用，都不是共享变量。对应讲义“Mapping Variable Instances to Memory”与“Shared Variable Analysis”一页的表格。","tags":["共享变量","static","实例"],"options":["`i`、`myid`","`ptr`、`i`、`myid`","`msgs`、`myid`","`ptr`、`cnt`、`msgs`"],"answer":3,"kp":"并发编程"},{"id":"gen-c25-03","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"用二元信号量保护临界区","type":"single","difficulty":2,"stem":"主线程执行 `sem_init(&mutex, 0, 1)` 后创建两个线程，每个线程都要循环 `niters` 次对共享变量 `cnt` 做 `cnt++`。要保证最终 `cnt` 等于 2×niters，两个注释位置应填入：","code":"volatile long cnt = 0;\nsem_t mutex;         /* 主线程执行 sem_init(&mutex, 0, 1) */\n\nvoid *thread(void *vargp)\n{\n    long i, niters = *((long *)vargp);\n    for (i = 0; i < niters; i++) {\n        /* 位置 1 */\n        cnt++;\n        /* 位置 2 */\n    }\n    return NULL;\n}","explanation":"讲义“Using Semaphores for Mutual Exclusion”“goodcnt.c: Proper Synchronization”给出的模式是：为每个（组）共享变量关联一个初值为 1 的二元信号量 mutex，并把临界区用 `P(&mutex)` 与 `V(&mutex)` 包起来——“加锁”在临界区之前，“解锁”在临界区之后，从而保证同一时刻只有一个线程执行 `cnt++`。选项 A 把 P/V 写反：V 先让 s 变成 2，随后两个线程都能通过 P，互斥失效。选项 B 只加锁不解锁，第二个线程会永久阻塞（讲义强调 P/V 必须成对）。选项 D 把初值写成 0：第一个执行 P 的线程立刻挂起，而没有任何线程会执行 V，程序死锁；初值 1 才是“锁可用”的语义。讲义还给出性能对比：niters = 10^6 时 badcnt 用 12 ms，goodcnt 用 450 ms（慢 37.5 倍），说明互斥是以性能换正确性。","tags":["互斥","sem_init","临界区"],"options":["前一位置 `V(&mutex)`，后一位置 `P(&mutex)`","两个位置都填 `P(&mutex)`","前一位置 `P(&mutex)`，后一位置 `V(&mutex)`","把初始化改成 `sem_init(&mutex, 0, 0)`，前一位置 `P(&mutex)`，后一位置 `V(&mutex)`"],"answer":2,"kp":"并发编程"},{"id":"gen-c25-04","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"sbuf：n 项循环缓冲区的三个信号量","type":"single","difficulty":2,"stem":"上述 `sbuf` 包用三个信号量实现了 n 项循环缓冲区的生产者-消费者同步。关于它们的作用、初值以及 P/V 的位置，下列说法**错误**的是：","code":"void sbuf_init(sbuf_t *sp, int n)\n{\n    sp->buf = Calloc(n, sizeof(int));\n    sp->n = n;\n    sp->front = sp->rear = 0;\n    Sem_init(&sp->mutex, 0, 1);   /* 二元信号量，保护缓冲区 */\n    Sem_init(&sp->slots, 0, n);   /* 初始有 n 个空槽         */\n    Sem_init(&sp->items, 0, 0);   /* 初始没有数据项          */\n}\n\nvoid sbuf_insert(sbuf_t *sp, int item)\n{\n    P(&sp->slots);\n    P(&sp->mutex);\n    if (++sp->rear >= sp->n) sp->rear = 0;\n    sp->buf[sp->rear] = item;\n    V(&sp->mutex);\n    V(&sp->items);\n}\n\nint sbuf_remove(sbuf_t *sp)\n{\n    int item;\n    P(&sp->items);\n    P(&sp->mutex);\n    if (++sp->front >= sp->n) sp->front = 0;\n    item = sp->buf[sp->front];\n    V(&sp->mutex);\n    V(&sp->slots);\n    return item;\n}","explanation":"讲义“Producer-Consumer on an n-element Buffer”“sbuf Package”几页说明：`mutex` 是**二元**信号量，只保证同一时刻有一个线程修改缓冲区与索引，它保护的是数据结构的完整性而不是“并发度”，因此初值必须是 1；用计数信号量（初值 n）代替它会让多个生产者同时改写 `rear` 与 `buf`，造成数据错乱。`slots` 计数空槽（初值 n）、`items` 计数数据项（初值 0），二者才是计数信号量，用来表达“还有多少资源可用”。插入顺序 `P(slots) → P(mutex) → 写缓冲区 → V(mutex) → V(items)` 也是关键：先取得空槽再进临界区，先出临界区再通知消费者；若把两个 P 颠倒，缓冲区满时生产者会**持有 mutex** 阻塞在 slots 上，而消费者又需要 mutex 才能取数据，于是双方互等形成死锁。","tags":["sbuf","循环缓冲区","计数信号量","死锁"],"options":["`slots` 计数可用的空槽位数（初值 n），`items` 计数可用的数据项数（初值 0），`mutex` 用于保护缓冲区数组与 front/rear 的一致性访问（初值 1）","`sbuf_insert` 中 `P(&sp->slots)` 在 `P(&sp->mutex)` 之前，`V(&sp->items)` 在 `V(&sp->mutex)` 之后，这是有意为之：先申请资源再进临界区，退出临界区后才通知对方","`mutex` 必须是计数信号量、初值取 n，因为最多应该允许 n 个生产者同时进入插入临界区以提高并发","如果把 `sbuf_insert` 中的两个 P 调换顺序（先进临界区再等空槽），当缓冲区满时可能发生死锁"],"answer":2,"kp":"同步与信号量"},{"id":"gen-c25-05","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"进度图、不安全区与禁止区","type":"single","difficulty":3,"stem":"用初值为 1 的二元信号量 s 保护两个线程各自的临界区（临界区前 `P(s)`、之后 `V(s)`）。在进度图中，两轴分别表示两个线程的指令顺序，每个点表示一个执行状态。下列说法**错误**的是：","code":null,"explanation":"讲义“Progress Graphs”“Critical Sections and Unsafe Regions”“Why Mutexes Work”几页说明：进度图的每个点是一个执行状态 (Inst1, Inst2)，一条轨迹就是一次合法交错的指令序列；把 `L, U, S` 这样访问同一共享变量的指令段称为临界区，两个线程的临界区指令相互交错的状态集合就是不安全区；只要轨迹不进入不安全区就能得到正确结果。用初值 1 的信号量把临界区包起来之后，P/V 的语义使 s 始终 ≥ 0，这在进度图上形成一个**禁止区**，它完整包围不安全区，任何合法轨迹都无法进入，因此“所有轨迹都安全”是被证明的性质，而不是经验猜测。选项 D 恰好否定了这一点：禁止区不是启发式的，也无需再加一层锁来“补救”。讲义还用 s 取值 1→0→−1 的图示说明为什么只能有一个线程进入临界区。","tags":["进度图","不安全区","禁止区","轨迹"],"options":["不安全区由两个线程的临界区指令相互交错执行的那些状态组成","信号量不变量 s ≥ 0 形成了一个禁止区（forbidden region），它完整地包围不安全区，因此任何合法轨迹都无法进入不安全区","轨迹是安全的当且仅当它不进入不安全区；对于被保护的 cnt，轨迹安全当且仅当结果正确","禁止区只是“按经验划出”的启发式区域，某些合法轨迹仍可能进入其中并到达不安全区，所以还必须再加一层锁"],"answer":3,"kp":"并发编程"},{"id":"gen-c25-06","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"常见 P/V 错误诊断","type":"multi","difficulty":2,"stem":"上面四个片段都在使用信号量实现同步或互斥，其中会导致错误（永久阻塞、死锁或数据错乱）的是：","code":"/* 片段 A */\nsem_init(&s, 0, 0);\n...\nP(&s);\n/* 临界区 */\nV(&s);\n\n/* 片段 B：1 项缓冲区的生产者 */\nP(&empty);\nbuf = item;\nV(&full);\n\n/* 片段 C */\nP(&mutex);\ncnt++;\n/* 忘记 V(&mutex) */\n\n/* 片段 D：1 项缓冲区的初始化 */\nSem_init(&empty, 0, 0);\nSem_init(&full,  0, 1);","explanation":"片段 A 错在互斥信号量初值：要用来加锁的 mutex 初值必须是 1（表示锁可用），写成 0 之后第一个执行 `P(&s)` 的线程立刻挂起，而没有任何线程会执行 V，程序永久阻塞。片段 B 是 1 项缓冲区生产者-消费者的**正确**写法：生产者先 `P(&empty)` 等待空位、写入后 `V(&full)` 通知消费者，消费者则 `P(&full)`、读取后 `V(&empty)`，两个信号量初值分别为 1 和 0，恰好满足“最多一项、写后才有可读”的约束。片段 C 错在只加锁不解锁：忘记 `V(&mutex)` 会让所有其他线程永久阻塞在 P 上，这正是讲义强调“P/V 必须配对”的原因。片段 D 错在把 `empty` 与 `full` 的初值互换：消费者一开始就能通过 `P(&full)` 读到缓冲区里并不存在的数据（数据错乱），生产者则先被 `P(&empty)` 挡住直到消费者误发 `V(&empty)`。对应讲义“Producer-Consumer on 1-element Buffer”一页。","tags":["信号量初值","生产者消费者","P/V 配对"],"options":["片段 A","片段 B","片段 C","片段 D","四个片段都没有问题"],"answer":[0,2,3],"kp":"同步与信号量"},{"id":"gen-c25-07","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"互斥锁术语与性能代价","type":"judge","difficulty":2,"stem":"判断：用于互斥的二元信号量常称为 mutex，初值为 1，P 操作称为“加锁”、V 操作称为“解锁”；“持有”互斥锁指已加锁且尚未解锁。计数信号量用于对一组可用资源计数，取值范围可以是 0 到 n。讲义给出的数据（niters = $10^6$ 时 badcnt 12 ms、goodcnt 450 ms、goodmcnt 214 ms）说明加锁同步带来的额外开销可以忽略不计（不到 10%），而且 pthread 互斥锁比通用信号量慢得多。","code":null,"explanation":"前半段的术语完全正确，出自讲义“Using Semaphores for Mutual Exclusion”一页：二元信号量（取值只能是 0 或 1）用于互斥时称为 mutex，P 叫加锁、V 叫解锁，“持有”指已加锁且尚未解锁；计数信号量用来对一组可用资源计数，取值范围 0 到 n。但后半段把性能结论说反了：12 ms 对 450 ms 是 **37.5 倍**减速，goodmcnt 的 214 ms 相对 12 ms 也是 **17.8 倍**，加锁同步的开销高达一到两个数量级，绝不是“不到 10%”。而且讲义指出互斥锁是信号量的特例，语义更清晰，性能约为通用信号量的**两倍快**——goodmcnt(214 ms) 明显快于 goodcnt(450 ms) 正是证据，所以“pthread 互斥锁比通用信号量慢得多”同样是错的。","tags":["mutex","二元信号量","性能开销"],"options":null,"answer":false,"kp":"同步与信号量"},{"id":"gen-c25-08","source":"自编 · 第 25 讲","origin":"created","lecture":25,"topic":"sbuf 中 slots 的取值","type":"fill","difficulty":1,"stem":"`sbuf_init(sp, n)` 把 `slots` 初始化为 n、`items` 初始化为 0。若缓冲区容量 n = 8，且当前已经放入了 3 项（生产者都已完成插入，消费者尚未取走任何一项），此时 `slots` 的值是 ____（只填整数）。","code":null,"explanation":"`slots` 计数的是“还可以再放入多少项”，也就是空槽数目：初始时缓冲区为空，空槽为 8；每插入一项，`sbuf_insert` 先 `P(&slots)` 把空槽数减 1，插入完成后再 `V(&items)` 把数据项数加 1。因此放入 3 项后 slots = 8 − 3 = 5，items = 3（两者之和恒为 n）。若消费者取走数据，则 `sbuf_remove` 先 `P(&items)` 再 `V(&slots)`，slots 恢复。注意 `slots` 与 `items` 是**计数信号量**，而保护缓冲区的 `mutex` 是二元信号量（初值 1）；把三者混用（例如把 mutex 初值也设成 n）会破坏互斥或造成死锁。","tags":["sbuf","slots","items","计数信号量"],"options":null,"answer":["5"],"kp":"同步与信号量"},{"id":"f2017-15","source":"2017 期末","origin":"exam","lecture":26,"topic":"死锁与异步信号安全","type":"single","difficulty":3,"stem":"下列关于死锁的叙述中，不正确的是","code":null,"explanation":"printf 内部需要获取 stdio 的锁，而且它不是异步信号安全的：若主程序正持有该锁时被信号打断，处理函数里再调用 printf 就会自己等自己，形成死锁（还可能因缓冲区状态被破坏而崩溃），所以 D 错。A 是正确的死锁定义。B 正确：对缓冲区的加锁顺序必须先申请空槽/满槽再获取互斥锁，若先拿 mutex 再等 slots，线程可能在持有锁的情况下永久阻塞，其他线程无法推进，形成死锁。C 正确：printf 通过内部锁保证同一时刻只有一个线程写入，因而是线程安全的，只是不可重入、也不异步信号安全。踩坑点：线程安全 ≠ 可重入 ≠ 异步信号安全。","tags":["死锁","线程安全","printf"],"options":["所谓死锁是指一组线程被阻塞，等待一个永远不会为真的条件","在用信号量及 PV 操作解决生产者消费者问题（多个缓冲区、多个生产者，多个消费者）时，如果先给缓冲区加锁 P(&sp->mutex)，再申请可用的缓冲区槽 P(&sp->slots)；则可能出现死锁","printf() 是线程安全函数","在信号处理函数中使用 printf() 不会导致死锁"],"answer":3,"kp":"同步与信号量"},{"id":"f2020-30","source":"2020 期末","origin":"exam","lecture":26,"topic":"哲学家就餐与信号量死锁","type":"fill","difficulty":2,"stem":"火锅洞洞主请 26 位同学围圆桌而坐（Alice 的右边是 Bob，……，Zach 的右边是 Alice），每位同学要同时拿着左右两位同学的手机去找洞主验证身份。Alice 给出的代码如右：26 个线程各执行 P(&sem[UP(num)]); P(&sem[DOWN(num)]); …验证… V(&sem[UP(num)]); V(&sem[DOWN(num)]);，其中 sem[i] 的初值都是 1。请问这段代码可能会发生什么问题（用一个专用名词表述即可）？","code":"1. #include \"csapp.h\"\n2. #define N 26\n3. #define UP(i)   ((i + 1) % N)\n4. #define DOWN(i) ((i - 1 + N) % N)\n5. sem_t sem[N];\n6.\n7. void *thread(void *i) {\n8.     int num = (int)i;\n9.     P(&sem[UP(num)]);\n10.    P(&sem[DOWN(num)]);\n11.    /* verify identity */\n12.    V(&sem[UP(num)]);\n13.    V(&sem[DOWN(num)]);\n14. }\n15. int main() {\n16.    for (int i = 0; i < N; i++)\n17.        Sem_init(&sem[i], 0, 1);\n18.    ...\n19. }","explanation":"这就是经典的“哲学家就餐”问题：26 位同学（线程）各自需要同时拿到左右两把“锁”（sem[UP(num)] 和 sem[DOWN(num)]），而每把锁都被相邻的同学共享。如果所有线程都先成功地执行了第一个 P（各自锁住了自己右边的那把信号量），然后一起去执行第二个 P，那么每个人都在等待自己左边那把被邻座持有的锁，所有线程互相等待、谁也拿不到第二把，形成循环等待，即死锁。官方给出的修复思路是“互斥锁加锁顺序规则”（让一部分线程交换加锁顺序）或限制同时抢锁的人数，也可以像 26 位同学那样安排一位同学反着拿。踩坑点：资源申请顺序不一致 + 循环等待是死锁的典型配方；把 P 的顺序统一（或引入层次）即可避免。","tags":["死锁","哲学家就餐","信号量","循环等待"],"options":null,"answer":["死锁","死锁（deadlock）","philosophers 就餐问题死锁"],"kp":"同步与信号量"},{"id":"f2020-31","source":"2020 期末","origin":"exam","lecture":26,"topic":"用加锁顺序规则消除死锁","type":"fill","difficulty":3,"stem":"针对上一题的“哲学家就餐”场景（26 位同学，UP(i)=(i+1)%26，DOWN(i)=(i-1+26)%26，sem[i] 初值均为 1），Eve 借助“互斥锁加锁顺序规则”给出如下代码。请补全 A、B、C、D 四处（均填序号）：① UP(num)  ② DOWN(num)  ③ num","code":"1. void *thread(void *i)\n2. {\n3.     int num = (int)i;\n4.     if (UP(num) < DOWN(num)) {\n5.         P(&sem[ A ]);\n6.         P(&sem[ B ]);\n7.     }\n8.     else {\n9.         P(&sem[ C ]);\n10.        P(&sem[ D ]);\n11.    }\n12.    /* verify identity */\n13.    V(&sem[UP(num)]);\n14.    V(&sem[DOWN(num)]);\n15. }","explanation":"死锁的根源是不同线程申请两把锁的顺序不一致。Eve 的做法是让所有线程都按“锁的编号从小到大”申请（全局统一的加锁顺序）：编号小的那一个先 P，编号大的后 P。当 UP(num) < DOWN(num) 时，先申请 UP(num)（A=①），再申请 DOWN(num)（B=②）；否则先申请 DOWN(num)（C=②），再申请 UP(num)（D=①）。这样每个线程的加锁顺序都与锁的全序一致，不可能出现“甲持 1 等 2、乙持 2 等 1”的环路，从而既无死锁也在同一时刻允许多位同学去验证（例如 0 号和其邻居之外的线程可并行），兼顾正确性与效率。官方答案即 A=①、B=②、C=②、D=①。踩坑点：锁顺序规则要求所有线程对同一组锁采用同一种全局顺序。","tags":["加锁顺序","死锁避免","信号量"],"options":null,"answer":["A=① UP(num)，B=② DOWN(num)，C=② DOWN(num)，D=① UP(num)","①②②①","A① B② C② D①"],"kp":"同步与信号量"},{"id":"f2020-32","source":"2020 期末","origin":"exam","lecture":26,"topic":"用二元信号量实现计数信号量","type":"fill","difficulty":2,"stem":"Alice 用二元信号量实现一个值可为任意非负整数的信号量，代码如下。请问 my_P 中 D、E 两处应填什么？（填序号）① P(&sem->mutex) ② P(&sem->zero) ③ V(&sem->mutex) ④ V(&sem->zero)","code":"typedef struct {\n    int value;\n    sem_t mutex;\n    sem_t zero;\n} my_sem_t;\n\nvoid my_sem_init(my_sem_t *sem, unsigned int value) {\n    sem->value = value;\n    Sem_init(&sem->mutex, 0, 1);   /* A */\n    Sem_init(&sem->zero, 0, 0);    /* B */\n}\n\nvoid my_P(my_sem_t *sem) {\n    P(&sem->mutex);\n    sem->value--;\n    if (sem->value < 0) {          /* C */\n        ____D____;\n        ____E____;\n    }\n    else\n        V(&sem->mutex);\n}\n\nvoid my_V(my_sem_t *sem) {\n    P(&sem->mutex);\n    sem->value++;\n    if (sem->value <= 0) {         /* F */\n        V(&sem->mutex);\n        V(&sem->zero);\n    }\n    else\n        V(&sem->mutex);\n}","explanation":"这里的 mutex 保护结构体中的 value 计数，zero 是一个“等待信号量”（初值 0，用于让无法获得资源的线程睡眠）。在 my_P 中，先把 value 减一，如果 value 降到了 0 以下，说明当前没有可用资源，本线程应当去睡眠等待，但睡眠之前必须先把 mutex 释放掉，否则其他线程连 my_V 都无法进入，会造成死锁：因此 D 必须是 ③ V(&sem->mutex)，随后 E 是 ② P(&sem->zero) 让自己挂起。相应地，my_V 中把 value 加一后若 value ≤ 0，说明还有线程在 zero 上等待，于是先 V(&sem->mutex)、再 V(&sem->zero) 唤醒一个等待者。顺序不能颠倒（先释放 mutex、再唤醒等待者），否则会出现“等待者被唤醒后又拿不到 mutex”甚至死锁。官方答案就是 D=③、E=②。踩坑点：睡眠之前必须先释放互斥锁；唤醒时先释放锁再 V 等待信号量。","tags":["信号量实现","条件变量","互斥","唤醒顺序"],"options":null,"answer":["D=③ V(&sem->mutex)，E=② P(&sem->zero)","③②","D③ E②"],"kp":"同步与信号量"},{"id":"f2021-31","source":"2021 期末","origin":"exam","lecture":26,"topic":"用 if 代替 while 等待条件（虚假唤醒）","type":"single","difficulty":3,"stem":"在“生产者-消费者”的第二种解法（用 mutex 配合 sem_waiting_producer/sem_waiting_consumer 模拟条件变量）中，如果把第 27 行和第 50 行的 while (items == BUF_SIZE) / while (items == 0) 换成 if，是否可能造成同步错误？","code":"static sem_t mutex;\nstatic sem_t sem_waiting_producer;\nstatic sem_t sem_waiting_consumer;\nstatic volatile int num_waiting_producer = 0;\nstatic volatile int num_waiting_consumer = 0;\n\nstatic void *producer(void *num) {\n    P(&mutex);\n    while (items == BUF_SIZE) {      /* 换成 if 会出错 */\n        num_waiting_producer++;\n        V(&mutex);\n        P(&sem_waiting_producer);\n        P(&mutex);\n    }\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items++;\n    if (num_waiting_consumer > 0) {\n        num_waiting_consumer--;\n        V(&sem_waiting_consumer);\n    }\n    V(&mutex);\n    return NULL;\n}\n\nstatic void *consumer(void *num) {\n    P(&mutex);\n    while (items == 0) {             /* 换成 if 会出错 */\n        num_waiting_consumer++;\n        V(&mutex);\n        P(&sem_waiting_consumer);\n        P(&mutex);\n    }\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items--;\n    if (num_waiting_producer > 0) {\n        num_waiting_producer--;\n        V(&sem_waiting_producer);\n    }\n    V(&mutex);\n    return NULL;\n}","explanation":"可能出错。这里用信号量模拟条件变量，被唤醒（P(&sem_waiting_producer) 返回）之后必须重新检查条件，因为从被唤醒到重新获得 mutex 之间，条件可能已经被别的线程改变：例如某生产者从 29 行的 P 中被唤醒后、还没拿到 mutex 就被打断，另一个线程抢先获得 mutex（26 行）并发现 items != BUF_SIZE，于是把这个空槽用掉了；等前一个生产者拿到 mutex 时，if 已经不再重新判断，它会直接越过循环进入临界区，在缓冲区已满的情况下执行 items++，从而破坏缓冲区容量约束（这正是“丢失的唤醒/虚假唤醒”问题）。用 while 则会在重新获得 mutex 后再次检查条件，若不满足就继续等待，因此是正确写法。故选 A。踩坑点：条件变量必须配 while，不能用 if——这是并发编程的经典铁律。","tags":["条件变量","虚假唤醒","while与if","生产者消费者"],"options":["可能","不可能"],"answer":0,"kp":"同步与信号量"},{"id":"f2021-43","source":"2021 期末","origin":"exam","lecture":26,"topic":"用信号量模拟条件变量的补全","type":"fill","difficulty":3,"stem":"下面是“生产者-消费者”问题的第二种解法（用 mutex 配合两个“等待信号量”模拟条件变量）。请补全 ①（21、22 行）、②（29 行）、③（30 行）三处（用选项字母回答）：选项 A. 0  B. 1  C. P(&sem_waiting_producer)  D. V(&mutex)。","code":"static sem_t mutex;\nstatic sem_t sem_waiting_producer;   /* Wait for empty slots */\nstatic sem_t sem_waiting_consumer;   /* Wait for available items */\nstatic volatile int num_waiting_producer = 0;\nstatic volatile int num_waiting_consumer = 0;\n\nstatic void sync_var_init() {\n    Sem_init(&mutex, 0, 1);\n    Sem_init(&sem_waiting_producer, 0, ①);   /* 21 行 */\n    Sem_init(&sem_waiting_consumer, 0, ①);   /* 22 行 */\n}\n\nstatic void *producer(void *num) {\n    P(&mutex);\n    while (items == BUF_SIZE) {\n        num_waiting_producer++;\n        ②;                                    /* 29 行 */\n        ③;                                    /* 30 行 */\n        P(&mutex);\n    }\n    /* Critical section begins */\n    Sleep(rand() % MAX_SLEEP_SEC);\n    items++;\n    /* Critical section ends */\n    if (num_waiting_consumer > 0) {\n        num_waiting_consumer--;\n        V(&sem_waiting_consumer);\n    }\n    V(&mutex);\n    return NULL;\n}","explanation":"① 两个 sem_waiting_* 是“休眠信号量”：线程只有在要等待时才去 P 它，因此它们的初值必须是 0（选项 A），这样 P 会立刻阻塞；释放方在发现有人等待时才 V 一次来唤醒对方（初值若为 1 就会失去阻塞语义）。原语顺序必须是“先释放 mutex、再阻塞等待”（② 填 V(&mutex) 即选项 D，③ 填 P(&sem_waiting_producer) 即选项 C）：因为线程准备睡觉时不能还占着互斥锁，否则唤醒它的线程无法进入临界区去 V 这个信号量，程序会死锁；而信号量的 V 操作不会丢失（值一定会加一），所以即使两个操作之间被打断也仍然正确。官方答案是 ①=A、②=D、③=C（ADC）。踩坑点：休眠信号量初值为 0；睡觉之前先放锁。","tags":["条件变量模拟","休眠信号量","互斥锁","生产者消费者"],"options":null,"answer":["①A（0）②D（V(&mutex)）③C（P(&sem_waiting_producer)）","ADC","①0 ②V(&mutex) ③P(&sem_waiting_producer)"],"kp":"同步与信号量"},{"id":"f2024-19","source":"2024 期末","origin":"exam","lecture":26,"topic":"写者优先的读者-写者实现导致读者饥饿","type":"single","difficulty":3,"stem":"北京大学南门外的小电影院只有两个影厅 A 和 B，一名经理兼任售票员，规定如下：影厅正在放映的电影自动续播，只有当最后一个观众主动离开该影厅时才结束放映；观众可选择两个影厅中任意一个正在放映的影片，买票后立即进入且不能换厅；两个影厅内的总观众人数不能超过 100 人，购票人数到达上限后购票通道立即关闭，直到有观众离开；若有推销商来找经理推销，经理立即关闭购票入口，新到的观众不能购票入场；经理每次只能与一名推销商会谈，后续到达的推销商需等待，经理与已经到达的所有推销商都会谈过后，影院才能重新开业接待观众。小 A 一眼看出这可以建模为读者-写者问题（影厅=临界资源，观众=读者，推销商=写者），并写出下列代码（空缺处已按正确答案填好）。在这个实现的逻辑下，观众有可能饥饿吗？","code":"#include \"csapp.h\"\n#define MaxAudienceCount 100\n\nint AudienceCount = 0;   // 影院的观众数\nint PromoterCount = 0;   // 推销商的数量\nsem_t MovieA = 1;\nsem_t MovieB = 1;\nsem_t Promote = 1;\nsem_t MaxAudience = MaxAudienceCount;\nsem_t AudienceMutex = 1;  // 变量 AudienceCount 的互斥锁\nsem_t PromoterMutex = 1;  // 变量 PromoterCount 的互斥锁\n\nAudienceA() {\n    while(1){\n        P(MaxAudience);\n        P(MovieA);\n        P(AudienceMutex);\n        AudienceCount++;\n        if (AudienceCount == 1){\n            P(Promote);\n        }\n        V(AudienceMutex);\n        V(MovieA);\n        // Watch the movie\n        P(AudienceMutex);\n        AudienceCount--;\n        if (AudienceCount == 0){\n            V(Promote);\n        }\n        V(AudienceMutex);\n        V(MaxAudience);\n    }\n}\n\nAudienceB() {\n    while(1){\n        P(MaxAudience);\n        P(MovieB);\n        P(AudienceMutex);\n        AudienceCount++;\n        if (AudienceCount == 1){\n            P(Promote);\n        }\n        V(AudienceMutex);\n        V(MovieB);\n        // Watch the movie\n        P(AudienceMutex);\n        AudienceCount--;\n        if (AudienceCount == 0){\n            V(Promote);\n        }\n        V(AudienceMutex);\n        V(MaxAudience);\n    }\n}\n\nPromoter() {\n    while(1){\n        P(PromoterMutex);\n        PromoterCount++;\n        if (PromoterCount == 1){\n            P(MovieA);\n            P(MovieB);\n        }\n        V(PromoterMutex);\n        P(Promote);\n        // Try to promote\n        V(Promote);\n        P(PromoterMutex);\n        PromoterCount--;\n        if (PromoterCount == 0){\n            V(MovieA);\n            V(MovieB);\n        }\n        V(PromoterMutex);\n    }\n}","explanation":"选 A（可能）。这是“写者（推销商）优先”的实现：推销商到达时 PromoterCount 由 0 变 1，立刻 P(MovieA)、P(MovieB) 把两个影厅全部“关掉”，此后新来的观众会阻塞在 P(MovieA)/P(MovieB) 上；只有当影院里最后一个观众离开（AudienceCount 减到 0）时才 V(Promote) 唤醒一位推销商，而推销商结束推销后只有在 PromoterCount 减为 0 时才 V(MovieA)、V(MovieB) 把影厅交还观众。因此只要推销商源源不断地到达（PromoterCount 一直没有回到 0），影厅信号量就长期不被释放，已经到达并等待入场的观众就可能一直进不去，即发生饥饿——这正是第二类读者-写者问题中“写者优先导致读者饥饿”的经典结论。B 错：P/V 只保证互斥与阻塞/唤醒，不保证按到达顺序服务，把“用信号量实现了互斥”误当成“天然公平”是常见误解。另有两点值得记住：若换成读者优先的实现，则会出现推销商饥饿；观众人数上限 MaxAudience 用信号量计数，保证总人数不超过 100。","tags":["读者-写者","饥饿","信号量","写者优先"],"options":["可能","不可能"],"answer":0,"kp":"同步与信号量"},{"id":"gen-c26-01","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"读者-写者问题的约束与两种偏好","type":"single","difficulty":1,"stem":"关于读者-写者问题，下列说法**错误**的是：","code":null,"explanation":"讲义“Readers-Writers Problem”“Variants of Readers-Writers”一页给出问题定义与两种变体：读者只需只读访问，写者需要读写访问；写者之间必须互斥，任意多个读者可以同时读。第一类问题偏向读者——没有写者获准写时读者不应被阻塞，且在等待写者之后到达的读者优先于该写者；第二类问题偏向写者——写者就绪就尽快写，写者之后到达的读者必须等待。讲义紧接着明确写道：**两类变体都可能出现饥饿**（starvation，即某个线程无限期等待）：第一类中连续不断的读者流会让写者永远等不到机会，第二类中连续的写者流会饿死读者。选项 B 用“P/V 是原子的”来论证不会饥饿是无效的——原子性只保证互斥与同步语义，不能保证公平调度；讲义还给出 FIFO 的 rwqueue 方案来保证按到达顺序服务，以缓解饥饿。","tags":["读者写者","饥饿","公平性"],"options":["读者只读取对象，写者修改对象；写者必须独占访问对象，而任意多个读者可以同时访问","两类变体都保证不会出现饥饿，因为信号量的 P/V 操作是原子的","第一类读者-写者问题偏向读者：只要写者尚未获得许可，读者就不应被阻塞；在等待写者之后到达的读者反而优先于该写者","第二类读者-写者问题偏向写者：一旦有写者就绪就尽快执行写操作；在写者之后到达的读者必须等待，即使该写者也在等待"],"answer":1,"kp":"同步与信号量"},{"id":"gen-c26-02","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"第一类读者-写者解法","type":"single","difficulty":2,"stem":"上述第一类读者-写者解法中 `readcnt` 初值为 0，`mutex` 与 `w` 初值均为 1。下列说法**正确**的是：","code":"int readcnt;    /* 初值 0  */\nsem_t mutex, w; /* 初值均为 1 */\n\nvoid reader(void)\n{\n    while (1) {\n        P(&mutex);\n        readcnt++;\n        if (readcnt == 1)   /* 第一个进入的读者 */\n            P(&w);\n        V(&mutex);\n\n        /* 读操作 */\n\n        P(&mutex);\n        readcnt--;\n        if (readcnt == 0)   /* 最后一个离开的读者 */\n            V(&w);\n        V(&mutex);\n    }\n}\n\nvoid writer(void)\n{\n    while (1) {\n        P(&w);\n        /* 写操作 */\n        V(&w);\n    }\n}","explanation":"讲义“Solution to First Readers-Writers Problem”一页的代码中，`mutex` 只用来保护共享计数器 `readcnt`（`P(&mutex); readcnt++; ... V(&mutex);`），而 `w` 才是读者与写者之间的互斥信号量：第一个读者（`readcnt == 1`）执行 `P(&w)` 代表“读者群体”取得独占许可，最后一个离开的读者（`readcnt == 0`）执行 `V(&w)` 释放它；写者则简单地 `P(&w) ... V(&w)`。因此只要还有读者在读，`w` 就为 0，写者会被挡住，而其他读者进入时 `readcnt` 递增、不会碰 `w`，于是可以并发读。选项 B 错在把 mutex 当成数据锁；选项 C 错在只有第一个读者碰 `w`（否则第二个读者会把自己也挡在 `P(&w)` 上，读者就无法并发了）；选项 D 错在互斥锁不会因为线程被换出而自动释放，读者会一直持有 mutex 直到执行 `V(&mutex)`，这正是临界区必须尽量短的原因。","tags":["读者写者","readcnt","mutex","w"],"options":["第一个进入的读者通过 `P(&w)` 抢到“写独占权”，最后一个离开的读者通过 `V(&w)` 释放它；只要还有读者在读，写者就阻塞在 `P(&w)` 上","`mutex` 保护的是被读写的数据对象本身，因此读者读数据时也必须持有 `mutex`","每个读者都会执行 `P(&w)`，因此最多只允许一个读者同时读","如果读者在 `if (readcnt == 1) P(&w);` 之前被调度器换出，`mutex` 会被自动释放，因此不会影响其他读者"],"answer":0,"kp":"同步与信号量"},{"id":"gen-c26-03","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"线程不安全的四类函数","type":"multi","difficulty":2,"stem":"按讲义对线程不安全函数的分类（第 1 类：不保护共享变量；第 2 类：跨多次调用保持状态；第 3 类：返回指向静态变量的指针；第 4 类：调用了线程不安全的函数），上面函数中**线程不安全**的是：","code":"/* f1 */\nint rand(void) {\n    static unsigned int next = 1;\n    next = next * 1103515245 + 12345;\n    return (unsigned int)(next / 65536) % 32768;\n}\n\n/* f2 */\nchar *itoa(int x) {\n    static char buf[11];\n    sprintf(buf, \"%d\", x);\n    return buf;\n}\n\n/* f3 */\nint rand_r(int *nextp) {\n    *nextp = *nextp * 1103515245 + 12345;\n    return (unsigned int)(*nextp / 65536) % 32768;\n}\n\n/* f4 */\nint count(void) {\n    P(&mutex);\n    cnt++;\n    V(&mutex);\n    return cnt;\n}","explanation":"`f1` 属于第 2 类：它用 `static unsigned int next` 在多次调用之间保存状态，两个线程并发调用会互相破坏对方的序列，讲义给出的修复办法是把状态作为参数传入，即 `f3` 的 `rand_r`。`f2` 属于第 3 类：它返回指向 `static char buf[11]` 的指针，两次调用会覆盖同一块缓冲区，调用者拿到的结果可能被另一个线程改写；讲义给出两种修复：让调用者传入结果地址（如 `lc_itoa(x, dest)`），或用“加锁并复制（lock-and-copy）”把结果复制到调用者自己的内存里（调用者随后要负责 free）。`f3` 是 `rand_r`，不访问任何共享变量，是可重入的，因而线程安全。`f4` 用初值为 1 的 mutex 把对共享变量 `cnt` 的访问包在 P/V 之间，属于讲义的第 1 类修复方式，也是线程安全的。注意“可重入函数”是“线程安全函数”的子集，它不需要任何同步操作。","tags":["线程安全","可重入","rand_r","静态变量"],"options":["`f1`","`f2`","`f3`","`f4`","四个函数都是线程安全的"],"answer":[0,1],"kp":"并发编程"},{"id":"gen-c26-04","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"死锁成因与按序加锁的预防","type":"single","difficulty":3,"stem":"上述程序中线程 0 按 `s0 → s1` 的顺序加锁，线程 1 按 `s1 → s0` 的顺序加锁。关于它是否可能死锁以及如何改正，下列说法**正确**的是：","code":"void *count(void *vargp)\n{\n    int i;\n    int id = (int) vargp;\n    for (i = 0; i < NITERS; i++) {\n        P(&mutex[id]); P(&mutex[1-id]);   /* 线程 0: s0→s1；线程 1: s1→s0 */\n        cnt++;\n        V(&mutex[id]); V(&mutex[1-id]);\n    }\n    return NULL;\n}\n\n/* 主线程 */\nSem_init(&mutex[0], 0, 1);\nSem_init(&mutex[1], 0, 1);\nPthread_create(&tid[0], NULL, count, (void *) 0);\nPthread_create(&tid[1], NULL, count, (void *) 1);","explanation":"讲义“A Worry: Deadlock”“Deadlocking With Semaphores”“Avoiding Deadlock”几页给出定义：进程死锁当且仅当它在等待一个永远不会成立的条件；典型场景是两个进程各需要资源 A、B，一个先拿到 A 等 B，另一个先拿到 B 等 A，于是永远互等。在进度图上，进入死锁区的轨迹最终都会到达死锁状态（等待 s0 或 s1 变成非零），而另一些轨迹“侥幸”擦过死锁区正常完成，所以讲义强调**死锁通常是不确定的（竞态）**——测试很难稳定复现。修复办法是按同一顺序获取共享资源：所有线程都先 `P(s0)` 再 `P(s1)`，禁止区不再交叉，任何轨迹都无法卡住；释放顺序则无关紧要（讲义明确说明“释放顺序无所谓”）。选项 B 误用原子性解释互斥；选项 C 把迭代次数与死锁混为一谈；选项 D 缩短临界区不能消除循环等待。","tags":["死锁","按序加锁","进度图","循环等待"],"options":["可能死锁：线程 0 持有 s0 等 s1，线程 1 持有 s1 等 s0，二者都在等待永远不会成立的条件；让所有线程按同一顺序（例如都先 s0 后 s1）加锁即可消除死锁","不会死锁，因为 `P` 与 `V` 是原子操作，两个线程的加锁序列总会被内核串行化","可能死锁，但只要把 `NITERS` 改大就一定能执行完，因为信号量不会永远保持为 0","可能死锁，唯一的办法是给 `cnt++` 再加一层锁，把临界区缩得更短"],"answer":0,"kp":"同步与信号量"},{"id":"gen-c26-05","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"线程池与预线程化并发服务器","type":"single","difficulty":3,"stem":"关于线程池（thread pool）与预线程化（prethreaded）并发服务器，下列说法**错误**的是：","code":null,"explanation":"预线程化服务器（CS:APP 12.5.5）把第 25 讲的 sbuf 生产者-消费者模型搬到了服务器上：主线程是生产者，反复 `Accept` 并把描述符插入共享缓冲区；预先创建的一组工作线程是消费者，从缓冲区取出描述符、`echo`/处理、`Close`，然后继续取下一个。共享缓冲区同时提供了同步：`slots` 满时主线程阻塞、`items` 为空时工作线程阻塞，因此不再需要“每个连接创建一个线程”的开销。选项 C 是讲义反复强调的坑：把主线程栈上 `connfd` 的地址交给线程会造成多个线程读到同一个位置（参数竞态），正确做法是在堆上分配一份参数或在缓冲区中按值传递，由消费者负责释放。选项 D 错：工作线程通常一启动就 `pthread_detach(pthread_self())` 变成 detached（第 24 讲“Issues With Thread-Based Servers”），终止时由内核自动回收；只有 joinable 线程才必须被 join，把线程池写成“必须全部 join”既不符合常用实现，也不是避免泄漏的唯一办法。","tags":["线程池","预线程化","sbuf","detached"],"options":["主线程反复 `Accept`，把得到的已连接描述符 `connfd` 放进一个共享的有界缓冲区（与 sbuf 相同的生产者-消费者结构），工作线程从缓冲区取出描述符并服务客户","该缓冲区同时承担同步职责：主线程在缓冲区满时阻塞，工作线程在缓冲区空时阻塞，从而不必为每个连接反复创建和销毁线程","由于描述符是共享数据，主线程不能把局部变量 `connfd` 的地址放进缓冲区，而应把描述符的值复制到堆上（例如先 `Malloc` 一块空间）再交给工作线程","线程池中的工作线程必须全部处于可连接（joinable）状态，主线程必须逐个 `pthread_join` 才能回收它们，否则一定造成内存泄漏"],"answer":3,"kp":"并发编程"},{"id":"gen-c26-06","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"可重入、线程安全与信号处理死锁","type":"judge","difficulty":3,"stem":"判断：可重入函数是线程安全函数的一个重要子集，它在被多个线程调用时不访问任何共享变量，因此不需要任何同步操作；把一个“跨调用保持状态”的第 2 类函数变成线程安全的唯一办法就是把它改成可重入的（例如把 `rand` 改成 `rand_r`）。此外，由于 `printf`、`fprintf`、`malloc` 等库函数用锁保护隐藏状态（输出缓冲区、空闲链表等），如果信号处理函数在库函数已持有内部锁时再次调用同一库函数，就会出现死锁——这是线程（对称并发）与信号处理（非对称并发）交互的典型陷阱。","code":null,"explanation":"讲义“Reentrant Functions”“Thread-Safe Library Functions”“Bad Thread / Signal Interactions”几页给出这些结论。可重入函数的定义是：被多个线程调用时不访问任何共享变量；它一定是线程安全的，但反过来不成立——线程安全函数可能靠同步操作保护共享状态，因此不可重入。讲义用图说明“可重入函数 ⊂ 线程安全函数 ⊂ 所有函数”。第 2 类不安全函数（依赖跨调用保持的静态状态）无法靠加锁变安全，因为加锁只能保证互斥，不能消除状态的相互干扰，唯一出路是消除静态状态（把状态作为参数传入），所以 `rand` 的可重入版本是 `rand_r`。库函数线程安全的实现方式正是“lock-and-copy”，`malloc`（空闲链表）、`printf`/`fprintf`/`puts`（输出缓冲区）都有隐藏状态与内部锁；信号处理是**非对称**并发，处理函数运行时主程序被挂起，若此时再申请同一把锁就形成自死锁，因此处理函数只能调用异步信号安全的函数。讲义还列出 `asctime`、`ctime`、`gethostbyname`、`localtime`、`rand` 等线程不安全函数及其 `_r` 版本。","tags":["可重入","线程安全","lock-and-copy","信号处理死锁"],"options":null,"answer":true,"kp":"并发编程"},{"id":"gen-c26-07","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"用信号量实现屏障（barrier）","type":"judge","difficulty":1,"stem":"判断：用信号量实现 n 个线程的屏障时，可以令保护计数器的 `mutex` 初值为 1、让等待信号量 `barrier` 的初值为 1（表示“屏障已就绪”）；每个线程到达时先 `P(&mutex); ++nthread; V(&mutex);` 再执行 `P(&barrier)`，而最后一个到达者只需执行一次 `V(&barrier)` 就能放行所有等待者，因为 V 操作会唤醒全部阻塞在 P 上的线程。","code":null,"explanation":"此题有两处错误，都与第 25 讲的信号量语义直接相关。第一，等待用的信号量初值必须是 **0** 而不是 1：它表达的条件是“最后一个线程尚未发出放行信号”，初值为 0 时执行 P 才会阻塞；若初值为 1，第一个到达者执行 P 会把 1 减到 0 并立即返回，屏障形同虚设。这与“互斥信号量初值 1（锁可用）、条件同步信号量初值 0（条件尚未成立）”的规律一致。第二，讲义明确规定 V 操作只是**恰好唤醒一个**阻塞在 P 上的线程（被唤醒者随后完成减 1），因此最后一个到达者要放行其余 n−1 个等待者，必须执行 n−1 次 V（或配合计数信号量与计数器实现广播效果），一次 V 只能放行一个线程。屏障的正确语义是：任何线程都不能越过屏障点，直到 n 个线程全部到达。","tags":["屏障","barrier","信号量初值","条件同步"],"options":null,"answer":false,"kp":"同步与信号量"},{"id":"gen-c26-08","source":"自编 · 第 26 讲","origin":"created","lecture":26,"topic":"死锁、活锁与饥饿","type":"single","difficulty":3,"stem":"关于死锁、活锁与饥饿，下列说法**错误**的是：","code":null,"explanation":"讲义“Deadlock, Livelock, Starvation”“Deadlock Visualized in Progress Graph”“Other Versions of Readers-Writers”“Managing Readers/Writers with FIFO”几页给出的定义是：死锁——一个或多个线程在等待永远不会成立的条件；活锁——线程不断改变状态，却永远留在死锁/活锁轨迹里（讲义给出活锁的进度图，状态在变但轨迹出不去）；饥饿——一个或多个线程暂时无法取得进展。死锁通常是不确定的：进入死锁区的轨迹会卡死，其他轨迹可能擦边而过。第一类读者-写者解法偏向读者，持续不断的读者流会让写者无限等待（饥饿），FIFO 的 rwqueue 按到达顺序服务请求以保证公平，`pthread_rwlock_t` 也提供 `rdlock`/`wrlock`/`unlock`。选项 D 的推理是错的：信号量不变量 s ≥ 0 只保证不会有两个线程同时进入临界区，**并不排除**某个线程被无限期推迟；系统整体推进（例如读者不断完成）与某个线程饥饿完全可以并存，这正是讲义对“公平性”的讨论重点。","tags":["死锁","活锁","饥饿","公平性"],"options":["死锁：一个或多个线程在等待永远不会成立的条件；活锁：一个或多个线程不断改变状态，却始终无法脱离死锁/活锁轨迹；饥饿：一个或多个线程暂时无法推进","死锁常常是不确定的（竞态）：进入进度图死锁区的轨迹最终都会卡死，而另一些轨迹可能“侥幸”擦过死锁区正常完成","第一类读者-写者解法中，如果读者流持续不断，写者可能被无限期阻塞；FIFO 的 rwqueue 方案则按请求到达顺序服务，以保证公平性","只要程序中所有信号量的初值都非负且 P/V 成对出现，就既不会出现活锁也不会出现饥饿，因为系统整体一定在推进"],"answer":3,"kp":"同步与信号量"}];</script>
<script>/* ==========================================================================

(function () {
  'use strict';

  var QUESTIONS = (window.__ICS_QUESTIONS__ || []).slice();
  var LECTURES = (window.__ICS_LECTURES__ || []).slice();

  /* ======================================================================
     1. 工具函数
     ====================================================================== */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var SYM = {
    '\\times': '×', '\\cdot': '·', '\\ast': '∗', '\\div': '÷',
    '\\le': '≤', '\\leq': '≤', '\\ge': '≥', '\\geq': '≥',
    '\\neq': '≠', '\\ne': '≠', '\\approx': '≈', '\\equiv': '≡',
    '\\infty': '∞', '\\pm': '±', '\\mp': '∓', '\\propto': '∝',
    '\\to': '→', '\\rightarrow': '→', '\\leftarrow': '←', '\\Rightarrow': '⇒',
    '\\dots': '…', '\\ldots': '…', '\\cdots': '⋯',
    '\\land': '∧', '\\wedge': '∧', '\\lor': '∨', '\\vee': '∨',
    '\\lnot': '¬', '\\neg': '¬', '\\oplus': '⊕', '\\otimes': '⊗',
    '\\sum': '∑', '\\prod': '∏', '\\int': '∫',
    '\\in': '∈', '\\notin': '∉', '\\subset': '⊂', '\\subseteq': '⊆',
    '\\cup': '∪', '\\cap': '∩', '\\emptyset': '∅', '\\forall': '∀', '\\exists': '∃',
    '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ', '\\delta': 'δ', '\\epsilon': 'ε',
    '\\theta': 'θ', '\\lambda': 'λ', '\\mu': 'μ', '\\pi': 'π', '\\rho': 'ρ',
    '\\sigma': 'σ', '\\tau': 'τ', '\\phi': 'φ', '\\varphi': 'φ', '\\omega': 'ω',
    '\\lceil': '⌈', '\\rceil': '⌉', '\\lfloor': '⌊', '\\rfloor': '⌋',
    '\\%': '%', '\\,': '\u2009', '\\;': '\u2009', '\\ ': ' ', '\\!': '', '\\quad': '\u2003'
  };
  var GREEK = /^\\(alpha|beta|gamma|delta|epsilon|theta|lambda|mu|pi|rho|sigma|tau|phi|varphi|omega|infty)$/;

  function readGroup(s, i) {
    var d = 0, j = i;
    for (; j < s.length; j++) {
      if (s[j] === '{') d++;
      else if (s[j] === '}') { d--; if (d === 0) return [s.slice(i + 1, j), j + 1]; }
    }
    return [s.slice(i + 1), s.length];
  }

  /** 极简 LaTeX 子集渲染（不依赖 KaTeX） */
  function mathHTML(s) {
    var out = '', i = 0;
    while (i < s.length) {
      var c = s[i];
      if (c === '\\') {
        var m = /^\\([a-zA-Z]+|.)/.exec(s.slice(i));
        if (m) {
          var name = '\\' + m[1], j;
          if (name === '\\frac' || name === '\\dfrac' || name === '\\tfrac') {
            var a = '', b = '';
            j = i + m[0].length;
            if (s[j] === '{') { var g1 = readGroup(s, j); a = g1[0]; j = g1[1]; }
            if (s[j] === '{') { var g2 = readGroup(s, j); b = g2[0]; j = g2[1]; }
            out += '<span class="mfrac"><span class="mnum">' + mathHTML(a) +
                   '</span><span class="mden">' + mathHTML(b) + '</span></span>';
            i = j; continue;
          }
          if (name === '\\sqrt') {
            j = i + m[0].length;
            var r = '';
            if (s[j] === '{') { var g3 = readGroup(s, j); r = g3[0]; j = g3[1]; }
            out += '<span class="msqrt">√<span class="mrad">' + mathHTML(r) + '</span></span>';
            i = j; continue;
          }
          if (name === '\\text' || name === '\\mathrm' || name === '\\operatorname' || name === '\\mathbf') {
            j = i + m[0].length;
            var t = '';
            if (s[j] === '{') { var g4 = readGroup(s, j); t = g4[0]; j = g4[1]; }
            out += '<span class="mop">' + t + '</span>';
            i = j; continue;
          }
          if (SYM[name] !== undefined) {
            out += GREEK.test(name) ? SYM[name] : '<span class="mop">' + SYM[name] + '</span>';
            i += m[0].length; continue;
          }
          out += '<span class="mop">' + esc(m[1]) + '</span>';
          i += m[0].length; continue;
        }
      }
      if (c === '^' || c === '_') {
        var j2 = i + 1, arg = '';
        if (s[j2] === '{') { var g5 = readGroup(s, j2); arg = g5[0]; j2 = g5[1]; }
        else { arg = s[j2] || ''; j2++; }
        out += c === '^' ? '<sup>' + mathHTML(arg) + '</sup>' : '<sub>' + mathHTML(arg) + '</sub>';
        i = j2; continue;
      }
      if (c === '{') { var g6 = readGroup(s, i); out += mathHTML(g6[0]); i = g6[1]; continue; }
      if (c === '}') { i++; continue; }
      out += c; i++;
    }
    return out;
  }

  /** 行内 Markdown：$公式$、`代码`、**粗体** */
  function rich(text) {
    if (text == null) return '';
    var s = esc(text);
    // 公式（先抽出，避免内部被 md 规则误伤）
    var chunks = [];
    s = s.replace(/\$\$([^$]+?)\$\$|\$([^$\n]+?)\$/g, function (_, a, b) {
      var tex = a != null ? a : b;
      chunks.push(mathHTML(tex));
      return '\u0000' + (chunks.length - 1) + '\u0000';
    });
    s = s.replace(/`([^`]+?)`/g, function (_, c) { return '<code class="inline">' + c + '</code>'; });
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\n{2,}/g, '</p><p>');
    s = s.replace(/\n/g, '<br>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, n) { return '<span class="math">' + chunks[+n] + '</span>'; });
    return s;
  }

  function esc4(s) { return String(s == null ? '' : s); }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function toast(msg, kind) {
    var host = $('#toastHost');
    var d = document.createElement('div');
    d.className = 'toast';
    var icon = kind === 'ok' ? '✅' : kind === 'bad' ? '❌' : kind === 'warn' ? '⚠️' : '💡';
    d.innerHTML = '<span>' + icon + '</span><span>' + esc(msg) + '</span>';
    host.appendChild(d);
    setTimeout(function () {
      d.style.transition = 'opacity .3s, transform .3s';
      d.style.opacity = '0'; d.style.transform = 'translateY(10px)';
      setTimeout(function () { d.remove(); }, 320);
    }, 2100);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ======================================================================
     2. 本地存储 / 学习数据
     ====================================================================== */

  var LSKEY = 'ics-quiz-data-v1';
  var DB = {
    wrong: {},      // qid -> {n: 错误次数, ts: 最近时间}
    star: {},       // qid -> 1
    notes: {},      // qid -> 笔记文本
    stat: {},       // qid -> {r: 对, w: 错, ts}
    papers: [],     // 考试记录
    settings: { theme: 'light', shuffleOptions: false, autoRemoveWrong: true, fontSize: 15 }
  };

  function loadDB() {
    try {
      var raw = localStorage.getItem(LSKEY);
      if (raw) {
        var o = JSON.parse(raw);
        DB.wrong = o.wrong || {}; DB.star = o.star || {};
        DB.notes = o.notes || {};
        DB.stat = o.stat || {}; DB.papers = o.papers || [];
        DB.settings = Object.assign(DB.settings, o.settings || {});
      }
    } catch (e) { /* ignore */ }
  }
  function saveDB() {
    try { localStorage.setItem(LSKEY, JSON.stringify(DB)); } catch (e) { }
  }

  function record(qid, right) {
    var st = DB.stat[qid] || (DB.stat[qid] = { r: 0, w: 0, ts: 0 });
    if (right) st.r++; else st.w++;
    st.ts = Date.now();
    if (right) {
      if (DB.settings.autoRemoveWrong && DB.wrong[qid]) delete DB.wrong[qid];
    } else {
      var w = DB.wrong[qid] || (DB.wrong[qid] = { n: 0, ts: 0 });
      w.n++; w.ts = Date.now();
    }
    saveDB();
  }

  function isAnswered(qid) { return !!DB.stat[qid] && (DB.stat[qid].r + DB.stat[qid].w) > 0; }
  function isRight(qid) { return !!DB.stat[qid] && DB.stat[qid].r > 0 && DB.stat[qid].w === 0; }
  function attempts(qid) { var s = DB.stat[qid]; return s ? s.r + s.w : 0; }
  function acc(qid) { var s = DB.stat[qid]; return s && (s.r + s.w) ? s.r / (s.r + s.w) : null; }

  /* ======================================================================
     3. 题库索引
     ====================================================================== */

  var LECMAP = {};
  LECTURES.forEach(function (l) { LECMAP[l.n] = l; });

  function lecTitle(n) { return LECMAP[n] ? LECMAP[n].title : ('第 ' + n + ' 讲'); }
  function lecEN(n) { return LECMAP[n] ? (LECMAP[n].en || '') : ''; }

  var TOPICS = {};
  var KPS = {};
  QUESTIONS.forEach(function (q) {
    q.topic = q.topic || '综合';
    q.kp = q.kp || '综合';
    q.tags = q.tags || [];
    if (!q.difficulty) q.difficulty = 2;
    (TOPICS[q.topic] = TOPICS[q.topic] || []).push(q);
    (KPS[q.kp] = KPS[q.kp] || []).push(q);
  });

  var SOURCES = {};
  QUESTIONS.forEach(function (q) { SOURCES[q.source] = (SOURCES[q.source] || 0) + 1; });

  var BY_ID = {};
  QUESTIONS.forEach(function (q) { BY_ID[q.id] = q; });

  var TYPE_NAME = { single: '单选题', multi: '多选题', judge: '判断题', fill: '填空题' };
  var DIFF_NAME = { 1: '基础', 2: '中等', 3: '困难' };

  /* ======================================================================
     4. 过滤 / 组卷
     ====================================================================== */

  var F = {
    lectures: null,   // null = 全部
    kps: null,
    topics: null,
    types: null,
    diffs: null,
    origin: 'all',
    source: null,
    search: '',
    onlyWrong: false,
    onlyStar: false,
    onlyNew: false
  };

  function resetFilters() {
    F.lectures = null; F.kps = null; F.topics = null; F.types = null; F.diffs = null;
    F.origin = 'all'; F.source = null; F.search = '';
    F.onlyWrong = false; F.onlyStar = false; F.onlyNew = false;
  }

  function inSet(set, v) { return !set || set.indexOf(v) >= 0; }

  function filterQuestions() {
    var kw = F.search.trim().toLowerCase();
    return QUESTIONS.filter(function (q) {
      if (!inSet(F.lectures, q.lecture)) return false;
      if (!inSet(F.kps, q.kp)) return false;
      if (!inSet(F.topics, q.topic)) return false;
      if (!inSet(F.types, q.type)) return false;
      if (!inSet(F.diffs, q.difficulty)) return false;
      if (F.origin !== 'all' && q.origin !== F.origin) return false;
      if (F.source && q.source !== F.source) return false;
      if (F.onlyWrong && !DB.wrong[q.id]) return false;
      if (F.onlyStar && !DB.star[q.id]) return false;
      if (F.onlyNew && attempts(q.id) > 0) return false;
      if (kw) {
        var hay = (q.stem + ' ' + (q.explanation || '') + ' ' + (q.topic || '') + ' ' +
                   (q.tags || []).join(' ') + ' ' + (q.source || '') + ' ' + (q.code || '')).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ======================================================================
     5. 作答判定
     ====================================================================== */

  function normFill(s) {
    return String(s == null ? '' : s)
      .trim().toLowerCase()
      .replace(/\s+/g, '')
      .replace(/^0x/, '')
      .replace(/%/g, '')          // 课程批卷规则：寄存器前不写 % 不扣分
      .replace(/[，。；：、]$/, '')
      .replace(/^['"]|['"]$/g, '');
  }

  function checkAnswer(q, picked) {
    if (q.type === 'single') return picked === q.answer;
    if (q.type === 'multi') {
      if (!Array.isArray(picked) || !Array.isArray(q.answer)) return false;
      if (picked.length !== q.answer.length) return false;
      var a = picked.slice().sort().join(','), b = q.answer.slice().sort().join(',');
      return a === b;
    }
    if (q.type === 'judge') return picked === q.answer;
    if (q.type === 'fill') {
      var n = normFill(picked);
      if (!n) return false;
      return (q.answer || []).some(function (ans) { return normFill(ans) === n; });
    }
    return false;
  }

  function answerText(q) {
    if (q.type === 'single') return 'ABCDEF'[q.answer] || String(q.answer);
    if (q.type === 'multi') return (q.answer || []).map(function (i) { return 'ABCDEF'[i]; }).join(' ');
    if (q.type === 'judge') return q.answer ? '正确' : '错误';
    if (q.type === 'fill') return (q.answer || [])[0] || '';
    return '';
  }

  /* ======================================================================
     6. 题目卡片渲染
     ====================================================================== */

  var LETTERS = 'ABCDEF';

  function optionsOrder(q) {
    var idx = q.options ? q.options.map(function (_, i) { return i; }) : [];
    if (DB.settings.shuffleOptions && (q.type === 'single' || q.type === 'multi')) return shuffle(idx);
    return idx;
  }

  /**
   * 渲染一道题
   * mode: 'practice' 立即反馈 | 'exam' 不反馈 | 'review' 直接显示答案
   */
  function renderQuestion(q, mode, opt) {
    opt = opt || {};
    var done = opt.state && opt.state.done;
    var picked = opt.state ? opt.state.picked : undefined;
    var order = opt.order || optionsOrder(q);
    var h = [];

    h.push('<div class="qmeta">');
    h.push('<span class="tag tag-accent" data-kp="' + q.lecture + '" style="cursor:pointer" title="点击查看该讲知识点">第 ' + q.lecture + ' 讲 · ' + esc(lecTitle(q.lecture)) + '</span>');
    h.push('<span class="tag tag-info" title="知识点分类">' + esc(q.kp) + '</span>');
    h.push('<span class="tag">' + esc(q.topic) + '</span>');
    h.push('<span class="tag">' + esc(TYPE_NAME[q.type] || q.type) + '</span>');
    h.push('<span class="tag tag-warn" title="难度">' + '★'.repeat(q.difficulty) + '☆'.repeat(3 - q.difficulty) + '</span>');
    h.push('<span class="tag">' + esc(q.source || '') + '</span>');
    if (q.origin === 'created') h.push('<span class="tag tag-ok">自编</span>');
    if (DB.wrong[q.id]) h.push('<span class="tag tag-bad">错过 ' + DB.wrong[q.id].n + ' 次</span>');
    h.push('<span class="spacer"></span>');
    if (opt.indexLabel) h.push('<span class="q-index">' + esc(opt.indexLabel) + '</span>');
    h.push('<button class="star-btn' + (DB.star[q.id] ? ' on' : '') + '" data-star="' + esc(q.id) + '" title="收藏">' +
           (DB.star[q.id] ? '★' : '☆') + '</button>');
    h.push('</div>');

    h.push('<div class="stem"><p>' + rich(q.stem) + '</p></div>');
    if (q.code) h.push('<pre class="code-block">' + esc(q.code) + '</pre>');

    if (q.type === 'single' || q.type === 'multi') {
      h.push('<div class="options" data-qid="' + esc(q.id) + '">');
      order.forEach(function (oi) {
        var cls = 'opt';
        var mark = '';
        var isPicked = q.type === 'multi'
          ? (Array.isArray(picked) && picked.indexOf(oi) >= 0)
          : picked === oi;
        var isAns = q.type === 'multi'
          ? (q.answer || []).indexOf(oi) >= 0
          : q.answer === oi;
        if (isPicked) cls += ' picked';
        if (done) {
          cls += ' locked';
          if (isAns) { cls += ' correct'; mark = '✓'; }
          else if (isPicked) { cls += ' wrong'; mark = '✕'; }
        }
        h.push('<button class="' + cls + '" data-opt="' + oi + '">' +
               '<span class="key">' + LETTERS[oi] + '</span>' +
               '<span class="txt">' + rich(q.options[oi]) + '</span>' +
               (mark ? '<span class="mark">' + mark + '</span>' : '') + '</button>');
      });
      h.push('</div>');
    } else if (q.type === 'judge') {
      h.push('<div class="options judge-row" data-qid="' + esc(q.id) + '">');
      [true, false].forEach(function (v) {
        var cls = 'opt';
        var isPicked = picked === v;
        var isAns = q.answer === v;
        var mark = '';
        if (isPicked) cls += ' picked';
        if (done) {
          cls += ' locked';
          if (isAns) { cls += ' correct'; mark = '✓'; }
          else if (isPicked) { cls += ' wrong'; mark = '✕'; }
        }
        h.push('<button class="' + cls + '" data-opt="' + (v ? 't' : 'f') + '" style="flex:1">' +
               '<span class="key">' + (v ? 'T' : 'F') + '</span>' +
               '<span class="txt">' + (v ? '正确' : '错误') + '</span>' +
               (mark ? '<span class="mark">' + mark + '</span>' : '') + '</button>');
      });
      h.push('</div>');
    } else if (q.type === 'fill') {
      h.push('<div class="fill-row">');
      h.push('<input type="text" class="fill-input" data-qid="' + esc(q.id) + '" placeholder="输入答案后回车或点击「提交」" value="' +
             esc(typeof picked === 'string' ? picked : '') + '"' + (done ? ' disabled' : '') + '>');
      if (!done) h.push('<button class="btn btn-primary" data-submit="' + esc(q.id) + '">提交</button>');
      h.push('</div>');
    }

    if (opt.showExplain) {
      var right = opt.state && opt.state.right;
      h.push('<div class="explain ' + (right ? 'acc' : 'rej') + '">');
      h.push('<div class="explain-head">' + (right ? '✅ 回答正确' : '❌ 回答错误') +
             '　<span style="font-weight:600;font-size:12.5px">正确答案：' + esc(answerText(q)) + '</span></div>');
      h.push('<div class="explain-body"><p>' + rich(q.explanation || '（暂无解析）') + '</p>');
      if (q.tags && q.tags.length) {
        h.push('<p style="margin-top:10px">' +
               q.tags.map(function (t) { return '<span class="tag" style="margin-right:5px">#' + esc(t) + '</span>'; }).join('') +
               '</p>');
      }
      h.push('</div>');
      h.push('</div>');
    } else if (mode === 'review') {
      h.push('<div class="explain acc">');
      h.push('<div class="explain-head">✅ 正确答案：' + esc(answerText(q)) + '</div>');
      h.push('<div class="explain-body"><p>' + rich(q.explanation || '（暂无解析）') + '</p>' +
             (q.tags && q.tags.length ? '<p>' + q.tags.map(function (t) {
               return '<span class="tag" style="margin-right:5px">#' + esc(t) + '</span>'; }).join('') + '</p>' : '') +
             '</div>');
      h.push('</div>');
    }
    if (mode !== 'exam') {
      h.push('<div class="note-box">' +
        '<div class="note-head">📝 我的笔记 <span style="font-weight:400;color:var(--text-3);font-size:11.5px">' +
        '（自动保存到本机浏览器）</span></div>' +
        '<textarea data-note="' + esc(q.id) + '" rows="2" placeholder="记下易错点、记忆口诀、关联知识点…">' +
        esc(DB.notes[q.id] || '') + '</textarea></div>');
    }
    return h.join('');
  }

  /* ======================================================================
     7. 视图：首页
     ====================================================================== */

  function viewHome() {

    var createdN = total - examN;

    var right = QUESTIONS.filter(function (q) { return isRight(q.id); }).length;

      { icon: '🔖', t: '收藏精练', d: Object.keys(DB.star).length ? ('复习 ' + Object.keys(DB.star).length + ' 道收藏题') : '用 ★ 收藏想反复看的题', act: 'start-star' },

  /* ======================================================================
     8. 视图：刷题
     ====================================================================== */

  var P = { pool: [], order: [], idx: 0, states: {}, ctxName: '' };

  function buildPool(opts) {
    opts = opts || {};
    var list;
    if (opts.onlyWrong) list = QUESTIONS.filter(function (q) { return DB.wrong[q.id]; });
    else if (opts.onlyStar) list = QUESTIONS.filter(function (q) { return DB.star[q.id]; });
    else list = filterQuestions();
    if (opts.shuffle) list = shuffle(list);
    return list;
  }

  function startPractice(opts) {
    opts = opts || {};
    if (opts.onlyWrong) { resetFilters(); F.onlyWrong = true; }
    if (opts.onlyStar) { resetFilters(); F.onlyStar = true; }
    if (opts.lecture != null) { resetFilters(); F.lectures = [opts.lecture]; }
    P.pool = buildPool(opts);
    P.order = P.pool.map(function (_, i) { return i; });
    P.idx = 0;
    P.states = {};
    P.ctxName = opts.name || '练习';
    go('practice');
    renderPractice();
    if (!P.pool.length) toast('没有符合条件的题目，试试放宽筛选条件', 'warn');
  }

    LECTURES.forEach(function (l) {

  function renderQArea() {
    var area = $('#qArea');
    if (!area) return;
    var pool = P.pool;
    var total = pool.length;
    $('#pProg').textContent = total ? (P.idx + 1) + ' / ' + total : '0 / 0';
    var doneN = pool.filter(function (q) { return P.states[q.id] && P.states[q.id].done; }).length;
    $('#pBar').style.width = total ? (doneN / total * 100) + '%' : '0%';

    if (!total) {
      area.innerHTML = '<div class="card empty"><div class="e-icon">🗂️</div><h3>没有符合条件的题目</h3>' +
        '<p>试试在左侧放宽筛选条件，或点击「重置全部筛选」。</p>' +
        '<button class="btn btn-primary" data-reset="1">重置筛选</button></div>';
      return;
    }
    if (P.idx >= total) P.idx = total - 1;
    var q = pool[P.idx];
    var st = P.states[q.id];
    if (!st) { st = P.states[q.id] = { picked: undefined, done: false, order: optionsOrder(q) }; }
    var h = [];
    h.push('<div class="card qcard">');
    h.push(renderQuestion(q, 'practice', {
      state: st,
      showExplain: !!st.done,
      indexLabel: '第 ' + (P.idx + 1) + ' 题',
      order: st.order
    }));
    h.push(buildQFoot(q, st));
    h.push('</div>');
    area.innerHTML = h.join('');
    bindQArea();
  }

  function practicePick(qid, val) {
    var q = BY_ID[qid];
    var st = P.states[qid] || (P.states[qid] = { picked: undefined, done: false });
    if (st.done) return;
    if (q.type === 'multi') {
      st.picked = Array.isArray(st.picked) ? st.picked.slice() : [];
      var k = st.picked.indexOf(val);
      if (k >= 0) st.picked.splice(k, 1); else st.picked.push(val);
      // 多选题：点击「提交」判定
      if (!st.order) st.order = optionsOrder(q);
      var area = $('#qArea');
      var qc = area.querySelector('.qcard');
      if (qc) {
        var html = renderQuestion(q, 'practice', { state: st, showExplain: false, order: st.order, indexLabel: '第 ' + (P.idx + 1) + ' 题' });
        qc.innerHTML = html + buildQFoot(q, st);
        bindQArea();
      }
      return;
    }
    st.order = st.order || optionsOrder(q);
    st.picked = val;
    st.done = true;
    st.right = checkAnswer(q, val);
    record(qid, st.right);
    toast(st.right ? '回答正确' : '回答错误，看看解析', st.right ? 'ok' : 'bad');
    renderQArea();
  }

  function practiceSubmitMulti(qid) {
    var q = BY_ID[qid];
    var st = P.states[qid];
    if (!st || st.done) return;
    if (!Array.isArray(st.picked) || !st.picked.length) { toast('请先选择至少一个选项', 'warn'); return; }
    st.done = true;
    st.right = checkAnswer(q, st.picked);
    record(qid, st.right);
    toast(st.right ? '回答正确' : '回答错误，看看解析', st.right ? 'ok' : 'bad');
    renderQArea();
  }

  var EXCFG = { from: 1, to: 26, origin: 'all', count: 20, min: 30, mix: 'lesson', shuffleOpt: false };

  function examCandidates() {
    return QUESTIONS.filter(function (q) {
      if (q.lecture < EXCFG.from || q.lecture > EXCFG.to) return false;
      if (EXCFG.origin !== 'all' && q.origin !== EXCFG.origin) return false;
      return true;
    });
  }

  function buildPaper() {
    var cand = examCandidates();
    if (!cand.length) return [];
    var n = Math.min(EXCFG.count, cand.length);
    if (EXCFG.mix === 'random') return shuffle(cand).slice(0, n);
    if (EXCFG.mix === 'hard') {
      var hard = shuffle(cand.filter(function (q) { return q.difficulty >= 2; }));
      var rest = shuffle(cand.filter(function (q) { return q.difficulty < 2; }));
      return hard.concat(rest).slice(0, n);
    }
    // 按讲次均衡
    var buckets = {};
    cand.forEach(function (q) { (buckets[q.lecture] = buckets[q.lecture] || []).push(q); });
    var keys = Object.keys(buckets).sort(function (a, b) { return a - b; });
    keys.forEach(function (k) { buckets[k] = shuffle(buckets[k]); });
    var out = [], cursor = {}, guard = 0;
    while (out.length < n && guard++ < n * 6) {
      var added = false;
      for (var i = 0; i < keys.length && out.length < n; i++) {
        var k = keys[i];
        cursor[k] = cursor[k] || 0;
        if (cursor[k] < buckets[k].length) {
          out.push(buckets[k][cursor[k]++]);
          added = true;
        }
      }
      if (!added) break;
    }
    return out.slice(0, n);
  }

  function startExam() {
    var paper = buildPaper();
    if (!paper.length) { toast('该范围内没有题目，请调整范围', 'warn'); return; }
    E = {
      paper: paper,
      idx: 0,
      answers: {},     // qid -> picked
      orders: {},
      submitted: false,
      startAt: Date.now(),
      limit: EXCFG.min * 60,
      left: EXCFG.min * 60
    };
    paper.forEach(function (q) {
      var base = q.options ? q.options.map(function (_, i) { return i; }) : [];
      E.orders[q.id] = (EXCFG.shuffleOpt && base.length) ? shuffle(base) : base;
    });

    go('examrun');
    renderExamRun();
    if (E.limit > 0) {
      clearInterval(examTimer);
      examTimer = setInterval(function () {
        if (!E || E.submitted) return;
        E.left--;
        var t = $('#examTimer');
        if (t) {
          t.textContent = fmtTime(E.left);
          t.className = 'exam-timer' + (E.left <= 60 ? ' danger' : E.left <= 300 ? ' warn' : '');
        }
        if (E.left <= 0) { clearInterval(examTimer); toast('时间到，自动交卷', 'warn'); submitExam(); }
      }, 1000);
    }
  }

  function bindExamRun() {
    var host = $('#examRunHost');
    $$('[data-opt]', host).forEach(function (b) {
      b.addEventListener('click', function () {
        var q = E.paper[E.idx];
        var raw = b.getAttribute('data-opt');
        var val = q.type === 'judge' ? (raw === 't') : parseInt(raw, 10);
        if (q.type === 'multi') {
          var cur = Array.isArray(E.answers[q.id]) ? E.answers[q.id].slice() : [];
          var k = cur.indexOf(val);
          if (k >= 0) cur.splice(k, 1); else cur.push(val);
          if (cur.length) E.answers[q.id] = cur; else delete E.answers[q.id];
        } else {
          E.answers[q.id] = val;
          setTimeout(function () { if (E.idx < E.paper.length - 1) { E.idx++; renderExamRun(); } }, 160);
          return;
        }
        renderExamRun();
      });
    });
    $$('.fill-input', host).forEach(function (inp) {
      inp.addEventListener('input', function () { E.answers[inp.getAttribute('data-qid')] = inp.value; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && E.idx < E.paper.length - 1) { E.idx++; renderExamRun(); } });
    });
    $$('[data-ex-next]', host).forEach(function (b) { b.addEventListener('click', function () { if (E.idx < E.paper.length - 1) { E.idx++; renderExamRun(); scrollTop(); } }); });
    $$('[data-ex-prev]', host).forEach(function (b) { b.addEventListener('click', function () { if (E.idx > 0) { E.idx--; renderExamRun(); scrollTop(); } }); });
    $$('[data-sheet]', host).forEach(function (b) { b.addEventListener('click', function () { E.idx = parseInt(b.getAttribute('data-sheet'), 10); renderExamRun(); scrollTop(); }); });
    var sb = $('#submitExam'); if (sb) sb.addEventListener('click', function () { confirmSubmit(); });
    var qb = $('#quitExam'); if (qb) qb.addEventListener('click', function () {
      openModal('退出考试？', '<p>当前作答进度将丢失，确定退出吗？</p>', [
        { t: '继续考试', cls: 'btn' }, { t: '退出', cls: 'btn btn-danger', act: 'quit-exam' }
      ]);
    });
  }

  function confirmSubmit() {
    var un = E.paper.length - Object.keys(E.answers).length;
    openModal('确认交卷？',
      '<p>共 ' + E.paper.length + ' 题，已作答 ' + Object.keys(E.answers).length + ' 题' +
      (un ? '，<b style="color:var(--bad)">还有 ' + un + ' 题未作答</b>' : '') + '。</p>',
      [{ t: '再检查一下', cls: 'btn' }, { t: '确认交卷', cls: 'btn btn-primary', act: 'do-submit' }]);
  }

  function submitExam() {
    if (!E || E.submitted) return;
    clearInterval(examTimer);
    E.submitted = true;
    var right = 0, byLec = {};
    E.paper.forEach(function (q) {
      var picked = E.answers[q.id];
      var ok = picked !== undefined && checkAnswer(q, picked);
      if (ok) right++;
      var L = byLec[q.lecture] || (byLec[q.lecture] = { n: 0, r: 0 });
      L.n++; if (ok) L.r++;
      record(q.id, ok);
    });
    E.right = right;
    E.byLec = byLec;
    E.dur = Math.round((Date.now() - E.startAt) / 1000);
    DB.papers.push({ ts: Date.now(), total: E.paper.length, right: right, dur: E.dur, byLec: byLec });
    if (DB.papers.length > 60) DB.papers = DB.papers.slice(-60);
    saveDB();
    go('examreport');
    renderExamReport();
  }

  function renderExamReport() {
    var host = $('#examReportHost');
    var total = E.paper.length, right = E.right;
    var pct = total ? right / total : 0;
    var score = Math.round(pct * 100);
    var R = 74, C = 2 * Math.PI * R;
    var color = score >= 85 ? 'var(--ok)' : score >= 60 ? 'var(--warn)' : 'var(--bad)';

    var h = [];
    h.push('<div class="card report-hero">');
    h.push('<div class="score-ring"><svg width="168" height="168">' +
           '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="var(--surface-3)" stroke-width="12"/>' +
           '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" ' +
           'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)) + '"/></svg>' +
           '<div class="val"><div class="num" style="color:' + color + '">' + score + '</div><div class="pct">分</div></div></div>');
    var lvl = score >= 90 ? '优秀，可以进考场了' : score >= 75 ? '良好，注意补上薄弱讲次' : score >= 60 ? '及格，建议回看错题解析' : '还需加练，从基础讲次重新过一遍';
    h.push('<h2 style="margin:0 0 6px;font-size:20px">' + right + ' / ' + total + ' 题正确　·　' + lvl + '</h2>');
    h.push('<p style="color:var(--text-3);margin:0">用时 ' + fmtTime(E.dur) + '　·　正确率 ' + Math.round(pct * 100) + '%</p>');
    h.push('<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
           '<button class="btn btn-primary" data-go="exam">再考一次</button>' +
           '<button class="btn" data-report="wrong-only">只看错题解析</button>' +
           '<button class="btn" data-report="all">逐题解析</button>' +
           '<button class="btn" data-go="stats">学习统计</button></div>');
    h.push('</div>');

    // 各讲次表现
    var keys = Object.keys(E.byLec).map(Number).sort(function (a, b) { return a - b; });
    if (keys.length > 1) {
      h.push('<div class="card" style="padding:20px 22px;margin-top:16px">');
      h.push('<div class="section-head" style="margin-bottom:14px"><h2 style="font-size:17px">各讲次得分</h2></div>');
      h.push('<div class="bar-chart">');
      keys.forEach(function (k) {
        var L = E.byLec[k];
        var p = L.r / L.n * 100;
        h.push('<div class="bar-row"><span class="bl">第 ' + k + ' 讲 ' + esc(lecTitle(k)) + '</span>' +
               '<span class="bar-track"><i class="bar-seg ' + (p >= 60 ? 'ok' : 'bad') + '" style="width:' + p + '%"></i></span>' +
               '<span class="bv">' + L.r + '/' + L.n + '</span></div>');
      });
      h.push('</div></div>');
    }

    h.push('<div class="section-head" style="margin-top:26px"><h2>逐题解析</h2>' +
           '<button class="btn btn-sm" data-report="all">显示全部</button>' +
           '<button class="btn btn-sm" data-report="wrong-only">只看错题</button></div>');
    h.push('<div id="reportList" class="qwrap"></div>');
    host.innerHTML = h.join('');
    renderReportList('all');
    bindCommon(host);
    $$('[data-report]', host).forEach(function (b) {
      b.addEventListener('click', function () { renderReportList(b.getAttribute('data-report')); });
    });
  }

  var reportFilter = 'all';
  function renderReportList(mode) {
    reportFilter = mode || reportFilter;
    var list = $('#reportList');
    if (!list) return;
    var h = [];
    E.paper.forEach(function (q, i) {
      var picked = E.answers[q.id];
      var ok = picked !== undefined && checkAnswer(q, picked);
      if (reportFilter === 'wrong-only' && ok) return;
      h.push('<div class="card qcard">');
      h.push(renderQuestion(q, 'practice', {
        state: { picked: picked, done: true, right: ok },
        showExplain: true,
        order: E.orders[q.id],
        indexLabel: '第 ' + (i + 1) + ' 题'
      }));
      h.push('</div>');
    });
    if (!h.length) h.push('<div class="card empty"><div class="e-icon">🎯</div><h3>全部答对，太棒了</h3><p>没有错题可以复盘。</p></div>');
    list.innerHTML = h.join('');
  }

  /* ======================================================================
     10. 视图：题库 / 错题本
     ====================================================================== */

  var BANK = { page: 1, per: 24, list: [], mode: 'bank' };

  function viewBank(mode) {
    BANK.mode = mode || 'bank';
    BANK.page = 1;
    return renderBankHTML(BANK.mode);
  }

  function renderBankHTML(mode) {
    var h = [];
    h.push('<div class="section-head"><h2>' + (mode === 'wrong' ? '错题本' : mode === 'star' ? '收藏夹' : '题库浏览') + '</h2>' +
           '<p id="bankCount"></p><span class="spacer"></span>' +
           (mode === 'wrong' ? '<button class="btn btn-sm" data-bank-act="practice-wrong">开始重做错题</button>' : '') +
           (mode === 'star' ? '<button class="btn btn-sm" data-bank-act="practice-star">开始刷收藏题</button>' : '') +
           (mode === 'wrong' ? '<button class="btn btn-sm btn-danger" data-bank-act="clear-wrong">清空错题本</button>' : '') +
           '</div>');
    h.push('<div class="bank-toolbar">');
    h.push('<div class="search"><input type="search" id="bankSearch" placeholder="搜索题干 / 知识点 / 标签 / 解析..."></div>');
    h.push('<select id="bankLec" style="width:190px"><option value="">全部讲次</option>' +
           LECTURES.map(function (l) {
             var n = QUESTIONS.filter(function (q) { return q.lecture === l.n; }).length;
             return n ? '<option value="' + l.n + '">第 ' + l.n + ' 讲 · ' + esc(l.title) + '（' + n + '）</option>' : '';
           }).join('') + '</select>');
    h.push('<select id="bankKp" style="width:170px"><option value="">全部知识点</option>' +
           Object.keys(KPS).sort(function (a, b) { return KPS[b].length - KPS[a].length; })
             .map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + '（' + KPS[k].length + '）</option>'; }).join('') +
           '</select>');
    h.push('<select id="bankType" style="width:130px"><option value="">全部题型</option>' +
           Object.keys(TYPE_NAME).map(function (t) { return '<option value="' + t + '">' + TYPE_NAME[t] + '</option>'; }).join('') +
           '</select>');
    h.push('<select id="bankOrigin" style="width:130px"><option value="all">全部来源</option>' +
           '<option value="exam">历年真题</option><option value="created">自编题</option></select>');
    h.push('<select id="bankSort" style="width:150px">' +
           '<option value="default">默认顺序</option><option value="diff-asc">难度：易→难</option>' +
           '<option value="diff-desc">难度：难→易</option><option value="lecture">按讲次排序</option>' +
           '<option value="unseen">未做过的优先</option><option value="wrong">错误最多的优先</option></select>');
    h.push('</div>');
    h.push('<div id="bankList" class="bank-grid"></div>');
    h.push('<div class="pager" id="bankPager"></div>');
    return h.join('');
  }

  function currentBankList() {
    var s = $('#bankSearch') ? $('#bankSearch').value : '';
    var lec = $('#bankLec') ? $('#bankLec').value : '';
    var kpv = $('#bankKp') ? $('#bankKp').value : '';
    var type = $('#bankType') ? $('#bankType').value : '';
    var org = $('#bankOrigin') ? $('#bankOrigin').value : 'all';
    var sort = $('#bankSort') ? $('#bankSort').value : 'default';
    var kw = s.trim().toLowerCase();
    var list = QUESTIONS.filter(function (q) {
      if (BANK.mode === 'wrong' && !DB.wrong[q.id]) return false;
      if (BANK.mode === 'star' && !DB.star[q.id]) return false;
      if (lec && q.lecture !== +lec) return false;
      if (kpv && q.kp !== kpv) return false;
      if (type && q.type !== type) return false;
      if (org !== 'all' && q.origin !== org) return false;
      if (kw) {
        var hay = (q.stem + ' ' + (q.explanation || '') + ' ' + q.topic + ' ' + (q.tags || []).join(' ') + ' ' +
                   (q.source || '') + ' ' + (q.code || '') + ' ' + (q.options || []).join(' ')).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
    if (sort === 'diff-asc') list.sort(function (a, b) { return a.difficulty - b.difficulty; });
    else if (sort === 'diff-desc') list.sort(function (a, b) { return b.difficulty - a.difficulty; });
    else if (sort === 'lecture') list.sort(function (a, b) { return a.lecture - b.lecture || a.id.localeCompare(b.id); });
    else if (sort === 'unseen') list.sort(function (a, b) { return attempts(a.id) - attempts(b.id); });
    else if (sort === 'wrong') list.sort(function (a, b) { return (DB.wrong[b.id] ? DB.wrong[b.id].n : 0) - (DB.wrong[a.id] ? DB.wrong[a.id].n : 0); });
    return list;
  }

  function paintBank() {
    var list = currentBankList();
    var host = $('#bankList');
    if (!host) return;
    var cnt = $('#bankCount');
    if (cnt) cnt.textContent = '共 ' + list.length + ' 道题';
    var pages = Math.max(1, Math.ceil(list.length / BANK.per));
    if (BANK.page > pages) BANK.page = pages;
    var slice = list.slice((BANK.page - 1) * BANK.per, BANK.page * BANK.per);

    if (!list.length) {
      host.innerHTML = '<div class="card empty" style="grid-column:1/-1"><div class="e-icon">🔍</div>' +
        '<h3>没有找到题目</h3><p>换个关键词，或清空筛选条件试试。</p></div>';
      $('#bankPager').innerHTML = '';
      return;
    }

    host.innerHTML = slice.map(function (q) {
      var status = '';
      if (DB.wrong[q.id]) status = '<span class="tag tag-bad">错 ' + DB.wrong[q.id].n + '</span>';
      else if (attempts(q.id)) status = '<span class="tag tag-ok">已掌握</span>';
      return '<div class="card bank-item" data-qid="' + esc(q.id) + '">' +
        '<div class="bi-foot">' +
        '<span class="tag tag-accent">第 ' + q.lecture + ' 讲</span>' +
        '<span class="tag tag-info">' + esc(q.kp) + '</span>' +
        '<span class="tag">' + esc(q.topic) + '</span>' +
        '<span class="tag">' + esc(TYPE_NAME[q.type]) + '</span>' +
        '<span class="tag tag-warn">' + '★'.repeat(q.difficulty) + '</span>' +
        status +
        (DB.star[q.id] ? '<span class="tag tag-warn">★</span>' : '') +
        '</div>' +
        '<div class="bi-stem">' + rich(q.stem) + '</div>' +
        '<div class="bi-foot" style="color:var(--text-3);font-size:12px">' +
        '<span>' + esc(q.source || '') + '</span>' +
        (q.origin === 'created' ? '<span class="tag tag-ok">自编</span>' : '') +
        '</div></div>';
    }).join('');

    // 分页
    var p = [];
    p.push('<button data-page="1"' + (BANK.page === 1 ? ' disabled' : '') + '>«</button>');
    p.push('<button data-page="' + (BANK.page - 1) + '"' + (BANK.page === 1 ? ' disabled' : '') + '>‹</button>');
    var from = Math.max(1, BANK.page - 2), to = Math.min(pages, from + 4);
    from = Math.max(1, to - 4);
    for (var i = from; i <= to; i++) p.push('<button data-page="' + i + '"' + (i === BANK.page ? ' class="on"' : '') + '>' + i + '</button>');
    p.push('<button data-page="' + (BANK.page + 1) + '"' + (BANK.page === pages ? ' disabled' : '') + '>›</button>');
    p.push('<button data-page="' + pages + '"' + (BANK.page === pages ? ' disabled' : '') + '>»</button>');
    p.push('<span style="margin-left:12px;color:var(--text-3);font-size:12.5px">第 ' + BANK.page + ' / ' + pages + ' 页</span>');
    $('#bankPager').innerHTML = p.join('');
  }

  function openBankDetail(qid) {
    var q = BY_ID[qid];

    box.innerHTML = renderQuestion(q, 'review', { order: q.options ? q.options.map(function (_, i) { return i; }) : [] });

      '<button class="btn btn-primary" data-detail-lec="' + q.lecture + '">刷这一讲</button>';
