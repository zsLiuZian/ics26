entation fault lab”，选 B。踩坑点：dup2 之后 O_APPEND 语义已不再属于这个描述符，且 dup2 改变的只是描述符表项。","tags":["dup2","O_APPEND","文件偏移"],"options":["ics segmentation fault tao","ics segmentation fault lab","ics taomentation fault lab","tao segmentation fault lab"],"answer":1,"kp":"系统级 I/O"},{"id":"f2018-06","source":"2018 期末","origin":"exam","lecture":18,"topic":"dup2 与文件描述符表/打开文件表","type":"single","difficulty":2,"stem":"假设某进程有且仅有五个已打开的文件描述符 0~4，分别引用了五个不同的文件，尝试运行以下代码，关于得到的结果，说法正确的是：","code":"dup2(3, 2);\ndup2(0, 3);\ndup2(1, 10);\ndup2(10, 4);\ndup2(4, 0);","explanation":"设最初 0~4 分别指向文件 A、B、C、D、E（各自对应一个打开文件表项）。逐步追踪：dup2(3,2) 让 fd2 指向 D 的打开文件表项，原来 fd2 的 C 被关闭（refcnt 归 0）；dup2(0,3) 让 fd3 指向 A；dup2(1,10) 新建描述符 10 指向 B；dup2(10,4) 让 fd4 也指向 B；dup2(4,0) 让 fd0 也指向 B。最终 fd0、fd1、fd4、fd10 都指向 B（同一个打开文件表项，refcnt=4），fd2 指向 D，fd3 指向 A，一共只涉及 3 个不同文件。因此 A 正确；B 错（应是三个不同文件）；dup2 允许 newfd 尚未打开（会自动分配），也允许 oldfd 有效而 newfd 已被占用，所以 C、D 描述的错误都没有发生——教材明确说明可以向未打开的描述符进行复制。踩坑点：dup2 是“把 newfd 变成 oldfd 的副本”，被覆盖的 newfd 会先被关闭。","tags":["dup2","文件描述符表","打开文件表"],"options":["运行正常完成，现在有四个描述符引用同一个文件","运行正常完成，现在进程共引用四个不同的文件","由于试图从一个未打开的描述符进行复制，发生错误","由于试图向一个未打开的描述符进行复制，发生错误"],"answer":0,"kp":"系统级 I/O"},{"id":"f2019-19","source":"2019 期末","origin":"exam","lecture":18,"topic":"open/dup/fork 与文件偏移量（f1.txt 的内容）","type":"fill","difficulty":3,"stem":"分析以下 C 程序（f1.txt 和 f2.txt 为已有且用户可读写的文件，初始内容为空）。程序正确运行后，文件 f1.txt 中的内容是什么？","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\nint main()\n{\n  int fd1, fd2, fd3, fd4;\n  int pid;\n  int c = 1;\n  fd1 = open(\"./f1.txt\", O_WRONLY, 0);\n  fd2 = open(\"./f1.txt\", O_WRONLY, 0);\n\n  printf(\"fd1=%d,fd2=%d;\\n\", fd1, fd2);      /* 第 18 行 */\n\n  write(fd1, \"EECSPKU\", 7);\n  write(fd2, \"2019\", 4);\n\n  close(fd2);\n\n  fd3 = open(\"./f2.txt\", O_WRONLY, 0);\n  fd4 = dup(fd3);\n\n  printf(\"fd3=%d,fd4=%d;\\n\", fd3, fd4);      /* 第 28 行 */\n\n  pid = fork();\n  if ((pid == 0)) {\n    c--;\n    write(fd3, \"PKU\", 3);\n    write(fd4, \"ICS\", 3);\n    printf(\"c= %d\\n\", c);\n  }\n  else {\n    waitpid(-1, NULL, 0);\n    c++;\n    write(fd3, \"2019\", 4);\n    close(fd3);\n    close(fd4);\n    printf(\"c= %d\\n\", c);\n  }\n\n  if (c)\n    write(fd1, \"CS\", 2);\n  c++;\n  close(fd1);\n  printf(\"c=%d\\n\", c);\n}","explanation":"对 f1.txt 打开两次会得到两个独立的打开文件表项，各自有独立的文件偏移量，初始都为 0：write(fd1,\"EECSPKU\",7) 把 7 个字节写到偏移 0 处，fd1 的偏移变成 7；write(fd2,\"2019\",4) 从偏移 0 写 4 个字节，覆盖掉前 4 个字符，文件变成 “2019PKU”。之后关闭 fd2。fork 之后子进程 c 变成 0（if (c) 不成立），父进程 c 变成 2（if (c) 成立），因此只有父进程会在 if (c) 分支里执行 write(fd1,\"CS\",2)：此时 fd1 的偏移仍是 7，正好接在 “2019PKU” 之后写入 “CS”，最终 f1.txt 内容为 “2019PKUCS”。注意 f1.txt 的写入共有三处（第 20、21 行和父进程的第 47 行），子进程不写 f1.txt。踩坑点：两次 open 得到两个独立偏移，后写的会覆盖；dup 出来的描述符则共享同一个偏移。","tags":["文件偏移量","open","fork","dup"],"options":null,"answer":["2019PKUCS","2019PKUCS（内容为 2019PKUCS）"],"kp":"异常与进程"},{"id":"f2019-20","source":"2019 期末","origin":"exam","lecture":18,"topic":"dup 共享文件偏移量（f2.txt 的内容）","type":"fill","difficulty":3,"stem":"分析以下 C 程序（f1.txt 和 f2.txt 为已有且用户可读写的文件，初始内容为空）。程序正确运行后，文件 f2.txt 中的内容是什么？","code":"fd3 = open(\"./f2.txt\", O_WRONLY, 0);\n  fd4 = dup(fd3);            /* fd3 与 fd4 指向同一个打开文件表项 */\n\n  pid = fork();\n  if ((pid == 0)) {\n    c--;\n    write(fd3, \"PKU\", 3);   /* 子进程：偏移 0 → 3 */\n    write(fd4, \"ICS\", 3);   /* 共享偏移：3 → 6 */\n    printf(\"c= %d\\n\", c);\n  }\n  else {\n    waitpid(-1, NULL, 0);\n    c++;\n    write(fd3, \"2019\", 4);  /* 父进程：偏移 6 → 10 */\n    close(fd3);\n    close(fd4);\n    printf(\"c= %d\\n\", c);\n  }","explanation":"dup(fd3) 产生的 fd4 与 fd3 共享同一个打开文件表项，因此也就共享同一个文件偏移量；fork 之后父子进程又共享 fork 时已经打开的这两个描述符（同样指向同一个打开文件表项），于是四个“写入者”实际用的是同一套偏移。父进程会 waitpid 等子进程先结束，所以子进程先写：write(fd3,\"PKU\",3) 在偏移 0 写入，偏移变为 3；write(fd4,\"ICS\",3) 接着在偏移 3 写入，偏移变为 6。子进程退出后父进程 write(fd3,\"2019\",4) 从偏移 6 继续写，得到 “PKUICS2019”。对比上一题：两次独立的 open 各自有偏移（覆盖式写入），而 dup/fork 共享偏移（接续式写入），这是本题的核心考点。踩坑点：fork 会让父子进程共享 fork 时已打开的文件表项，文件偏移是“打开文件表”的属性而不是“描述符表”的属性。","tags":["dup","文件偏移量","打开文件表","fork"],"options":null,"answer":["PKUICS2019","PKUICS2019（内容为 PKUICS2019）"],"kp":"异常与进程"},{"id":"f2020-29","source":"2020 期末","origin":"exam","lecture":18,"topic":"fork/dup/open 与输出行数","type":"fill","difficulty":3,"stem":"C 语言中的代码如下，当 fname 文件内容为 abcde 时，这段代码的打印结果为多少行？（不考虑出错的情况）","code":"int counter = 0;\n\nvoid handler(int sig) {\n  counter++;\n}\n\nint main(int argc, char *argv[])\n{\n  int fd1, fd2, fd3;\n  char c1, c2, c3;\n  char *fname = argv[1];\n  int parent;\n\n  signal(SIGUSR1, handler);\n\n  fd1 = open(fname, O_RDONLY);\n  read(fd1, &c1, 1);\n  parent = getpid();\n  if (fork()) {\n    wait();\n    fd2 = open(fname, O_RDONLY);\n  } else {\n    kill(parent, SIGUSR1);\n    fd2 = dup(fd1);\n  }\n  read(fd2, &c2, 1);\n\n  parent = getpid();\n  if (fork()) {\n    wait();\n    fd3 = open(fname, O_RDONLY);\n  } else {\n    kill(parent, SIGUSR1);\n    fd3 = dup(fd2);\n  }\n\n  read(fd3, &c3, 1);\n  printf(\"%c %c %c %d\\n\", c1, c2, c3, counter);\n  return 0;\n}\n/* 文件 fname 的内容为：abcde */","explanation":"程序中有两次 fork，每次 fork 都使进程数翻倍，因此最终一共有 1 × 2 × 2 = 4 个进程（父进程、它的两个直接子进程、以及第一个子进程再 fork 出的孙进程），每个进程都在最后执行一次 printf，所以打印结果为 4 行。要点在于：① 父进程分支用 open 重新打开文件，文件偏移回到 0，读到的都是 'a'；子进程分支用 dup 复制已有描述符，与原有描述符共享文件偏移，因此读到的是接续的 'b'、'c' 等字符；② 父进程在 fork 后都先 wait，所以行的先后顺序必然是“孙、子（第一个子进程）、第二个子进程、父进程”；③ counter 由各进程收到的 SIGUSR1 次数决定（每个子进程会 kill 自己的父进程一次），因此四个进程打印的 counter 依次为 0、1、0、2。踩坑点：open 产生新的偏移、dup 共享偏移；fork 后父子进程各自独立执行余下代码。","tags":["fork","dup","文件偏移","open","信号"],"options":null,"answer":["4","4 行"],"kp":"异常与进程"},{"id":"f2021-13","source":"2021 期末","origin":"exam","lecture":18,"topic":"系统级 I/O：描述符、异步信号安全与 RIO","type":"single","difficulty":1,"stem":"下列关于系统 I/O 的说法中，正确的是：","code":null,"explanation":"B 正确：read 和 write 都是异步信号安全的函数（教材明确把它们列入可在信号处理程序中调用的白名单），因此可以在信号处理函数中使用，这也是信号处理程序中不使用 printf 而改用 write 的原因。A 错：0、1、2 只是默认打开的描述符，shell 完全可以通过重定向把它们替换成别的文件，程序自己也可以用 dup2 把 0/1/2 重定向到其他文件，所以“始终不能使用”不成立。C 错：RIO 包中带缓冲与不带缓冲的函数不能交叉混用（例如先用 rio_readlineb 再用 rio_readn 会破坏缓冲区状态），教材特别提醒过这一点。D 错：两次 open 会创建两个互相独立的打开文件表项（各自有独立的文件偏移和 refcnt=1），refcnt 只在 dup/fork 共享同一个打开文件表项时才增加。踩坑点：dup/fork 共享文件表项，open 不共享。","tags":["系统级I/O","异步信号安全","RIO","refcnt"],"options":["Linux shell 创建的每个进程开始时都有三个打开的文件：标准输入（文件描述符为 0）、标准输出（文件描述符为 1）、标准错误（文件描述符为 2），这使得程序始终不能使用保留的描述符 0、1、2 读写其他文件。","Unix I/O 的 read/write 函数是异步信号安全的，故可以在信号处理函数中使用。","RIO 函数包的健壮性保证了对于同一个文件描述符，任意顺序调用 RIO 包中的任意函数不会造成问题。","使用 int fd1 = open(\"ICS.txt\", O_RDWR); 打开 ICS.txt 文件后，再用 int fd2 = open(\"ICS.txt\", O_RDWR); 再次打开文件，会使得 fd1 对应的打开文件表中的引用计数 refcnt 加一。"],"answer":1,"kp":"系统级 I/O"},{"id":"f2021-14","source":"2021 期末","origin":"exam","lecture":18,"topic":"O_APPEND、O_TRUNC 与多个打开文件表项的偏移","type":"single","difficulty":3,"stem":"考虑以下代码，假设 ICS.txt 中的初始内容为 \"ICS!!!ics!!!\"，且所有系统调用均成功，则这段代码执行结束后，ICS.txt 的内容为：","code":"int fd = open(\"ICS.txt\", O_RDWR | O_CREAT | O_TRUNC, S_IRUSR | S_IWUSR);\nfor (int i = 0; i < 2; ++i) {\n    int fd1 = open(\"ICS.txt\", O_RDWR | O_APPEND);\n    int fd2 = open(\"ICS.txt\", O_RDWR);\n    write(fd2, \"!!!!!!\", 6);\n    write(fd1, \"ICS\", 3);\n    write(fd, \"ics\", 3);\n}","explanation":"关键在于三个描述符各自独立的文件偏移量和 O_APPEND 的语义。O_TRUNC 使文件一开始被清空；fd 打开后偏移为 0 且从未改变（每次 write(fd,\"ics\",3) 都写在偏移 0~2，之后偏移变为 3）。第 1 轮：fd1 以 O_APPEND 打开（每次写都追加到文件末尾），fd2 以普通 O_RDWR 打开、偏移 0；write(fd2,\"!!!!!!\",6) 在偏移 0 写 6 个 '!'，文件变为 \"!!!!!!\"；write(fd1,\"ICS\",3) 追加到末尾，得到 \"!!!!!!ICS\"；write(fd,\"ics\",3) 在 fd 的偏移 0 处写入，把前 3 个 '!' 覆盖成 \"ics\"，得到 \"ics!!!ICS\"。第 2 轮：fd2 重新打开、偏移回到 0，写 6 个 '!' 覆盖前 6 个字节，得到 \"!!!!!!ICS\"；fd1 以 O_APPEND 追加 \"ICS\"，得到 \"!!!!!!ICSICS\"；fd 的偏移仍是 3，写入 \"ics\" 覆盖第 3~5 字节，最终为 \"!!!icsICSICS\"，故选 D。踩坑点：O_APPEND 的写总是到文件末尾，而普通 write 用的是该描述符自己的偏移；同一个文件被 open 多次就得到多个互不影响的偏移。","tags":["O_APPEND","文件偏移","open","write"],"options":["ICSics","!!!icsICS","!!!icsics!!!ICSICS","!!!icsICSICS"],"answer":3,"kp":"系统级 I/O"},{"id":"f2024-08","source":"2024 期末","origin":"exam","lecture":18,"topic":"系统级 I/O：缓冲、SIGKILL 与 fork 复制缓冲区","type":"single","difficulty":2,"stem":"在 Ubuntu Linux 24.04 环境中，关于系统级 IO，下列说法正确的是：","code":null,"explanation":"A 错：fprintf 的返回值是写入用户态缓冲区的字节数，并不代表数据已经落盘；SIGKILL 不能被捕获或忽略，进程被立即杀死，用户态缓冲区里尚未刷新（fflush/缓冲区满/正常退出）的内容会丢失，所以再打开文件不一定能看到写入内容。B 错：fprintf 是线程安全的，FILE 结构内部有锁，同一进程内多线程并发调用不会使程序崩溃；可能出现的问题是若两个调用操作同一个 FILE*，最终文件中各次输出的先后次序不确定。C 对（答案）：read/write 这类慢速系统调用可能让进程阻塞很久，标准 I/O 库用缓冲区把多次小数据合并成较少的 read/write 调用，减少陷入内核的次数，从而提高效率。D 错：fork 会复制父进程标准 I/O 缓冲区的内容，子进程的缓冲区并不总是空的；如果父进程此前用 printf 输出过且没有刷新，父子进程缓冲区里都有同样的待写数据，因此会出现“输出重复两次”的经典现象（注意 COW 只是在任一方真正修改缓冲区时才复制物理页）。","tags":["标准IO缓冲","SIGKILL","写不足","fork复制缓冲区"],"options":["在未进行特殊设置和额外操作的情况下，某进程先调用了 fprintf() 函数向某文件写入数据，且返回值恰为传入数据字节数。若向该进程发送 SIGKILL 信号终止进程，再打开该文件，一定能看到该进程写入的内容。","同一进程内的多个线程不加同步地调用 fprintf() 会导致程序崩溃。","由于慢速系统调用 read() 和 write() 会潜在地阻塞进程一段较长时间，高级 I/O 函数使用缓冲区来减少对 read() 和 write() 的调用。","无论父进程的标准 I/O 缓冲区——例如 printf() 函数的缓冲区是否为空，执行 fork() 创建的子进程的缓冲区总是为空。"],"answer":2,"kp":"系统级 I/O"},{"id":"f2024-28","source":"2024 期末","origin":"exam","lecture":18,"topic":"open/dup/dup2/fork 与共享文件偏移","type":"fill","difficulty":3,"stem":"分析下面这段代码的行为，假设 file.txt 文件存在（初始内容为空），且不需要考虑 open() 未能正常打开文件的情况。运行这段代码后，file.txt 文件的内容是什么？（按字符原样写出）","code":"#include <csapp.h>\n\nint main(){\n    int fd[3];\n    fd[0] = open(\"./file.txt\", O_RDWR | O_TRUNC, 0);\n    fd[1] = open(\"./file.txt\", O_RDWR | O_TRUNC, 0);\n    write(fd[0], \"Harry\", 5);\n\n    if (fork() == 0) {\n        dup2(fd[0], fd[1]);\n        write(fd[1], \"Voldemort\", 9);\n        fd[2] = open(\"./file.txt\", O_RDWR, 0);\n        printf(\"%d\\n\", fd[2]);\n        exit(0);\n    }\n    wait(NULL);\n\n    fd[1] = dup(fd[0]);\n    write(fd[0], \"Hermione\", 8);\n    write(fd[1], \"Ron\", 3);\n\n    fd[2] = open(\"./file.txt\", O_RDWR, 0);\n    printf(\"%d\\n\", fd[2]);\n}","explanation":"所有 open/dup/dup2/fork 得到的描述符都指向同一个文件，所以各次 write 的内容按写入顺序落在 file.txt 中，关键看每次写时的文件偏移。① fd[0]=3、fd[1]=4 分别 open 同一文件（第二次 O_TRUNC 时文件已经是空的），二者各自有独立的打开文件描述与偏移；write(fd[0],\"Harry\",5) 后文件为 Harry，fd[0] 的偏移为 5。② 子进程执行 dup2(fd[0],fd[1])，使子进程的 fd[1] 与 fd[0] 指向同一个打开文件描述、共享偏移 5，write(fd[1],\"Voldemort\",9) 从偏移 5 开始写，文件成为 HarryVoldemort，共享偏移变成 14。③ 回到父进程：父进程的 fd[1] 仍然是原来的 4（子进程的 dup2 只改子进程的打开文件表），从未写过；父进程执行 fd[1]=dup(fd[0])，dup 返回最小可用的描述符 5（3、4 都还占用着，4 对应的文件描述虽然写不到但并没有关闭），它同样与 fd[0] 共享偏移 14；write(fd[0],\"Hermione\",8) 写到偏移 14，文件成为 HarryVoldemortHermione，偏移 22；write(fd[1],\"Ron\",3) 写到偏移 22，得到 HarryVoldemortHermioneRon。④ 终端上两行输出分别是子进程的 fd[2]=5 和父进程最后 open 得到的 fd[2]=6。常见错误：以为 dup2 会新建文件或修改父进程的描述符表；以为 dup 会新建文件（它只复制描述符、共享偏移）；忘记 dup2/dup 之后两个描述符共享同一文件偏移。","tags":["dup2","dup","共享文件偏移","fork","文件描述符分配"],"options":null,"answer":["HarryVoldemortHermioneRon"],"kp":"系统级 I/O"},{"id":"gen-c18-01","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"描述符表、打开文件表与 v-node 表","type":"single","difficulty":1,"stem":"关于内核表示打开文件的三级结构（描述符表 / 打开文件表 / v-node 表），下列说法正确的是：","code":null,"explanation":"讲义第 18 讲「How the Unix Kernel Represents Open Files」给出三级结构：**描述符表**每个进程一份，每个表项指向打开文件表中的一个表项；**打开文件表**由所有进程共享，表项里保存文件位置（file position）、引用计数 refcnt 和指向 v-node 的指针；**v-node 表**也由所有进程共享，保存 `stat` 结构里的信息（文件大小、类型、访问权限等）。图的注释特别写着「File pos is maintained per open file」，即文件位置属于打开文件表项，所以两次 `open` 同一文件得到两个**不同的**打开文件表项、各有自己的位置（p.22），A 对。B 错：dup2 让两个描述符指向同一个打开文件表项，因此共享位置（p.25 的图 a→b）。C 错：描述符表是 per-process 的，fork 会复制描述符表、但打开文件表项的 refcnt 加一，所以父子共享位置而不共享描述符表。D 错：v-node 表是全局共享的。","tags":["文件描述符表","打开文件表","v-node","文件位置"],"options":["描述符表每个进程一份；打开文件表与 v-node 表由所有进程共享；文件位置（file position）保存在打开文件表项中，所以两次 `open` 同一文件会得到两个各自独立的文件位置","文件位置保存在描述符表中，因此 `dup2` 之后两个描述符各有一个独立的位置","描述符表由所有进程共享，因此父子进程的 fd 表是同一份","v-node 表是每个进程一份，其中保存文件的访问权限与大小"],"answer":0,"kp":"系统级 I/O"},{"id":"gen-c18-02","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"标准描述符与 open/read 的返回值","type":"single","difficulty":1,"stem":"关于文件描述符与 `open`/`read`/`write` 的返回值，下列说法正确的是：","code":null,"explanation":"讲义第 18 讲「Opening Files」说明：`open` 返回一个小的整数文件描述符，`fd == -1` 表示出错；每个由 Linux shell 创建的进程一开始就有三个打开的文件，分别是 0 标准输入、1 标准输出、2 标准错误。所以 D 对、A 把顺序说错。B 错：出错统一返回 -1 并设置 `errno`（讲义 p.32 的「硬性规则」要求检查每个系统级函数的返回状态，只有少数返回 void 的函数例外）。C 错：`read`/`write` 的返回类型是**有符号**的 `ssize_t`（p.13 明确写「Return type ssize_t is signed integer」），`nbytes < 0` 表示出错，而 `nbytes < sizeof(buf)` 只是短计数、不是错误。顺带记住：`open` 返回的「最小可用描述符」特性正是 shell 实现重定向时 `dup2(4,1)` 能生效的前提。","tags":["文件描述符","open","ssize_t","errno"],"options":["0、1、2 依次对应 stdout、stderr、stdin","`open` 失败时返回 0，`read` 失败时返回 1","`read` 的返回类型是无符号的 `size_t`，因此不可能是负数","每个进程启动时已有 0、1、2 三个描述符（stdin、stdout、stderr）；`open` 返回当前最小可用的描述符，返回 -1 表示出错"],"answer":3,"kp":"系统级 I/O"},{"id":"gen-c18-03","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"dup2 与文件位置的共享","type":"single","difficulty":2,"stem":"文件内容为 `abcde`。下面程序输出的 `c1`、`c2`、`c3` 依次是：","code":"#include \"csapp.h\"\n\nint main(int argc, char *argv[])\n{\n    int fd1, fd2, fd3;\n    char c1, c2, c3;\n    char *fname = argv[1];\n\n    fd1 = Open(fname, O_RDONLY, 0);\n    fd2 = Open(fname, O_RDONLY, 0);\n    fd3 = Open(fname, O_RDONLY, 0);\n    Dup2(fd2, fd3);\n    Read(fd1, &c1, 1);\n    Read(fd2, &c2, 1);\n    Read(fd3, &c3, 1);\n    printf(\"c1 = %c, c2 = %c, c3 = %c\\n\", c1, c2, c3);\n    return 0;\n}","explanation":"三次 `Open` 各产生一个独立的打开文件表项，各自的文件位置从 0 开始（讲义 p.22：两个描述符通过两个不同的打开文件表项共享同一个磁盘文件）。`Dup2(fd2, fd3)` 把描述符 3 的表项改成指向 fd2 的表项（原来的第三个打开文件表项引用计数降为 0 而被关闭），于是 fd2 与 fd3 共享同一个文件位置（p.25 的 before/after 图）。执行顺序：`Read(fd1)` 从自己的位置 0 读走 `a`，fd1 位置变 1；`Read(fd2)` 从它自己的位置 0 读走 `a`，fd2/fd3 共享的位置变 1；`Read(fd3)` 接着从这个共享位置 1 读出 `b`。所以输出 `c1 = a, c2 = a, c3 = b`，C 对。D 是误以为 dup2 之后 fd2、fd3 各自独立（或以为 dup2 复制了位置）；A 是误以为三次 open 共享位置；B 是把描述符编号与读到的字符对应起来（误以为第三个描述符就会读到第三个字符）。","tags":["dup2","打开文件表项","文件位置共享"],"options":["a、b、c","a、a、c","a、a、b","a、a、a"],"answer":2,"kp":"系统级 I/O"},{"id":"gen-c18-04","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"短计数（short count）","type":"single","difficulty":1,"stem":"关于短计数（short count，即返回值小于请求的字节数），下列说法正确的是：","code":null,"explanation":"讲义第 18 讲「On Short Counts」把情况列得很清楚：可能出现短计数的场合是——读到文件末尾（EOF）、从终端读文本行、读写网络套接字；**不会**出现短计数的场合是——从磁盘文件读（除 EOF 外）、向磁盘文件写。所以 A 对。B 错：短计数不是错误，只有返回负值才是错误，讲义给的编程建议就是「Best practice is to always allow for short counts」。C 错：读和写都可能短计数，例如 `write` 到套接字时内核缓冲区满。D 错：RIO 的设计目标之一就是消除短计数——`rio_readn` 只在遇到 EOF 时返回短计数，`rio_writen` **从不**返回短计数（p.43）。也正因如此，讲义提醒不要在同一个描述符上把 `rio_readn` 与 `rio_readlineb`/`rio_readnb` 混用，因为前者不带内部缓冲。","tags":["短计数","EOF","套接字","RIO"],"options":["读到 EOF、从终端读文本行、读写网络套接字时都可能出现短计数；而读写磁盘文件（除 EOF 外）不会出现短计数","只要 `read` 的返回值小于请求字节数，就说明发生了错误","短计数只可能出现在写操作中，读操作不会出现","`rio_writen` 也可能返回短计数"],"answer":0,"kp":"系统级 I/O"},{"id":"gen-c18-05","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"fork 后共享文件位置","type":"single","difficulty":2,"stem":"文件内容为 `abcde`。程序先读入 `c1`，然后 `fork`，父子各自再读一个字符到 `c2` 并打印。关于打印出的 `c2`，下列说法正确的是：","code":"#include \"csapp.h\"\n\nint main(int argc, char *argv[])\n{\n    int fd1;\n    int s = getpid() & 0x1;\n    char c1, c2;\n    char *fname = argv[1];\n\n    fd1 = Open(fname, O_RDONLY, 0);\n    Read(fd1, &c1, 1);\n    if (fork()) {          /* 父进程 */\n        sleep(s);\n        Read(fd1, &c2, 1);\n        printf(\"Parent: c1 = %c, c2 = %c\\n\", c1, c2);\n    } else {               /* 子进程 */\n        sleep(1-s);\n        Read(fd1, &c2, 1);\n        printf(\"Child: c1 = %c, c2 = %c\\n\", c1, c2);\n    }\n    return 0;\n}","explanation":"讲义第 18 讲「How Processes Share Files: fork」说明：子进程继承父进程的打开文件（exec 之后也不变），fork 之后子进程的描述符表与父进程相同，而**打开文件表项是共享的**，每个表项的引用计数加一。也就是说父子虽然各有自己的描述符表，但 fd1 指向同一个打开文件表项，文件位置只有一个（fork 之前已经读过 1 个字节，位置为 1）。两个进程各读一个字节：先执行 `Read` 的那个读到 `b`（位置变 2），后执行的读到 `c`（位置变 3）。程序用 `sleep(s)` / `sleep(1-s)`（s 取决于 `getpid() & 0x1`）让先读的进程由 PID 奇偶决定，而 PID 的奇偶是不可预测的，因此讲义 p.31 给出了两种输出：`Child: c1 = a, c2 = b / Parent: c1 = a, c2 = c` 或 `Parent: c1 = a, c2 = b / Child: c1 = a, c2 = c`。所以 D 对，A（以为位置独立）、B（以为位置被重置）、C（以为输出确定）都错。无论哪种输出，`c1` 都是 `a`，因为它在 fork 之前就读完了。","tags":["fork","文件位置共享","打开文件表项","竞态"],"options":["子进程拥有独立的文件位置，所以父子都会读到 b","子进程的文件位置被重置为 0，所以子进程总是读到 a","两个进程一定读到相同的字符，程序的输出是确定的","父子的 fd1 指向同一个打开文件表项、共享文件位置，因此先读的进程读到 b、后读的读到 c；由于 PID 奇偶不可预测，两种输出顺序都可能出现"],"answer":3,"kp":"异常与进程"},{"id":"gen-c18-06","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"标准 I/O 的缓冲与局限","type":"multi","difficulty":2,"stem":"关于 C 标准 I/O（`stdio`）库，下列说法正确的有：","code":null,"explanation":"讲义第 18 讲「Buffering in Standard I/O」与「Pros and Cons of Standard I/O」逐条给出这些性质。A 对：缓冲区在遇到 `\\n`、调用 `fflush`、调用 `exit` 或从 `main` 返回时被刷新（`strace ./hello` 里只看到一次 `write(1, \"hello\\n\", 6)` 就是这个原因）。B 对：标准 I/O 的缺点之一正是「Provides no function for accessing file metadata」，要看元数据必须用 Unix I/O 的 `stat`/`fstat`。C 对：`printf`、`sprintf`、`malloc`、`exit` 都不在 async-signal-safe 列表里，`write` 才是唯一安全的输出函数。D 对：标准 I/O 不适合套接字，讲义还提到流与套接字的限制相互冲突（CS:APP3e 10.11）。E 错：讲义开篇就强调「Standard I/O and RIO are implemented using low-level Unix I/O」，标准 I/O 最终仍然通过 `read`/`write` 系统调用完成 I/O，只是用缓冲减少了系统调用次数。","tags":["标准 I/O","缓冲刷新","async-signal-safe","元数据"],"options":["标准 I/O 在文件描述符之上加了一层用户态缓冲区，遇到 `\\n`、调用 `fflush`、调用 `exit` 或从 `main` 返回时会刷新输出缓冲区","标准 I/O 没有提供访问文件元数据（如 `st_size`、`st_mode`）的函数","标准 I/O 函数不是 async-signal-safe 的，不适合在信号处理函数中调用","标准 I/O 不适合用于网络套接字上的输入输出","标准 I/O 内部不使用 `read`/`write` 系统调用，而是直接调用设备驱动"],"answer":[0,1,2,3],"kp":"系统级 I/O"},{"id":"gen-c18-07","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"RIO 健壮 I/O 包","type":"judge","difficulty":2,"stem":"`rio_readn` 只有在遇到 EOF 时才返回短计数，`rio_writen` 从不返回短计数；`rio_readlineb` 与 `rio_readnb` 可以在同一描述符上任意交错调用，但不要与 `rio_readn` 混用。","code":null,"explanation":"讲义第 18 讲「The RIO Package」把 RIO 分为两类：无缓冲的 `rio_readn`/`rio_writen` 与带缓冲的 `rio_readlineb`/`rio_readnb`。p.43 明确：`rio_readn` 只在遇到 EOF 时才返回短计数（因此只在你确切知道要读多少字节时使用），`rio_writen` 从不返回短计数；两者的调用可以在同一描述符上任意交错。p.46 又指出：`rio_readlineb` 与 `rio_readnb` 也可以任意交错（它们共享同一个 `rio_t` 内部缓冲），但**警告不要与 `rio_readn` 混用**，因为无缓冲版本直接从描述符读，会与内部缓冲中「已读但未交给用户」的字节错位，导致数据丢失或顺序错乱。所以本题三个判断都正确。RIO 的价值在于把「短计数」和「文本行读取需要缓冲」这两件容易出错的事情封装起来，专门服务于网络套接字编程。","tags":["RIO","rio_readn","rio_readlineb","缓冲"],"options":null,"answer":true,"kp":"系统级 I/O"},{"id":"gen-c18-08","source":"自编 · 第 18 讲","origin":"created","lecture":18,"topic":"O_APPEND、dup 与文件位置综合","type":"fill","difficulty":3,"stem":"设文件 `fname` 初始为空。下面程序执行完毕后，文件的内容是什么？请直接填入字符串 ____","code":"#include \"csapp.h\"\n\nint main(int argc, char *argv[])\n{\n    int fd1, fd2, fd3;\n    char *fname = argv[1];\n\n    fd1 = Open(fname, O_CREAT|O_TRUNC|O_RDWR, S_IRUSR|S_IWUSR);\n    Write(fd1, \"pqrs\", 4);\n    fd3 = Open(fname, O_APPEND|O_WRONLY, 0);\n    Write(fd3, \"jklmn\", 5);\n    fd2 = dup(fd1);              /* 复制描述符，共享同一个打开文件表项 */\n    Write(fd2, \"wxyz\", 4);\n    Write(fd3, \"ef\", 2);\n    return 0;\n}","explanation":"逐步跟踪文件内容与各个打开文件表项的位置。① `fd1 = open(O_CREAT|O_TRUNC|O_RDWR)`：文件清空，fd1 的位置为 0；`write(fd1, \"pqrs\", 4)` 后内容为 `pqrs`，fd1 位置为 4。② `fd3 = open(O_APPEND|O_WRONLY)`：新的打开文件表项，因为带 O_APPEND，每次写入前内核会把位置设到文件末尾；`write(fd3, \"jklmn\", 5)` 追加到末尾，内容变为 `pqrsjklmn`（9 字节）。③ `fd2 = dup(fd1)`：fd2 与 fd1 **共享同一个打开文件表项**，位置仍是 4；`write(fd2, \"wxyz\", 4)` 从偏移 4 开始覆盖 4 个字节，把 `jklm` 覆盖成 `wxyz`，内容变为 `pqrswxyzn`（长度仍为 9，位置变为 8）。④ `write(fd3, \"ef\", 2)`：O_APPEND 使写入再次发生在当前文件末尾（偏移 9），追加后内容为 `pqrswxyznef`。易错点是第三步：dup 不复制位置，而 writer 的位置是 4 而不是 9，所以 `wxyz` 是**覆盖**而不是追加；另外 fd3 的追加位置由「文件末尾」决定，与它自己记录的偏移无关。","tags":["O_APPEND","dup","文件位置","覆盖与追加"],"options":null,"answer":["pqrswxyznef"],"kp":"系统级 I/O"},{"id":"f2014-17","source":"2014 期末","origin":"exam","lecture":19,"topic":"虚拟内存可行性的基础","type":"single","difficulty":1,"stem":"为使虚拟内存系统有效发挥预期作用，所运行的程序应该具有的特点是","code":null,"explanation":"虚拟内存能够工作的前提是程序具有良好的局部性：任一时刻只活跃在地址空间的一小部分（工作集），只要工作集能装进物理内存，即使程序本身远大于内存也只偶尔发生缺页，性能仍然接近全内存。A 与虚拟内存无关；B 不是必要条件，程序可以比物理内存大得多；D 说的是流水线的数据相关，与本题无关。踩坑点：局部性是缓存与虚拟内存共同的可行性基础。","tags":["虚拟内存","局部性","工作集"],"options":["该程序不应该含有过多的 I/O 操作","该程序的大小不应超过实际的内存容量","该程序应具有较好的局部性","该程序的指令相关不应过多"],"answer":2,"kp":"虚拟内存"},{"id":"f2015-13","source":"2015 期末","origin":"exam","lecture":19,"topic":"虚拟内存的可行性基础","type":"single","difficulty":1,"stem":"虚拟内存管理方式可行性的基础是","code":null,"explanation":"虚拟内存（以及高速缓存）之所以可行，是因为程序具有局部性：任一时刻只活跃于地址空间的一小部分（工作集），因此只要把工作集放在内存中，即使程序远大于物理内存也能获得接近全内存的性能。离散性、顺序性、并发性都不是虚拟内存可行性的依据。","tags":["虚拟内存","局部性"],"options":["程序执行的离散性","程序执行的顺序性","程序执行的局部性","程序执行的并发性"],"answer":2,"kp":"虚拟内存"},{"id":"f2017-12","source":"2017 期末","origin":"exam","lecture":19,"topic":"虚拟内存与进程隔离","type":"single","difficulty":2,"stem":"下列说法错误的是","code":null,"explanation":"使用堆（动态内存）的主要原因是：数据大小或生命周期在编译时无法确定、需要在函数返回后继续存活，以及栈空间有限；缓冲区溢出是安全问题，与“为什么使用堆”没有关系，D 错。A 对：虚拟内存的下一级存储是磁盘，一次缺页要经历毫秒级的磁盘访问，代价比 Cache 不命中高出好几个数量级。B 对：fork 采用写时复制，只复制页表等元数据，物理页在首次写入时才复制。C 对：每个进程有独立的页表与地址空间，硬件 MMU 会阻止越界访问。","tags":["虚拟内存","fork","堆"],"options":["虚拟内存存放在磁盘上，这导致不命中时处罚非常大","使用 fork 函数时，不会立刻拷贝内存空间","进程不会意外访问别的进程的内存空间","使用动态内存的主要原因是栈容易受到缓存溢出（buffer overflow）的腐蚀"],"answer":3,"kp":"虚拟内存"},{"id":"f2018-07","source":"2018 期末","origin":"exam","lecture":19,"topic":"虚拟内存概念与空闲链表管理","type":"single","difficulty":2,"stem":"下列与虚拟内存有关的说法中哪些是不对的？","code":null,"explanation":"A 对：每个进程拥有独立页表（多级页表）是其独立虚拟地址空间的基础。B 对：地址翻译只替换 VPN→PPN 部分，页内偏移 VPO 与 PPO 位数相同且数值直接照搬，这就是“虚拟页偏移等于物理页偏移”。C 对：工作集（频繁访问的页面集合）大于物理内存时，页面被反复换入换出，CPU 大部分时间耗在换页上，即抖动（thrashing）。D 不对：用双向空闲链表时，首次适配分配确实要沿链表扫描，最坏为 O(空闲块数)；但释放操作本身（借助头部/脚部边界标记找到相邻空闲块并立即合并）只需常数时间，与空闲块数量无关。因此“分配与释放均是线性时间”不成立，本题选 D。踩坑点：区分解字（搜索空闲块，线性）与释字（合并，常数）的代价。","tags":["虚拟内存","页表","抖动","空闲链表"],"options":["操作系统为每个进程提供一个独立的页表，用于将其虚拟地址空间映射到物理地址空间。","MMU 使用页表进行地址翻译时，虚拟地址的虚拟页面偏移与物理地址的物理页面偏移是相同的。","若某个进程的工作集大小超出了物理内存的大小，则可能出现抖动现象。","动态内存分配管理，采用双向链表组织空闲块，使得首次适配的分配与释放均是空闲块数量的线性时间。"],"answer":3,"kp":"虚拟内存"},{"id":"f2018-08","source":"2018 期末","origin":"exam","lecture":19,"topic":"虚拟地址到物理地址的映射与页偏移","type":"single","difficulty":2,"stem":"假定整型变量 A 的虚拟地址为 0x12345cf0，另一整型变量 B 的虚拟地址为 0x12345d98，假定一个 page 的长度为 0x1000 字节，A 的物理地址数值和 B 的物理地址数值关系应该为：","code":null,"explanation":"页大小 0x1000 意味着页内偏移占低 12 位。0x12345cf0 与 0x12345d98 的高位（VPN=0x12345）完全相同，低 12 位分别是 0xcf0 与 0xd98，说明两个变量落在同一个虚拟页中。地址翻译时同一虚拟页的所有字节被映射到同一个物理页，且页内偏移不变（VPO 与 PPO 相同），由于 0xcf0 < 0xd98，所以 A 的物理地址一定小于 B 的物理地址，选 B。A 错、C 错、D 错：分配策略只决定“哪个物理页分配给哪个虚拟页”，它既不能改变同一页内两个地址的相对大小，也不会让它们落到不同物理页（除非该页被换出再换入，但同一时刻仍满足上述关系）。踩坑点：不要被“物理页随机分配”迷惑，同页内相对次序是被页偏移锁定的。","tags":["虚拟内存","页偏移","地址翻译"],"options":["A 的物理地址数值始终大于 B 的物理地址数值","A 的物理地址数值始终小于 B 的物理地址数值","A 的物理地址数值和 B 的物理地址数值大小取决于动态内存分配策略","无法判定两个物理地址值的大小"],"answer":1,"kp":"虚拟内存"},{"id":"gen-c19-01","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"虚拟内存的三重作用","type":"single","difficulty":1,"stem":"关于虚拟内存（VM）的作用，下列说法正确的是：","code":null,"explanation":"讲义第 19 讲「Why Virtual Memory (VM)?」把作用概括为三条：①**高效使用主存**——把 DRAM 当作虚拟地址空间（存放在磁盘上）的缓存；②**简化内存管理**——每个进程得到同样统一的线性地址空间，便于链接与加载；③**隔离地址空间**——一个进程无法干扰另一个进程的内存，用户程序也无法访问内核的特权信息（p.12）。所以 C 对。D 只是其中一部分（缓存作用），忽略了内存管理与保护；A 错，每个进程有**自己的**私有虚拟地址空间，这正是「加一层间接」解决三个问题的核心（p.7-8），隔离靠页表权限位而不是段寄存器；B 错，硬件与软件协同实现：MMU、TLB、异常处理机制属于硬件，页错误处理程序与 TLB 管理由软件完成（p.48 的总结）。","tags":["虚拟内存","缓存","内存管理","保护"],"options":["每个进程共享同一个虚拟地址空间，靠段寄存器来隔离","虚拟内存完全由操作系统软件实现，与硬件无关","它把主存当作磁盘上虚拟地址空间的缓存、为每个进程提供统一的线性地址空间、并通过页表项中的权限位实现地址空间隔离","它的唯一目的是扩大程序可用的内存容量"],"answer":2,"kp":"虚拟内存"},{"id":"gen-c19-02","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"地址翻译字段划分与页表大小","type":"single","difficulty":1,"stem":"某系统虚拟地址 14 位、物理地址 12 位、页大小 64 字节、页表项 4 字节。若采用单级页表，则 VPN 的位数与页表的总大小分别是：","code":null,"explanation":"讲义第 19 讲「Summary of Address Translation Symbols」给出参数：虚拟地址空间 $N=2^n$、物理地址空间 $M=2^m$、页大小 $P=2^p$；虚拟地址被拆成 VPN 与 VPO（页偏移 $p$ 位），物理地址被拆成 PPN 与 PPO，且 **PPO 与 VPO 相同**。本题页大小 64 B $=2^6$，所以 $p=6$：VPN 位数 $=14-6=8$，PPN 位数 $=12-6=6$，VPO/PPO 都是 6 位。单级页表要为每个虚拟页准备一个页表项，共 $2^{8}=256$ 项，每项 4 B，总计 $256\\times4=1024$ B $=1$ KB，因此 B 对。C、A 把 VPN 算成 6 位（那是页偏移的位数）；D 把表项大小算错（$256\\times8$ 才是 2 KB）。这类「先定 p、再定 VPN/PPN、最后算页表大小」的三步法在第 19、20 讲的地址翻译题里反复使用。","tags":["地址翻译","VPN","页表大小","PPO=VPO"],"options":["6 位，1 KB","8 位，1 KB","6 位，256 B","8 位，2 KB"],"answer":1,"kp":"虚拟内存"},{"id":"gen-c19-03","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"TLB 的作用与索引方式","type":"single","difficulty":1,"stem":"关于 TLB（Translation Lookaside Buffer），下列说法正确的是：","code":null,"explanation":"讲义第 19 讲「Speeding up Translation with a TLB」指出：页表项本身可以像普通内存字一样被 L1 缓存，但 PTE 命中仍需一个小的 L1 延迟，而且 PTE 可能被其他数据引用挤出；于是引入 TLB——MMU 中的小型专用硬件缓存，保存少量页的完整页表项。p.42 说明访问方式：VPN 被分成 TLB 标记（TLBT）与 TLB 索引（TLBI），TLBI 选择组、TLBT 与组内各项的标记比较（$T=2^t$ 组）。p.43 的结论是「A TLB hit eliminates a cache/memory access」，即命中时不需要为取 PTE 再访问内存；p.44 说未命中要额外访问一次内存取 PTE，但「Fortunately, TLB misses are rare」，因为程序的局部性使工作集很小。所以 A 对。B 把方向说反（TLB 是 VPN→PPN）；C 混淆了「TLB 未命中」与「缺页」——未命中只是要走一次多级页表，PTE 有效位为 1 就不是缺页；D 错，TLB 缓存的是页表项而不是数据，而且它属于 MMU，不是数据缓存的后级。","tags":["TLB","TLBI","TLBT","组相联"],"options":["TLB 是 MMU 中一个小型、专用、组相联的硬件缓存，缓存的是完整的页表项；它用 VPN 的一部分位（TLBI）选择组、其余位（TLBT）匹配标记，命中时可以省去为取 PTE 而额外访问内存","TLB 缓存的是物理地址到虚拟地址的反向映射","TLB 命中说明该地址一定不会发生缺页，TLB 未命中则一定发生缺页","TLB 位于 L1 数据缓存之后，只缓存最近访问过的数据"],"answer":0,"kp":"虚拟内存"},{"id":"gen-c19-04","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"单级页表的规模与多级页表","type":"single","difficulty":2,"stem":"48 位虚拟地址空间、页大小 4 KB、页表项 8 字节。如果采用单级页表，页表本身需要多大？","code":null,"explanation":"讲义第 19 讲「Multi-Level Page Tables」给出了完全一样的计算：4 KB 页意味着 $p=12$，48 位地址空间共有 $2^{48}/2^{12}=2^{36}$ 个虚拟页，每个页需要一个 PTE；若 PTE 为 8 字节，单级页表就要 $2^{36}\\times2^{3}=2^{39}$ 字节 $=512$ GB。即使每个进程只用到很小的地址范围，也必须为整个地址空间准备页表项，显然不可行，所以实际系统使用多级页表：第一级（顶层）页表的每个 PTE 指向一个下级页表，下级页表可以像普通数据一样换入换出，从而只为**已分配**的虚拟页建立表项（讲义 p.45-47 与 p.46 的两级页表层次图）。A（4 GB）是只算了页表项的个数而忘记乘 8 字节的一半错误；B、C 数量级完全不符。讲义第 20 讲还会给出 64 位地址空间下单级页表需要 32,000 TB 的结论。","tags":["多级页表","页表大小","48 位地址"],"options":["4 GB","32 MB","256 TB","512 GB"],"answer":3,"kp":"虚拟内存"},{"id":"gen-c19-05","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"缺页处理流程与按需调页","type":"single","difficulty":2,"stem":"关于缺页（page fault）的处理，下列说法正确的是：","code":null,"explanation":"讲义第 19 讲「Handling Page Fault」给出完整步骤：缺页是一个异常，页错误处理程序先选择一个牺牲页（victim，例子里是 VP 4）并把它换出（若被修改过需要写回磁盘），再把所需页从磁盘调入物理内存、更新 PTE，然后**重新执行**那条引发缺页的指令，此时变成页命中；讲义把这种「等到真正缺页时才把页复制到 DRAM」的做法称为**按需调页**（demand paging，p.23）。所以 A 对。B 错：fault 类异常返回的是「当前指令」，trap 才返回下一条（对照第 16 讲的异常分类）。C 错：缺页既可能是正常的按需调页，也可能是非法访问；只有当地址不属于任何已分配的虚拟内存区域或违反权限时才是错误，此时内核向进程发送 SIGSEGV（第 16 讲 p.18 的 `a[5000] = 13` 例子）。D 错：页的调入由内核的缺页处理程序在软件中完成，MMU 只负责检测有效位并触发异常。","tags":["缺页","按需调页","牺牲页","重新执行"],"options":["MMU 发现页表项有效位为 0 就触发缺页异常；内核选择一个牺牲页（若被修改过则先写回磁盘），把所需页从磁盘调入并更新页表项，然后重新执行引起缺页的那条指令","缺页处理完成后从下一条指令继续执行","缺页一定是非法访问，内核会立即终止进程","缺页发生时由 MMU 直接把页从磁盘读入 L1 数据缓存"],"answer":0,"kp":"虚拟内存"},{"id":"gen-c19-06","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"DRAM 缓存的组织特点","type":"multi","difficulty":2,"stem":"虚拟内存把 DRAM 当作磁盘上虚拟地址空间的缓存。关于这个「DRAM 缓存」的组织特点，下列说法正确的有：","code":null,"explanation":"讲义第 19 讲「DRAM Cache Organization」逐条对比说明：由于缺页代价极高（磁盘比 DRAM 慢约 $10^4$ 倍，一次缺页超过 100 万时钟周期，CPU 在此期间可以做很多事），这个缓存的组织与 SRAM 缓存很不一样——①块（页）很大，典型 4 KB，Linux 的「大页」默认 2 MB 到 1 GB；②**全相联**，任意虚拟页可放到任意物理页，因而需要「大」映射函数；③替换算法极为复杂、代价高，**不可能用硬件实现**，实际由操作系统软件近似完成；④采用**写回**而不是写直达。所以 A、B、E 对，D 错（错在「硬件实现的精确 LRU」）。C 也正确：写回是这一节明确列出的特点。讲义还用局部性解释为什么这么慢的缓存仍然有效：只要工作集小于主存，除冷缺失外性能良好；工作集超过主存就会发生抖动（thrashing）。","tags":["DRAM 缓存","全相联","写回","抖动"],"options":["页（相当于缓存块）很大，典型值为 4 KB","全相联：任意虚拟页都可以放在任意物理页中","采用写回（write-back）而不是写直达（write-through）","替换算法用硬件实现的精确 LRU，以保证最低的缺页率","未命中代价极大（磁盘比 DRAM 慢约 10000 倍），所以设计上极力降低缺页率"],"answer":[0,1,2,4],"kp":"高速缓存"},{"id":"gen-c19-07","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"虚拟页与物理页的映射关系","type":"judge","difficulty":2,"stem":"在虚拟内存系统中，一个物理页在同一时刻只能被一个虚拟页映射，因此共享库的代码无法被多个进程共享。","code":null,"explanation":"判断为假。讲义第 19 讲「VM as a Tool for Memory Management」明确写出「Sharing code and data among processes: Map virtual pages to the same physical page (here: PP 6)」——多个进程（或多个虚拟页）可以把各自的虚拟页映射到**同一个**物理页，这正是共享库代码只需在物理内存中保留一份的原因，也是后面 fork 之后父子进程先用同一物理页、再通过写时复制（COW）分开的基础（第 20 讲）。映射方向是「多个虚拟页 → 一个物理页」完全允许，而「一个虚拟页 → 多个物理页」在某一时刻不允许。前半句「一个物理页只能被一个虚拟页映射」错了，所以整个命题错。此外讲义 p.29 还说明，虚拟页在不同时刻可以存放在不同的物理页中，这种灵活性简化了内存分配。","tags":["物理页共享","共享库","内存管理"],"options":null,"answer":false,"kp":"高速缓存"},{"id":"gen-c19-08","source":"自编 · 第 19 讲","origin":"created","lecture":19,"topic":"TLB 命中与缺页的关系","type":"judge","difficulty":3,"stem":"TLB 命中说明该虚拟页当前就在物理内存中（对应页表项的有效位为 1），因此 TLB 命中时不会发生缺页；而 TLB 未命中只说明需要到页表中查一次，未必发生缺页。","code":null,"explanation":"判断为真。TLB 中缓存的**是完整的页表项**，而且只有有效位为 1 的页表项才会被放进去并用于完成翻译（讲义第 19 讲 p.40「Contains complete page table entries for small number of pages」，p.43 的 TLB 命中路径直接从 VPN 得到 PTE 并拼出物理地址）。因此 TLB 命中就意味着该页已在物理内存、不会缺页。反过来，TLB 未命中只是要按 PTBR 指向的多级页表去取 PTE（p.44：TLB miss incurs an additional memory access），取回的 PTE 有效位可能是 1（页命中，只是 TLB 里没有缓存）也可能是 0（才触发缺页）。TLB 未命中之所以很少见，是因为程序的局部性使活跃页数量远小于 TLB 容量。这个判断题的价值在于区分三个层次：TLB 命中/未命中、页命中/缺页、以及合法/非法访问。","tags":["TLB","缺页","有效位","地址翻译"],"options":null,"answer":true,"kp":"虚拟内存"},{"id":"f2013-10","source":"2013 期末","origin":"exam","lecture":20,"topic":"多级页表的 VPN 位数","type":"single","difficulty":3,"stem":"假设有一台 64 位计算机的物理页块大小是 8KB，采用三级页表进行虚拟地址寻址，它的虚拟地址的 VPO 有 13 位，问它的 VPN 有多少位？","code":null,"explanation":"页大小 8KB = 2^13，与题面给出的 VPO = 13 位一致。64 位机器上一个页表项占 8 字节，因此一页能存放 2^13 / 8 = 2^10 = 1024 个页表项，即每一级页表用 10 位索引。三级页表共 3 × 10 = 30 位，故 VPN 有 30 位（整个虚拟地址 43 位）。选 27 是误按 4 字节页表项（每级 11 位）计算；选 20 是把级数或页表项大小算错；选 33 则把 VPO 也算进了 VPN。踩坑点：多级页表每一级的索引位数由“页大小 / 页表项大小”决定。","tags":["虚拟内存","多级页表","VPN"],"options":["20","27","30","33"],"answer":2,"kp":"虚拟内存"},{"id":"f2013-11","source":"2013 期末","origin":"exam","lecture":20,"topic":"fork 的写时复制","type":"single","difficulty":2,"stem":"进程 P1 通过 fork() 产生子进程 P2。假设执行 fork() 之前 P1 占用了 53 个用户态物理页，则 fork 之后 P1 和 P2 共占用多少个用户态物理页；假设 fork 之前 P1 中有一个可读写的物理页，则 fork 之后 P1 对该物理页的页表项权限是什么？","code":null,"explanation":"fork 不复制用户态物理页，只为子进程复制页表等内核数据结构，并把父子双方的页表项都改成只读，让两个进程共享同一份物理页（写时复制）。所以此刻两进程合计仍只占用 53 个物理页，而 P1 对该可写页的权限是只读。之后任何一方写入都会触发保护故障，内核才真正复制出一份新物理页并把双方权限恢复为读写。选 106 是把 fork 当成全量内存拷贝；选“读写”则忽略了 COW 必须先制造写保护这一步。","tags":["fork","写时复制","页表权限"],"options":["53，读写","53，只读","106，读写","106，只读"],"answer":1,"kp":"异常与进程"},{"id":"f2014-15","source":"2014 期末","origin":"exam","lecture":20,"topic":"TLB、Cache 与页表的命中组合","type":"single","difficulty":2,"stem":"对于虚拟存储系统，一次访存过程中，下列命中组合不可能发生的是","code":null,"explanation":"TLB 是页表项的专用缓存：TLB 命中意味着对应的页表项存在且有效（P 位为 1），也就意味着该页一定已在物理内存中，因此“TLB 命中而页未命中”不可能出现，选 D。A 可以发生：访问的页刚被换出，TLB 与 Cache 里都没有；B 常见：TLB 未命中但页表项在内存（页命中），而访问的数据恰好命中 Cache 中的其他行；C 也常见：映射已缓存在 TLB，但所需数据块不在 Cache 中。踩坑点：TLB→页表→物理页这条因果链是刚性的，而 Cache 与它们相互独立。","tags":["TLB","Cache","页表"],"options":["TLB 未命中，Cache 未命中，Page 未命中","TLB 未命中，Cache 命中，Page 命中","TLB 命中，Cache 未命中，Page 命中","TLB 命中，Cache 命中，Page 未命中"],"answer":3,"kp":"高速缓存"},{"id":"f2014-26","source":"2014 期末","origin":"exam","lecture":20,"topic":"页表项权限与地址翻译（TLB 直接映射）","type":"single","difficulty":3,"stem":"Intel 的 IA32 采用小端法二级页表，页大小 4KB，一级页表（页目录）基址为 0x0c23b000。页表项低 6 位含义为：bit0 = P（存在位）、bit1 = R/W（读写权限）、bit2 = U/S（1 表示用户态可访问）、bit5 = A（访问位）。TLB 采用直接映射（8 项），内容如下表。某用户态进程试图写入虚拟地址 0x080016ba，该访问的最后结果是？","code":"物理内存中的部分内容（小端法，每个字节一个地址）：\n0C23B080  05 5D 05 00\n00055004  03 D0 74 89\n\nTLB（直接映射）：\n索引  TLB标记   内容       有效位\n0     0x08001   2314d220   1\n1     0x01000   24aee520   0\n2     0x005AE   00055004   0\n3     0x016BA   0c23b09d   1\n4     0x0AA00   0005545c   1\n5     0x0000A   29dee500   0\n6     0x5AE82   00023320   1\n7     0x28DFC   00023000   1","explanation":"VPN = 0x080016ba >> 12 = 0x08001，VPO = 0x6ba。8 项直接映射 TLB 的索引 = VPN mod 8 = 1，查表得标记 0x01000、有效位 0，TLB 不命中。页目录索引 = VPN >> 10 = 0x20 = 32，页目录项地址 = 0x0c23b000 + 32×4 = 0x0c23b080，读出 05 5D 05 00，小端解释为 0x00055D05，页框号 PPN = 0x00055，即二级页表基址 0x00055000。页表索引 = VPN & 0x3ff = 1，页表项地址 = 0x00055000 + 4 = 0x00055004，读出 03 D0 74 89 = 0x8974D003：P = 1（页在内存，不缺页），但低 3 位为 011，U/S = 0 表示这是内核（超级用户）页，而发起访问的是用户态进程，MMU 因此产生保护故障，即非法访问异常，选 C。若权限允许，物理地址应为 0x8974D000 + 0x6ba = 0x8974D6BA。踩坑点：检查权限时不能只看 P 位，还要看 U/S 与 R/W 位。","tags":["页表项权限","TLB","地址翻译"],"options":["该进程成功写入，未触发异常","该进程触发了一个缺页异常","该进程触发了一个非法访问异常"],"answer":2,"kp":"虚拟内存"},{"id":"f2015-14","source":"2015 期末","origin":"exam","lecture":20,"topic":"二级页表地址转换","type":"single","difficulty":3,"stem":"Intel IA32 采用二级页表，页面大小 4KB，页表项 4 字节。页目录与页表的部分内容为：页目录 VPN 1→页表 3、VPN 2→页表 1、VPN 3→页表 2；页表 1 中 VPN 3→页 5、VPN 4→页 2、VPN 5→页 7；页表 2 中 VPN 2→页 1、VPN 4→页 4、VPN 8→页 6；页表 3 中 VPN 2→页 9、VPN 3→页 8、VPN 5→页 3。则十六进制逻辑地址 8052CB 经地址转换后形成的物理地址应为十进制的","code":null,"explanation":"页大小 4KB 说明页内偏移占 12 位；4KB/4B = 1K 项说明页目录索引与页表索引各占 10 位（32 位地址按 10 + 10 + 12 切分）。0x8052CB = 0000 0000 1000 0000 0101 0010 1100 1011：最高 10 位为 2，查页目录得页表 1；中间 10 位为 5，查页表 1 得物理页号 7；页内偏移为 0x2CB = 715。物理地址 = 7 × 4096 + 715 = 28672 + 715 = 29387，选 B。选 21195 是错用了页号 5；选 21126 是把偏移算错。踩坑点：先按 10/10/12 正确切分，再按“页目录→页表→物理页号+偏移”走一遍。","tags":["多级页表","地址翻译","页内偏移"],"options":["21195","29387","21126","47195"],"answer":1,"kp":"虚拟内存"},{"id":"f2015-15","source":"2015 期末","origin":"exam","lecture":20,"topic":"覆盖 64 位地址空间所需页表层数","type":"single","difficulty":3,"stem":"已知某系统页面长 8KB，页表项 4 字节，采用多层分页策略映射 64 位虚拟地址空间。若限定最高层页表占 1 页，则它可以采用多少层的分页策略？","code":null,"explanation":"页面 8KB = 2^13 字节，页表项 4 字节，故一页可放 8K/4 = 2K = 2^11 个页表项，每一级用 11 位索引。64 位虚拟地址去掉 13 位页内偏移，还剩 51 位 VPN 要靠各层索引覆盖：n 层只能索引 11n 位，要求 11n ≥ 51，得 n ≥ 4.64，故至少 5 层；4 层只有 44 位，无法覆盖。反过来验证：5 层时最高层实际只需 2^(51-44) = 2^7 = 128 个有效表项，小于一页的 2048 项，符合“最高层页表占 1 页”的限制。","tags":["多级页表","页表项","VPN 位数"],"options":["3 层","4 层","5 层","6 层"],"answer":2,"kp":"虚拟内存"},{"id":"f2016-12","source":"2016 期末","origin":"exam","lecture":20,"topic":"Core i7 页表项中只有叶级才有的位","type":"single","difficulty":3,"stem":"在 Core i7 中，以下哪个页表项位属于 4 级页表项，不属于 1 级页表项","code":null,"explanation":"Core i7 各级页表项的格式基本相同，但有些位只对特定层级有意义：D（脏）位只在最后一级（叶）页表项中有效，用于记录该页是否被写过；此外 PS（页大小）位只在非叶级别有意义（本题未给出该选项）。G（全局）、XD（禁止取指）、U/S（用户/超级用户访问权限）在各层都可能出现。因此只有 D 位符合“属于叶级页表项而不属于高层页表项”。踩坑点：权限的最终生效结果由叶级项给出，但它本身在各层都存在。","tags":["Core i7","页表项","脏位"],"options":["G 位（Global Bit）","D 位（Dirty Bit）","XD 位（Disable or enable instruction fetch）","U/S 位（User or supervisor mode access permission）"],"answer":1,"kp":"虚拟内存"},{"id":"f2016-13","source":"2016 期末","origin":"exam","lecture":20,"topic":"Core i7 虚拟地址与物理地址的划分","type":"single","difficulty":3,"stem":"在 Core i7 中，关于虚拟地址和物理地址的说法，不正确的是","code":null,"explanation":"Core i7 的 4 级页表把 VPN 分成 VPN1~VPN4 四个 9 位的字段，它们位宽相同，故 C 正确；虚拟页号又被 TLB 划分成 TLB 标记 TLBT 与 TLB 索引 TLBI，故 D 正确；虚拟页偏移 VPO 被 L1 的组索引 CI 与块偏移 CO 瓜分，故 A 正确。B 把页框号 PPN 写成 TLBT 与 TLBI 的组合，而 PPN 来自页表项中保存的物理页号，与 TLBT/TLBI 无关，故 B 错。踩坑点：TLB 缓存的映射是“虚拟页号 → 物理页号 + 权限”，不要把它与页框号本身混为一谈。","tags":["Core i7","TLB","地址划分"],"options":["VPO = CI + CO","PPN = TLBT + TLBI","VPN1 = VPN2 = VPN3 = VPN4","TLBT + TLBI = VPN"],"answer":1,"kp":"虚拟内存"},{"id":"f2016-21","source":"2016 期末","origin":"exam","lecture":20,"topic":"MAP_PRIVATE 与父进程的可见性","type":"single","difficulty":2,"stem":"程序 i16.c 先把 argv[1] 的内容映射到内存再 fork；父进程等待子进程结束后把映射区内容写到 argv[2]。假定 t1 内容为 `ICSexam`。当 X 为 `MAP_PRIVATE`、Y 为空时，执行 `./i16 t1 t2` 的结果为","code":"int main(int argc, char **argv)\n{\n    int fd1, fd2;\n    char *cs;\n    struct stat stat;\n    int sz, i;\n\n    fd1 = Open(argv[1], O_RDWR, S_IRUSR | S_IWUSR);\n    Fstat(fd1, &stat);\n    sz = stat.st_size;\n    fd2 = Open(argv[2], O_RDWR | O_TRUNC | O_CREAT, S_IRUSR | S_IWUSR);\n\n    cs = (char *)Mmap(NULL, sz, PROT_READ | PROT_WRITE, X, fd1, 0);\n    if (Fork()) {\n        Wait(&i);\n        Write(fd2, cs, sz);\n    } else {\n        for (i = 0; i < sz; i++) {\n            if (islower(cs[i]))\n                cs[i] = (char) toupper(cs[i]);\n            else if (isupper(cs[i]))\n                cs[i] = (char) tolower(cs[i]);\n        }\n        Y;\n    }\n    Munmap(cs, sz);\n    Close(fd1);\n    Close(fd2);\n}","explanation":"MAP_PRIVATE 建立的是写时复制的私有映射：子进程对 cs[i] 的修改只落在自己的私有副本上，既不会写回文件 t1，父进程也看不到这些修改。父进程 Wait 之后读到的仍是原来的 ICSexam，于是原样写到 t2。结果 t1、t2 都保持 ICSexam，选 A。踩坑点：MAP_PRIVATE 与“修改不写回文件、也不被其他进程看到”是同一件事的两面。","tags":["mmap","MAP_PRIVATE","写时复制"],"options":["t1 为 ICSexam，t2 为 ICSexam","t1 为 ICSexam，t2 为 icsEXAM","t1 为 icsEXAM，t2 为 icsEXAM","t1 为 icsEXAM，t2 为 ICSexam"],"answer":0,"kp":"异常与进程"},{"id":"f2016-22","source":"2016 期末","origin":"exam","lecture":20,"topic":"MAP_SHARED 下修改的可见性","type":"single","difficulty":2,"stem":"同样的 i16 程序（t1 初始为 ICSexam），当 X 为 `MAP_SHARED`、Y 为空时，执行 `./i16 t1 t2` 的结果为","code":"cs = (char *)Mmap(NULL, sz, PROT_READ | PROT_WRITE, X, fd1, 0);\nif (Fork()) {\n    Wait(&i);\n    Write(fd2, cs, sz);\n} else {\n    for (i = 0; i < sz; i++) {\n        if (islower(cs[i]))\n            cs[i] = (char) toupper(cs[i]);\n        else if (isupper(cs[i]))\n            cs[i] = (char) tolower(cs[i]);\n    }\n    Y;\n}","explanation":"MAP_SHARED 让父子进程共享同一份物理页面，子进程完成大小写转换后，父进程立即能看到 icsEXAM，于是把它写到 t2；同时共享映射上的修改最终会反映到文件 t1（子进程退出、munmap/close 之后），t1 也变成 icsEXAM。因此 t1、t2 都是 icsEXAM，选 C。踩坑点：MAP_SHARED 配合 PROT_WRITE 会真正修改文件内容。","tags":["mmap","MAP_SHARED","共享映射"],"options":["t1 为 ICSexam，t2 为 ICSexam","t1 为 ICSexam，t2 为 icsEXAM","t1 为 icsEXAM，t2 为 icsEXAM","t1 为 icsEXAM，t2 为 ICSexam"],"answer":2,"kp":"高速缓存"},{"id":"f2016-23","source":"2016 期末","origin":"exam","lecture":20,"topic":"私有映射下父子各写一次的结果","type":"single","difficulty":3,"stem":"同样的 i16 程序（t1 初始为 ICSexam），当 X 为 `MAP_PRIVATE`、Y 为 `Write(fd2, cs, sz)` 时，执行 `./i16 t1 t2` 后 t2 的内容为","code":"cs = (char *)Mmap(NULL, sz, PROT_READ | PROT_WRITE, X, fd1, 0);\nif (Fork()) {\n    Wait(&i);\n    Write(fd2, cs, sz);\n} else {\n    for (i = 0; i < sz; i++) {\n        if (islower(cs[i]))\n            cs[i] = (char) toupper(cs[i]);\n        else if (isupper(cs[i]))\n            cs[i] = (char) tolower(cs[i]);\n    }\n    Y;\n}","explanation":"子进程在自己的私有副本上完成大小写转换后，用 Write 把 icsEXAM 写进 fd2（偏移 0~6）；由于 fork 之后父子共享同一个打开文件表项，偏移随后变为 7。父进程 Wait 返回后再 Write(fd2, cs, 7)，此时读到的 cs 是父进程自己的、未被修改的 ICSexam，而且写入位置是共享偏移 7，于是文件变成 icsEXAM 后接 ICSexam，选 C。选 B 忽略了父进程的那次写；选 D 误以为父进程也能看到子进程的修改。踩坑点：fd2 的偏移被 fork 共享。","tags":["mmap","fork 共享偏移","Write"],"options":["t2 为 ICSexam","t2 为 icsEXAM","t2 为 icsEXAMICSexam","t2 为 icsEXAMicsEXAM"],"answer":2,"kp":"异常与进程"},{"id":"f2016-24","source":"2016 期末","origin":"exam","lecture":20,"topic":"共享映射下父子各写一次的结果","type":"single","difficulty":3,"stem":"同样的 i16 程序（t1 初始为 ICSexam），当 X 为 `MAP_SHARED`、Y 为 `Write(fd2, cs, sz)` 时，执行 `./i16 t1 t2` 后 t2 的内容为","code":"cs = (char *)Mmap(NULL, sz, PROT_READ | PROT_WRITE, X, fd1, 0);\nif (Fork()) {\n    Wait(&i);\n    Write(fd2, cs, sz);\n} else {\n    for (i = 0; i < sz; i++) {\n        if (islower(cs[i]))\n            cs[i] = (char) toupper(cs[i]);\n        else if (isupper(cs[i]))\n            cs[i] = (char) tolower(cs[i]);\n    }\n    Y;\n}","explanation":"共享映射下父子看到的是同一份被改成 icsEXAM 的内容：子进程先把 icsEXAM 写到 fd2 的偏移 0~6，共享偏移变为 7；父进程随后写自己的映射内容——此时也已经是 icsEXAM——到偏移 7，于是 t2 为 icsEXAMicsEXAM，选 D。这也说明“共享映射 + 父子各写一次”会把同一份内容写两遍。踩坑点：MAP_PRIVATE 与 MAP_SHARED 只差这一处，结果就完全不同（对比上一题）。","tags":["mmap","MAP_SHARED","文件偏移"],"options":["t2 为 ICSexam","t2 为 icsEXAM","t2 为 icsEXAMICSexam","t2 为 icsEXAMicsEXAM"],"answer":3,"kp":"高速缓存"},{"id":"f2016-25","source":"2016 期末","origin":"exam","lecture":20,"topic":"页表项的有效位与 COW 的实现","type":"single","difficulty":3,"stem":"在 i16 程序运行于 x86-64 Linux 时，X 为 MAP_SHARED、子进程运行到 Y 处，关于页表的描述，正确的是","code":null,"explanation":"页表项的 P 位为 0 表示该页不在内存或映射无效，此时 MMU 直接触发缺页异常，页表项中页框号等其它位不会被解释使用，C 对。A 错：四级页表的层级由当前页表配置决定，与“地址落在低 32 位”无关，用户空间的地址同样走四级页表。B 错：并非所有地址都是完整的 48 位规范地址，也不存在“都必须用完整四级页表”的规则（还存在大页等情形）。D 错：COW 不需要页表项提供专门位，它的实现就是“把页表项设为只读 + 写保护故障时复制”。踩坑点：COW 依赖的是 R/W 权限位。","tags":["页表项","P 位","COW"],"options":["由于 i16 本身的代码和数据只占用了低 32 位空间，所以这部分空间只需使用 2 级页表","所有虚拟地址空间都是 48 位地址空间，都需要使用完整的 4 级页表","当页表项无效时（P 位为 0），MMU 不会使用到其它位的内容","除读写权限外，需要在页表项中为 COW 机制提供专门的支持"],"answer":2,"kp":"虚拟内存"},{"id":"f2016-26","source":"2016 期末","origin":"exam","lecture":20,"topic":"TLB 组相联下的 TLBT 计算","type":"single","difficulty":3,"stem":"假设 TLB 有 64 个表项，4 路组相联，当访问虚拟地址 0x00007f5df2224000（即 /proc/pid/maps 中 7f5df2224000-7f5df2226000 那一页，题面简写为 7f5df2224）时，所对应的 TLBT 应为","code":null,"explanation":"TLB 有 64 项、4 路组相联，组数 = 64/4 = 16，故组索引 TLBI 取 VPN 的最低 log2(16) = 4 位，其余高位构成 TLB 标记 TLBT。虚拟地址 0x7f5df2224000 的 VPN = 0x7f5df2224，其二进制约为 …0010 0100，低 4 位 0100 是 TLBI，剩下的 32 位 0111 1111 0101 1101 1111 0010 0010 0010（= 0x7F5DF222）就是 TLBT，选 A。B 多取了一位，C、D 把低 4 位（组索引）也算进了标记。踩坑点：先由“项数 ÷ 路数”求出组数，再令 TLBT = VPN >> log2(组数)。","tags":["TLB","组相联","TLBT"],"options":["0111 1111 0101 1101 1111 0010 0010 0010","0111 1111 0101 1101 1111 0010 0010 0010 01","1111 0101 1101 1111 0010 0010 0010 0100","11 1111 0101 1101 1111 0010 0010 0010 0100"],"answer":0,"kp":"虚拟内存"},{"id":"f2016-27","source":"2016 期末","origin":"exam","lecture":20,"topic":"TLB 命中的含义","type":"single","difficulty":2,"stem":"当发生 TLB 命中时，则意味着","code":null,"explanation":"TLB 是页表项的专用小缓存，只保存“虚拟页号 → 物理页号 + 权限”的映射。TLB 命中只说明地址翻译可以很快完成，既不能保证页表项恰好位于 L1 Cache（A 错），更不能保证要访问的数据本身在 L1 Cache 中（B 错，那是 Cache 命中与否的问题）。Cache 行只有有效位与标记等元数据，并不带读写执行权限位，权限检查由页表项负责（C 错）。因此选 D。踩坑点：TLB 命中 ≠ 数据命中，两者是相互独立的缓存。","tags":["TLB","Cache","权限位"],"options":["相应的页表项，在 L1 Cache 里","要访问的数据内容，在 L1 Cache 里","如果要访问的数据内容已在 L1 Cache 中，则该 Cache Line 的权限位中应具有相应的读写执行权限","以上都不对"],"answer":3,"kp":"高速缓存"},{"id":"f2018-09","source":"2018 期末","origin":"exam","lecture":20,"topic":"多级页表的优势","type":"single","difficulty":1,"stem":"虚拟内存中两层页表和单层页表相比，最主要的优势在于：","code":null,"explanation":"A 错：两级页表在 TLB 未命中时要多访问一次内存才能得到二级页表项，翻译更慢而不是更快。B 错：页级保护（P、R/W、U/S 等权限位）在单级页表中同样存在，两级页表并没有带来更精细的保护粒度。C 错：利用代码的空间局部性是缓存与 TLB 的职责，与页表分几级无关。D 对：两级页表把页表本身也分页，只对真正使用到的地址区间建立二级页表页；对稀疏的地址空间使用模式（例如一个进程只用了少数几个分散的区域），页表占用的内存远小于单级页表所需的一整张连续大表，这正是多级页表最主要的设计目的。踩坑点：多级页表是用“翻译次数”换“页表空间”。","tags":["多级页表","稀疏地址空间","页表大小"],"options":["更快的地址翻译速度","能够提供页面更加精细的保护措施","能够充分利用代码的空间局部性","能够充分利用稀疏的内存使用模式"],"answer":3,"kp":"虚拟内存"},{"id":"f2018-28","source":"2018 期末","origin":"exam","lecture":20,"topic":"单级页表所需页数","type":"fill","difficulty":2,"stem":"考虑一个 32 位系统，页大小是 4KB，页表项（PTE）大小是 4 字节。如果不使用多级页表，常驻内存的页表一共需要多少页？","code":"32 位虚拟地址空间，页大小 4KB = 2^12 字节，PTE = 4 字节","explanation":"32 位地址空间、页大小 4KB=2^12 字节，因此虚拟页号 VPN 有 32-12=20 位，共 2^20 个页表项需要常驻。每个 PTE 占 4 字节，一张单级页表占 2^20 × 4B = 2^22 字节 = 4MB。题目问的是“多少页”，按页大小 4KB 折算：4MB / 4KB = 1024 页（即 2^10 页）。这说明单级页表即使大部分虚拟页根本没有使用，也不得不为整个 4GB 地址空间预留 4MB 连续内存，这正是引入多级页表的动机。踩坑点：题目填的是页数而不是字节数或页表项数，注意单位换算。","tags":["页表大小","单级页表","32位地址空间"],"options":null,"answer":["1024","1024 页","2^10"],"kp":"虚拟内存"},{"id":"f2019-09","source":"2019 期末","origin":"exam","lecture":20,"topic":"模式切换与进程切换时 TLB/cache 的刷新","type":"single","difficulty":3,"stem":"根据本课程介绍的 Intel x86-64 存储系统，填写表格中某一个进程从用户态切换至内核态时、以及进程切换时对 TLB 和 cache 是否必须刷新。其中 ① 为用户态→内核态切换时的 TLB，② 为该切换时的 cache，③ 为进程切换时的 TLB，④ 为进程切换时的 cache（①③选 TLB、②④选 cache）。","code":"① 用户态→内核态：TLB 是否必须刷新\n② 用户态→内核态：cache 是否必须刷新\n③ 进程切换：TLB 是否必须刷新\n④ 进程切换：cache 是否必须刷新","explanation":"① 不必刷新：用户态与内核态共享同一套页表和虚拟地址空间，模式切换只改变权限位，不改变虚拟地址到物理地址的映射，TLB 中的条目依然有效。② 不必刷新：SRAM cache 采用物理寻址（索引位可以用页内偏移，不必等到翻译完成），条目与“哪个进程在用”无关，模式切换对 cache 没有影响。③ 必须刷新：进程切换会更换页表基址寄存器（CR3），同一个虚拟地址在两个进程中对应不同物理页，旧进程残留的 TLB 条目会让新进程读到错误的数据，因此必须刷新（或用 ASID/PCID 区分不同进程）。④ 不必刷新：cache 按物理地址索引，物理内存的内容不会因为换进程而改变含义，不同进程还可以共享同一块物理页面。故选 A。踩坑点：TLB 是“虚拟地址→物理地址”的缓存，与地址空间绑定；cache 是物理地址的缓存，与进程无关。","tags":["TLB","cache","进程切换","地址翻译"],"options":["①不必刷新 ②不必刷新 ③刷新 ④不必刷新","①不必刷新 ②不必刷新 ③不必刷新 ④不必刷新","①刷新 ②不必刷新 ③刷新 ④刷新","①刷新 ②不必刷新 ③不必刷新 ④刷新"],"answer":0,"kp":"虚拟内存"},{"id":"f2019-10","source":"2019 期末","origin":"exam","lecture":20,"topic":"多层页表的层数计算","type":"single","difficulty":2,"stem":"已知某系统页面长 2KB，页表项 8 字节，采用多层分页策略映射 48 位虚拟地址空间。若限定最高层页表占 1 页，则它可以采用多少层的分页策略？","code":null,"explanation":"页大小 2KB = 2^11 字节，因此页内偏移 VPO 占 11 位，虚拟页号 VPN 共需 48 - 11 = 37 位。每个页表页是一页 2KB，可容纳 2048 / 8 = 256 = 2^8 个页表项，也就是说每一级页表能索引 8 位 VPN（最高层也占 1 页，同样只能索引 8 位）。37 / 8 = 4.625，4 级只能覆盖 4 × 8 = 32 位 VPN，不足以覆盖 37 位；5 级可覆盖 40 位 VPN，足够。因此至少且最多可采用 5 级分页，选 C（题问“可以采用多少层”，在有富余时高位可以留空，所以 5 层是满足条件的最小层数）。踩坑点：先算 VPO，再用“每页可存放的 PTE 数”换算成每级索引位数，最后做除法向上取整。","tags":["多级页表","页表项","层数计算"],"options":["3 层","4 层","5 层","6 层"],"answer":2,"kp":"虚拟内存"},{"id":"f2019-11","source":"2019 期末","origin":"exam","lecture":20,"topic":"TLB 与 cache 命中/缺失时访问物理内存的次数","type":"single","difficulty":2,"stem":"在一个具有 TLB 和高速缓存的系统中，假设地址翻译使用四级页表来进行，且不发生缺页异常，那么在 CPU 访问某个虚拟内存地址的过程中，至少会访问（  ）次物理内存，至多会访问（  ）次物理内存。","code":null,"explanation":"先看最少：如果 TLB 命中了页表项、数据又命中 cache，那么整个地址翻译不需要访问内存，取数据也不需要访问内存，共 0 次。再看最多：TLB 不命中意味着要逐级查四级页表（4 次访存），得到物理地址后访问数据又 miss，需要再从物理内存取一次，共 4 + 1 = 5 次。因此是“至少 0 次、至多 5 次”，选 B。踩坑点：四级页表就是 4 次访存，不要漏掉最后取数的那一次，也不要把“TLB 命中但仍需取数”的情况算进最坏情形。","tags":["TLB","多级页表","访存次数","cache"],"options":["0，4","0，5","1，4","1，5"],"answer":1,"kp":"虚拟内存"},{"id":"f2020-14","source":"2020 期末","origin":"exam","lecture":20,"topic":"页大小变化后四级页表可索引的地址位数","type":"single","difficulty":2,"stem":"假设在 64 位系统下页大小被设置为 16KB，那么采用类似 Core i7 的地址翻译过程，四级页表最多可以索引多少位地址空间？","code":null,"explanation":"先算页内偏移：16KB = 2^14，所以 VPO 占 14 位。Core i7 的每级页表恰好占一页，页表项 8 字节，因此每级页表能存放 16KB / 8B = 2048 = 2^11 个页表项，即每级索引 11 位 VPN。四级页表共索引 4 × 11 = 44 位 VPN，加上 14 位 VPO，总共 58 位，故选 B。A（64）是完整地址宽度，四级页表无法覆盖；C、D 偏小。踩坑点：页表项大小与级数、页大小一起决定了能覆盖多少位，改变页大小会同时改变 VPO 和每级的索引位数。","tags":["多级页表","Core i7","地址位数"],"options":["64","58","54","52"],"answer":1,"kp":"虚拟内存"},{"id":"f2020-15","source":"2020 期末","origin":"exam","lecture":20,"topic":"多级页表的内存开销（最好与最坏情况）","type":"single","difficulty":3,"stem":"为了支持 16G 的虚拟地址空间，采用 3 级页表，页大小为 1KB，页表项大小依旧为 4 字节。现在映射总大小为 1MB 的虚拟地址，其分布未知但分布的最小单位限定为 1 字节，请问实现上述映射的页表结构占用的内存至少、至多分别为多大？","code":null,"explanation":"先确定布局：页大小 1KB = 2^10，所以 VPO 占 10 位；每级页表占一页 1KB、每项 4 字节，能存 256 = 2^8 项，即每级索引 8 位 VPN；三级共 24 位 VPN，加上 10 位偏移正好是 34 位 = 16G，与题设吻合。1MB = 2^20 字节，最小映射单位是 1 字节，因此最多需要 2^20 个不同页面。最省的情况：1MB 虚拟地址恰好连续，占 2^20/2^10 = 1024 个连续页，于是需要 1024 个三级页表项（每页 256 项，占 4 页 = 4KB）、1 个二级页表页（1KB）、1 个一级页表页（1KB），共 6KB。最费的情况：每个字节都落在不同的页上，即 2^20 个互不相邻的页，此时三级页表要用满 256×256 = 65536 页，加上 256 个二级页表页和 1 个一级页表页，共 65536+256+1 = 65793 页 = 65793KB。故选 B。踩坑点：多级页表的内存开销由“用到了多少个不同的地址区间”决定，最坏情况下每个页都要一份完整的页表路径。","tags":["多级页表","页表开销","稀疏地址空间"],"options":["6KB，4113KB","6KB，65793KB","6KB，1052688KB","3KB，4113KB"],"answer":1,"kp":"虚拟内存"},{"id":"f2020-16","source":"2020 期末","origin":"exam","lecture":20,"topic":"由虚拟地址位数与页大小确定页表级数","type":"single","difficulty":2,"stem":"某 64 位系统，物理内存地址长度为 52 位，虚拟内存地址长度为 43 位，已知页的大小为 8KB，采用多级页表进行地址翻译，每级页表都占一页，则需要几级页表：","code":null,"explanation":"与物理地址长度无关（物理地址只影响页框号，不影响页表的级数）。页大小 8KB = 2^13，所以 VPO 占 13 位；虚拟地址共 43 位，于是 VPN 有 43 - 13 = 30 位。每级页表占一页（8KB），页表项 8 字节，可存 8192/8 = 1024 = 2^10 项，即每级索引 10 位 VPN。30 / 10 = 3，恰好需要三级页表，选 B。踩坑点：先算 VPO，再用“一页能放多少 PTE”换算每级索引位数，最后做除法向上取整；物理地址 52 位只是干扰条件。","tags":["多级页表","级数计算","页表项"],"options":["2 级","3 级","4 级","5 级"],"answer":1,"kp":"虚拟内存"},{"id":"f2020-17","source":"2020 期末","origin":"exam","lecture":20,"topic":"页表项各个标志位的设置者","type":"single","difficulty":2,"stem":"在页表条目中，以下哪个条目是由 MMU 在读和写时进行设置，而由软件负责清除：","code":null,"explanation":"选 D。页表项中的 A（访问）位与 D（脏/修改）位是硬件“辅助”记录的信息：MMU 每次访问该页时置 A 位，每次写入该页时置 D 位，操作系统据此判断页面最近是否被访问、是否需要写回，并在换出页面后由软件清除这两位，因此符合“硬件设置、软件清除”。A 错：P 位（存在位）由操作系统在分配/换出页面时设置，MMU 只读取它，缺页时由软件安装页面并置位。B 错：G 位（全局页）由软件设置，用于让内核页在读 CR3 时不被逐出 TLB。C 错：CD（缓存禁用）位也由软件按页面的访问语义设置。踩坑点：A/D 位是硬件写、软件清；P/G/CD 位主要是软件写、硬件读。","tags":["页表项","MMU","脏位","访问位"],"options":["P 位，子页或子页表是否在物理内存中","G 位，是否为全局页（在任务切换时，不从 TLB 中驱逐出去）","CD 位，能/不能缓存子页或子页表","D 位，修改位，是否对子页进行了修改操作"],"answer":3,"kp":"虚拟内存"},{"id":"f2020-18","source":"2020 期末","origin":"exam","lecture":20,"topic":"写时复制（COW）的适用范围","type":"single","difficulty":3,"stem":"关于写时复制（copy-on-write）技术的说法，不正确的是：","code":null,"explanation":"A 不正确（本题选它）：写时复制是 fork 之后父子进程之间的机制——两者最初共享同一批物理页面且这些页被标为只读，任何一方写入时触发保护故障，由内核复制出一个私有副本再改成可写。对等线程共享同一个虚拟地址空间，同一个虚拟页不可能对两个线程给出不同的映射，因此线程之间根本不存在“写时复制”这种语义。B 对：需要 MMU 的页保护触发故障（硬件）加上内核缺页/保护异常处理程序完成复制（软件）。C 对：普通文件的私有映射（MAP_PRIVATE）与匿名文件的私有映射都用 COW 延迟复制。D 对：如共享库的代码页被私有映射时也会在写入时复制；共享（MAP_SHARED）区域的写则直接写回被映射对象。踩坑点：COW 的前提是“两个地址空间”，线程只有一个地址空间。","tags":["写时复制","fork","mmap","线程"],"options":["写时复制既可以发生在父子进程之间，也可以发生在对等线程之间","写时复制既需要硬件的异常机制，也需要操作系统软件的配合","写时复制既可以用于普通文件，也可以用于匿名文件","写时复制既可以用于共享区域，也可以用于私有区域"],"answer":0,"kp":"虚拟内存"},{"id":"f2021-15","source":"2021 期末","origin":"exam","lecture":20,"topic":"TLB 与 SRAM 缓存的寻址方式及切换开销","type":"single","difficulty":2,"stem":"下列关于虚存和缓存的说法中，正确的是：","code":null,"explanation":"D 正确：多数系统采用物理寻址的 SRAM 缓存（索引位来自页内偏移，标签用物理地址），缓存中的条目只与物理地址有关，因此进程切换后旧进程的数据块仍然有效，不同进程还可以共享同一物理页的缓存块，不必刷新缓存。A 错：TLB 是一个“按虚拟地址索引”的小型缓存，每一行存放一个页表项（教材原文：a small, virtually addressed cache where each line holds a block consisting of a single PTE）。B 错：多数系统选择了物理寻址（physical addressing），而不是虚拟寻址。C 错：线程共享同一个虚拟地址空间，线程切换不会改变虚→实映射，因此 TLB 条目不会失效（只有进程切换才需要刷新 TLB）。踩坑点：TLB 按虚拟地址索引、cache 按物理地址索引，这是两类切换开销不同的根源。","tags":["TLB","cache","物理寻址","线程切换"],"options":["TLB 是基于物理地址索引的高速缓存","多数系统中，SRAM 高速缓存基于虚拟地址索引","在进行线程切换后，TLB 条目绝大部分会失效","多数系统中，在进行进程切换后，SRAM 高速缓存中的内容不会失效"],"answer":3,"kp":"虚拟内存"},{"id":"f2021-16","source":"2021 期末","origin":"exam","lecture":20,"topic":"mmap 私有映射与写时复制","type":"single","difficulty":3,"stem":"阅读下列代码（已知文件 “input.txt” 中的内容为 “12”，头文件没有列出）。在 shell 中运行该程序，正常运行时的终端输出应为：","code":"void *Mmap(void *addr, size_t length, int prot, int flags,\n           int fd, off_t offset);\n\nint main() {\n  int status;\n  int fd = Open(\"./input.txt\", O_RDWR);\n  char *bufp = Mmap(NULL, 2, PROT_READ | PROT_WRITE,\n                    MAP_PRIVATE, fd, 0);\n  if (Fork() > 0) {\n    while (waitpid(-1, &status, 0) > 0);\n    *(bufp + 1) = '1';\n    Write(1, bufp, 2);            // 1: stdout\n    bufp = Mmap(NULL, 2, PROT_READ, MAP_PRIVATE, fd, 0);\n    Write(1, bufp, 2);\n  } else {\n    *bufp = '2';\n    Write(1, bufp, 2);\n  }\n  close(fd);\n  return 0;\n}","explanation":"MAP_PRIVATE 建立的是私有映射，写入时靠写时复制（COW）产生一份该页的私有副本，因此对映射区的修改不会回写到文件，父子的修改也互不可见。父进程 fork 后先 wait，所以先看子进程：子进程执行 *bufp = '2' 时触发一次 COW，得到页面副本，此时该副本内容为 \"22\"（第 0 字节改写为 '2'，第 1 字节仍是文件中的 '2'），输出 \"22\"；子进程退出。随后父进程执行 *(bufp+1) = '1'，同样触发 COW 得到自己的副本，内容为 \"11\"（第 0 字节是原来的 '1'，第 1 字节改写为 '1'），输出 \"11\"。最后父进程重新 mmap 一块只读的私有映射，因为前面两次写入都发生在 COW 出来的私有页上，文件本身从未被修改，所以读到的是原始内容 \"12\"，输出 \"12\"。拼接起来是 22 → 11 → 12，即 \"221112\"，选 A。踩坑点：MAP_PRIVATE 的写不会回写文件，子进程的写也不会影响父进程。","tags":["mmap","写时复制","MAP_PRIVATE","fork"],"options":["221112","222121","222112","221111"],"answer":0,"kp":"虚拟内存"},{"id":"f2021-25","source":"2021 期末","origin":"exam","lecture":20,"topic":"TLB 命中时页面的实质权限","type":"multi","difficulty":3,"stem":"IA32 体系采用小端法、32 位虚拟地址和两级页表，页大小 4KB，两级页表结构相同；TLB 采用直接映射、4 位组索引。TLB 有效位为 1 的条目中，索引 5 的 TLB 标记为 0x5515 的条目内容是 0x019fa42d（页表项低 3 位的含义：bit0 P=1 表示存在，bit1 R/W=1 表示可写，bit2 U/S=1 表示内核模式/0 表示用户模式）。若访问虚拟地址 y = 0xd5515213 且 TLB 命中、无缺页，则该地址所具有的实质权限是：（多选题，选对才得分）","code":"TLB（直接映射，4 位组索引，有效条目）：\n索引(十进制)  TLB 标记   内容\n0            0x0400     0x0ec91313\n3            0x02ff     0x5d2bac01\n5            0xd551     0x019fa42d\n11           0x55a6    0xfdd3c66b\n13           0x5515    0xb591926b\n\n页表项格式（低 3 位）：0(P) 存在；1(R/W) 1=可写；2(U/S) 1=内核模式 0=用户模式","explanation":"y = 0xd5515213：低 12 位 0x213 是页内偏移，VPN = 0xd5515。TLB 用 VPN 的低 4 位作组索引：0xd5515 的低 4 位是 0x5，所以索引为 5；TLB 标记是 VPN 的高位部分 0xd551，正好与索引 5 的条目匹配（命中）。该条目内容为 0x019fa42d，低 3 位是 0b101：P=1（存在），R/W=0（只读），U/S=1（内核模式）。因此该页的实质权限是“只读 + 内核模式”，即选项 ②④，故选 [1,3]。注意 U/S=1 在本题的约定中表示内核模式（与通常教材相反，题目已明确给出），不要凭印象作答。踩坑点：先算页内偏移、再算 VPN、再取低 4 位做索引；权限位要严格按题目给出的定义解读。","tags":["TLB","页表项权限","地址翻译"],"options":["可写","只读","用户模式权限","内核模式权限"],"answer":[1,3],"kp":"虚拟内存"},{"id":"f2021-26","source":"2021 期末","origin":"exam","lecture":20,"topic":"缺页故障处理程序引发的 double fault","type":"single","difficulty":3,"stem":"Intel 处理器中有一种特殊的异常，被称为 double fault。此异常发生表明调用某个故障（fault）A 的处理程序后又触发了另一个故障 B。正常情况下，故障 B 会有相应异常处理程序来处理，因此两个故障 B 和 A 可以被顺序解决。但是如果处理器无法正常处理故障 B，或是处理了之后依然无法处理故障 A，就会产生 double fault，并终止（abort）。假设除了缺页异常处理程序外，其他异常处理程序都不会产生新的故障。如果在某次缺页故障时产生了 double fault，其原因可能是：（不定项选择，都选对才得分）","code":null,"explanation":"只有 ③ 可能导致 double fault：如果缺页故障处理程序本身所在的页面不在主存中，那么“调用它”这一动作又会触发一次缺页故障（故障 B），而处理故障 B 又必须调用同一个不在主存的缺页处理程序，于是这个故障永远无法被解决，处理器只能转入 double fault 并终止。① 不成立：CPU 处于内核态时可以执行用户级代码段，U/S=0 只会限制用户态访问，不会产生故障。② 不成立：键盘 Ctrl+C 产生的是外部中断（异步异常），属于中断而不是故障，题目已说明“除缺页处理程序外其他异常处理程序都不会产生新的故障”，且中断不会像故障那样阻塞缺页的解决。踩坑点：double fault 的本质是“处理故障的过程中又发生无法解决的故障”，典型情形就是页表/处理程序自身缺页。","tags":["double fault","缺页异常","异常处理"],"options":["运行缺页故障处理程序时，CPU 上的权限位是内核态，但所执行代码段 U/S=0","运行缺页故障处理程序时，CPU 接收到了键盘发送的 Ctrl+C 信号","缺页故障处理程序没有加载到主存中"],"answer":2,"kp":"异常与进程"},{"id":"f2021-38","source":"2021 期末","origin":"exam","lecture":20,"topic":"TLB 命中时访问物理内存的次数","type":"fill","difficulty":1,"stem":"IA32 体系中，TLB 采用直接映射（4 位组索引），页大小 4KB。现将 cache 清空，访问一个在主存中的虚拟地址，TLB 命中且没有触发缺页异常，这一过程中需要访问物理内存（主存）多少次？","code":"IA32：32 位虚拟地址、4KB 页、两级页表、TLB 直接映射（4 位组索引）\ncache 已清空；被访问的虚拟地址在主存中；TLB 命中；无缺页","explanation":"地址翻译需要的信息已经在 TLB 中（TLB 命中），因此不必访问内存去查一级/二级页表；缺页也不会发生，所以不需要访问磁盘。整个过程中唯一必须访问物理内存的动作就是最后按翻译出的物理地址取出（或写入）那个数据本身，因此只访问物理内存 1 次。踩坑点：TLB 命中省掉的是“查页表”的若干次访存，但取数据的那一次访存无法省；若 cache 命中了数据，则会变成 0 次（本题 cache 已清空）。","tags":["TLB","地址翻译","访存次数"],"options":null,"answer":["1","1 次"],"kp":"虚拟内存"},{"id":"f2021-39","source":"2021 期末","origin":"exam","lecture":20,"topic":"TLB 不命中时访问物理内存的次数","type":"fill","difficulty":2,"stem":"（题设同上，但 TLB 不命中）将 cache 清空，访问一个在主存中的虚拟地址，TLB 不命中且没有触发缺页异常，这一过程中需要访问物理内存（主存）多少次？","code":"IA32：32 位虚拟地址、4KB 页、两级页表、TLB 直接映射（4 位组索引）\ncache 已清空；被访问的虚拟地址在主存中；TLB 不命中；无缺页","explanation":"TLB 不命中时必须走完整的页表查找路径：先访问一级页表（页目录）取出对应的页目录项，得到二级页表的基址（第 1 次访存）；再访问二级页表取出对应的页表项，得到物理页框号（第 2 次访存）；最后按翻译出来的物理地址访问数据本身（第 3 次访存）。因此共 3 次。踩坑点：题设是两级页表，所以是“页目录 + 二级页表 + 数据”三次；若换成四级页表就变成 4 + 1 = 5 次。","tags":["TLB","两级页表","访存次数"],"options":null,"answer":["3","3 次"],"kp":"虚拟内存"},{"id":"f2021-40","source":"2021 期末","origin":"exam","lecture":20,"topic":"两级页表查找与物理地址翻译","type":"fill","difficulty":3,"stem":"（题设：IA32，32 位虚拟地址、4KB 页、两级页表各占一页且结构相同，一级页表基地址为 0x00e66000，物理内存部分内容见 code，小端法）若 TLB 不命中且无缺页，虚拟地址 x = 0x004004d0 对应的二级页表起始地址是多少？（填 16 进制，例如 0x00123000）","code":"一级页表基地址：0x00e66000\n物理内存内容（节选，均为十六进制，按小端法读取 4 字节）：\n  地址        内容\n  00615000    21    00615001 2d    00615002 ee    00615003 c0\n  00e66001    a1    00e66002 a4    00e66003 67\n  00e66004    21    00e66005 57    00e66006 61    00e66007 00\n  2167e000    42    2167e001 67    2167e002 9a    2167e003 7c\n  c0ee2000    6f    c0ee2001 d5     c0ee2002 7e\n  c0ee24d0    48    c0ee24d1 83     c0ee24d2 ec\n  c0ee2d21    11    c0ee2d22 6b     c0ee2d23 82     c0ee2d24 8a","explanation":"x = 0x004004d0：低 12 位 0x4d0 是页内偏移（PPO）；VPN1 = 高 10 位 = 0x004004d0 >> 22 = 0x1；VPN2 = 中间 10 位 = (0x004004d0 >> 12) & 0x3ff = 0x0。一级页表项的地址 = 基址 + VPN1×4 = 0x00e66000 + 4 = 0x00e66004；从该处按小端读取 4 个字节（0x21, 0x57, 0x61, 0x00）得到 0x00615721，其中低 12 位是标志位、高位是物理页框号，因此二级页表页的起始物理地址为 0x00615000。顺带可继续翻译：二级页表项地址 = 0x00615000 + VPN2×4 = 0x00615000，按小端读取 4 字节（0x21, 0x2d, 0xee, 0xc0）得到 0xc0ee2d21，物理页框为 0xc0ee2000，于是 x 的物理地址是 0xc0ee2000 + 0x4d0 = 0xc0ee24d0，该处单字节内容为 0x48。踩坑点：页表项的“物理页框号”要把它低 12 位的标志位屏蔽掉；读取时注意小端法。","tags":["页表查找","物理地址翻译","小端法","VPN"],"options":null,"answer":["0x00615000","0x615000","00615000"],"kp":"虚拟内存"},{"id":"f2024-09","source":"2024 期末","origin":"exam","lecture":20,"topic":"地址翻译：页表方向、TLB、多级页表与大页、CR3","type":"multi","difficulty":2,"stem":"关于虚拟地址和物理地址的转换，下列说法**错误**的是：（多选）","code":null,"explanation":"题目问错误的说法，选 AD。A 错（应选）：页表实现的是虚拟地址到物理地址的映射，方向说反了；CPU 发出虚拟地址，MMU 用页表（配合 TLB）把它翻译成物理地址，不存在“用页表由物理地址反推虚拟地址”的常规机制。B 对：TLB 是 MMU 中专门缓存最近用过的“虚拟页号 → 物理页号”映射的小型相联 cache，命中时无需访存取页表项，从而显著加速地址转换。C 对：48 位虚拟地址、4KB 页时页表是 9+9+9+9+12；改用 2MB 大页后，2MB/4KB = 2^9，页内偏移由 12 位变成 21 位，于是 9+9+9+21 = 48，只需 3 级页表，即少用一级。D 错（应选）：CR3 保存的是一级页表（页目录）的**物理**地址而不是虚拟地址；页表基址必须用物理地址，否则翻译过程会陷入自我依赖。","tags":["页表","TLB","多级页表","大页","CR3"],"options":["在 x86-64 Linux 虚拟内存中，物理地址到虚拟地址的映射是通过页表实现的。","TLB 用于缓存虚拟地址到物理地址的映射，以加速地址转换。","某 x86-64 Linux 中页大小为 4KB，每个页表条目为 8 字节，每个页表占据一页（即 4KB），使用 48 位虚拟地址和 44 位物理地址。如果支持大页（2MB 页），可以减少 1 级页表。","Intel Core i7 体系结构中的 CR3 寄存器用于保存一级页表的虚拟地址。"],"answer":[0,3],"kp":"虚拟内存"},{"id":"f2024-10","source":"2024 期末","origin":"exam","lecture":20,"topic":"内存映射：COW、execve、munmap 与交换空间","type":"single","difficulty":2,"stem":"关于 Linux 内存映射，下列说法**错误**的是：","code":null,"explanation":"A 对：fork 时为了高效复制进程，内核让父子进程共享同一批物理页，并把它们都标记为只读；任何一方写入就触发保护故障，内核再为写入方复制一页，这就是写时复制 COW。B 对：execve 加载新程序并替换当前进程映像，程序计数器被设置为新程序入口（以及动态链接器等）的地址。C 对：munmap 解除该地址区间的映射后，该区间不再有效，再引用会触发保护异常，表现为段错误（Segmentation Fault）。D 错（答案）：交换空间用于在物理内存不足时换出不常用的页面，它的大小直接限制了系统能为进程分配并驻留的虚拟页面总数——二者是有关的，说“无关”不对（只有在物理内存完全够用且从不换出时，交换空间才不成为限制因素）。","tags":["写时复制","execve","munmap","交换空间"],"options":["fork 函数被当前进程调用后，内核将父子进程的页面标记为只读，以支持写时复制（COW）机制。","execve 函数被调用后，程序计数器会被重新设置。","对 munmap 函数删除的区域再引用会导致段错误。","交换空间的大小与当前运行的进程能够分配的虚拟页面总数无关。"],"answer":3,"kp":"异常与进程"},{"id":"f2024-20","source":"2024 期末","origin":"exam","lecture":20,"topic":"超出虚拟地址空间范围的地址属于段错误","type":"single","difficulty":2,"stem":"考虑如下一种小型系统：内存的最基本单位为 Byte，任何数据类型的长度都是 Byte 的整数倍，且按照小端法表示；单个页表项占据 2B，地址编码为 16 位，页大小为 128B，页表为一级页表；目前该系统支持的虚拟地址空间大小为 8KB，实际拥有的物理内存为 2KB。该系统的 CPU 执行指令时取到一条虚拟地址 0x2226，程序运行过程中一定会发生：","code":"页大小           128B\n页表项大小       2B\n地址编码         16 位\n支持的虚拟地址空间 8KB（即合法虚拟地址 0x0000 ~ 0x1FFF）\n物理内存         2KB\n页表级数         一级","explanation":"该系统支持的虚拟地址空间只有 8KB，即合法虚拟地址范围是 0x0000~0x1FFF（页大小 128B，VPN 共 6 位，对应 64 个页表项）；地址编码虽然是 16 位，但高于 8KB 的部分根本不属于该进程可用的虚拟地址空间。0x2226 = 8742 > 8191，其 VPN = 0x2226 >> 7 = 0x44 = 68，已经超过了 64 个页表项所能表示的页号，属于非法地址，内核在地址翻译阶段就会判定为访问非法地址并报段错误（可以类比 64 位系统中用户态访问超过 2^48 的地址空间）。因此选 C。A 错：越界的地址不可能正常完成访存。B 错：缺页异常的前提是虚拟页本身合法（页表项存在但有效位为 0，或页被换出到磁盘），而这里地址已超出整个地址空间，谈不上缺页。","tags":["段错误","虚拟地址空间","VPN","缺页异常"],"options":["正常访存","缺页异常","段错误"],"answer":2,"kp":"虚拟内存"},{"id":"f2024-26","source":"2024 期末","origin":"exam","lecture":20,"topic":"IA32 两级页表：一级页表项地址计算","type":"fill","difficulty":2,"stem":"考虑一个 IA32 体系下的系统：单个页表项占据 4B，地址编码为 32 位，页大小为 4KB，使用了两级页表，每个页表均占据一页；设一级页表（页目录）基址为 0x00E77000。请计算虚拟地址 0x19260817 对应的一级页表项地址（以十六进制方式书写，如 0x012）。","code":"页表项大小   4B\n地址编码     32 位\n页大小       4KB\n页表级数     两级（每个页表占一页）\n一级页表基址 0x00E77000","explanation":"32 位虚拟地址在 4KB 页、两级页表下的划分是：高 10 位为一级页表（页目录）索引、中间 10 位为二级页表索引、低 12 位为页内偏移。把 0x19260817 展开成二进制 0001 1001 0010 0110 0000 1000 0001 0111，取最高 10 位得 0b0001100100 = 100 = 0x64，这就是页目录索引。每个页表项占 4B，所以一级页表项地址 = 一级页表基址 + 索引×4 = 0x00E77000 + 100×4 = 0x00E77000 + 0x190 = 0x00E77190。常见错误：把中间 10 位当成一级索引；忘记乘以页表项大小 4（写成 0x00E77064）；或从最高位开始切错位段（一定要按 10/10/12 从高位往低位切）。","tags":["两级页表","IA32","地址翻译","页目录"],"options":null,"answer":["0x00E77190","0xE77190"],"kp":"虚拟内存"},{"id":"f2024-27","source":"2024 期末","origin":"exam","lecture":20,"topic":"IA32 两级页表：由页目录项求二级页表项地址","type":"fill","difficulty":2,"stem":"接上题：IA32 系统，页表项 4B，地址编码 32 位，页大小 4KB，使用两级页表，一级页表基址 0x00E77000。已知虚拟地址 0x19260817 对应的一级页表项的值为 0x0D000721，则该虚拟地址对应的二级页表项地址为多少？（以十六进制方式书写）","code":"页表项大小       4B\n页大小           4KB\n一级页表基址     0x00E77000\n一级页表项的值   0x0D000721","explanation":"一级页表项的值 0x0D000721 中，高 20 位是二级页表所在的物理页基址，低 12 位是标志位（如有效位 P、读写位 W 等），所以二级页表基址 = 0x0D000721 清掉低 12 位 = 0x0D000000。再看虚拟地址 0x19260817 的中间 10 位（即二级页表索引）：二进制 0001 1001 0010 0110 0000 1000 0001 0111 去掉最高 10 位后取接下来的 10 位，得 0b1001100000 = 608 = 0x260。每个页表项 4B，所以二级页表项地址 = 0x0D000000 + 608×4 = 0x0D000000 + 0x980 = 0x0D000980。常见错误：直接拿 0x0D000721 去加偏移（忘记清掉低 12 位标志位）；把低 12 位也当成基址的一部分；或者把中间 10 位的十进制值算错（正确是 608 而不是别的数）。","tags":["两级页表","页表项标志位","地址翻译","位段划分"],"options":null,"answer":["0x0D000980","0xD000980"],"kp":"虚拟内存"},{"id":"gen-c20-01","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"Core i7 的四级页表","type":"single","difficulty":1,"stem":"关于 Intel Core i7 / Linux 使用的四级页表，下列说法正确的是：","code":null,"explanation":"讲义第 20 讲「End-to-end Core i7 Address Translation」与「Core i7 Page Table Translation」给出：48 位虚拟地址中高 36 位是 VPN、低 12 位是页内偏移；36 位 VPN 被均分为 4 个 9 位字段（VPN1..VPN4），分别用作四级页表的偏移，因此每级恰好有 $2^{9}=512$ 个页表项，每项 8 字节（正好填满一个 4 KB 页），CR3 寄存器保存顶层页表（page global directory）的物理基址。所以 C 对。D 错：只有页内偏移是 12 位，页表索引是 9 位。A 错：第 3/4 级页表项中含 P（存在）、R/W、U/S、WT、A、D、XD 等权限与状态位，MMU 在每次访问时检查它们，这正是虚拟内存提供保护的手段（第 19 讲 p.32）。B 错：每个进程有自己的页表层次（`mm_struct` 中的 `pgd` 指向它），进程切换时要换 CR3，TLB 也需要冲刷或用进程标识区分。","tags":["四级页表","CR3","9 位字段","页表项"],"options":["页表项中不含权限位，访问权限完全由段寄存器检查","顶层页表是所有进程共享的，因此进程切换时不需要改变它","36 位虚拟页号被划分为 4 个 9 位的字段，依次索引四级页表；每级页表有 512 个 8 字节页表项，CR3 保存顶层页表的物理基址","四级页表的每一级都用 12 位偏移来索引，因此每级有 4096 个页表项"],"answer":2,"kp":"虚拟内存"},{"id":"gen-c20-02","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"mmap 接口语义","type":"single","difficulty":1,"stem":"关于用户级内存映射接口 `void *mmap(void *start, int len, int prot, int flags, int fd, int offset)`，下列说法正确的是：","code":null,"explanation":"讲义第 20 讲「User-Level Memory Mapping」说明：`mmap` 把 fd 所指文件从 offset 开始的 len 字节映射到进程虚拟地址空间，`start` 可以为 0 表示「让内核挑一个地址」，返回映射区的起始指针（**可能不等于 start**），`prot` 取 `PROT_READ`/`PROT_WRITE` 等，`flags` 取 `MAP_ANON`/`MAP_PRIVATE`/`MAP_SHARED` 等。所以 D 对、B 错。A 错：映射只是建立虚拟内存区域与磁盘对象的关联，真正的数据靠缺页/按需调页在访问时带入内存（p.41「VM areas initialized by associating them with disk objects」；mmapcopy 例子就是「不把数据搬到用户空间」地复制文件）。C 错：offset 必须按页大小对齐（p.44 也强调多个进程映射同一对象时，虚拟地址的差异必须是页大小的整数倍），而 len 无需是页大小整数倍。","tags":["mmap","按需调页","页对齐","返回值"],"options":["mmap 会立刻把文件的全部内容读入物理内存","返回值一定等于调用时传入的 start","offset 可以是任意字节偏移，不必按页大小对齐","把文件描述符 fd 中从 offset 开始、长度为 len 的内容映射到进程虚拟地址空间；start 为 0 表示由内核选地址，返回值是映射区起始地址（可能不等于 start）"],"answer":3,"kp":"虚拟内存"},{"id":"gen-c20-03","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"地址翻译实例：TLB 命中","type":"single","difficulty":2,"stem":"根据下面的 TLB 与页表，虚拟地址 `0x03D4` 的 VPN、TLB 索引 TLBI 以及最终物理地址 PA 分别是：","code":"系统参数：14 位虚拟地址、12 位物理地址、页大小 64 字节；\n因此 VPN = 高 8 位，TLBI = VPN 的低 2 位（选组），TLBT = VPN 的高 6 位（标记）；\nPPN = 6 位，VPO = PPO = 低 6 位。\n\nTLB：16 项、4 路组相联（4 组 × 4 路），每项为「有效位 V / 标记 TLBT / 物理页号 PPN」\n  组 0:  V=1 TLBT=0x0C PPN=0x2A | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 1:  V=1 TLBT=0x1B PPN=0x37 | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 2:  V=1 TLBT=0x0A PPN=0x15 | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 3:  V=1 TLBT=0x03 PPN=0x0D | V=0 -- -- | V=0 -- -- | V=0 -- --\n\n页表（只列出部分表项，未列出的表项有效位均为 0）：\n  VPN      有效位 V     PPN\n  0x00        1        0x28\n  0x0F        1        0x0D\n  0x18        0         --\n  0x2D        1        0x33\n  0x6D        1        0x37","explanation":"参数决定位划分：14 位 VA，页大小 $64=2^6$，所以低 6 位是 VPO，高 8 位是 VPN。`0x03D4 = 0b00_0011_1101_0100`，VPN $=0x03D4\\gg6=0x0F$，VPO $=0x03D4\\ \\&\\ 0x3F=0x14$。TLB 有 4 组，所以 TLBI 取 VPN 的低 2 位：$0x0F\\ \\&\\ 0x3=3$；TLBT 是剩下的高 6 位：$0x0F\\gg2=0x03$。查组 3，第一项 V=1、TLBT=0x03，命中，得到 PPN $=0x0D$（页表中 VPN=0x0F 的表项也是 V=1、PPN=0x0D，两者一致）。物理地址 = PPN 拼接 PPO（PPO 就是 VPO）：$PA=(0x0D\\ll6)|0x14=0x340+0x14=0x354$，所以 B 对。C 直接把虚拟地址当成物理地址（没有做翻译）；D 把 VPN/VPO 的划分弄错，而且 4 组的 TLB 不可能有 0xC 这样的索引；A 只写了 PPN 左移的结果，把页内偏移 0x14 丢掉了——这是这类题最常见的失分点。","tags":["地址翻译","TLB 命中","VPN","物理地址"],"options":["VPN = 0x0F，TLBI = 3，PA = 0x340","VPN = 0x0F，TLBI = 3，PA = 0x354","VPN = 0x0F，TLBI = 3，PA = 0x3D4","VPN = 0x03，TLBI = 0xC，PA = 0x0D14"],"answer":1,"kp":"虚拟内存"},{"id":"gen-c20-04","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"写时复制页的写操作","type":"single","difficulty":3,"stem":"进程 A 调用 `fork` 创建进程 B 之后，两者共享的私有页在各自的页表中都被标记为只读（写时复制）。随后 A 写其中一个页。关于这个事件，下列说法正确的是：","code":null,"explanation":"讲义第 20 讲「Sharing Revisited: Private Copy-on-write (COW) Objects」说明：私有 COW 区域的页表项被标记为**只读**，因此当某进程试图写入时，「Instruction writing to private page triggers protection fault」，处理程序创建一个新的可读写页（把原页内容复制过去），让该进程的 PTE 指向新页，返回后**重新执行**这条写指令；复制被尽可能推迟（Copying deferred as long as possible）。所以 A 对。B 错：这里页本来就在内存里，有效位为 1，只是权限不允许写，属于保护异常而不是缺页；两者虽然都表现为「重新执行当前指令」，但触发条件与处理方式不同（Linux 把保护违规也报告为 SIGSEGV，但 COW 的处理程序会悄悄建新页而不报错）。C 错：fork 之后两个进程的页表项**指向同一个物理页**并都被标记为只读，正是因为共享才需要 COW。D 错：若真的同时修改同一物理页，就等于父子进程共享内存，那样 fork 的「独立地址空间」语义就被破坏了。讲义 p.47 的「The fork Function Revisited」把这一机制作为 fork 高效实现的关键。","tags":["写时复制","保护异常","fork","页表项权限"],"options":["该写操作触发保护异常（protection fault）；内核为该页创建一个新的可写副本、把 A 的页表项指向新页，返回后重新执行写指令，B 仍然指向原来的页","该写操作触发缺页异常，内核把该页从磁盘重新调入内存","该写操作直接成功，因为两个进程的页表项本来就指向不同的物理页","该写操作会同时修改 B 看到的同一个物理页"],"answer":0,"kp":"异常与进程"},{"id":"gen-c20-05","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"fork 与 execve 的 VM 行为","type":"multi","difficulty":2,"stem":"从虚拟内存的角度看 `fork` 与 `execve`，下列说法正确的有：","code":null,"explanation":"讲义第 20 讲「The fork Function Revisited」写着：为创建子进程的虚拟地址空间，内核创建当前 `mm_struct`、`vm_area_struct` 和页表的精确副本，把两个进程中的每个页都标记为只读，并把两个进程的每个 `vm_area_struct` 都标记为私有 COW；返回后每个进程都有虚拟内存的精确副本，之后的写操作才通过 COW 机制生成新页（A、B 对）。p.48「The execve Function Revisited」写着：释放旧区域的 `vm_area_struct` 与页表，为新区域创建 `vm_area_struct` 与页表；程序的代码与已初始化数据由目标文件支持（file-backed），而 `.bss` 与栈由匿名文件支持，也就是 demand-zero 页，第一次缺页时分配全零的物理页；最后把 PC 设为 `.text` 的入口，Linux 再按需把代码与数据页调入（C、D 对）。E 错：execve 覆盖的是整个进程映像（代码、数据、栈都换掉），只是保留 PID、打开文件与信号上下文，这与第 16 讲「Overwrites code, data, and stack」一致。","tags":["fork","execve","写时复制","demand-zero"],"options":["fork 为子进程复制 `mm_struct`、`vm_area_struct` 和页表，并把两个进程中每个页都标记为只读、每个区域都标记为私有 COW","fork 返回时两个进程看到完全相同的虚拟内存内容，之后各自的写操作通过写时复制才产生新的物理页","execve 会释放旧区域的 `vm_area_struct` 和页表，并为新程序建立新的区域与页表","新程序的 `.bss` 和用户栈由匿名文件支持，首次访问时会分配到全零的物理页（demand-zero）","execve 只替换程序的代码段，数据段和用户栈保持原样"],"answer":[0,1,2,3],"kp":"异常与进程"},{"id":"gen-c20-06","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"共享映射、私有映射与 mmap 用途","type":"multi","difficulty":2,"stem":"关于内存映射（memory mapping）与 `mmap` 的使用，下列说法正确的有：","code":null,"explanation":"讲义第 20 讲「Sharing Revisited: Shared Objects」与「Uses of mmap」说明：映射同一共享对象时，两个进程的虚拟页可以指向同一物理页（虚拟地址可以不同，但差值必须是页大小的整数倍）；`MAP_SHARED` 正是用于共享数据结构，多个进程能访问同一区域，讲义还提醒「Risky!」（A 对）。`MAP_PRIVATE` 区域被标记为私有 COW，PTE 只读，写操作会建立私有副本而不影响文件（B 对）。mmap 只建立 VM 区域与磁盘对象的关联，真正的数据靠按需调页带入（C 对，mmapcopy 例子强调「without transferring data to user space」）。对 `PROT_READ` 区域的写操作触发保护异常，Linux 报告为 SIGSEGV（第 20 讲 p.39 的「Protection exception: e.g., violating permission by writing to a read-only page (Linux reports as Segmentation fault)」），D 对。E 错：只有 `MAP_SHARED` 且 `PROT_WRITE` 的映射，其修改才会在 munmap 或写回时反映到文件，`MAP_PRIVATE` 的修改是私有的，这正与 B 互为反例。","tags":["MAP_SHARED","MAP_PRIVATE","PROT_READ","按需调页"],"options":["用 `MAP_SHARED` 映射同一对象后，多个进程可以访问同一物理页，一个进程的修改对另一个进程可见","用 `MAP_PRIVATE` 映射时区域是写时复制的，对映射区的写操作不会反映到底层文件","映射一个文件并不会立刻把它的全部内容读入内存，而是靠缺页/按需调页把数据带入内存","对以 `PROT_READ` 映射的区域执行写操作会触发保护异常（Linux 会报告为 SIGSEGV）","用 `MAP_PRIVATE` 映射文件后，对映射区的修改会被写回文件"],"answer":[0,1,2,3],"kp":"虚拟内存"},{"id":"gen-c20-07","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"TLB 与地址变换的硬件细节","type":"judge","difficulty":2,"stem":"进程切换时 TLB 中的内容可能失效，处理办法是切换时冲刷 TLB，或给每个 TLB 项关联一个进程标识；另外，由于页内偏移在虚拟地址和物理地址中相同，L1 缓存可以用虚拟地址的索引位先定位组，再用物理地址的标记比较，这种设计称为「虚拟索引、物理标记」。","code":null,"explanation":"判断为真。讲义第 20 讲「Question #4: Aren't the TLB contents wrong after a context switch?」回答：会出错，所以要么在上下文切换时冲刷（flush）TLB，要么给每个 TLB 项关联一个进程标识（ASID/PCID）来区分不同进程（p.17）。后半句对应 p.36「Cute Trick for Speeding Up L1 Access」：决定缓存索引（CI）的那几位在虚拟地址与物理地址中完全相同（因为页内偏移 VPO = PPO，而 CI 落在偏移内），于是 L1 可以在地址翻译进行的同时先用虚拟地址索引定位组，等 TLB 命中拿到 PPN 后再用 PPN 组成的标记（CT）比较，这就是「virtually indexed, physically tagged」，其代价是缓存必须精心设计尺寸才能保证索引位不跨越页边界。两句合起来说明地址翻译与缓存访问如何重叠以降低延迟。","tags":["TLB 冲刷","PCID","虚拟索引物理标记","L1 缓存"],"options":null,"answer":true,"kp":"虚拟内存"},{"id":"gen-c20-08","source":"自编 · 第 20 讲","origin":"created","lecture":20,"topic":"综合地址翻译计算","type":"fill","difficulty":3,"stem":"根据下面的 TLB 与页表，虚拟地址 `0x1B4D` 最终翻译得到的物理地址是多少？请填入十六进制值（形如 `0x····`）____","code":"系统参数：14 位虚拟地址、12 位物理地址、页大小 64 字节；\n因此 VPN = 高 8 位，TLBI = VPN 的低 2 位（选组），TLBT = VPN 的高 6 位（标记）；\nPPN = 6 位，VPO = PPO = 低 6 位。\n\nTLB：16 项、4 路组相联（4 组 × 4 路），每项为「有效位 V / 标记 TLBT / 物理页号 PPN」\n  组 0:  V=1 TLBT=0x0C PPN=0x2A | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 1:  V=1 TLBT=0x1B PPN=0x37 | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 2:  V=1 TLBT=0x0A PPN=0x15 | V=0 -- -- | V=0 -- -- | V=0 -- --\n  组 3:  V=1 TLBT=0x03 PPN=0x0D | V=0 -- -- | V=0 -- -- | V=0 -- --\n\n页表（只列出部分表项，未列出的表项有效位均为 0）：\n  VPN      有效位 V     PPN\n  0x00        1        0x28\n  0x0F        1        0x0D\n  0x18        0         --\n  0x2D        1        0x33\n  0x6D        1        0x37","explanation":"第一步拆地址：页大小 $64=2^6$，所以 VPO 取低 6 位，VPN 取高 8 位。`0x1B4D = 0b01_1011_0100_1101`，VPN $=0x1B4D\\gg6=0x6D$，VPO $=0x1B4D\\ \\&\\ 0x3F=0x0D$（即十进制 13）。第二步查 TLB：4 组对应 TLBI 为 VPN 的低 2 位，$0x6D\\ \\&\\ 0x3=1$；TLBT 为剩余高 6 位，$0x6D\\gg2=0x1B$。组 1 的第一项 V=1、TLBT=0x1B，命中，PPN $=0x37$（页表中 VPN=0x6D 的表项同样是 V=1、PPN=0x37，所以是否命中 TLB 结论一致，也不会缺页）。第三步拼物理地址：PA = (PPN << 6) | PPO，且 PPO = VPO，于是 $PA=(0x37\\ll6)|0x0D=0xDC0+0x0D=0xDCD=3533$。常见错误包括：把 VPN 与 VPO 的位数弄反；忘记 TLBI 只取 2 位而用整个 VPN 当索引；只写 PPN 左移后的 $0xDC0$ 而漏掉页内偏移；以及把 VPO 写成 0（那是页对齐地址的情况）。","tags":["地址翻译","TLB","PPN","十六进制计算"],"options":null,"answer":["0x0DCD","0xDCD","0xdcd","0x0dcd","3533"],"kp":"虚拟内存"},{"id":"f2013-12","source":"2013 期末","origin":"exam","lecture":21,"topic":"外部碎片与内部碎片","type":"single","difficulty":1,"stem":"下列哪个例子是外部碎片？","code":null,"explanation":"外部碎片指空闲内存的总量足够，但因为被分割成许多不连续的小空闲块而无法满足一次较大的请求；多次分配/释放后形成的不连续空闲块正是这种情况。A 属于内部碎片（块内部因对齐或头部/脚部而浪费的空间）；B 是分配器自身的元数据开销（空闲链表指针），不是碎片；D 是内存泄漏，与碎片不是同一概念。踩坑点：内部碎片在“块内”，外部碎片在“块间”。","tags":["动态内存分配","外部碎片","内部碎片"],"options":["分配块时为了字节对齐而多分配的空间","空闲块中互相指向的指针所占据的空间","多次释放后形成的不连续空闲块","用户分配后却从未释放的堆空间"],"answer":2,"kp":"动态内存分配"},{"id":"f2013-13","source":"2013 期末","origin":"exam","lecture":21,"topic":"隐式空闲链表分配器的性质","type":"single","difficulty":2,"stem":"用带有 header 和 footer 的隐式空闲链表实现分配器时，如果一个应用请求一个 3 字节的块，下列说法哪一项是错误的？","code":null,"explanation":"64 位机器上 malloc 返回的载荷地址必须按 16 字节对齐（载荷紧跟在块头之后，且要满足最大对齐要求）。2147549777 = 0x80010011 不是 16 的倍数，不可能作为载荷地址返回，故 D 错。A、B 是教材对三种放置策略的定性比较：最佳适配利用率最高但最慢，下次适配最快但碎片化最严重，故 C 可行——头部 4 字节加上 3 字节载荷经 4 字节对齐后可凑成 8 字节的块。踩坑点：不要把“地址 16 字节对齐”误当成“块大小必须是 16 字节的倍数”。","tags":["malloc","对齐","空闲链表"],"options":["搜索空闲链表时，存储利用率为：best fit > next fit > first fit","搜索空闲链表时，吞吐率为：next fit > first fit > best fit","在 x86 机器上，malloc(3) 实际分配的块大小可能为 8 字节","在 x64 机器上，malloc(3) 返回的地址可能为 2147549777"],"answer":3,"kp":"动态内存分配"},{"id":"f2014-16","source":"2014 期末","origin":"exam","lecture":21,"topic":"栈空间与堆空间","type":"single","difficulty":1,"stem":"有程序段如下，下列说法中正确的是","code":"int foo() {\n    char str1[20], *str2;\n    str2 = (char *)malloc(20 * sizeof(char));\n    free(str2);\n}","explanation":"函数内声明为数组的 str1[20] 是自动变量，大小在编译时确定，由编译器在栈帧中分配；str2 是通过 malloc 向显式分配器申请的，来自堆区。注意 str2 这个指针变量本身位于栈上，但它所指向的那 20 字节内存在堆上，题目问的是“指向的内存”。free 只是把块交还给空闲链表，并不改变“它来自堆”这一事实。","tags":["栈","堆","malloc"],"options":["str1 和 str2 指向的内存都是分配在栈空间内的","str1 和 str2 指向的内存都是分配在堆空间内的","str1 指向的内存是分配在栈空间内的，str2 指向的内存是分配在堆空间内的","str1 指向的内存是分配在堆空间内的，str2 指向的内存是分配在栈空间内的"],"answer":2,"kp":"动态内存分配"},{"id":"f2014-18","source":"2014 期末","origin":"exam","lecture":21,"topic":"空闲块放置策略与碎片分布","type":"single","difficulty":2,"stem":"动态内存管理中，可能会造成空闲链表中，小空闲块，即“碎片”，比较集中的算法是","code":null,"explanation":"首次适配总是从链表头部开始扫描，因此在链表前部反复切出小碎片，碎片在链表前段高度集中；下次适配从上次结束处继续搜索，会把碎片散布到整个链表；最佳适配倾向于把大的空闲块保留下来，小碎片多出现在链表尾部，分布也不集中。因此就“碎片集中”而言答案是首次适配。踩坑点：集中 ≠ 数量多，本题问的是碎片在链表中的聚集程度。","tags":["动态内存分配","首次适配","碎片"],"options":["首次适配算法","下次适配算法","最佳适配算法","以上三种算法无明显区别"],"answer":0,"kp":"动态内存分配"},{"id":"f2015-12","source":"2015 期末","origin":"exam","lecture":21,"topic":"最佳适配对应的空闲链表组织","type":"single","difficulty":2,"stem":"动态管理器分配策略中，最适合“最佳适配算法”的空白区组织方式是","code":null,"explanation":"最佳适配要选“不小于请求的最小空闲块”。若空闲链表按块大小递增排列，从头扫描遇到的第一个满足条件的块就是最佳适配，找到后可立即停止扫描；按地址排列则必须扫描整个链表才能确定谁最小，效率最低；按大小递减排列虽然也能找到，但无法一遇即停，还可能先遇到不合适的块。踩坑点：这正是“按大小排序 / 分离适配”能加速最佳适配的原因。","tags":["最佳适配","空闲链表","组织方式"],"options":["按大小递减顺序排列","按大小递增顺序排列","按地址由小到大排列","按地址由大到小排列"],"answer":1,"kp":"动态内存分配"},{"id":"f2016-11","source":"2016 期末","origin":"exam","lecture":21,"topic":"Mark-and-Sweep 的保守假设","type":"single","difficulty":3,"stem":"在 C 语言中实现 Mark-and-Sweep 算法时，可以基于以下哪个假设？（宿主机为 32 位机器）","code":null,"explanation":"C 语言的保守式垃圾收集器无法区分一个字究竟是整数还是指针，只能假设所有可能是指针的字都按指针对齐——32 位机器上指针 4 字节对齐，于是每个对齐的 4 字节字都被当作候选指针，检查它是否落在堆范围内，B 是可行的假设。A 太强：允许出现指向块内部的指针，简单实现无法要求所有指针都指向块首。C、D 都不对：堆中数据是混合的，收集器拿不到类型信息，也不能只扫描“指针类型的数据”或“长度为 4 字节的数据空间”，它必须扫描整个堆（并对寄存器、栈等根集做同样的保守扫描）。踩坑点：Mark&Sweep 还需要能确定块的边界。","tags":["垃圾收集","Mark-and-Sweep","保守式 GC"],"options":["所有指针指向一个块的起始地址","所有指针数据都是 4 字节对齐","只需要扫描数据类型为指针的堆中的数据空间","只需要扫描所有长度为 4 字节的堆中的数据空间"],"answer":1,"kp":"数据布局与对齐"},{"id":"f2017-10","source":"2017 期末","origin":"exam","lecture":21,"topic":"显式分配器与隐式分配器","type":"single","difficulty":2,"stem":"关于动态内存分配，下列说法中正确的是","code":null,"explanation":"A、B 都不成立：显式分配器必须按请求顺序、在原地满足请求，不能重排请求，更不能移动已分配的块（那会破坏程序持有的指针），因此也无法靠搬移内容来消除外部碎片——能做到这一点的是支持压缩的垃圾收集器。D 错：C 语言没有自动回收机制，不可达的块只能由程序员调用 free，否则就是内存泄漏；把“不可达即回收”交给运行时做的正是隐式分配器（垃圾收集器）。C 成立：隐式分配器需要遍历根集、标记并清扫堆，通常还要暂停用户程序，因此一般比 malloc/free 这类显式分配器慢。踩坑点：显式与隐式的区别在于“由谁发现不再使用的块”。","tags":["动态内存分配","垃圾收集","显式与隐式"],"options":["显式分配器可以重新排列请求顺序，从而最大化内存利用率","显式分配器可以修改已分配的块，把内容复制到别的位置，从而消除外部碎片","通常显式分配器会比隐式分配器更快","C 语言中如果某个已分配块不再可达，那它就会被释放并返回给空闲链表"],"answer":2,"kp":"动态内存分配"},{"id":"f2017-11","source":"2017 期末","origin":"exam","lecture":21,"topic":"分配器设计中的放置策略与合并策略","type":"single","difficulty":3,"stem":"在设计分配器时，下列说法中错误的是","code":null,"explanation":"按教材的定性结论，最佳适配的存储利用率最高，而下次适配因为每次从上次结束处继续搜索、分配位置来回跳跃，碎片更分散，其利用率通常比首次适配更差，因此正确的定性关系是 best fit 优于 first fit，next fit 往往最差，A 的三者排序有误。B 对：有头部（以及用于向前合并的脚部）时，下一个块的头部地址可由当前块的大小直接算出，读取其状态是常数时间。C 对：立刻合并会在“分配—释放—分配”反复交替的请求模式下不断合并又分割，吞吐率下降，这正是引入延迟合并的动机。D 对：用（平衡）二叉树或按大小排序的结构组织空闲块，正是为了把查找适配块的时间从线性降到对数级。","tags":["动态内存分配","适配策略","利用率"],"options":["搜索空闲链表时，存储利用率为：best fit > next fit > first fit","带头部的隐式空闲链表，合并（内存中的）下一个空闲块可在常数时间内完成","如果采取立刻合并策略（immediate coalescing），会在某些请求模式中出现反复合并又分割的情况，于是会有较小的吞吐率","分配器使用二叉树结构，主要是为了能够更快地找到适配的空闲块"],"answer":0,"kp":"动态内存分配"},{"id":"f2020-19","source":"2020 期末","origin":"exam","lecture":21,"topic":"垃圾收集器的根节点","type":"single","difficulty":2,"stem":"垃圾收集器的根节点不包括以下哪个节里的数据：","code":null,"explanation":"选 A（text 节）。垃圾收集器采用可达性分析：从根节点集合出发，沿着指针不断标记，能到达的对象就是存活的。根集合包括寄存器、栈（stack）、数据段（data，含已初始化的全局/静态变量）和 bss 段（含未初始化的全局/静态变量），因为这些位置都可能存放指向堆对象的指针；而 text 段存放的是机器指令（以及只读常量），其中一般不存在指向堆上动态分配对象的指针，因此不需要作为根。踩坑点：不能只看“是不是全局数据”，还要看该节里有没有可能保存指针。","tags":["垃圾收集","根节点","可达性分析"],"options":["text","data","bss","stack"],"answer":0,"kp":"数据布局与对齐"},{"id":"f2021-41","source":"2021 期末","origin":"exam","lecture":21,"topic":"malloc 不清零与 n<0 导致的段错误","type":"fill","difficulty":3,"stem":"考虑如下矩阵-向量乘法代码。用户还测试过：int *y = mat_vec_mul(A, x, n); int z = y[0];（传入 mat_vec_mul 的参数都非零）结果发生了段错误，经 gdb 调试发现 mat_vec_mul 函数内并没有发生段错误，而是在初始化变量 z 时发生段错误。请写出出现这种错误的充分必要条件。","code":"1  int *mat_vec_mul(int **A, int *x, int n)\n2  {\n3      int i, j;\n4      int *y = (int *)malloc(n * sizeof(int));\n5      for (i = 0; i < n; i++)\n6          for (j = 0; j < n; j++)\n7              y[i] += A[i][j] * x[j];\n8      return y;\n9  }\n\n/* 用户测试代码 */\nint *y = mat_vec_mul(A, x, n);\nint z = y[0];   /* 此处发生段错误 */","explanation":"函数内部没有段错误说明循环一次都没有执行（只要 n > 0，y[i] 就会被解引用；一旦 y 为空指针就会在函数内崩溃）。而初始化 z 时段错误说明 y 是无效指针，即 malloc 失败了（返回 NULL）。因此必须有 n ≤ 0；又因题设参数非零，所以 n < 0，这是必要条件。再证充分性：在 64 位 Linux 上，n * sizeof(int) 计算时会把 int 提升为 long 再转成 unsigned long，负数 n 经符号扩展后高位全是 1，乘 4 之后得到的数远超 2^48（用户虚拟地址空间的大小），malloc 必然失败返回 NULL，于是 z = y[0] 解引用空指针触发段错误。因此充分必要条件是 n < 0。踩坑点：① 循环不执行说明 n 不为正；② C 语言的无符号提升会让负的 size 变成天文数字。","tags":["malloc","段错误","无符号提升","内存安全"],"options":null,"answer":["n < 0","n<0","n 为负数"],"kp":"动态内存分配"},{"id":"f2024-16","source":"2024 期末","origin":"exam","lecture":21,"topic":"推迟合并的时间复杂度","type":"single","difficulty":2,"stem":"小明的动态内存分配器采用无脚部的隐式空闲链表组织方式，空闲块合并策略为推迟合并（deferred coalescing）。假设某次合并前堆空间中共有 n 个独立的内存块，则该合并过程的时间复杂度至少为：（单选）","code":null,"explanation":"推迟合并的含义是：释放一个块时并不立即尝试合并相邻空闲块，而是把空闲位先记下来，等到下一次分配（或下一次释放）时才沿着隐式空闲链表从头遍历，边扫描边把相邻的空闲块合并起来。隐式链表只能顺序遍历，即使只做一遍扫描也要访问 n 个块，因此时间复杂度至少是 O(n)，选 C。A（O(1)）是“每块都带脚部、采用立即合并”时才能达到的复杂度；B（O(log n)）需要有序结构（如平衡树、按大小组织的分离空闲链表）才可能达到，隐式链表本身不具备这个能力；D（O(n!)）量级远超任何实际分配器的合并操作，是明显的干扰项。","tags":["隐式空闲链表","推迟合并","时间复杂度"],"options":["O(1)","O(log n)","O(n)","O(n!)"],"answer":2,"kp":"动态内存分配"},{"id":"f2024-17","source":"2024 期末","origin":"exam","lecture":21,"topic":"带脚部的立即合并在常数时间内完成","type":"single","difficulty":2,"stem":"为了提高空闲块合并的效率，小明为每个内存块在结尾处都添加了脚部（footer），并把空闲块合并策略改为立即合并（immediate coalescing）。假设某次释放某个已分配内存块后，堆空间中共有 n 个独立的内存块，则此时的合并操作的时间复杂度至少为：（单选）","code":null,"explanation":"块尾有了脚部（其中复制了块大小）之后，只需常数时间就能定位前一个块和后一个块的头部：由当前块的头部前 4 字节（上一个块的脚部）可得前块大小，由当前块尾部自己的脚部/下一个块的头部可得后块位置。于是释放时检查前后邻居是否为分配位、是否需要合并，都是常数次读写与几次大小字段修改，与堆中块的总数 n 无关，所以复杂度为 O(1)，选 A。B、C 是分离空闲链表或推迟合并（需要线性扫描隐式链表）才需要的复杂度；D 与分配器的合并操作无关。关键记忆点：脚部提供了“向回走”的能力，没有脚部时只能从堆头正向扫描找到前驱，那才是 O(n)。","tags":["脚部","立即合并","边界标记","O(1)"],"options":["O(1)","O(log n)","O(n)","O(n!)"],"answer":0,"kp":"动态内存分配"},{"id":"f2024-18","source":"2024 期末","origin":"exam","lecture":21,"topic":"只给空闲块加脚部时的空间保证","type":"judge","difficulty":2,"stem":"在采用边界标记的动态内存分配器中，内存块按 8 字节对齐。若只对空闲块添加脚部、而不对分配块添加脚部，则释放一个已分配块时，该块内**一定**有足够的空间存放脚部。","code":null,"explanation":"正确。分配块虽然不预留脚部空间，但所有块都按 8 字节对齐，因此最小块也有 8 字节，其中头部已占 4 字节，块尾必然还剩至少 4 字节可以写入脚部；释放时该块变为空闲块，直接在它的末尾补写脚部即可，不会越界覆盖下一个块的头部（分配块不需要脚部，正好省下这 4 字节开销）。需要注意的坑：这个结论成立的前提是“8 字节对齐/最小块大小≥8 字节”，如果允许块小到只剩 3 字节负载，尾部就放不下 4 字节的脚部了；这也是为什么分配器要规定最小块大小。","tags":["边界标记","脚部","对齐","最小块大小"],"options":null,"answer":true,"kp":"高速缓存"},{"id":"lab2025-41","source":"2025 Lab 测验","origin":"exam","lecture":21,"topic":"MallocLab 的返回指针对齐要求","type":"single","difficulty":2,"stem":"MallocLab 实现的分配器需保证返回的指针满足什么样的对齐要求？","code":null,"explanation":"MallocLab 的 writeup 明确要求分配器返回的 payload 指针必须是 **8 字节对齐**（双字对齐），这样才能保证 double、long、指针等 64 位类型总落在正确的边界上；由于块头部通常是 4 字节而 payload 起始地址是 8 的倍数，块的总大小也必须凑成 8 的倍数，这直接影响了放置与合并策略的设计。4 字节对齐不足以保证 double 的对齐（C、A 错），16 字节对齐是更严格的要求（在某些平台上 malloc 会做到 16 字节，但本实验只要求 8）；「根据请求大小动态对齐」既不符合要求，也会破坏空闲块格式的一致性（D 错）。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["MallocLab","对齐","分配器"],"options":["4 字节对齐","8 字节对齐","16 字节对齐","根据请求大小动态对齐"],"answer":1,"kp":"数据布局与对齐"},{"id":"lab2025-42","source":"2025 Lab 测验","origin":"exam","lecture":21,"topic":"MallocLab 中扩展堆的唯一合法途径","type":"single","difficulty":2,"stem":"在 MallocLab 中关于系统调用和库函数的使用，以下说法正确的是？","code":null,"explanation":"MallocLab 提供了一个内存模型（memlib.c），要求分配器通过 `mem_sbrk` 向这个模型申请更多堆空间——它在内部维护模拟的堆边界并返回新扩展区域的起始地址，这是实验的硬性规定（C 对）。A 错：实现 mm_malloc 却调用库函数 malloc 属于自相矛盾（递归/作弊）。B 错：在实验模型中直接调用真实 sbrk 系统调用会与 memlib 的模拟堆冲突，也可能破坏 libc 自身的内存管理。D 错：mmap 虽然是现实中常用的内存管理手段，但本实验的简单模型不使用它，所有堆空间都必须通过 mem_sbrk 统一管理。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["MallocLab","mem_sbrk","堆扩展"],"options":["可以使用 libc 的 malloc","可以使用 sbrk 系统调用来扩展堆","必须通过调用 memlib.c 中的 mem_sbrk 函数来扩展堆","分配大空间时，可以使用 mmap 等内存管理函数"],"answer":2,"kp":"动态内存分配"},{"id":"lab2025-43","source":"2025 Lab 测验","origin":"exam","lecture":21,"topic":"malloc/free/realloc/calloc 的语义","type":"single","difficulty":3,"stem":"以下关于各函数行为的描述中，哪一项是正确的？","code":null,"explanation":"B 正确：realloc 在无法原地扩展时会分配一块新内存、把旧数据拷贝过去，并**自动释放**旧块；用户若再对旧指针调用 free 就会造成 double free（未定义行为）。A 错：C 标准明确规定 free(NULL) 不执行任何操作，是合法且安全的（这也是「释放后置空指针」这一习惯做法的依据）。C 错：calloc(n, size) 不仅参数形式与 malloc 不同，关键区别是它会把分配到的内存**清零**，而 malloc 返回的内容未初始化。D 错：标准规定 realloc(ptr, 0) 等价于 free(ptr)——块被释放，返回值通常为 NULL（具体实现可能不同），而不是保留分配状态并返回原指针。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["MallocLab","realloc","calloc","free"],"options":["free(NULL) 是非法的，会导致程序崩溃或未定义行为","当 realloc 为了扩容而将数据移动到新地址时，旧块会自动被释放，用户不需要再调用其他函数释放该块","calloc 与 malloc 区别仅在于参数形式不同，两个函数分配的内存区域都是未初始化的","realloc(ptr, 0)（其中 ptr 不为 NULL）的行为是将该块的大小标记为 0，但保留该块的已分配状态，并返回原指针"],"answer":1,"kp":"动态内存分配"},{"id":"lab2025-44","source":"2025 Lab 测验","origin":"exam","lecture":21,"topic":"适配策略与吞吐量/利用率的权衡","type":"single","difficulty":3,"stem":"在设计分配器时，需要选择合适的策略在空闲链表中查找空闲块。以下关于查找策略以及空间利用率和吞吐量的描述，哪一项是正确的？","code":null,"explanation":"A 正确：最佳适配（best fit）要遍历整个空闲链表才能确定「最接近请求大小」的块，因而碎片最少、空间利用率最高，但代价是每次分配都很慢；首次适配（first fit）只取第一个够用的块，速度快但容易在链表前部留下小碎片。B 错：best fit 的吞吐量恰恰是最低的（要扫全表），而不是最快。C 错：利用率与吞吐量通常是此消彼长的权衡关系，很难同时最大化，这也是分配器设计需要折衷的根本原因。D 错：内存充裕的机器更应关注吞吐量（速度），因为空间并不稀缺；反过来，嵌入式等内存紧张的场合才更强调空间利用率。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["MallocLab","最佳适配","吞吐量","碎片"],"options":["获得更高的空间利用率往往需要对空闲块进行更彻底（因此也更慢）的扫描，以选出最适合当前需求的块","为了追求极致的吞吐量，总是应该使用最佳适配（best fit）策略，因为它能最快定位到大小刚好合适的块","高空间利用率和高运行速度之间不存在冲突，好的算法可以同时最大化这两个指标","对于内存较大的机器，在设计分配器时应当更关注空间利用率，而不是吞吐量"],"answer":0,"kp":"动态内存分配"},{"id":"lab2025-45","source":"2025 Lab 测验","origin":"exam","lecture":21,"topic":"堆大小 4 GB 限制带来的优化空间","type":"single","difficulty":3,"stem":"虽然实验环境是 64 位的，但 writeup 指出了堆大小有一个特殊限制，并且该限制为我们提供了一种优化思路。这个限制是？","code":null,"explanation":"writeup 规定堆的最大规模不超过 4 GB（2^32 字节）。这条限制的关键意义在于：既然堆内所有地址与偏移都能用 32 位表示，就可以把头部/脚部中的大小字段、以及空闲链表中的前驱/后继「偏移」都压缩成 4 字节整数（而不是 8 字节指针），从而把每块的元数据开销减半、提高有效载荷比例——这正是 MallocLab 中一个经典的高分技巧。B 的 2^64 是理论地址空间而非本实验限制（若真如此则无法做任何压缩）；C、D 与 writeup 的规定无关。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["MallocLab","4GB 限制","元数据压缩"],"options":["堆的大小不会超过 2^32 字节","堆的大小不会超过 2^64 字节","堆大小受限于物理内存大小","堆中的数据不会被交换到外部存储中"],"answer":0,"kp":"动态内存分配"},{"id":"gen-c21-01","source":"自编 · 第 21 讲","origin":"created","lecture":21,"topic":"malloc/free 的语义与约束","type":"single","difficulty":1,"stem":"在 Linux x86-64 上，应用程序通过 `malloc`/`free` 从堆中申请和归还内存。关于这套接口的语义，下列说法**正确**的是：","code":null,"explanation":"讲义第 21 讲“The malloc Package”一页给出接口约定：成功时返回至少 size 字节、在 x86-64 上按 16 字节边界对齐的块；失败时返回 NULL 并把 errno 置为 ENOMEM；free 的参数必须来自之前的 malloc/calloc/realloc。选项 A 错在 free 只能接收 malloc 返回的块首地址——分配器靠块首前面一个字（头部）记录块大小，传块内指针会让堆结构错乱；选项 B 把错误码写成了 EINVAL，正确值是 ENOMEM；选项 D 忽略了 calloc 会把分配到的块清零这一关键差别，讲义正是借此提醒不要想当然地认为堆内存已被清零。同一页还说明 sbrk 由分配器内部用于扩张/收缩堆。","tags":["malloc","free","对齐","errno"],"options":["`free(p)` 中的 `p` 可以是指向某个已分配块内部的任意指针，分配器会自动求出块的起始地址","`malloc` 失败时返回 0，并把 `errno` 置为 `EINVAL`","成功的 `malloc` 返回的块至少有 `size` 字节的可用空间，且起始地址按 16 字节边界对齐","`calloc` 与 `malloc` 完全等价，只是把“总字节数”拆成“元素个数 × 元素大小”两个参数"],"answer":2,"kp":"动态内存分配"},{"id":"gen-c21-02","source":"自编 · 第 21 讲","origin":"created","lecture":21,"topic":"请求块
