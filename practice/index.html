<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="计算机系统导论 ICS / CSAPP 刷题系统：26 讲课件知识点 + 2012–2025 历年真题与自编题，含详细解析。">
<title>ICS 刷题系统 · 计算机系统导论</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='monospace' fill='white' font-weight='bold'>IC</text></svg>">
<style>/* ==========================================================================
   ICS 刷题系统 — 样式表
   ========================================================================== */

:root {
  --bg: #f4f6fb;
  --bg-grad-1: #e8ecf9;
  --bg-grad-2: #f7f4ff;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --surface-3: #eef1f9;
  --border: #e2e6f0;
  --border-strong: #cdd4e6;
  --text: #1b2033;
  --text-2: #5a6480;
  --text-3: #8d97b0;
  --accent: #4f46e5;
  --accent-2: #7c3aed;
  --accent-soft: #eceafe;
  --ok: #0f9d68;
  --ok-soft: #e2f7ee;
  --bad: #e0446a;
  --bad-soft: #fdeaef;
  --warn: #d98a00;
  --warn-soft: #fdf3e0;
  --info: #0d7fa8;
  --info-soft: #e3f3fa;
  --shadow-sm: 0 1px 2px rgba(24, 32, 64, .06), 0 1px 3px rgba(24, 32, 64, .04);
  --shadow: 0 4px 12px rgba(24, 32, 64, .07), 0 1px 3px rgba(24, 32, 64, .05);
  --shadow-lg: 0 18px 40px rgba(24, 32, 64, .13), 0 4px 12px rgba(24, 32, 64, .07);
  --radius: 14px;
  --radius-sm: 9px;
  --radius-lg: 22px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
          "Noto Sans CJK SC", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas,
          "Liberation Mono", Menlo, monospace;
  --speed: .2s;
}

html[data-theme="dark"] {
  --bg: #0e1120;
  --bg-grad-1: #151a33;
  --bg-grad-2: #1a1230;
  --surface: #171c31;
  --surface-2: #1d2340;
  --surface-3: #232a4a;
  --border: #2a3155;
  --border-strong: #3a4370;
  --text: #eef1fb;
  --text-2: #a8b2d4;
  --text-3: #7a85ab;
  --accent: #8b83ff;
  --accent-2: #b18cff;
  --accent-soft: #262a52;
  --ok: #38d39f;
  --ok-soft: #143b2f;
  --bad: #ff7a9c;
  --bad-soft: #40202e;
  --warn: #f5b942;
  --warn-soft: #3d2f14;
  --info: #4cc3e8;
  --info-soft: #12303d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow: 0 4px 14px rgba(0, 0, 0, .35);
  --shadow-lg: 0 18px 44px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  transition: background var(--speed), color var(--speed);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1100px 620px at 8% -8%, var(--bg-grad-1), transparent 62%),
    radial-gradient(900px 560px at 102% 4%, var(--bg-grad-2), transparent 58%);
  pointer-events: none;
}

::selection { background: var(--accent); color: #fff; }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

/* ==========================================================================
   结构
   ========================================================================== */
.app { min-height: 100%; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 10px 22px;
  display: flex; align-items: center; gap: 18px;
}

.brand { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }

.brand-logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 13px; letter-spacing: -.5px;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
}

.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-title { font-weight: 700; font-size: 15.5px; letter-spacing: .2px; }
.brand-sub { font-size: 11.5px; color: var(--text-3); letter-spacing: .3px; }

.nav { display: flex; gap: 3px; margin-left: auto; flex-wrap: wrap; }

.nav-item {
  border: 0; background: transparent; color: var(--text-2);
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 10px; cursor: pointer;
  transition: all var(--speed); white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.nav-item:hover { background: var(--surface-3); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--accent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
}
.nav-item .n-badge {
  font-size: 10.5px; background: var(--bad); color: #fff;
  border-radius: 99px; padding: 0 6px; min-width: 17px; text-align: center;
  font-weight: 700; line-height: 16px; height: 16px;
}

.icon-btn {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); width: 38px; height: 38px; border-radius: 11px;
  cursor: pointer; display: grid; place-items: center; font-size: 16px;
  transition: all var(--speed); flex-shrink: 0;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

.main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 26px 22px 80px; }

.view { display: none; animation: fadeUp .32s ease both; }
.view.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ==========================================================================
   通用组件
   ========================================================================== */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}

.btn {
  font-family: inherit; font-size: 14px; font-weight: 600;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  padding: 9px 17px; cursor: pointer;
  transition: all var(--speed);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: #fff;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 34%, transparent);
}
.btn-primary:hover { box-shadow: 0 7px 20px color-mix(in srgb, var(--accent) 44%, transparent); }

.btn-ok { background: var(--ok); border-color: transparent; color: #fff; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--text); box-shadow: none; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 13px 26px; font-size: 15.5px; border-radius: 13px; }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; padding: 3px 9px;
  border-radius: 7px; background: var(--surface-3); color: var(--text-2);
  white-space: nowrap;
}
.tag-accent { background: var(--accent-soft); color: var(--accent); }
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-bad { background: var(--bad-soft); color: var(--bad); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-info { background: var(--info-soft); color: var(--info); }

.section-head {
  display: flex; align-items: flex-end; gap: 14px;
  margin: 0 0 16px; flex-wrap: wrap;
}
.section-head h2 { margin: 0; font-size: 21px; letter-spacing: -.2px; }
.section-head p { margin: 0; color: var(--text-3); font-size: 13.5px; }
.section-head .spacer { flex: 1; }

.grid { display: grid; gap: 15px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); }

input[type="text"], input[type="number"], input[type="search"], select, textarea {
  font-family: inherit; font-size: 14px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 12px; outline: none;
  transition: all var(--speed); width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
select { cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
                    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 32px;
}
html[data-theme="dark"] select option { background: var(--surface-2); }

/* ==========================================================================
   首页 Hero
   ========================================================================== */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 52%, #a855f7 100%);
  color: #fff; padding: 38px 40px; margin-bottom: 24px;
  box-shadow: 0 20px 50px -14px rgba(79, 70, 229, .55);
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(520px 300px at 92% 10%, rgba(255,255,255,.24), transparent 62%),
    radial-gradient(420px 320px at 6% 108%, rgba(255,255,255,.16), transparent 60%);
  pointer-events: none;
}
.hero::before {
  content: ""; position: absolute; right: -70px; top: -90px;
  width: 320px; height: 320px; border-radius: 50%;
  border: 1.5px dashed rgba(255,255,255,.28);
  animation: spin 44s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hero-inner { position: relative; z-index: 1; }
.hero h1 { margin: 0 0 8px; font-size: 31px; letter-spacing: -.6px; line-height: 1.28; }
.hero p { margin: 0 0 22px; color: rgba(255,255,255,.88); font-size: 14.5px; max-width: 640px; }
.hero-stats { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 24px; }
.hero-stat b { display: block; font-size: 27px; font-weight: 800; letter-spacing: -.8px; }
.hero-stat span { font-size: 12.5px; color: rgba(255,255,255,.8); letter-spacing: .3px; }
.hero-actions { display: flex; gap: 11px; flex-wrap: wrap; }
.hero .btn {
  background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.35);
  color: #fff; backdrop-filter: blur(6px);
}
.hero .btn:hover { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.6); }
.hero .btn-solid { background: #fff; color: var(--accent); border-color: #fff; font-weight: 700; }
.hero .btn-solid:hover { background: #f4f2ff; }

.mode-card {
  padding: 20px; cursor: pointer; text-align: left;
  transition: all var(--speed); position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 6px;
  border-radius: var(--radius);
}
.mode-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.mode-icon {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  font-size: 21px; margin-bottom: 5px;
  background: var(--accent-soft); color: var(--accent);
}
.mode-card h3 { margin: 0; font-size: 16px; }
.mode-card p { margin: 0; font-size: 13px; color: var(--text-3); line-height: 1.6; }

/* ==========================================================================
   讲次网格
   ========================================================================== */
.lec-card {
  padding: 15px 16px; cursor: pointer; transition: all var(--speed);
  display: flex; flex-direction: column; gap: 9px;
  border-radius: var(--radius); position: relative; overflow: hidden;
}
.lec-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.lec-card .lec-no {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  color: var(--accent); letter-spacing: .5px;
}
.lec-card h3 { margin: 0; font-size: 14.5px; line-height: 1.45; }
.lec-card .lec-en { font-size: 11.5px; color: var(--text-3); }
.lec-card .lec-foot { display: flex; align-items: center; gap: 9px; margin-top: auto; padding-top: 7px; font-size: 12px; color: var(--text-3); }

.mini-bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; flex: 1; }
.mini-bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }

/* ==========================================================================
   刷题视图
   ========================================================================== */
.practice-layout { display: grid; grid-template-columns: 278px 1fr; gap: 20px; align-items: start; }

.sidebar {
  position: sticky; top: 82px;
  max-height: calc(100vh - 104px); overflow-y: auto;
  padding: 16px; display: flex; flex-direction: column; gap: 15px;
  border-radius: var(--radius);
}
.side-group { display: flex; flex-direction: column; gap: 9px; }
.side-label {
  font-size: 11.5px; font-weight: 700; color: var(--text-3);
  letter-spacing: .8px; text-transform: uppercase;
}

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12.5px; font-weight: 600; padding: 5px 11px;
  border-radius: 99px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  cursor: pointer; transition: all var(--speed); font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .c-count { font-size: 10.5px; opacity: .72; font-family: var(--mono); }

.lec-list { display: flex; flex-direction: column; gap: 3px; max-height: 330px; overflow-y: auto; padding-right: 3px; }
.lec-list-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--text-2); border: 0; background: transparent;
  font-family: inherit; text-align: left; transition: all var(--speed); width: 100%;
}
.lec-list-item:hover { background: var(--surface-3); color: var(--text); }
.lec-list-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lec-list-item .lno {
  font-family: var(--mono); font-size: 10.5px; width: 22px; flex-shrink: 0;
  color: var(--text-3); text-align: right;
}
.lec-list-item.on .lno { color: var(--accent); }
.lec-list-item .ltxt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lec-list-item .lnum { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }

/* --- 题目卡 --- */
.qwrap { display: flex; flex-direction: column; gap: 15px; }

.qcard { padding: 22px 24px; border-radius: var(--radius); }

.qmeta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.qmeta .spacer { flex: 1; }
.q-index { font-family: var(--mono); font-size: 12px; color: var(--text-3); font-weight: 700; }

.star-btn {
  border: 0; background: transparent; cursor: pointer; font-size: 18px;
  color: var(--text-3); padding: 2px 5px; line-height: 1; border-radius: 7px;
  transition: all var(--speed);
}
.star-btn:hover { background: var(--warn-soft); }
.star-btn.on { color: var(--warn); }

.stem { font-size: 15.5px; line-height: 1.82; margin-bottom: 15px; }
.stem p { margin: 0 0 9px; }
.stem p:last-child { margin-bottom: 0; }

.code-block {
  font-family: var(--mono); font-size: 13px; line-height: 1.62;
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
  border-radius: var(--radius-sm); padding: 13px 15px; margin: 0 0 15px;
  overflow-x: auto; white-space: pre; tab-size: 4; color: var(--text);
}
html[data-theme="dark"] .code-block { background: #11152a; }

.options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }

.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  text-align: left; font-family: inherit; font-size: 14.8px; line-height: 1.68;
  padding: 12px 15px; border-radius: 11px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; transition: all .16s;
}
.opt:hover:not(.locked) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key {
  flex-shrink: 0; width: 25px; height: 25px; border-radius: 7px;
  background: var(--surface-3); color: var(--text-2);
  display: grid; place-items: center; font-weight: 700; font-size: 12.5px;
  font-family: var(--mono); transition: all var(--speed); margin-top: 1px;
}
.opt .txt { flex: 1; min-width: 0; }
.opt .mark { flex-shrink: 0; font-size: 16px; font-weight: 700; margin-top: 1px; }

.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.picked .key { background: var(--accent); color: #fff; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { background: var(--ok); color: #fff; }
.opt.correct .mark { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.wrong .mark { color: var(--bad); }
.opt.locked { cursor: default; }
.opt.locked:hover { transform: none; }

.judge-row { display: flex; gap: 11px; }
.judge-row .opt { justify-content: center; font-weight: 600; }

.fill-row { display: flex; gap: 10px; align-items: center; }
.fill-row input { font-family: var(--mono); font-size: 14.5px; }

.explain {
  margin-top: 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  overflow: hidden;
  animation: fadeUp .28s ease both;
}
.explain-head {
  display: flex; align-items: center; gap: 9px; padding: 10px 15px;
  font-weight: 700; font-size: 13.5px; border-bottom: 1px solid var(--border);
}
.explain.acc .explain-head { background: var(--ok-soft); color: var(--ok); }
.explain.rej .explain-head { background: var(--bad-soft); color: var(--bad); }
.explain-body { padding: 14px 16px; font-size: 14.3px; line-height: 1.85; color: var(--text); }
.explain-body p { margin: 0 0 10px; }
.explain-body p:last-child { margin-bottom: 0; }
.explain-body ul, .explain-body ol { margin: 0 0 10px; padding-left: 22px; }
.explain-body li { margin-bottom: 5px; }
.explain-body strong { color: var(--accent); font-weight: 700; }
.explain-body code {
  font-family: var(--mono); font-size: .89em; background: var(--surface-3);
  padding: 1.5px 5px; border-radius: 5px;
}

.qfoot { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.qfoot .spacer { flex: 1; }

.progress-strip { display: flex; align-items: center; gap: 12px; padding: 11px 17px; }
.progress-strip .txt { font-size: 13px; color: var(--text-2); font-family: var(--mono); white-space: nowrap; }

.empty {
  text-align: center; padding: 60px 24px; color: var(--text-3);
}
.empty .e-icon { font-size: 46px; opacity: .45; margin-bottom: 12px; }
.empty h3 { margin: 0 0 7px; color: var(--text-2); font-size: 17px; }
.empty p { margin: 0 0 18px; font-size: 13.5px; }

/* ==========================================================================
   考试模式
   ========================================================================== */
.exam-setup { max-width: 860px; margin: 0 auto; padding: 30px 32px; }
.exam-setup h2 { margin: 0 0 6px; font-size: 23px; }
.exam-setup > p { margin: 0 0 24px; color: var(--text-3); font-size: 14px; }

.form-row { display: grid; grid-template-columns: 128px 1fr; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px dashed var(--border); }
.form-row:last-of-type { border-bottom: 0; }
.form-row > label { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }

.exam-topbar {
  display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  border-radius: var(--radius); position: sticky; top: 74px; z-index: 30;
  box-shadow: var(--shadow);
}
.exam-timer { font-family: var(--mono); font-size: 25px; font-weight: 700; letter-spacing: 1px; }
.exam-timer.warn { color: var(--warn); }
.exam-timer.danger { color: var(--bad); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 7px; }
.sheet-cell {
  aspect-ratio: 1; border-radius: 9px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  font-family: var(--mono); font-size: 12.5px; font-weight: 700;
  display: grid; place-items: center; transition: all var(--speed); font-family: inherit;
}
.sheet-cell:hover { border-color: var(--accent); }
.sheet-cell.done { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }
.sheet-cell.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.sheet-cell.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.sheet-cell.cur { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent); }

.report-hero { text-align: center; padding: 34px 24px; }
.score-ring { position: relative; width: 168px; height: 168px; margin: 0 auto 18px; }
.score-ring svg { transform: rotate(-90deg); }
.score-ring .val {
  position: absolute; inset: 0; display: grid; place-items: center;
  flex-direction: column; font-family: var(--mono);
}
.score-ring .num { font-size: 41px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.score-ring .pct { font-size: 12.5px; color: var(--text-3); }

/* ==========================================================================
   题库浏览
   ========================================================================== */
.bank-toolbar { display: flex; gap: 11px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.bank-toolbar .search { flex: 1; min-width: 220px; position: relative; }
.bank-toolbar .search input { padding-left: 36px; }
.bank-toolbar .search::before {
  content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; opacity: .6; pointer-events: none;
}

.bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 13px; }
.bank-item {
  padding: 15px 16px; cursor: pointer; transition: all var(--speed);
  display: flex; flex-direction: column; gap: 9px; border-radius: var(--radius);
}
.bank-item:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.bank-item .bi-stem {
  font-size: 13.8px; line-height: 1.62; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.bank-item .bi-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: auto; }

.pager { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 22px; flex-wrap: wrap; }
.pager button {
  min-width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; transition: all var(--speed);
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pager button:disabled { opacity: .4; cursor: not-allowed; }

/* ==========================================================================
   统计
   ========================================================================== */
.stat-tile { padding: 19px 20px; display: flex; flex-direction: column; gap: 3px; border-radius: var(--radius); }
.stat-tile .st-label { font-size: 12.5px; color: var(--text-3); font-weight: 600; letter-spacing: .2px; }
.stat-tile .st-value { font-size: 30px; font-weight: 800; letter-spacing: -1.2px; font-family: var(--mono); }
.stat-tile .st-sub { font-size: 12px; color: var(--text-3); }

.bar-chart { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 168px 1fr 62px; gap: 11px; align-items: center; font-size: 12.8px; }
.bar-row .bl { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.bar-row .bl:hover { color: var(--accent); }
.bar-track { height: 19px; border-radius: 6px; background: var(--surface-3); overflow: hidden; display: flex; }
.bar-seg { height: 100%; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.bar-seg.ok { background: linear-gradient(90deg, #10b981, #34d399); }
.bar-seg.bad { background: linear-gradient(90deg, #f43f5e, #fb7185); }
.bar-row .bv { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); text-align: right; }

.heat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 5px; }
.heat-cell { aspect-ratio: 1; border-radius: 7px; display: grid; place-items: center; font-size: 10.5px; font-family: var(--mono); font-weight: 700; cursor: pointer; transition: all var(--speed); }

/* ==========================================================================
   讲义速览
   ========================================================================== */
.lec-detail { display: flex; flex-direction: column; gap: 15px; }
.kp-list { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.9; }
.kp-list li { margin-bottom: 3px; }
.kp-list li::marker { color: var(--accent); }

/* ==========================================================================
   Toast / Modal
   ========================================================================== */
.toast-host {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 11px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-lg); animation: toastIn .3s cubic-bezier(.2,.9,.3,1.3) both;
  display: flex; align-items: center; gap: 8px; max-width: 88vw;
}
html[data-theme="dark"] .toast { background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.94); } }

.modal-host {
  position: fixed; inset: 0; z-index: 150; display: none;
  align-items: center; justify-content: center; padding: 22px;
  background: rgba(12, 16, 34, .55); backdrop-filter: blur(4px);
}
.modal-host.open { display: flex; animation: fadeUp .2s ease both; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); max-width: 720px;
  width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.modal-head {
  display: flex; align-items: center; gap: 12px; padding: 18px 22px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
  background: var(--surface); z-index: 2; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-head h3 { margin: 0; font-size: 17px; flex: 1; }
.modal-body { padding: 20px 22px; }
.modal-foot { padding: 15px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

.note-box {
  margin-top: 14px; border-radius: var(--radius-sm);
  border: 1px dashed var(--border-strong); background: var(--surface-2); padding: 11px 13px;
}
.note-head { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin-bottom: 7px; }
.note-box textarea {
  border: 0; background: transparent; padding: 0; resize: vertical;
  font-size: 13.5px; line-height: 1.7; min-height: 42px;
}
.note-box textarea:focus { box-shadow: none; }

/* ---------- 数学 / 行内代码 ---------- */
.math {
  font-family: "Cambria Math", "Latin Modern Math", Georgia, var(--font);
  font-style: italic; white-space: nowrap; padding: 0 1px;
}
.math .mop { font-style: normal; }
.math sup, .math sub { font-size: .72em; }
.math sup { vertical-align: super; line-height: 0; }
.math sub { vertical-align: sub; line-height: 0; }
.mfrac {
  display: inline-flex; flex-direction: column; vertical-align: middle;
  font-size: .84em; line-height: 1.18; text-align: center; margin: 0 2px;
  position: relative; top: -.08em;
}
.mfrac .mnum { border-bottom: 1.2px solid currentColor; padding: 0 3px 1px; }
.mfrac .mden { padding: 1px 3px 0; }
.msqrt { white-space: nowrap; }
.msqrt .mrad { border-top: 1.2px solid currentColor; padding: 1px 2px 0; }
code.inline {
  font-family: var(--mono); font-size: .89em; font-style: normal;
  background: var(--surface-3); padding: 1.5px 5.5px; border-radius: 5px;
  color: var(--accent); white-space: nowrap;
}

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .practice-layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; }
  .hero { padding: 28px 24px; }
  .hero h1 { font-size: 24px; }
  .main { padding: 18px 14px 70px; }
  .topbar-inner { padding: 9px 14px; gap: 10px; }
  .brand-sub { display: none; }
  .nav-item { padding: 7px 10px; font-size: 13px; }
  .form-row { grid-template-columns: 1fr; gap: 7px; }
  .bar-row { grid-template-columns: 110px 1fr 48px; }
  .exam-topbar { top: 66px; }
}

@media print {
  .topbar, .sidebar, .qfoot, .exam-topbar { display: none !important; }
}</style>

<script>/* ICS 26 讲知识点清单（依据课程课件整理） */

  {

<script>window.__ICS_QUESTIONS__ = [{"id":"f2024-14","source":"2024 期末","origin":"exam","lecture":1,"topic":"摩尔定律与登纳德缩放定律","type":"single","difficulty":1,"stem":"下列关于摩尔定律的描述，不正确的是：","code":null,"explanation":"A 对：摩尔定律预测芯片上晶体管数量约每 18~24 个月翻一番，这种增长压力确实推动厂商采用 3D 堆叠、FinFET 等技术继续提高单位面积的晶体管数。B 对：晶体管数量增长带来单位成本下降与性能提升，促使半导体产业持续投入研发以获取更高利润，这是产业发展的直接动力。C 错（答案）：登纳德缩放定律失效意味着电压与频率不能继续等比缩小、时钟频率难以再显著提高，但芯片性能并没有停止提升——业界转向多核、专用加速器（GPU/NPU）、异构与 3D 封装等方向继续提高整体性能，所以说“芯片性能无法提升”是错的。D 对：摩尔定律几十年来仍是半导体产业的重要指导原则，并推动了消费电子产品的创新与普及。","tags":["摩尔定律","登纳德缩放","多核","技术趋势"],"options":["摩尔定律预测了芯片上晶体管数量的增长趋势，这种增长在一定程度上推动芯片厂商尝试采用 3D 堆叠技术实现单位面积晶体管数量的增加。","摩尔定律所描述的晶体管数量增长与芯片成本降低的关系，促使半导体产业不断追求技术进步以获取更高利润。","登纳德缩放（Dennard Scaling）定律的失效对摩尔定律产生了负面影响，使得芯片性能无法提升。","尽管面临诸多挑战，摩尔定律在过去几十年间仍然是半导体产业发展的重要指导原则，并推动了消费电子产品的创新和普及。"],"answer":2,"kp":"课程概述与性能"},{"id":"f2024-15","source":"2024 期末","origin":"exam","lecture":1,"topic":"数据密集型与计算密集型应用","type":"single","difficulty":1,"stem":"下列不属于数据密集型（data-intensive）的任务是：","code":null,"explanation":"数据密集型任务的特点是数据量巨大、瓶颈在 I/O 与存储带宽（吞吐），而不是 CPU 的浮点算力。A（每天数亿条销售数据做供应链与趋势分析）、B（望远镜每 3 天产生海量图像并存储）、D（数据中心为全球用户提供搜索、邮件、在线文档，本质是海量数据的存储与检索）都是典型的数据密集型应用。C 是用超级计算机求解大量偏微分方程、做数值模拟，瓶颈在浮点运算峰值与并行规模，属于计算密集型（Compute-Intensive）任务，因此选 C。","tags":["数据密集型","计算密集型","性能瓶颈"],"options":["沃尔玛每天处理数亿件商品销售数据，进行供应链管理和市场趋势分析。","智利的 LSST 望远镜每 3 天扫描整个南部天空，生成大量图像数据并存储。","国家计算流体力学实验室使用“神威·太湖之光”，对“天宫一号”的返回路径进行数值模拟。","谷歌数据中心为全球用户提供网页搜索、邮件收发、在线文档等服务。"],"answer":2,"kp":"浮点数"},{"id":"lab2025-01","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"Linux 常用命令：ls 选项","type":"single","difficulty":1,"stem":"以下哪个 `ls` 命令选项用于显示所有文件（包括以 . 开头的隐藏文件）？","code":null,"explanation":"`-a` 是 all 的缩写，指示 ls 列出目录下的全部条目，显式包含以 . 开头的隐藏文件（如 .bashrc、.git）。`-l`（long）以长格式显示权限、属主、大小、时间等详细信息，但不改变显示范围；`-h`（human-readable）要配合 -l 或 -s 使用，把大小换算成 K/M/G，本身不影响列出哪些文件；`-t`（time）按修改时间排序，同样与是否显示隐藏文件无关。［本题亦见于 2025 期末深度解析报告，两者是同一套试卷。］","tags":["Linux","ls","命令行"],"options":["ls -l","ls -a","ls -h","ls -t"],"answer":1,"kp":"课程概述与性能"},{"id":"lab2025-02","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"cd 命令的特殊参数","type":"single","difficulty":1,"stem":"使用 `cd` 命令时，哪个参数表示「上一次所在目录」？","code":null,"explanation":"`cd -` 是 shell 的内置快捷方式，用于切换到前一次的工作目录，其实现依赖环境变量 $OLDPWD（同时它会把当前目录打印出来，方便确认）。`cd ~` 或直接 `cd` 回到当前用户的家目录；`cd ..` 回到上一级目录；`cd /` 回到系统根目录。注意 `-` 与 `..` 极易混淆：前者是「时间上上一个目录」，后者是「空间上的父目录」。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["Linux","cd","OLDPWD"],"options":["~（波浪符）","..（两个点）","-（减号）","/（斜杠）"],"answer":2,"kp":"课程概述与性能"},{"id":"lab2025-03","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"文件权限位与 chmod","type":"single","difficulty":2,"stem":"执行 `chmod 755 file.py` 后，文件 file.py 的权限是：","code":null,"explanation":"八进制权限的每一位由 读(4) + 写(2) + 执行(1) 相加得到：7 = 4+2+1 = rwx，5 = 4+1 = r-x。因此 755 = rwxr-xr-x：所有者可读写执行，同组用户和其他用户只能读和执行（不能写）。选项 B 对应 644/600 一类的权限；选项 C 把属主与组的位置写反了；选项 D 的后两位是 rw- 即 6，对应 766 而不是 755。脚本文件设置 755 是常见做法，因为执行权限必须有 x 位。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["Linux","chmod","权限"],"options":["所有者：读写执行（rwx），组和其他：读和执行（r-x）","所有者：读写（rw-），组和其他：读（r--）","所有者：读和执行（r-x），组和其他：读写（rw-）","所有者：读写执行（rwx），组和其他：读写（rw-）"],"answer":0,"kp":"课程概述与性能"},{"id":"lab2025-04","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"Linux 命令与命令行易错点","type":"single","difficulty":2,"stem":"下列关于 Linux 命令和命令行的使用，说法**错误**的一项是：","code":null,"explanation":"选 C：`rm` 配合 `-r`（recursive）可以删除非空目录，配合 `-d` 可以删除空目录，所以「删除空目录只能用 rmdir」是错的——rmdir 只是其中一种选择。其余三项都是正确描述：Windows 的文件系统（NTFS/FAT）不支持 Linux 的 rwx 权限位与属主/组信息，用 Windows 工具解压 tar 会丢失这些元数据，也可能破坏大小写敏感的文件名（A 对）；gcc 的 -o 指定输出文件名、-O 指定优化级别（B 对）；grep -i 忽略大小写（D 对）。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["Linux","rm","gcc","grep"],"options":["在 Windows 中解压 tar 文件可能导致权限位丢失和文件名大小写问题，因此最好在 Linux 中使用 tar 命令解压","gcc 命令可用于编译 C 语言代码，其中 -o 选项用来指定输出文件，-O 选项用来指定优化级别","rm 命令用于删除单个文件或多个文件，如果要删除空目录只能用 rmdir 命令","grep 命令中，-i 选项的含义是「忽略大小写」，如 grep -i \"hello\" file.txt 可匹配 Hello、HELLO 等"],"answer":2,"kp":"课程概述与性能"},{"id":"lab2025-05","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"SSH 公钥与私钥的存放","type":"single","difficulty":2,"stem":"使用 `ssh-keygen` 命令可以生成用于 SSH 登录的密钥，该命令通常生成两个文件：公钥 key.pub 和私钥 key。这两个文件应存放在：","code":null,"explanation":"SSH 免密登录的原理是公钥认证：把公钥内容追加到服务器上 ~/.ssh/authorized_keys 中，登录时服务器用公钥验证客户端用私钥生成的签名，因此公钥必须上传到服务器、私钥必须严格保存在本地。私钥是你的身份凭证，任何情况下都不应上传或泄露（B、D 是严重的安全违规）。选项 A 只把公钥留在本地则无法完成服务器端配置，免密登录不会生效。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["SSH","ssh-keygen","公钥认证"],"options":["公钥留存在本地；私钥留存在本地","公钥留存在本地；私钥上传到服务器","公钥上传到服务器；私钥留存在本地","公钥上传到服务器；私钥上传到服务器"],"answer":2,"kp":"网络编程"},{"id":"lab2025-06","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"scp 指定非默认端口","type":"single","difficulty":2,"stem":"远程主机 10.0.0.5 的 SSH 服务端口为 2222（非默认的 22 端口），若要将本地文件 data.tar.gz 复制到该主机 ubuntu 用户的 ~/backup/ 目录，正确的 scp 命令是：","code":null,"explanation":"scp 指定端口必须用**大写** `-P`（小写 `-p` 的含义是 preserve，保留源文件的时间戳与权限模式），且顺序是「源 目标」，远程路径写成 `用户@主机:路径`，所以 `scp -P 2222 data.tar.gz ubuntu@10.0.0.5:~/backup/` 正确。选项 A 用了小写 -p 且源与目标颠倒；选项 C 把端口写成主机名后的第二个冒号，scp 不认这种语法；选项 D 的 `ubuntu:2222@10.0.0.5` 结构混乱。注意 ssh 命令本身才用小写 `-p` 指定端口，scp 与 ssh 在这点上的差异是常见考点。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["scp","端口","文件传输"],"options":["scp -p 2222 ubuntu@10.0.0.5:~/backup/ data.tar.gz","scp -P 2222 data.tar.gz ubuntu@10.0.0.5:~/backup/","scp ubuntu@10.0.0.5:2222:~/backup/ data.tar.gz","scp data.tar.gz ubuntu:2222@10.0.0.5:/backup/"],"answer":1,"kp":"课程概述与性能"},{"id":"lab2025-07","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"Makefile 模式规则","type":"single","difficulty":2,"stem":"在 Makefile 模式规则中，`%.o: %.c` 表示：","code":null,"explanation":"`%` 是模式通配符，`%.o: %.c` 定义的是「目标与依赖同名的模式规则」：对任意基名 foo，foo.o 依赖 foo.c。选项 A 错在把「同名对应」扩大成「全部重编」；选项 C 把模式通配符误解为真实文件名；选项 D 颠倒了 make 的驱动方式——make 是**目标驱动**的，只有当某个 .o 被需要（且不存在或比 .c 旧）时才会去编译对应的 .c，而不是「只要有 .c 就编译」。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["Makefile","模式规则","依赖"],"options":["任一 .c 文件修改后，所有的 .o 文件都需要重新编译","每个 .o 文件依赖对应的同名 .c 文件","当前目录中需要存在一个名为 %.c 的文件，否则 make 会报错","当前目录中如果存在一个名为 %.c 的文件，会编译生成 %.o 文件"],"answer":1,"kp":"课程概述与性能"},{"id":"lab2025-08","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"make 的执行流程","type":"single","difficulty":2,"stem":"关于 `make` 的执行过程，以下说法正确的是：","code":null,"explanation":"命令行未指定目标时，make 的标准行为是取 Makefile 中出现的第一个目标作为默认目标，并只为它及其依赖链服务，因此 B 正确、A 错误。执行顺序由依赖关系构成的有向无环图（DAG）决定：make 递归地先构建依赖、再构建目标，与书写顺序无必然关系（C 错）。D 的错误在于「自行决定」暗示随机或任意，实际上顺序由依赖拓扑唯一确定，只是允许你自由书写规则位置。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["make","默认目标","依赖图"],"options":["make 默认会执行 Makefile 中定义的所有规则","如果没有指定目标，make 会执行第一个规则（第一个目标）","make 会按照规则的书写顺序依次执行","Makefile 中规则的顺序是任意的，make 会自行决定执行顺序"],"answer":1,"kp":"课程概述与性能"},{"id":"lab2025-09","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"汇编与反汇编的工具链","type":"single","difficulty":3,"stem":"关于汇编和反汇编的说法，下列哪个选项是正确的？","code":null,"explanation":"正确流程是：汇编源文件（.s）由汇编器 `as`（或 `gcc -c file.s`）汇编成目标文件 .o，再用 `objdump -d` 读取代码段并反汇编成汇编文本（C 对）。A 的说法过于宽松：机器指令与汇编指令之间存在严格的一一对应关系，反汇编器只是按规则还原助记符和操作数（个别伪指令除外），并不存在「功能相同但不一一对应」的自由度。B 错在「先转回 C 源文件」——汇编器不需要 C 编译器，反向转换也不可行。D 错在 objdump 只是**分析工具**，不具备汇编功能（不能把源码变成机器码），生成字节编码必须靠汇编器。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["反汇编","objdump","gcc","工具链"],"options":["反汇编得到的指令与原来的汇编文件的指令只需保证功能相同，并非一一对应","必须先将汇编代码转换为 C 源文件，然后使用 gcc 编译得到目标文件，最后使用 objdump 反汇编","可以使用 gcc -c 命令将汇编代码直接生成目标文件，然后使用 objdump -d 命令进行反汇编","可以直接使用 objdump 从汇编代码生成指令的字节编码，gcc 在这个过程中没有作用"],"answer":2,"kp":"机器级编程基础"},{"id":"lab2025-10","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"binutils 工具用途","type":"single","difficulty":2,"stem":"在 binutils 中，哪个工具可以用于查看共享库的依赖关系？","code":null,"explanation":"`ldd`（List Dynamic Dependencies）专门用来列出可执行文件或共享库所依赖的动态链接库，输出形如 libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6。`readelf` 用于查看 ELF 文件结构（文件头、段表、节表、符号表、动态节等静态信息）；`nm` 列出目标文件符号表中的符号及其地址与类型；`objdump` 用于反汇编和查看各节内容，虽然通过 -p 也能看到 NEEDED 字段间接得到依赖，但查看依赖关系的专用工具是 ldd。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["binutils","ldd","动态链接"],"options":["ldd","readelf","nm","objdump"],"answer":0,"kp":"链接"},{"id":"lab2025-17","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"GDB 常用命令辨析","type":"single","difficulty":2,"stem":"GDB 是一款功能强大的调试工具，下列关于 GDB 用法的说法**错误**的是：","code":null,"explanation":"选 A：`break explode_bomb` 只是在该函数**入口**停下来，程序并不会自动跳过它；要真正跳过，需要在断点命中后手动修改 PC（如 `set $rip = ...`）或使用 `jump` 命令跳到爆炸检查之后的位置。其余三项都正确：info registers 会列出通用寄存器、%rip、eflags 等全部寄存器状态（B 对）；ni（next instruction）步过函数调用、si（step instruction）步入函数调用（C 对）；p 支持格式化后缀，`p/x $rsp`、`p/d` 分别按十六进制和十进制打印（D 对）。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["GDB","断点","ni/si","print"],"options":["BombLab 中为了避免炸弹爆炸，可使用命令 break explode_bomb 下断点，使程序自动跳过 explode_bomb 函数的执行","命令 info registers 可显示程序中所有寄存器的值，包括 16 个通用寄存器和程序计数器、条件码寄存器等其他寄存器","命令 ni、si 都会执行下一条指令，但如果该指令是函数调用，命令 ni 不会进入函数内部，命令 si 会进入函数内部","命令 p $rsp 表示将 $rsp 寄存器中的值打印出来，如果 p 后面加上 /x 或 /d，表示打印成十六进制或整数的形式"],"answer":0,"kp":"整数与位运算"},{"id":"lab2025-35","source":"2025 Lab 测验","origin":"exam","lecture":1,"topic":"getopt 解析命令行参数","type":"single","difficulty":2,"stem":"在编写缓存模拟器（csim.c）时，推荐使用哪个 C 语言函数来解析命令行参数（如 -s、-E、-b 等）？","code":null,"explanation":"`getopt` 是 POSIX 标准库中专用于解析命令行短选项的函数：通过一个格式串（如 \"s:E:b:t:\"）声明哪些选项带参数，循环调用即可依次取出选项字母与参数值，还能自动处理错误选项，因此最适合 csim 这类需要 -s 5 -E 1 -b 5 -t trace 的程序（B 对）。`scanf` 从标准输入读格式化数据，不处理命令行；`mmap` 用于把文件或设备映射到内存；`fopen` 只负责打开文件。命令行参数本来就以 argv 数组形式交给 main，解析工作应由 getopt 之类的工具完成。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["getopt","命令行参数","csim"],"options":["scanf","getopt","mmap","fopen"],"answer":1,"kp":"高速缓存"},{"id":"m2013-04","source":"2013 期中","origin":"exam","lecture":1,"topic":"GDB 调试与 Bomb Lab","type":"single","difficulty":1,"stem":"做 Bomb Lab 时通常先用 `gdb bomb` 启动调试，然后执行 ___ 命令以 `explode_bomb` 为名字设置断点以防炸弹被引爆，最后执行 ___ 命令开始运行程序。两个空格对应的命令是：","code":null,"explanation":"gdb 中设置断点的命令是 break（可简写为 b 或 br），例如 `break explode_bomb`；启动被调试程序并让它一直运行到断点或结束的命令是 run（简写 r/ru）。选项 A、D 用 st（step，单步进入），无法在 explode_bomb 上停下；选项 B、D 用 go，gdb 里并没有 go 命令（continue 才是继续运行）。故选 C。踩坑点：break 负责「在哪里停」，run 负责「开始跑」，step/next/continue 负责「停下来之后怎么走」。","tags":["GDB","断点","Bomb Lab"],"options":["st，ru","br，go","br，ru","st，go"],"answer":2,"kp":"课程概述与性能"},{"id":"gen-c01-01","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"程序翻译流程与 gcc 工具链","type":"single","difficulty":1,"stem":"在 Linux x86-64 环境下执行命令 `gcc -Og -S sum.c`，得到的产物是：","code":null,"explanation":"C 程序变成可执行文件要经过预处理、编译、汇编、链接四个阶段。`-S` 让编译器在生成汇编代码后停下来，所以产物是汇编文件 sum.s。选项 B 需要 `-c`（再走一步汇编，得到 sum.o）；选项 C 是不加 `-c`/`-S` 时链接器最终产出的可执行文件；选项 D 是只做预处理 `-E` 的产物。这道题考查「程序翻译流程」，即源程序 `p1.c` 经编译器得 `p1.s`、经汇编器得 `p1.o`、再经链接器与静态库合成可执行文件 p 的链条，对应第 1 讲「程序翻译流程」与第 4 讲 gcc 工具链一节。","tags":["工具链","编译流程","gcc"],"options":["汇编代码文件 sum.s","可重定位目标文件 sum.o","可执行文件 a.out","预处理后的 C 代码文件 sum.i"],"answer":0,"kp":"课程概述与性能"},{"id":"gen-c01-02","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"系统抽象层次与 ISA 可见状态","type":"single","difficulty":1,"stem":"从「程序员视角的机器级程序执行模型」来看，下列哪一项**不属于**程序员可见的机器级状态（即写正确的机器代码时需要考虑的状态）？","code":null,"explanation":"课程反复强调「ISA 与微体系结构」的区分：ISA（体系结构）是为了写出正确机器代码而必须了解的接口，包括指令集、寄存器、程序计数器、条件码；而微体系结构是体系结构的具体实现，例如缓存大小、组相联度、主频，它们会影响性能但不改变程序语义，机器代码里也看不到它们。因此 A、B、C 都是程序员可见状态，D 只是实现细节。选项 D 属于第 4 讲「Architecture vs. Microarchitecture」的定义，也呼应第 1 讲关于「计算机抽象概念与实际系统之间的差异」的课程主线。","tags":["抽象","ISA","微体系结构"],"options":["程序计数器（%rip）","通用寄存器组","条件码寄存器（CF/ZF/SF/OF）","高速缓存的组相联度与行大小"],"answer":3,"kp":"ISA与逻辑设计"},{"id":"gen-c01-03","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"存储器层次与局部性","type":"single","difficulty":2,"stem":"把 2048×2048 的 int 二维数组按行拷贝（`copyij`）与按列拷贝（`copyji`）在同一台机器上运行，前者只需约 4.3ms，后者却要约 81.8ms。导致这一差距的最主要原因是什么？","code":null,"explanation":"C 语言的多维数组按「行优先」连续存放，`dst[i][j]` 的地址是基址加 (i*C+j)*4 字节。行内层循环 i 变化时访问的是相邻的 4 字节单元，一次缓存行装载可以服务很多次访问，空间局部性极好；而列内层循环 i 变化时每次跨过一整行（2048*4=8192 字节），几乎每次访问都落在新的缓存行上，缓存不断缺失，所以慢了近 20 倍。选项 B 错：两个函数都是 2048×2048 次迭代，次数相同；选项 C 错：访存次数相同但访问模式不同，这才是关键，且讲义中两个版本都是简单的顺序循环；选项 D 与本题无关（数据规模远小于内存，不涉及交换）。对应第 1 讲「内存性能影响程序性能」与存储层次直觉。","tags":["存储层次","局部性","缓存"],"options":["C 数组按行优先存放，按行访问能连续访问相邻字节，空间局部性好、缓存命中率高","按列拷贝的循环迭代次数比按行拷贝多得多","两者访存次数完全一样，差距完全来自编译器对循环的自动向量化","按列拷贝更快地命中了磁盘上的交换分区"],"answer":0,"kp":"存储层次与局部性"},{"id":"gen-c01-04","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"浮点运算不满足结合律","type":"single","difficulty":2,"stem":"在 `double` 类型下计算表达式 `1e20 + (-1e20 + 3.14)`，结果是：","code":null,"explanation":"括号先算：-1e20 + 3.14。double 的有效位只有 53 位，而 1e20 约为 2^66 量级，其相邻可表示数之间的间隔（ULP）约为 2^66-52=2^14≈1.6×10^4，远大于 3.14，所以 3.14 在加法对齐时被完全舍去，结果仍是 -1e20。再算 1e20 + (-1e20) = 0.0，故答案为 0.0。作为对比，(1e20 + -1e20) + 3.14 会先算出 0.0 再加 3.14 得到 3.14，两者不等，这正是浮点加法不满足结合律的经典例子。选项 A 是改变结合顺序后的结果，选项 C、D 与本题计算不符。对应第 1 讲例 1.2「浮点型不满足结合律：舍入操作会造成精度误差」，以及第 3 讲「浮点加法的数学性质」。","tags":["浮点数","结合律","舍入"],"options":["3.14","0.0","1e20","NaN"],"answer":1,"kp":"浮点数"},{"id":"gen-c01-05","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"Amdahl 定律与并行加速上限","type":"single","difficulty":3,"stem":"某程序的总执行时间中，60% 的部分可以完美并行化，其余 40% 必须串行执行。即使并行部分使用无限多个处理器（并行部分耗时趋于 0），该程序相对单处理器的加速比上限是多少？","code":null,"explanation":"Amdahl 定律给出加速比 S = 1 / ((1-f) + f/N)，其中 f 为可并行比例、N 为处理器数。当 N→∞ 时 f/N→0，故 S 上限为 1/(1-f) = 1/0.4 = 2.5。也就是说，无论加多少处理器，串行的 40% 始终要花掉 40% 的时间，加速比永远无法超过 2.5 倍。选项 A 是取 N=2 时的部分加速效果，选项 C 是把 f 与 1-f 用反的结果，选项 D 忽略了串行瓶颈。该题考查「算法/程序性能分析必须考虑不可并行部分」这一直觉，对应第 1 讲关于并发与并行、程序性能评估的讨论（第 14 讲程序优化中会正式展开 Amdahl 定律）。","tags":["Amdahl定律","并行","性能"],"options":["约 1.67","2.5","4","没有上限，可以任意大"],"answer":1,"kp":"课程概述与性能"},{"id":"gen-c01-06","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"计算机算术与数学算术的差异","type":"multi","difficulty":2,"stem":"关于「计算机系统中的算术 ≠ 数学中的算术」，下列说法正确的有：","code":null,"explanation":"选项 A 正确：(3.14+1e10)-1e10 中 3.14 被舍入掉，结果为 0，而 3.14+(1e10-1e10)=3.14，都是讲义中的原例。选项 B 正确：补码加法就是按位相加再截断，是模 2^w 的加法，天然可交换，溢出只是让结果落在不同的等价类上，不改变交换性。选项 C 错误：整型有上界，x=50000 时 x*x = 2.5e9 超过 INT_MAX，结果为负数（-1794967296），这正是讲义例 1.1「x²≥0 对整型不成立」。选项 D 正确：因为两个浮点数精度可能不同、且运算会引入舍入误差，直接 `a == b` 很危险，常用 fabs(a-b) <= epsilon 判断。选项 E 错误：浮点乘法同样不满足结合律，讲义给出 (1e20*1e20)*1e-20=inf 而 1e20*(1e20*1e-20)=1e20 的反例。对应第 1 讲「五个有趣的现实问题」中的问题 1。","tags":["浮点数","补码","溢出","epsilon"],"options":["浮点加法不满足结合律，例如 (3.14 + 1e10) - 1e10 与 3.14 + (1e10 - 1e10) 的结果不相等","补码加法在位级上满足交换律，即使发生溢出也不影响 a+b 与 b+a 的位模式相同","对任意 `int` 型 x，表达式 `x * x >= 0` 恒成立","比较两个浮点数是否相等时，通常应改判 |a - b| 是否小于一个足够小的 epsilon","浮点乘法满足结合律，因此可以随意调整乘法顺序"],"answer":[0,1,3],"kp":"整数与位运算"},{"id":"gen-c01-07","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"有符号与无符号比较陷阱","type":"judge","difficulty":1,"stem":"阅读下面这段 C 代码（`sizeof` 的返回值类型为无符号的 `size_t`）。判断：程序运行后会输出 `small`。","code":"int array[] = {1, 2, 3};\n#define TOTAL sizeof(array)\n\nint main() {\n    int d = -1;\n    if (d <= TOTAL)\n        printf(\"small\\n\");\n    else\n        printf(\"large\\n\");\n    return 0;\n}","explanation":"答案是「错」，程序实际输出 `large`。原因是 TOTAL 的类型是 `size_t`（无符号，x86-64 上为 8 字节），而 d 是 `int`。当有符号与无符号在同一个表达式中混用时，C 会把有符号操作数隐式转换为无符号：d = -1 被重新解释为 18446744073709551615，这个巨大的无符号数显然不小于 TOTAL（12），于是 if 条件为假，走 else 分支输出 large。陷阱在于「-1 < 12」在数学上成立，但在位级上与无符号数比较时不成立。教训是：混用有符号/无符号极易出错，可以用强制类型转换或全部改用有符号类型修正。对应第 1 讲例 2.1「比较 int 与 unsigned int 时编译器把 -1 当作很大的无符号数」。","tags":["隐式转换","size_t","比较"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"gen-c01-08","source":"自编 · 第 1 讲","origin":"created","lecture":1,"topic":"整型溢出（示例 1.1 的精确值）","type":"fill","difficulty":2,"stem":"在 32 位 `int`（采用补码）的机器上执行语句 `int r = 50000 * 50000;`，请写出 r 的十进制值。","code":null,"explanation":"50000×50000 = 2,500,000,000，而 32 位 `int` 能表示的最大值是 2^31-1 = 2,147,483,647，真实乘积已经溢出。按补码语义，乘法保留低 32 位：2,500,000,000 的十六进制是 0x9502F900，最高位为 1，作为 32 位补码解释即 0x9502F900 - 2^32 = 2,500,000,000 - 4,294,967,296 = -1,794,967,296。这就是讲义例 1.1 中「50000*50000 得到负数」的确切数值，也说明整数乘法在机器上是对 2^w 取模的运算。踩坑点：不要以为溢出的结果一定是「大的正数」，符号翻转后是负的。对应第 1 讲例 1.1 与第 2 讲「有符号乘法保留低 w 位」一节。","tags":["整型溢出","补码","乘法"],"options":null,"answer":["-1794967296","-1,794,967,296"],"kp":"整数与位运算"},{"id":"f2014-01","source":"2014 期末","origin":"exam","lecture":2,"topic":"移位与有符号/无符号字节截断","type":"single","difficulty":2,"stem":"下面程序的输出是","code":"int main() {\n    int x = 0xbadbeef >> 3;\n    char y = (char)(x);\n    unsigned char z = (unsigned char)(x);\n    printf(\"%d %u\\n\", y, z);\n    return 0;\n}","explanation":"0xbadbeef 是正数，算术右移 3 位后为 0x0175b7dd，最低字节是 0xdd = 221。(char) 只取低 8 位，得到位模式 0xdd，按有符号补码解释为 221 - 256 = -35；(unsigned char) 保留同样的位模式但解释为 221。printf 中 char 与 unsigned char 都会先整型提升为 int，所以输出 -35 221。选 C 是把 char 也当成无符号来算；B、D 里的 35 是把 0xdd 当十进制 221 又减去 256 之外的计算错误。踩坑点：x86-64 上 char 默认有符号。","tags":["补码","移位","类型转换"],"options":["-35 221","-35 35","-221 221","-221 35"],"answer":0,"kp":"整数与位运算"},{"id":"f2014-03","source":"2014 期末","origin":"exam","lecture":2,"topic":"算术右移与整数除法的差异","type":"single","difficulty":3,"stem":"假设有下面的程序定义：`int x = a >> 2; int y = (x + a) / 4;`，那么有多少个位于闭区间 [-8,8] 的整数 a 能使得 x 和 y 相等？","code":null,"explanation":"算术右移等价于向下取整（向 -∞ 取整），而整数除法是向 0 截断，两者只有在被除数非负或恰好整除时才一致。逐个验算 a = -8…8：a = -8、-7、-6、-5 时 x = -2，对应 y = -2、-2、-2、-1，其中 -5 不成立；a = -4、-3 时 x = -1，y = -1、-1，都成立；a = -2、-1 时 x = -1，y = 0、0，都不成立；a = 0…6 全部成立；a = 7 时 x = 1、y = 2 不成立；a = 8 时 x = 2、y = 2 成立。成立的是 -8、-7、-6、-4、-3、0、1、2、3、4、5、6、8，共 13 个。踩坑点：负数的 >> 与 / 语义完全不同。","tags":["算术右移","整数除法","向零截断"],"options":["12","13","14","15"],"answer":1,"kp":"整数与位运算"},{"id":"f2016-01","source":"2016 期末","origin":"exam","lecture":2,"topic":"有符号与无符号数的比较","type":"single","difficulty":3,"stem":"C 语言中的 int 和 unsigned 类型的常数进行比较时，下列表达式及描述正确的是（位宽 32 位，TMIN = -2,147,483,648，TMAX = 2,147,483,647）","code":null,"explanation":"有符号数与无符号数混合运算时，有符号数会被隐式转换成无符号数。A 中 0 == 0U 两边都按无符号解释，描述“按有符号数比较”错。B 中 -2147483647-1 = TMIN，转成无符号是 2147483648，故 2147483647U > 2147483648U 为假，正确关系应是 <。C 中 (unsigned)-1 = 4294967295，-2 转无符号为 4294967294，故关系应为 >。D 中 (int)2147483648U 溢出后得到 TMIN = -2147483648，两边都是 int，比较按有符号进行，2147483647 > -2147483648 为真，表达式与描述都正确，故选 D。踩坑点：比较之前先判断是否发生了隐式类型提升。","tags":["无符号","类型转换","比较"],"options":["0 == 0U，按有符号数进行比较","2147483647U > -2147483647-1，按无符号数进行比较","(unsigned)-1 < -2，按无符号数进行比较","2147483647 > (int)2147483648U，按有符号数进行比较"],"answer":3,"kp":"整数与位运算"},{"id":"f2019-03","source":"2019 期末","origin":"exam","lecture":2,"topic":"整数除法取整方向与算术移位","type":"single","difficulty":2,"stem":"int x = -2019; a, b, c 的取值如下，a、b、c 的大小关系是什么？","code":"int x = -2019;\nint a = (x / 8) * 8;\nint b = ((x + 7) >> 3) << 3;\nint c = -(((~x) + 1) >> 3) << 3;","explanation":"关键是区分两条取整规则：C 语言的整除向零取整，算术右移向下（-∞）取整。a：-2019/8 = -252.375，向零取整得 -252，乘 8 得 -2016。b：(x+7) = -2012，-2012>>3 是算术右移，相当于 floor(-2012/8) = floor(-251.5) = -252，再左移 3 位得 -2016，可见 (x+7)>>3 正是用“先加偏移再移位”来模拟向零取整的除法。c：(~x)+1 = -x = 2019，2019>>3 = floor(252.375) = 252（正数时向零与向下取整一致），<<3 得 2016，再取负得 -2016。三者都等于 -2016，选 A。踩坑点：对负数直接 x>>3 会向下取整得到 -253，与 x/8 的 -252 不同；这正是编译器为“除以 2^k”生成修正指令的原因。","tags":["补码","算术移位","整除取整"],"options":["a = b, b = c","a = b, b > c","a < b, b < c","a < b, b = c"],"answer":0,"kp":"整数与位运算"},{"id":"f2020-03","source":"2020 期末","origin":"exam","lecture":2,"topic":"补码运算恒等式与 overflow","type":"single","difficulty":3,"stem":"在 int 类型值为 32 位、用补码表示、采用算术右移，unsigned 类型值也为 32 位的机器上，声明 int x, y; unsigned ux = (unsigned)x; unsigned uy = (unsigned)y; 则下列表达式中，当 x 与 y 取遍所有可能值时，可能为假的是：","code":null,"explanation":"A 可能为假：取 x = INT_MIN（即 -2147483648），y = 0。此时 x < y 为真；而 -x 发生溢出，结果仍是 INT_MIN（负数），-y = 0，于是 -x > -y 为假，两边不等，命题被推翻。根源是补码的最小负数取相反数会溢出。B 恒真：~x = -x-1，~y = -y-1，所以 ~x+~y+1 = -(x+y)-1 = ~(x+y)（模 2^32 意义下成立）。C 恒真：无符号减法 (ux-uy) 与 (unsigned)(y-x) 取负都是模 2^32 的加法逆元，两边逐位相同。D 恒真：算术右移是向下（-∞）取整，再左移相当于把低 3 位清零，得到的数只可能小于等于原值（例如 -2019>>3<<3 = -2024 ≤ -2019）。故选 A。踩坑点：整数恒等式要警惕 INT_MIN 取负溢出这种极端值。","tags":["补码","溢出","算术右移","位运算"],"options":["(x < y) == (-x > -y)","~x + ~y + 1 == ~(x + y)","((ux - uy) == -(unsigned)(y - x))","((x >> 3) << 3) <= x"],"answer":0,"kp":"整数与位运算"},{"id":"lab2025-11","source":"2025 Lab 测验","origin":"exam","lecture":2,"topic":"用符号位判断乘 2 溢出","type":"single","difficulty":3,"stem":"下面给出了 satMul2 函数的代码，其中变量 overflow 在结果溢出时被置为 0xFFFFFFFF，否则为 0。哪个选项正确给出了 overflow 的表达式？（提示：可根据 x 和 2*x 的符号位判断是否溢出）","code":"/*\n * satMul2 - multiplies by 2, saturating to Tmin or Tmax if overflow\n *   Examples: satMul2(0x30000000) = 0x60000000\n *             satMul2(0x40000000) = 0x7FFFFFFF (saturate to TMax)\n *             satMul2(0x90000000) = 0x80000000 (saturate to TMin)\n */\nint satMul2(int x) {\n  int overflow, negative_x, raw_result, tmin, tmax;\n  overflow = ____________________;\n  negative_x = x >> 31;\n  raw_result = x << 1;\n  tmin = 1 << 31;\n  tmax = tmin + ~0;\n  return (overflow & negative_x & tmin) | (overflow & ~negative_x &\n          tmax) | (~overflow & raw_result);\n}","explanation":"有符号数乘 2 溢出的充要条件是「结果的符号位与原数的符号位不同」：正数乘 2 若超过 TMax 会变成负数，负数乘 2 若低于 TMin 会变成正数。`x << 1` 正是 2*x 的位模式，`x ^ (x << 1)` 取两者符号位的异或（其余位的结果会被随后的算术右移丢弃），再 `>> 31` 做算术右移把符号位扩展成全 1 或全 0，就得到 overflow = 0xFFFFFFFF 或 0。选项 A（x+1）、B（x + ~0 即 x-1）与溢出无关；选项 D 的 `x >> 1` 是除法而不是乘法，无法检测乘 2 的溢出。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["溢出检测","移位","饱和运算"],"options":["(x ^ (x + 1)) >> 31","(x ^ (x + ~0)) >> 31","(x ^ (x << 1)) >> 31","(x ^ (x >> 1)) >> 31"],"answer":2,"kp":"整数与位运算"},{"id":"lab2025-12","source":"2025 Lab 测验","origin":"exam","lecture":2,"topic":"并行异或折叠计算","type":"single","difficulty":3,"stem":"下面给出了 bitParity 函数的代码，该函数用于判断整数 x 的二进制表示中某类位的个数是否为奇数。设 x 的二进制表示为 x[31]x[30]...x[1]x[0]，则执行 `x1 = x ^ (x >> 16);` 之后，x1[15] 的值可表示为：","code":"/*\n * bitParity - returns 1 if x contains an odd number of 0's\n *   Examples: bitParity(5) = 0, bitParity(7) = 1\n */\nint bitParity(int x) {\n    int x1, x2, x3, x4, x5;\n    x1 = x ^ (x >> 16);\n    x2 = x1 ^ (x1 >> 8);\n    x3 = x2 ^ (x2 >> 4);\n    x4 = x3 ^ (x3 >> 2);\n    x5 = x4 ^ (x4 >> 1);\n    return x5 & 1;\n}","explanation":"`x >> 16` 把原来的第 k 位搬到第 k-16 位，于是 x1 的第 15 位来自「x 的第 15 位」与「x 的第 15+16 = 31 位」的异或，即 x[31] ^ x[15]。这就是并行异或折叠（XOR fold）的第一步：每轮把高半部分与低半部分对齐后异或，位数减半，依次是 16、8、4、2、1，共 5 步后所有 32 位的异或和集中到最低位 x5[0]，再由 `x5 & 1` 取出。异或满足结合律与交换律，所以折叠的先后顺序不影响最终结果。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["异或折叠","奇偶校验","位运算"],"options":["x[31] ^ x[15]","x[31] ^ x[16]","x[30] ^ x[15]","x[30] ^ x[16]"],"answer":0,"kp":"整数与位运算"},{"id":"lab2025-14","source":"2025 Lab 测验","origin":"exam","lecture":2,"topic":"字节交换的位运算实现","type":"single","difficulty":3,"stem":"下面给出了 byteSwap 函数的代码，该函数交换参数所指定的两个字节的数据。哪一个选项正确给出了 (1) 和 (2) 处应当填写的内容？","code":"/*\n * byteSwap - swaps the nth byte and the mth byte\n *  Examples: byteSwap(0x12345678, 1, 3) = 0x56341278\n *            byteSwap(0xDEADBEEF, 0, 2) = 0xDEEFBEAD\n *  You may assume that 0 <= n <= 3, 0 <= m <= 3\n */\nint byteSwap(int x, int n, int m) {\n    int n8 = n << ___(1)___;\n    int m8 = m << ___(1)___;\n\n    int swap_byte = ((x >> m8) __(2)__ (x >> n8)) & 0xff;\n\n    return x ^ (swap_byte << n8) __(2)__ (swap_byte << m8);\n}","explanation":"(1) 处要把「字节序号」换算成「位序号」，一个字节有 8 位，所以是左移 3 位（n*8），而不是左移 8。(2) 处要完成两个字节的交换，标准技巧是三次异或（利用 x^y^y = x 的可逆性）：先用 `((x>>m8) ^ (x>>n8)) & 0xff` 取出两个字节的差异，再把这份差异分别异或回 n 字节与 m 字节的位置，于是两个字节互换、其余位不变。若用 `|`（或）则无法撤销原有位、也无法实现交换（C、D 错）。这是 Data Lab 中「不用临时变量交换」思想的位级应用。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["位运算","异或交换","字节操作"],"options":["(1) 3   (2) ^","(1) 8   (2) ^","(1) 3   (2) |","(1) 8   (2) |"],"answer":0,"kp":"整数与位运算"},{"id":"lab2025-15","source":"2025 Lab 测验","origin":"exam","lecture":2,"topic":"奇数位置 1 的掩码构造","type":"single","difficulty":2,"stem":"下面给出了 oddBits 函数的代码，该函数将所有奇数位（j 为奇数的 x[j]）设置为 1。哪个选项给出了 byte 的正确设置？","code":"/*\n * oddBits - return word with all odd-numbered bits set to 1\n */\nint oddBits(void) {\n  int byte = ________;\n  int word = byte | byte << 8;\n  return word | word << 16;\n}","explanation":"要求把第 1、3、5、7、…位（下标为奇数）置 1，而 0xAA = 10101010 恰好是「偶数下标为 0、奇数下标为 1」的模式（bit0 = 0，bit1 = 1，bit2 = 0，bit3 = 1…），故 byte 取 0xAA。随后 `byte | byte<<8` 把 8 位模式复制到低 16 位，`word | word<<16` 再复制到高 16 位，三次或运算就铺满 32 位——这是「把 8 位常量扩展成 32 位重复模式」的通用套路。0x55 = 01010101 是偶数位置 1，恰好是本题要求的反面；0x11 只有 bit0、bit4 为 1；0xff 则所有位都置 1。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["位掩码","常量扩展","位运算"],"options":["0x55","0xAA","0x11","0xff"],"answer":1,"kp":"整数与位运算"},{"id":"m2012-01","source":"2012 期中","origin":"exam","lecture":2,"topic":"整数除法与算术右移的舍入方向","type":"single","difficulty":2,"stem":"在 32 位机器上执行 `int x = -31/8;` 与 `int y = -31 >> 3;`（有符号数的右移按算术右移解释）。x 与 y 的值分别是：","code":null,"explanation":"C 语言的整数除法向零取整：-31/8 = -3（31/8 = 3 余 7，丢掉小数部分且商的符号随被除数，故为 -3）。而算术右移是向负无穷取整：-31 = 0xFFFFFFE1，右移 3 位相当于除以 8 后向下取整，-3.875 → -4，所以 y = -4。两者不同，选 C。选项 A 把算术右移当成向零取整；选项 B 把除法也当成向下取整；选项 D 恰好把两个结果对调。踩坑点：只有被除数非负且能被整除时 `>>` 与 `/` 才一致；编译器把「除以 2 的幂」优化成移位时，必须为负数补上修正项（先加 2^k-1 再右移）。","tags":["补码","算术右移","整数除法"],"options":["x = -3，y = -3","x = -4，y = -4","x = -3，y = -4","x = -4，y = -3"],"answer":2,"kp":"整数与位运算"},{"id":"m2012-02","source":"2012 期中","origin":"exam","lecture":2,"topic":"移位截断与有符号/无符号字符的扩展","type":"single","difficulty":2,"stem":"下面的 printf 语句输出是什么？","code":"int x = 0x15213F10 >> 4;\nchar y = (char) x;\nunsigned char z = (unsigned char) x;\nprintf(\"%d, %u\", y, z);","explanation":"0x15213F10 逻辑/算术右移 4 位得 0x015213F1，取最低字节 0xF1：作为有符号 char，0xF1 = 1111 0001B 的最高位为 1，按补码解释为 -15；作为 unsigned char，0xF1 = 241。printf 中 %d 按 int 打印 -15，%u 按无符号打印 241，故选 B。选项 A、C 得到 -241（0xF1 被当成 8 位无符号再取负，或误把整个 x 当 char）；选项 D 的 15 是把 0xF1 的高半字节丢掉、只取了低 4 位 0x1，属于典型截断错误。踩坑点：char 是否有符号由实现决定，本题按有符号 char 计算。","tags":["移位","符号扩展","截断"],"options":["-241, 15","-15, 241","-241, 241","-15, 15"],"answer":1,"kp":"整数与位运算"},{"id":"m2012-04","source":"2012 期中","origin":"exam","lecture":2,"topic":"x86-64 的字长、指针与对齐","type":"single","difficulty":1,"stem":"关于 x86-64 体系结构，下列说法中**错误**的是：","code":null,"explanation":"x86-64 中 double 与指针都是 8 字节（64 位），通用寄存器也扩宽到 64 位，A、B、C 均正确。D 错在把「基本类型的对齐要求」当成了「指针取值的限制」：x86-64 只要求 double、指针等按自身大小对齐（8 字节对齐），char/short 可以落在任意地址上，相邻对象的地址完全可以只差 1 个字节，并不存在「必须相隔 64 位的整数倍」的规定。踩坑点：对齐（alignment）约束的是编译器为变量分配的地址，不是指针变量本身的取值规律。","tags":["x86-64","指针","对齐"],"options":["double 类型长 64 位","通用寄存器长 64 位","指针长 64 位","指针所指向的内存地址之间都相隔 64 位的整数倍"],"answer":3,"kp":"数据布局与对齐"},{"id":"m2012-06","source":"2012 期中","origin":"exam","lecture":2,"topic":"补码的表示范围","type":"single","difficulty":1,"stem":"32 位二进制补码整数的最小值（最负的值）是多少？","code":null,"explanation":"w 位补码的表示范围是 [-2^(w-1), 2^(w-1)-1]，取 w = 32 得最小值 TMin = -2^31 = -2147483648，其位模式为 0x80000000（最高位为 1、其余为 0）。选项 A、B 是 32 位无符号数所能表达的极端量级，早就越界；选项 D 是「最小的负数加 1」。踩坑点：TMin 的相反数仍是它自己（-TMin 溢出回绕），这也是数据实验中 -x 相关陷阱的来源。","tags":["补码","TMin","表示范围"],"options":["$-2^{32}$","$-2^{32}+1$","$-2^{31}$","$-2^{31}+1$"],"answer":2,"kp":"整数与位运算"},{"id":"m2013-01","source":"2013 期中","origin":"exam","lecture":2,"topic":"小端法与大端法的字节排列","type":"single","difficulty":1,"stem":"变量 x 的值为 0x01234567，地址 &x 为 0x100。该变量的 4 个字节在 x86 机器与 Sun 机器内存中，从地址 0x100 到 0x103 的排列顺序分别是：","code":null,"explanation":"x86 采用小端法（little endian）：最低有效字节存放在最低地址，0x01234567 的最低位字节 0x67 放在 0x100，随后依次是 0x45、0x23、0x01。Sun（SPARC）采用大端法（big endian）：最高有效字节放在最低地址，0x100 处是 0x01，然后 0x23、0x45、0x67。因此选 A。B 把字节序理解成「每个字节内部也翻转」，0x67 并不会变成 0x76；C 把两种机器的顺序弄反；D 认为两种机器排列相同，忽略了大端法。踩坑点：字节序只影响多字节对象的字节顺序，不影响单个字节内部的位序。","tags":["小端法","大端法","字节序"],"options":["x86：67 45 23 01；Sun：01 23 45 67","x86：76 54 32 10；Sun：01 23 45 67","x86：01 23 45 67；Sun：67 45 23 01","x86：01 23 45 67；Sun：01 23 45 67"],"answer":0,"kp":"整数与位运算"},{"id":"m2013-02","source":"2013 期中","origin":"exam","lecture":2,"topic":"有符号/无符号混合运算与补码回绕","type":"multi","difficulty":3,"stem":"假设下列 int 与 unsigned 数均为 32 位，以下表达式正确的是（不定项选择）：","code":"int x = 0x80000000;\nunsigned y = 0x00000001;\nint z = 0x80000001;","explanation":"A 对：x = 0x80000000 就是 TMin，它的相反数发生补码溢出后仍是 TMin，所以 -x < 0 成立。B 对：-1 是 int，与 unsigned 的 y 比较时按无符号转换，-1 变成 0xFFFFFFFF，远大于 1。C 对：左移 3 位在机器上等价于乘 8，0x80000001<<3 = 0x00000008，而 z*8 按 2^32 取模同样是 8。D 按严格 C 语义**不成立**：减法运算符的优先级高于移位，`z<<5 - z<<3` 实际被解析为 `(z << (5-z)) << 3`，而不是 (z<<5)-(z<<3)；只有当它被理解为 (z<<5)-(z<<3) 时才有 32-8 = 24 = y*24。官方答案把 D 也算对，但注明「考虑到运算符优先顺序，选 ABC 也算对」，本题库取严格 C 语义的 ABC。踩坑点：移位运算符优先级低于加减法，写复杂移位表达式时务必加括号。","tags":["补码","运算符优先级","类型转换"],"options":["(-x) < 0","(-1) > y","(z<<3) == (z*8)","y*24 == z<<5 - z<<3"],"answer":[0,1,2],"kp":"整数与位运算"},{"id":"m2013-18","source":"2013 期中","origin":"exam","lecture":2,"topic":"补码乘法的溢出反例","type":"judge","difficulty":2,"stem":"假设 int x、y 是任意的 32 位有符号整数。命题「如果 x < 0，则 x*2 < 0」是否恒成立？（若认为不成立，请参考解析中的反例）","code":null,"explanation":"不成立。取 x = -2^31（即 TMin，位模式 0x80000000），x*2 在补码运算下等于 0（0x80000000 左移一位得到全 0），0 < 0 为假，所以命题被反例推翻。一般地，只有当 x ≥ -2^30 时 x*2 才仍然为负；负数乘 2 可能溢出回绕成 0 或正数（只要 |x| 足够大）。踩坑点：C 语言中有符号溢出是未定义行为，本题按机器实际的补码回绕语义讨论；写程序时不能依赖「负数乘正数仍为负数」。","tags":["补码溢出","TMin","反例"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2013-19","source":"2013 期中","origin":"exam","lecture":2,"topic":"无符号数与 -1 的比较","type":"judge","difficulty":1,"stem":"假设 unsigned u 是任意的 32 位无符号整数。命题「u <= -1 恒成立」是否正确？","code":null,"explanation":"正确。在与 unsigned 比较时，int 常量 -1 会被隐式转换成无符号数 0xFFFFFFFF，即 UMax，而任何 32 位无符号数的取值范围都不会超过 UMax，所以 u <= -1 恒为真（本质上等价于 u <= UMax）。踩坑点：这里 -1 并没有「负数比无符号数小」的直觉含义；C 语言的隐式类型转换规则规定，只要有一个操作数是无符号类型且其等级不低于有符号操作数，就会把有符号操作数转成无符号再比较，从而产生这类反直觉结论。","tags":["无符号","类型转换","UMax"],"options":null,"answer":true,"kp":"整数与位运算"},{"id":"m2013-20","source":"2013 期中","origin":"exam","lecture":2,"topic":"取负运算的单调性","type":"judge","difficulty":2,"stem":"假设 int x、y 是任意的 32 位有符号整数。命题「如果 x > y，则 -x < -y 恒成立」是否正确？","code":null,"explanation":"不成立。取 x = 0、y = -2^31（TMin）：x > y 成立，但 -x = 0，而 -y 在补码下溢出后仍是 TMin = -2^31，于是 -x < -y 变成 0 < -2^31，为假。问题根源是 TMin 的相反数是它自己（补码的不对称性）。若限定 x、y 都不等于 TMin，「取负保持严格反序」才成立。踩坑点：任何涉及 -x 的恒等式/不等式都要单独检查 TMin；这也是数据实验中 -x 相关表达式必须特判的原因。","tags":["TMin","取负","单调性"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2013-21","source":"2013 期中","origin":"exam","lecture":2,"topic":"无符号数取负后的大小关系","type":"judge","difficulty":2,"stem":"假设 unsigned u、v 是任意的 32 位无符号整数。命题「如果 u > v，则 -u > -v 恒成立」是否正确？","code":null,"explanation":"不成立。取 u = 2、v = 1：u > v 成立，但 -u 按模 2^32 计算为 2^32-2 = 0xFFFFFFFE，-v = 2^32-1 = 0xFFFFFFFF，于是 -u < -v，命题为假。本质上无符号取负是「用 2^32 减」，它把大小顺序整体翻转了：u > v 时 -u = 2^32-u < 2^32-v = -v。因此应是「u > v 则 -u < -v」。踩坑点：无符号数的「负号」只是模运算，不是有符号意义上的取相反数。","tags":["无符号","模运算","取负"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2014-01","source":"2014 期中","origin":"exam","lecture":2,"topic":"有符号/无符号混合比较与补码恒等式","type":"single","difficulty":2,"stem":"假设下列 unsigned 与 int 数均为 32 位，以下表达式正确的是：","code":"unsigned x = 0x00000001;\nint y = 0x80000000;\nint z = 0x80000001;","explanation":"A 错：-1 是 int，与 unsigned 的 x 比较时被转换成 0xFFFFFFFF，远大于 1，比较结果为假。B 错：y = 0x80000000 就是 TMin，它的相反数溢出后仍是 TMin，TMin > -1 为假。C 对：~y 把 0x80000000 取反得到 0x7FFFFFFF，再加回 y 得 0xFFFFFFFF，正是 -1 的补码表示，恒等式 ~y = -y-1 成立。D 错：左移 4 位与乘 16 在模 2^32 意义下等价（0x80000001<<4 = 0x00000010，z*16 同样按 2^32 取模得 0x00000010），故应为相等而不是大于。踩坑点：混合类型比较先做隐式转换，有符号量会变成无符号；涉及 TMin 与左移时要按位回绕思考。","tags":["补码","类型转换","恒等式"],"options":["(-1) < x","(-y) > -1","~y + y == -1","(z<<4) > (z*16)"],"answer":2,"kp":"整数与位运算"},{"id":"m2014-02","source":"2014 期中","origin":"exam","lecture":2,"topic":"反码/补码/浮点编码的辨析","type":"single","difficulty":3,"stem":"下面说法正确的是：","code":"位串（32 位，从高位到低位）：1000 1111 1110 1111 1100 0000 0000 0000","explanation":"A 错：反码（ones' complement）中 0 有两种表示 00000000 与 11111111。B 错：补码中 0 是唯一的（00000000），只有原码和反码才有正负零。C 错：位串本身只是一串 0/1，「表示唯一整数」的说法不成立——按无符号解释是 0x8FEFC000，按补码解释则是 -0x70104000，取决于约定。D 对：按单精度划分，符号位 = 1，阶码字段 = 0001 1111 = 31，E = 31 - 127 = -96，小数字段 = 11011111100000000000000，故值为 -(1.110111111)₂ × 2^(31-127)。踩坑点：判断「0 的表示是否唯一」要区分原码、反码、补码三种编码；同一串二进制在不同类型下的解释完全不同。","tags":["反码","补码","IEEE 754"],"options":["数 0 的反码表示是唯一的","数 0 的补码表示不是唯一的","该 32 位位串表示唯一的整数是 0x8FEFC000","该位串如果是单精度浮点表示，则表示的是 $-(1.110111111)_2 \\times 2^{31-127}$"],"answer":3,"kp":"整数与位运算"},{"id":"m2014-03","source":"2014 期中","origin":"exam","lecture":2,"topic":"C 语言隐式类型转换与整型常量类型","type":"single","difficulty":3,"stem":"在 32 位平台上（按 C90 规则，无后缀十进制常量的类型依次考察 int → long → unsigned → unsigned long，且 long 与 int 同为 32 位），下面表达式中为「真」的是：","code":null,"explanation":"A 假：(unsigned)-1 = 0xFFFFFFFF，-2 也转成无符号即 0xFFFFFFFE，0xFFFFFFFF < 0xFFFFFFFE 不成立。B 真：2147483648U 转成 int 时位模式不变，得到 -2147483648（值的实现相关转换，x86 上如此），2147483647 > -2147483648 成立。C 假：0x80005942 超出 int 范围，类型为 unsigned int，右移是逻辑右移，得 0x08005942 ≠ 0x09005942（后者相当于算术右移的期望值）。D 假：2147483647 + 1 在 32 位下按补码回绕为 0x80000000，而十进制常量 2147483648 在 C90 的 32 位平台上类型为 unsigned long（同样 32 位），比较时左值转换成相同的位模式，于是二者相等，`!=` 为假。踩坑点：无后缀常量到底是 int、long 还是 unsigned，直接决定混合比较的结果；本题必须带上「32 位 + C90」的前提，否则 D 的结论会改变。","tags":["类型转换","整型常量","C90"],"options":["(unsigned) -1 < -2","2147483647 > (int) 2147483648U","(0x80005942 >> 4) == 0x09005942","2147483647 + 1 != 2147483648"],"answer":1,"kp":"整数与位运算"},{"id":"m2014-16","source":"2014 期中","origin":"exam","lecture":2,"topic":"5 位补码向无符号的转换","type":"fill","difficulty":2,"stem":"假设下列 int 与 unsigned 数均为 5 位（有符号整型用补码表示）：`int y = -7; unsigned z = y;`。请写出 z 的**十进制**值（同时也可写出其 5 位二进制表示）。","code":null,"explanation":"-7 的 5 位补码为 11001（-16 + 8 + 1 = -7）。把同一个位模式解释为 5 位无符号数时，值为 16 + 8 + 1 = 25，这正是 C 语言中「有符号转无符号保持位模式、只改变解释方式」的效果。作为对照，同一表格中的另外两空：y - z = -7 - 25 = -32，按 5 位补码回绕后为 0（00000）；5 位补码的最小值 TMin = -16（位模式 10000）。踩坑点：b 位有符号转无符号的等价公式是 z = y + 2^b（当 y < 0 时），本题 2^5 = 32，-7 + 32 = 25。","tags":["补码","类型转换","5 位整数"],"options":null,"answer":["25","11001","1 1001"],"kp":"整数与位运算"},{"id":"m2015-02","source":"2015 期中","origin":"exam","lecture":2,"topic":"补码溢出与位运算的完备性","type":"single","difficulty":2,"stem":"以下说法**错误**的是：","code":null,"explanation":"A、B 都是补码溢出（回绕）的正常现象：例如 TMin + TMin = 0、INT_MAX + INT_MAX = -2，所以「可能」成立，二者都是正确说法。C 正确：与运算直接用 &，非运算直接用 ~，或运算可以写成 ~(~a & ~b)（德摩根律），三种基本逻辑都可由 {&, ~} 组合出来，它们构成功能完备集。D 错误：{&, |} 无法表示逻辑非——无论怎样组合 & 和 |，只要输入全 1 结果就一定是全 1，得不到 0，所以缺少非运算，该集合不完备，故选 D。踩坑点：判断位运算集合是否完备，可以用「代入全 1/全 0 看能否产生 0/1」来快速验证。","tags":["补码溢出","位运算","功能完备"],"options":["负数加上负数结果可能为正数","正数加上正数结果可能为负数","用 & 和 ~ 可以表示所有的逻辑与或非操作","用 & 和 | 可以表示所有的逻辑与或非操作"],"answer":3,"kp":"整数与位运算"},{"id":"m2015-03","source":"2015 期中","origin":"exam","lecture":2,"topic":"整型常量的类型与 INT_MIN 陷阱","type":"single","difficulty":3,"stem":"在 32 位平台上，按 C90 标准，以下语句中结果为**假**的是（参考信息：C90 的转换顺序为 int → long → unsigned → unsigned long，且 2^31 = 2147483648）：","code":null,"explanation":"B 为假：2147483648 超出 int 的表示范围，在 C90 的 32 位平台上按 int → long → unsigned → unsigned long 的顺序取类型，它是 unsigned（无符号）常量；于是 -2147483648 实际是「对无符号数 2147483648 取负」，结果仍是无符号的 2147483648，与 2147483647 比较时左边更大，表达式为假。A 真：INT_MIN < INT_MAX 是同一有符号类型内的比较，显然成立。C 真：初始化时把无符号值转换成 int，位模式 0x80000000 解释为 -2147483648，再与 2147483647 比较成立。D 真：-2147483647 - 1 先做有符号减法得到 -2147483648，没有无符号提升问题，比较成立。踩坑点：`-2147483648` 是先取常量 2147483648 再取负，而不是一个「负常量」，这是 <limits.h> 里要写 (-2147483647-1) 的原因。","tags":["整型常量","INT_MIN","C90 转换"],"options":["return INT_MIN < INT_MAX;","return -2147483648 < 2147483647;","int a = -2147483648; return a < 2147483647;","return -2147483647-1 < 2147483647;"],"answer":1,"kp":"整数与位运算"},{"id":"m2015-07","source":"2015 期中","origin":"exam","lecture":2,"topic":"大端法下联合体的字节解释","type":"single","difficulty":2,"stem":"假设存储器按「大端法」存储数据对象，已知如下的 C 语言数据结构：`union { char c[2]; int i; };`。当 c 的值为 0x01、0x23（即 c[0]=0x01、c[1]=0x23）时，i 的值是：","code":null,"explanation":"int 占 4 字节而 char c[2] 只覆盖了其中前 2 个字节，剩下 2 个字节没有被赋值，其内容是未定义的。大端法下高地址存放低位字节，因此 i 的高 2 字节未知、低 2 字节为 0x0123，i 的完整值无法确定，故选 D。只有在把高 2 字节补 0（例如对联合体做了清零）时，i 才恰好是 0x00000123；选项 A 是忽略了剩下 2 个字节的未定义内容，B 是小端法下的排列，C 是把未知字节硬当成了 0。踩坑点：联合体中「短成员写、长成员读」会读到未初始化的填充字节，属于典型的类型双关陷阱。","tags":["大端法","联合体","未定义行为"],"options":["0x0123","0x2301","0x01230000","不确定"],"answer":3,"kp":"数据布局与对齐"},{"id":"m2015-17","source":"2015 期中","origin":"exam","lecture":2,"topic":"移位与按位与的关系","type":"multi","difficulty":3,"stem":"变量定义：int x、y；unsigned ux = x；double d（保证不是 NaN 或 Inf）。关系符只能从下面前提推出时才算「恒成立」：<、>、==、!=、以上都不恒成立。本题：如果 `((x << 31) >> 31) < 0`，则 `x & 1` ___ 0。","code":null,"explanation":"(x << 31) 把 x 的最低位搬到符号位，(x << 31) >> 31 是有符号算术右移，若该结果为负说明搬过去的符号位是 1，即 x 的最低位为 1（x 是奇数）。此时 x & 1 = 1，显然 1 > 0 且 1 != 0，所以「>」与「!=」恒成立，选 B、D。容易踩的坑是把条件误解为「x 是负数」——恰恰相反，这个表达式只反映最低位，与 x 的正负无关（例如 x = 0xFFFFFFFE 是负数但最低位为 0，条件不成立）。== 与 < 显然不成立。","tags":["移位","按位与","不定项"],"options":["< （小于）","> （大于）","== （等于）","!= （不等于）","以上都不恒成立（E）"],"answer":[1,3],"kp":"整数与位运算"},{"id":"m2015-19","source":"2015 期中","origin":"exam","lecture":2,"topic":"异或恒等式的化简","type":"single","difficulty":3,"stem":"变量定义：int x、y；unsigned ux = x；double d（保证不是 NaN 或 Inf）。关系符只能从下面前提推出时才算「恒成立」：<、>、==、!=、以上都不恒成立。本题：`x ^ y ^ ((~x) - y)` ___ `y ^ x ^ ((~y) - x)`。","code":null,"explanation":"异或满足交换律与结合律，两边都把 x ^ y 作为公共部分提出，于是只需比较 (~x) - y 与 (~y) - x。由补码恒等式 ~x = -x - 1、~y = -y - 1，有 (~x) - y = -x - y - 1 与 (~y) - x = -y - x - 1，两者恒等（减法顺序不影响结果），因此两个表达式恒相等，选 C。选项 <、>、!= 都不成立。踩坑点：这类题不要试图代入具体值猜规律，先用 ~x = -x-1 把取反改写成算术形式，再用异或的交换/结合律约简。","tags":["异或","补码恒等式","不定项"],"options":["< （小于）","> （大于）","== （等于）","!= （不等于）","以上都不恒成立（E）"],"answer":2,"kp":"整数与位运算"},{"id":"m2015-20","source":"2015 期中","origin":"exam","lecture":2,"topic":"逻辑非运算与零的判定","type":"single","difficulty":2,"stem":"变量定义：int x、y；unsigned ux = x；double d（保证不是 NaN 或 Inf）。关系符只能从下面前提推出时才算「恒成立」：<、>、==、!=、以上都不恒成立。本题：`(((!!ux) << 31) >> 31)` ___ `(((!!x) << 31) >> 31)`。","code":null,"explanation":"`!!` 是「逻辑非两次」，作用是把非零值映射为 1、把 0 映射为 0。x 与 ux = (unsigned)x 的位模式完全相同，因此二者「是否为零」的结论一致：!!x = !!ux ∈ {0, 1}。再经过 (v << 31) >> 31 的算术右移，0 变成 0、1 变成 -1（全 1）。既然两边取值同为零或同为 -1，它们恒相等，选 C。选项 <、>、!= 都不恒成立。踩坑点：有符号与无符号转换保持位模式，因此「是否为零」这类只依赖位模式的判据在有符号/无符号之间是不变量。","tags":["逻辑非","类型转换","不定项"],"options":["< （小于）","> （大于）","== （等于）","!= （不等于）","以上都不恒成立（E）"],"answer":2,"kp":"整数与位运算"},{"id":"m2016-14","source":"2016 期中","origin":"exam","lecture":2,"topic":"无符号数的零扩展","type":"fill","difficulty":1,"stem":"假定编译器规定 `int` 和 `short` 型长度分别为 32 位和 16 位，执行下列语句后，`y` 的机器数（用 16 进制表示，保留前导 0）是：","code":"unsigned short x = 65530;\nunsigned int y = x;","explanation":"65530 = 0xFFFA，x 是 16 位无符号数，其机器数为 FFFA。把 16 位 **无符号** short 扩展为 32 位无符号 int 时使用**零扩展**（源类型无符号，高位一律补 0），于是得到 0000FFFA。踩坑点：若误把 x 当作有符号 short，FFFA 会被符号扩展成 FFFFFFFA，结果完全不同——决定用零扩展还是符号扩展的是**源类型的符号性**，而不是目的类型。","tags":["零扩展","无符号数","机器数"],"options":null,"answer":["0000FFFA","0x0000FFFA","0x0000fffa","0000fffa"],"kp":"整数与位运算"},{"id":"m2016-15","source":"2016 期中","origin":"exam","lecture":2,"topic":"短整型提升与符号扩展","type":"fill","difficulty":2,"stem":"一个 C 语言程序在一台 32 位机器上运行，其中 x、z 为 `int` 型，y 为 `short` 型。当 x=127、y=-9 时，执行赋值语句 `z = x + y;` 后，z 的机器数（用 16 进制表示，保留前导 0）是：","code":"int x = 127;\nshort y = -9;\nint z = x + y;","explanation":"x 的机器数是 0000007F；y = -9 的 16 位补码是 FFF7，参与 int 运算前要先做**整型提升**，即按源类型（有符号 short）**符号扩展**成 FFFFFFF7。相加：0000007F + FFFFFFF7 = 1_00000076，最高位的进位被自然丢弃（它体现在 CF 中而结果只保留 32 位），得到 00000076，也就是 118 = 127 - 9。踩坑点：不要漏掉 short 到 int 的符号扩展，也不要试图用 16 位补码直接与 32 位数相加。","tags":["符号扩展","整型提升","补码加法"],"options":null,"answer":["00000076","0x00000076","0x00000076"],"kp":"整数与位运算"},{"id":"m2016-20","source":"2016 期中","origin":"exam","lecture":2,"topic":"乘法的补码回绕","type":"judge","difficulty":3,"stem":"在 64 位机器上，`x` 是 `random_int()` 返回的随机 `int` 值，`ux = (unsigned)x`。表达式 `(x >= 0) || (3*x < 0)` 是否**恒成立**（对任意 int 值都为真）？","code":"/* random_int() 返回一个随机的 int 值 */\nint x = random_int();\nunsigned ux = (unsigned)x;","explanation":"不恒成立。取 x = (1<<31)>>1 = -2^30（位模式 0xC0000000）：此时 x >= 0 为假；而 3*x 在 32 位补码下按模 2^32 运算，3 × (-2^30) = -3×2^30，加上 2^32 后回绕成 +2^30 = 1073741824 ≥ 0，所以 3*x < 0 也为假，整个表达式为假。踩坑点：负数乘正数后可能因为溢出回绕而变成正数，不能凭「负乘正得负」的直觉判断；C 语言中有符号溢出是未定义行为，本题按题目要求以 32 位补码回绕来理解。","tags":["补码溢出","模运算","表达式恒真"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2016-21","source":"2016 期中","origin":"exam","lecture":2,"topic":"有符号与无符号的混合比较","type":"judge","difficulty":3,"stem":"在 64 位机器上，`x` 是 `random_int()` 返回的随机 `int` 值，`ux = (unsigned)x`。表达式 `(x >= 0) || (x < ux)` 是否**恒成立**？","code":"/* random_int() 返回一个随机的 int 值 */\nint x = random_int();\nunsigned ux = (unsigned)x;","explanation":"不恒成立。取 x = -1：此时 ux = 0xFFFFFFFF = 4294967295，第一个条件 x >= 0 为假；第二个条件 x < ux 里，C 语言会先把 x **隐式转换成 unsigned** 再比较，于是变成 4294967295 < 4294967295，为假，整个表达式为假。踩坑点：有符号数与无符号数混合比较时，有符号数被重新解释为无符号数，负数会变成很大的正数；而 x 为负数时，x 与 ux 恰好是同一个位模式，所以 x < ux 永远不成立。只有 x ≥ 0 时表达式才为真，因此它并不恒成立。（该题亦见于 2018 年期中试卷，官方答案为 N。）","tags":["有符号与无符号","隐式类型转换","比较运算"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2016-22","source":"2016 期中","origin":"exam","lecture":2,"topic":"算术右移与最低位清零","type":"judge","difficulty":2,"stem":"在 64 位机器上，`x` 是 `random_int()` 返回的随机 `int` 值。表达式 `((x >> 1) << 1) <= x` 是否**恒成立**？","code":"/* random_int() 返回一个随机的 int 值 */\nint x = random_int();","explanation":"恒成立。本题约定有符号右移为**算术右移**，即 x >> 1 = floor(x/2)（向负无穷取整），再左移一位相当于把最低位清零。对非负数结果显然 ≤ x；对负数也能成立，例如 x = -3：-3>>1 = -2，-2<<1 = -4 ≤ -3。一般地，负数的算术右移向下取整，左移回去只会更小或持平。踩坑点：若把 >> 误当成逻辑右移，或把「右移一位」当成「除以 2 向零取整」，就会得出不成立的错误结论。（该题亦见于 2018 年期中试卷，官方答案为 Y。）","tags":["算术右移","位运算","恒等式"],"options":null,"answer":true,"kp":"整数与位运算"},{"id":"m2016-23","source":"2016 期中","origin":"exam","lecture":2,"topic":"算术右移与整数除法的差异","type":"judge","difficulty":3,"stem":"在 64 位机器上，`x`、`y` 是 `random_int()` 返回的随机 `int` 值。表达式 `((x-y)<<3) + (x>>1) - y == 8*x - 9*y + x/2` 是否**恒成立**？","code":"/* random_int() 返回一个随机的 int 值 */\nint x = random_int();\nint y = random_int();","explanation":"不恒成立。左边用算术右移写 x/2，右边用 C 的整数除法 x/2，而两者对**负数**语义不同：算术右移是向下取整，整数除法是向零取整。取 x = -1、y = 0：左边 = (-1<<3) + (-1>>1) - 0 = -8 + (-1) = -9；右边 = 8×(-1) - 0 + (-1)/2 = -8 + 0 = -8，-9 ≠ -8，等式为假。踩坑点：只有当 x ≥ 0 时 x>>1 与 x/2 才等价，负数时一般相差 1（这正是编译器为负数除法要额外加修正项的原因）。","tags":["算术右移与除法","向下取整","负数取整"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2016-25","source":"2016 期中","origin":"exam","lecture":2,"topic":"位运算求平均值恒等式","type":"judge","difficulty":3,"stem":"在 64 位机器上，`x`、`y` 是 `random_int()` 返回的随机 `int` 值，`lx = (long)x`、`ly = (long)y`（`long` 为 64 位）。表达式 `(int)((lx+ly)>>1) == ((x&y) + ((x^y)>>1))` 是否**恒成立**？","code":"int x = random_int();\nint y = random_int();\nlong lx = (long)x;   /* long 为 64 位 */\nlong ly = (long)y;","explanation":"恒成立，这是「无溢出求平均值」的经典恒等式。先看核心关系：x + y = 2×(x&y) + (x^y)，而 lx、ly 是 int 在 64 位中的符号扩展，相加不会溢出，故 (lx+ly)>>1 恰好是 floor((x+y)/2)，再截断成 int 仍等于该值（该值必落在 int 范围内）。右边：(x&y) 是整数，加上按算术右移实现的 floor((x^y)/2)，正好是 floor((x+y)/2) 的分解。踩坑点：这条恒等式的实用价值在于——直接用 (x+y)>>1 在 32 位下会溢出，而 (x&y) + ((x^y)>>1) 不会；另外若把 >>1 当作逻辑右移，恒等式就不成立了（该题在题目表中最后一行的圈选格被 OCR 丢失，官方答案明确为 Y）。","tags":["平均值的位技巧","算术右移","按位运算恒等式"],"options":null,"answer":true,"kp":"整数与位运算"},{"id":"m2017-01","source":"2017 期中","origin":"exam","lecture":2,"topic":"大端法与补码最小值","type":"single","difficulty":2,"stem":"假定一个特殊设计的计算机把 `int` 型数据的长度从 4 字节扩展为 4N 字节，采用大端法（Big Endian）。现将该 int 型所能表示的**最小负数**写入内存中，X 标记的是该整数所占字节中**地址最低**的那个字节，请问 X 位置这个字节中的值是多少？","code":null,"explanation":"4N 字节 int 能表示的最小负数是补码的 Tmin，其位模式只有最高位（符号位）为 1、其余全 0，即 1000…000。大端法把**最高有效字节放在最低地址**，所以地址最低的那个字节恰好就是含符号位的字节，值为 10000000₂ = 0x80，选 C。官方解析也正是「最小的负数为 1000000…，大端法将最高位放到最低地址」。踩坑点：大端/小端只决定字节顺序、不改变补码 Tmin 的位模式；若 X 标的是最高地址处（小端法才会这样），答案才会是 00000000₂。","tags":["大端法","补码 Tmin","字节序"],"options":["00000000₂","01111111₂","10000000₂","11111111₂"],"answer":2,"kp":"整数与位运算"},{"id":"m2017-02","source":"2017 期中","origin":"exam","lecture":2,"topic":"德摩根律与逻辑运算的完备性","type":"single","difficulty":2,"stem":"以下说法正确的是：","code":null,"explanation":"A、B 错：补码加法会溢出，例如 INT_MAX + 1 得到 INT_MIN（正加正得负），INT_MIN + (-1) 得到 INT_MAX（负加负得正）。C 对：与非别是 `x & y` 和 `~x`，或可由德摩根律得到 `x | y == ~(~x & ~y)`，三种基本逻辑运算都能表示。D 错：`&` 和 `|` 无法表示「非」——因为 x & 0 = 0、x | 1 = 1、x & 1 = x、x | 0 = x，无论怎样组合都得不到 ~x，缺少取反或常量就无法补全。","tags":["德摩根律","补码溢出","逻辑运算完备性"],"options":["负数加上负数结果都为负数","正数加上正数结果都为正数","用 `&` 和 `~` 可以表示所有的逻辑与、或、非操作","用 `&` 和 `|` 可以表示所有的逻辑与、或、非操作"],"answer":2,"kp":"整数与位运算"},{"id":"m2018-02","source":"2018 期中","origin":"exam","lecture":2,"topic":"小端法读字符串与符号扩展","type":"single","difficulty":3,"stem":"在采用小端法存储的机器上运行下面的代码（int、unsigned 为 32 位，short 为 16 位，字符 '0'~'9' 的 ASCII 码为 0x30~0x39），输出的结果将会是：","code":"char *s = \"2018\";\nint *p1 = (int *)s;\nshort s1 = (*p1) >> 12;\nunsigned u1 = (unsigned) s1;\nprintf(\"0x%x\\n\", u1);","explanation":"字符串字面量「2018」在内存中按字符顺序存放，与机器端序无关：从低地址起依次是 '2'=0x32、'0'=0x30、'1'=0x31、'8'=0x38。小端法机器把它当 int 读出时，低地址字节是**最低有效字节**，所以 *p1 = 0x38313032。*p1 是正数，右移 12 位得 0x38313，截断成 short 只保留低 16 位，得 0x8313（作为 short 是负数）。short 转 unsigned 时先按**源类型**（有符号 short）符号扩展成 int 得 0xFFFF8313，再重解释为 unsigned，故 u1 = 0xFFFF8313，选 C。踩坑点：①字符串在内存中的排列顺序与端序无关，只有「按整型读」时才涉及端序；②short 转 unsigned 是「先改变大小（符号扩展）再改变符号性」，顺序不能颠倒。","tags":["小端法","符号扩展","类型转换顺序"],"options":["0x00002303","0x00032303","0xffff8313","0x00008313"],"answer":2,"kp":"整数与位运算"},{"id":"m2018-03","source":"2018 期中","origin":"exam","lecture":2,"topic":"异或交换与按值传递","type":"single","difficulty":1,"stem":"考虑如下函数（其中输出语句按官方勘误修正为 `printf(\"%d, %d\", x, y);`，原卷写作 `printf(x, y);` 属印刷错误）。调用 `XOR(a, b)` 的输出结果为：","code":"void XOR(int x, int y) {\n    y = x ^ y;\n    x = x ^ y;\n    y = x ^ y;\n    printf(\"%d, %d\", x, y);\n}","explanation":"三个异或构成经典的「不用临时变量交换两数」序列。设初值 x = a、y = b：第一步 y = a^b；第二步 x = a ^ (a^b) = b（利用 a^a = 0、0^b = b）；第三步 y = b ^ (a^b) = a。因此函数内部打印的是 x = b、y = a，选 B。A 混淆了「实参按值传递所以调用者的 a、b 不变」与「函数内部两个形参已经互换」；C 误以为某一步把变量清零（只有两个操作数指向同一内存时才会归零，本题两个形参是独立的 int）；D 是第三步算错。官方答案最初给 C，随后勘误为 B（并指出题面的 printf 写法有误）。","tags":["异或交换","按位运算","按值传递"],"options":["a, b","b, a","b, 0","b, a^b"],"answer":1,"kp":"整数与位运算"},{"id":"m2019-01","source":"2019 期中","origin":"exam","lecture":2,"topic":"网络字节序与位掩码","type":"single","difficulty":3,"stem":"一个 IPv4 地址就是一个 32 位无符号整数，例如 10.2.155.253 对应的地址是 0x0a029bfd。协议规定：无论主机字节顺序如何，IP 地址在内存中**总是以大端法**存放。下面代码要实现的功能是检验 IP 是否符合 192.168.56.xx（xx 表示任意 0~255 的数），如果满足就执行 if 内部的语句。那么，在**小端法**的机器上，两处横线应分别补充：","code":"unsigned ip, mask;\n// set ip\nmask = __________;\nif (ip & mask == __________)\n{\n    // do something\n}","explanation":"192.168.56.xx 按大端写成十六进制是 0xc0a838xx，它在内存中的字节序列（从低地址到高地址）是 c0 a8 38 xx。小端法机器把这 4 个字节当作 32 位无符号整数读出来时，最低地址的 c0 成了最低有效字节，于是 ip = 0xxx38a8c0，即低 24 位是 0x38a8c0、最高 8 位是变化的 xx。要屏蔽掉变化的最高 8 位，就用掩码 0x00ffffff（保留低 24 位、把高 8 位置 0），再与 0x0038a8c0 比较，故选 A。C、D 保留的是高 24 位，方向正好相反；B 是字节序搞错的写法。踩坑点：题目先说「内存中总是大端存放」，再问「小端机器上读出什么值」，必须自己完成一次字节序转换；另外 0x00ffffff 与 0xffffff00 的取舍取决于要屏蔽哪一端。","tags":["字节序","位掩码","IP 地址"],"options":["0x00ffffff  0x0038a8c0","0x00ffffff  0x00838a0c","0xffffff00  0xc0a83800","0xffffff00  0x0c8a8300"],"answer":0,"kp":"整数与位运算"},{"id":"m2019-02","source":"2019 期中","origin":"exam","lecture":2,"topic":"补码解释下的按位运算比较","type":"single","difficulty":2,"stem":"已知 0x2019 和 0x12 是两个有符号 32 位整数。下列运算结果中，作为 32 位补码表示的整数**最大**的是：","code":null,"explanation":"0x2019 = 0010 0000 0001 1001，共有 14 位有效；左移 18 位后最低的那个 1 落到第 31 位，符号位为 1，按补码解释是**负数**，最小。其余三个结果都是正数（最高位为 0）。再比较 & | ^：三者作用于同一对操作数，结果中「1」可能出现的位置集合相同；按位或把所有出现过的 1 都保留下来，数值最大；按位与只保留交集，1 最少；异或介于两者之间。故选 C。踩坑点：不要按十六进制字面直接比较数值，要抓住「同一位位置上 1 越多数值越大」这一点；另外注意移位后按补码解释而不是无符号解释。","tags":["补码","按位运算","左移溢出"],"options":["0x2019 << 0x12","0x2019 & 0x12","0x2019 | 0x12","0x2019 ^ 0x12"],"answer":2,"kp":"整数与位运算"},{"id":"m2019-17","source":"2019 期中","origin":"exam","lecture":2,"topic":"无符号数最大值的回绕","type":"fill","difficulty":1,"stem":"假设是 8 位整数。8 位**无符号**数能表示的最大整数加 1 后，结果的二进制表示是（请写满 8 位）：","code":null,"explanation":"8 位无符号数的最大值是 255 = 1111 1111₂，加 1 后按 8 位模运算回绕为 0，二进制表示为 0000 0000。踩坑点：不要把结果写成 1 0000 0000（9 位）——结果只有 8 位，超出最高位的进位被丢弃，只体现在 CF 标志中；这个「回绕」正是无符号加法检测溢出的依据（CF = 1 表示无符号溢出）。官方答案为「0000 0000」，十进制结果 0。","tags":["无符号溢出","模运算","二进制表示"],"options":null,"answer":["0000 0000","00000000","0","0b00000000"],"kp":"整数与位运算"},{"id":"m2019-18","source":"2019 期中","origin":"exam","lecture":2,"topic":"补码最大整数加一得到 Tmin","type":"fill","difficulty":2,"stem":"假设是 8 位整数。8 位**补码**（two's complement）能表示的最大整数加 1 后，结果的二进制表示是（请写满 8 位）：","code":null,"explanation":"8 位补码能表示的最大整数是 127 = 0111 1111₂，加 1 得 1000 0000₂，按补码解释正是 **-128**（即 Tmin）——这就是补码的「正溢出」现象，也是「最小负数的绝对值比最大正数大 1」的根本原因。踩坑点：不要把 1000 0000 当成 +128（那是无符号数的解释）；也要记住补码是不对称的，Tmin 取负后仍然是 Tmin，同时 OF 会被置 1。官方答案为「1000 0000」，十进制结果 -128。","tags":["补码","正溢出","Tmin"],"options":null,"answer":["1000 0000","10000000"],"kp":"整数与位运算"},{"id":"m2020-14","source":"2020 期中","origin":"exam","lecture":2,"topic":"union 位级重叠与小端法","type":"fill","difficulty":3,"stem":"已知如下类型定义，union_e 的成员 s 与 d 共享同一段内存。若某次程序运行后 test.d 是 double 能表示的最大的负非规格化数，且此时从 test 的起始地址开始的 8 个字节用十六进制表示依次是 01 00 00 00 00 00 00 80（按地址从小到大），那么此时 test.s.x 的值是多少？（用十进制填写）","code":"typedef struct {\n    int x;\n    int y;\n} struct_e;\n\ntypedef union {\n    struct_e s;\n    double d;\n} union_e;\n\nunion_e test;","explanation":"小端法下这 8 个字节组成的 64 位位模式是 0x8000000000000001：最高位是符号位 1（负数），11 位阶码字段全 0（非规格化数），尾数最低位为 1，正是 double 能表示的“最大的负非规格化数” -2^-1074。union 的 s 与 d 共享同一段内存，struct_e s 的前 4 个字节是 x、后 4 个字节是 y：x 取最低 4 字节 0x00000001，也就是 1；y 取高 4 字节 0x80000000，按有符号 int 解读是 -2147483648（-2^31）。踩坑点：union 的位级重叠、小端法的字节顺序、以及 0x80000000 作为 int 是负数这三点要同时处理对。","tags":["union","小端法","非规格化数"],"options":null,"answer":["1"],"kp":"浮点数"},{"id":"m2021-01","source":"2021 期中","origin":"exam","lecture":2,"topic":"union 的内存重叠与小端法读指针","type":"single","difficulty":3,"stem":"考虑如下代码在 x86-64 处理器上的运行情况。提示：(1) \"I love ICS!\" 对应
