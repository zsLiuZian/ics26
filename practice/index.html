差异很大、或末尾需要按最大对齐值补齐时，别的排列方式可能同样省空间，所以只能说「不一定最小」。B 错：既然递增排列「不一定最小」，那它是否「一定不会最大」也没有依据，而且某些情况下递增排列反而恰好占用最多。C、D 错：union 的所有成员**共用同一块空间**，其大小等于最大成员的大小（再按最大对齐要求向上取整），与外层成员的排列顺序完全无关，因此对 union 成员排序既不影响「最小」也不影响「最大」，这两个说法都没有意义。官方解析即「联合以及只含一个基本数据类型成员的结构体的内存占用与其成员排列方式无关」。","tags":["struct 对齐","union 内存布局","内存占用"],"options":["对于任意 struct，将其成员按照其实际占用内存大小从小到大的顺序进行排列不一定会使之内存占用最小","对于任意 struct，将其成员按照其实际占用内存大小从小到大的顺序进行排列一定不会使之内存占用最大","对于任意 union，将其成员按照其实际占用内存大小从小到大的顺序进行排列不一定会使之内存占用最小","对于任意 union，将其成员按照其实际占用内存大小从小到大的顺序进行排列一定不会使之内存占用最大"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2019-07","source":"2019 期中","origin":"exam","lecture":7,"topic":"复杂声明中的数组与函数指针","type":"single","difficulty":2,"stem":"考虑以下 C 语言变量声明，那么在一台 x86-64 机器上，`sizeof(f)` 和 `sizeof(*f)` 的值分别是多少？","code":"int *(*f[3])();","explanation":"从里往外读声明：f 先与 [] 结合，说明 f 是含 3 个元素的**数组**；每个元素的类型是「指向函数的指针」，该函数没有参数并返回 int*。因此 sizeof(f) 是整个数组的大小 = 3 × 8 = 24 字节（x86-64 上指针为 8 字节）；*f 等价于 f[0]，是数组的一个元素，即一个**函数指针**，大小 8 字节，选 B。A 把两者弄反；C 忽略了数组大小等于元素大小乘元素个数；D 认为函数指针大小不确定，但 *f 仍是指针（并未对函数类型取 sizeof，那才是非法的），在 x86-64 上函数指针与数据指针同为 8 字节。踩坑点：C 声明的读法是「先看括号与后缀，从内向外」。","tags":["指针与数组","sizeof","函数指针"],"options":["8  24","24  8","8  8","8  不确定"],"answer":1,"kp":"数据布局与对齐"},{"id":"m2019-23","source":"2019 期中","origin":"exam","lecture":7,"topic":"struct 与 union 的大小和填充","type":"fill","difficulty":3,"stem":"在 64 位 Linux 机器上，有下列类型定义。`caller` 函数中局部变量 `struct_e s;` 所占的内存空间（即 sizeof(struct_e)）是多少字节？","code":"typedef union { char str_u[10]; long l; } union_e;\ntypedef struct { char str_s[5]; union_e u; long c; } struct_e;","explanation":"union_e 的大小 = max(10, 8) 向上取到 8 的倍数 = 16 字节，对齐要求为 8。struct_e 的布局：char str_s[5] 占偏移 0~4；为满足 union_e 的 8 字节对齐，需填充 3 字节到偏移 8；union_e u 占偏移 8~23；long c 从偏移 24 开始占 24~31；总大小 32 已满足「是最大对齐值 8 的倍数」，无需再补。因此 sizeof(struct_e) = 32 字节，与官方答案一致。踩坑点：①union 大小要按最大成员并考虑对齐（10 会向上取到 16）；②str_s 之后有 3 字节填充；③结构体整体大小必须是最大对齐值的倍数。","tags":["struct 对齐","union 大小","内存布局"],"options":null,"answer":["32","32 字节","32字节"],"kp":"数据布局与对齐"},{"id":"m2020-01","source":"2020 期中","origin":"exam","lecture":7,"topic":"数组元素寻址的汇编表示","type":"single","difficulty":2,"stem":"某 C 语言程序中对数组变量 a 的声明为 int a[10][10];，有如下一段代码。假设执行到 `sum+= a[i][j];` 时，sum 的值在 %rax 中，a[i][0] 所在的地址在 %rdx 中，j 在 %rsi 中，则 `sum+= a[i][j];` 所对应的指令是：","code":"for (i = 0; i < 10; i++)\n    for (j = 0; j < 10; j++)\n        sum += a[i][j];","explanation":"a 的元素类型是 int（4 字节），a[i][j] 的地址 = a[i][0] 的地址 + j×4 = %rdx + 4×%rsi，对应寻址方式 0(%rdx,%rsi,4)，即“基址 %rdx + 变址 %rsi × 比例因子 4”。求和的是 int 类型，所以用 32 位的 addl 加到 %eax，故选 A。B 把基址与变址写反，变成了 %rsi + 4×%rdx；C、D 的比例因子 2 是 short 的宽度，对 int 数组不适用。踩坑点：比例因子必须等于元素字节数（int 为 4），且基址寄存器应当是行首地址 %rdx。","tags":["数组寻址","比例因子","addl"],"options":["addl 0(%rdx, %rsi, 4), %eax","addl 0(%rsi, %rdx, 4), %eax","addl 0(%rdx, %rsi, 2), %eax","addl 0(%rsi, %rdx, 2), %eax"],"answer":0,"kp":"机器级编程基础"},{"id":"m2020-03","source":"2020 期中","origin":"exam","lecture":7,"topic":"二维数组与指针数组的地址计算","type":"single","difficulty":3,"stem":"假定静态 int 型二维数组 a 和指针数组 pa 的声明如下。若 a 的首地址为 0x601080，则 &pa[0] 和 pa[1] 分别是：","code":"static int a[4][4] = {{3, 8, -2, 6}, {2, 1, -5, 3}, {1, 18, 4, 10}, {4, -2, 0, 8}};\nstatic int *pa[4] = {a[0], a[1], a[2], a[3]};","explanation":"a 是 4×4 的 int 数组，共 16 个 int = 64 字节 = 0x40，所以紧随其后的指针数组 pa 从 0x601080 + 0x40 = 0x6010C0 开始，即 &pa[0] = 0x6010C0（而 pa[0] 的值才是 a[0] = 0x601080）。pa[1] 里存放的是 a[1] 的首地址，a[1] 相对 a 偏移 1 行 = 4 个 int = 16 字节 = 0x10，所以 pa[1] = 0x601080 + 0x10 = 0x601090，选 A。B、D 把 &pa[0] 算成 0x6010E0（多算了 0x20，即把 a 的 16 个 int 当成了 32 字节）等；C、D 把 pa[1] 算成 0x6010A0（把行偏移当成 32 字节）。踩坑点：&pa[0] 是 pa 数组自身的地址，而 pa[1] 的值是另一行数组的首地址，两者含义完全不同。","tags":["二维数组","指针数组","地址计算"],"options":["0x6010c0、0x601090","0x6010e0、0x601090","0x6010c0、0x6010a0","0x6010e0、0x6010a0"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2020-05","source":"2020 期中","origin":"exam","lecture":7,"topic":"结构体成员偏移与 movl","type":"single","difficulty":2,"stem":"假设结构体类型 student_info 的声明如下。若 x 的首地址在 %rdx 中，则 unsigned xzip = x.zip; 所对应的汇编指令为：","code":"struct student_info {\n        char id[8];\n        char name[16];\n        unsigned zip;\n        char address[50];\n        char phone[20];\n} x;","explanation":"按声明顺序累加偏移：char id[8] 占 0~7，char name[16] 占 8~23，unsigned zip 从偏移 24 开始（0x18），占 24~27。x 的首地址在 %rdx 中，因此取出 zip 的值就是把偏移 0x18 处的 4 字节读进 %eax，即 movl 0x18(%rdx),%eax，选 B。A 的 0x24 = 36 是偏移算错的结果；C、D 用的是 leaq，只会把地址算进寄存器而不会把值取出来，而题目要求的是取值赋给 xzip。踩坑点：偏移量是前面成员字节数的累加（8 + 16 = 24 = 0x18），且取 4 字节的 unsigned 要用 movl 而不是 leaq。","tags":["结构体偏移","movl","内存引用"],"options":["movl 0x24(%rdx), %eax","movl 0x18(%rdx), %eax","leaq 0x24(%rdx), %rax","leaq 0x18(%rdx), %rax"],"answer":1,"kp":"机器级编程基础"},{"id":"m2020-13","source":"2020 期中","origin":"exam","lecture":7,"topic":"union 的大小与类型双关","type":"fill","difficulty":2,"stem":"已知下面的类型定义，则 sizeof(union_e) 等于多少字节？","code":"typedef struct {\n    int x;\n    int y;\n} struct_e;\n\ntypedef union {\n    struct_e s;\n    double d;\n} union_e;","explanation":"union_e 的成员是 struct_e s（两个 int，共 8 字节，对齐要求 4）与 double d（8 字节，对齐要求 8）。union 的大小取最长成员的大小并向最大对齐要求（8）补齐，两个成员都是 8 字节，因此 sizeof(union_e) = 8。这个 union 使 8 字节的 double 与两个 int 共享同一段内存，是类型双关（type punning）的经典写法，可以把同一个位模式按不同类型解读。踩坑点：union 的大小不是成员大小之和（那样会算成 16），对齐要求取所有成员中最大的那个。","tags":["union","对齐","类型双关"],"options":null,"answer":["8"],"kp":"数据布局与对齐"},{"id":"m2021-07","source":"2021 期中","origin":"exam","lecture":7,"topic":"由汇编反推二维数组的维数与访问模式","type":"single","difficulty":3,"stem":"阅读下列 C 代码和在 x86-64 机器上得到的汇编代码，假设 a 的地址初始时放在 %rdi 中，程序正常运行且没有发生越界问题，则 C 代码中的 A、B、C 处应分别填：","code":"int a[__A__][__B__];\nfor (int i = 0; i < __C__; i++)\n    a[i][__C__ - i] = 1;\n\nleaq 40(%rdi), %rax\naddq $440, %rdi\n.L2:\n    movl $1, (%rax)\n    addq $40, %rax\n    cmpq %rdi, %rax\n    jne .L2","explanation":"元素 a[i][C-i] 的地址 = base + (i×B + C - i)×4 = base + ((B-1)×i + C)×4。汇编中地址从 rdi+40 开始、每次加 40 字节，说明 (B-1)×4 = 40，即 B = 11（注意行下标 i 增加 1 的同时列下标 C-i 减少 1，净增量是 (B-1)×4 而不是 B×4）。起始偏移 40 字节对应 i = 0 时的元素 a[0][C]，即 C×4 = 40，得 C = 10；循环从 rdi+40 一直加到 rdi+440（不相等就继续），共执行 10 次，也印证 C = 10，而行数 A 只需不小于 C，取 10。所以 A = 10、B = 11、C = 10，选 A。踩坑点：把地址步长 40 字节直接当成 B×4 会得到 B = 10；把 440/40 = 11 当成循环次数也会错。","tags":["二维数组","寻址","循环"],"options":["10、11、10","9、11、9","11、10、10","11、11、11"],"answer":0,"kp":"机器级编程基础"},{"id":"m2021-19","source":"2021 期中","origin":"exam","lecture":7,"topic":"union 的大小与结构体对齐","type":"fill","difficulty":2,"stem":"已知下面的类型定义，若 tmp 是一个 s_element 类型的变量，则 sizeof(tmp.u1) 等于多少字节？","code":"struct s_element{\n    union u_inner{\n        float f;\n        short s[2];\n    } u1;\n    s_element* next;\n};","explanation":"union u_inner 的两个成员 float f 与 short s[2] 都占 4 字节，union 的大小取最长成员并向上补齐到其自身对齐（float 与 short 的对齐分别是 4 和 2，最大为 4），所以 sizeof(tmp.u1) = 4。顺带看整个结构体：u1 在偏移 0~3，为了让指针 next 满足 8 字节对齐还要填充 4 字节，next 占偏移 8~15，所以 sizeof(s_element) = 16。踩坑点：union 的大小不是各成员大小之和，而是最长成员再对齐补齐；结构体中 union 之后常常还需要填充才能让指针正确对齐。","tags":["union","结构体对齐","sizeof"],"options":null,"answer":["4"],"kp":"数据布局与对齐"},{"id":"m2022-08","source":"2022 期中","origin":"exam","lecture":7,"topic":"结构体的大小与重排优化","type":"single","difficulty":3,"stem":"下列结构体的总大小字节数为 A，重新排列优化后的最小字节数是 B，则 A - B =","code":"struct {\n  char *a; short b;  double c;  short d;\n  float e;  char  f; long    g; int    h;\n} rec;","explanation":"按原顺序：char *a 占 0~7；short b 占 8~9；double c 要求 8 字节对齐，占 16~23（10~15 被填充浪费）；short d 占 24~25；float e 占 28~31；char f 占 32；long g 要求 8 字节对齐，占 40~47（33~39 被浪费）；int h 占 48~51；结构体总大小再补齐到 8 的倍数得 56，所以 A = 56。重排时按“大成员先放、小成员填缝”的原则：a(8)@0、c(8)@8、g(8)@16、e(4)@24、h(4)@28、b(2)@32、d(2)@34、f(1)@36，总大小补齐到 8 得 40，所以 B = 40。A - B = 16，选 C。踩坑点：重排不能只按成员宽度求和（那样会得到 52-37 = 15），必须保留 8 字节对齐和末尾补白。","tags":["结构体对齐","内存填充","重排优化"],"options":["12","15","16","19"],"answer":2,"kp":"数据布局与对齐"},{"id":"m2023-05","source":"2023 期中","origin":"exam","lecture":7,"topic":"二维数组寻址与 LEA 指令","type":"single","difficulty":3,"stem":"有如下函数（包含一处空缺，用 __ 表示）及其编译后的 x86-64 汇编代码，则空缺处应为：","code":"long func1(long a[][3], long x, long y) {\n    return a[x*2+y][__];\n}\n\nfunc1(long (*) [3], long, long):\n        leaq    (%rdx,%rsi,2), %rax\n        leaq    (%rax,%rax,2), %rax\n        movq    48(%rdi,%rax,8), %rax\n        ret","explanation":"a 的类型是每行 3 个 long（24 字节）的二维数组，元素 a[i][k] 的地址 = base + i×24 + k×8。参数寄存器依次为 %rdi = a、%rsi = x、%rdx = y。leaq (%rdx,%rsi,2),%rax 算出 %rdx + 2×%rsi = y + 2x，即行号 i = 2x + y；leaq (%rax,%rax,2),%rax 把行号乘 3；最后的 movq 48(%rdi,%rax,8),%rax 取 base + 8×3i + 48 处的值，其中 48 = 6×8 正对应行内第 6 个元素，故空缺处填 6，选 D。踩坑点：把参数顺序记错（误以为 %rsi 是 y），或者忘记每行 3 个 long 因而行步长是 24 字节。","tags":["二维数组","LEA","寻址"],"options":["0","2","4","6"],"answer":3,"kp":"机器级编程基础"},{"id":"m2023-08","source":"2023 期中","origin":"exam","lecture":7,"topic":"union 与 struct 的大小及成员偏移","type":"single","difficulty":3,"stem":"在 x86-64 架构、Linux 操作系统下，有如下 C 定义。考虑使用 GCC 默认选项进行编译，下列逻辑表达式为真的是：","code":"struct {\n    union {\n        short s1;\n        char c[3];\n    } u;\n    double d;\n    short s2;\n} s;","explanation":"union u 的成员是 short s1（2 字节）与 char c[3]（3 字节），union 的大小等于最长成员并向上补齐到自身对齐（2 的倍数），所以 sizeof s.u = 4，A（3）和 B（8）都错。整个结构体：u 在偏移 0~3；double d 要求 8 字节对齐，故放在偏移 8~15；short s2 放在偏移 16~17，结构体总大小补齐到 8 的倍数为 24。&s.s2 与 &s.u.s1 的类型都是 short*，指针相减要先除以元素大小 2：字节差为 16，16/2 = 8，所以 C 正确，D（16）是把字节差直接当成了指针差。踩坑点：union 的大小要按“最长成员 + 对齐补白”计算，指针相减会自动缩放。","tags":["union","结构体对齐","指针相减"],"options":["sizeof s.u == 3","sizeof s.u == 8","(&s.s2 - &s.u.s1) == 8","(&s.s2 - &s.u.s1) == 16"],"answer":2,"kp":"数据布局与对齐"},{"id":"m2023-09","source":"2023 期中","origin":"exam","lecture":7,"topic":"复杂声明的 sizeof 计算","type":"single","difficulty":3,"stem":"在 x86-64 架构、Linux 操作系统下，有如下 C 定义。那么 sizeof A + sizeof *A + sizeof **A + sizeof ***A 的值为？","code":"int (*A[2])[3];","explanation":"按左右法则读声明：A 是含 2 个元素的数组，元素类型是“指向含 3 个 int 的数组”的指针。于是 sizeof A = 2×8 = 16（x86-64 下指针为 8 字节）；*A 是一个指针，sizeof *A = 8；**A 是含 3 个 int 的数组，sizeof **A = 3×4 = 12；***A 是 int，sizeof ***A = 4。合计 16+8+12+4 = 40，选 A。B、C、D 分别对应把指针当成 4 字节、把 **A 当成指针、或把 sizeof A 算成 8/16 与 12 的混淆。踩坑点：sizeof(数组名) 是数组总字节数，而 sizeof 指针在 x86-64 上恒为 8。","tags":["sizeof","指针数组","左右法则"],"options":["40","44","48","84"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2024-04","source":"2024 期中","origin":"exam","lecture":7,"topic":"结构体对齐与指针数组声明","type":"single","difficulty":3,"stem":"在 x86-64 架构、Linux 操作系统下运行如下代码，四个 `printf` 输出之和为：","code":"#include <stdio.h>\n\nstruct student {\n    int id;\n    char name[6];\n    short age;\n    char gender;\n    float score;\n};\n\nint main() {\n    struct student s;\n    struct student* (*p[8])[4];\n    printf(\"%lu\\n\", sizeof(s));\n    printf(\"%lu\\n\", sizeof(**p));\n    printf(\"%lu\\n\", (char*)&p[2] - (char*)p);\n    printf(\"%lu\\n\", &p[4] - p);\n    return 0;\n}","explanation":"struct student 中最大成员是 int/float（4 字节对齐）：id 占 0~3，name[6] 占 4~9，age 占 10~11，gender 占 12，为满足 4 字节对齐在其后补 3 字节，score 占 16~19，结构体总长再补齐到 4 的倍数，故 sizeof(s) = 20。再看声明 struct student* (*p[8])[4]：按左右法则，p 是含 8 个元素的数组，元素是“指向含 4 个元素的数组”的指针，数组元素类型为 struct student*。于是 *p 的类型是 struct student*[4]。**p 是含 4 个指针的数组，sizeof(**p) = 4×8 = 32。(char*)&p[2] - (char*)p 先强转成 char*，得到真实字节差 2×8 = 16。&p[4] - p 没有强转，指针相减会除以元素步长 8，得 4。合计 20+32+16+4 = 72，选 A。B、C、D 分别对应把 sizeof(**p) 当成 4/8、忘记指针相减要除以步长、或把 &p[2] 的字节差算成 2 等错误。","tags":["结构体对齐","指针数组","指针算术"],"options":["72","48","56","84"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2024-07","source":"2024 期中","origin":"exam","lecture":7,"topic":"结构体作为参数与返回值的传递方式","type":"single","difficulty":3,"stem":"在作业题中，我们考察过 GCC 为一个参数和返回值都是结构体的函数产生的汇编代码，此时参数和返回值都是通过栈传递的，以下有关说法错误的是：","code":null,"explanation":"C 错误，为本题答案：当参数或返回值是无法装进寄存器的较大结构体时，调用者会在自己的栈帧中预留一块空间存放返回值，并把这块空间的地址作为隐藏的第 0 个参数（放在 %rdi）传给被调用者；被调用者把结果写进这块内存，所以返回的结构体实际上存放在调用者的栈帧中，而不是被调用者的栈帧里。A 正确：被调用者最后把这个内存地址放进 %rax 返回给调用者。B 正确：正因为隐藏的第 0 个参数就是返回缓冲区地址，即使真正的结构体参数走栈，也仍然会用到 %rdi。D 正确：结构体足够小（例如只含一两个标量字段）时，GCC 会把它拆分后用整数/SSE 寄存器传递和返回。踩坑点：把“返回值缓冲区由谁分配”记反。","tags":["结构体传参","调用约定","栈帧"],"options":["返回的结构体的地址被存放在 %rax 寄存器中","虽然参数是通过栈传递的，但这里依旧使用到了 %rdi","返回的结构体实际上是存放在被调用者的栈帧当中","如果结构体很小的话，GCC 可能会直接用寄存器来传输参数和返回值"],"answer":2,"kp":"数据布局与对齐"},{"id":"s2025a-44","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"二维数组寻址：行偏移的移位优化","type":"fill","difficulty":2,"stem":"下面是二维数组访问的 C 代码与汇编代码。汇编中第一条指令 `shlq $4, ______` 的目的操作数应当是什么寄存器？","code":"#define CNT 4\nint arr_data[CNT][CNT] =\n    {{900, 901, 902, 903},\n     {910, 911, 912, 913},\n     {920, 921, 922, 923},\n     {930, 931, 932, 933}};\n\nint get_digit(int x, int y)\n{\n    return arr_data[x][y];\n}\n\nget_digit:\n    shlq $4, ______\n    movl arr_data(______,______,______), %eax\n    ret","explanation":"get_digit 的两个参数 x、y 分别放在 %rdi、%rsi。要取 arr_data[x][y]，需要计算首地址 + x*行大小 + y*元素大小。数组是 int[4][4]，一行 4 个 int 共 16 字节，所以行偏移是 x*16，编译器用 `shlq $4,%rdi` 把 x 左移 4 位（即乘 16）来高效实现乘法。之后再用比例变址寻址完成 y*4 的加和。看到 `$4` 就要立刻反应出这是在乘 16，而不是「4 个字节」。","tags":["二维数组","行优先","移位优化"],"options":null,"answer":["%rdi","rdi"],"kp":"机器级编程基础"},{"id":"s2025a-45","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"二维数组元素地址的寻址方式","type":"single","difficulty":3,"stem":"承接上面的 get_digit 代码（前一条指令已把 %rdi 变为 x*16）。`movl` 指令中读取 arr_data[x][y] 的完整写法应当是？","code":"#define CNT 4\nint arr_data[CNT][CNT] = {{900,901,902,903},{910,911,912,913},\n                          {920,921,922,923},{930,931,932,933}};\n\nint get_digit(int x, int y) { return arr_data[x][y]; }\n\nget_digit:\n    shlq $4, %rdi\n    movl arr_data(______,______,______), %eax\n    ret","explanation":"元素地址 = arr_data + x*16 + y*4。此时 %rdi 已经等于 x*16，作为基址寄存器参与相加；%rsi 仍是 y，需要乘上元素大小 4，所以写成 %rsi 配合比例因子 4。于是 `movl arr_data(%rdi,%rsi,4),%eax` 正确。选 B 把两个寄存器角色对调，选 C 会把 y 放大 16 倍，选 D 丢了 y 这一维（等价于 arr_data[x][0]）。牢记公式：地址 = 首地址 + 行下标×行字节数 + 列下标×元素字节数。","tags":["二维数组","比例变址","地址计算"],"options":["movl arr_data(%rdi,%rsi,4), %eax","movl arr_data(%rsi,%rdi,4), %eax","movl arr_data(%rdi,%rsi,16), %eax","movl arr_data(,%rdi,4), %eax"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025a-46","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"变长二维数组的传参与寻址","type":"single","difficulty":3,"stem":"C 语言中传参 n×n 二维数组时，如果 n 是变量，应该如何计算 a[i][j]？下面汇编中缺失的两条指令应当是？","code":"# int var_ele(size_t n, int a[n][n], size_t i, size_t j)\n# { return a[i][j]; }\n# hint: %rdi,%rsi,%rdx,%rcx\n\nvar_ele:\n    movq %rdx, %rax\n    __________\n    __________\n    movl (%rsi,%rax,4), %eax\n    ret","explanation":"参数顺序是 (n, a, i, j)，对应 %rdi、%rsi、%rdx、%rcx。元素地址 = a + i*n*4 + j*4，所以先在 %rax 中得到 i*n：把 i（%rdx）搬进 %rax 后用 `imulq %rdi,%rax` 乘 n；再加上 j（%rcx）得到 i*n + j；最后用比例因子 4 换算成字节偏移，即 `movl (%rsi,%rax,4),%eax`。选 B 会把 i 乘 j 再加 n，选 D 的顺序也不对（先加后乘会破坏公式）。这是「行优先 + 变长行」的通用模式：行内步长是运行期才确定的 n。","tags":["变长数组","行优先","imul"],"options":["imulq %rdi,%rax  然后  addq %rcx,%rax","imulq %rcx,%rax  然后  addq %rdi,%rax","imulq %rsi,%rax  然后  addq %rcx,%rax","addq %rdi,%rax  然后  imulq %rcx,%rax"],"answer":0,"kp":"数据布局与对齐"},{"id":"s2025a-47","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"数组名退化与指针索引","type":"fill","difficulty":3,"stem":"考虑下面的代码，程序输出的 result 是多少？","code":"#define ZLEN 5\n#define PCOUNT 4\ntypedef int zip_dig[ZLEN];\n\nint main() {\n    zip_dig pgh[PCOUNT] =\n        {{1, 5, 2, 0, 6},\n         {1, 5, 2, 1, 3},\n         {1, 5, 2, 1, 7},\n         {1, 5, 2, 2, 1}};\n    int *linear_zip = (int *) pgh;\n    int *zip1 = (int *) pgh[1];\n    int result =\n        pgh[2][3] +\n        linear_zip[14] +\n        *(linear_zip + 16) +\n        zip1[4];\n    printf(\"result: %d\\n\", result);\n}","explanation":"把 pgh 看成一维展开的 20 个 int（行优先存储）就一目了然：pgh[2][3] 是第 2 行第 3 列，即展开下标 2*5+3 = 13，值为 1；linear_zip[14] 是展开下标 14，落在第 2 行最后一列，值为 7；*(linear_zip+16) 是展开下标 16，即第 3 行第 1 列，值为 5；zip1 指向 pgh[1]，zip1[4] 是 pgh[1][4]，值为 3。总和 1+7+5+3 = 16。本题的考点是：类型为 int[5] 的数组元素会退化成指向其首元素的指针，因此 pgh[1] 与 (int*)pgh + 5 是同一个地址。","tags":["数组与指针","行优先布局","指针运算"],"options":null,"answer":["16"],"kp":"数据布局与对齐"},{"id":"s2025a-48","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"由汇编偏移反推结构体数组维度 A","type":"fill","difficulty":3,"stem":"下面的代码中 A 和 B 是 #define 定义的常数。根据 GCC 生成的汇编代码，A 的值是多少？","code":"typedef struct {\n    int x[A][B];   /* Unknown constants A and B */\n    long y;\n} str1;\n\ntypedef struct {\n    char array[B];\n    int t;\n    short s[A];\n    long u;\n} str2;\n\nvoid setVal(str1 *p, str2 *q) {\n    long v1 = q->t;\n    long v2 = q->u;\n    p->y = v1 + v2;\n}\n\n# p in %rdi, q in %rsi\nsetVal:\n    movslq 8(%rsi), %rax\n    addq   32(%rsi), %rax\n    movq   %rax, 184(%rdi)\n    ret","explanation":"从汇编读出两个方程。其一：`movq %rax,184(%rdi)` 说明 p->y 的偏移是 184，而 y 前面是 int x[A][B]（占 4AB 字节），要按 8 字节对齐，故 4AB 落在 (176, 184]，即 AB = 45 或 46。其二：str2 中 `movslq 8(%rsi),%rax` 说明 t 的偏移是 8，即 char array[B] 占 1~8 字节并对齐到 8，故 B ∈ {5,6,7,8}；`addq 32(%rsi)` 说明 u 的偏移是 32，而 u 前面是 t(4 字节) 与 short s[A]（2A 字节），即 align8(12+2A) = 32，所以 12+2A ∈ (24,32]，A ∈ {7,8,9,10}。两个条件联立（AB ∈ {45,46} 且 B ∈ [5,8]）只有 A = 9、B = 5 成立（9×5 = 45，4×45 = 180，对齐后正好 184）。","tags":["结构体对齐","汇编反推","padding"],"options":null,"answer":["9"],"kp":"数据布局与对齐"},{"id":"s2025a-49","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"由汇编偏移反推结构体数组维度 B","type":"fill","difficulty":3,"stem":"下面的代码中 A 和 B 是 #define 定义的常数。根据 GCC 生成的汇编代码，B 的值是多少？","code":"typedef struct {\n    int x[A][B];   /* Unknown constants A and B */\n    long y;\n} str1;\n\ntypedef struct {\n    char array[B];\n    int t;\n    short s[A];\n    long u;\n} str2;\n\nvoid setVal(str1 *p, str2 *q) {\n    long v1 = q->t;\n    long v2 = q->u;\n    p->y = v1 + v2;\n}\n\n# p in %rdi, q in %rsi\nsetVal:\n    movslq 8(%rsi), %rax\n    addq   32(%rsi), %rax\n    movq   %rax, 184(%rdi)\n    ret","explanation":"B 的值由 str2 中 t 的偏移锁定：array 是 char[B]，t 是 int，`movslq 8(%rsi),%rax` 表明 t 位于偏移 8，意味着 array 之后有填充，使 int 对齐到 4 且整体偏移为 8，于是 B 必须落在 5~8 之间（B ≤ 4 时 t 会在偏移 4，不需要对齐到 8；B ≥ 9 时 t 的偏移会超过 8）。再结合 str1 的 `movq %rax,184(%rdi)` 得到 A×B ∈ {45,46}，而 A ∈ {7,8,9,10}，唯一可行组合是 B = 5、A = 9。可见结构体大小与成员偏移是「反推」题最可靠的已知量。","tags":["结构体对齐","汇编反推","成员偏移"],"options":null,"answer":["5"],"kp":"数据布局与对齐"},{"id":"s2025a-50","source":"2025 第 1 次阶段测验","origin":"exam","lecture":7,"topic":"浮点与整数参数的寄存器分配","type":"single","difficulty":2,"stem":"下面是 C 代码与其对应的汇编代码。变量 b、c、result 分别在哪个寄存器中？","code":"double mix_compute(long *a, double *b, float c) {\n    double result = *a + *b + c;\n    return result;\n}\n\nmix_compute:\n    movsd  (%rsi), %xmm1\n    movq   (%rdi), %rax\n    cvtsi2sd %rax, %xmm2\n    addsd  %xmm1, %xmm2\n    cvtss2sd %xmm0, %xmm0\n    addsd  %xmm2, %xmm0\n    ret","explanation":"整数/指针参数与浮点参数走两套独立的寄存器序列：整型（含指针）依次用 %rdi、%rsi、%rdx…，浮点依次用 %xmm0、%xmm1…。所以 a（long*）在 %rdi，b（double*）在 %rsi，c（float）在 %xmm0；函数返回值若为 double 则放在 %xmm0，所以 result 也在 %xmm0。汇编中 `movsd (%rsi),%xmm1` 是把 *b 读入 xmm1（注意 xmm1 只是临时载体，不是 b 的存储位置），`cvtss2sd %xmm0,%xmm0` 则把 float 的 c 就地转成 double 以满足混合运算的类型提升规则。","tags":["调用约定","浮点寄存器","类型提升"],"options":["b:%rsi  c:%xmm0  result:%xmm0","b:%xmm1  c:%xmm0  result:%xmm0","b:%rsi  c:%xmm1  result:%xmm0","b:%rdi  c:%xmm0  result:%rax"],"answer":0,"kp":"机器级编程基础"},{"id":"gen-c07-01","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"指针运算与数组步长","type":"single","difficulty":1,"stem":"设有声明 `int val[5];`，且 `&val[0]` 的值等于 x。那么表达式 `val + 1` 的值是：","code":null,"explanation":"数组名 val 在表达式中会退化为指向首元素的指针，类型是 `int *`。C 的指针加法按所指类型的大小缩放：`val + i` 的地址是 x + i × sizeof(int) = x + 4i 字节，所以 `val + 1` 等于 x + 4，也就是 &val[1]。选项 A 是「按字节加 1」的错误直觉；选项 C 的 x+20 是整个数组的大小（x + 5×4），对应 val+5，已经越过数组末尾；选项 D 把下标步长与元素个数混在一起。踩坑点：`*(val+1)` 才是 val[1] 的值 5，而 `val+1` 本身是一个地址。对应第 7 讲「Array Access」一表中 `val+1 → x+4`、`val + i → x + 4*i` 的结论。","tags":["指针运算","数组","sizeof"],"options":["x + 1","x + 4","x + 20","x + 5"],"answer":1,"kp":"数据布局与对齐"},{"id":"gen-c07-02","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"sizeof 数组与指针","type":"single","difficulty":1,"stem":"在 x86-64/Linux 上声明 `int A1[3];`（`int` 占 4 字节）。`sizeof(A1)` 与 `sizeof(*A1)` 的值分别是：","code":null,"explanation":"`sizeof(A1)` 作用于整个数组对象，结果是数组总字节数 3 × 4 = 12。`A1` 在表达式中退化为 `int *`，`*A1` 就是 A1[0]，类型是 `int`，所以 `sizeof(*A1)` 等于 4。选项 B 把 3 当成字节数（那是元素个数）；选项 C 误以为 `*A1` 也是数组；选项 D 把数组大小当成了指针大小。讲义「Understanding Pointers & Arrays」表中给出：对 `int A1[3]`，sizeof(An) = 12、sizeof(*An) = 4、sizeof(**An) 无意义；而对 `int *A2`，sizeof(An) = 8（64 位指针）、sizeof(*An) = 4。区分「数组名」与「指针变量」是这一节的关键。对应第 7 讲数组分配与指针/数组对照表。","tags":["sizeof","数组","指针"],"options":["12 和 4","3 和 4","12 和 12","4 和 4"],"answer":0,"kp":"数据布局与对齐"},{"id":"gen-c07-03","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"结构体字段偏移","type":"single","difficulty":1,"stem":"设有如下结构体（x86-64，`size_t` 与指针均为 8 字节）。字段 `next` 相对结构体起始地址的偏移是多少字节？","code":"struct rec {\n    int a[4];\n    size_t i;\n    struct rec *next;\n};","explanation":"结构体字段按声明顺序依次分配，编译器只在必要时插入填充。a 是 4 个 int，占偏移 0～15；i 是 8 字节，其对齐要求为 8，偏移 16 已经是 8 的倍数，无需填充，占 16～23；next 是 8 字节指针，偏移 24 也是 8 的倍数，因此 next 的偏移是 24，整个结构体大小为 32（正好是最大对齐 8 的倍数）。选项 A 是 i 的偏移；选项 C 是结构体总大小而不是 next 的偏移；选项 D 忽略了 8 字节字段的对齐要求，误以为紧接 a 只需 20 字节。讲义中该结构体的示意图标注的正是 0、16、24、32。踩坑点：`movslq 16(%rdi), %rax` 取的就是 i，`movq 24(%rdi), %rdi` 取的是 next。对应第 7 讲「Structure Representation」与「Following Linked List」一节。","tags":["结构体","偏移","内存布局"],"options":["16","24","32","20"],"answer":1,"kp":"数据布局与对齐"},{"id":"gen-c07-04","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"嵌套数组元素地址计算","type":"single","difficulty":2,"stem":"声明 `int pgh[4][5];`，若 `&pgh[0][0]` 的值是 0x1000，则 `&pgh[2][3]` 的值是：","code":null,"explanation":"二维数组按行优先连续存放，元素 A[i][j] 的地址是 A + i×(C×K) + j×K，本题 C = 5 列、K = sizeof(int) = 4 字节。代入 i = 2、j = 3：0x1000 + 2×20 + 3×4 = 0x1000 + 40 + 12 = 0x1000 + 52 = 0x1034（52 = 0x34）。也可以看成先跨过 2 整行（每行 20 字节），再在本行内偏移 3 个 int（12 字节）。选项 B 的 0x102C = 0x1000 + 44，相当于把 digit 误当成 1（2×20 + 1×4）；选项 C 的 0x1050 = 0x1000 + 80，相当于把行跨距当成 40 字节（误以为 C = 10）；选项 D 的 0x1030 = 0x1000 + 48，相当于把元素大小当成 8 字节（误以为 int 是 8 字节）。讲义的表达形式是 `pgh + 4*(5*index + dig)`，对应第 7 讲「Nested Array Element Access」一节。","tags":["多维数组","行优先","地址计算"],"options":["0x1034","0x102C","0x1050","0x1030"],"answer":0,"kp":"数据布局与对齐"},{"id":"gen-c07-05","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"结构体数组的步长与字段偏移","type":"single","difficulty":3,"stem":"设有如下声明（x86-64 上 `short` 2 字节、`float` 4 字节）。表达式 `&a[3].j` 相对数组首地址的字节偏移是多少？","code":"struct S3 {\n    short i;\n    float v;\n    short j;\n} a[10];","explanation":"先求结构体布局：i（2 字节）在偏移 0；v 是 float，对齐要求 4，偏移 4 才合法，于是插入 2 字节内部填充，v 占 4～7；j 是 short，对齐要求 2，放在偏移 8。此时结构体已用 10 字节，但整体对齐要求 K = max(2,4,2) = 4，结构体总大小必须补到 4 的倍数，故 sizeof(struct S3) = 12，末尾有 2 字节外部填充。数组元素步长因此是 12 字节，&a[3].j 的偏移 = 3×12 + 8 = 44。选项 B 的 36 = 3×12，相当于漏掉了 j 在结构体内的偏移 8；选项 C 的 40 = 3×12 + 4，相当于把 j 的偏移误当成 4；选项 D 的 48 相当于把元素步长误当成 16 字节。讲义中 get_j 的汇编 `leaq (%rdi,%rdi,2),%rax; movzwl a+8(,%rax,4),%eax` 正体现了 12×idx + 8 的地址计算。对应第 7 讲「Accessing Array Elements」与「Satisfying Alignment with Structures」一节。","tags":["结构体对齐","数组步长","填充"],"options":["44","36","40","48"],"answer":0,"kp":"数据布局与对齐"},{"id":"gen-c07-06","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"数据对齐规则","type":"multi","difficulty":2,"stem":"关于 x86-64 上的数据对齐，下列说法正确的有：","code":null,"explanation":"选项 A 正确：2 字节类型的地址必须是 2 的倍数，即最低 1 位为 0（讲义写作最低 1 位必须为 0）。选项 B 正确：8 字节类型的地址必须是 8 的倍数，最低 3 位为 0（讲义写作最低 3 位必须为 000）。选项 C 错误：结构体总大小不仅要算上内部填充，还必须向上取整到「最大字段对齐要求 K」的整数倍，例如 struct S3 字段加起来是 10 字节，实际却是 12 字节。选项 D 正确：编译器在字段之间插入空隙以保证每个字段的地址满足对齐要求，例如 struct S1 {char c; int i[2]; double v;} 中 c 之后要空出 3 字节。选项 E 错误：x86-64 硬件允许未对齐访问（只是可能跨缓存行、变慢），并不会崩溃，严格的崩溃行为出现在某些 RISC 机器上。对应第 7 讲「Alignment Principles」「Specific Cases of Alignment」与「Satisfying Alignment with Structures」三节。","tags":["对齐","填充","结构体大小"],"options":["2 字节类型（如 `short`）的地址最低 1 位必须为 0","8 字节类型（如 `double`、`long`、指针）的地址最低 3 位必须为 0","结构体的总大小等于其各字段大小之总和","编译器会在字段之间插入填充字节（internal padding）以满足各字段的对齐要求","在 x86-64 上访问未对齐的 `int` 一定会导致程序崩溃"],"answer":[0,1,3],"kp":"数据布局与对齐"},{"id":"gen-c07-07","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"多级数组的访存次数","type":"judge","difficulty":2,"stem":"对于 `int *univ[3];` 形式的多级数组，访问 `univ[index][digit]` 需要两次内存读取：先读出 `univ[index]` 这个指针，再按该指针读出目标整数。","code":null,"explanation":"判断正确。多级数组的本质是「指针的数组」：univ 本身是含 3 个指针元素的数组（每个 8 字节），访问 univ[index] 要先把指针从内存中读出来，然后加上 4×digit 再读一次内存才能得到元素值，即 Mem[Mem[univ + 8*index] + 4*digit]，共两次内存读取。相比之下嵌套数组 `int pgh[4][5]` 只需一次访存，因为行地址 pgh + 20*index 可以离线由 lea 直接算出，不需要额外读指针（对应汇编 `movl pgh(,%rsi,4), %eax` 只有一条访存指令）。两种写法在 C 中看起来一样，但地址计算与访存次数差别很大——这是讲义反复强调的对比。对应第 7 讲「Element Access in Multi-Level Array」与「Array Element Accesses」一节。","tags":["多级数组","访存","指针"],"options":null,"answer":true,"kp":"数据布局与对齐"},{"id":"gen-c07-08","source":"自编 · 第 7 讲","origin":"created","lecture":7,"topic":"结构体大小与对齐计算","type":"fill","difficulty":2,"stem":"在 x86-64/Linux 上，结构体 `struct S4 { char c; int i; char d; };` 的 `sizeof(struct S4)` 等于多少字节？","code":null,"explanation":"逐个字段看：c 是 char（1 字节，无对齐限制），放在偏移 0；i 是 int，对齐要求 4，偏移 1 不合法，因此编译器插入 3 字节内部填充，i 放在偏移 4，占 4～7；d 是 char，可以放在偏移 8。此时共用了 9 字节，但结构体的对齐要求 K 等于最大字段对齐要求 4，整体长度必须是 4 的倍数，于是末尾再补 3 字节外部填充，sizeof 为 12。讲义特意用 S4{char,int,char}=12 字节与 S5{int,char,char}=8 字节对比，说明「把大类型放在前面可以省空间」：S5 中 i 占 0～3、c 占 4、d 占 5，只需再补 2 字节到 8。踩坑点：只把字段大小相加得到 6，忽略了对齐填充。对应第 7 讲「Saving Space」与「Meeting Overall Alignment Requirement」一节。","tags":["结构体","对齐","sizeof"],"options":null,"answer":["12","0xC"],"kp":"数据布局与对齐"},{"id":"f2016-03","source":"2016 期末","origin":"exam","lecture":8,"topic":"缓冲区溢出的防护手段","type":"single","difficulty":1,"stem":"缓冲区溢出会带来程序风险，下列避免方法中错误的是","code":null,"explanation":"栈保护（金丝雀值）在函数返回前检查哨兵是否被改写，属于 A；避免使用不检查长度的 gets/fgets 之类函数属于 B；ASLR 随机化栈的起始地址让攻击者难以定位注入代码或返回地址，属于 C——这三者都是教材介绍的防护手段。而“把缓冲区开得更大”只是提高门槛，攻击者只要输入更长照样溢出，无法从根本上消除风险，甚至可能掩盖问题，故 D 错。","tags":["缓冲区溢出","栈保护","ASLR"],"options":["在栈中存放特殊字段用于检测是否发生缓冲区溢出","避免使用有风险的库函数，如 gets 等","随机设置栈的偏移地址","分配尽可能大的缓冲区数组"],"answer":3,"kp":"内存安全与攻击"},{"id":"lab2025-18","source":"2025 Lab 测验","origin":"exam","lecture":8,"topic":"BombLab phase_1 的字符串定位","type":"single","difficulty":3,"stem":"下面是 phase_1 函数的反汇编代码，下列描述正确的是：","code":"0000000000002798 <phase_1>:\n    2798: f3 0f 1e fa           endbr64\n    279c: 48 83 ec 08           sub    $0x8,%rsp\n    27a0: 48 8d 35 a1 1b 00 00  lea    0x1ba1(%rip),%rsi\n          # 4348 <_IO_stdin_used+0x348>\n    27a7: e8 a6 05 00 00        call   2d52 <strings_not_equal>\n    27ac: 85 c0                 test   %eax,%eax\n    27ae: 75 05                 jne    27b5 <phase_1+0x1d>\n    27b0: 48 83 c4 08           add    $0x8,%rsp\n    27b4: c3                    ret\n    27b5: e8 c7 06 00 00        call   2e81 <explode_bomb>\n    27ba: eb f4                 jmp    27b0 <phase_1+0x18>","explanation":"内置字符串存放在只读数据段 .rodata（本例位于 0x4348），内容是明文，因此用 `strings bomb` 扫描二进制文件通常能直接看到疑似口令的字符串，是最快的定位手段（C 对）。A 错：strings_not_equal 要求两个字符串完全相等（逐字符比较到结束符 \\0 为止），前缀相同不算通过。B 错：strings_not_equal 是炸弹程序**自己**定义的函数而非 libc 函数，替换 libc 起不到作用，而且这种做法既复杂又容易破坏了程序环境。D 错：`lea 0x1ba1(%rip),%rsi` 已经把该字符串的地址装进 %rsi，在 gdb 中 `x/s $rsi` 就能把明文读出来，反汇编分析完全能够获得答案。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["BombLab","字符串比较","rodata"],"options":["phase_1 中比较两个字符串时，即使输入字符串更长，只要内置字符串是输入字符串的前缀子串，就会判定为相等","strings_not_equal 是库函数，可以通过替换 libc 库使该函数返回 0，从而直接完成 phase_1","利用 binutils 的 strings 命令可以快速找到 phase_1 需要比对的内置字符串","只查看 phase_1 的反汇编和寄存器信息无法获得需要比对的内置字符串的地址"],"answer":2,"kp":"机器级编程基础"},{"id":"lab2025-21","source":"2025 Lab 测验","origin":"exam","lecture":8,"topic":"hex2raw 工具的用法","type":"single","difficulty":2,"stem":"在 AttackLab 中，hex2raw 工具用于将表示十六进制的字符串转换为字节序列，以便把攻击代码注入目标程序。假设现在有一个包含十六进制字符串的文件 hex.txt，下列哪个选项是**错误**的？","code":null,"explanation":"选 D：hex2raw 只是一个固定的「文本到二进制」格式转换程序，它的转换逻辑不依赖输入内容，改了 hex.txt 只要重新运行 `hex2raw < hex.txt > raw.bin` 即可，完全不需要重新编译工具。A、B 都是正确的用法（管道与输入重定向等效，前者把文件内容送入工具的标准输入，后者直接用 < 重定向），C 也是标准的攻击方式：把生成的二进制 payload 通过输入重定向喂给 ctarget。这题提醒我们区分「数据」与「程序」：修改数据不需要重新编译程序。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["AttackLab","hex2raw","重定向"],"options":["可以使用命令 cat hex.txt | hex2raw > raw.bin 将 hex.txt 中的内容转换为字节序列并保存到 raw.bin 文件中","可以使用命令 hex2raw < hex.txt > raw.bin 将 hex.txt 中的内容转换为字节序列并保存到 raw.bin 文件中","在得到文件 raw.bin 后，可以使用命令 ./ctarget < raw.bin 将 raw.bin 作为输入传递给目标程序 ctarget","如果修改了 hex.txt 文件的内容，必须重新编译 hex2raw 工具才能正确转换新的内容"],"answer":3,"kp":"整数与位运算"},{"id":"lab2025-22","source":"2025 Lab 测验","origin":"exam","lecture":8,"topic":"AttackLab 中的漏洞位置与防护机制","type":"single","difficulty":3,"stem":"下列关于 AttackLab 的描述中，哪个选项是正确的？","code":null,"explanation":"target 的漏洞根源是 getbuf 调用 Gets（不做长度检查）并把用户输入写入自己栈帧中一块固定大小的缓冲区，因此溢出点就在 getbuf 的栈帧里（A 对）。B 错：ctarget 的栈地址固定，攻击者可以直接跳到精确地址，不需要 NOP 雪橇这类「滑动着陆」技术。C 错：**rtarget** 启用了 ASLR 与不可执行栈（NX），所以不能在栈上注入并执行代码，必须转向 ROP；把它与 ctarget 混为一谈是错误的。D 也错：这些 target 并没有启用栈金丝雀（我们正是靠覆盖返回地址来劫持控制流），阻止栈上代码执行的是 NX 而不是金丝雀。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["AttackLab","缓冲区溢出","ASLR","NX"],"options":["AttackLab 的目标程序（target）往往包含缓冲区溢出漏洞，这个漏洞只存在于 getbuf 函数的栈帧中","在 AttackLab 中，我们尝试进行了空操作雪橇（nop sled）攻击","ctarget、starget、rtarget 都没有使用地址空间布局随机化（ASLR）技术，因此可以直接注入可执行的攻击代码","因为存在金丝雀值保护机制，所以我们不能在栈上直接注入可执行的攻击代码，而必须使用 ROP 技术"],"answer":0,"kp":"内存安全与攻击"},{"id":"lab2025-23","source":"2025 Lab 测验","origin":"exam","lecture":8,"topic":"用 GDB 调试 AttackLab 的目标程序","type":"single","difficulty":2,"stem":"在 AttackLab 中，gdb 用于调试目标程序、分析运行状态和内存布局。假设要调试名为 ctarget 的目标程序，下列哪个选项是正确的？","code":null,"explanation":"`break getbuf`（简写 b getbuf）在函数入口处下断点，这正是分析 getbuf 栈帧的标准做法（C 对）。A 错：gdb 启动后进入交互模式，必须输入 `run`（或 r）程序才会开始执行。B 错：`x` 命令用于检查**内存**内容（x/x $rdi 是把地址 0x... 处的内存按十六进制显示），要看寄存器本身的值应当用 `print $rdi` 或 `info registers rdi`。D 错：把文件作为输入传给被调试程序要用输入重定向 `<`（即 `run < input.txt`），`>` 是输出重定向，含义完全相反。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["gdb","断点","重定向","AttackLab"],"options":["使用命令 gdb ctarget 启动 gdb 调试器后，想要调试的程序自动开始运行","如果我们想要以十六进制格式打印出寄存器 $rdi 的值，可以使用命令 x/x $rdi","可以使用命令 break getbuf 或 b getbuf 在 getbuf 函数入口处设置断点","在 gdb 中，可以使用命令 run > input.txt 将文件 input.txt 的内容作为输入传递给目标程序"],"answer":2,"kp":"系统级 I/O"},{"id":"lab2025-25","source":"2025 Lab 测验","origin":"exam","lecture":8,"topic":"touch3 攻击串与字符串终止符","type":"single","difficulty":3,"stem":"在 AttackLab 的 phase3 中，需要通过缓冲区溢出来执行 touch3。下面是 touch3、hexmatch 的函数原型以及 phase3 的一种题解。判断下面说法**错误**的是：","code":"/* Compare string to hex represention of unsigned value */\nint hexmatch(unsigned val, char *sval)\n{\n    char cbuf[110];\n    /* Make position of check string unpredictable */\n    char *s = cbuf + random() % 100;\n    sprintf(s, \"%.8x\", val);\n    return strncmp(sval, s, 9) == 0;\n}\n\nvoid touch3(char *sval)\n{\n    vlevel = 3;\n    if (hexmatch(cookie, sval)) {\n        printf(\"Touch3!: You called touch3(\\\"%s\\\")\\n\", sval);\n        validate(3);\n    } else {\n        printf(\"Misfire: You called touch3(\\\"%s\\\")\\n\", sval);\n        fail(3);\n    }\n    exit(0);\n}\n\n// phase3 的一种题解\n/* padding with 56 bytes */\n00 00 00 00 00 00 00 00   /* x7 行，共 56 字节 */\n/* Address of exploit code movq &cookie, %rdi */\n98 bd 66 55 00 00 00 00\n/* Address of a ret in exploit code, used for %rsp alignment */\n9f bd 66 55 00 00 00 00\n/* Address of touch3 */\n98 1e 40 00 00 00 00 00\n/* movq &cookie, %rdi */\n48 c7 c7 a0 bd 66 55\n/* ret */\nc3\n/* String representation of cookie */\n32 64 36 66 63 32 64 35 00","explanation":"选 D：payload 末尾的 00 是 C 字符串的**终止符**（cookie 的十六进制字符串本身结束于此），而不是「为对齐填充的字节」。C 语言的 strncmp 在遇到 \\0 时终止比较，所以这个字节决定了字符串的长度与内容，绝不是「被忽略」——如果该位置没有 \\0，比较会因越界读入后面的垃圾字节而失败；反过来若把 \\0 前移或后移，比较也会失败。其余三项与题解自洽：`sub $0x38` 说明缓冲区 56 字节（A 对）；题解把攻击代码放在 0x5566bd98，按栈帧布局推算执行到该处时 %rsp = 0x5566bd88（B 对）；cookie 字符串在 0x5566bda0，即 movq 指令写入 %rdi 的常量（C 对）。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["AttackLab","touch3","字符串终止符"],"options":["缓冲区的大小为 56 字节","在执行 movq &cookie,%rdi 指令时，寄存器 %rsp 的值是 0x5566bd88","当执行完 movq &cookie,%rdi 指令后，寄存器 %rdi 的值是 0x5566bda0","如果 cookie 的字符串表示末尾的 00 字节是为了填充对齐而添加的，hexmatch 函数在比较时会忽略该字节"],"answer":3,"kp":"整数与位运算"},{"id":"m2014-07","source":"2014 期中","origin":"exam","lecture":8,"topic":"缓冲区溢出的防护手段","type":"single","difficulty":2,"stem":"关于如何避免缓冲区溢出带来的程序风险，下述**错误**的做法是：","code":null,"explanation":"把缓冲区定义得更大并不能从根本上解决问题：只要输入足够长，仍然会越过边界改写栈上的返回地址，只是把攻击所需的输入长度推大而已，故选 A。B 是源代码级防护：fgets 会限定读取长度，避免 gets 的无界写入。C 是运行时防护：栈地址随机化（ASLR）让攻击者难以确定注入代码/返回地址的位置。D 是硬件级防护：把栈标记为不可执行（NX/不可执行位）后，即使注入了代码也无法执行。三者都是教材中列举的有效手段。踩坑点：安全防护要消除「无界写入」这个根源，靠加大数组属于治标不治本。","tags":["缓冲区溢出","ASLR","不可执行栈"],"options":["编程时定义大的缓冲区数组","编程时避免使用 gets，而采用 fgets","程序运行时随机化栈的偏移地址","在硬件级别引入不可执行代码段的机制"],"answer":0,"kp":"内存安全与攻击"},{"id":"m2022-09","source":"2022 期中","origin":"exam","lecture":8,"topic":"缓冲区溢出攻击的防护","type":"single","difficulty":1,"stem":"下面列举了若干技术改进方案，其中不能防止缓冲区溢出攻击的是：","code":null,"explanation":"B 是本题答案：支持变长栈帧（例如 alloca、变长数组）只是让栈的分配更灵活，它本身不是安全机制，反而让栈布局更不可预测、更难分析；它与阻止缓冲区溢出被利用没有关系。A 的金丝雀值能检测出栈上的局部数组是否溢出改写了控制信息，从而在返回前中止程序。C 限制可执行代码区域（NX/XD 位）使攻击者注入的代码无法执行。D 的 ASLR 随机化代码与数据的地址，使攻击者难以定位注入代码或跳转目标。踩坑点：不要因为“变长栈帧”听起来与栈有关就以为它能防攻击。","tags":["缓冲区溢出","栈保护","ASLR"],"options":["使用金丝雀值（canary）支持对栈破坏检测。","支持变长栈帧。","限制可执行代码区域。","地址空间布局随机化（ASLR）。"],"answer":1,"kp":"内存安全与攻击"},{"id":"m2024-06","source":"2024 期中","origin":"exam","lecture":8,"topic":"缓冲区溢出攻击的防御手段","type":"single","difficulty":2,"stem":"下述说法错误的是：","code":null,"explanation":"C 在指令细节上出错：栈保护（stack canary）的做法是在过程开始时把只读段里的金丝雀值放进栈中，返回前把栈中保存的值与只读段中的原值比较，编译出来的汇编是先用 xorq/mov 取回值再 cmp，条件跳转用的是“相等跳转”je（不等则跳转报错），而不是用有符号比较的 jle；金丝雀检查只判断相等与否，与大小无关，所以 C 错误，为本题答案。A 正确：fgets、strncpy 等带长度上限的函数可以避免无界写入。B 正确：ASLR 使攻击者无法确定代码/数据的地址，随机范围要足够大才有效，又不能浪费地址空间，确实存在权衡。D 正确：可执行权限由页表项中的 XD/NX 位配合硬件检查完成，几乎不带来性能损失。","tags":["缓冲区溢出","栈保护","ASLR"],"options":["我们可以使用安全的函数编写程序如 fgets strncpy 指定每次读取的字节数来避免缓冲区溢出，对抗攻击","可以使用地址随机化来随机化程序的内存布局，从而使得攻击代码的位置不再确定，但此处存在权衡：随机的范围必须足够大才足以对抗攻击，但又要足够小避免浪费太多程序空间","可以在过程开始时，从一个特殊的只读段中获取一个金丝雀值放入栈中，在函数返回时，先使用 cmpq 指令来进行比较，随后使用 jle 指令来根据条件码跳转","可以限制哪些内存页内的数据可以当做代码来执行，检查一个页是否可以执行是由硬件来完成的，效率上没有损失"],"answer":2,"kp":"内存安全与攻击"},{"id":"s2025a-51","source":"2025 第 1 次阶段测验","origin":"exam","lecture":8,"topic":"大端与小端：联合体字节序","type":"single","difficulty":2,"stem":"考虑下面的 C 语言代码。如果在大端模式的计算机（如 Sun）上运行，输出结果是什么？","code":"union {\n    unsigned char c[8];\n    unsigned int i[2];\n} dw;\n\nint j;\nfor (j = 0; j < 8; j++)\n    dw.c[j] = 0xC0 + j;\nprintf(\"Ints 0-1 == [0x%x,0x%x]\\n\", dw.i[0], dw.i[1]);","explanation":"循环把 8 个字节按地址递增依次写成 0xC0、0xC1、…、0xC7。union 的两个成员共享同一块内存，sizeof(dw.i[0]) = 4，所以 i[0] 覆盖最低地址的 4 个字节（0xC0~0xC3）。大端机器把最高有效字节放在最低地址，因此 i[0] 的值读作 0xC0C1C2C3，i[1] 读作 0xC4C5C6C7。若在小端机器上运行，同样的字节会读成 [0xC3C2C1C0, 0xC7C6C5C4]，这正是选项 B —— 字节序不同，同一块内存的整数解释完全不同，这也是网络编程必须统一用大端（网络字节序）的原因。","tags":["字节序","大端","union"],"options":["[0xC0C1C2C3, 0xC4C5C6C7]","[0xC3C2C1C0, 0xC7C6C5C4]","[0xC4C5C6C7, 0xC0C1C2C3]","[0xC0C1C2C3, 0xC7C6C5C4]"],"answer":0,"kp":"整数与位运算"},{"id":"s2025a-52","source":"2025 第 1 次阶段测验","origin":"exam","lecture":8,"topic":"缓冲区溢出防御：安全库函数","type":"single","difficulty":2,"stem":"课上讲授了防御或避免缓冲区攻击的几种主要方法。以普遍情况为准，使用 `fgets()` 等安全的库函数，是否需要修改用户程序源代码、是否需要重新编译用户程序、是否需要更换新的 CPU 硬件？","code":null,"explanation":"使用 fgets 取代 gets 属于「源码级」的修复：程序员必须改写源代码中不安全函数的调用（gets 不限制长度，fgets 显式给出缓冲区大小上限），因此「需要修改源码」；改完源码必须重新编译才能生效；而这一切只依赖标准库函数，不涉及任何 CPU 新特性，所以「不需要更换硬件」。相比之下，栈随机化（ASLR）只需操作系统支持，源码、编译、硬件都不用动；NX 可执行位需要 CPU 的硬件支持；金丝雀值需要编译器插入检查代码，因此要重新编译。这张表的关键在于分清每种防御措施作用的层次。","tags":["缓冲区溢出","fgets","防御措施"],"options":["是，是，否","否，否，否","否，是，否","否，否，是"],"answer":0,"kp":"内存安全与攻击"},{"id":"s2025a-53","source":"2025 第 1 次阶段测验","origin":"exam","lecture":8,"topic":"缓冲区溢出防御：栈随机化","type":"single","difficulty":2,"stem":"以下防御缓冲区攻击的方法中，栈初始位置随机化（ASLR）是否需要修改用户程序源代码、是否需要重新编译用户程序、是否需要更换新的 CPU 硬件？","code":null,"explanation":"栈随机化的实现主体是操作系统：内核在创建进程时把栈的起始位置随机化，程序本身完全察觉不到，因此既不需要改源码、也不需要重新编译、更不需要任何新硬件（三个答案都是「否」）。它的防御原理是让攻击者无法事先知道注入代码会落在哪个地址，从而无法填写正确的跳转地址；缺点是随机化的空间有限（通常若干位熵），攻击者仍可能通过大量尝试（暴力破解、NOP sled）碰运气，而且它并不能阻止溢出本身，只是让利用变难。","tags":["ASLR","栈随机化","缓冲区溢出"],"options":["是，是，否","否，否，否","否，是，否","否，否，是"],"answer":1,"kp":"内存安全与攻击"},{"id":"s2025a-54","source":"2025 第 1 次阶段测验","origin":"exam","lecture":8,"topic":"缓冲区溢出防御：不可执行位（NX）","type":"single","difficulty":2,"stem":"以下防御缓冲区攻击的方法中，在内存访问权限上设置「可执行」位（即把栈标记为不可执行）是否需要修改用户程序源代码、是否需要重新编译用户程序、是否需要更换新的 CPU 硬件？","code":null,"explanation":"把栈和堆标记为不可执行需要页表中新增「可执行」权限位，这必须由 CPU 硬件支持（x86 上对应 NX / AMD 的 EVP、Intel 的 XD 位，x86-64 与较新的 32 位 CPU 才具备），所以「需要更换新的 CPU 硬件」为「是」；而程序的源码不需要改写、也不需要重新编译（操作系统配合加载器设置页面权限即可）。它的防御原理是即使攻击者成功把代码注入到栈上，CPU 取指时也会因页面不可执行而抛出异常。这种防御的不足在于无法阻止 return-to-libc / ROP 这类「复用已有可执行代码」的攻击。","tags":["NX","可执行位","缓冲区溢出"],"options":["是，是，否","否，否，否","否，是，否","否，否，是"],"answer":3,"kp":"内存安全与攻击"},{"id":"s2025a-55","source":"2025 第 1 次阶段测验","origin":"exam","lecture":8,"topic":"缓冲区溢出防御：金丝雀机制","type":"single","difficulty":2,"stem":"以下防御缓冲区攻击的方法中，「金丝雀」（哨兵）机制是否需要修改用户程序源代码、是否需要重新编译用户程序、是否需要更换新的 CPU 硬件？","code":null,"explanation":"金丝雀机制由编译器在栈帧中插入一个随机哨兵值（x86-64 上通常是 %fs:0x28 处的值），函数返回前检查它是否被改写，被改写就调用 __stack_chk_fail 终止程序。它由编译器自动完成，程序员不必改动源代码（用 gcc 的 -fstack-protector 开关即可），但必须重新编译程序才能插入这些检查代码；整个过程不需要新硬件。它的主要局限是：若攻击者能同时覆盖哨兵与返回地址而不被发现（例如借助信息泄露先读出哨兵值），保护就会失效——实验中被攻击的 ctarget 就没有启用该保护。","tags":["金丝雀","栈保护","编译器"],"options":["是，是，否","否，否，否","否，是，否","否，否，是"],"answer":2,"kp":"内存安全与攻击"},{"id":"gen-c08-01","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"union 与字节序","type":"single","difficulty":1,"stem":"在 x86-64（小端）机器上，执行下面程序片段之后，`dw.s[0]` 的值是：","code":"union {\n    unsigned char  c[8];\n    unsigned short s[4];\n    unsigned int   i[2];\n    unsigned long  l[1];\n} dw;\n\nint j;\nfor (j = 0; j < 8; j++)\n    dw.c[j] = 0xf0 + j;","explanation":"union 的所有成员共用同一段起始地址，所以 `s[0]` 恰好覆盖 `c[0]` 与 `c[1]` 两个字节。x86-64 是小端序，低地址字节存放低位，因此 `s[0]` 把 `c[0]=0xf0` 当作低 8 位、`c[1]=0xf1` 当作高 8 位，结果是 0xf1f0。选项 A（0xf0f1）是大端机器上的结果，对应讲义第 8 讲「Byte Ordering on Sun」那一页的 `[0xf0f1,0xf2f3,...]`；选项 B 是 `i[0]` 的值（覆盖 c[0]~c[3]）；选项 C 是 64 位成员 `l[0]` 的值（覆盖 c[0]~c[7]）。踩坑点：union 不改变字节序，只改变「用多宽的视角看同一段内存」。","tags":["union","字节序","小端"],"options":["0xf0f1","0xf3f2f1f0","0xf7f6f5f4f3f2f1f0","0xf1f0"],"answer":3,"kp":"整数与位运算"},{"id":"gen-c08-02","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"x86-64 进程内存布局","type":"single","difficulty":1,"stem":"讲义第 8 讲给出了一次内存分配示例中各对象打印出来的地址。据此判断，下列对象中位于**栈（Stack）**段的是：","code":"char big_array[1L<<24];   /* 16 MB，全局数组 */\nchar huge_array[1L<<31];  /* 2 GB，全局数组 */\n\nint main()\n{\n    void *phuge1, *psmall2;\n    int local = 0;\n    phuge1  = malloc(1L << 28);   /* 256 MB */\n    psmall2 = malloc(1L << 8);    /* 256 B  */\n    /* 打印出的地址（每次运行会略有不同）：\n       local     0x00007ffe4d3be87c\n       phuge1    0x00007f7262a1e010\n       psmall2   0x000000008359d010\n       big_array 0x0000000080601060\n       main()    0x000000000040060c\n    */\n}","explanation":"讲义第 8 讲给出的 x86-64 Linux 地址空间自高向低依次是：栈（最高，接近 0x00007ffffffff000，默认 8 MB）、共享库与大块 mmap 区、堆（自低向高增长）、Data（静态数据）、Text（代码，约 0x400000 起）。`local` 的地址 0x00007ffe… 落在最高处的栈区间。`main()` 的 0x40060c 在 0x400000 附近，属于只读的 Text 段；`psmall2` 来自 `malloc(1<<8)`，是堆上的小块；`big_array` 是全局数组，属于讲义所说的 Data（静态分配数据）段。另外要注意讲义特意提示的坑：`phuge1`、`phuge3` 这类超大 malloc 块被放到共享库附近的 mmap 区（0x00007f72…），只有小的 malloc 块才在堆里，所以「凡是 malloc 的都在堆段」并不成立。","tags":["内存布局","栈","堆"],"options":["big_array（地址 0x0000000080601060）","psmall2（地址 0x000000008359d010）","main() 的第一条机器指令（地址 0x000000000040060c）","local（地址 0x00007ffe4d3be87c）"],"answer":3,"kp":"动态内存分配"},{"id":"gen-c08-03","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"缓冲区溢出与返回地址","type":"single","difficulty":2,"stem":"讲义的 echo 例子编译后，`subq $24, %rsp` 把缓冲区 `buf`（`char buf[4]`）放在 `%rsp` 处，返回地址保存在 `%rsp+24` 处。若 `gets(buf)` 恰好读入 23 个字符，函数返回时会发生什么？","code":"/* Echo Line */\nvoid echo()\n{\n    char buf[4];   /* Way too small! */\n    gets(buf);     /* 不检查长度 */\n    puts(buf);\n}\n\n/* echo 的反汇编：\n      subq  $24, %rsp\n      movq  %rsp, %rdi\n      call  gets\n      ...\n      addq  $24, %rsp\n      retq                    */","explanation":"23 个字符占据 buf 的 4 个字节加上其后的 19 个字节填充区（偏移 4~22），`gets` 追加的结尾 '\\0' 落在偏移 23，仍在 24 字节的栈帧之内，因此从 `%rsp+24` 开始的 8 字节返回地址没有被改动，函数可以正常返回——这就是讲义第 8 讲写的「Overflowed buffer, but did not corrupt state」。若输入 24 个字符，结尾的 '\\0' 就落到偏移 24，正好覆盖返回地址的最低字节（0xf6 变成 0x00，对应讲义图中返回地址变成 00 40 06 00），返回地址成了 0x0000000000400600，程序随即崩溃。选项 A 忽略了 `gets` 完全不检查长度这一事实；选项 D 描述的是开启 `-fstack-protector` 后输入 8 个字符（01234567）的情形。","tags":["缓冲区溢出","返回地址","gets"],"options":["只有 buf 的前 4 个字节被写入，多出的 19 个字符被 gets 丢弃","返回地址的最低字节被结尾的 '\\0' 覆盖，程序跳到 0x0400600 后崩溃","缓冲区溢出、写满了其后 19 字节的填充区，但返回地址完好，函数正常返回","栈金丝雀被破坏，程序打印 *** stack smashing detected ***"],"answer":2,"kp":"过程调用与栈"},{"id":"gen-c08-04","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"栈金丝雀与 GCC 栈保护","type":"single","difficulty":2,"stem":"下面是 GCC 用 `-fstack-protector` 编译 echo 后的代码片段。关于这段保护机制，正确的说法是：","code":"echo:\n  40072f: sub    $0x18,%rsp\n  400733: mov    %fs:0x28,%rax      # 取金丝雀\n  40073c: mov    %rax,0x8(%rsp)     # 放到栈上\n  400741: xor    %eax,%eax\n  400743: mov    %rsp,%rdi\n  400746: callq  4006e0 <gets>\n  40074e: callq  400570 <puts@plt>\n  400753: mov    0x8(%rsp),%rax     # 取回金丝雀\n  400758: xor    %fs:0x28,%rax      # 与当前值比较\n  400761: je     400768 <echo+0x39>\n  400763: callq  400580 <__stack_chk_fail@plt>\n  400768: add    $0x18,%rsp\n  40076c: retq","explanation":"讲义第 8 讲「Stack Canaries / Protected Buffer Disassembly」：`-fstack-protector`（现在是 GCC 默认开启）在函数入口用 `mov %fs:0x28,%rax` 从只读的段地址处取出一个随机值——讲义特别注明它「Value generated randomly every time program runs」——并存到缓冲区与返回地址之间的栈位置（这里是 0x8(%rsp)，缓冲区从 %rsp 开始）；函数返回前用 `mov 0x8(%rsp),%rax; xor %fs:0x28,%rax; je` 比较，不相等就调用 `__stack_chk_fail`（运行时打印 *** stack smashing detected *** 并终止）。所以选项 A 错在它不是编译期常量；选项 B 把位置说反了，金丝雀放在缓冲区和返回地址之间正是为了让溢出先破坏它；选项 C 错在检查只在函数返回前做一次，溢出本身照样发生，被改坏的其他局部变量无法恢复，对 ROP 这类不破坏金丝雀的攻击也无效。","tags":["栈金丝雀","栈保护","缓冲区溢出"],"options":["金丝雀是编译时写死在可执行文件里的常量，每次运行都取同一个值","金丝雀被放在返回地址之后（更高地址处），因此溢出缓冲区根本碰不到它","金丝雀能阻止一切缓冲区溢出，包括只覆盖相邻局部变量而不触及返回地址的溢出","金丝雀取自 %fs:0x28（该段只读、每次运行重新随机生成），函数返回前用异或比较，不一致就调用 __stack_chk_fail"],"answer":3,"kp":"内存安全与攻击"},{"id":"gen-c08-05","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"ROP gadget 与指令字节复用","type":"single","difficulty":2,"stem":"讲义用下面的函数演示「重新利用字节码」构造 gadget。攻击者想要一段等价于 `movq %rax, %rdi; retq` 的代码，应把返回地址设为：","code":"void setval(unsigned *p) {\n    *p = 3347663060u;\n}\n\n<setval>:\n  4004d9:  c7 07 d4 48 89 c7    movl  $0xc78948d4,(%rdi)\n  4004df:  c3                   retq","explanation":"讲义第 8 讲用这个函数演示「重新利用字节码」。从 0x4004dc 处开始看字节流：0x4004dc 是 48，即 REX.W 前缀；0x4004dd 是 89，是 mov 的操作码；0x4004de 是 ModRM 字节 c7，二进制 11 000 111，mod=11（寄存器到寄存器）、reg=000（%rax）、r/m=111（%rdi），三者合起来正是 `movq %rax, %rdi`；紧跟其后的 0x4004df 是 c3，即 `retq`。于是 0x4004dc 恰好构成 gadget「movq %rax,%rdi; retq」。选项 A（0x4004d9）是函数真正的指令头 `c7 07 d4 48 89 c7`，一条把立即数写入 (%rdi) 的 movl，作为 gadget 会破坏内存；选项 B（0x4004df）只有一条 retq，什么也不做；选项 D（0x4004d4）是讲义里 ab_plus_c 尾部的另一个 gadget（`lea (%rdi,%rdx,1),%rax; retq`），实现的是 rax ← rdi+rdx，与本题要求不同。","tags":["ROP","gadget","返回地址"],"options":["0x4004d9","0x4004df","0x4004dc","0x4004d4"],"answer":2,"kp":"过程调用与栈"},{"id":"gen-c08-06","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"缓冲区溢出攻击的防护","type":"multi","difficulty":2,"stem":"针对「把可执行代码注入栈上缓冲区、再让返回地址跳过去执行」这类攻击，下列措施中能直接阻止它或显著提高其难度的是（多选）：","code":null,"explanation":"讲义第 8 讲把对策归纳为四类，正好对应 A~D。(1) 代码层面避免漏洞：用 `fgets(buf, 4, stdin)` 代替 `gets`、用 `strncpy` 代替 `strcpy`、不要用 `%s` 转换（或写成 `%ns` 限制长度）——没有溢出就没有攻击；(2) 系统级保护之一是把栈标为不可执行（x86-64 增加了显式的 execute 权限），跳到栈上就会失败；(3) 系统级保护之二是随机化栈偏移，使攻击者难以预测注入代码的起始地址 B；(4) 编译器栈金丝雀让溢出先破坏金丝雀，函数返回前的检查会终止程序。选项 E 的「串联 gadget」不是防护，而是绕过 NX 的 ROP 攻击技术本身（讲义也指出它并不能绕过金丝雀）。","tags":["NX","ASLR","安全编程","栈保护"],"options":["把栈所在内存页标记为不可执行（NX，不可执行栈）","程序启动时随机化栈的起始地址（ASLR / 栈随机化）","用 fgets(buf, size, stdin) 或 strncpy 等带长度限制的函数替代 gets、strcpy","在缓冲区与返回地址之间放置栈金丝雀（-fstack-protector）","在攻击串中把若干以 ret 结尾的代码片段（gadget）串接起来使用"],"answer":[0,1,2,3],"kp":"内存安全与攻击"},{"id":"gen-c08-07","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"ASLR/NX 与 ROP","type":"judge","difficulty":3,"stem":"判断：栈随机化（ASLR）与不可执行栈（NX）能有效阻止代码注入式攻击，但两者都不能阻止 ROP 攻击，因为 ROP 使用的 gadget 位于可执行代码段中，其地址每次运行都固定。","code":null,"explanation":"讲义第 8 讲「Return-Oriented Programming Attacks」明确写道：栈随机化让人难以预测缓冲区（注入代码）的位置，标记栈不可执行让人无法在栈上放二进制代码；攻击者的替代策略是「use existing code」，把现有库里以 `ret` 结尾（单字节 0xc3）的指令片段串起来完成目标，这些 gadget 处于可执行代码段中，且「Code positions fixed from run to run」，因此 NX 对它无效、栈随机化也不影响它。同时讲义特意注明 ROP「Does not overcome stack canaries」——只要攻击仍需覆写返回地址并因此破坏金丝雀，保护检查就会触发。所以本题说法正确。","tags":["ROP","ASLR","NX"],"options":null,"answer":true,"kp":"内存安全与攻击"},{"id":"gen-c08-08","source":"自编 · 第 8 讲","origin":"created","lecture":8,"topic":"smash 攻击串的构造","type":"fill","difficulty":3,"stem":"仍以 echo 为例：`buf` 起始于 `%rsp`，返回地址位于 `%rsp+24`，攻击者想把返回地址整体改写成 smash 函数入口 0x00000000004006fb。若攻击串由 24 个字节的填充字符后紧跟 8 字节小端返回地址组成，这个攻击串一共多少字节（不计 `gets` 追加的结尾 '\\0'）？只填数字。","code":null,"explanation":"讲义第 8 讲的 smash 攻击串演示中，返回地址从第 24 个字节的偏移开始、占 8 字节，所以要完整覆盖它，攻击串必须写满 24 + 8 = 32 字节：前 24 字节的作用只是把写入位置推进到 %rsp+24（其中前 4 字节落在 buf 内，其余 20 字节是栈帧里的填充），第 25~32 字节是 0x00000000004006fb 的小端表示 fb 06 40 00 00 00 00 00——这正是讲义攻击串中 `30 31 … 32 33`（24 个 ASCII 数字）之后跟着的那 8 个字节。若只写 24 字节，则结尾的 '\\0' 只会破坏返回地址的最低字节，跳转目标变成 0x0000000000400600，程序段错误，起不到 smash 的效果。","tags":["栈溢出","攻击串","返回地址"],"options":null,"answer":["32"],"kp":"过程调用与栈"},{"id":"f2019-04","source":"2019 期末","origin":"exam","lecture":9,"topic":"RISC 与 CISC 的特征对比","type":"single","difficulty":2,"stem":"下述关于 RISC 和 CISC 的讨论，哪个是错误的？","code":null,"explanation":"A 对：RISC 追求精简指令集，指令条数通常远少于 CISC。B 对：RISC 寻址方式少（多为 load/store 加基址+偏移），CISC 支持多种复杂寻址。C 错（本题选它）：CISC 采用变长指令，其中相当多的指令（如简单的寄存器运算）比 RISC 的定长指令更短，因此“RISC 指令长度通常短于 CISC”不成立；反过来也不能说 CISC 的指令一定更长。D 对：手机普遍采用 ARM（RISC），PC 长期使用 x86（CISC），虽然近年两者的界限在模糊。踩坑点：RISC 的特点是定长、指令数少、寻址方式少、寄存器多，而“指令长度一定更长/更短”都不是绝对结论。","tags":["RISC","CISC","指令集"],"options":["RISC 指令集包含的指令数量通常比 CISC 的少","RISC 的寻址方式通常比 CISC 的寻址方式少","RISC 的指令长度通常短于 CISC 的指令长度","手机处理器通常采用 RISC，而 PC 采用 CISC"],"answer":2,"kp":"机器级编程基础"},{"id":"f2020-05","source":"2020 期末","origin":"exam","lecture":9,"topic":"CISC 与 RISC 的寄存器数量","type":"single","difficulty":1,"stem":"下面对指令系统的描述中，错误的是：","code":null,"explanation":"D 错误（本题选它）：说反了。RISC 为了减少访存、方便流水线调度，通常提供更多通用寄存器（如 ARM、MIPS 有 32 个左右），而 CISC（尤其 x86）通用寄存器相对较少（x86-64 也只有 16 个通用寄存器）。A 对：CISC 指令多、功能复杂，某些指令（如字符串操作、复杂寻址）要很多周期；RISC 指令少且整齐，执行周期短。B 对：CISC 是变长指令（x86 指令从 1 字节到十几字节），RISC 是定长指令。C 对：CISC 支持多种复杂寻址方式，RISC 多以 load/store + 基址变址为主，寻址方式少。踩坑点：寄存器多、定长、load/store 风格是 RISC 的典型特征。","tags":["RISC","CISC","寄存器","寻址方式"],"options":["通常 CISC 指令集中的指令数目较多，有些指令的执行周期很长；而 RISC 指令集中指令数目较少，指令的执行周期较短。","通常 CISC 指令集中的指令长度不固定；RISC 指令集中的指令长度固定。","通常 CISC 指令集支持多种寻址方式，RISC 指令集支持的寻址方式较少。","通常 CISC 指令集处理器的寄存器数目较多，RISC 指令集处理器的寄存器数目较少。"],"answer":3,"kp":"机器级编程基础"},{"id":"f2021-03","source":"2021 期末","origin":"exam","lecture":9,"topic":"RISC 与 CISC 的特征","type":"single","difficulty":2,"stem":"下列关于 RISC 和 CISC 的描述中，正确的是：","code":null,"explanation":"C 正确：早期 RISC（如 MIPS）不设置条件码寄存器，而是用明确的比较/测试指令把比较结果（0 或 1）写进一个普通通用寄存器，再用条件分支判断该寄存器，这样避免了对隐式条件码的依赖，便于流水线调度。A 错：RISC 指令集后来有复杂化的趋势，指令数并不“始终”少于 100 条（例如 ARM 的指令数量远超 100）。B 错：CISC 是变长指令，其中不少简单指令的长度比 RISC 的定长指令更短，“总是更长”不成立。D 错：恰恰相反，RISC 通常用链接寄存器（如 MIPS 的 $ra）保存返回地址，从而避免过程调用/返回时的内存引用；总是需要把返回地址压入内存是 CISC 的做法。踩坑点：RISC 的典型特征是定长、load/store、指令数少、寻址方式少、寄存器多、无隐式条件码。","tags":["RISC","CISC","条件码","过程调用"],"options":["在 RISC 指令集的发展过程中，其指令数量始终少于 100 条。","CISC 指令集中的指令比 RISC 指令集更复杂，因此其指令长度总是比 RISC 指令集中的指令要长。","早期的 RISC 指令集没有条件码，对条件检测来说，要用明确的测试指令，这些指令会将测试结果放在一个普通的寄存器中。","RISC 指令集中的所有过程都需要进行内存引用。"],"answer":2,"kp":"控制流与条件码"},{"id":"f2021-08","source":"2021 期末","origin":"exam","lecture":9,"topic":"芯片布局算法的优化目标","type":"single","difficulty":2,"stem":"布局是数字芯片设计自动化流程的必要步骤，下面哪一项不是布局算法需要优化的目标？","code":null,"explanation":"D（逻辑深度）不是布局算法要优化的目标：逻辑深度由电路的逻辑结构（门的级联层数）决定，改变器件在芯片上的摆放位置并不会改变这一点。A 对：布局位置直接决定连线长度，缩短互连线可以减少面积与延时，是最核心的优化目标。B 对：器件摆放得是否合理决定了后续布线能否成功、会不会出现拥塞，因此可布线性必须在布局阶段考虑。C 对：线长直接影响连线延时，进而影响时序能否满足，所以时序也是布局的优化目标。踩坑点：布局管“摆在哪里”，布线管“怎么连”，逻辑深度属于电路逻辑结构层面，与摆放无关。","tags":["布局算法","逻辑设计","时序"],"options":["互连线长（Wirelength）","可布线性（Routability）","时序（Timing）","逻辑深度（Logic depth）"],"answer":3,"kp":"ISA与逻辑设计"},{"id":"m2013-09","source":"2013 期中","origin":"exam","lecture":9,"topic":"RISC 与 CISC 的比较","type":"multi","difficulty":2,"stem":"下面对 RISC 和 CISC 的描述中，错误的是：","code":null,"explanation":"A 是正确描述：CISC 指令繁多且长度/周期差异大，RISC 指令少而规整。B 错：定长编码恰恰使 RISC 代码**更长**（短指令能表达的立即数范围小、需要更多条指令），而不是更短。C 是正确描述：CISC 支持更多寻址方式，RISC 通常只保留 base+disp 一类简单寻址。D 错在「必须」二字过于绝对：CISC 机器（如 x86-64）同样有较多寄存器并优先用寄存器传参，只有参数超过寄存器个数时才用栈。踩坑点：定长编码换来的是译码简单、便于流水，代价是代码密度下降。","tags":["RISC","CISC","指令编码"],"options":["CISC 指令系统中的指令数目较多，有些指令的执行周期很长；而 RISC 指令系统中通常指令数目较少，指令的执行周期都较短","CISC 指令系统中的指令编码长度不固定；RISC 指令系统中的指令编码长度固定，这样使得 RISC 机器可以获得更短的代码长度","CISC 指令系统支持多种寻址方式，RISC 指令系统支持的寻址方式较少","CISC 机器中的寄存器数目较少，函数参数必须通过栈进行传递；RISC 机器的寄存器数目较多，可以通过寄存器来传递参数，避免了不必要的存储访问"],"answer":[1,3],"kp":"机器级编程基础"},{"id":"m2014-10","source":"2014 期中","origin":"exam","lecture":9,"topic":"RISC 与 CISC 的比较","type":"single","difficulty":2,"stem":"关于 RISC 和 CISC 的描述，正确的是：","code":null,"explanation":"A 描述反了：CISC 指令长度不固定（1~15 字节），取指/译码要处理变长编码，电路更复杂；RISC 定长编码取指更简单。B 也描述反了：CISC 单条指令能完成更多工作、编码更紧凑，代码通常**更短**；RISC 代码往往更长。C 正确：CISC 提供丰富的寻址方式（base+index×scale+disp 等），一条指令即可完成「计算地址并访存」，RISC 通常只有有限的几种寻址方式，访存前常需额外的地址计算指令。D 太绝对：RISC 同样可能用栈传递超出寄存器个数的参数，x86-64 这类 CISC 也大量使用寄存器传参。","tags":["RISC","CISC","寻址方式"],"options":["CISC 指令系统的指令编码可以很短，例如最短的指令可能只有一个字节，因此 CISC 的取指部件设计会比 RISC 更为简单","CISC 指令系统中的指令数目较多，因此程序代码通常会比较长；而 RISC 指令系统中通常指令数目较少，因此程序代码通常会比较短","CISC 指令系统支持的寻址方式较多，RISC 指令系统支持的寻址方式较少，因此用 CISC 在程序中实现访存的功能更容易","CISC 机器中的寄存器数目较少，函数参数必须通过栈来进行传递；RISC 机器中的寄存器数目较多，只需要通过寄存器来传递参数"],"answer":2,"kp":"机器级编程基础"},{"id":"m2015-08","source":"2015 期中","origin":"exam","lecture":9,"topic":"CISC 与 RISC 的设计权衡","type":"single","difficulty":2,"stem":"下面有关指令系统设计的描述正确的是：","code":null,"explanation":"C 正确：CISC 指令长度不固定、格式复杂（如 x86 的 1~15 字节变长编码、多种寻址方式），译码电路必须逐字节分析前缀与操作码，因此比 RISC 的定长编码译码复杂得多。A 错：CISC 单条指令功能更强、编码更紧凑，代码通常**更短**（代价是译码复杂）。B 错：运行时间取决于实现（流水线、缓存、编译器），不能一概而论；CISC 的复杂指令常被拆成多个微操作执行。D 错：流水线吞吐同样取决于微架构设计，RISC 的规整定长指令反而更容易深流水。踩坑点：CISC 与 RISC 的取舍是「代码密度 vs 译码/流水友好度」。","tags":["CISC","RISC","译码"],"options":["采用 CISC 指令比 RISC 指令代码更长","采用 CISC 指令比 RISC 指令运行时间更短","采用 CISC 指令比 RISC 指令译码电路更加复杂","采用 CISC 指令比 RISC 指令的流水线吞吐更高"],"answer":2,"kp":"SEQ 顺序实现"},{"id":"m2015-09","source":"2015 期中","origin":"exam","lecture":9,"topic":"组合逻辑延迟与吞吐率","type":"single","difficulty":2,"stem":"一个功能模块包含组合逻辑和寄存器，组合逻辑单元的总延迟是 100ps，单个寄存器的延时是 20ps。该功能模块执行一次并保存执行结果，理论上能达到的最短延时和最大吞吐分别是多少？","code":null,"explanation":"一次完整执行必须经过组合逻辑并写入寄存器，所以最短延时（延迟）是 100ps + 20ps = 120ps，A、D 的 20ps 只算了寄存器，漏掉了组合逻辑。吞吐率方面：把这段组合逻辑在寄存器之间切成尽可能多的流水级，每级只需容纳一个寄存器的延时 20ps，因此时钟周期趋于 20ps，吞吐率上限 = 1/20ps = 50GIPS（这正是「寄存器延时决定吞吐上限」的结论），故最大吞吐为 50GIPS。选项 C 的 10GIPS 是把 100ps 当成时钟周期算出来的。踩坑点：延迟与吞吐是两个不同的指标——延迟无法低于「组合逻辑 + 一个寄存器」，而吞吐可以通过流水化逼近 1/寄存器延时。","tags":["延迟","吞吐率","流水化"],"options":["20ps, 50GIPS","120ps, 50GIPS","120ps, 10GIPS","20ps, 10GIPS"],"answer":1,"kp":"流水线 PIPE"},{"id":"m2016-08","source":"2016 期中","origin":"exam","lecture":9,"topic":"CISC 与 RISC 的特征对比","type":"single","difficulty":2,"stem":"下面对指令系统的描述中，**错误**的是：","code":null,"explanation":"A、B、C 都是教材对 CISC/RISC 的常规描述：CISC 指令多而复杂、部分指令执行周期长；CISC 采用变长编码因而程序代码更短、RISC 定长编码便于译码与流水；CISC 寻址方式丰富、RISC 通常只有基址加偏移等少数几种。D 的问题在于表述过于绝对：RISC 寄存器虽多，但参数个数超过可供传参的寄存器个数时仍要压栈，它同样需要栈；说 CISC「必须」用栈、RISC「只需要」用寄存器传参都不成立。故选 D。（该选项的原文在 2017 年试卷中又以另一道 RISC/CISC 选择题出现，官方答案同样判其为错。）","tags":["CISC","RISC","参数传递"],"options":["CISC 指令系统中的指令数目较多，有些指令的执行周期很长；而 RISC 指令系统中通常指令数目较少，指令的执行周期都较短。","CISC 指令系统中的指令编码长度不固定；RISC 指令系统中的指令编码长度固定，这使 CISC 机器可以获得更短的代码长度。","CISC 指令系统支持多种寻址方式，RISC 指令系统支持的寻址方式较少。","CISC 机器中的寄存器数目较少，函数参数必须通过栈来进行传递；RISC 机器中的寄存器数目较多，只需要通过寄存器来传递参数，避免了不必要的存储访问。"],"answer":3,"kp":"机器级编程基础"},{"id":"m2017-09","source":"2017 期中","origin":"exam","lecture":9,"topic":"RISC 与 CISC：寻址、运算与条件码","type":"single","difficulty":2,"stem":"下面关于 RISC 和 CISC 的描述中，正确的是：","code":null,"explanation":"B 正确：CISC 允许内存操作数直接参与算术逻辑运算（如 addl (%rdi),%eax），而典型 RISC 采用 load/store 结构，只有专门的取数/存数指令访问内存，算术逻辑运算只作用于寄存器。A 错：寻址方式丰富的是 CISC，早期 RISC 才只有基址加偏移等少数几种。C 错：早期 RISC 有意**取消条件码**，改用条件传送/条件置位（cmov、set）来消除对隐式状态标志的依赖。D 错：说法过于绝对，RISC 参数个数超过可用寄存器时同样要压栈传递。","tags":["RISC","CISC","寻址方式与条件码"],"options":["CISC 和早期 RISC 在寻址方式上相似，通常只有基址和偏移量寻址","CISC 指令集可以对内存和寄存器操作数进行算术和逻辑运算，而 RISC 只能对寄存器操作数进行算术和逻辑运算","CISC 和早期的 RISC 指令集都有条件码，用于条件分支检测","CISC 机器中的寄存器数目较少，函数参数必须通过栈来进行传递；RISC 机器中的寄存器数目较多，只需要通过寄存器来传递参数，避免了不必要的存储访问"],"answer":1,"kp":"机器级编程基础"},{"id":"m2018-07","source":"2018 期中","origin":"exam","lecture":9,"topic":"从编程与取指需求选择 ISA","type":"single","difficulty":2,"stem":"假设编译技术处于发展初期，程序员更愿意使用汇编语言编程来解决实际问题，那么程序员会更倾向于选用____ISA；假设你设计的处理器速度非常快，但存储系统取指令的速度非常慢（也许只是处理单元的十分之一），这时你会更倾向于选用____ISA。","code":null,"explanation":"第一空选 CISC：CISC 指令数目多、功能复杂，很多指令更接近高级语言的语句（如一条指令完成字符串复制），在编译器不成熟的年代能大幅减少汇编程序员的工作量，故程序员更愿意选 CISC。第二空也选 CISC：取指极慢意味着每条指令的取指开销很大，用「一条复杂指令做完很多事」可以摊薄取指次数，从而缓解处理单元与取指速度的不匹配（CISC 指令本身也常需要多个执行周期，正好与慢速取指相匹配）。虽然现代处理器通常靠多级存储层次来弥补这个速度差，但本题设问的正是 ISA 层面的取舍，故答案为 B（CISC、CISC）。","tags":["CISC","RISC","指令集选择"],"options":["RISC、RISC","CISC、CISC","RISC、CISC","CISC、RISC"],"answer":1,"kp":"ISA与逻辑设计"},{"id":"m2019-10","source":"2019 期中","origin":"exam","lecture":9,"topic":"由指令集特征判断 RISC/CISC","type":"single","difficulty":2,"stem":"下面有三组对于指令集的描述，它们分别符合 ①____、②____、③____ 的特点。\n① 某指令集中，只有两条指令能够访问内存。\n② 某指令集中，指令的长度都是 4 字节。\n③ 某指令集中，可以只利用一条指令完成字符串的复制，也可以只利用一条指令查找字符串中第一次出现字母 K 的位置。","code":null,"explanation":"① 只有取数/存数两条指令能访问内存，是典型 **RISC** 的 load/store 结构（算术逻辑运算只作用于寄存器）。② 指令定长（都是 4 字节）也是 **RISC** 的典型特征，便于简化译码和流水线取指；CISC 指令长度可变（x86 从 1 字节到 15 字节）。③ 用一条指令完成字符串复制（如 x86 的 movs）或用一条指令扫描字符串找字符（如 scas 系列），属于功能复杂、面向高级语言便利设计的 **CISC** 指令。故答案为 RISC、RISC、CISC，选 B。踩坑点：RISC 的关键词是「load/store、定长、寻址方式少」，CISC 是「指令复杂、变长、寻址方式多」。","tags":["RISC","CISC","指令集特征"],"options":["CISC, CISC, CISC","RISC, RISC, CISC","RISC, CISC, RISC","CISC, RISC, RISC"],"answer":1,"kp":"ISA与逻辑设计"},{"id":"m2022-10","source":"2022 期中","origin":"exam","lecture":9,"topic":"从 ISA 特征判断 RISC/CISC","type":"single","difficulty":2,"stem":"下列 4 组对于 ISA 的描述，它们分别符合 (a)_____, (b)______, (c)______, (d)______ 的特点。(a) 某 ISA 中所有指令均不采用条件码；(b) 某 ISA 中只有基址和偏移量寻址；(c) 某 ISA 中执行一些指令需要经过复杂的译码电路；(d) 某 ISA 中指令长度最短 1 字节，最长 15 字节以上。","code":null,"explanation":"(a) 所有指令都不使用条件码，程序状态由指令显式管理，符合 RISC 的精简风格；(b) 只有“基址 + 偏移量”一种寻址方式，寻址模式单一，也是 RISC 的典型特征；(c) 部分指令需要复杂的译码电路，说明指令格式复杂、长度不一，属于 CISC；(d) 指令长度从 1 字节到 15 字节以上可变，只能是 CISC（x86 正是如此，RISC 追求等长编码）。因此顺序是 RISC、RISC、CISC、CISC，选 B。踩坑点：指令长度可变是判断 CISC 最可靠的标志，不要与“指令条数多”混淆。","tags":["RISC","CISC","ISA"],"options":["RISC, CISC, CISC, RISC","RISC, RISC, CISC, CISC","CISC, RISC, RISC, CISC","CISC, CISC, RISC, RISC"],"answer":1,"kp":"ISA与逻辑设计"},{"id":"m2023-11","source":"2023 期中","origin":"exam","lecture":9,"topic":"用 MUX4 实现 HCL 逻辑表达式","type":"single","difficulty":3,"stem":"采用四选一（MUX4）实现 HCL 表达式 out = (A || C) && (B || C)，连接正确的是：","code":"Word out = [ !s1 && !s0 : I0;\n             !s1        : I1;\n             !s0        : I2;\n             1          : I3\n           ];","explanation":"先按 s1 = A、s0 = B 展开真值表：A=0,B=0 时 out = (0||C) && (0||C) = C；A=0,B=1 时 out = C && 1 = C；A=1,B=0 时 out = 1 && C = C；A=1,B=1 时 out = 1 && 1 = 1。再对照 HCL 的分支（第一条为真者生效）：!s1&&!s0 选 I0，!s1 选 I1，!s0 选 I2，其余选 I3，因此必须 I0 = I1 = I2 = C、I3 = 1，即选项 C。A 把选择信号错当成 A、C；B 的 I1、I2 取值不对；D 把 I3 取 0，导致 A=B=1 时输出 0 而不是 1。踩坑点：HCL 的多个条件是按优先级依次判断的，四种输入组合必须与 I0~I3 一一对应。","tags":["HCL","MUX","组合逻辑"],"options":["S1=A, S0=C, I0=0, I1=1, I2=B, I3=0","S1=B, S0=C, I0=0, I1=0, I2=A, I3=1","S1=A, S0=B, I0=C, I1=C, I2=C, I3=1","S1=A, S0=B, I0=C, I1=C, I2=C, I3=0"],"answer":2,"kp":"ISA与逻辑设计"},{"id":"m2024-10","source":"2024 期中","origin":"exam","lecture":9,"topic":"RISC 与 CISC 的特征对比","type":"single","difficulty":1,"stem":"下列关于 RISC 和 CISC 的表述中，错误的是：","code":null,"explanation":"B 把两种风格说反了，为本题答案：RISC 追求等长、规整的指令编码（便于并行译码和流水线），而 CISC（如 x86）指令长度可变，短的 1 字节、长的可达 15 字节以上。A 正确：RISC 尽量让每条指令的执行延迟可控、接近单周期，CISC 中有像字符串操作、复杂寻址这样延迟很长的指令。C 正确：RISC 的寻址方式少而简单，CISC 提供大量复杂的寻址方式。D 正确：现代 x86 处理器在译码阶段把复杂指令拆成类 RISC 的微操作，同时吸收了两种设计思想。","tags":["RISC","CISC","ISA"],"options":["RISC 一般没有延迟较长的指令；CISC 有些指令延迟很长","RISC 指令编码长度可变；CISC 指令编码长度固定","RISC 寻址方式简单；CISC 寻址方式多样","现代指令系统及处理器的设计实现结合了二者思想"],"answer":1,"kp":"机器级编程基础"},{"id":"s2025b-01","source":"2025 第 2 次阶段测验","origin":"exam","lecture":9,"topic":"ISA 规定的内容与调用约定的区别","type":"multi","difficulty":3,"stem":"以下描述，哪些属于 ISA（指令集体系结构）规定的内容？（不定项选择，全部选对才得分）","code":null,"explanation":"ISA 描述的是「机器指令做什么、程序员可见的状态有哪些」，包括寄存器数量与宽度、条件码、指令的语义（call 压返回地址属于指令语义）、内存编址方式与字节序、可用的寻址模式。而「前两个参数放 rdi、rsi，返回值放 rax」是**调用约定（ABI）**层面的约定，不是硬件指令集的规定：Y86-64 用 rdi/rsi 传参、某些平台用栈传参，硬件都不关心。因此第 4 项不属于 ISA。这类题的判断诀窍是问自己：换一套编译器/操作系统还能不能变？能变的就是 ABI，不能变的才是 ISA。","tags":["ISA","ABI","调用约定"],"options":["有 15 个通用寄存器，每个寄存器 64 位","有 3 个条件码，分别是 ZF、SF、OF","过程调用指令（call）会将下一条指令的地址压入栈中","过程调用的前 2 个参数放在寄存器 rdi、rsi，返回值放在寄存器 rax","内存是字节寻址的，字节序采用小端法","访存指令支持寄存器加偏移的寻址模式"],"answer":[0,1,2,4,5],"kp":"ISA与逻辑设计"},{"id":"s2025b-02","source":"2025 第 2 次阶段测验","origin":"exam","lecture":9,"topic":"Y86-64 访存指令的操作数顺序","type":"single","difficulty":3,"stem":"Y86-64 中有这两条指令：`rmmovq rA,D(rB)` 与 `mrmovq D(rB),rA`。第 2 条指令为什么不设计成 `mrmovq D(rA),rB`，让所有访存指令都是 rA 在前、rB 在后，看起来更规整？","code":null,"explanation":"Y86-64 的访存指令统一约定：rA 是数据寄存器，rB 是基址（地址）寄存器，硬件中有专门的地址计算通路只从 rB 读取寄存器值。如果 mrmovq 写成 D(rA),rB，那么地址寄存器就不再固定，硬件需要为「地址可能来自 rA 或 rB」增加额外的多路选择与通路，电路变复杂、关键路径变长。因此设计 ISA 时宁可在书写形式上「不规整」，也要保持地址寄存器单一来源。这也说明 ISA 的设计是硬件复杂度与编程便利之间的折衷，而非纯粹的美观问题。","tags":["Y86-64","指令编码","硬件简化"],"options":["因为硬件电路中地址都通过 rB 的通路计算，让两条指令的地址寄存器都固定为 rB 可以让电路更简单","为了让 rA 与 rB 的编码顺序保持一致，便于指令译码","因为 rA 不能作为地址寄存器，否则会造成寄存器端口冲突","这样可以缩短指令编码的长度"],"answer":0,"kp":"ISA与逻辑设计"},{"id":"s2025b-03","source":"2025 第 2 次阶段测验","origin":"exam","lecture":9,"topic":"HCL 布尔表达式与逻辑门","type":"single","difficulty":2,"stem":"根据 HCL 表达式 `bool eq = (a && b) || (!a && !b);` 补全电路图，它对应的是哪种门？","code":null,"explanation":"把表达式的两种「输出 1」的情形列出来：(a=1,b=1) 或 (a=0,b=0)，也就是两个输入取值相同——这正是同或（XNOR）的定义，它的输出恰好是异或的反。在 HCL 里，`&&` 表示逻辑与、`||` 表示逻辑或、`!` 表示逻辑非，是描述组合电路的常用写法；实际的同或门可以由两个 AND、两个 NOT 和一个 OR 组合而成。HCL 表达式与门级电路一一对应，这是第 9 讲「从 HCL 到电路」的基本练习。","tags":["HCL","组合逻辑","同或门"],"options":["同或门（XNOR）：两个输入相同时输出 1，不同时输出 0","异或门（XOR）：两个输入不同时输出 1，相同时输出 0","与门（AND）：两个输入都为 1 时输出 1","或门（OR）：只要有一个输入为 1 就输出 1"],"answer":0,"kp":"ISA与逻辑设计"},{"id":"s2025b-04","source":"2025 第 2 次阶段测验","origin":"exam","lecture":9,"topic":"HCL 实现多路复用器","type":"single","difficulty":2,"stem":"HCL 表达式 `bool out = (s && a) || (!s && b);` 所描述的电路是：","code":null,"explanation":"表达式的含义是「s 为真则取 a，否则取 b」，这就是一个由 s 控制的两路选择器（MUX）。它是处理器数据通路里出现频率最高的组合逻辑：ALU 的输入选择、写回数据的选择、下一条 PC 的选择等都用它。注意这里的 `&&` 在 HCL 中是逻辑运算，但用于多位数据选择时通常采用按位形式（HCL 中的 case/或项写法），本质仍是用选择信号把多路输入「与」出来再「或」到一起。","tags":["HCL","多路复用器","数据通路"],"options":["一个 2 选 1 多路复用器：s 为选择信号，s = 1 时输出 a，s = 0 时输出 b","一个异或门，输出 a 与 b 的异或","一个与门，输出 a 与 b 的逻辑与","一个 1 位译码器"],"answer":0,"kp":"ISA与逻辑设计"},{"id":"gen-c09-01","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"Y86-64 指令格式与编码","type":"single","difficulty":1,"stem":"Y86-64 中 `mrmovq -12(%rbp), %rcx` 的机器码是 `50 15 f4 ff ff ff ff ff ff ff`。关于这条编码，正确的说法是：","code":null,"explanation":"讲义第 9 讲的格式表规定 `mrmovq D(rB), rA` 的格式是 `50 rA rB D`。第一字节 0x50 拆开是 icode=5、ifun=0；第二字节高 4 位是 rA（目的寄存器 %rcx，编号 1）、低 4 位是 rB（基址寄存器 %rbp，编号 5），合成 0x15；D 是 8 字节常量，-12 的补码为 0xfffffffffffffff4，小端存放即低字节在前 f4 ff ff ff ff ff ff ff。总长 1+1+8 = 10 字节。选项 B 把两个寄存器域的位置写反了，`51` 会变成把 D(%rcx) 读进 %rbp；选项 A 错在带寄存器操作数的指令必须有寄存器字节（讲义 Need regids 判断里 mrmovq 就在其中）；选项 C 错在 Y86-64 的常量字段固定 8 字节，不靠符号扩展节省空间。","tags":["Y86-64","指令编码","mrmovq"],"options":["指令共 9 字节，因为 icode 与 ifun 合并在第一个字节里，寄存器字节被省略了","指令共 10 字节，但寄存器字节应写成 51，因为 Y86-64 把源寄存器写在目的寄存器前面","位移字段只有 4 字节，高 4 字节由符号扩展自动补齐，所以不占指令长度","指令共 10 字节：第一个字节 50 是 icode:ifun，寄存器字节 15 表示 rA=%rcx、rB=%rbp，位移 -12 以补码小端存放为 f4 ff ff ff ff ff ff ff"],"answer":3,"kp":"机器级编程基础"},{"id":"gen-c09-02","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"Y86-64 处理器状态","type":"single","difficulty":1,"stem":"关于 Y86-64 的处理器状态，下列说法正确的是：","code":null,"explanation":"讲义第 9 讲「Y86-64 Processor State」：程序寄存器共 15 个（省略 %r15），每个 64 位；寄存器编号沿用 x86-64 的 4 位编码，其中 15(0xF) 表示「no register」，硬件设计中到处利用这一约定（例如不允许写回时把目的寄存器设为 0xF）。条件码只有 ZF（零）、SF（符号）、OF（溢出）三个，没有 x86 的 CF。内存是按字节寻址的存储阵列，「Words stored in little-endian byte order」，与 x86-64 一致。因此只有 C 正确：A 多算了一个寄存器，B 多算了一个状态位，D 说反了字节序。","tags":["Y86-64","寄存器","条件码"],"options":["共有 16 个 64 位通用寄存器，包括 %r15","条件码寄存器有 4 位：ZF、SF、OF、CF","共有 15 个 64 位通用寄存器（省略 %r15），寄存器编号 15(0xF) 专门表示「无寄存器」","内存中的字按大端序存放，这一点与 x86-64 不同"],"answer":2,"kp":"机器级编程基础"},{"id":"gen-c09-03","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"Y86-64 指令长度","type":"single","difficulty":1,"stem":"下列四组 Y86-64 指令的编码长度（字节）完全正确的一组是：","code":null,"explanation":"Y86-64 的指令长度由第一字节的 icode 唯一决定，讲义第 9 讲的格式表给出的规律是：无操作数的指令（nop、halt、ret）只有 1 字节；带一个寄存器字节的指令（rrmovq/cmovXX/OPq/pushq/popq）为 2 字节；带 8 字节常量的指令中，irmovq（格式 `30 FrB V`）和 rmmovq/mrmovq（1+1+8）共 10 字节，而 jXX（`7fn Dest`）和 call（`80 Dest`）不需要寄存器字节，共 1+8 = 9 字节。于是 `ret`=1、`pushq %rax`=2（A0 0F）、`je Dest`=9、`irmovq V,%rbx`=10，只有 C 组全部正确。这也是「可以从第一个字节直接判定整条指令长度」的体现，SEQ 的取指级正是靠这一点一次读入最多 10 个字节。","tags":["Y86-64","指令长度","编码"],"options":["ret = 1，pushq %rax = 2，je Dest = 2，irmovq V, %rbx = 10","ret = 2，pushq %rax = 9，je Dest = 9，irmovq V, %rbx = 9","ret = 1，pushq %rax = 2，je Dest = 9，irmovq V, %rbx = 10","ret = 1，pushq %rax = 10，je Dest = 9，irmovq V, %rbx = 9"],"answer":2,"kp":"ISA与逻辑设计"},{"id":"gen-c09-04","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"HCL 多路选择器 case 表达式","type":"single","difficulty":2,"stem":"下面是用 HCL 描述的四路多路选择器。当控制信号 s1 = 1、s0 = 0 时，输出 Out4 是：","code":"int Out4 = [\n    !s1 && !s0 : D0;\n    !s1        : D1;\n    !s0        : D2;\n    1          : D3;\n];","explanation":"HCL 的 case 表达式按书写顺序逐个求值测试条件，第一个成立的测试所对应的值就是输出，后面的分支即使也成立也不再考虑；最后一行 `1 :` 保证总会有分支命中（讲义称之为「final case guarantees match」）。当 s1=1、s0=0 时：`!s1 && !s0` 为 0 不成立；`!s1` 为 0 不成立；`!s0` 为 1 成立，于是输出 D2。讲义第 9 讲「4-Way Multiplexor」正是用这种「顺序匹配、逐步化简测试」的写法，避免把 s1s0 的四种组合全部写出来；它成立的隐含前提就是 case 的先后顺序语义。","tags":["HCL","多路选择器","case 表达式"],"options":["D0","D1","D2","D3"],"answer":2,"kp":"ISA与逻辑设计"},{"id":"gen-c09-05","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"寄存器与寄存器文件的时序","type":"single","difficulty":2,"stem":"关于 HCL 所描述的硬件时序行为，下列说法正确的是：","code":null,"explanation":"讲义第 9 讲「Registers / Register Operation / Register File Timing / Edge-Triggered Latch」：寄存器由边沿触发锁存器构成，只在时钟上升沿装载输入，其余时间把输入和输出隔开（状态保持为 x，直到时钟上升才变成 y）。组合逻辑（包括 ALU）恰好相反，它对输入变化连续作出响应，经过一段传播延迟后输出就是输入的布尔函数，因此 A、D 都说反了：ALU 不需要时钟驱动，条件码是它的组合输出。寄存器文件的读端口像组合逻辑（地址变化后经延迟输出对应字），写端口像寄存器（只在时钟上升沿生效），所以 C 混淆了读写的时序特性。","tags":["寄存器","时序","寄存器文件"],"options":["组合逻辑电路的输出只在时钟上升沿更新，其余时间保持不变","寄存器在时钟上升沿装入输入值，其余时间充当输入与输出之间的屏障","寄存器文件的写端口只要地址或数据发生变化，输出就立即改变","ALU 需要计算条件码，因此必须由时钟信号驱动才能逐周期更新结果"],"answer":1,"kp":"机器级编程基础"},{"id":"gen-c09-06","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"CISC 与 RISC 对比","type":"multi","difficulty":2,"stem":"关于 CISC 与 RISC 指令集的对比，下列说法正确的有（多选）：","code":null,"explanation":"讲义第 9 讲「CISC Instruction Sets / RISC Instruction Sets」：CISC 是栈式、面向内存的指令集，用栈传参数、有显式 push/pop，算术指令可以直接读写内存（例如 `addq %rax, 12(%rbx,%rcx,8)` 一次就要做内存读、写和复杂地址计算），并靠算术逻辑指令的副作用设置条件码；RISC 是面向寄存器的指令集，寄存器更多（典型 32 个）并用它们传参数和存放临时值，只有 load/store 能访问内存（类似 Y86-64 的 mrmovq/rmmovq），而且不设条件码，测试指令把 0/1 写进寄存器。选项 D 说反了（RISC 寄存器更多）；选项 E 错在 x86-64 只是吸收了 RISC 的许多特性（更多寄存器、用寄存器传参），指令集本身仍是 CISC 风格、并保持代码兼容。","tags":["CISC","RISC","ISA"],"options":["CISC（如 IA32）常用显式的 push/pop 传参数、保存程序计数器，算术指令可以直接访问内存","RISC 采用 load/store 结构，只有载入和存储指令能够访问内存","RISC 通常不设条件码，测试指令把结果 0/1 放进寄存器","RISC 的通用寄存器个数通常远少于 CISC，以便简化译码器","现代 x86-64 已经彻底放弃 CISC 编码，改为纯 RISC 指令集"],"answer":[0,1,2],"kp":"机器级编程基础"},{"id":"gen-c09-07","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"Y86-64 跳转指令的寻址方式","type":"judge","difficulty":2,"stem":"判断：Y86-64 的 `jXX Dest` 与 x86-64 的条件跳转一样，使用 PC 相对寻址在指令中编码跳转目标地址。","code":null,"explanation":"讲义第 9 讲「Jump Instructions」明确写着 Y86-64 的跳转「Encode full destination address — Unlike PC-relative addressing seen in x86-64」：`jXX Dest` 的格式是 `7fn` 后跟 8 字节的绝对地址，共 9 字节。x86-64 则把目标编码成相对下一条指令的 32 位偏移，指令更短、便于位置无关代码，但取指之后还要做一次加法才能得到目标地址。Y86-64 选择绝对地址是为了简化硬件实现（SEQ/PIPE 里 valC 直接就是目标地址，PC 更新阶段一个多路选择器就够了）。因此本题说法错误。","tags":["跳转","寻址方式","Y86-64"],"options":null,"answer":false,"kp":"机器级编程基础"},{"id":"gen-c09-08","source":"自编 · 第 9 讲","origin":"created","lecture":9,"topic":"指令编码计算","type":"fill","difficulty":3,"stem":"Y86-64 指令 `rmmovq %rsi, 0x41c(%rsp)` 共 10 字节。请写出它的完整机器码（十六进制字节，按顺序用空格分隔）。","code":null,"explanation":"`rmmovq rA, D(rB)` 的格式是 `40 rA rB D`（讲义第 9 讲「Move Operations」）。第一字节 0x40 是 icode:ifun，表示「寄存器→内存」的 4:0。第二字节高 4 位是 rA = %rsi = 6，低 4 位是 rB = %rsp = 4，合成 0x64。位移 D = 0x41c 是 8 字节常量，小端存放即低字节在前：1c 04 00 00 00 00 00 00。合起来就是 40 64 1c 04 00 00 00 00 00 00，共 10 字节，与讲义「Move Instruction Examples」中给出的编码一致。踩坑点：寄存器编号必须按固定表（%rax=0、%rcx=1、%rdx=2、%rbx=3、%rsp=4、%rbp=5、%rsi=6、%rdi=7），并且 rA 在前、rB 在后——若把 %rsi 与 %rsp 的编号写反成 0x46，语义就变成 `rmmovq %rsp, 0x41c(%rsi)`。","tags":["指令编码","rmmovq","小端"],"options":null,"answer":["40 64 1c 04 00 00 00 00 00 00","40641c040000000000","0x40 0x64 0x1c 0x04 0x00 0x00 0x00 0x00 0x00 0x00","40 64 1C 04 00 00 00 00 00 00"],"kp":"机器级编程基础"},{"id":"f2019-23","source":"2019 期末","origin":"exam","lecture":10,"topic":"类 SEQ 处理器执行指令的周期数","type":"fill","difficulty":2,"stem":"现有如下汇编代码段（相关寄存器初始值：%rdi=0x8008，%rax=0，%rbx=0，%rcx=0）。若用类似课程中 SEQ 的处理器来运行它，理想情况下每个周期处理完一条汇编指令，则执行完上述代码段（即结束循环）一共需要多少周期？","code":".L2:\n  movq  (%rdi), %rbx\n  addq  %rbx, %rax\n  addq  $8, %rdi\n  addq  $1, %rcx\n  cmpq  $8, %rcx\n  jl    .L2\n\n寄存器初值：%rdi = 0x8008，%rax = 0，%rbx = 0，%rcx = 0","explanation":"先看循环次数：循环末尾用 cmpq $8,%rcx; jl .L2 判断，%rcx 从 0 开始每轮加 1，因此当 %rcx 从 0 增加到 8 时退出，共执行 8 次循环体（这一点也可以从填空 “for(i = 0; i < 8; i++)” 看出）。循环体共有 6 条指令：movq、addq、addq、addq、cmpq、jl。理想的 SEQ 处理器每周期执行一条指令，因此总周期数 = 8 × 6 = 48 周期。踩坑点：注意是 8 次迭代而不是 7 次（%rcx 从 0 到 8 共 8 轮），并且 jl 也算一条指令；这里假设每条指令都恰好占一个周期、没有数据冒险等待。","tags":["SEQ","周期数计算","循环展开前"],"options":null,"answer":["48","48 周期"],"kp":"控制流与条件码"},{"id":"f2020-06","source":"2020 期末","origin":"exam","lecture":10,"topic":"SEQ 中 rmmovl 的执行与 PC 更新","type":"single","difficulty":2,"stem":"Y86 指令 rmmovl 的 SEQ 实现如下图所示，其中 ① 和 ② 分别为：","code":"rmmovl rA, D(rB)  的 SEQ 执行阶段（教材图）：\n  取指：icode:ifun ← M1[PC]，rA:rB ← M1[PC+1]，valC ← M4[PC+2]，valP ← PC + ①\n  译码：valA ← R[rA]，valB ← R[rB]\n  执行：valE ← ②\n  访存：M8[valE] ← valA\n  写回：—\n  更新PC：PC ← valP","explanation":"在 SEQ 的取指阶段，指令被拆成 icode:ifun（1 字节）、rA:rB（1 字节）和 4 字节的常数字段 valC，因此整条 rmmovl 指令长 1+1+4 = 6 字节，valP 应为 PC + 6（①）。执行阶段要计算内存有效地址，rmmovl 的地址形式是 D(rB)，即基址寄存器内容加上立即数偏移，所以 valE = valB + valC（②）。故选 D。A、B 错在把指令长度算成 4 字节（漏掉了 2 字节的寄存器/功能码字段）；C 错在把有效地址算成 valB + 4（把常数字段 valC 误当成固定常量 4）。踩坑点：有效地址公式要区分“立即数偏移”和“寄存器”两个来源，valC 通常由指令中的常数字段提供。","tags":["SEQ","rmmovl","有效地址","PC更新"],"options":["PC + 4，valB + 4","PC + 4，valB + valC","PC + 6，valB + 4","PC + 6，valB + valC"],"answer":3,"kp":"机器级编程基础"},{"id":"f2024-21","source":"2024 期末","origin":"exam","lecture":10,"topic":"向 Y86-64 SEQ 加入新指令：取指阶段的字节拆分","type":"fill","difficulty":2,"stem":"现在向 Y86-64 ISA 中加入一条新指令 `cdeclXX`（条件减一）：如果条件码满足条件（条件含义同 cmovXX 系列指令，XX 为条件码后缀），则将寄存器 rB 的数据减 1。其编码为 `C | Fn | 0xF | rB`（依次为 4 位 icode、4 位条件码 fn、4 位常数 0xF、4 位寄存器号），指令长度为 2 字节。在教材的 SEQ 处理器实现中，取指阶段要取出 icode:ifun 和 rA:rB。请补全下面的取指操作：","code":"Stage   cdecl rB\nFetch   icode:ifun ← M1[PC]\n        rA:rB ← ①________________","explanation":"SEQ 的取指阶段按字节从指令存储器（用 M1 表示按 1 字节读）中读取：指令的第 1 个字节位于地址 PC，其中高 4 位是 icode、低 4 位是 ifun，所以写成 `icode:ifun ← M1[PC]`；第 2 个字节位于 PC+1，其中高 4 位是 rA、低 4 位是 rB，本题把 rA 固定编码为 0xF（表示不使用源寄存器），因此填 `M1[PC+1]`。常见错误：写成 `M[PC+1]`（Y86 取指用 M1 按字节读）、写成 `M1[PC+2]`（忘了指令只有 2 字节），或误以为 rA:rB 与 icode:ifun 同在第一个字节。另外要记住该指令长 2 字节，后续还要有 `valP ← PC + 2`（取指阶段），译码阶段是 `valB ← R[rB]`，执行阶段是 `valE ← (-1) + valB`、`Cnd ← Cond(CC, ifun)`，写回阶段是 `if (Cnd) R[rB] ← valE`。","tags":["Y86-64","SEQ取指","指令编码","新指令扩展"],"options":null,"answer":["M1[PC+1]","M1[PC + 1]"],"kp":"SEQ 顺序实现"},{"id":"f2024-22","source":"2024 期末","origin":"exam","lecture":10,"topic":"条件指令的写回阶段：if (Cnd) 才修改寄存器","type":"fill","difficulty":2,"stem":"在教材的 SEQ 处理器中实现上述 `cdeclXX`（条件减一：条件码满足条件时把 rB 减 1）指令。已知编码为 `C | Fn | 0xF | rB`（各 4 位，共 2 字节），执行阶段的操作为 `valE ← (-1) + valB`、`Cnd ← Cond(CC, ifun)`，Memory 阶段为 none。请补全下表中写回阶段缺失的那条操作（一空只写一条操作或其一部分）：","code":"Stage       cdecl rB\nFetch       icode:ifun ← M1[PC]\n            rA:rB ← M1[PC+1]\n            valP ← PC + 2\nDecode      valB ← R[rB]\nExecute     valE ← (-1) + valB\n            Cnd ← Cond(CC, ifun)\nMemory      none\nWrite back  ④______________________________\nPC Update   PC ← valP","explanation":"写回阶段要把执行阶段算出的 valE（即 valB−1）写回目的寄存器 rB，但 cdeclXX 是条件指令：只有当条件 Cnd 为真时才允许修改寄存器，条件为假时什么都不做（这与 cmovXX 相同，而与 rrmovq/irmovq 的无条件写回不同），所以填 `if (Cnd) R[rB] ← valE`，等价的 HCL 写法 `R[rB] ← Cnd ? valE : R[rB]` 也对。常见错误：写成无条件的 `R[rB] ← valE`，条件不成立时寄存器也被减 1，语义就错了；写成 `if (Cnd) R[rA] ← valE` 则写错了目的寄存器（本题 rA 固定为 0xF，是无效寄存器号）；另外执行阶段还要按 valE 重新设置条件码（题目要求“根据计算结果正常设置条件码”），否则后续条件指令会读到过时的条件码。","tags":["SEQ","条件写回","HCL","条件码"],"options":null,"answer":["if (Cnd) R[rB] ← valE","if(Cnd) R[rB] <- valE","R[rB] ← Cnd ? valE : R[rB]"],"kp":"SEQ 顺序实现"},{"id":"lab2025-26","source":"2025 Lab 测验","origin":"exam","lecture":10,"topic":"ArchLab 为 SEQ 添加 iopq 指令","type":"single","difficulty":3,"stem":"在 ArchLab Part B 中，需要在 SEQ 架构上实现 iopq 指令：`iopq V, rB` 计算 rB op V 并把结果存回寄存器 rB。下面是 SEQ 架构中的部分 HCL 定义，其中哪些位置需要添加 IOPQ？","code":"u8 srcA = [\n    icode in { CMOVX, RMMOVQ, OPQ, PUSHQ } : ialign.rA;   // (1)\n    icode in { POPQ, RET } : RSP;\n    true : RNONE;\n];\nu8 dstE = [\n    icode in { CMOVX } && cnd : ialign.rB;\n    icode in { IRMOVQ, OPQ } : ialign.rB;                  // (2)\n    icode in { PUSHQ, POPQ, CALL, RET } : RSP;\n    true : RNONE;\n];\nu64 aluA = [\n    icode in { CMOVX, OPQ } : reg_read.valA;               // (3)\n    icode in { IRMOVQ, RMMOVQ, MRMOVQ } : ialign.valC;     // (4)\n    icode in { CALL, PUSHQ } : NEG_8;\n    icode in { RET, POPQ } : 8;\n];\nu8 alufun = [\n    icode == OPQ : ifun;                                   // (5)\n    true : ADD;\n];","explanation":"iopq V, rB 的语义是「rB 与立即数 V 做运算，结果写回 rB」，据此逐项判断：(2) dstE 必须加入 IOPQ，因为结果要写回 rB；(4) aluA 必须加入 IOPQ，因为 ALU 的 A 口要取指令中的立即数 V（ialign.valC）而不是源寄存器；(5) alufun 必须加入 IOPQ，因为运算类型由 ifun 决定，不能固定为 ADD。(1) srcA 不需要 IOPQ——它并不从寄存器 rA 读操作数（只读 rB）；(3) aluA 里也不需要「取 valA」这一项，因为 A 口取的是立即数。因此需要添加的是 (2)(4)(5)，答案为 D。做这类题的通用方法：先写出新指令的数据流（源操作数从哪来、ALU 做什么、结果写到哪），再逐张 HCL 表核对。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["ArchLab","SEQ","HCL","指令实现"],"options":["(1)(2)(3)","(1)(3)(5)","(2)(3)(5)","(2)(4)(5)"],"answer":3,"kp":"SEQ 顺序实现"},{"id":"m2015-11","source":"2015 期中","origin":"exam","lecture":10,"topic":"SEQ 中 PC 更新逻辑的数据来源","type":"fill","difficulty":3,"stem":"在 Y86 的 SEQ 实现中，PC 更新逻辑需要从若干数据来源中选择新的 PC 值。请按 HCL 中 PC 更新表达式的分支顺序——① call 指令、② 条件跳转指令（条件成立）、③ ret 指令、④ 其他情况——依次写出所需的数据来源（valC / valM / valP，用逗号分隔）。","code":"int new_pc = [\n    icode == ICALL : ①;\n    icode == IJXX && Cnd : ②;\n    icode == IRET : ③;\n    1 : ④;\n];","explanation":"Y86 的 PC 更新逻辑为：call 指令把 4 字节目的地址取到 valC（在取指阶段从指令中读出），所以新 PC = valC；条件跳转 jXX 在 Cnd 成立时同样跳转到指令中的常数值 valC；ret 指令从栈中弹出返回地址，该值在访存阶段由 M[valA] 读入 valM，故新 PC = valM；其余所有指令（含算术、传送、push 等）都顺序执行，新 PC = valP（取指阶段算出的 PC + 指令长度）。因此四个来源依次是 valC、valC、valM、valP。踩坑点：只有 ret 的数据来自内存（valM），call/jXX 的目标地址都直接来自指令里的常数 valC。","tags":["SEQ","PC 更新","HCL"],"options":null,"answer":["valC, valC, valM, valP","valC,valC,valM,valP","valC valC valM valP"],"kp":"SEQ 顺序实现"},{"id":"m2017-10","source":"2017 期中","origin":"exam","lecture":10,"topic":"SEQ 中 mem_addr 的 HCL 描述","type":"single","difficulty":3,"stem":"在 Y86 的 SEQ 实现中，只考虑 IRMMOVQ、ICALL、IPOPQ、IRET 这四条指令，对 `mem_addr` 的 HCL 描述正确的是（每组中先列使用 valE 的两条指令，后列使用 valA 的两条指令）：","code":"word mem_addr = [\n    icode in { (1), (2) } : valE;\n    icode in { (3), (4) } : valA;\n];","explanation":"mem_addr 是访存阶段要访问的内存地址：写内存或访问栈顶时用「基址 + 偏移」算出的 valE，读取指针指向的数据时用寄存器中现成的 valA。IRMMOVQ 的地址是 valE = valB + valC；ICALL 要把返回地址压栈，压栈位置是 valE = valB + (-8)（栈指针下移之后的位置），所以前两条用 valE。IPOPQ 读出的数据在栈顶，地址就是弹出的旧栈指针值 valA；IRET 要从栈顶取出返回地址，地址同样是 valA。因此 (1)(2) 填 IRMMOVQ、ICALL，(3)(4) 填 IPOPQ、IRET，选 D。踩坑点：教材中 IPOPQ 同时出现在两组里（写回新栈指针用 valE、读出数据用 valA），本题限定每组只填一个，按「访存地址」的语义应选 valA。","tags":["SEQ","mem_addr","HCL"],"options":["(1) IRMMOVQ  (2) IPOPQ  (3) IRET  (4) ICALL","(1) IRMMOVQ  (2) IRET  (3) IPOPQ  (4) ICALL","(1) ICALL  (2) IPOPQ  (3) IRMMOVQ  (4) IRET","(1) IRMMOVQ  (2) ICALL  (3) IPOPQ  (4) IRET"],"answer":3,"kp":"SEQ 顺序实现"},{"id":"m2018-08","source":"2018 期中","origin":"exam","lecture":10,"topic":"SEQ 中 popl 的 valP 与 valE","type":"single","difficulty":2,"stem":"在 Y86-32 的 SEQ 实现中执行 `popl rA` 指令时：取指阶段算出的下一条指令地址为 `valP = PC + ❶`；执行阶段算出栈指针的新值 `valE = ❷`。❶、❷分别是：","code":null,"explanation":"① popl 在 Y86-32 中是 2 字节指令（1 字节 icode:ifun 加上 1 字节 rA:rB），没有立即数和位移，所以下一条指令地址 valP = PC + 2，而不是 PC + 4（PC+4 是带 4 字节位移/立即数的指令长度）。② 弹栈使栈指针**增大**：译码阶段把 %esp（栈顶地址）读入 valB（也读入 valA），执行阶段 valE = valB + 4，即弹出一个 4 字节机器字后新的栈指针，用于写回 %esp。故答案为 C。踩坑点：popl 的栈指针调整用的是 valB 而非 valA；Y86 的 popl 同样只有 2 字节。","tags":["SEQ","popl","栈指针"],"options":["PC + 4，valA + 4","PC + 4，valA + (-4)","PC + 2，valB + 4","PC + 2，valB + (-4)"],"answer":2,"kp":"SEQ 顺序实现"},{"id":"m2020-06","source":"2020 期中","origin":"exam","lecture":10,"topic":"PIPE 中 mem_addr 的来源","type":"single","difficulty":3,"stem":"在 Y86-64 的 PIPE 实现中，仅考虑 ICALL、IPOPQ、IPUSHQ、IRET 指令，对 mem_addr 的 HCL 描述正确的是：","code":"word mem_addr = [\n     M_icode in { ①, ② } : M_valE;\n     M_icode in { ③, ④ } : M_valA;\n];","explanation":"访存地址的来源取决于该指令是写内存还是读内存：IPUSHQ（压栈）与 ICALL（压入返回地址）都要向内存写数据，写入地址是执行阶段算出的 valE（压栈/调用时为 %rsp−8），所以 ①② 是 IPUSHQ、ICALL；IPOPQ 与 IRET 要从内存读出数据，地址来自寄存器中保存的栈顶指针 valA，所以 ③④ 是 IPOPQ、IRET。对应 A。B 重复写了 IRET；C、D 把 ICALL 或 IRET 放错到读内存的那一组。踩坑点：判断依据是“写内存用 valE、读栈用 valA”，不要靠死记指令表。","tags":["Y86-64","PIPE","mem_addr"],"options":["①IPUSHQ  ②ICALL  ③IPOPQ  ④IRET","①IPUSHQ  ②IRET   ③ICALL  ④IRET","①IPUSHQ  ②IPOPQ  ③IRET  ④ICALL","①IPUSHQ  ②IRET   ③IPOPQ  ④ICALL"],"answer":0,"kp":"计算机网络"},{"id":"m2021-09","source":"2021 期中","origin":"exam","lecture":10,"topic":"用 SEQ 现有数据通路实现新指令","type":"single","difficulty":3,"stem":"在书中 Y86 的 SEQ 实现下，以下哪一条指令是现有信号通路能完成的：","code":null,"explanation":"C 正确：leave 可以拆成 rrmovq %rbp,%rsp（寄存器之间的传送）与 popq %rbp（读栈顶、写寄存器并调整栈指针），这两步在 SEQ 的现有数据通路上都能实现。A 错：iaddq 需要把寄存器值与立即数相加，而 SEQ 的 ALU 只能从 valA/valB/valC 中取两个输入，无法同时拿到 R[rA] 与立即数（教材为此专门增加了新的数据通路）。B 错：mmmovq 要把数据从内存一个地址搬到内存另一个地址，需要两次访存，而 SEQ 一个周期只能访问一次内存。D 错：enter 需要同时写 %rsp 与 %rbp 两个寄存器，而 SEQ 的写回阶段只能通过 dstE/dstM 写回一个寄存器值（valE 或 valM），做不到两次写。踩坑点：判断“现有通路能否完成”要看需要几次访存、几个 ALU 输入、几个写口。","tags":["SEQ","数据通路","指令实现"],"options":["iaddq rA, V：将立即数 V 与 R[rA] 相加，其中 rB 域设为 F，结果存入寄存器 rA","mmmovq rA, rB：将 R[rA] 存的地址开始的 8 字节数据，移动到 R[rB] 存的地址","leave：相当于先执行 rrmovq %rbp, %rsp，再执行 popq %rbp","enter：相当于先执行 pushq %rbp，再执行 rrmovq %rsp, %rbp"],"answer":2,"kp":"SEQ 顺序实现"},{"id":"m2023-15","source":"2023 期中","origin":"exam","lecture":10,"topic":"SEQ 中 new_pc 的选择","type":"single","difficulty":1,"stem":"在教材中 Y86-64 的 SEQ 实现中，考虑对 newPC 的 HCL 描述，第三处填空 ③ 应该填写的正确表述是：","code":"word new_pc = [\n    icode == ICALL :            ①  ;\n    icode == IJxx && Cnd :      ②  ;\n    icode == IRET :             ③  ;\n    1 :                         ④  ;\n];","explanation":"SEQ 的 new_pc 按顺序判断：ICALL 时下一条 PC 取 valP（返回地址，即 call 的下一条指令地址）；IJxx && Cnd 时取 valC（跳转目标）；IRET 时取 valM，因为返回地址是刚从栈顶弹出的那个 8 字节值，只能在访存阶段由 valM 得到；其余情况取 valP（顺序执行）。所以 ③ 处填 ValM，选 E。踩坑点：ICALL 用的是 valP 而不是 valC，IRET 用的是 valM 而不是 valA。","tags":["Y86-64","SEQ","new_pc"],"options":["ValA","ValB","ValC","ValE","ValM","ValP"],"answer":4,"kp":"SEQ 顺序实现"},{"id":"m2024-11","source":"2024 期中","origin":"exam","lecture":10,"topic":"SEQ 中 mem_addr 与 mem_data 的 HCL 选择","type":"single","difficulty":3,"stem":"在 Y86-64 的 SEQ 实现中，对 mem_addr 和 mem_data 的 HCL 补全正确的是：","code":"word mem_addr = [\n    icode in {IRMMOVQ, IPUSHQ, ICALL, IMRMOVQ} :    ①   ;\n    icode in {IPOPQ, IRET} :    ②   ;\n];\nword mem_data = [\n    icode in {IRMMOVQ, IPUSHQ} :    ③   ;\n    icode == ICALL :    ④   ;\n];","explanation":"先看 mem_addr：IRMMOVQ（写内存）、IPUSHQ（压栈）、ICALL（压入返回地址）的访存地址都是执行阶段算出的有效地址 valE（压栈/调用时是 %rsp-8），IMRMOVQ（读内存）的地址同样是 valC + valB 在 ALU 中算出的 valE，所以 ① = valE；IPOPQ、IRET 读的地址来自栈指针寄存器，即 valA，所以 ② = valA。再看 mem_data：IRMMOVQ 把寄存器值 valA 写入内存、IPUSHQ 压入的也是 valA，所以 ③ = valA；ICALL 写入内存的是返回地址 valP，所以 ④ = valP。组合即 ①valE ②valA ③valA ④valP，选 D。踩坑点：压栈指令的地址用 valE（新栈顶），写入的数据却是 valA（被压的寄存器）。","tags":["Y86-64","SEQ","HCL","访存"],"options":["①valA  ②valE  ③valE  ④valC","①valE  ②valA  ③valE  ④valC","①valA  ②valE  ③valA  ④valP","①valE  ②valA  ③valA  ④valP"],"answer":3,"kp":"ISA与逻辑设计"},{"id":"s2025b-05","source":"2025 第 2 次阶段测验","origin":"exam","lecture":10,"topic":"SEQ 中 popq 指令的写回逻辑","type":"single","difficulty":3,"stem":"在 SEQ 处理器中实现 Y86-64 的 `popq rA` 指令：执行阶段计算出 valE，访存阶段从栈顶取出 valM。那么写回阶段应当把 %rsp 更新为哪个值？","code":"popq rA 各阶段的处理（参考）：\nDecode : valA <- R[rA], valB <- R[%rsp]\nExecute: valE <- valB + 8\nMemory : valM <- M[valB]\nWriteB : R[rA] <- valM,  R[%rsp] <- ?","explanation":"popq 要做两件事：把栈顶数据送进 rA、把栈指针上移 8。第一件事用 valM（内存读出的值）写入 R[rA]，第二件事要写入 R[%rsp]，用的正是执行阶段算出的 valE = valB + 8。注意 SEQ 的写回阶段有两个写端口：dstE/valE 与 dstM/valM，对于 popq 而言 dstE = %rsp、dstM = rA，两者同时生效，这就是 popq 之所以需要两个写端口的原因。若写成 valB 则栈指针不会移动，程序会反复读同一个栈顶。","tags":["SEQ","popq","写回阶段"],"options":["valE，即旧的 %rsp 值加 8","valM，即刚从内存中读出的数据","valB，即旧的 %rsp 值","valC，即指令中的常数字段"],"answer":0,"kp":"SEQ 顺序实现"},{"id":"s2025b-06","source":"2025 第 2 次阶段测验","origin":"exam","lecture":10,"topic":"Y86-64 popq 的指令编码","type":"fill","difficulty":3,"stem":"Y86-64 的 popq 指令编码为 2 个字节：第 1 字节是 icode:ifun，第 2 字节是 rA:rB（高 4 位 rA、低 4 位 rB）。指令 `popq %rdx` 的第 2 个字节用十六进制表示是多少？","code":"Y86-64 寄存器编号：\n%rax=0  %rcx=1  %rdx=2  %rbx=3\n%rsp=4  %rbp=5  %rsi=6  %rdi=7   0xF 表示 RNONE\npopq rA 的字节 0 固定为 0xB0，字节 1 为 rA:rB，其中 rB 恒为 0xF","explanation":"popq 只使用一个寄存器操作数 rA（被弹出的目的寄存器），另一个寄存器字段 rB 必须写成 0xF（RNONE）。%rdx 的编号是 2，因此字节 1 的高 4 位是 2、低 4 位是 F，即 0x2F。整条 `popq %rdx` 的机器码就是 B0 2F。牢记 Y86-64 的寄存器编号顺序与 x86-64 不同：%rsp 在 Y86-64 中是 4 号，而在 x86-64 寄存器编码里 %rsp 也是 4，但两者编号表并不完全一致，考试中一般会给出编号表。","tags":["Y86-64","指令编码","popq"],"options":null,"answer":["0x2F","2F","0x2f","2f"],"kp":"ISA与逻辑设计"},{"id":"s2025b-07","source":"2025 第 2 次阶段测验","origin":"exam","lecture":10,"topic":"SEQ 中 aluA 的 HCL 生成逻辑","type":"single","difficulty":3,"stem":"下面是 SEQ 处理器中 ALU 的 A 口输入信号 aluA 的生成逻辑。第 1 行 `icode in { IRRMOVQ, ______ } : valA;` 中缺失的指令应当是什么？","code":"int aluA = [\n    icode in { IRRMOVQ, ______ } : valA;\n    icode in { IIRMOVQ, ______, IMRMOVQ } : valC;\n    icode in { ______, IPUSHQ } : ______;\n    icode in { ______, IPOPQ } : ______;\n    # Other instructions don't need ALU\n];","explanation":"ALU 的 A 口需要取 valA（源寄存器 rA 的值）的指令是「用两个寄存器参与运算」的那些：IRRMOVQ（寄存器传送，其实相当于 rA op 0）与 IOPQ（整数运算，rA op rB）。所以第 1 行应补 IOPQ。其余各行分别是：需要 valC 的是带立即数的指令（irmovq、rmmovq、mrmovq），需要常数 -8 的是要压栈的 call、pushq，需要常数 8 的是要弹栈的 ret、popq——因为它们都要调整 %rsp，而栈指针的加减正是由 ALU 完成的。","tags":["SEQ","HCL","aluA"],"options":["IOPQ","IMRMOVQ","IRMMOVQ","IRET"],"answer":0,"kp":"SEQ 顺序实现"},{"id":"s2025b-08","source":"2025 第 2 次阶段测验","origin":"exam","lecture":10,"topic":"SEQ 中 aluA 的 HCL 生成逻辑","type":"single","difficulty":3,"stem":"在同一个 aluA 生成逻辑中，第 2 行 `icode in { IIRMOVQ, ______, IMRMOVQ } : valC;` 缺失的指令应当是什么？","code":"int aluA = [\n    icode in { IRRMOVQ, ______ } : valA;\n    icode in { IIRMOVQ, ______, IMRMOVQ } : valC;\n    icode in { ______, IPUSHQ } : ______;\n    icode in { ______, IPOPQ } : ______;\n    # Other instructions don't need ALU\n];","explanation":"这一行对应「ALU 的 A 口取指令中的 8 字节常数 valC」的指令，即所有需要用立即数/位移量参与地址或数值计算的指令：IIRMOVQ（把立即数装入寄存器）、IRMMOVQ（把寄存器写到内存，地址 = valC + rB）以及 IMRMOVQ（从内存读到寄存器，地址 = valC + rB）。因此缺失的是 IRMMOVQ。考试中这张表把「A 口输入来源」按指令分成 valA / valC / 常数 -8 / 常数 8 四类，理解每条指令究竟在 ALU 里算什么，就能独立地推出全表。","tags":["SEQ","HCL","aluA"],"options":["IRMMOVQ","IOPQ","IPUSHQ","IRET"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025b-09","source":"2025 第 2 次阶段测验","origin":"exam","lecture":10,"topic":"SEQ 中栈操作指令的 ALU 常数","type":"single","difficulty":3,"stem":"在 aluA 的生成逻辑中，`ICALL` 与 `IPUSHQ` 这一类指令的 aluA 应取什么常数？`IRET` 与 `IPOPQ` 这一类又应取什么常数？","code":"int aluA = [\n    icode in { IRRMOVQ, IOPQ } : valA;\n    icode in { IIRMOVQ, IRMMOVQ, IMRMOVQ } : valC;\n    icode in { ______, IPUSHQ } : ______;\n    icode in { ______, IPOPQ } : ______;\n];","explanation":"Y86-64 的栈向低地址增长，压栈要执行 %rsp = %rsp - 8，弹栈要执行 %rsp = %rsp + 8，而这两个加法都由 ALU 完成。call 与 pushq 都是压栈（call 还要把返回地址 valP 写入内存，pushq 写 rA），所以 aluA 取 -8；ret 与 popq 都是弹栈（还要把栈顶值取出），所以 aluA 取 +8。因此答案是「-8 与 8」。注意常数是在 HCL 中直接写成字面量的（与 valA/valC 并列的另一种「信号来源」），因为它是常量而非来自寄存器或指令字段。","tags":["SEQ","HCL","栈指针"],"options":["-8 与 8","8 与 -8","0 与 8","valC 与 valA"],"answer":0,"kp":"SEQ 顺序实现"},{"id":"gen-c10-01","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"SEQ 各阶段职责","type":"single","difficulty":1,"stem":"在 SEQ 的各个阶段中，从程序寄存器读出源操作数（valA、valB）发生在哪个阶段？","code":null,"explanation":"讲义第 10 讲「SEQ Stages / Decode Logic」：Fetch 阶段从指令存储器读出指令字节、拆分出 icode/ifun/rA/rB/valC 并算出 valP；Decode 阶段通过寄存器文件的两个读端口按 srcA/srcB 读出 valA、valB，同时算出写端口地址 dstE、dstM；Execute 阶段由 ALU 计算 valE（有效地址、栈指针增减或算术结果）并生成条件标志 Cnd；Memory 阶段读或写数据存储器得到 valM；Write Back 阶段把 valE/valM 写回寄存器文件；最后 PC 更新阶段用 newPC 选择下一条指令地址。因此读源操作数在 Decode 阶段，而寄存器文件的写只在时钟上升沿（Write Back）发生。","tags":["SEQ","阶段划分","valA/valB"],"options":["Fetch（取指）","Decode（译码）","Execute（执行）","Memory（访存）"],"answer":1,"kp":"SEQ 顺序实现"},{"id":"gen-c10-02","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"rmmo
