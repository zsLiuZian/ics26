st 与 and 的区别、寄存器清零","type":"single","difficulty":2,"stem":"要把 16 位寄存器 AX 清零，下列指令中**错误**的是：","code":null,"explanation":"sub %ax,%ax 与 xor %ax,%ax 是最经典的两条清零惯用法（异或自身必为 0），and $0,%ax 把按位与的结果写回 %ax，也能清零，三者都正确。test 指令是「只置条件码、不写回结果」的 and：它计算 %ax & %ax 并据此设置 ZF/SF/PF，但**不修改目的操作数**，%ax 中原来的值原封不动，所以无法清零。踩坑点：test 与 and 的区别就在「是否写回结果」，test 常用于配合条件跳转判断某个值为零或某位是否为 1。答案为 C。","tags":["test 与 and","清零惯用法","条件码"],"options":["sub %ax, %ax","xor %ax, %ax","test %ax, %ax","and $0, %ax"],"answer":2,"kp":"控制流与条件码"},{"id":"m2017-04","source":"2017 期中","origin":"exam","lecture":4,"topic":"x86-64 指令与寻址格式的合法性","type":"multi","difficulty":3,"stem":"在下列 x86-64 汇编代码中，错误的是（官方答案说明 B 与 D 都不合法，故按多选处理）：","code":null,"explanation":"A 正确：把 %rax 的 8 字节内容存到 %rsp 指向的内存。B 错误：在 64 位模式下，用作内存地址的寄存器必须是 64 位寄存器，`(%ebx)` 不合法，应写成 `(%rbx)`。C 正确：movsbl 把内存中读出的字节**符号扩展**成 32 位存入 %eax，目的用 32 位寄存器正是该指令的标准用法。D 错误：比例变址寻址的完整形式是「基址, 变址, 比例因子」，中间必须有逗号，`(%rdx, 1)` 这种写法不合法；若要表示「%rdx + 1」，正确形式是 `1(%rdx)`。官方答案明确指出「B/D 都对（都错）」，所以本题按多选处理。","tags":["x86-64 寻址","指令合法性","比例变址"],"options":["movq %rax, (%rsp)","movl $0xFF, (%ebx)","movsbl (%rdi), %eax","leaq (%rdx, 1), %rdx"],"answer":[1,3],"kp":"机器级编程基础"},{"id":"m2018-04","source":"2018 期中","origin":"exam","lecture":4,"topic":"mov 系列指令与扩展指令","type":"single","difficulty":2,"stem":"在 x86-64 下，以下哪个选项的说法是**错误**的？","code":null,"explanation":"D 错在两处：movswq 中的 s 表示**符号扩展**（sign，零扩展是 movzwq），q 表示目的操作数是 8 字节（四字）而不是 4 字节。A 正确：任何以 32 位寄存器为目的的 mov 都会把对应 64 位寄存器的高 32 位**清零**（写 %eax 等于把 %rax 高位置 0，这是 x86-64 的硬性规定）。B 正确：cltq（等价于 cdqe）把 %eax 符号扩展成 %rax，常用于把 32 位有符号结果提升为 64 位。C 正确：movabsq 用于装入 64 位立即数或 64 位地址，其目的操作数只能是寄存器；往内存写立即数要用 movq 且立即数只有 32 位（符号扩展）。踩坑点：mov 扩展类指令的命名规则是「源大小 + 符号性(s/z) + 目的大小」，读名字就能判断语义。","tags":["mov 指令","符号扩展","x86-64 规则"],"options":["movl 指令以寄存器作为目的时，会将该寄存器的高 4 字节设置为 0","cltq 指令的作用是将 %eax 符号扩展到 %rax","movabsq 指令只能以寄存器作为目的","movswq 指令的作用是将零扩展的字传送到四字节目的"],"answer":3,"kp":"机器级编程基础"},{"id":"m2019-04","source":"2019 期中","origin":"exam","lecture":4,"topic":"x86-64 基本指令的语义","type":"single","difficulty":3,"stem":"以下关于 x86-64 指令的描述中，说法正确的有几项？\n\na) 有符号除法指令 `idivq S` 将 %rdx（高 64 位）和 %rax（低 64 位）中的 128 位数作为被除数，将操作数 S 的值作为除数，做有符号除法运算；指令将商存在 %rdx 寄存器中，将余数存在 %rax 寄存器中。\n\nb) 我们可以使用指令 `jmp %rax` 进行间接跳转，跳转的目标地址由寄存器 %rax 的值给出。\n\nc) 算术右移指令 `shr` 的移位量既可以是一个立即数，也可以存放在单字节寄存器 %cl 中。\n\nd) `leaq` 指令不会改变任何条件码。","code":null,"explanation":"只有 d 正确，故选 A（1 项）。a 错：idivq 的**商在 %rax、余数在 %rdx**，题目把两者说反了（配合 cqto 把 %rax 符号扩展成 %rdx:%rax 组成 128 位被除数）。b 错：寄存器间接跳转必须写成 `jmp *%rax`（带 `*`），`jmp %rax` 不合法。c 错：算术右移的助记符是 `sar`，`shr` 是**逻辑**右移，名称与语义对不上（虽然两者都支持立即数或 %cl 作为移位量）。d 对：leaq 只做地址计算并写入目的寄存器，不访存也不影响任何条件码，这正是编译器爱用 lea 做纯算术的原因。","tags":["x86-64 指令","idivq","移位与条件码"],"options":["1","2","3","4"],"answer":0,"kp":"机器级编程基础"},{"id":"m2019-09","source":"2019 期中","origin":"exam","lecture":4,"topic":"pushq 的等价指令序列","type":"single","difficulty":2,"stem":"`pushq %rbp` 的行为等价于以下哪一组两条指令？","code":null,"explanation":"x86-64 的栈向低地址增长，压栈的语义是「先把栈指针减 8，再把值写到新的栈顶位置」。所以 pushq %rbp 等价于 subq $8, %rsp 之后再执行 movq %rbp, (%rsp)，选 B。A、D 把存储地址写成 (%rdx)，而 %rdx 与栈指针毫无关系；C 压入的是 %rax 而不是 %rbp；D 还把 %rax 当作栈指针来减 8，更是错得离谱。踩坑点：一定要用**减完之后**的 %rsp 作为写入地址，两条指令的顺序不能颠倒（写成 movq 再 subq 就会破坏原栈顶数据）。","tags":["pushq","栈指针","等价指令序列"],"options":["subq $8, %rsp;  movq %rbp, (%rdx)","subq $8, %rsp;  movq %rbp, (%rsp)","subq $8, %rsp;  movq %rax, (%rsp)","subq $8, %rax;  movq %rbp, (%rdx)"],"answer":1,"kp":"数据布局与对齐"},{"id":"m2021-06","source":"2021 期中","origin":"exam","lecture":4,"topic":"x86-64 指令语义细节","type":"single","difficulty":3,"stem":"以下关于 x86-64 指令的描述，说法正确的是：","code":null,"explanation":"B 正确：INC 与 DEC 和加/减 1 一样会设置 OF、SF、ZF、AF、PF，唯独不改变 CF（进位标志），这正是它们与 add $1 的唯一区别。A 错：movabsq 的 64 位立即数只能送到寄存器，不能直接写入内存，movabsq $Imm,(%rax) 非法。C 错：call *%rax 中 %rax 的值本身就是跳转目标（间接调用），不会再从内存中读一次目标；若写成 call *(%rax) 才是从内存读。D 错：popq %rax 等价于 movq (%rsp),%rax; addq $8,%rsp，即先从栈顶读出数据再调整栈指针，选项把顺序写反了。踩坑点：INC/DEC 不改 CF、pop 是“先读后加”，这两点最容易被忽略。","tags":["INC/DEC","call","pop"],"options":["数据传送指令 movabsq $Imm, (%rax) 将以 64 位二进制补码表示的立即数 Imm 放到目的地址 (%rax) 中。","INC 和 DEC 指令会设置溢出标志 OF 和零标志 ZF，但不会改变进位标志 CF。","call *%rax 指令以 %rax 中的值作为读地址，从内存中读出调用目标。","popq %rax 指令的行为等效于 movq %rsp, %rax; addq $8, %rsp。"],"answer":1,"kp":"机器级编程基础"},{"id":"m2022-05","source":"2022 期中","origin":"exam","lecture":4,"topic":"x86-64 指令操作数合法性","type":"single","difficulty":1,"stem":"如下汇编语句不会产生错误信息的是：","code":null,"explanation":"D 正确：movw %si,8(%rbp) 把 16 位寄存器写入栈上内存，源与目的宽度都是 16 位，形式合法。A 错：立即数只能作为源操作数，movq %rax,$0x123 把立即数当目的操作数，非法。B 错：movl 是 32 位传送，源应为 %eax，写 %rax 宽度不匹配。C 错：不存在 %sl 这个寄存器（8 位寄存器是 %sil、%dil、%spl、%bpl 等）。踩坑点：AT&T 语法中指令后缀决定操作数宽度，寄存器名必须与后缀匹配，地址寄存器必须是 64 位。","tags":["mov 指令","操作数宽度","AT&T 语法"],"options":["movq %rax, $0x123","movl %rax, (%rsp)","movb %al, %sl","movw %si, 8(%rbp)"],"answer":3,"kp":"机器级编程基础"},{"id":"m2022-06","source":"2022 期中","origin":"exam","lecture":4,"topic":"用 LEA 指令实现整数表达式","type":"single","difficulty":2,"stem":"考虑下面的 C 语言代码，我们省略了被计算的表达式。用 GCC 编译实际的函数得到如下汇编代码，则 C 代码中缺失的表达式是：","code":"long scale2(long x, long y, long z){\n    long t = __________________________;\n    return t;\n}\n\nscale2:\n  leaq (%rdi, %rdi, 2), %rax\n  leaq (%rax, %rsi, 4), %rax\n  leaq (%rax, %rdx, 8), %rax\n  ret","explanation":"lea 能在一个周期内完成“基址 + 变址×比例因子”的计算，比例因子只能是 1、2、4、8。第一条 leaq (%rdi,%rdi,2),%rax 得 %rax = x + 2x = 3x；第二条 leaq (%rax,%rsi,4),%rax 得 3x + 4y；第三条 leaq (%rax,%rdx,8),%rax 得 3x + 4y + 8z，所以缺失的表达式是 3*x + 4*y + 8*z，选 B。A、C 都把比例因子误当成加法常数（把 2、4、8 当成加数）。D 把 x 与 z 的位置弄反。踩坑点：识别出 lea 的“变址×比例”语义，而不是把寄存器看成普通加法。","tags":["LEA","比例因子","x86-64"],"options":["((x + 2) + y + 4) + z + 8","3*x + 4*y + 8*z","((z + 2) + y + 4) + x + 8","3*z + 4*y + 8*x"],"answer":1,"kp":"机器级编程基础"},{"id":"m2023-04","source":"2023 期中","origin":"exam","lecture":4,"topic":"x86-64 传送指令的操作数合法性","type":"single","difficulty":2,"stem":"以下 x86-64 汇编指令中，正确的是：","code":"①  movw  $0x40  (%eax)\n②  movb  %dl  %sl\n③  movb  %spl  %al\n④  movq  %rax  %rsi\n⑤  movw  (%rcx)  %dx\n⑥  movl  %rsp  (%r8)","explanation":"③正确：%spl 是 x86-64 新增的低位字节寄存器，movb %spl,%al 合法。④正确：movq %rax,%rsi 是标准的 64 位寄存器传送。⑤正确：movw (%rcx),%dx 从内存取 16 位放入 %dx。故 ③④⑤ 正确，选 C。①错：(%eax) 不是合法的内存寻址形式，x86-64 下地址寄存器必须是 64 位（应为 (%rax)）。②错：不存在 %sl 这个寄存器（字节寄存器是 %sil、%dil、%spl、%bpl 等）。⑥错：movl 是 32 位传送，源寄存器应写成 %esp，movq %rsp,(%r8) 才合法。踩坑点：指令后缀（w/l/q）与操作数宽度必须一致，且地址寄存器只能是 64 位。","tags":["mov 指令","操作数宽度","寄存器"],"options":["①③⑤","②④⑥","③④⑤","①⑤⑥"],"answer":2,"kp":"机器级编程基础"},{"id":"s2025a-17","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"x86-64 寄存器命名","type":"fill","difficulty":1,"stem":"x86-64 的通用寄存器中，对应 `rbx` 低 32 位的寄存器名称是什么？","code":null,"explanation":"x86-64 的寄存器命名有固定的分层：64 位用 r 前缀（rbx），低 32 位把 r 换成 e（ebx），低 16 位去掉前缀（bx），低 8 位再拆成高、低两个字节（bh、bl）。因此访问 ebx 会写入 rbx 的低 32 位并把高 32 位清零。批卷说明规定寄存器前不写 % 不扣分。","tags":["x86-64","寄存器命名"],"options":null,"answer":["ebx","%ebx"],"kp":"机器级编程基础"},{"id":"s2025a-18","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"x86-64 寄存器命名","type":"fill","difficulty":1,"stem":"x86-64 的通用寄存器中，对应 `rcx` 最低字节的寄存器名称是什么？","code":null,"explanation":"rcx 的低 16 位是 cx，cx 又可分成高字节 ch 和低字节 cl，所以最低字节是 cl。这里 cl 还有一个重要用途：移位指令 `salq %cl, %rdx` 只能用 cl 指定移位量（这是 x86 的历史遗留设计），第 5 讲的汇编题就依赖这一细节。","tags":["x86-64","寄存器命名","移位量"],"options":null,"answer":["cl","%cl"],"kp":"机器级编程基础"},{"id":"s2025a-19","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"汇编指令中的寄存器访问计数","type":"fill","difficulty":2,"stem":"下面这段汇编代码中，一共有几次通用寄存器访问（不含取指令相关操作）？","code":"swap:\n    movq (%rdi), %rax\n    movq (%rsi), %rdx\n    movq %rdx, (%rdi)\n    movq %rax, (%rsi)","explanation":"统计时要记住：内存操作数里的地址寄存器也算一次寄存器访问，一次都没漏才是 8 次。逐行看：`movq (%rdi),%rax` 读 rdi、写 rax（2 次）；`movq (%rsi),%rdx` 读 rsi、写 rdx（2 次）；`movq %rdx,(%rdi)` 读 rdx、读 rdi（2 次）；`movq %rax,(%rsi)` 读 rax、读 rsi（2 次）。合计 8 次。很多人只数显式的寄存器操作数而漏掉括号里的地址寄存器，从而得到 6。","tags":["汇编","寻址方式","寄存器"],"options":null,"answer":["8"],"kp":"机器级编程基础"},{"id":"s2025a-20","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"汇编指令中的内存访问计数","type":"fill","difficulty":1,"stem":"下面这段汇编代码中，一共有几次内存访问（不含取指令相关操作）？","code":"swap:\n    movq (%rdi), %rax\n    movq (%rsi), %rdx\n    movq %rdx, (%rdi)\n    movq %rax, (%rsi)","explanation":"四条 movq 各带一个内存操作数：前两条是从内存读（load），后两条是往内存写（store），所以共 4 次内存访问。注意「取指令」也是访存行为，但题目明确排除；另外 swap 函数虽然交换了两个 long，却没有引入多余的临时内存变量，全部通过寄存器中转，这正是编译器寄存器分配的典型结果。","tags":["汇编","访存","load/store"],"options":null,"answer":["4"],"kp":"机器级编程基础"},{"id":"s2025a-21","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"比例变址寻址：地址计算","type":"fill","difficulty":2,"stem":"若寄存器内容为 rdx = 0xc000、rcx = 0x0200，则寻址形式 `0x10(%rdx,%rcx,4)` 所计算出的地址是多少？请用十六进制表示。","code":null,"explanation":"完整寻址形式是 `D(Rb, Ri, S) = Rb + Ri*S + D`：0xc000 + 0x0200*4 + 0x10 = 0xc000 + 0x800 + 0x10 = 0xC810。计算时先把比例项 0x0200*4 = 0x800 算准，再相加，注意不要漏掉偏移量 0x10。这种形式专门用于访问数组元素：基址是数组首地址、变址寄存器是下标、比例因子是元素大小。","tags":["寻址方式","比例变址","地址计算"],"options":null,"answer":["0xC810","C810","0xc810","c810"],"kp":"机器级编程基础"},{"id":"s2025a-22","source":"2025 第 1 次阶段测验","origin":"exam","lecture":4,"topic":"比例变址寻址：地址计算","type":"fill","difficulty":2,"stem":"若寄存器内容为 rdx = 0xc000、rcx = 0x0200，则寻址形式 `0x30(,%rdx,8)` 所计算出的地址是多少？请用十六进制表示。","code":null,"explanation":"`0x30(,%rdx,8)` 中基址寄存器缺省（为空），只有变址寄存器 rdx 与比例因子 8：0xc000*8 + 0x30 = 0x60000 + 0x30 = 0x60030。注意逗号前的空位表示「没有基址寄存器」，但偏移量仍然有效；比例因子只能取 1、2、4、8，对应 C 语言中 char、short、int/long、更大的结构体等的元素大小。","tags":["寻址方式","比例变址","地址计算"],"options":null,"answer":["0x60030","60030","0x60030"],"kp":"机器级编程基础"},{"id":"gen-c04-01","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"32 位寄存器写操作与零扩展","type":"single","difficulty":1,"stem":"已知 `%rax` 当前的值是 0xFFFFFFFFFFFFFFFF。执行指令 `movl $0x1, %eax` 之后，`%rax` 的值是：","code":null,"explanation":"x86-64 规定：任何写入 32 位目标寄存器的操作都会把该寄存器的高 32 位自动清零。`movl $0x1, %eax` 只写低 32 位为 0x00000001，同时把 %rax 的高 32 位清 0，所以 %rax = 0x0000000000000001。选项 B 是「只改低 32 位、保留高位」的直觉错误；选项 C 完全没有生效；选项 D 把立即数放到了高半部分。这条规则在讲义中出现过两次：第 5 讲 `movzbl %al, %eax` 后处理 %rax 的「Beware weirdness」，以及第 6 讲 `movl $3000, %esi` 的说明「movl 会把高 32 位清零，而且比 movq 省 1 字节」。对应第 4 讲「Moving Data」与寄存器命名一节。","tags":["寄存器","movl","零扩展"],"options":["0x0000000000000001","0xFFFFFFFF00000001","0xFFFFFFFFFFFFFFFF","0x0000000100000000"],"answer":0,"kp":"机器级编程基础"},{"id":"gen-c04-02","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"AT&T 汇编操作数顺序","type":"single","difficulty":1,"stem":"在 AT&T 语法的汇编代码中，指令 `movq %rax, %rdx` 的含义是：","code":null,"explanation":"AT&T 语法采用「源操作数在前、目的操作数在后」的顺序（与 Intel 文档的 `mov Dest, Src` 正好相反），所以 `movq %rax, %rdx` 是把 %rax 的值送进 %rdx，等价于 C 的 `temp2 = temp1`。选项 A 把顺序读反了，是初学时最常见的错误。选项 C、D 错在把寄存器当成了内存地址：只有加括号写 `(%rax)` 才表示访问 %rax 指向的 8 字节内存，不加括号的 `%rax` 就是寄存器本身的值。讲义特别提醒「Watch out for argument order! (Warning: Intel docs use op Dest, Src)」，对应第 4 讲「Some Arithmetic Operations」与操作数类型一节。","tags":["AT&T语法","movq","操作数"],"options":["把 %rdx 的值写入 %rax","把 %rax 的值写入 %rdx","把 %rax 所指向的内存单元写入 %rdx","把 %rdx 所指向的内存单元写入 %rax"],"answer":1,"kp":"机器级编程基础"},{"id":"gen-c04-03","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"寻址模式与有效地址计算","type":"single","difficulty":2,"stem":"已知 `%rdx = 0xf000`、`%rcx = 0x0100`。指令 `movq 0x80(,%rdx,2), %rax` 访问的内存地址（有效地址）是：","code":null,"explanation":"最一般的内存寻址形式是 D(Rb, Ri, S)，有效地址为 Reg[Rb] + S×Reg[Ri] + D。本题中基址寄存器位置为空（Rb 缺省为 0），索引寄存器 Ri = %rdx，比例因子 S = 2，位移 D = 0x80，所以地址 = 2 × 0xf000 + 0x80 = 0x1E000 + 0x80 = 0x1E080。选项 B 误把比例因子当成 1 再加上 0x100（那是 (%rdx,%rcx) 的结果）；选项 C 忘了乘比例因子，只算了 0xf000 + 0x80；选项 D 把位移的十六进制写错位。注意比例因子只能是 1、2、4、8，因为它们对应 1/2/4/8 字节的基本类型大小，这样一条指令就能直接算出数组元素地址。对应第 4 讲「Address Computation Examples」表。","tags":["寻址模式","有效地址","比例因子"],"options":["0x1E080","0x1E100","0xF080","0x1E008"],"answer":0,"kp":"机器级编程基础"},{"id":"gen-c04-04","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"movz 与 movs 零扩展/符号扩展","type":"single","difficulty":3,"stem":"内存中某个 `char` 变量的字节值是 0x80。若分别用 `movzbl` 和 `movsbl` 把它装载到 `%eax`，则 `%eax` 的值依次是：","code":null,"explanation":"`movzbl` 是「零扩展传送字节到长字」：把 1 字节源的所有高位补 0，于是 0x80 扩展为 0x00000080（值为 128，即无符号解释）。`movsbl` 是「符号扩展传送字节到长字」：把源字节的最高位复制到所有高位，0x80 的最高位是 1，于是高 24 位全补 1，得到 0xFFFFFF80（值为 -128，即补码解释）。选项 B 把两条指令弄反；选项 C 忽略了符号扩展；选项 D 忽略了零扩展。选择哪条指令取决于源数据在 C 中是 `char`（有符号，需要符号扩展）还是 `unsigned char`（需要零扩展）；第 5 讲返回布尔值时先用 `setg %al` 再用 `movzbl %al,%eax`，正是为了把「只有低字节有效」的结果干净地扩展成 0/1。对应第 4 讲「Moving Data」与第 5 讲「Reading Condition Codes (Cont.)」。","tags":["movzbl","movsbl","符号扩展"],"options":["0x00000080；0xFFFFFF80","0xFFFFFF80；0x00000080","两者都是 0x00000080","两者都是 0xFFFFFF80"],"answer":0,"kp":"机器级编程基础"},{"id":"gen-c04-05","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"movq 操作数组合的合法性","type":"multi","difficulty":2,"stem":"下列关于 `movq` 指令的写法中，**合法**的有：","code":null,"explanation":"`movq` 支持的操作数组合是：立即数→寄存器、立即数→内存、寄存器→寄存器、寄存器→内存、内存→寄存器。选项 A（立即数→寄存器，对应 C 的 `temp = 0x4;`）合法；选项 C（立即数→内存，对应 `*p = -147;`）合法，讲义明确列出 `movq $-147,(%rax)`；选项 E（寄存器→内存，用途是保存局部变量）合法。选项 B 是内存→内存传送，x86 一条指令无法完成，必须借助寄存器中转，因此非法；选项 D 把立即数当目的操作数，而立即数不能作为目的，因此非法。踩坑点：机器码里的 `mov` 带后缀时目的操作数大小已由后缀确定，因此立即数→内存不需要额外的长度指示。对应第 4 讲「movq Operand Combinations」表。","tags":["movq","操作数组合","内存引用"],"options":["`movq $0x4, %rax`","`movq (%rax), (%rdx)`","`movq $-147, (%rax)`","`movq (%rax), $0x4`","`movq %rax, 8(%rbp)`"],"answer":[0,2,4],"kp":"机器级编程基础"},{"id":"gen-c04-06","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"leaq 的语义与用途","type":"multi","difficulty":2,"stem":"关于 x86-64 的 `leaq` 指令，下列说法正确的有：","code":null,"explanation":"选项 A 正确：lea 与 mov 的关键区别就在于它不访问内存，讲义用 `mov 6(%rbx,%rdi,8), %ax`（取内存）与 `lea 6(%rbx,%rdi,8), %rax`（取地址值）对比说明。选项 B 错误：`leaq` 是少数不修改条件码的指令，正因为如此编译器喜欢用它做算术，以免破坏前面 cmp 建立的条件码。选项 C 正确：%rdi + 2×%rdi = 3×%rdi，这是「用一条指令算乘法」的典型用法。选项 D 正确：比例因子只能是 1、2、4、8，因为它们对应基本类型 1/2/4/8 字节的步长；选项 E 错误：编译器大量用 lea 做 x + k*y 形式的普通算术（k = 1、2、4、8），例如 `x*12` 就编译成 `leaq (%rdi,%rdi,2), %rax; salq $2, %rax`。对应第 4 讲「Address Computation Instruction」与第 5 讲「Memory operands and LEA」一节。","tags":["leaq","条件码","寻址模式"],"options":["`leaq` 只是计算寻址模式表达式的值并写入目的寄存器，不会访问内存","`leaq` 会像 `addq` 一样根据结果设置条件码","`leaq (%rdi,%rdi,2), %rax` 执行后 %rax 等于 3 × %rdi","寻址模式中比例因子 S 只能取 1、2、4、8","`leaq` 只能用来计算内存地址，不能用于普通算术运算"],"answer":[0,2,3],"kp":"机器级编程基础"},{"id":"gen-c04-07","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"有符号与无符号指令的统一","type":"judge","difficulty":1,"stem":"在 x86-64 中，有符号加法与无符号加法使用同一条 `addq` 指令，两者在位级上的行为完全相同，因此不存在「有符号加法指令」和「无符号加法指令」之分。","code":null,"explanation":"判断正确。补码加法与无符号加法的硬件操作都是「各位相加并向高位进位、丢弃最高进位」，是同一个模 2^64 的加法，因此只需一条 `addq`。指令本身并不关心你把结果当作有符号还是无符号，只有在需要判断大小（如 `jg` 与 `ja`）或需要扩展（`movs` 与 `movz`）时才区分。讲义在「Some Arithmetic Operations」一节专门提示「No distinction between signed and unsigned int (why?)」，并在「Two's Complement Addition」中指出 `s = (int)((unsigned)u + (unsigned)v)` 与 `t = u + v` 必然得到相同结果。踩坑点：不要望文生义去找 `adds`/`addu`，两者并不存在；但要记住除法/右移/比较这类操作确实分有符号与无符号两套。","tags":["addq","补码","无符号","ISA"],"options":null,"answer":true,"kp":"整数与位运算"},{"id":"gen-c04-08","source":"自编 · 第 4 讲","origin":"created","lecture":4,"topic":"leaq 有效地址计算","type":"fill","difficulty":2,"stem":"已知 `%rbx = 0x1000`、`%rdi = 0x20`，执行 `leaq 0x10(%rbx,%rdi,8), %rax` 后，`%rax` 的值是多少？（用十六进制表示）","code":null,"explanation":"寻址模式 `0x10(%rbx,%rdi,8)` 的表达式是 Reg[%rbx] + 8 × Reg[%rdi] + 0x10 = 0x1000 + 8 × 0x20 + 0x10 = 0x1000 + 0x100 + 0x10 = 0x1110，十进制为 4368。`leaq` 只做地址算术而不访问内存，所以 %rax 得到的是这个数值而不是该地址处的 8 字节内容。这条指令也解释了编译器为什么能用 lea 一步完成数组元素地址计算 `&a[i]`（相当于 rbx + i*8），并为 `lea 8(%rsp), %rdi` 这类「取局部变量地址」的用法打下基础（见第 6 讲 call_incr 例子）。踩坑点和常见错误是忘记乘比例因子 8 而算成 0x1030（即 0x1000+0x20+0x10）。对应第 4 讲「Complete Memory Addressing Modes」与「Address Computation Examples」。","tags":["leaq","有效地址","比例因子"],"options":null,"answer":["0x1110","0x0000000000001110","4368"],"kp":"机器级编程基础"},{"id":"f2014-04","source":"2014 期末","origin":"exam","lecture":5,"topic":"条件传送指令 cmov 与三元运算符","type":"single","difficulty":3,"stem":"左边的 C 函数在 x86-64 上用 GCC 编译产生右边的汇编，那么 (1) 和 (2) 的内容分别是","code":"int arith(int x, int y) {\n    return (x < y) ? (1) : (2);\n}\n\n<arith>:\n    lea    (%rsi,%rdi,1),%eax    # %eax = y + x\n    mov    %esi,%edx             # %edx = y\n    sub    %edi,%edx             # %edx = y - x\n    cmp    %esi,%edi             # 置标志，相当于判断 x 与 y\n    cmovge %edx,%eax             # 若 x >= y 则 %eax = y - x\n    retq\n（提示：第一个参数放在 rdi，第二个参数放在 rsi）","explanation":"lea (%rsi,%rdi,1),%eax 先把 x + y 放进 %eax，它就是条件成立（x < y）分支的结果，故 (1) = x+y。sub %edi,%edx 计算的是 y - x；cmp %esi,%edi 计算 x - y 并置标志，随后 cmovge 在“大于等于”（即 x ≥ y，等价于条件不成立）时把 %edx = y - x 搬到 %eax，正好对应三元运算符的 else 分支，故 (2) = y-x。条件传送会先把两个分支都算出来再按条件选择，从而避免分支预测失败的开销。踩坑点：sub 与 cmp 的操作数顺序相反，要看清谁减谁。","tags":["条件传送","cmov","lea"],"options":["x-y，x+y","x+y，x-y","x+y，y-x","y-x，x+y"],"answer":2,"kp":"控制流与条件码"},{"id":"f2017-03","source":"2017 期末","origin":"exam","lecture":5,"topic":"test 与 cmp 的等价性","type":"single","difficulty":2,"stem":"下面说法正确的是","code":null,"explanation":"x86 是变长指令集，不同指令的机器码长度不同（1~15 字节），A 错。test %rax,%rax 计算 rax & rax 并置标志：ZF 反映 rax 是否为 0、SF 反映最高位、PF 反映低字节奇偶性，且 CF = OF = 0；cmp $0,%rax 计算 rax - 0，得到的 ZF/SF/PF 与 CF = OF = 0 完全相同，因此二者对标志位的影响恒等，B 对。switch 只有在分支较多且取值比较密集时才编译成跳转表，否则会编译成比较—跳转链，C 的“总是”错，D 自然也不对。踩坑点：test 与 cmp 的等价性只在操作数为 0（或两者相同）时成立。","tags":["条件码","test","cmp"],"options":["不同指令的机器码长度是相同的","test %rax, %rax 恒等于 cmp $0, %rax","switch 编译后总是会产生跳转表","以上都不对"],"answer":1,"kp":"控制流与条件码"},{"id":"lab2025-19","source":"2025 Lab 测验","origin":"exam","lecture":5,"topic":"BombLab phase_2 的数列递推","type":"single","difficulty":3,"stem":"下面是 phase_2 函数的反汇编代码。phase_2 要求输入 6 个整数，只有满足它的递推关系才能通过（不掉入 explode_bomb）。下列哪组输入能使炸弹**不爆炸**（即通过本关）？","code":"00000000000027bc <phase_2>:\n    27bc: f3 0f 1e fa           endbr64\n    27c0: 53                    push   %rbx\n    27c1: 48 83 ec 20           sub    $0x20,%rsp\n    27c5: 64 48 8b 04 25 28 00  mov    %fs:0x28,%rax\n    27cc: 00 00\n    27ce: 48 89 44 24 18        mov    %rax,0x18(%rsp)\n    27d3: 31 c0                 xor    %eax,%eax\n    27d5: 48 89 e6              mov    %rsp,%rsi\n    27d8: e8 d0 06 00 00        call   2ead <read_six_numbers>\n    27dd: 83 3c 24 00           cmpl   $0x0,(%rsp)\n    27e1: 78 07                 js     27ea <phase_2+0x2e>\n    27e3: bb 01 00 00 00        mov    $0x1,%ebx\n    27e8: eb 0a                 jmp    27f4 <phase_2+0x38>\n    27ea: e8 92 06 00 00        call   2e81 <explode_bomb>\n    27ef: eb f2                 jmp    27e3 <phase_2+0x27>\n    27f1: 83 c3 01              add    $0x1,%ebx\n    27f4: 83 fb 05              cmp    $0x5,%ebx\n    27f7: 7f 1c                 jg     2815 <phase_2+0x59>\n    27f9: 48 63 c3              movslq %ebx,%rax\n    27fc: 8d 53 ff              lea    -0x1(%rbx),%edx\n    27ff: 48 63 d2              movslq %edx,%rdx\n    2802: 8b 14 94              mov    (%rsp,%rdx,4),%edx\n    2805: 8d 54 12 ff           lea    -0x1(%rdx,%rdx,1),%edx\n    2809: 39 14 84              cmp    %edx,(%rsp,%rax,4)\n    280c: 74 e3                 je     27f1 <phase_2+0x35>\n    280e: e8 6e 06 00 00        call   2e81 <explode_bomb>\n    2813: eb dc                 jmp    27f1 <phase_2+0x35>\n    2815: 48 8b 44 24 18        mov    0x18(%rsp),%rax\n    281a: 64 48 2b 04 25 28 00  sub    %fs:0x28,%rax\n    2821: 00 00\n    2823: 75 06                 jne    282b <phase_2+0x6f>\n    2825: 48 83 c4 20           add    $0x20,%rsp\n    2829: 5b                    pop    %rbx\n    282a: c3                    ret\n    282b: e8 60 fa ff ff        call   2290 <__stack_chk_fail@plt>","explanation":"读汇编：六个整数写入 (%rsp)~0x14(%rsp)；`cmpl $0x0,(%rsp)` 加 `js` 要求第一个数非负；随后 ebx 从 1 到 5 循环，每次执行 `edx = 2*a[ebx-1] - 1`（`lea -0x1(%rdx,%rdx,1),%edx`）并与 a[ebx] 比较，不等就 explode。所以通项是 a[i] = 2*a[i-1] - 1。验证选项 D：2 → 3 → 5 → 9 → 17 → 33 完全满足（2*2-1=3，2*3-1=5，2*5-1=9，2*9-1=17，2*17-1=33）。选项 A（0 1 …）第一个递推就错：2*0-1 = -1 ≠ 1；选项 B 首项为 0 同样失败；选项 C 在第 4 项失败：2*5-1 = 9 ≠ 8。注：原卷题干写作「哪个输入使 bomb 爆炸」，而按答案只有 D 能通过、A/B/C 都会爆炸，题干与答案不符；此处已按标准答案把题干修正为「哪组输入能通过本关」，以免歧义。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["BombLab","递推数列","循环分析"],"options":["0 1 1 2 3 5","0 1 1 3 5 11","2 3 5 8 12 17","2 3 5 9 17 33"],"answer":3,"kp":"控制流与条件码"},{"id":"lab2025-20","source":"2025 Lab 测验","origin":"exam","lecture":5,"topic":"BombLab phase_3 的跳转表与分支计算","type":"single","difficulty":3,"stem":"某同学调试 BombLab 的 phase_3 时，在 *phase_3 + 0x84 处设置断点，输入 0 0 触发断点并查看寄存器（此时 %rip = 0x...8ad，%eax = 0xffffff3a）。phase_3 先读入两个整数 a、b，要求 a ≤ 7，再按 a 查跳转表进入不同分支计算出一个期望值，最后要求 b 等于该值且 a ≤ 5。下列哪个输入能使炸弹**不爆炸**？","code":"# objdump -d bomb (节选)\n    185a: 83 3c 24 07           cmpl   $0x7,(%rsp)        # a <= 7 ?\n    185e: 0f 87 9a 00 00 00     ja     18fe <phase_3+0xd5>\n    1864: 8b 04 24              mov    (%rsp),%eax\n    1867: 48 8d 15 b2 2a 00 00  lea    0x2ab2(%rip),%rdx  # 4320\n    186e: 48 63 04 82           movslq (%rdx,%rax,4),%rax\n    1872: 48 01 d0              add    %rdx,%rax\n    1875: 3e ff e0              notrack jmp *%rax\n    187f: b8 00 00 00 00        mov    $0x0,%eax          # a = 1 入口\n    1884: 2d 1a 03 00 00        sub    $0x31a,%eax\n    1889: 05 99 02 00 00        add    $0x299,%eax\n    188e: 2d 04 03 00 00        sub    $0x304,%eax\n    1893: 05 04 03 00 00        add    $0x304,%eax\n    1898: 2d 04 03 00 00        sub    $0x304,%eax\n    189d: 05 04 03 00 00        add    $0x304,%eax\n    18a2: 2d 04 03 00 00        sub    $0x304,%eax\n    18a7: 83 3c 24 05           cmpl   $0x5,(%rsp)        # a <= 5 ?\n    18ab: 7f 06                 jg     18b3 <phase_3+0x8a>\n    18ad: 39 44 24 04           cmp    %eax,0x4(%rsp)     # b == eax ?\n    18b1: 74 05                 je     18b8 <phase_3+0x8f>\n    18b3: e8 cc 07 00 00        call   2084 <explode_bomb>\n    18cd: b8 bf 02 00 00        mov    $0x2bf,%eax        # a = 0 入口\n    18d4: b8 00 00 00 00        mov    $0x0,%eax          # a = 2 入口\n    18db: b8 00 00 00 00        mov    $0x0,%eax          # a = 3 入口\n    18e2: b8 00 00 00 00        mov    $0x0,%eax          # a = 4 入口\n    18e9: b8 00 00 00 00        mov    $0x0,%eax          # a = 5 入口\n    18f0: b8 00 00 00 00        mov    $0x0,%eax          # a = 6 入口\n    18f7: b8 00 00 00 00        mov    $0x0,%eax          # a = 7 入口\n\n# objdump -s -j .rodata bomb（跳转表，相对 4320 的偏移）\n4320 add5ffff 5fd5ffff b4d5ffff bbd5ffff\n4330 c2d5ffff c9d5ffff d0d5ffff d7d5ffff\n\n# (gdb) info registers（在 *phase_3+0x84 断点处，输入 0 0）\nrax   0xffffff3a    4294967098\nrip   0x5555555558ad   <phase_3+132>","explanation":"跳转表项是 32 位有符号偏移量，目标地址 = 0x4320 + 偏移：项 0 为 0xffffd5ad = -10835 → 0x18cd，项 1 为 0xffffd55f = -10913 → 0x187f，其余依次为 0x18d4、0x18db、0x18e2、0x18e9、0x18f0、0x18f7。各分支把 eax 置初值后从不同的入口汇入 187f~18a2 这段加减常数序列，最终结果不同：a = 0（从 18cd 进入，eax 初值 0x2bf）算完得到 -198，与断点处 eax = 0xffffff3a = -198 完全吻合，说明输入 0 0 走到 18ad 时比较的期望值就是 -198；a = 1（从 187f 进入，eax 初值 0）算完得到 -901，因此输入「1 -901」满足 b == eax 且 a ≤ 5，能够通过。a = 6、7 会在 18a7 的 `cmpl $0x5,(%rsp)` 处被判为大而爆炸，故 C、D 必错；A 的第二个数 -197 与期望值 -198 不符，也爆炸。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["BombLab","跳转表","switch","逆向"],"options":["0 -197","1 -901","6 0","7 -772"],"answer":1,"kp":"控制流与条件码"},{"id":"m2014-04","source":"2014 期中","origin":"exam","lecture":5,"topic":"只改变条件码的指令","type":"single","difficulty":1,"stem":"下列指令组中，哪一组指令只改变条件码，而不改变寄存器的值？","code":null,"explanation":"CMP 做减法（dest - src）但不写回结果，只根据差值设置 ZF、SF、OF、CF；TEST 做按位与但不写回结果，只根据结果设置条件码。二者都只更新条件码，故选 C。A 中的 SUB 会把结果写回目的寄存器；B 中的 AND 同样会写回结果（AND/TEST 的条件码语义相同，区别就在是否写回）；D 中的 LEAL 根本不改变条件码（它只算地址/算术值），所以这一组不是「只改变条件码」。踩坑点：CMP 与 SUB、TEST 与 AND 是两对「设置条件码相同、是否写回不同」的指令。","tags":["条件码","CMP","TEST"],"options":["CMP, SUB","TEST, AND","CMP, TEST","LEAL, CMP"],"answer":2,"kp":"控制流与条件码"},{"id":"m2014-08","source":"2014 期中","origin":"exam","lecture":5,"topic":"跳转表的间接跳转指令格式","type":"single","difficulty":2,"stem":"对简单的 switch 语句常采用跳转表的方式实现。在 x86-64 系统中，下述最有可能正确的 switch 分支跳转汇编指令为哪个？","code":null,"explanation":"间接跳转必须写成 `jmp *操作数` 的形式，其中 `*` 表示「把取出的值当作跳转目标」，所以 A、B 缺少 `*`，属于格式错误。跳转表中的每一项是一个代码地址，在 x86-64 中地址占 8 字节，因此比例因子应当是 8（`.L3(,%eax,8)` 即 .L3 + 8×%eax），故选 D。在 IA32 中地址是 4 字节，对应写法才是 `jmp *.L3(,%eax,4)`，这也是选项 C 的来由。踩坑点：`*` 与比例因子 8 分别在 2014 年这道题中是一对「双重陷阱」，缺一不可。","tags":["跳转表","switch","间接跳转"],"options":["jmp .L3(,%eax,4)","jmp .L3(,%eax,8)","jmp *.L3(,%eax,4)","jmp *.L3(,%eax,8)"],"answer":3,"kp":"控制流与条件码"},{"id":"m2016-01","source":"2016 期中","origin":"exam","lecture":5,"topic":"条件码与 CF 标志位","type":"single","difficulty":2,"stem":"在下列 x86-64 汇编指令中，其执行会改变条件码中的 CF（进位/借位标志）位的是：","code":null,"explanation":"jmp 是无条件跳转，只修改 PC，不影响任何条件码；jc NEXT 是依据 CF 决定是否跳转的条件跳转，它只**读取** CF 而不修改 CF；inc（以及 dec）非常特殊——它们会改变 ZF、SF、OF，但**不改变 CF**，这是本题最容易踩的坑；shl 左移会把移出的最高位送入 CF（同时影响 ZF、SF、PF，OF 另有定义），因此只有 shl $1,%ax 会改变 CF。答案为 D。","tags":["条件码","移位指令","inc 不改 CF"],"options":["jmp NEXT","jc NEXT","inc %bx","shl $1, %ax"],"answer":3,"kp":"控制流与条件码"},{"id":"m2016-02","source":"2016 期中","origin":"exam","lecture":5,"topic":"cmp 指令与条件码解释","type":"single","difficulty":1,"stem":"下列关于比较指令 `cmp` 的说法中，正确的是：","code":null,"explanation":"cmp 的本质是「只置条件码、不保存结果」的减法：cmpb a, b 相当于计算 b - a。硬件设置标志位时并不区分有符号与无符号，CF、ZF、SF、OF 都会按位运算结果置位，区别只在后续条件跳转如何解释这些标志：无符号比较用 ja/jb（看 CF、ZF），有符号比较用 jg/jl（看 SF、OF、ZF）。因此 cmp 本身不区分符号性。A、B 错；串比较用的是 cmpsb/cmpsw 等串指令，C 错。答案为 D。","tags":["cmp","条件码","有符号与无符号"],"options":["专用于有符号数比较","专用于无符号数比较","专用于串比较","不区分被比较的对象是有符号数还是无符号数"],"answer":3,"kp":"控制流与条件码"},{"id":"m2016-03","source":"2016 期中","origin":"exam","lecture":5,"topic":"PC 相对寻址与跳转目标","type":"single","difficulty":2,"stem":"如下代码段中，跳转指令的目的地址是：","code":"400020: 74 F0    je ________\n400022: 5d       pop %rbp","explanation":"je 是 rel8 形式，机器码为 74 加上一字节补码偏移。偏移 F0 = -16（十进制），而 PC 相对寻址的基准是**下一条指令的地址**（je 本身占 2 字节，所以基准为 400022），故目的地址 = 400022 - 0x10 = 400012，选 B。A（400010）是把基准错当成本条指令地址 400020 算出来的；D（400112）是把 F0 当成正的 0x10 而不是补码负数；C（400110）则把偏移误当成了 0x100。踩坑点：rel8/rel32 的基准永远是「跳转指令之后的那条指令的地址」。","tags":["跳转指令","相对寻址","机器码"],"options":["400010","400012","400110","400112"],"answer":1,"kp":"控制流与条件码"},{"id":"m2016-04","source":"2016 期中","origin":"exam","lecture":5,"topic":"条件表达式的条件转移条数","type":"single","difficulty":3,"stem":"对于如下 C 语言条件语句，它所对应的汇编代码中**至少**包含几条条件转移指令？\n`if (a > 0 && a != 1 || a < 0 && a != -1) b = a;`","code":null,"explanation":"先化简条件：（a>0 且 a≠1）或者（a<0 且 a≠-1），等价于「a 既不是 0、也不是 1、也不是 -1」，即 !(a==0 || a==1 || a==-1)。按这个等价形式编译，只需三次相等性判断，各配一条条件跳转（a==0 则跳过赋值、a==1 则跳过、a==-1 则跳过），最少 3 条，选 B。若不做化简而按布尔连接词的短路结构直译，两个 && 各需 2 条、|| 再需 1 条，共 5 条，所以 D 是「直译」的条数而不是最小值；2 条无法区分三个特殊值。官方解析给出的正是「这个条件相当于 !(a==0 || a==1 || a==-1)」。","tags":["条件转移","短路求值","布尔表达式化简"],"options":["2 条","3 条","4 条","5 条"],"answer":1,"kp":"整数与位运算"},{"id":"m2016-06","source":"2016 期中","origin":"exam","lecture":5,"topic":"switch 跳转表与 default 分支","type":"single","difficulty":3,"stem":"下面是某 switch 语句编译出的跳转表相关代码（`.L4` 为跳转表，每项 8 字节，`.L2` 是 default 分支的标号）。请问哪些 case 值没有出现在分支中，即落到了 default？","code":"addq  $1, %rdi\n        cmpq  $8, %rdi\n        ja    .L2\n        jmp   *.L4(, %rdi, 8)\n.L4:    .quad .L9\n        .quad .L5\n        .quad .L6\n        .quad .L7\n        .quad .L2\n        .quad .L7\n        .quad .L8\n        .quad .L2\n        .quad .L5","explanation":"编译器先把 case 值整体加 1（`addq $1, %rdi`）使其从 0 开始，再用无符号比较 `cmpq $8, %rdi; ja .L2` 处理越界：无符号大于 8 即 i+1 > 8，对应 i > 7 或 i < -1，都走 default。跳转表下标 n = i+1 取 0~8，依次对应 case 值 -1,0,1,2,3,4,5,6,7。表项为 [.L9,.L5,.L6,.L7,.L2,.L7,.L8,.L2,.L5]，其中下标 4 与 7（即 case 3 与 case 6）指向 default 标号 .L2，说明这两个 case 不在分支中。故选 A。其余选项给出的 case 值在表中都有真实分支标号。踩坑点：先做 +1 偏移再用 ja 判越界，是 switch 跳转表的固定套路；无符号比较使负数自动落入 default。","tags":["switch","跳转表","无符号越界判断"],"options":["3, 6","-1, 4","0, 7","2, 4"],"answer":0,"kp":"控制流与条件码"},{"id":"m2017-05","source":"2017 期中","origin":"exam","lecture":5,"topic":"条件传送的适用条件","type":"single","difficulty":3,"stem":"在下列关于条件传送（conditional move）的说法中，正确的是：","code":null,"explanation":"D 正确：条件传送没有独立后缀，操作数长度由**目的寄存器名**推断，例如目的写 %edx 就是 32 位传送、写 %rdx 就是 64 位传送，所以不需要（也不允许）像 mov 那样加 b/w/l/q 后缀。A 错：条件传送不支持单字节传送（没有 cmovb）。B 错：如果 `?:` 的某一支含有副作用（如自增、函数调用）或可能出错（如解引用空指针），条件传送会**把两支都求值**，从而改变程序行为甚至触发异常。C 错：条件传送把两个分支的计算都做掉，当被旁路那一支计算量很大时就白算了，可能更慢；它还会额外写寄存器、引入新的数据相关。踩坑点：cmov 的适用场景是「两支都很小、且都没有副作用」。","tags":["条件传送","分支预测","cmov"],"options":["条件传送可以用来传送字节、字、双字和 4 字的数据","C 语言中的 `?:` 条件表达式都可以编译成条件传送","使用条件传送总可以提高代码的执行效率","条件传送指令不需要用后缀（例如 b、w、l、q）来表明操作数的长度"],"answer":3,"kp":"控制流与条件码"},{"id":"m2018-06","source":"2018 期中","origin":"exam","lecture":5,"topic":"switch 跳转表与条件传送的副作用","type":"single","difficulty":2,"stem":"下列关于程序控制结构的机器代码实现的说法中，正确的是：","code":null,"explanation":"C 正确：只有当 case 值比较**密集**时 gcc 才生成跳转表；若 case 值稀疏（跨度大而取值少），gcc 会退化成一系列比较加条件跳转或二分决策树。A 错：条件跳转在分支难以预测时要付出冲刷流水线的代价，而条件赋值没有这个问题；反过来当分支体计算量大时条件赋值更慢，两者各有优劣，不能一概而论。B 错：条件赋值会把两个分支的计算**都执行**，若某一分支含有副作用（函数调用、自增、非法解引用）或可能出错，两种实现的行为就不同了。D 显然错。踩坑点：教材反复强调「条件传送并非总是更好」，判据是两支的计算量与是否有副作用。","tags":["switch","跳转表","条件传送副作用"],"options":["使用条件跳转（conditional jump）语句实现的程序片段比使用条件赋值（conditional move）语句实现的同一程序片段的运行效率高","使用条件跳转语句实现的程序片段与使用条件赋值语句实现的同一程序片段，虽然效率可能不同，但在 C 语言的层面上看总是有着相同的行为","一些 switch 语句不会被 gcc 用跳转表的方式实现","以上说法都不正确"],"answer":2,"kp":"控制流与条件码"},{"id":"m2019-06","source":"2019 期中","origin":"exam","lecture":5,"topic":"jg 的条件码表达式","type":"single","difficulty":3,"stem":"x86-64 提供一组条件码寄存器：ZF 为 1 表示最近的操作结果为 0；SF 为 1 表示最近的操作结果为负数；OF 为 1 表示最近的操作发生了补码溢出（正溢出或负溢出）。当我们在一条 `cmpq` 指令后使用条件跳转指令 `jg` 时，发生跳转等价于以下哪一个表达式的结果为 1？","code":null,"explanation":"cmpq a, b 按 b - a 的值设置条件码。有符号比较中，SF ^ OF = 1 恰好表示「b < a」（差的符号为负且没溢出，或差非负但发生了溢出），因此 ~(SF ^ OF) = 1 表示 b >= a；再与上 ~ZF（表示 b ≠ a）就得到 b > a，即 jg 的语义，选 A。B 只判断「不小于」，两数相等时也会跳转，那是 jge 的条件。C 就是 b < a（jl 的条件）。D 是「b < a 或 b == a」，恒为 1，没有任何筛选作用。踩坑点：有符号比较必须用 SF^OF（异或）而不是直接看 SF，因为溢出时 SF 会给出相反的结论。","tags":["条件码","jg 与 jge","SF/OF"],"options":["~(SF ^ OF) & ~ZF","~(SF ^ OF)","SF ^ OF","(SF ^ OF) | ZF"],"answer":0,"kp":"控制流与条件码"},{"id":"m2020-02","source":"2020 期中","origin":"exam","lecture":5,"topic":"条件码与 leaq 的特性","type":"single","difficulty":2,"stem":"条件码描述了最近一次算术或逻辑操作的属性。下列关于条件码的叙述中，哪一个是不正确的？","code":null,"explanation":"C 不正确，为本题答案：leaq 只是把计算出的有效地址送进寄存器，它既不访问内存也不做“算术运算”意义上的结果写回，因此不改变任何条件码（CF、OF、ZF、SF 都保持原值）。这也正是编译器喜欢用 lea 做加法和乘法的原因——不会破坏标志位。A 正确：set 类指令根据条件码组合把目的字节置 0 或 1。B 正确：cmp 做减法、test 做按位与，二者都只设置条件码而不保存结果，不改动目的寄存器。D 正确：除 jmp 外的跳转指令都依据条件码的某种组合决定是否跳转。踩坑点：lea 常被当成算术指令使用，但它绝不修改标志位。","tags":["条件码","leaq","cmp/test"],"options":["set 指令可以根据条件码的组合将一个字节设置为 0 或 1","cmp 指令和 test 指令可以设置条件码但不更改目的寄存器","leaq 指令可以设置条件码 CF 和 OF","除无条件跳转指令 jmp 外，其他跳转指令都是根据条件码的某种组合跳转到标号指示的位置"],"answer":2,"kp":"控制流与条件码"},{"id":"m2022-07","source":"2022 期中","origin":"exam","lecture":5,"topic":"cmp/set 指令与数据类型的匹配","type":"single","difficulty":3,"stem":"考虑下面的 C 语言代码，其中参数的数据类型 data_t 为某种有符号或无符号的整数类型，COMP 操作通过 #define 定义。假设 a 在 %rdi 中某个部分，b 在 %rsi 某个部分。对于下面每个指令序列，组合和描述正确的是：","code":"int comp(data_t a, data_t b){\n    return a COMP b;\n}\n\nA: cmpl %esi,%edi  setl  %al   data_t = long    COMP: <\nB: cmpw %si,%di    setge %al   data_t = short   COMP: >=\nC: cmpb %sil,%dil  setbe %al   data_t = char    COMP: <=\nD: cmpq %rsi,%rdi  setne %al   data_t = int     COMP: !=","explanation":"判断依据有两条：指令后缀的宽度必须与 data_t 一致，set 指令必须与 COMP 的有符号/无符号语义一致。A 错：cmpl 是 32 位，对应 int，long 应该用 cmpq。C 错：cmpb 虽然宽度对，但 char 是有符号类型，应配 setle（有符号小于等于）；setbe 是无符号比较，对应的类型应该是 unsigned char。D 错：cmpq 是 64 位，对应 long，int 应该用 cmpl。B 对：cmpw 是 16 位对应 short；cmpw %si,%di 计算 %di - %si，setge 表示有符号“大于等于”，即 a >= b，与 COMP 一致。踩坑点：宽度看后缀，有符号/无符号看 set 指令的后缀（l/g 与 b/a）。","tags":["cmp 指令","set 指令","数据类型匹配"],"options":["A：cmpl %esi,%edi / setl %al，data_t = long，COMP 为 <","B：cmpw %si,%di / setge %al，data_t = short，COMP 为 >=","C：cmpb %sil,%dil / setbe %al，data_t = char，COMP 为 <=","D：cmpq %rsi,%rdi / setne %al，data_t = int，COMP 为 !="],"answer":1,"kp":"控制流与条件码"},{"id":"m2023-06","source":"2023 期中","origin":"exam","lecture":5,"topic":"条件码、set 指令与条件传送","type":"single","difficulty":2,"stem":"以下说法中错误的是：","code":null,"explanation":"A 错误，为本题答案：cmpq %rsi,%rdi 计算的是 %rdi - %rsi，setl 表示“小于”，条件成立意味着 %rdi < %rsi，而选项写成“%rsi 小于 %rdi”，把两个操作数说反了。B 正确：testq %rax,%rax 按位与并只设置标志位，ZF=1 表示结果为 0，sete 会把 %al 置 1。C 正确：cmov 系列支持 16/32/64 位寄存器，没有单字节形式。D 正确：set 类指令的目的操作数只能是 8 位寄存器（如 %al），按条件把该字节置为 0 或 1。踩坑点：AT&T 语法中 cmp 的源、目的顺序与“减法方向”容易记混。","tags":["条件码","set 指令","cmp"],"options":["cmpq %rsi, %rdi 与 setl %al 连续执行这两条指令的效果是如果 %rsi 的值小于 %rdi，则将 %al 设置为 1。","testq %rax, %rax 与 sete %al 连续执行这两条指令的效果是如果 %rax 中的值等于 0，则将 %al 设置为 1。","条件传送指令的源和目的操作数可以为 16/32/64 位寄存器，但是不支持单字节传送。","set*（如 sete, setne, seta）指令中的目的操作数只能是一个低位单字节寄存器，该指令会根据条件是否成立将一个字节设置为 0 或 1。"],"answer":0,"kp":"控制流与条件码"},{"id":"m2024-08","source":"2024 期中","origin":"exam","lecture":5,"topic":"条件传送与条件跳转的差异","type":"single","difficulty":3,"stem":"在 x86-64 中，关于 GCC 对下面 read1 和 read2 编译的结果，下列说法正确的是：","code":"long read1(long *xp) {\n    return (xp ? *xp : 0);\n}\n\nlong read2(long *xp) {\n    if (xp) return *xp;\n    else return 0;\n}","explanation":"A 正确：两段代码语义完全相同（都是 xp 为空返回 0，否则返回 *xp），GCC 对它们生成了相同的汇编——都是先测试 %rdi 是否为 0，再用条件跳转决定是否访存，所以功能和生成的代码都一致。B 错：既然编译结果是条件跳转而不是无条件访存，当 xp 为 NULL 时根本不会执行访存，不会出错。C 错：两者汇编完全相同，效率自然相同，谈不上 read2 更差。D 错：cmov 的特点是“无论条件是否成立都先执行源操作数的读取”。若用 cmove (%rdi),%rax，即使 ZF=0（条件不成立、结果被丢弃），%rdi 指向的内存也已经被访问，若 %rdi 是非法地址（如 NULL）就会触发段错误。这正是条件传送不能随意替代条件跳转的原因。","tags":["条件传送","条件跳转","cmov"],"options":["read1 和 read2 的功能一致，并且编译的汇编代码结果也一致","read1 在运行时具有安全隐患，当 xp 的值为 NULL 时会导致错误","read2 由于可能出现分支预测错误，所以比 read1 的效率更低","对于 cmove(%rdi), %rax 这条指令来说，如果 ZF 为 0，那么就不会报错"],"answer":0,"kp":"控制流与条件码"},{"id":"s2025a-23","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"cmp 与 sub 的对应关系","type":"fill","difficulty":2,"stem":"给出与指令 `cmpq %rbx,%rax` 内在操作流程相同、只是会修改目的寄存器的那条指令。","code":null,"explanation":"`cmpq b,a` 等价于做减法 a - b 并只保留条件码，不写回结果；因此只要把「不写回」去掉，就得到 `subq %rbx,%rax`。注意 AT&T 语法的操作数顺序是「源, 目的」，`cmpq %rbx,%rax` 计算的是 rax - rbx，所以等价指令必须是 `subq %rbx,%rax` 而不是反过来；写反会得出一组语义完全相反的条件码。批卷说明规定汇编里的 q 后缀不写不扣分。","tags":["cmp","sub","条件码","AT&T 语法"],"options":null,"answer":["subq %rbx,%rax","subq %rbx, %rax","sub %rbx,%rax","subq %rbx,%rax"],"kp":"控制流与条件码"},{"id":"s2025a-24","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"test 与 and 的对应关系","type":"fill","difficulty":2,"stem":"给出与指令 `testq %rbx,%rax` 内在操作流程相同、只是会修改目的寄存器的那条指令。","code":null,"explanation":"`testq b,a` 做按位与 a & b，只根据结果设置条件码（主要是 ZF、SF），不写回任何寄存器；去掉「不写回」的限制就是 `andq %rbx,%rax`。典型用法 `testq %rdx,%rdx` 用来判断 rdx 是否为零或是否为负，等价于 `andq %rdx,%rdx`。与 cmp/sub 的关系一样，这里也存在「只设置条件码的指令」和「真正做运算的指令」这一对偶关系。","tags":["test","and","条件码"],"options":null,"answer":["andq %rbx,%rax","andq %rbx, %rax","and %rbx,%rax"],"kp":"控制流与条件码"},{"id":"s2025a-25","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"set 指令与条件表达式","type":"fill","difficulty":2,"stem":"把 C 语言函数改为 `int cmpxy(long x, long y) { return x <= y; }`，与之对应的汇编代码应补全为下面哪一行？","code":"int cmpxy(long x, long y)\n{\n    return x <= y;\n}\n\ncmpxy:\n    cmpq %rsi, %rdi\n    __________ %al\n    movzbl %al, %eax\n    ret","explanation":"`cmpq %rsi,%rdi` 计算 x - y 并设置条件码，要把「有符号小于等于」这一条件码组合取到字节寄存器里，应当使用 `setle`（Set if Less or Equal，对应 SF≠OF 或 ZF=1）。原程序的 `return x > y` 用的是 `setg`，两者恰好互补。set 系列指令只写 1 个字节，之后必须用 `movzbl %al,%eax` 把结果零扩展成 32 位作为返回值，这是因为函数返回 int 时要求高 24 位归零。","tags":["set 指令","条件码","movzbl"],"options":null,"answer":["setle %al","setle","setle %al"],"kp":"控制流与条件码"},{"id":"s2025a-26","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"movzbl 指令功能","type":"single","difficulty":1,"stem":"`movzbl` 指令本身的功能是什么？","code":null,"explanation":"助记符 `movzbl` 可拆成 mov + z（zero-extend）+ b（byte，源为 1 字节）+ l（long word，目的为 4 字节），所以含义是「取 1 字节、高位补 0、写成 32 位」。与之相对的是 `movsbl`（符号扩展）和 `movzbq`/`movzwl` 等其它宽度组合。本题中 `setg %al` 只设置了 al 的低 8 位，其余位是上一次运算的残留，所以必须用零扩展把 al 变成干净的 0 或 1。","tags":["movzbl","零扩展","数据传送指令"],"options":["从源操作数取出 1 个字节，零扩展为 32 位后存入目的操作数","从源操作数取出 1 个字节，符号扩展为 32 位后存入目的操作数","从源操作数取出 4 个字节，截断为 1 个字节后存入目的操作数","从源操作数取出 8 个字节，零扩展为 32 位后存入目的操作数"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025a-27","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"x86-64 写 32 位寄存器清零高 32 位","type":"single","difficulty":2,"stem":"在 x86-64 中，`movzbl %al, %eax` 这条指令除了显式地把 al 零扩展进 eax 之外，还有一条隐含操作：","code":null,"explanation":"x86-64 规定：任何产生 32 位结果的指令都会自动把目的寄存器的高 32 位清零。因此 `movzbl %al,%eax` 之后整个 rax 的高 32 位都是 0，等于顺手完成了 64 位清零，无需再写 `movl $0,%eax` 之类的指令。这条规则在写汇编时要牢记：想保留高 32 位就必须使用 64 位指令（如 movq），而使用 e 结尾的 32 位指令会无意中破坏高半部分。","tags":["x86-64","32 位写清零","寄存器语义"],"options":["把目的操作数寄存器（本例为 %rax）的高 32 位清零，相当于同时更新了整个 64 位寄存器","把目的操作数寄存器的高 32 位全部置为符号位","把源操作数 %al 的高 4 位清零","没有任何隐含操作，只影响低 8 位"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025a-28","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"条件传送指令实现 absdiff","type":"fill","difficulty":2,"stem":"用条件传送指令实现求绝对差 `long absdiff(long x, long y)`，下面汇编中缺失的那一行是什么？","code":"absdiff:\n    movq %rdi, %rax\n    subq %rsi, %rax\n    movq %rsi, %rdx\n    subq %rdi, %rdx\n    __________\n    cmovg %rdx, %rax\n    ret","explanation":"条件传送 `cmovg` 需要一个已经设置好的条件码，因此必须在它之前用 `cmpq %rsi,%rdi` 比较 x 与 y（计算结果为 x - y）。整段代码的思路是：先把两条分支的结果都算出来——rax 存 x-y、rdx 存 y-x，再根据条件码把需要的那一个搬进 rax。当 x > y 时（jg）应选 adx = y-x（因为 |x-y| = y-x），所以写 `cmovg %rdx,%rax` 是正确的。","tags":["条件传送","cmov","cmp"],"options":null,"answer":["cmpq %rsi,%rdi","cmpq %rsi, %rdi","cmp %rsi,%rdi"],"kp":"控制流与条件码"},{"id":"s2025a-29","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"条件传送指令的适用限制","type":"single","difficulty":2,"stem":"有些情况不适合用条件传送指令来实现分支，因为条件传送指令需要：","code":null,"explanation":"条件传送把一个「控制依赖」变成「数据依赖」：处理器不必预测跳转方向，避免了分支预测失败的惩罚，这是它的优点。但代价是两条分支的表达式都必须先算出来，如果其中一条计算代价很大（如除法），就会白算；更严重的是若某条分支带副作用（如 `*p` 解引用、函数调用、可能越界的内存访问），把不该执行的分支也执行了就会改变程序语义甚至崩溃。因此当分支体包含有副作用的表达式时，编译器只能生成普通的跳转代码。","tags":["条件传送","分支预测","副作用"],"options":["把条件成立与不成立两种情况的值都提前计算出来，可能增加计算量，而且被计算的那条路径若有副作用就会出错","占用额外的栈空间保存两种情况的临时值","只能用于整数比较，不能用于指针比较","由程序员手工插入，编译器无法自动生成"],"answer":0,"kp":"控制流与条件码"},{"id":"s2025a-30","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"从汇编反推循环代码","type":"fill","difficulty":2,"stem":"根据下面的汇编代码补全 C 代码，`result` 的初值应当是什么？只见数字即可。","code":"loop:\n    movl %esi, %ecx\n    movl $1, %edx\n    movl $0, %eax\n    jmp .L2\n.L3:\n    movq %rdi, %r8\n    andq %rdx, %r8\n    orq %r8, %rax\n    salq %cl, %rdx\n.L2:\n    testq %rdx, %rdx\n    jne .L3\n    rep; ret","explanation":"`movl $0,%eax` 把累加寄存器清零，对应 C 代码中 `long result = 0;`。反推这段汇编的关键是给寄存器建立对应关系：rdi 是参数 x，esi 是参数 n（被搬到 ecx，因为移位量只能用 cl），edx 是 mask 从 1 开始，eax 是 result。循环体 `andq %rdx,%r8` 与 `orq %r8,%rax` 合起来就是 `result |= x & mask`。","tags":["汇编反推 C","循环","寄存器分配"],"options":null,"answer":["0"],"kp":"机器级编程基础"},{"id":"s2025a-31","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"从汇编反推 for 循环结构","type":"single","difficulty":3,"stem":"根据下面的汇编代码补全 C 代码，`for` 语句的三个部分（初始化、判断条件、更新）应当是什么？","code":"loop:\n    movl %esi, %ecx\n    movl $1, %edx\n    movl $0, %eax\n    jmp .L2\n.L3:\n    movq %rdi, %r8\n    andq %rdx, %r8\n    orq %r8, %rax\n    salq %cl, %rdx\n.L2:\n    testq %rdx, %rdx\n    jne .L3\n    rep; ret","explanation":"`movl $1,%edx` 说明 mask 从 1 开始；`.L2` 处 `testq %rdx,%rdx` + `jne .L3`（rdx 非零则继续）说明判断条件是 `mask != 0`；`salq %cl,%rdx` 是把 mask 左移 n 位（cl 中保存的就是参数 n），对应更新式 `mask = mask << n`。移位量来自参数 n 而不是常数 1，所以选项 C 错；判断条件用的是 rdx 自身是否为零，与参数 n 无关，所以选项 D 错。整段代码的作用是把 x 中「下标为 n 的倍数的那些位」收集到 result 里。","tags":["汇编反推 C","for 循环","移位"],"options":["for (mask = 1; mask != 0; mask = mask << n)","for (mask = 0; mask != 0; mask = mask << n)","for (mask = 1; mask != 0; mask = mask << 1)","for (mask = 1; mask != n; mask = mask << n)"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025a-32","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"循环体表达式的还原","type":"single","difficulty":2,"stem":"根据下面的汇编代码补全 C 代码，循环体中的语句 `result |= ______ ;` 应当填什么？","code":"loop:\n    movl %esi, %ecx\n    movl $1, %edx\n    movl $0, %eax\n    jmp .L2\n.L3:\n    movq %rdi, %r8\n    andq %rdx, %r8\n    orq %r8, %rax\n    salq %cl, %rdx\n.L2:\n    testq %rdx, %rdx\n    jne .L3\n    rep; ret","explanation":"循环体先把 `%rdi`（参数 x）搬到临时寄存器 r8，再执行 `andq %rdx,%r8`，即 r8 = x & mask；随后 `orq %r8,%rax` 把 r8 或进 rax，即 result |= r8。两步合并正是 `result |= x & mask`。也可以从语义上验证：mask 每次左移 n 位，只有与 mask 对应的那些位会被 and 保留下来并被 or 收集到 result，最终 result 是 x 中特定位置的位集合，这正是「掩码提取」的写法。","tags":["汇编反推 C","按位与","掩码"],"options":["x & mask","x | mask","x ^ mask","x >> mask"],"answer":0,"kp":"整数与位运算"},{"id":"s2025a-33","source":"2025 第 1 次阶段测验","origin":"exam","lecture":5,"topic":"跳转表间接跳转","type":"fill","difficulty":2,"stem":"下面的跳转表代码中，若执行到 `jmp *.L1(,%rdi,8)` 时 rdi 的值为 2，则该指令会跳转到哪个标号指向的位置？","code":".section .rodata\n.align 8\n.L1:\n    .quad .L11\n    .quad .L12\n    .quad .L13\n    .quad .L14\n    ...\n    jmp *.L1(,%rdi,8)","explanation":"跳转表 .L1 中依次存放 .L11、.L12、.L13、.L14 这四个 8 字节地址（.quad 表示每个表项占 8 字节）。寻址方式 `.L1(,%rdi,8)` 计算 .L1 + rdi*8，rdi = 2 时取到第 3 个表项，即 .L13，于是程序跳转到 .L13 处继续执行。这就是 switch 语句被编译成跳转表时的实现方式，用一次内存间接跳转代替一串比较，代价是必须保证下标在表范围内（编译器通常会先插入边界检查）。","tags":["跳转表","间接跳转","switch"],"options":null,"answer":[".L13","L13"],"kp":"控制流与条件码"},{"id":"gen-c05-01","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"test 指令与 je 跳转","type":"single","difficulty":1,"stem":"执行指令 `testq %rax, %rax` 之后紧跟 `je .L2`。`je .L2` 会在什么条件下发生跳转？","code":null,"explanation":"`testq %rax, %rax` 等价于计算 %rax & %rax，但不写回结果，只设置条件码：当且仅当结果为 0（即 %rax 的每一位都是 0）时 ZF = 1，SF 取结果的符号位。`je` 的条件就是 ZF = 1，所以 %rax == 0 时跳转。选项 B 对应 `js`（SF = 1）；选项 C 没有单一标志直接对应，通常写成 `jg`；选项 D 是常见误解：testq 是对整个 64 位字做按位与，不是在测某一位，如果只想测最低位应该用 `testb $1, %al` 或 `andl $1, %eax`。讲义中 `testq %rax,%rax` 被称为「Very often」的惯用写法，也用于 pcount_r 的终止判断。对应第 5 讲「Condition Codes (Explicit Setting: Test)」与 Jumping 一节。","tags":["test","条件码","跳转"],"options":["%rax 等于 0","%rax 小于 0","%rax 大于 0","%rax 的最低位为 1"],"answer":0,"kp":"控制流与条件码"},{"id":"gen-c05-02","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"cmp 与 seta 的语义","type":"single","difficulty":1,"stem":"设 `%rdi` 中存放 x、`%rsi` 中存放 y。执行 `cmpq %rsi, %rdi` 之后的 `seta %al`，把 %al 置为 1 当且仅当：","code":null,"explanation":"AT&T 语法下 `cmpq Src2, Src1` 计算 Src1 - Src2，本题即 x - y，但只设置条件码而不写回。`seta`（Above）的条件是 ~CF & ~ZF，其中 CF 是无符号减法的借位标志，因此它判断的是无符号意义下的「大于」，答案选 A。选项 B 对应有符号的 `setge`（~ (SF^OF)）；选项 C 对应无符号的 `setb`（CF = 1）；选项 D 对应 `sete`（ZF = 1）。踩坑点有两个：一是 AT&T 的操作数顺序容易读反（若读成 y - x，答案就会反过来）；二是 `a/b` 系列用于无符号、`g/l` 系列用于有符号，混用会让负数比较出错。对应第 5 讲「Reading Condition Codes」中的 SetX 条件表。","tags":["cmp","seta","无符号比较"],"options":["x > y（无符号比较）","x ≥ y（有符号比较）","x < y（无符号比较）","x == y"],"answer":0,"kp":"控制流与条件码"},{"id":"gen-c05-03","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"条件码的精确求值","type":"single","difficulty":2,"stem":"依次执行 `xorq %rax, %rax`（%rax 清零）与 `subq $1, %rax` 之后，条件码 CF、ZF、SF、OF 的值依次是：","code":null,"explanation":"`subq $1, %rax` 计算 0 - 1，结果为 0xFFFFFFFFFFFFFFFF，即补码的 -1。逐位看：ZF 检查结果是否为 0，结果非 0 故 ZF = 0；SF 取结果的最高位，最高位为 1 故 SF = 1；CF 表示无符号减法的借位，被减数 0 小于减数 1，需要借位故 CF = 1；OF 表示有符号溢出，溢出条件是「正减负得负」或「负减正得正」，这里 a = 0 既非正也非负（不满足 a > 0），故 OF = 0。选项 B 把 ZF 弄错（结果并非 0）；选项 C 把 OF 与 SF 判反；选项 D 误认为产生了有符号溢出。把这个结果对照第 5 讲习题表格中 `subq $1, %rax` 一行的「SF CF OF ZF = 1100」即可确认。对应第 5 讲「Condition Codes」四个标志的定义。","tags":["条件码","CF","OF","借位"],"options":["CF=1, ZF=0, SF=1, OF=0","CF=0, ZF=1, SF=1, OF=0","CF=1, ZF=0, SF=0, OF=1","CF=0, ZF=0, SF=1, OF=1"],"answer":0,"kp":"控制流与条件码"},{"id":"gen-c05-04","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"switch 跳转表的范围检查","type":"single","difficulty":3,"stem":"某 `switch` 语句的汇编框架如下（%rdi 存 x，跳转表 `.L4` 中只有 x = 0～6 的 7 个表项）。当 x = -1 时程序会：","code":"cmpq $6, %rdi       # 比较 x 与 6\n    ja   .L8            # 高于则跳转\n    jmp  *.L4(,%rdi,8)  # goto *JTab[x]","explanation":"`cmpq $6, %rdi` 计算 x - 6 并按无符号规则设置条件码。x = -1 的位模式是全 1，作为无符号数是 18446744073709551615，远大于 6，因此无符号减法不需要借位，CF = 0 且结果非 0，ZF = 0；`ja` 的条件 ~CF & ~ZF 成立，于是跳转到 .L8（default 分支）。这正是编译器做「范围检查」的标准技巧：用一条无符号比较就把负数（在无符号视角下极大）和超过上界的值一起挡在跳转表之外，保证后面的 `jmp *.L4(,%rdi,8)` 下标只能是 0～6，不会越界读表。选项 B、C 忽略了负数的无符号解释；选项 D 正是缺少 `ja` 范围检查时才会发生的后果。对应第 5 讲「Switch Statement Example」与「Assembly Setup Explanation」一节。","tags":["switch","跳转表","无符号比较"],"options":["跳转到 default 分支 .L8","跳转到 case 1 对应的代码块","跳转到 case 6 对应的代码块","以负数下标访问跳转表，程序崩溃"],"answer":0,"kp":"控制流与条件码"},{"id":"gen-c05-05","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"条件传送 cmov 的适用条件","type":"single","difficulty":2,"stem":"下列把结果赋给 val 的 C 表达式中，编译器可以安全地改用条件传送指令 `cmov` 来实现的是：","code":null,"explanation":"条件传送的实现方式是「两个分支都算出来，再用条件码挑一个」，所以只有当两个表达式都绝对安全且无副作用时才可以使用。选项 A 中 x-y 与 y-x 都是纯算术运算，不会非法访存也不会改变程序状态，因此编译器一般都编译成 `subq`/`cmovle` 组合（讲义 absdiff 例子）。选项 B 会无条件地解引用 p，若 p 为空就触发段错误，属于 unsafe；选项 C 会同时执行 `x *= 7` 与 `x += 3`，把 x 改坏，属于 illegal（有副作用）；选项 D 会同时调用 f 与 g，副作用重复且代价高，属于 bad performance。motivation 是分支会让流水线停顿，而 cmov 不需要控制转移。对应第 5 讲「Using Conditional Moves」与「Bad Cases for Conditional Move」一节。","tags":["cmov","条件传送","副作用"],"options":["`val = x > y ? x - y : y - x;`","`val = p ? *p : 0;`（p 是可能为空的指针）","`val = x > 0 ? (x *= 7) : (x += 3);`","`val = x > 0 ? f(x) : g(x);`（f、g 是可能带副作用的函数）"],"answer":0,"kp":"控制流与条件码"},{"id":"gen-c05-06","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"条件码与条件指令辨析","type":"multi","difficulty":2,"stem":"关于 x86-64 的条件码、比较与条件传送，下列说法正确的有：","code":null,"explanation":"选项 A 正确：讲义明确指出 `leaq` 不设置条件码，这也是编译器爱用 lea 做算术的原因——不会破坏前面 cmp 建立的条件码。选项 B 错误且正好说反：CF（进位/借位）服务于无符号比较（`ja/jb`），OF（补码溢出）与 SF 一起服务于有符号比较（`jg/jl`）。选项 C 正确：`setX` 只写一个字节，例如 `setg %al`，剩下 7 个字节保持原状，所以讲义提醒要用 `movzbl %al, %eax` 把高位清零后才能当 0/1 使用；同时 set 指令本身不修改条件码。选项 D 正确，见「Bad Cases for Conditional Move」。选项 E 错误：cmp 与 sub 的唯一区别就是 cmp 只设条件码、不写回结果。对应第 5 讲「Condition Codes」与「Reading Condition Codes」两节。","tags":["条件码","setX","cmov","cmp"],"options":["`leaq` 指令不会修改任何条件码","条件码 CF 用于有符号数比较，OF 用于无符号数比较","`setX` 系列指令只写目标寄存器的低 8 位，不影响其余 7 个字节，也不修改条件码","条件传送 `cmov` 会同时计算两个分支的值，因此对可能引起非法访存或副作用的表达式不适用","执行 `cmpq %rsi, %rdi` 会把 %rdi 减 %rsi 的结果写回 %rdi"],"answer":[0,2,3],"kp":"控制流与条件码"},{"id":"gen-c05-07","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"while 循环的两种翻译","type":"judge","difficulty":2,"stem":"把 `while (Test) Body` 翻译成汇编时，「跳转到中间（jump-to-middle）」与「do-while 转换」两种方式实现的控制流语义完全相同，区别只在于第一次条件判断放置的位置不同。","code":null,"explanation":"判断正确。跳转到中间形式先 `goto test`，然后循环标签内是 Body，test 处判断 `if (Test) goto loop;`；do-while 转换形式则先把第一次判断提到最前面 `if (!Test) goto done;`，后面 loop 标签内是 Body，末尾再 `if (Test) goto loop;`。两者对 while 语句的语义完全等价，都不会让 Body 在 Test 为假时执行。差别在效率与来源：当循环「可能一次都不执行」且需要频繁回跳时，do-while 形式能省掉每次迭代末尾的额外无条件跳转，所以 `-O1` 常用它；而 `-Og`（便于调试的优化级别）更常用 jump-to-middle，因为它与源码结构更接近、便于对照。讲义用同一个 pcount_while 函数演示了这两种翻译。对应第 5 讲「General While Translation #1 / #2」两节。","tags":["循环","goto翻译","while"],"options":null,"answer":true,"kp":"控制流与条件码"},{"id":"gen-c05-08","source":"自编 · 第 5 讲","origin":"created","lecture":5,"topic":"setl 与 movzbl 的组合求值","type":"fill","difficulty":3,"stem":"从 `%rax` 初值未知开始，依次执行下列指令后，`%rax` 的值是多少？（用十六进制表示）","code":"xorq   %rax, %rax\n    subq   $1, %rax\n    cmpq   $2, %rax\n    setl   %al\n    movzbl %al, %eax","explanation":"逐步跟踪：`xorq` 后 %rax = 0；`subq $1` 后 %rax = 0xFFFFFFFFFFFFFFFF（即 -1）。`cmpq $2, %rax` 计算 -1 - 2 = -3，只设条件码：结果为负故 SF = 1，结果非 0 故 ZF = 0，无符号下全 1 远大于 2 故不借位 CF = 0，a = -1 为负、b = 2 为正、结果 -3 为负，不满足有符号溢出条件故 OF = 0。`setl` 的条件是 SF ^ OF = 1 ^ 0 = 1，所以它只把 %al 写成 1，其余 7 个字节仍是 0xFF，此刻 %rax = 0xFFFFFFFFFFFFFF01。`movzbl %al, %eax` 把低字节零扩展到 %eax，同时按规则把 %rax 高 32 位清零，最终 %rax = 0x0000000000000001。该结果也验证了有符号比较 -1 < 2 为真。对应第 5 讲习题表格中 `setl %al`、`movzblq %al,%eax` 两行与「32 位指令会清零高 32 位」的说明。","tags":["setl","movzbl","条件码","SF"],"options":null,"answer":["0x1","0x0000000000000001","1"],"kp":"控制流与条件码"},{"id":"f2013-02","source":"2013 期末","origin":"exam","lecture":6,"topic":"x86-64 过程调用的参数传递","type":"single","difficulty":1,"stem":"按照教材描述的原则，对于 x86-64 程序，在 `callq` 指令执行后，函数的第一个参数一般存放在哪里？","code":null,"explanation":"x86-64 用寄存器传参：第 1~6 个整型或指针参数依次放在 %rdi、%rsi、%rdx、%rcx、%r8、%r9，超过 6 个才压栈。callq 只把返回地址压入栈（%rsp 变化 8 字节），并不改变保存参数的寄存器，所以第一个参数仍在 %rdi。8(%rsp) 是压入返回地址后相对于栈顶的位置，是 IA-32 时代“用栈传参”的遗留印象（32 位下第一个参数才在 4(%rsp)/8(%rsp) 附近）；%rax 用于传递返回值；4(%rsp) 既非参数位置也不满足 8 字节对齐。","tags":["x86-64","参数传递","callq"],"options":["8(%rsp)","4(%rsp)","%rax","%rdi"],"answer":3,"kp":"过程调用与栈"},{"id":"f2020-01","source":"2020 期末","origin":"exam","lecture":6,"topic":"栈帧与 %rbp（被调用者保存寄存器）","type":"single","difficulty":2,"stem":"下列关于 x86-64 汇编，说法错误的是：","code":null,"explanation":"C 是错误项：函数栈帧的长度并不一定能在编译时确定。当函数使用 alloca、变长数组，或者编译器选择动态调整栈指针时，帧的大小要在运行时才知道，此时必须借助帧指针 %rbp 来寻址局部变量；在 -O0 下 GCC 默认也仍然把 %rbp 当帧指针用。后半句“%rbp 是被调用者保存的寄存器”是对的，但前半句的因果关系不成立。A 对：程序按 PIE 加载，代码段基址每次运行都可能不同，所以跳转表里存的是相对基址的偏移（或需要重定位的地址），这是教材在讲 switch 时特别强调的。B 对：AT&T 格式的操作数顺序是“源, 目标”，与 Intel 格式相反。D 对：%rbx、%rbp、%r12~%r15 都是被调用者保存（callee-saved）寄存器，过程里若要用就必须先保存、返回前恢复，否则会破坏调用者的状态。踩坑点：不要以为“编译期总能确定帧长”。","tags":["栈帧","帧指针","被调用者保存","AT&T汇编"],"options":["Bomblab 中 bomb 程序的代码段基址每次运行可能不同，因此其 switch 语句跳转表存储的不是目标代码的绝对地址，而是相对于某基址的偏移量。","本门课程主要讲述的是 ATT 格式的汇编，其 mov 等双操作数指令一般以第一个操作数作为源而第二个操作数作为目标，这种操作数顺序通常与 Intel 格式的汇编相反。","函数栈帧的长度在编译时被确定，因此 x86-64 中通用寄存器 %rbp 不会再作为帧指针使用，但 %rbp 依然是被调用者保存的寄存器。","多数同学 Archlab 书写 Y86-64 汇编时，在过程调用中修改了 %rbx 等部分寄存器而未事先保存，且未在过程调用结束时恢复，这种行为在 x86-64 汇编下是不可取的。"],"answer":2,"kp":"机器级编程基础"},{"id":"lab2025-24","source":"2025 Lab 测验","origin":"exam","lecture":6,"topic":"getbuf 的栈帧大小","type":"single","difficulty":3,"stem":"下面是 AttackLab 中 ctarget 目标程序 getbuf 函数的汇编代码。在 `call` 指令（调用 Gets）执行完成后，getbuf 的栈帧大小为多少字节？","code":"0000000000401cb2 <getbuf>:\n  401cb2: f3 0f 1e fa           endbr64\n  401cb6: 48 83 ec 38           sub    $0x38,%rsp\n  401cba: 48 89 e7              mov    %rsp,%rdi\n  401cbd: e8 57 03 00 00        call   402019 <Gets>\n  401cc2: b8 01 00 00 00        mov    $0x1,%eax\n  401cc7: 48 83 c4 38           add    $0x38,%rsp\n  401ccb: c3                    ret","explanation":"getbuf 的栈帧由两部分构成：`sub $0x38,%rsp` 为局部缓冲区分配了 0x38 = 56 字节；在调用 Gets 之前，call 指令已经把返回地址（8 字节）压入栈中。因此此刻从 %rsp 到 getbuf 保存的返回地址之间共有 0x38 + 0x08 = 0x40 = 64 字节，这就是本题所指的栈帧大小。选项中 0x38 只算了局部变量区、0x3C 与 0x44 是干扰值。理解这一点对构造 payload 至关重要：缓冲区首地址到返回地址的偏移正是 56，所以攻击串的前 56 个字节是填充，紧接的 8 个字节会覆盖返回地址。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["栈帧","AttackLab","缓冲区大小"],"options":["0x38 字节","0x3C 字节","0x40 字节","0x44 字节"],"answer":2,"kp":"过程调用与栈"},{"id":"m2012-03","source":"2012 期中","origin":"exam","lecture":6,"topic":"函数返回值与 ret 指令","type":"single","difficulty":1,"stem":"在 x86 汇编中，函数执行结束时返回值是如何传递的？","code":null,"explanation":"x86（IA32）调用约定规定：整型与指针类型的返回值放在 %eax（x86-64 中为 %rax，64 位返回值可用 %rdx:%rax，浮点返回值用 %xmm0）。ret 指令只做「弹出返回地址送 PC」，并不携带返回值，x86 也没有名为 retval 的寄存器，故 A 错；返回值不是靠栈传递的，C、D 描述的栈布局位置都不对。踩坑点：只有超过 6 个（IA32 为超过栈上容量）的参数才用栈传递，返回值一律走寄存器，调用者读完 %eax 后才能再改写它。","tags":["调用约定","返回值","ret"],"options":["ret 指令把它存到一个名为 retval 的特殊寄存器中","按调用约定，整型/指针返回值总是放在 %eax 中","它被存放在被调函数 %ebp 之上的栈中","它被存放在函数所有参数之上的栈中"],"answer":1,"kp":"过程调用与栈"},{"id":"m2012-09","source":"2012 期中","origin":"exam","lecture":6,"topic":"push 指令与栈指针变化","type":"single","difficulty":2,"stem":"%rsp 的当前值是 0xdeadbeefdeadd0d0，执行指令 `pushq %rbx` 之后 %rsp 的值是多少？","code":null,"explanation":"在 x86-64 中 pushq 等价于「先把栈指针减 8，再把 8 字节源操作数写到 (%rsp)」，即 %rsp = %rsp - 8。0xdeadbeefdeadd0d0 - 8 = 0xdeadbeefdeadd0c8，选 D。选项 A、B 是「加」的方向，说明把栈的增长方向记反了（x86 栈向低地址生长）；选项 C 减了 4，是把 pushq 当成了 32 位的 pushl，而在 x86-64 中压栈单位是 8 字节。","tags":["栈","pushq","rsp"],"options":["0xdeadbeefdeadd0d4","0xdeadbeefdeadd0d8","0xdeadbeefdeadd0cc","0xdeadbeefdeadd0c8"],"answer":3,"kp":"数据布局与对齐"},{"id":"m2017-06","source":"2017 期中","origin":"exam","lecture":6,"topic":"函数指针与间接调用","type":"multi","difficulty":3,"stem":"有如下代码段（`p` 是指向函数 `func` 的函数指针），下列 x86-64 过程调用指令中正确的有（官方答案说明 A、D 都可以，故按多选处理）：","code":"int func(int x, int y);\nint (*p) (int a, int b);\np = func;\np(0, 0);","explanation":"通过函数指针调用要用**间接调用**：先把函数地址装入寄存器（如 %rax），再写 `call *%rax`；call 的操作数若写成寄存器或内存形式，必须加 `*` 表示「取该处存放的内容作为跳转目标」，因此 A 正确，B、C 都不合法（缺少 `*` 时汇编器会把它当作别的寻址语义，均不是函数指针调用）。D 也正确：编译器完全可能把指针变量优化掉，识别出 `p(0,0)` 就是对已知函数 func 的调用，从而生成直接调用 `call func`——官方答案注明 -O0 下得到 A、-Og 下得到 D，两者都对。踩坑点：①间接调用的 `*` 不能省；②「源码里出现函数指针」并不等于「机器码里必须出现间接调用」。","tags":["函数指针","间接调用","过程调用"],"options":["call *%rax","call (%rax)","call *(%rax)","call func"],"answer":[0,3],"kp":"数据布局与对齐"},{"id":"m2019-05","source":"2019 期中","origin":"exam","lecture":6,"topic":"第 7 个及以后参数的栈上位置","type":"single","difficulty":3,"stem":"已知函数 func 的参数超过 6 个。当 x86-64 机器执行完指令 `call func` 之后，%rsp 的值为 S。那么 func 的第 k 个参数（k > 6）的存储地址是：","code":null,"explanation":"x86-64 规定前 6 个整型/指针参数依次放在 %rdi、%rsi、%rdx、%rcx、%r8、%r9，第 7 个及以后的参数**从右向左压栈**。执行完 call 之后，%rsp = S 处存放的是 call 压入的**返回地址**（8 字节）；再往高地址走，S+8 是第 7 个参数、S+16 是第 8 个……即第 k 个参数位于 S + 8*(k-7) + 8 = S + 8*(k-6)，选 A。B 漏掉了返回地址上方属于第 7 个参数的那一格（会指向第 k-1 个参数）；C、D 方向反了——参数在返回地址的**高地址**一侧。踩坑点：跨越 call 之后必须先跳过 8 字节返回地址。","tags":["x86-64 栈帧","参数传递","返回地址"],"options":["S + 8*(k-6)","S + 8*(k-7)","S - 8*(k-6)","S - 8*(k-7)"],"answer":0,"kp":"过程调用与栈"},{"id":"m2019-08","source":"2019 期中","origin":"exam","lecture":6,"topic":"栈帧长度在编译期确定","type":"single","difficulty":1,"stem":"大多数过程的栈帧是____的，其长度在____时确定。（注：此处的「编译」指从高级语言转化为汇编语言的过程）","code":null,"explanation":"大多数过程的栈帧是**定长**的：过程入口用一条 `subq $N, %rsp` 一次性分配，N 由编译器在**编译**阶段就计算好并作为常数写进汇编代码（例如 subq $0x50, %rsp），汇编器只是照抄这个常数、并不做布局决策，所以第二个空不能填「汇编」。少数情况栈帧可变长（如 alloca、变长数组 VLA），但那不是「大多数过程」。故选 A。踩坑点：不要把「汇编器生成机器码」误认为「帧长在汇编阶段才确定」；另外栈帧在**运行**时才真正分配，但它的**长度**早在编译期就定了。","tags":["栈帧","编译期确定","subq %rsp"],"options":["定长，编译","定长，汇编","可变长，汇编","可变长，运行"],"answer":0,"kp":"过程调用与栈"},{"id":"m2020-04","source":"2020 期中","origin":"exam","lecture":6,"topic":"过程调用与栈帧的分配释放","type":"single","difficulty":1,"stem":"下列关于 x86-64 过程调用的叙述中，哪一个是不正确的？","code":null,"explanation":"C 不正确，为本题答案：被调用函数确实要在栈上为局部变量分配空间，但在返回之前必须释放这些空间——典型做法是用 leave（等价于 mov %rbp,%rsp; pop %rbp）或直接调整 %rsp，否则栈指针不会回到调用前的位置，栈会不断增长。A 正确：每次递归调用都要新建一个栈帧，深度越大空间开销越大。B 正确：x86-64 约定前 6 个整型/指针参数通过寄存器传递。D 正确：call 压入的返回地址就是调用函数中 call 的下一条指令的地址。踩坑点：栈帧的分配与释放在每一次调用中都是配对的。","tags":["过程调用","栈帧","leave"],"options":["每次递归调用都会生成一个新的栈帧，空间开销大","当传递给被调用函数的参数少于 6 个时，可以通过通用寄存器传递","被调用函数要为局部变量分配空间，返回时无需释放这些空间","过程调用返回时，向程序计数器中推送的地址是调用函数中调用指令的下一条指令的地址"],"answer":2,"kp":"过程调用与栈"},{"id":"m2021-05","source":"2021 期中","origin":"exam","lecture":6,"topic":"x86-64 栈的方向与保护","type":"single","difficulty":1,"stem":"在 x86-64 机器上，有关栈的描述中，说法不正确的是：","code":null,"explanation":"C 错误，为本题答案：x86-64 的栈是向下（由高地址向低地址）增长的，push 使 %rsp 减小，pop 使 %rsp 增大。A 正确：通过栈传递的参数都会按 8 字节对齐存放，以便按统一方式寻址。B 正确：一旦对局部变量取地址（&），编译器就必须给它分配栈上的位置，不能让它一直留在寄存器里。D 正确：栈保护机制在栈帧中放置金丝雀值，函数返回前检查它是否被改写，从而检测缓冲区溢出。踩坑点：栈增长方向是固定考点，记住“push 让 rsp 减 8”。","tags":["栈","栈帧","金丝雀"],"options":["通过栈传递参数时，所有的数据大小都向 8 的倍数对齐。","对一个局部变量使用地址运算符 '&'，它的地址可以被放在栈上。","栈是向上增长（由低地址向高地址增长）的。","为了保护返回地址不被破坏，通常会在栈中设置金丝雀值（stack canary）。"],"answer":2,"kp":"机器级编程基础"},{"id":"m2023-07","source":"2023 期中","origin":"exam","lecture":6,"topic":"call 指令的语义","type":"single","difficulty":1,"stem":"考虑在 x86-64 + Linux 情景，在使用 call 指令进行过程/函数调用时，计算机会做如下哪一条描述的事情：","code":null,"explanation":"call 的语义是：把 call 的下一条指令的地址（返回地址）压入栈中，再把 PC 置为被调用过程的起始地址。A 正确。B、D 错在把返回地址放进 %rsp——%rsp 仅仅是栈指针，返回地址是存放在栈内存中的。C 错在压入的是 call 指令自身的地址，那样 ret 会回到 call 自己造成死循环。踩坑点：返回地址是“call 的下一条指令地址”，不是 call 的地址。","tags":["call","返回地址","过程调用"],"options":["将此 call 指令的下一条指令的地址放入栈中","将此 call 指令的下一条指令的地址放入 %rsp 寄存器中","将此 call 指令的地址放入栈中","将此 call 指令的地址放入 %rsp 寄存器中"],"answer":0,"kp":"过程调用与栈"},{"id":"m2023-26","source":"2023 期中","origin":"exam","lecture":6,"topic":"被调用者保存寄存器的栈操作","type":"fill","difficulty":2,"stem":"下面给出 ncr 函数汇编代码的序言与尾声片段（地址与机器码已省略），其中 `push __(6)__` 处应当填写哪个寄存器？","code":"ncr:\n    endbr64\n    push     %rbp\n    mov      %rsp,%rbp\n    push     __(6)__\n    sub      $0x18,%rsp\n    ...\n    call     1149 <ncr>\n    mov      %eax,%ebx\n    ...\n    mov      -0x8(%rbp),%rbx\n    leave\n    ret","explanation":"函数先 push %rbp 建立帧，紧接着又压栈保存一个寄存器，并在返回前用 mov -0x8(%rbp),%rbx 从栈中恢复，说明被保存的正是 %rbx。原因是 %rbx 属于被调用者保存寄存器（%rbx、%rbp、%r12~%r15），而 ncr 需要把第一次递归调用的结果暂存在 %ebx 中（汇编里的 mov %eax,%ebx），如果不先保存并恢复，就会破坏调用者的 %rbx。踩坑点：凡是看到“push 之后由 mov -0x8(%rbp),%rbx 恢复”的固定模式，填的就是 %rbx；调用者保存寄存器（如 %rax、%rdi）不需要这样处理。","tags":["被调用者保存","栈帧","递归"],"options":null,"answer":["%rbx","rbx"],"kp":"过程调用与栈"},{"id":"m2024-05","source":"2024 期中","origin":"exam","lecture":6,"topic":"x86-64 栈帧与参数传递","type":"single","difficulty":2,"stem":"下述关于 x86-64 的栈结构说法错误的是：","code":null,"explanation":"C 错误，为本题答案：参数 7 及以后的参数放在调用者的参数构造区（栈）中，压栈顺序是从最后一个参数开始向前压，也就是参数 8、参数 7……依次入栈，因此参数 7 是最后压栈的（它在栈中地址最低、离栈顶最近），说“参数 7 最先压栈”正好说反了。A 正确：%rbp、%rbx、%r12~%r15 属于被调用者保存寄存器，被调用者若要修改必须先保存、返回前恢复。B 正确：call 把返回地址压到（调用者的）栈上，所以返回地址位于调用者的栈帧中，被调用者看到的它在自己帧顶之上。D 正确：call 的语义就是压入下一条指令的地址（返回地址）并把 PC 置为目标地址。","tags":["栈帧","调用约定","call 指令"],"options":["被调用者保存寄存器包括：%rbp %rbx %r12 %r13 %r14 %r15","过程的返回地址属于调用者的帧栈","过程传参时，参数 1~6 通过寄存器传递，在参数构造区中存放其他参数，其中，参数 7 最先压栈","call 指令的执行过程是：先将下一条指令的地址压栈，随后将 PC 设为目标地址"],"answer":2,"kp":"过程调用与栈"},{"id":"m2024-23","source":"2024 期中","origin":"exam","lecture":6,"topic":"递归函数对字符串的处理结果","type":"fill","difficulty":2,"stem":"阅读下面的函数 foo。若 main 函数调用 foo 并传入指向字符串 \"ILOVEICS\" 的指针，则调用结束后该字符串的内容是什么？","code":"void foo(char *p)\n{\n    int len = strlen(p);\n    char tmp = *p;\n    *p = *(p + len - 1);\n    *(p + len - 1) = '\\0';\n    if (strlen(p + 1) > 1)\n    {\n        foo(p + 1);\n    }\n    *(p + len - 1) = tmp;\n}","explanation":"foo 每次把区间首字符与末字符交换、把末字符位置临时置 '\\0'，再对 p+1 所指的子串递归（子串长度仍大于 1 才继续），返回前把末位恢复为先前保存的首字符。跟踪 \"ILOVEICS\"（下标 0~7）：第一层交换 I 与 S，剩下 \"LOVEIC\" 继续递归；第二层交换 L 与 C，剩下 \"OVEI\" 继续递归；第三层交换 O 与 I，剩下 \"VE\" 继续递归；第四层交换 V 与 E，此时内层子串长度为 0，停止递归并恢复。逐层恢复后最终字符串为 \"SCIEVOLI\"，也就是原字符串被原地反转。踩坑点：递归处理的只是去掉首尾后的子串，边界条件 strlen(p+1) > 1 保证最后一层不再递归。","tags":["递归","字符串","栈帧"],"options":null,"answer":["SCIEVOLI"],"kp":"过程调用与栈"},{"id":"m2024-24","source":"2024 期中","origin":"exam","lecture":6,"topic":"递归深度与栈帧数量","type":"fill","difficulty":3,"stem":"阅读下面的函数 foo。若 main 函数调用 foo 并传入指向字符串 \"ICS2024\" 的指针，且程序中其他地方不再调用 foo，则 main 调用 foo 期间，栈中最多同时存在几个 foo 函数的帧？","code":"void foo(char *p)\n{\n    int len = strlen(p);\n    char tmp = *p;\n    *p = *(p + len - 1);\n    *(p + len - 1) = '\\0';\n    if (strlen(p + 1) > 1)\n    {\n        foo(p + 1);\n    }\n    *(p + len - 1) = tmp;\n}","explanation":"foo 把首尾字符交换并把末位置 '\\0'，然后考察内层子串 p+1：长度大于 1 才递归。对 \"ICS2024\"：第一层调用后 p+1 指向 \"CS202\"（长度 5 > 1）发生递归；第二层后 p+1 指向 \"S20\"（长度 3 > 1）再递归；第三层把 S 与 0 交换后 p+1 指向 \"2\"（长度 1，不满足 > 1）不再递归，于是开始逐层返回。递归深度为 3，每一层都有自己的栈帧，所以栈中最多同时存在 3 个 foo 帧。踩坑点：忘了最后一层虽然不再递归但它的帧依然存在，会数成 2；把字符串结束符 '\\0' 也算作字符则会多算一层。","tags":["递归","栈帧","函数调用"],"options":null,"answer":["3"],"kp":"过程调用与栈"},{"id":"s2025a-34","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"popq 指令的执行步骤","type":"fill","difficulty":2,"stem":"x86-64 中执行 `popq %rbx` 的操作依次为如下步骤：先从某个寄存器中读出数据 x，以 x 为地址读出对应内存中的数据 y。这个被读出的寄存器是哪个？","code":null,"explanation":"popq 的第一步总是读栈指针 %rsp，把它当作内存地址去访问栈顶；随后把 %rsp 加 8（栈向低地址增长，弹出时指针上移），最后把读到的数据写入目的寄存器 %rbx。这与 pushq 恰好相反：pushq 先把 %rsp 减 8，再把数据写到新的栈顶。理解这两条指令的「先算地址后改指针」顺序，是分析过程调用中栈帧变化的基础。","tags":["popq","栈指针","过程调用"],"options":null,"answer":["%rsp","rsp"],"kp":"机器级编程基础"},{"id":"s2025a-35","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"popq 对栈指针的修改","type":"fill","difficulty":1,"stem":"x86-64 中执行 `popq %rbx`，在从 %rsp 指向的内存中读出数据之后，%rsp 应当加多少？请填十进制数字。","code":null,"explanation":"popq 弹出的是一个 64 位（8 字节）数据，所以栈指针要加 8。因为 x86-64 的栈是满递减栈（向低地址方向增长，%rsp 始终指向栈顶的有效数据），弹出时指针向高地址移动。若写成 `popl` 则是 32 位数据，但本题是 popq，答案是 8，不要与 4 混淆。","tags":["popq","栈指针","8 字节"],"options":null,"answer":["8","加 8","+8","加8"],"kp":"数据布局与对齐"},{"id":"s2025a-36","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"popq 的目的寄存器","type":"fill","difficulty":1,"stem":"x86-64 中执行 `popq %rbx`，从栈中读出的数据 y 最终被存到哪个寄存器中？","code":null,"explanation":"popq 的目的操作数就是数据要去的寄存器，本题是 %rbx。这条指令常出现在函数开头/结尾：被调用者保存寄存器（如 %rbx、%rbp、%r12~%r15）若在过程内被使用，就要先 pushq 保存、返回前 popq 恢复。例如 multstore 函数里 `push %rbx` 与 `pop %rbx` 成对出现，目的正是保护 %rbx 中保存的 dest 指针不被被调用函数破坏。","tags":["popq","被调用者保存","栈帧"],"options":null,"answer":["%rbx","rbx"],"kp":"机器级编程基础"},{"id":"s2025a-37","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"call 指令对栈指针与返回地址的影响","type":"fill","difficulty":2,"stem":"下面是 multstore 与 mult2 的 C 代码和汇编代码。假设准备执行地址 400644 处的 `callq` 指令时 %rsp 的内容为 0x110，那么执行完该 callq 指令后 %rsp 的内容是多少？请用十六进制表示。","code":"void multstore(long x, long y, long *dest)\n{\n    long t = mult2(x, y);\n    *dest = t;\n}\n\n0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq\n\nlong mult2(long a, long b)\n{\n    long s = a * b;\n    return s;\n}\n\n0000000000400650 <mult2>:\n  400650: mov    %rdi,%rax\n  400653: imul   %rsi,%rax\n  400657: retq","explanation":"callq 指令在跳转之前会先把「下一条指令的地址」压栈，压入的是 8 个字节，所以 %rsp 从 0x110 减到 0x108。这里压入的返回地址就是 callq 的下一条指令地址 0x400649。注意 push 与 call 都会改变 %rsp，计算栈指针时要把每条这类指令都算进去，本题中 400640 的 push 已经让栈指针减过 8（题目给的是执行 callq 之前的 0x110，因此不必再管 push）。","tags":["call","返回地址","栈指针"],"options":null,"answer":["0x108","108"],"kp":"过程调用与栈"},{"id":"s2025a-38","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"call 压栈的返回地址内容","type":"fill","difficulty":2,"stem":"承接上面的 multstore/mult2 汇编代码。执行完地址 400644 处的 `callq` 之后，%rsp 所指向的内存中存放的数值是多少？请用十六进制表示。","code":"void multstore(long x, long y, long *dest)\n{\n    long t = mult2(x, y);\n    *dest = t;\n}\n\n0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq\n\n0000000000400650 <mult2>:\n  400650: mov    %rdi,%rax\n  400653: imul   %rsi,%rax\n  400657: retq","explanation":"callq 压入的是「返回地址」，即紧随 callq 之后那条指令的地址。地址 400644 处的 callq 占 5 个字节，下一条指令在 400649，所以栈顶存放的就是 0x400649。函数执行完 retq 时，CPU 会从这个位置取出地址并跳回去，从而回到调用点继续执行 `mov %rax,(%rbx)`。把这两条小题连起来看，就是「调用—返回」的完整栈操作链条。","tags":["call","返回地址","栈"],"options":null,"answer":["0x400649","400649"],"kp":"过程调用与栈"},{"id":"s2025a-39","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"ret 指令对栈指针的影响","type":"fill","difficulty":2,"stem":"承接上面的 multstore/mult2 汇编代码。随后执行完地址 400657 处的 `retq` 指令后，%rsp 的内容是多少？请用十六进制表示。","code":"0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq\n\n0000000000400650 <mult2>:\n  400650: mov    %rdi,%rax\n  400653: imul   %rsi,%rax\n  400657: retq","explanation":"retq 的操作是「从栈顶弹出返回地址，并把 %rsp 加 8」，然后跳转到该地址。mult2 内部没有改动 %rsp（两条 mov/imul 都不涉及栈），所以 400657 的 retq 执行后 %rsp 从 0x108 恢复到 0x110，与执行 callq 之前的值相同。也就是说 call 与 ret 在栈上的作用是互相抵消的：call 减 8 并写返回地址，ret 读返回地址并加 8，函数调用前后栈指针必须守恒（除非使用栈帧或栈上局部变量）。","tags":["ret","栈指针","过程调用"],"options":null,"answer":["0x110","110"],"kp":"过程调用与栈"},{"id":"s2025a-40","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"寄存器传参约定","type":"single","difficulty":2,"stem":"对于上面的 multstore/mult2 代码，C 代码中的变量 x、y、a、b、s 分别保存在哪个寄存器中？","code":"void multstore(long x, long y, long *dest)\n{\n    long t = mult2(x, y);\n    *dest = t;\n}\n\nlong mult2(long a, long b)\n{\n    long s = a * b;\n    return s;\n}\n\n0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq\n\n0000000000400650 <mult2>:\n  400650: mov    %rdi,%rax\n  400653: imul   %rsi,%rax\n  400657: retq","explanation":"x86-64 System V 约定：整数/指针参数按顺序放入 %rdi、%rsi、%rdx、%rcx、%r8、%r9，返回值放入 %rax。multstore 的参数是 (x, y, dest)，所以 x 在 %rdi、y 在 %rsi、dest 在 %rdx（代码中 `mov %rdx,%rbx` 把 dest 存进被调用者保存寄存器正是为此）；mult2 的参数重新从 %rdi、%rsi 开始编号，所以 a 在 %rdi、b 在 %rsi。函数内的局部变量 s 是纯中间结果，编译器直接用返回寄存器 %rax 承载。","tags":["调用约定","参数传递","寄存器"],"options":["x:%rdi  y:%rsi  a:%rdi  b:%rsi  s:%rax","x:%rdi  y:%rsi  a:%rsi  b:%rdi  s:%rax","x:%rsi  y:%rdi  a:%rdi  b:%rsi  s:%rdx","x:%rdi  y:%rdx  a:%rdi  b:%rsi  s:%rax"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025a-41","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"被调用者保存寄存器的保护机制","type":"single","difficulty":2,"stem":"汇编代码中，地址 400641 的指令修改了 %rbx，地址 400649 的指令又使用了 %rbx，而二者中间隔着一条过程调用 `callq mult2`。是什么机制保证了 %rbx 不会被 mult2 修改？","code":"0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq","explanation":"x86-64 的 ABI 把通用寄存器分为两类：调用者保存（caller-saved，如 %rax、%rdi~%r9、%r10、%r11，被调用者可以随意改，调用者若要保留必须自己先存）和被调用者保存（callee-saved，如 %rbx、%rbp、%r12~%r15，被调用者若要用必须先保存、返回前恢复）。%rbx 属于后者，所以 mult2 即使使用了它，也有义务恢复原值；multstore 正是据此在开头 `push %rbx`、结尾 `pop %rbx`，安全地把 dest 指针寄存在这里跨越调用。选项 D 的说法不可靠：保护不能依赖「恰好没用到」，那是脆弱的巧合。","tags":["ABI","被调用者保存","寄存器约定"],"options":["%rbx 是被调用者保存（callee-saved）寄存器，ABI 规定被调用者若要用它就必须先保存、并在返回前恢复原值","%rbx 是调用者保存寄存器，调用者在 call 之前会自动保存它","call 指令会由硬件自动保存全部通用寄存器的值","因为 mult2 函数里根本没有用到 %rbx，所以不会被修改"],"answer":0,"kp":"过程调用与栈"},{"id":"s2025a-42","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"参数求值顺序与调用前的准备","type":"single","difficulty":3,"stem":"如果把 multstore 中的 `mult2(x, y)` 改为 `mult2(y, x)`，汇编代码会有什么变化？","code":"void multstore(long x, long y, long *dest)\n{\n    long t = mult2(x, y);\n    *dest = t;\n}\n\n0000000000400640 <multstore>:\n  400640: push   %rbx\n  400641: mov    %rdx,%rbx\n  400644: callq  400650 <mult2>\n  400649: mov    %rax,(%rbx)\n  40064c: pop    %rbx\n  40064d: retq","explanation":"参数传递靠寄存器，a 取 %rdi、b 取 %rsi。原调用中 x 在 %rdi、y 在 %rsi；改成 mult2(y,x) 后第一个参数变成 y，就必须让 %rsi 的值进入 %rdi、%rdi 的值进入 %rsi，即交换这两个寄存器。注意：虽然乘法交换律保证计算结果不变，但编译器一般不做这种「语义等价」级别的跨调用优化（这属于第 14 讲的过程调用限制），而且调用约定本身要求实参必须放在正确的寄存器里，否则任何函数（不止乘法）都会出错。","tags":["参数传递","调用约定","编译器优化限制"],"options":["需要在 call 之前交换 %rdi 与 %rsi 的内容","不需要任何改动，因为乘法满足交换律","需要交换 %rax 与 %rdx 的内容","需要在 call 返回之后再交换 %rdi 与 %rsi 的内容"],"answer":0,"kp":"过程调用与栈"},{"id":"s2025a-43","source":"2025 第 1 次阶段测验","origin":"exam","lecture":6,"topic":"变量存放位置：寄存器还是内存","type":"single","difficulty":3,"stem":"考虑下面的 C 语言代码（注：考卷中 `bit_not1` 内误写作 `~p`，此处已按题意更正为 `~a`）。下列变量分别存放在寄存器还是内存中？","code":"long bit_not1(long a) {\n    long x = ~a;\n    return x;\n}\n\nlong bit_not2(long *p) {\n    long x = *p;\n    long y = ~x;\n    return y;\n}\n\nlong call_bitnot() {\n    long v0 = 1010;\n    long v1 = 1010;\n    long v2 = bit_not1(v0);\n    long v3 = bit_not2(&v1);\n    return v2 + v3;\n}","explanation":"判断规则很简单：**只要变量的地址被取过（出现在 & 运算中），编译器就必须给它分配内存**，否则可以放在寄存器里。这里 v1 被 `&v1` 取地址传给 bit_not2，因此必须驻留内存；v0 从未被取地址，可以一直待在寄存器里；v2、v3 分别是两次函数调用的返回值（在 %rax 中），随后直接参与加法并返回，也不需要落地到内存。这类「地址被取用」的变量也叫 address-taken 变量，它的存在会显著增加访存指令和栈帧空间。","tags":["寄存器分配","取地址","局部变量"],"options":["v0:寄存器  v1:内存  v2:寄存器  v3:寄存器","v0:内存  v1:内存  v2:寄存器  v3:内存","v0:寄存器  v1:寄存器  v2:内存  v3:寄存器","v0:内存  v1:寄存器  v2:寄存器  v3:内存"],"answer":0,"kp":"机器级编程基础"},{"id":"gen-c06-01","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"参数传递：6 寄存器 + 栈","type":"single","difficulty":1,"stem":"在 x86-64 Linux 调用约定下，函数 `void f(long a1, long a2, ..., long a8)` 的第 7 个参数 a7 通过什么方式传递？","code":null,"explanation":"x86-64 约定用 6 个通用寄存器依次传递前 6 个整型/指针参数：%rdi、%rsi、%rdx、%rcx、%r8、%r9。第 7 个及之后的参数只能通过栈传递：调用者在自己的栈帧中留出「参数构造区（argument build）」，把 a7 写在返回地址之上的位置，被调用者用 8(%rsp)、16(%rsp) 去取。选项 A %r9 是第 6 个参数 a6 的寄存器；选项 C %rcx 是第 4 个参数 a4；选项 D %rax 用于返回返回值，不用于传参。讲义在「Procedure Data Flow」中画出了这 6 个参数寄存器和栈上的 Arg7、Arg8、…、Argn。对应第 6 讲参数传递一节。","tags":["参数传递","寄存器","栈"],"options":["%r9 寄存器","栈（由调用者在自己的栈帧中分配空间）","%rcx 寄存器","%rax 寄存器"],"answer":1,"kp":"机器级编程基础"},{"id":"gen-c06-02","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"call 指令的语义","type":"single","difficulty":1,"stem":"处理器执行 `call label` 指令时，实际完成的操作是：","code":null,"explanation":"`call label` 分两步：先把返回地址（即 call 之后紧跟的那条指令的地址）压入栈顶，%rsp 减 8；再把控制转移到 label。与它配对的 `ret` 从栈顶弹出这个地址并跳转回去，所以成对的 call/ret 不会改变 %rsp 的净值，栈也因此天然支持递归。选项 A 混淆了「被调用者入口地址」与「返回地址」；选项 C 把 %rbp 压栈是函数序言（frame pointer 设置）常见的可选动作，不是 call 的语义；选项 D 完全不对，返回地址是代码地址而不是指令内容。讲义 Control Flow Example 明确显示 call 使 %rsp 由 0x120 变为 0x118，栈中写入 0x400549。对应第 6 讲「Procedure Control Flow」一节。","tags":["call","返回地址","栈"],"options":["把 label 的地址压入栈，然后跳到 label","把 call 之后那条指令的地址压入栈，然后跳到 label 执行","把 %rbp 的当前值压入栈，然后跳到 label","把 label 处的指令机器码压入栈，然后跳转"],"answer":1,"kp":"过程调用与栈"},{"id":"gen-c06-03","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"被调用者保存寄存器","type":"single","difficulty":2,"stem":"下列 x86-64 寄存器中，属于「被调用者保存（callee-saved）」寄存器的是：","code":null,"explanation":"x86-64 Linux 的被调用者保存寄存器是 %rbx、%rbp、%r12～%r15：被调用者如果要用它们，必须先把原值保存在自己的栈帧里，返回前恢复原值，这样调用者才能放心地跨 call 使用它们。%rax 是返回值寄存器且属于调用者保存；%rdi～%r9 用于传参，也是调用者保存；%r10、%r11 同样是调用者保存的临时寄存器。所以只有 %rbx 正确。讲义用 call_incr2 展示：需要把 x 跨 call 保活时，编译器选择 `movq %rdi, %rbx` 并配以 `pushq %rbx` / `popq %rbx`，而不是使用调用者保存的寄存器。对应第 6 讲「x86-64 Linux Register Usage #1/#2」两节。","tags":["callee-saved","寄存器约定","%rbx"],"options":["%rax","%rbx","%rdi","%r10"],"answer":1,"kp":"过程调用与栈"},{"id":"gen-c06-04","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"递归函数的寄存器保存","type":"single","difficulty":3,"stem":"下面是递归求二进制中 1 的个数的函数及其汇编。其中 `pushq %rbx`（以及结尾的 `popq %rbx`）的作用是：","code":"long pcount_r(unsigned long x) {\n    if (x == 0)\n        return 0;\n    else\n        return (x & 1) + pcount_r(x >> 1);\n}\n\npcount_r:\n    movl  $0, %eax\n    testq %rdi, %rdi\n    je    .L6\n    pushq %rbx\n    movq  %rdi, %rbx\n    andl  $1, %ebx\n    shrq  %rdi\n    call  pcount_r\n    addq  %rbx, %rax\n    popq  %rbx\n.L6:\n    rep; ret","explanation":"`andl $1, %ebx` 把 (x & 1) 放进 %rbx，但紧接着就要 `call pcount_r`。递归调用（以及它内部的每一层）会反复改写 %rax、%rdx、%rcx 等调用者保存寄存器，只有 %rbx 这类被调用者保存寄存器保证跨调用存活，因此编译器先把 %rbx 的原值压栈保存，把 (x&1) 放在其中，等 `call` 返回后用 `addq %rbx, %rax` 累加，最后 `popq %rbx` 恢复调用者的值。选项 B 错：递归参数是 `shrq %rdi` 之后的 %rdi，与 %rbx 无关；选项 C 错：返回地址由 call 指令自动压入，不需要手工保存；选项 D 错：该函数没有数组或需要大块空间的局部变量。这也正是「每个调用实例都有私有栈帧、寄存器保存约定防止调用之间互相破坏」的体现。对应第 6 讲「Recursive Function pcount_r」与「Register Saving Conventions」一节。","tags":["递归","callee-saved","栈帧"],"options":["把本次调用算出的 (x & 1) 保存在被调用者保存寄存器 %rbx 中，使它在递归调用返回后仍然有效","把递归调用的参数 x >> 1 压栈，供被调用者取用","保存返回地址，供 ret 指令使用","为函数中的局部数组分配栈空间"],"answer":0,"kp":"过程调用与栈"},{"id":"gen-c06-05","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"栈结构与栈帧内容","type":"multi","difficulty":2,"stem":"关于 x86-64 的过程栈，下列说法正确的有：","code":null,"explanation":"选项 A 正确：call 先压返回地址（%rsp -= 8）再跳转。选项 B 正确：栈从高地址向低地址增长，%rsp 保存的始终是最低（即栈顶）地址。选项 C 正确：进入被调用者时 (%rsp) 是返回地址，再往上依次是 a7、a8、…，所以第 7 个参数在 8(%rsp)、第 8 个在 16(%rsp)，地址都比返回地址高。选项 D 错误：`pushq` 的语义就是「%rsp 减 8，再把值写到 %rsp 处」，它一定会修改 %rsp；选项 E 错误：%rbx 是被调用者保存寄存器，被调用者必须在使用前保存原值、返回前恢复，否则会破坏调用者的数据。讲义中 call_incr2 的 `pushq %rbx`/`popq %rbx` 正是这一约定的实例。对应第 6 讲「x86-64 Stack: Push/Pop」与「x86-64/Linux Stack Frame」一节。","tags":["栈帧","push/pop","参数传递"],"options":["`call` 指令把返回地址压入栈，%rsp 因此减小 8","栈向低地址方向增长，%rsp 始终指向当前栈顶元素","第 7 个及之后的整型参数通过栈传递，它们的地址高于返回地址所在的位置","`pushq %rbx` 只是把 %rbx 的值写入栈，不会改变 %rsp","被调用者如果使用 %rbx 保存了数据，返回前不必恢复它"],"answer":[0,1,2],"kp":"过程调用与栈"},{"id":"gen-c06-06","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"过程机制与调用约定","type":"multi","difficulty":2,"stem":"关于 x86-64 过程调用机制的下列说法，正确的有：","code":null,"explanation":"选项 A、B 是 ABI 的基本约定：6 个参数寄存器加 %rax 返回值，讲义「Procedure Data Flow」图中标注得非常清楚。选项 C 正确：%rsp 被单独列为「Special form of callee save」，函数退出时栈指针必须恢复到进入时的值，否则调用者无法继续使用自己的栈帧；讲义中所有函数都以 `addq $16, %rsp`、`popq` 之类的指令收尾正是为此。选项 D 错误：浮点数参数放在 %xmm0、%xmm1、… 寄存器中，返回值放在 %xmm0，整型寄存器与 SIMD 寄存器是两套通道（第 7 讲浮点部分）。选项 E 错误：栈帧正是为了让每个调用实例拥有私有的参数、局部变量和保存的寄存器，递归与相互递归都能被常规调用约定自然支持，完全不需要改用全局变量。对应第 6 讲「Procedure Data Flow」「x86-64 Linux Register Usage」与「Observations About Recursion」三节。","tags":["调用约定","参数寄存器","%rsp","递归"],"options":["前 6 个整型/指针参数依次用 %rdi、%rsi、%rdx、%rcx、%r8、%r9 传递","函数的返回值通过 %rax 返回给调用者","%rsp 属于一种特殊的被调用者保存状态：函数返回时它必须恢复到调用前的值","浮点参数也用 %rdi 等通用寄存器传递","因为递归会覆盖栈帧，递归函数必须把局部状态放到全局变量中"],"answer":[0,1,2],"kp":"机器级编程基础"},{"id":"gen-c06-07","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"调用者保存寄存器","type":"judge","difficulty":2,"stem":"在 x86-64 Linux 调用约定中，%rax、%rdi～%r9、%r10、%r11 属于调用者保存（caller-saved）寄存器，被调用者可以随意修改它们而不必在返回前恢复。","code":null,"explanation":"判断正确。调用者保存（也叫 caller-saved 或 volatile）寄存器包括：%rax（返回值，也是临时寄存器）、%rdi/%rsi/%rdx/%rcx/%r8/%r9（传参）、%r10/%r11（临时）。约定是「谁想跨 call 保留其中的值，谁就自己负责保存」——也就是调用者必须在 call 之前把需要保留的值存到自己的栈帧里，而被调用者可以放心地把它们当作草稿纸使用，不需要恢复。与之相对，%rbx、%rbp、%r12～%r15 是被调用者保存，被调用者用了就必须恢复。讲义用 `yoo` 调用 `who` 时 %rdx 被 `who` 覆盖的例子说明为什么需要这套约定。踩坑点：不要以为「没被显式保存」是编译器的 bug，这正是 ABI 分工的结果。对应第 6 讲「Register Saving Conventions」与「x86-64 Linux Register Usage #1」一节。","tags":["caller-saved","寄存器约定","ABI"],"options":null,"answer":true,"kp":"过程调用与栈"},{"id":"gen-c06-08","source":"自编 · 第 6 讲","origin":"created","lecture":6,"topic":"栈上参数的偏移计算","type":"fill","difficulty":3,"stem":"某函数声明为 `void f(long a1, long a2, long a3, long a4, long a5, long a6, long a7, long a8)`。调用者按 x86-64 Linux 约定传参，进入 f 之后（即刚执行完 call 时），a8 位于栈的什么位置？请写出形如 `N(%rsp)` 的表达式。","code":null,"explanation":"进入被调用者时，%rsp 指向 call 压入的返回地址，即 (%rsp) 处是返回地址。前 6 个参数已经在寄存器里（a1=%rdi、a2=%rsi、a3=%rdx、a4=%rcx、a5=%r8、a6=%r9），剩下的参数按顺序从 8(%rsp) 开始摆放：a7 在 8(%rsp)，a8 在 16(%rsp)，一般地 aₙ（n ≥ 7）在 8×(n-6)(%rsp)。因此答案是 16(%rsp)。踩坑点：忘记返回地址也占 8 字节、把 a7 当成 (%rsp) 是最常见的错误；另一个坑是把偏移写成十进制 16 与十六进制 0x10 混用。讲义「x86-64/Linux Stack Frame」图中把「Arguments 7+」画在调用者栈帧的高地址一侧，正与此对应。对应第 6 讲参数传递与栈帧结构一节。","tags":["栈参数","偏移","调用约定"],"options":null,"answer":["16(%rsp)","0x10(%rsp)","16"],"kp":"过程调用与栈"},{"id":"f2014-05","source":"2014 期末","origin":"exam","lecture":7,"topic":"结构体对齐与数组填充","type":"single","difficulty":3,"stem":"假定 `struct P {int i; char c; int j; char d;};` 在 x86-64 服务器的 Linux 上，下面哪个结构体的大小与其它三个不同","code":null,"explanation":"struct P 的布局为 i(4) + c(1) + 3 字节填充 + j(4) + d(1) + 3 字节尾部填充 = 16 字节（最大成员对齐为 4）。P1 = 3 × 16 = 48 字节；P3、P4 各含 3 + 3 个 8 字节指针，也是 48 字节；P2 则不同：i[3] 占 12 字节，c[3] 占 3 字节加 1 字节填充，j[3] 占 12 字节，d[3] 占 3 字节加 1 字节填充，合计 32 字节——数组元素之间不再插入“结构体内那种”逐成员填充。因此 B 与其余三个不同。","tags":["结构体对齐","填充","sizeof"],"options":["struct P1 {struct P a[3];};","struct P2 {int i[3]; char c[3]; int j[3]; char d[3];};","struct P3 {struct P *a[3]; char *c[3];};","struct P4 {struct P *a[3]; int *f[3];};"],"answer":1,"kp":"数据布局与对齐"},{"id":"f2018-02","source":"2018 期末","origin":"exam","lecture":7,"topic":"结构体对齐与数组元素访存","type":"single","difficulty":2,"stem":"有如下结构定义和程序片段，在 Linux 下使用 GCC 编译器、仅采用 -O2 选项，上述代码对应的汇编语言是（把括号中的三个数依次填入三个空格）：","code":"struct A {\n    char c;\n    int i;\n    double d;\n    int array[10];\n};\n\nstruct B {\n    int array[10];\n    double d;\n    char c;\n    int i;\n};\n\nvoid foo(struct A *pa, struct B *pb, int index)\n{\n    pb->i = pa->array[index];\n}\n\n// 生成的汇编：\n//   movslq %edx, %rdx\n//   movl __(%rdi,%rdx,__), %eax\n//   movl %eax, __(%rsi)","explanation":"先算 struct A 的布局：c 在偏移 0，int i 需 4 字节对齐所以放在 4，double d 需 8 字节对齐所以放在 8，array[10] 紧接在 d 之后，偏移为 16。所以 pa->array[index] 的地址是 pa+16+index*4，比例因子必须是 sizeof(int)=4，即 movl 16(%rdi,%rdx,4),%eax，前两空是 (16, 4)。再算 struct B：array[10] 占 0~39，double d 需 8 字节对齐放在 40，char c 放在 48，int i 需 4 字节对齐，因此要跳过 3 字节填充放在 52。所以第三个空是 52，选 A。B 错在把 array 的偏移算成 24（忽略了 d 的 8 字节对齐要求）；C、D 错在把 B 中 i 的偏移算成 49（忘记 int 需 4 字节对齐，char 之后要填充 3 字节）。踩坑点：x86-64 中 double 的对齐要求是 8，int 是 4，结构体内部填充由成员的顺序决定，“char 和 int 共用一个 8 字节”指的是小成员可以共享一个对齐单元，但偏移仍须满足各自的对齐要求。","tags":["结构体对齐","数组访存","比例因子"],"options":["(16, 4, 52)","(24, 4, 52)","(16, 4, 49)","(24, 4, 49)"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2012-10","source":"2012 期中","origin":"exam","lecture":7,"topic":"数组访问的地址计算与比例因子","type":"single","difficulty":2,"stem":"已知 `int *a`、`int n`，寄存器 %ecx 中存放 a（int 指针），%edx 中存放 n。下面哪段汇编最准确地对应 C 语句 `return a[n];`？","code":null,"explanation":"访问 int 数组元素要按 4 字节的比例因子计算地址再取值：有效地址为 a + 4*n，指令 mov (%ecx,%edx,4),%eax 从该地址读 4 字节到 %eax（返回值寄存器），然后 ret，故选 C。A 把 ret 当成带操作数的取数指令，语法与语义都不成立；B 用 lea 只把地址算进 %eax，并没有真正读取内存，写成汇编会把「返回地址」当成返回值；D 的比例因子是 1，相当于按字节下标寻址，对 int 数组会取到错误的元素（等价于 a[(long)n/4] 之类的越界位置）。","tags":["数组寻址","比例因子","lea"],"options":["ret (%ecx,%edx,4)","leal (%ecx,%edx,4),%eax\nret","mov (%ecx,%edx,4),%eax\nret","mov (%ecx,%edx,1),%eax\nret"],"answer":2,"kp":"机器级编程基础"},{"id":"m2012-11","source":"2012 期中","origin":"exam","lecture":7,"topic":"内存寻址格式的 C 等价形式","type":"single","difficulty":1,"stem":"指令 `mov 0x10(%rax,%rcx,4), %rdx` 对应的 C 代码是：","code":null,"explanation":"AT&T 寻址格式 disp(base,index,scale) 的计算规则是「有效地址 = base + index*scale + disp」，本题为 %rax + %rcx*4 + 0x10；mov 的源是内存、目的是 %rdx，因此等价于 rdx = *(rax + rcx*4 + 0x10)，选 C。A 完全没体现解引用；B 把方向弄反了（那是把 rdx 写回内存）；D 把比例因子 4 误当成加数（写成 rcx + 4），忽略了 scale 是乘在 index 上的。","tags":["寻址格式","base-index-scale","解引用"],"options":["rdx = rax + rcx + 4 + 0x10","*(rax + rcx + 4 + 0x10) = rdx","rdx = *(rax + rcx*4 + 0x10)","rdx = *(rax + rcx + 4 + 0x10)"],"answer":2,"kp":"机器级编程基础"},{"id":"m2013-06","source":"2013 期中","origin":"exam","lecture":7,"topic":"结构体对齐与填充","type":"single","difficulty":2,"stem":"32 位 x86 计算机、Windows 操作系统下定义的 structure S 包含三个成员：double a、int b、char c。按 Windows 的 1、4、8 对齐原则（char 按 1 字节、int 按 4 字节、double 按 8 字节对齐），S 在内存中最多和最少分别占多少字节？","code":null,"explanation":"成员顺序决定填充多少。最大情形把 char 放最前（题中给出成员顺序 c、a、b 之外的另一种最坏排布）：c 占 1 字节 + 7 字节填充，a（double，需 8 字节对齐）占 8 字节，b（int）占 4 字节，最后结构体本身还要按最大对齐 8 补齐 4 字节，共 1+7+8+4+4 = 24 字节。最小情形按宽度从大到小排 a、b、c：a 占 8、b 占 4、c 占 1，再补 3 字节使总长为 8 的整数倍，共 16 字节。故最多 24、最少 16，选 D。选项中的 13 是把 char 之后不做尾部补齐得到的错误结果（结构体总大小必须是最大成员对齐值的整数倍）。踩坑点：Windows 下 double 按 8 字节对齐，而 IA32 Linux 下只按 4 字节对齐，同一结构体在两种 ABI 下大小可能不同。","tags":["结构体","对齐","填充"],"options":["16, 13","16, 16","24, 13","24, 16"],"answer":3,"kp":"数据布局与对齐"},{"id":"m2014-06","source":"2014 期中","origin":"exam","lecture":7,"topic":"结构体与联合体的对齐和成员偏移","type":"single","difficulty":3,"stem":"有如下定义的结构，在 x86-64 下，下述结论中**错误**的是：","code":"struct {\n    char c;\n    union {\n        char vc;\n        double value;\n        int vi;\n    } u;\n    int i;\n} sa;","explanation":"x86-64 下 union 的对齐要求取其成员中最大的对齐值（double → 8 字节），因此布局为：c 在偏移 0（1 字节 + 7 字节填充），u 在偏移 8（union 大小 8），i 在偏移 16（4 字节 + 4 字节尾部填充），sizeof(sa) = 24，A 正确。C 正确：&sa.u.vc 与 &sa.c 相差 8 字节，按 char* 相减得 8。D 正确：把 double 放到最前面，8 + 4 + 1 = 13，补齐到 8 的倍数即 16。B 错误：&sa.i 与 &sa.u.vi 都是 int*，指针相减的单位是 int（4 字节），地址相差 8 字节时结果为 2 而不是 8，这是把「字节差」与「元素个数差」混淆了。踩坑点：指针减法的结果要除以所指类型的大小；联合体的 sizeof 是所有成员的最大值并按其最大对齐值取整。","tags":["结构体对齐","联合体","指针相减"],"options":["sizeof(sa) == 24","(&sa.i - &sa.u.vi) == 8","(&sa.u.vc - &sa.c) == 8","优化成员变量的顺序，可以做到 sizeof(sa) == 16"],"answer":1,"kp":"数据布局与对齐"},{"id":"m2015-05","source":"2015 期中","origin":"exam","lecture":7,"topic":"IA32 下的结构体对齐与重排","type":"single","difficulty":3,"stem":"已知下面的数据结构，假设在 Linux/IA32 下要求对齐，这个结构的总大小是多少字节？如果重新排列其中的字段，最少可以达到多少字节？","code":"struct {\n    char a;\n    double *b;\n    double c;\n    short d;\n    long long e;\n    short f;\n};","explanation":"IA32（32 位 Linux）下指针占 4 字节，double 与 long long 只要求 4 字节对齐。按原顺序：a 占 1 + 填充 3，b 占 4（偏移 4~7），c 占 8（偏移 8~15，4 字节对齐即可），d 占 2（偏移 16~17）+ 填充 2，e 占 8（偏移 20~27，按 4 对齐合法），f 占 2（偏移 28~29）+ 尾部填充 2，共 32 字节。重排时按宽度从大到小放：e(8) + c(8) + b(4) + d(2) + f(2) + a(1) = 25，再补齐到 4 的倍数得 28 字节。故答案为 32、28，选 A。踩坑点：IA32 中 double/long long 的对齐值是 4 而不是 8（x86-64 下才是 8），忽略这一点会算成 36/32 之类的答案。","tags":["结构体对齐","IA32","填充"],"options":["32, 28","36, 32","28, 26","26, 26"],"answer":0,"kp":"数据布局与对齐"},{"id":"m2016-07","source":"2016 期中","origin":"exam","lecture":7,"topic":"数组元素地址与 leaq 比例变址","type":"single","difficulty":2,"stem":"已知短整型（short，2 字节）数组 S 的起始地址和下标 i 分别存放在寄存器 %rdx 和 %rcx 中，要把 `&S[i]` 存入寄存器 %rax，对应的汇编指令是：","code":null,"explanation":"&S[i] 要的是元素的**地址**而不是元素内容，所以必须用 lea（只做地址计算、不访存）而不能用 movw（读取内存内容）。地址 = S + i*sizeof(short) = %rdx + %rcx*2，比例因子应取元素大小 2，写作 `leaq (%rdx,%rcx,2), %rax`，选 C。A 的比例因子 1 相当于按 char 计算；B 的比例因子正确，但 movw 取的是内存内容、且只写 2 字节，不能得到 64 位地址；D 的比例因子 1 且用了访存指令，两处都错。踩坑点：牢记「比例因子 = 元素大小」，以及「取地址用 lea、取内容用 mov」。","tags":["leaq","比例变址寻址","数组元素地址"],"options":["leaq (%rdx, %rcx, 1), %rax","movw (%rdx, %rcx, 2), %rax","leaq (%rdx, %rcx, 2), %rax","movw (%rdx, %rcx, 1), %rax"],"answer":2,"kp":"机器级编程基础"},{"id":"m2017-07","source":"2017 期中","origin":"exam","lecture":7,"topic":"二维数组与指针算术的放大倍数","type":"single","difficulty":2,"stem":"有定义 `int A[3][2] = {{1,2},{3,3},{2,1}};`（int 占 4 字节），那么下列各表达式中，与 `A[2]` 的值（即第 2 行的首地址）相等的是：","code":null,"explanation":"A[2] 是「第 2 行的首地址」，也就是 (int*)A + 4。指针加整数时，整数要按**指针所指元素的大小**放大：A 的类型是 int(*)[2]，元素是一整行（2 个 int，8 字节），所以 A+2 才等于该地址，A+16 会跳得很远；&A 的类型是 int(*)[3][2]，元素是整个数组（3×2×4 = 24 字节），&A+16 要放大 16×24 字节；*A 是第 0 行的首地址，类型 int*（元素 4 字节），*A+4 就落到第 0 行第 4 个 int 的位置——按行优先存放，A[0][4] 与 A[2][0] 同地址，正好等于 A[2]，而 *A+2 只到 A[0][2]，即 A[1][0]。故选 C。踩坑点：先看清指针的**基类型（元素大小）**再决定放大倍数，教材中指针运算表格正是考这一点。","tags":["指针算术","二维数组","行优先"],"options":["&A+16","A+16","*A+4","*A+2"],"answer":2,"kp":"数据布局与对齐"},{"id":"m2017-08","source":"2017 期中","origin":"exam","lecture":7,"topic":"union 与端序","type":"single","difficulty":2,"stem":"在 x86-64（小端法）下，有如下变量定义。当 `x.i = 0x41424344` 时，`x.c[2]` 的值为多少？（提示：'A' = 0x41）","code":"union { char c[8]; int i; } x;","explanation":"union 的成员共享同一块内存的起始地址。x.i = 0x41424344 在小端法机器上从低地址到高地址存放为 44 43 42 41，于是 c[0]=0x44='D'、c[1]=0x43='C'、c[2]=0x42='B'、c[3]=0x41='A'，所以 x.c[2] = 'B'，选 B。踩坑点：小端法把**最低有效字节**放在最低地址，与书写顺序正好相反；若按大端法算就会误选 'A'。另外 union 的大小取最大成员（这里是 8 字节），前 4 个字节被 int 成员占据。","tags":["union","小端法","字节序"],"options":["'A'","'B'","'C'","'D'"],"answer":1,"kp":"整数与位运算"},{"id":"m2018-05","source":"2018 期中","origin":"exam","lecture":7,"topic":"struct 与 union 的内存布局","type":"single","difficulty":3,"stem":"下列关于 C 语言中结构体（struct）以及联合（union）的说法中，正确的是：","code":null,"explanation":"A 正确：struct 内存在对齐填充，把成员按大小递增排列通常能减少内部碎片，但**不一定**最小——例如成员对齐要求
