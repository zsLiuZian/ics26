量为 32 字节，但 Tag 与 Valid 位的存在使得其实际占用的字节数是容量的 1.5 倍。\n②若初始时缓存均为空，用该序列分别访存，其在高速缓存 A 中的 hit 次数多于 B。\n③对于高速缓存 A，两个地址相邻的缓存块在相同的组中；而对于高速缓存 B，则在不同的组中。\n④实际的缓存系统通常采用 A 的格式而不采用 B，是因为空间局部性较差时其能更好地利用缓存。","code":"地址 6 位（内存 64 字节）：\n缓存 A：tag | index | offset = bit5-4 | bit3-2 | bit1-0\n缓存 B：index | tag | offset = bit5-4 | bit3-2 | bit1-0\n两者：s=2（4 组）、E=2（每组 2 行）、b=2（块大小 4 字节）\n访存序列（十进制）：1, 7, 8, 3, 4","explanation":"逐个判断。① 错：A 的容量 = 组数 × 每组行数 × 块大小 = 4 × 2 × 4 = 32 字节，但额外开销是 8 行的有效位（1 位）加 tag（2 位），总共约 24 位 = 3 字节，远达不到容量的 1.5 倍（1.5 倍意味着要 16 字节的额外开销），所以 ① 错误（而且“cache physical size”的计算本身超出课本范围）。② 对：A 中地址 1 与 3 落在同一块（0~3）、地址 4 与 7 落在同一块（4~7）、8 落在组 2，因此 1,7,8 三次 miss 之后 3、4 两次都命中（2 次 hit）；B 中四个地址的组索引（bit5-4）全都是 0，全部挤在组 0：访问 1(tag0)、7(tag1) 各 miss 一次填满两组，访问 8(tag2) 时按 LRU 换掉 tag0，访问 3(tag0) 又 miss，只有访问 4(tag1) 命中（1 次 hit）。所以 A 的命中次数更多，② 正确。③ 错：说反了——A 的组索引取自地址中间位，相邻的缓存块会轮流进入不同的组（分散）；B 的组索引取自最高位，相邻的缓存块全部落在同一组（冲突）。④ 错：实际系统采用 A 是为了让顺序访问（空间局部性好的程序）的相邻块分散到不同组、避免冲突，而不是“空间局部性较差时”才更好。因此只有 ② 正确，正确的个数为 1，选 B。踩坑点：组索引的位位置决定了冲突模式，把索引位放在最高位会让连续地址全部挤进一组，是最糟糕的设计。","tags":["cache","组索引","LRU","冲突缺失"],"options":["0","1","2","3"],"answer":1,"kp":"高速缓存"},{"id":"f2021-32","source":"2021 期末","origin":"exam","lecture":13,"topic":"FIFO 全相联缓存的 miss 次数比较","type":"fill","difficulty":3,"stem":"高速缓存的先进先出替换策略（FIFO）指的是发生缓存不命中时，最先进入高速缓存的行（cache line）将最先被替换出。考虑两种遵循 FIFO 且块大小相同的全相联高速缓存 C1 和 C2，其中 C1 是 3 路全相联的，C2 是 4 路全相联的。假设初始情况下 C1、C2 所有行的有效位都为 0，则让它们分别连续访问标记（tag）为 0, 1, 2, 3, 0, 1, 4, 0, 1, 2, 3, 4 的行之后，C1 发生的缓存不命中次数（  ）C2 发生的缓存不命中次数（填 “>”“=” 或 “<”）。","code":"访问的 tag 序列：0, 1, 2, 3, 0, 1, 4, 0, 1, 2, 3, 4\nC1：3 路全相联，FIFO；C2：4 路全相联，FIFO（初始全为空）","explanation":"C1（3 路，FIFO）逐次模拟：0 miss、1 miss、2 miss 填满三路；3 miss 换出最早的 0；0 miss 换出 1；1 miss 换出 2；4 miss 换出 3（此时驻留 {0,1,4}）；0、1 都命中；2 miss 换出 0；3 miss 换出 1；4 命中。共 9 次不命中。C2（4 路，FIFO）：0、1、2、3 各 miss 一次填满；0、1 命中；4 miss 换出 0；0 miss 换出 1；1 miss 换出 2；2 miss 换出 3；3 miss 换出 4；4 miss 换出 0。共 10 次不命中。所以 C1 的不命中次数小于 C2（9 < 10），填 “<”。踩坑点：容量（路数）更大并不保证不命中更少，FIFO 不是栈式算法，遇到循环访问模式时反而可能更差；本题要老老实实按 FIFO 的“先入先出”逐次模拟。","tags":["cache","FIFO","全相联","不命中次数"],"options":null,"answer":["<","小于"],"kp":"高速缓存"},{"id":"f2021-33","source":"2021 期末","origin":"exam","lecture":13,"topic":"缓存不命中的三种类型与暖身","type":"fill","difficulty":1,"stem":"在某测量 L1 数据缓存相联度的实验中：Step #2 要求对给定的步长 S 和元素数量 N，连续两次从起始位置以 S 为步长顺序访问 N 个内存地址，记录第二次访问的平均时间 T。给定 S 和 N 后第一遍访问 N 个内存地址的过程被称为暖身（warm up），这是为了避免教材中所提到的三种缓存不命中之一的（  ）不命中带来的影响。","code":"Step #1: 开辟一块足够大（如 8MiB）的内存空间\nStep #2: 对给定 S 和 N，先按步长 S 访问 N 个地址（暖身），再计时重做一遍，记录 T\nStep #3: 多次实验取平均","explanation":"教材把缓存不命中分为三类：冷/强制性不命中（compulsory，第一次访问某个块时必然发生）、冲突不命中（conflict，映射到同一组的块互相驱逐）和容量不命中（capacity，工作集大于缓存容量）。暖身（warm up）这一遍的作用正是把需要访问的块预先装入缓存，从而消除“第一次访问某个块必然不命中”的冷启动效应，使得第二次测量得到的时间只反映冲突/容量不命中的影响（因为缓存初始状态是空的，不做暖身的话所有块的第一次访问都会因冷启动而变慢）。因此填“冷/强制性”，写“强制性”或英文 compulsory 也正确。踩坑点：暖身消除的是冷启动，不是冲突和容量。","tags":["cache","冷启动不命中","暖身","实验方法"],"options":null,"answer":["冷/强制性","强制性","冷启动不命中","compulsory"],"kp":"高速缓存"},{"id":"lab2025-31","source":"2025 Lab 测验","origin":"exam","lecture":13,"topic":"CacheLab 中 valgrind 的用途","type":"single","difficulty":2,"stem":"在 CacheLab 实验中，valgrind 工具的主要用途是什么？","code":null,"explanation":"CacheLab 用 valgrind 的 lackey 工具插桩运行程序，截获并记录每一条数据访存（加载/存储）的地址与操作类型，输出 .trace 文件，作为驱动缓存模拟器 csim 的核心输入（C 对）。csim-ref 是课程提供的参考模拟器可执行文件、与 valgrind 无关（A 错）；编译由 gcc 完成（B 错）；Part B 的评分由 test-trans、driver.py 等脚本完成（D 错）。理解 trace 的生成过程有助于明白：模拟器只模拟**数据**访存，指令取指不在 trace 中。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["CacheLab","valgrind","trace"],"options":["作为参考缓存模拟器（csim-ref）来检查输出结果","编译 csim.c 和 trans.c 文件","生成程序运行时的内存访问轨迹（trace files）","自动评估 Part B 矩阵转置的性能得分"],"answer":2,"kp":"高速缓存"},{"id":"lab2025-32","source":"2025 Lab 测验","origin":"exam","lecture":13,"topic":"csim 中被忽略的访存操作类型","type":"single","difficulty":2,"stem":"在 CacheLab Part A（csim.c）中，模拟器需要解析轨迹文件中的内存访问操作。根据 writeup，下列哪个操作类型应该被忽略？","code":null,"explanation":"trace 文件中的操作类型有四种：L（load，数据加载）、S（store，数据存储）、M（modify，数据修改，等价于先 L 后 S）、I（instruction load，指令加载）。课程只要求模拟**数据**缓存（D-cache），因此 I 操作应当直接忽略（D 对）。A、B、C 都是数据访问，必须被计入命中与不命中统计：忽略 M 会漏掉一次访问并造成统计错误，忽略 L 或 S 更会完全破坏模拟结果。这也是写 csim 时常见的失分点——解析到 I 时若不跳过，命中率统计会与参考模拟器对不上。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["CacheLab","csim","trace 解析"],"options":["M（数据修改）","L（数据加载）","S（数据存储）","I（指令加载）"],"answer":3,"kp":"高速缓存"},{"id":"lab2025-33","source":"2025 Lab 测验","origin":"exam","lecture":13,"topic":"M 操作应拆成 L 加 S","type":"single","difficulty":3,"stem":"根据 CacheLab Part A 的编程规则和提示，当缓存模拟器（csim.c）解析到一行 M（数据修改）操作时，它应该如何处理？","code":null,"explanation":"一条 `mov` 类的读—改—写指令在硬件上表现为「先把数据读入、修改后写回」，因此 trace 中的 M 等价于一次 L 紧接着一次 S。模拟器应按顺序处理两次访问：第一次可能不命中（并可能触发淘汰），第二次则几乎必然命中（除非第一次的替换又把它挤出去，或者采用不命中不分配策略），两次访问都要更新 LRU/使用位。选项 A 把它当成一次访问会少算一次访问与一次 LRU 更新；选项 C 若忽略则完全错算命中率；选项 D 漏掉了必须先读入的那一步。这题与上一题合起来说明：**I 要丢弃、M 要拆成两次**。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["CacheLab","csim","M 操作"],"options":["将其视为单次内存访问，最多导致一次缓存不命中（miss）和一次可能的淘汰（eviction）","将其视为一次数据加载（L）和紧随其后的一次数据存储（S）。这可能导致两次命中，也可能先不命中后命中（可能伴随淘汰）","忽略此操作，因为实验只关心数据加载（L）和数据存储（S）操作","只将其视为一次数据存储（S）操作，因为数据最终被修改了"],"answer":1,"kp":"高速缓存"},{"id":"m2012-13","source":"2012 期中","origin":"exam","lecture":13,"topic":"组相联缓存的组索引计算","type":"single","difficulty":2,"stem":"某系统采用 2 路组相联缓存，共 16 组，块大小为 64 字节。地址 0xdeadbeef 处的字节映射到哪一组？","code":null,"explanation":"地址被划分为「t 位标记 | s 位组索引 | b 位块偏移」。块大小 64 字节 → b = log2 64 = 6；16 组 → s = log2 16 = 4。组号 = (地址 >> 6) & 0xF。0xdeadbeef >> 6 = 0x3AB6FB，与 0xF 相与得 0xB = 11，故选 B。注意相联度（2 路）不影响组索引的位数。选项 7、13、14 都是取错位段的结果，例如直接用地址低 4 位会得到 15（0xF），用 (地址>>4)&0xF 会得到 0xE = 14。","tags":["高速缓存","组索引","块偏移"],"options":["第 7 组","第 11 组","第 13 组","第 14 组"],"answer":1,"kp":"高速缓存"},{"id":"m2012-15","source":"2012 期中","origin":"exam","lecture":13,"topic":"缓存冲突缺失与访问顺序","type":"fill","difficulty":3,"stem":"32 位 Linux 系统上，缓存为 2 路组相联、总容量 128 字节、每块 32 字节（long long 为 8 字节）。假设数组 table 的起始地址为 0x0，执行下面的代码后，对 table 元素的**缺失率（miss rate）**是多少？","code":"int i;\nint j;\nlong long table[4][8];\n\nfor (j = 0; j < 8; j++) {\n    for (i = 0; i < 4; i++) {\n        table[i][j] = i + j;\n    }\n}","explanation":"缓存共 128/32 = 4 个块，2 路组相联即 2 组 × 2 行，组号 = 块号 mod 2。元素 table[i][j] 的字节地址是 (8i+j)*8，它所在的块号为 ((8i+j)*8)/32 = (8i+j)/4。循环以 j 为外层、i 为内层：固定 j 时 i 取 0、1、2、3，对应块号分别为 2i = 0、2、4、6，全部是偶数 → 全部映射到第 0 组，而第 0 组只有 2 行，4 个块互相冲突替换，于是每一次写都会缺失，32 次访问全部 miss，缺失率 = 1（100%）。对照第二种写法（把类型换成 int）：此时每个 32 字节块能装 8 个 int，同一列 j 的 4 个元素只占 1 个块且行列访问顺序使块被反复复用，32 次访问只有 4 次冷启动缺失，缺失率降为 1/8。踩坑点：冲突缺失由「块号映射到同一组」引起，与访问顺序（行优先/列优先）密切相关，本例是典型的列优先遍历长步长数组导致的抖动。","tags":["缓存","冲突缺失","局部性"],"options":null,"answer":["1","100%","1.0"],"kp":"高速缓存"},{"id":"m2013-16","source":"2013 期中","origin":"exam","lecture":13,"topic":"直接映射缓存的组数、行数与容量关系","type":"single","difficulty":1,"stem":"一个直接映射高速缓存的大小是 4KB，块（block）大小为 32 字节，请问它每组（set）有多少行（line）？","code":null,"explanation":"直接映射缓存的相联度 E = 1，即每个组只有 1 行，这是「直接映射」的定义本身，与容量、块大小无关，故选 D。4KB / 32B = 128 是缓存**总行数**，同时也是组数（S = 128），所以选项 A 是把「总行数」误当成「每组行数」；B、C 没有对应关系。踩坑点：容量 C = S × E × B，直接映射时 E = 1、S = C/B = 128 组，组索引需要 7 位，块偏移需要 5 位。","tags":["直接映射","组相联","缓存容量"],"options":["128","64","32","1"],"answer":3,"kp":"高速缓存"},{"id":"m2013-23","source":"2013 期中","origin":"exam","lecture":13,"topic":"组相联缓存的缺失计数","type":"fill","difficulty":3,"stem":"某 Cache 只能存储 4 个数据（4 个块），每行（块）长 2 字节；内存地址空间共 32 字节（5 位地址，0~31）。数据访问地址序列为 1 → 4 → 17 → 2 → 8 → 16 → 9 → 0，采用 LRU 替换策略。若 Cache 结构为 S = 2、E = 2（2 组、每组 2 路），这 8 次访问一共产生多少次缺失（Miss）？","code":null,"explanation":"块大小 2 字节 → 块偏移 1 位；S = 2 → 组索引 1 位。块号 = 地址/2，组号 = 块号 mod 2（偶块入第 0 组，奇块入第 1 组）。逐次访问：1（块 0，组 0）缺；4（块 2，组 0）缺，组 0 = {0,2}；17（块 8，组 0）缺，LRU 淘汰块 0，组 0 = {2,8}；2（块 1，组 1）缺，组 1 = {1}；8（块 4，组 0）缺，淘汰 LRU 的块 2，组 0 = {8,4}；16（块 8，组 0）命中；9（块 4，组 0）命中；0（块 0，组 0）缺，淘汰 LRU 的块 8，组 0 = {4,0}。共缺失 6 次（命中、命中出现在第 6、7 次）。最终状态为：组 0 的两路分别存 M[0-1]（tag 000）与 M[8-9]（tag 010），组 1 存 M[2-3]（另一路 V=0）。踩坑点：LRU 要按「同一组内各行的最近使用时间」比较，不能跨组淘汰。","tags":["组相联","LRU","缺失计数"],"options":null,"answer":["6"],"kp":"高速缓存"},{"id":"m2013-24","source":"2013 期中","origin":"exam","lecture":13,"topic":"全相联缓存的最终驻留内容","type":"fill","difficulty":3,"stem":"承上题（4 个块、每块 2 字节、5 位地址空间，访问序列 1 → 4 → 17 → 2 → 8 → 16 → 9 → 0，LRU 替换）。如果把 Cache 改成 S = 1、E = 4，即全相联（4 路、1 组），访问结束后 Cache 中存放的是哪些数据块？请用 M[a-b] 的形式列出 4 个块（顺序不限）。","code":null,"explanation":"全相联时 4 行同属一组，缺不缺失只取决于该块是否还在 Cache 中。块序列为 0（地址 1）、2（地址 4）、8（地址 17）、1（地址 2）、4（地址 8）、8（地址 16）、4（地址 9）、0（地址 0）：前 4 次把块 0、2、8、1 装满（4 次缺失）；第 5 次访问块 4 缺失，淘汰最久未用的块 0；第 6、7 次访问块 8、4 命中；第 8 次访问块 0 缺失，淘汰最久未用的块 2。最终 Cache 中为块 8（M[16-17]）、块 1（M[2-3]）、块 4（M[8-9]）、块 0（M[0-1]），共 4 个块。踩坑点：全相联不会有冲突缺失，但仍会有容量缺失；LRU 的淘汰对象是「最久没有被访问」的那一行。","tags":["全相联","LRU","容量缺失"],"options":null,"answer":["M[0-1], M[2-3], M[8-9], M[16-17]","M[0-1],M[2-3],M[8-9],M[16-17]","M[8-9], M[16-17], M[2-3], M[0-1]","M[0-1] M[2-3] M[8-9] M[16-17]"],"kp":"高速缓存"},{"id":"m2014-15","source":"2014 期中","origin":"exam","lecture":13,"topic":"缓存参数变化对缺失率的影响","type":"single","difficulty":3,"stem":"关于 cache 的 miss rate，下面哪种说法是**错误**的？","code":null,"explanation":"C 错：总容量和相联度不变时把块（B）变大，块数会变少，同一组能容纳的不同块数减少，冲突缺失往往增加（同时也会浪费空间、降低空间局部性利用效率），所以「一定不会增加」不成立。A 对：E、B 不变而增大 S 意味着总容量变大，容量缺失减少，缺失率不会升高。D 对：随机替换在某些访问序列上可能恰好比 LRU 表现更好，因此「可能降低」是成立的。B 的表述也值得推敲：保持总容量与 B 不变而提高 E，就是让若干组合并、路数增多，官方解析给出了一个反例（序列 b1,b2,a1,a2,...,an,b1,b2 在合并后全部缺失），因此官方注明「选 B 或 C 都算正确」；本题库以官方首选答案 C 为准。踩坑点：缓存三参数 C = S×E×B 相互牵制，改变一个参数往往同时影响容量缺失与冲突缺失。","tags":["缺失率","块大小","替换策略"],"options":["保持 E 和 B 不变，增大 S，miss rate 一定不会增加","保持总容量和 B 不变，提高 E，miss rate 一定不会增加","保持总容量和 E 不变，提高 B，miss rate 一定不会增加","如果不采用 LRU，使用随机替换策略，miss rate 可能会降低"],"answer":2,"kp":"高速缓存"},{"id":"m2015-14","source":"2015 期中","origin":"exam","lecture":13,"topic":"缓存地址划分与标记位提取","type":"single","difficulty":3,"stem":"某高速缓存（E = 2，B = 4，S = 16），地址宽度 14 位。当引用地址 0x9D28 处的一个字节时，tag（标记）位应为：","code":null,"explanation":"块大小 B = 4 → 块偏移占 log2 4 = 2 位；组数 S = 16 → 组索引占 log2 16 = 4 位；因此标记位数 t = 14 - 4 - 2 = 8 位。地址 0x9D28 = 1001 1101 0010 1000B 共 16 位，而地址宽度只有 14 位，所以要取低 14 位：0111 0100 1010 00B。其中最低 2 位 00 是块偏移，接下来 4 位 1010 是组索引，剩下的高 8 位 0111 0100 就是 tag，故选 A。B 是 9 位（位数算错），C 是 7 位，D 是直接照抄了地址的高 8 位而忽略了 14 位地址宽度（没有先截断）。踩坑点：地址宽度小于机器字长时要先按宽度截断，再按 t | s | b 划分。","tags":["高速缓存","tag 位","地址划分"],"options":["01110100","001110000","1110000","10011100"],"answer":0,"kp":"高速缓存"},{"id":"m2015-15","source":"2015 期中","origin":"exam","lecture":13,"topic":"高速缓存的性质与写策略","type":"single","difficulty":3,"stem":"关于高速缓存的说法正确的是：","code":null,"explanation":"A 错：直写每次写命中都同时更新缓存与下一级存储，控制逻辑简单（通常还要配一个写缓冲）；写回只在块被替换时才写下一级，需要脏位、写回控制器，实现更复杂。B 错：块变大主要利用的是**空间**局部性（一次取入相邻数据），对只有时间局部性、工作集本身很小的程序并没有帮助，反而可能因块数减少而增加冲突缺失。C 错：相联度增大能减少冲突缺失，但收益递减；当相联度大到一定程度后组数减少，缺失率可能不再下降甚至回升（而且比较逻辑更慢、命中时间更长）。因此三项都不正确，选 D。踩坑点：缓存参数与缺失率之间的关系不是单调的，要同时考虑容量缺失、冲突缺失与命中时间。","tags":["写策略","块大小","相联度"],"options":["直写（write through）比写回（write back）在电路实现上更复杂","固定的高速缓存大小，较大的块可提高时间局部性好的程序的命中率","随着高速缓存组相联度的不断增大，失效率不断下降","以上说法全不正确"],"answer":3,"kp":"高速缓存"},{"id":"m2016-18","source":"2016 期中","origin":"exam","lecture":13,"topic":"直接映射 cache 的组结构","type":"fill","difficulty":1,"stem":"如果直接映射（direct-mapped）高速缓存大小是 32KB，块（block）大小为 32 字节，那么它每组（set）有____行（line）。","code":null,"explanation":"直接映射的定义就是每组只有 **1** 行（E = 1）：地址按索引位固定映射到唯一的一行，没有任何替换选择的余地。这个结论与缓存容量、块大小都无关，所以不管容量写成 32KB 还是 4KB，答案都是 1。踩坑点：不要顺手去算 32KB/32B = 1024 行——那是**总行数**，也就是组数，而本题问的是每组几行。","tags":["直接映射","cache 结构","每组行数"],"options":null,"answer":["1","一行","1 行"],"kp":"高速缓存"},{"id":"m2016-19","source":"2016 期中","origin":"exam","lecture":13,"topic":"组相联 cache 的组数计算","type":"fill","difficulty":2,"stem":"如果二路组相联（2-way set associative）高速缓存大小是 8KB，块（block）大小为 32 字节，那么它每路（way）有____行（line）。","code":null,"explanation":"缓存总行数 = 8KB / 32B = 256 行；二路组相联每组有 2 行，故组数 S = 256 / 2 = 128，而「每路有多少行」就等于组数 S，答案是 128。公式化写法：S = C / (B × E) = 8192 / (32 × 2) = 128。踩坑点：「每路行数」问的是组数而不是总行数（256），也不是每组的行数（2）；三个数很容易混淆，答题时要看清问的是哪一个。","tags":["组相联","组数计算","cache 容量"],"options":null,"answer":["128","128 行","2^7"],"kp":"高速缓存"},{"id":"m2017-14","source":"2017 期中","origin":"exam","lecture":13,"topic":"全相联与直接映射的命中时间","type":"single","difficulty":3,"stem":"在高速缓存存储器中，关于全相联（fully associative）和直接映射结构，以下论述正确的是：","code":null,"explanation":"C 正确：全相联缓存要把地址 tag 与**所有**行的 tag 并行比较并选出命中行，选路逻辑更长，因此命中时间（数据已在缓存时读出数据的时间）总是大于直接映射——后者按索引位直接定位唯一一行，命中时间最短。A、B 用「总是」评价整体性能也不成立：全相联缺失率更低（没有冲突缺失），总体性能是命中时间与缺失率的权衡，没有单向结论。D 与「全相联命中时间更长」正好相反。踩坑点：命中时间与缺失率是两个方向相反的指标，全相联是用命中时间换缺失率。","tags":["全相联","直接映射","命中时间"],"options":["如果配备同样容量、同样技术的高速缓存，配备全相联高速缓存的计算机总是比配备直接映射高速缓存的计算机性能低","如果配备同样容量、同样技术的高速缓存，配备全相联高速缓存的计算机总是比配备直接映射高速缓存的计算机性能高","如果配备同样容量、同样技术的高速缓存，当数据在缓存中时，配备全相联高速缓存的计算机总是比配备直接映射高速缓存的计算机读数据慢","如果配备同样容量、同样技术的高速缓存，当数据在缓存中时，配备全相联高速缓存的计算机总是比配备直接映射高速缓存的计算机读数据快"],"answer":2,"kp":"高速缓存"},{"id":"m2017-18","source":"2017 期中","origin":"exam","lecture":13,"topic":"组相联 cache 的命中次数统计","type":"fill","difficulty":3,"stem":"现有一个能存 4 个 block 的 cache，每个 block 大小为 2 字节（B = 2），内存空间为 32 字节（地址 0~31），结构为 S = 2 组、E = 2 路，初始为空，替换策略为 LRU。某程序按下列地址序列访问（十进制，单位为字节）：0, 3, 4, 7, 16, 19, 21, 22, 8, 10, 13, 14, 24, 26, 29, 30。这 16 次访问一共产生多少次命中？","code":null,"explanation":"块号 = 地址 / 2，组索引 = 块号 mod 2，tag = 块号 / 2（3 位）。16 次访问依次落在块 0,1,2,3,8,9,10,11,4,5,6,7,12,13,14,15，**全部互不相同**，也就是说每个块都是第一次被访问，因此每一次都是缺失，命中次数为 0（官方答案正是 0）。虽然同一组有 2 路（例如 set0 先后装入块 0、2、8、10、4、6、12、14，set1 装入 1、3、9、11、5、7、13、15），但被替换出去的块此后从未再被访问，替换策略的选择不影响结论。踩坑点：命中要求**同一个块被重复访问**，cache 容量和路数大并不自动带来命中。","tags":["cache 映射","LRU","命中次数"],"options":null,"answer":["0","零次","0 次"],"kp":"高速缓存"},{"id":"m2018-10","source":"2018 期中","origin":"exam","lecture":13,"topic":"直接映射与组相联的命中次数对比","type":"single","difficulty":3,"stem":"设一种缓存共包含 4 个缓存块，每个缓存块 32 字节，采用 LRU 替换算法，初始状态为空。对下列 char 类型内存地址序列访存：0x5a7, 0x5b7, 0x6a6, 0x5b8, 0x7a5, 0x5b9。对于**直接映射缓存**和 **2 路组相联缓存**，分别能产生几次命中？","code":null,"explanation":"块号 = 地址 / 32，六个地址依次落在块 45、45、53、45、61、45。直接映射时 4 个块必须是 4 组（E=1），组索引 = 块号 mod 4 = 1（45、53、61 全是 4k+1），全部映射到同一行，只有紧跟着重复访问的那一次（第 2 次，块 45）命中，共 1 次。2 路组相联时 4 个块 = 2 组 × 2 路，组索引 = 块号 mod 2 = 1，也都落在同一组：访问过程为 miss(45)、hit(45)、miss(53)、hit(45)、miss(61，需替换 LRU 的块 53)、hit(45)，共 3 次命中。故选 A（1, 3）。踩坑点：直接映射每组只有一个位置，一冲突就替换；2 路组相联能同时容纳两个不同 tag 的块，因此多出一次命中。","tags":["cache 映射","冲突缺失","LRU"],"options":["1, 3","1, 4","2, 3","2, 4"],"answer":0,"kp":"高速缓存"},{"id":"m2018-12","source":"2018 期中","origin":"exam","lecture":13,"topic":"列访问二维数组时的全 miss 条件","type":"single","difficulty":3,"stem":"某计算机地址空间 12 位，L1 cache 大小为 256 字节、组数 S = 4、路数 E = 2。从地址 0x0 开始存放一个 N 行 M 列的 int 类型二维数组 `int A[N][M]`，代码如下。不考虑并行和编译优化等会影响访问数组元素顺序的因素，则下列 (N, M) 组合中会导致**全部 Cache Miss** 的有几个？\n(N,M) = (64,4), (32,8), (16,16), (2,128)","code":"int ans = 0;\nfor (int j = 0; j < M; ++j)\n    for (int i = 0; i < N; ++i)\n        ans += A[i][j];","explanation":"每个块 32 字节 = 8 个 int，缓存共有 4×2 = 8 行，组索引 = 块号 mod 4。(32,8)：M = 8 使每行恰好占一个块，按列访问时走完 32 行（32 个不同块）才会回到第 0 行，而同一组内有 8 个不同块竞争 2 路，块 0 早已被替换，因此每次都 miss。(16,16)：M = 16 使每行占 2 个块，同理一次列扫描中同一组仍有 8 个不同块竞争 2 路，重访时必已被替换，全部 miss。(64,4)：M = 4，一个块能装 8 个 int，于是第 0 行的 4 个元素与第 1 行的 4 个元素同处一块，访问 A[0][0] 之后紧接着访问 A[1][0] 就会命中，并非全 miss。(2,128)：虽然 M = 128 使地址跨度很大，但 N = 2 时 A[0][0] 与 A[1][0] 只占用 set0 的两路，j 增到 1 时访问的 A[0][1] 与 A[0][0] 同块且仍在缓存中，会命中。因此只有 (32,8) 与 (16,16) 两个组合全 miss，选 C（官方答案亦为 C）。","tags":["cache 缺失分析","列访问","组索引"],"options":["4 个","3 个","2 个","1 个"],"answer":2,"kp":"高速缓存"},{"id":"m2020-11","source":"2020 期中","origin":"exam","lecture":13,"topic":"替换策略与相联度对命中率的影响","type":"single","difficulty":3,"stem":"以下关于缓存的说法中，正确的是：","code":null,"explanation":"D 正确：三种说法都不成立。A 错：LRU 并非总优于 MRU，典型反例是按顺序循环扫描一个略大于 cache 的数组，LRU 会把马上还要用的块替换出去（下次访问刚被换出的块），而 MRU 反而更优。B 错：FIFO 只是按调入顺序替换，不考虑访问历史，命中率不一定比随机替换高（在某些访问模式下随机替换更好）。C 错：容量与块大小固定时增加路数意味着组数减少，不同地址之间的冲突概率增大，命中率完全可能下降。踩坑点：替换策略没有绝对优劣，取决于访存模式；“路数越多命中率一定越高”是常见误解。","tags":["替换策略","LRU","相联度"],"options":["LRU 不会比 MRU（most-recently used）替换策略差","先入先出（FIFO）比随机替换命中率高","保持缓存容量、缓存块大小（B）不变，增加路数（E），命中率不会下降","以上说法都不正确"],"answer":3,"kp":"高速缓存"},{"id":"m2021-17","source":"2021 期中","origin":"exam","lecture":13,"topic":"直接映射 cache 的 tag 位数","type":"fill","difficulty":2,"stem":"在一个 16-bit 地址空间的机器上，有一个总大小为 16 Bytes 的 cache。若每个 block 的大小为 4 Bytes，采用直接映射的方式组织，则 tag 段长度为多少 bit？","code":null,"explanation":"地址长度 m = 16 位；块大小 B = 4 字节，故块偏移 b = log2(4) = 2 位；直接映射时相联度 E = 1，组数 S = C / (E × B) = 16 / 4 = 4，故组索引 s = log2(4) = 2 位；于是 tag 长度 t = m - s - b = 16 - 2 - 2 = 12 位。踩坑点：直接映射下 S = C/B，不要忘记除以相联度；tag、组索引、块偏移三者位数之和必须正好等于地址位数，可以用来自检。","tags":["高速缓存","直接映射","tag"],"options":null,"answer":["12"],"kp":"高速缓存"},{"id":"m2021-18","source":"2021 期中","origin":"exam","lecture":13,"topic":"组相联 cache 的命中次数（数组与块对齐）","type":"fill","difficulty":3,"stem":"在一个 16-bit 地址空间、总大小为 16 Bytes（2 路组相联）的 cache 上运行下面的代码，初始时 cache 为空，只考虑读写数据引起的 cache 访问。若数组 x、y 的起始地址分别为 0x0000、0x0008，cache block 大小为 2 Bytes，则命中次数为多少次？","code":"#define N 4\nchar x[N];\nshort y[N];\nint main() {\n    for (int i = 0; i < N; i++) {\n        x[i] = i;\n        y[i] = 1 - i;\n    }\n    return 0;\n}","explanation":"块大小 2 字节对应块偏移 b = 1 位；总容量 16 字节、2 路组相联时组数 S = 16/(2×2) = 4，组索引 s = 2 位。char x[4] 占 0x0000~0x0003，其中 x[0]、x[1] 同属块 [0-1]，x[2]、x[3] 同属块 [2-3]；而 short y[4] 占 0x0008~0x000F，每个 short 恰好占一个 2 字节的块，y[0]~y[3] 分别落在四个不同的块中。于是：i=0 写 x[0] 不命中（调入块 [0-1]）、写 y[0] 不命中；i=1 写 x[1] 命中（同一块）、写 y[1] 不命中（不同块）；i=2 写 x[2] 不命中（新块 [2-3]）、写 y[2] 不命中；i=3 写 x[3] 命中（同一块）、写 y[3] 不命中。合计命中 2 次。踩坑点：块大小正好等于一个 short，所以 y 的相邻元素不在同一个块里；而 x 的相邻元素共享块，第 2、4 次写才会命中。","tags":["高速缓存","组相联","命中次数"],"options":null,"answer":["2"],"kp":"高速缓存"},{"id":"m2022-15","source":"2022 期中","origin":"exam","lecture":13,"topic":"cache 容量与组数、路数、块大小的关系","type":"single","difficulty":3,"stem":"如果我们希望将原来 4MB 的 cache 调整为 6MB，可以采取的做法是：","code":null,"explanation":"cache 容量 C = S × E × B。B 对：组数 S 和块大小 B 不变，只把相联度 E 从 16 提到 24，容量就变成 4096 × 24 × 64 = 6MB，而路数（相联度）并不要求是 2 的幂，这是 Intel Core2 Duo T9300 真实使用的设计。A 错：组数 S = 6144 不是 2 的幂，而组索引是从地址中截取 s 位得到的，因此 S 必须是 2 的幂。C 错：块大小 B 同样要求是 2 的幂，96 不行。D 错，因为 B 可行。踩坑点：S 与 B 必须是 2 的幂（便于用位段切分地址），E 可以任意。","tags":["高速缓存","相联度","容量计算"],"options":["将 S 从 4096 调整为 6144。","将 E 从 16 调整为 24。","将 B 从 64 调整为 96。","以上答案都不对。"],"answer":1,"kp":"高速缓存"},{"id":"m2022-16","source":"2022 期中","origin":"exam","lecture":13,"topic":"写回与写分配策略的选择","type":"single","difficulty":2,"stem":"如果一个系统中访问下一级存储器的传输时间远大于 cache 的处理速度，我们尝试引入 cache 来改善一个局部性良好的程序的 IO 时，应当使用的写策略是：① 写回(write-back) ② 直写(write-through) ③ 写分配(write-allocate) ④ 非写分配(no-write-allocate)","code":null,"explanation":"题目强调“下一级存储器的传输时间远大于 cache 的处理速度”，即要尽可能减少与下级存储器之间的数据交换量，同时程序局部性良好。因此应选择写回（write-back）：写命中时只修改 cache、置脏位，等该块被替换时才写回内存，总线访问量最小；并搭配写分配（write-allocate）：写不命中时先把块调入 cache，由于局部性好，之后对该块的写和读都能命中，避免了每次写不命中都去访问下级存储器。所以是 ①③，选 A。B、D 用直写，每次写命中都要写穿到下级，代价高；C 用非写分配，写不命中不调入数据，对局部性好的程序会反复不命中。踩坑点：写回通常与写分配搭配，直写通常与非写分配搭配。","tags":["写回","写分配","高速缓存"],"options":["① ③","② ③","① ④","② ④"],"answer":0,"kp":"高速缓存"},{"id":"m2022-17","source":"2022 期中","origin":"exam","lecture":13,"topic":"写分配对内存带宽的影响","type":"single","difficulty":3,"stem":"执行以下函数，消耗的内存带宽约为多少？已知：(1) Write miss 发生时采用写分配（write-allocate）；(2) X、Y、result 三个数组在函数执行前均不存在于 CPU cache 中，函数执行完毕后均写入内存中；(3) 不考虑 SIMD 指令，不考虑编译优化（包括循环展开等）；(4) Cache line size 为 64 Bytes，内存到 cache 的传输以 cache line 为单位。（提示：消耗的内存带宽 = 从内存中读取的字节数 + 写入内存的字节数）","code":"void saxpy(int N,\n           float scale,\n           const float X[],\n           const float Y[],\n           float result[]) {\n    for (int i = 0; i < N; i++) {\n        result[i] = scale * X[i] + Y[i];\n    }\n}","explanation":"每次循环读 X[i] 4 字节、读 Y[i] 4 字节、写 result[i] 4 字节，表面上是 12N。但由于写不命中采用写分配，写 result[i] 时它所在的 cache line（64 字节 = 16 个 float）必须先从内存调入，于是 result 数组还会额外产生 4N 字节的读流量；最后脏块写回内存又产生 4N 字节的写流量。总计：读 X 4N + 读 Y 4N + 写分配读 result 4N + 写回 result 4N = 16N 字节，选 D。误选 C（12N）就是漏掉了写分配带来的额外读取；A、B 则漏算了某些数组的访存。踩坑点：内存带宽分析必须把 write-allocate 引起的读流量算进去，这是并行计算中的经典误区。","tags":["内存带宽","写分配","cache line"],"options":["3N Bytes","4N Bytes","12N Bytes","16N Bytes"],"answer":3,"kp":"高速缓存"},{"id":"m2022-22","source":"2022 期中","origin":"exam","lecture":13,"topic":"由地址划分反推 cache 容量","type":"fill","difficulty":2,"stem":"在一个 8-bit 地址空间的机器上，考虑如下的高速缓存：此高速缓存共有 4 组（S=4），为二路组相联（E=2），Tag 段的大小为 3-bit（t=3）。该 cache 所能存储的数据总容量 C 是多少字节？","code":null,"explanation":"地址共 8 位，已知 tag 占 t = 3 位、组索引占 s = log2(S) = log2(4) = 2 位，因此块偏移 b = 8 - 3 - 2 = 3 位，即每个 cache block 的大小 B = 2^3 = 8 字节。总容量 C = S × E × B = 4 × 2 × 8 = 64 字节。踩坑点：C 只统计数据部分，不含有效位、脏位与 tag 位；求解顺序是“先由 m = t + s + b 求出 b，再乘出容量”。","tags":["高速缓存","地址划分","容量"],"options":null,"answer":["64"],"kp":"高速缓存"},{"id":"m2022-23","source":"2022 期中","origin":"exam","lecture":13,"topic":"有效位对 cache 命中的影响","type":"judge","difficulty":2,"stem":"在一个 8-bit 地址空间的机器上，某高速缓存共有 4 组（S=4），二路组相联（E=2），Tag 段大小 3 bit。初始状态下第 2 组（SET 2）的两行分别是 V=0、Tag=110 与 V=1、Tag=101。现要读取地址 0xd2 处的数据，该访存会命中 cache。请判断该说法是否正确。","code":null,"explanation":"错误。0xd2 = 1101 0010₂，按 [tag 3 位 | 组索引 2 位 | 块偏移 3 位] 切分得 tag = 110、组索引 = 10₂ = 2、块偏移 = 010。第 2 组中虽然有一行的 tag 恰好是 110，但它的有效位 V = 0（该行内容无效），另一行的 tag 是 101 与本次访问不符，所以这次访存不命中。访问后的更新会把 tag=110 的那一行的有效位置 1（相当于填入该块）。踩坑点：tag 相同还必须检查有效位，无效行等同于不存在，这是 cache 模拟中最容易忽略的一步。","tags":["高速缓存","有效位","命中判断"],"options":null,"answer":false,"kp":"高速缓存"},{"id":"m2022-24","source":"2022 期中","origin":"exam","lecture":13,"topic":"多次访存的命中率与 LRU 替换","type":"fill","difficulty":3,"stem":"在一个 8-bit 地址空间的机器上，某高速缓存共有 4 组（S=4），二路组相联（E=2），Tag 段大小 3 bit，替换策略为 LRU。初始状态下 SET 0~SET 3 的两行依次为：(V=1,Tag=000)、(V=0,Tag=001)；(V=0,Tag=001)、(V=1,Tag=110)；(V=0,Tag=110)、(V=1,Tag=101)；(V=1,Tag=010)、(V=0,Tag=001)。在访问地址 0xd2（不命中并按 LRU 更新第 2 组）之后，继续依次读取地址 0xc8、0x16、0x01、0xb5（均读取一个字节）。这四次数据访问的命中率是多少？","code":null,"explanation":"地址划分为 tag 3 位、组索引 2 位、块偏移 3 位。0xc8 = 110 01 000 → 组 1、tag 110，组 1 中有 V=1、tag=110 的行，命中。0x16 = 000 10 110 → 组 2、tag 000，此时组 2 中是刚被 0xd2 更新的 tag=110 行与 tag=101 行，没有 tag 000，不命中，按 LRU 替换掉 tag=101 的行。0x01 = 000 00 001 → 组 0、tag 000，与组 0 中 V=1、tag=000 的行匹配，命中。0xb5 = 101 10 101 → 组 2、tag 101，而 tag=101 的行刚被替换出去，不命中。四次访问命中 2 次，命中率为 2/4 = 50%。踩坑点：0xd2 的访存改变了第 2 组的状态，必须带着更新后的状态继续模拟，并注意 LRU 的替换对象。","tags":["高速缓存","LRU","命中率"],"options":null,"answer":["50%","1/2","0.5"],"kp":"高速缓存"},{"id":"m2022-25","source":"2022 期中","origin":"exam","lecture":13,"topic":"命中时间与不命中处罚的总延迟","type":"fill","difficulty":2,"stem":"承接上题（这四次数据访问中 2 次命中、2 次不命中）。假设该 cache 的命中时间为 10 个周期，不命中处罚为 190 个周期，则这四次数据访问的总延迟是多少个周期？","code":null,"explanation":"一次命中的时间是 10 个周期；一次不命中的总时间是命中时间加上不命中处罚，即 10 + 190 = 200 个周期。四次访问中 2 次命中、2 次不命中，所以总延迟 = 2 × 10 + 2 × 200 = 420 个周期。踩坑点：不命中处罚是“在命中时间之外额外付出”的开销，一次不命中的总时间应为 200 而不是 190；把 190 当成总时间会算成 390 周期。","tags":["命中时间","不命中处罚","总延迟"],"options":null,"answer":["420"],"kp":"高速缓存"},{"id":"m2022-26","source":"2022 期中","origin":"exam","lecture":13,"topic":"非写分配策略下的首次访存","type":"judge","difficulty":2,"stem":"考虑一个 32-bit 地址空间的机器，其高速缓存总大小为 16 Bytes、每个 cache block 为 4 Bytes、组织为全相联（S=1），替换策略为 LRU。程序如下（f 数组起始地址为 0x10000000，int 占 4 字节，临时变量 a、b、c、i 都在寄存器中，初始时 cache 为空）。假设 cache 在写命中时采用直写（write-through）、写不命中时采用非写分配（no-write-allocate），则当程序第一次运行到第 6 行 `int a = f[i];` 时，该访存会命中 cache。请判断该说法是否正确。","code":"1: #define N 20\n2: int f[N + 2];\n3: f[0] = 1;\n4: f[1] = 1;\n5: for(int i = 0; i < N; i++) {\n6:    int a = f[i];\n7:    int b = f[i + 1];\n8:    int c = a + b;\n9:    f[i + 2] = c;\n10: }","explanation":"错误。程序先执行第 3、4 行对 f[0]、f[1] 的写操作，这两次写都是写不命中；因为采用非写分配策略，写不命中不会把对应的块调入 cache，所以 cache 中仍然没有任何数据。当第一次执行到第 6 行读 f[i]（i = 0）时，该地址所在的块并不在 cache 中，因此这次访存不命中。踩坑点：非写分配意味着“写不命中既不命中、也不改变 cache 内容”，不能想当然地认为写过一次的数据就已经在 cache 里了。","tags":["写策略","非写分配","全相联"],"options":null,"answer":false,"kp":"高速缓存"},{"id":"m2022-27","source":"2022 期中","origin":"exam","lecture":13,"topic":"直写加非写分配时的命中次数","type":"fill","difficulty":3,"stem":"考虑一个 32-bit 地址空间的机器，其高速缓存总大小为 16 Bytes、每个 cache block 为 4 Bytes、全相联（S=1）、LRU 替换。程序如下（f 数组起始地址 0x10000000，int 占 4 字节，a、b、c、i 都在寄存器中，初始 cache 为空，不考虑编译优化）。假设 cache 写命中时采用直写、写不命中时采用非写分配，则整个程序的执行过程共命中 cache 多少次？","code":"1: #define N 20\n2: int f[N + 2];\n3: f[0] = 1;\n4: f[1] = 1;\n5: for(int i = 0; i < N; i++) {\n6:    int a = f[i];\n7:    int b = f[i + 1];\n8:    int c = a + b;\n9:    f[i + 2] = c;\n10: }","explanation":"块大小 4 字节正好等于一个 int，所以数组的每个元素各自占一个块。第 3、4 行的两次写不命中，因为非写分配而不会调入任何块。第 1 次循环（i=0）：读 f[0] 不命中并调入，读 f[1] 不命中（不同块）并调入，写 f[2] 不命中且不调入，命中 0 次。从第 2 次循环（i≥1）起：第 6 行读 f[i]，它在上一轮循环的第 7 行已被读入 cache，故命中；第 7 行读 f[i+1]，该地址在上一轮只是被写过（写不命中未分配），仍不在 cache 中，不命中；第 9 行写 f[i+2] 首次访问，不命中。即每轮循环恰好命中 1 次。循环共执行 20 次，命中总数为 19 次。踩坑点：块大小与元素大小相同使每个元素各占一块，且写不分配会让写过的数据在随后的读中仍然不命中。","tags":["直写","非写分配","命中次数"],"options":null,"answer":["19"],"kp":"高速缓存"},{"id":"m2022-28","source":"2022 期中","origin":"exam","lecture":13,"topic":"写回加写分配时的命中次数","type":"fill","difficulty":3,"stem":"考虑一个 32-bit 地址空间的机器，其高速缓存总大小为 16 Bytes、每个 cache block 为 4 Bytes、全相联（S=1）、LRU 替换。程序如下（f 数组起始地址 0x10000000，int 占 4 字节，a、b、c、i 都在寄存器中，初始 cache 为空，不考虑编译优化）。假设 cache 采用写回（write-back）加写分配（write-allocate），则整个程序的执行过程共命中 cache 多少次？","code":"1: #define N 20\n2: int f[N + 2];\n3: f[0] = 1;\n4: f[1] = 1;\n5: for(int i = 0; i < N; i++) {\n6:    int a = f[i];\n7:    int b = f[i + 1];\n8:    int c = a + b;\n9:    f[i + 2] = c;\n10: }","explanation":"块大小 4 字节等于一个 int，每个数组元素各占一块。采用写分配时，第 3、4 行的写不命中也会把 f[0]、f[1] 所在的块调入 cache（并置脏）。此后每一轮循环：第 6 行读 f[i]，该块在上一轮已被读入或在更早被写入，命中；第 7 行读 f[i+1]，它在上一轮第 9 行被写时因写分配已调入 cache，也命中；第 9 行写 f[i+2] 是首次访问该地址，不命中（但会分配）。于是每轮循环命中 2 次，循环执行 20 次共命中 40 次。踩坑点：写分配把“写不命中”变成“同时把块调入”，使得下一轮对同一地址的读变成命中，这正是命中次数比直写加非写分配翻倍的原因。","tags":["写回","写分配","命中次数"],"options":null,"answer":["40"],"kp":"高速缓存"},{"id":"m2023-18","source":"2023 期中","origin":"exam","lecture":13,"topic":"直接映射 cache 的命中次数统计","type":"single","difficulty":3,"stem":"某计算机地址空间 12 位，cache 被分为 S 个组，每组 E 个 cacheline，一个 cacheline 长度 2^b 字节。cache 的参数为：S=4, E=1, b=4，现在依次访问 4-14-84-114-514-124-84-4（以字节为单位，十进制），请问 cache 一共命中了几次：","code":null,"explanation":"b = 4 说明块大小为 16 字节，s = log2(4) = 2 位组索引。先把地址换成块号（地址除以 16）：4→0，14→0，84→5，114→7，514→32，124→7，84→5，4→0。直接映射下组号 = 块号 mod 4：块 0→组 0、块 5→组 1、块 7→组 3、块 32→组 0。逐次模拟：4 不命中（组 0 装入块 0）；14 命中；84 不命中（组 1 装入块 5）；114 不命中（组 3 装入块 7）；514 不命中（组 0 换成块 32）；124 命中（组 3 的块 7 仍在）；84 命中（组 1 的块 5 仍在）；4 不命中（组 0 已被块 32 占据）。共命中 3 次，选 D。踩坑点：地址要先除以块大小得到块号，再对组数取模得到组号；4 与 14 落在同一块，所以第 2 次访问是命中。","tags":["高速缓存","直接映射","命中率"],"options":["0","1","2","3"],"answer":3,"kp":"高速缓存"},{"id":"m2023-27","source":"2023 期中","origin":"exam","lecture":13,"topic":"直接映射 cache 的命中次数","type":"fill","difficulty":2,"stem":"假想一个存储系统：地址宽度 4 位（内存总容量 16 字节），高速缓存采用直接映射，总容量 8 字节，每个 cache block 为 2 字节，初始状态为空。若访存地址序列（十进制）为 5、10、15、6、11、4、13，每次访存读一个字节，则这段序列中高速缓存共发生多少次命中（hit）？","code":null,"explanation":"B = 2 字节 → 块偏移 b = 1 位；总容量 8 字节、直接映射（E=1）→ 组数 S = 8/2 = 4，组索引 s = 2 位；地址 4 位，故 tag = 4 - 2 - 1 = 1 位。把地址写成 [tag|组|偏移]：5 = 0101 → 组 2、tag 0；10 = 1010 → 组 1、tag 1；15 = 1111 → 组 3、tag 1；6 = 0110 → 组 3、tag 0；11 = 1011 → 组 1、tag 1；4 = 0100 → 组 2、tag 0；13 = 1101 → 组 2、tag 1。逐次模拟：5 缺失（组 2 装入 tag0，块 M[4-5]）；10 缺失（组 1 装 tag1，M[10-11]）；15 缺失（组 3 装 tag1，M[14-15]）；6 缺失（组 3 换成 tag0，M[6-7]）；11 命中（组 1 的 tag1 仍有效）；4 命中（组 2 的 tag0 仍有效）；13 缺失（组 2 换成 tag1，M[12-13]）。命中 2 次、缺失 5 次。踩坑点：先算准 tag/组/偏移的位数，直接映射下同组是直接替换，没有 LRU 可言。","tags":["高速缓存","直接映射","命中次数"],"options":null,"answer":["2"],"kp":"高速缓存"},{"id":"m2023-28","source":"2023 期中","origin":"exam","lecture":13,"topic":"实际 cache 的组数与地址划分","type":"fill","difficulty":2,"stem":"在 Intel Core i7 中，一级数据高速缓存（L1 Data Cache）容量为 32 KB，每个高速缓存块为 64 字节，8 路组相联，地址宽度为 47 位。该高速缓存共有多少个组（Set）？","code":null,"explanation":"组数 S = 缓存容量 /（相联度 × 块大小）= 32768 / (8 × 64) = 32768 / 512 = 64，即 6 位组索引。地址划分：块偏移 b = log2(64) = 6 位，组索引 s = log2(64) = 6 位，剩余的 tag = 47 - 6 - 6 = 35 位。踩坑点：忘记除以相联度会得到 512 组，那样 tag 只剩 28 位，与教材给出的 i7 参数不符；组数、路数与块大小三者的关系是 S = C/(E×B)。","tags":["高速缓存","组相联","地址划分"],"options":null,"answer":["64"],"kp":"高速缓存"},{"id":"m2024-14","source":"2024 期中","origin":"exam","lecture":13,"topic":"高速缓存的相联度、块大小与写策略","type":"single","difficulty":2,"stem":"考虑通用的高速缓存存储器，下列说法错误的是：","code":null,"explanation":"B 错在“越大越好”：块变大确实能更好地利用空间局部性，但不命中处罚也随之增大（要把整块搬进来），块过大还会摊薄空间局部性的收益、加剧冲突，因此块大小必须折中；而且时间局部性来自对同一数据的重复访问，与块大小无关，说“较大块能利用时间局部性”本身也错。A 正确：相联度越高，组内比较与选择的逻辑越复杂，命中时间越长，L1 为保证高主频通常用低相联度（如 8 路甚至直接映射）。C 正确：写回只在替换时才写回内存，能显著减少总线流量；写不命中时才有写分配/写不分配的选择。D 正确：层次越深、访存代价越高，越倾向用写回。","tags":["高速缓存","相联度","写策略"],"options":["较高的相联度的硬件实现复杂度更大，而且很难使之速度变快。较高的相联度会增加命中时间，因为复杂性增加了。为实现高工作频率，L1 高速缓存一般会选择较低的相联度","缓存块越大越好，较大的块能利用程序中的时间和空间局部性，帮助提高命中率","在高速缓存的写入策略中，由于局部性，写回能减少总线访问量。考虑缓存一致性，写不命中时不能采用写回，而要采用写分配或写不分配","一般而言，高速缓存越往下层，越可能使用写回而不是直写"],"answer":1,"kp":"高速缓存"},{"id":"m2024-16","source":"2024 期中","origin":"exam","lecture":13,"topic":"高速缓存扩容方式的选择","type":"single","difficulty":2,"stem":"某一计算机内存空间大小为 32 Bytes。假设 Cache 容量为 8 Bytes、初始状态为空。由于容量过小需要扩容，若为充分利用原有硬件设计，不希望大幅度修改 cache 地址解析逻辑，那么最适宜采用的扩容方式是：","code":null,"explanation":"地址解析逻辑由组索引位数 s 和块偏移位数 b 决定，二者又由组数 S 与块大小 B 决定，所以扩容时保持 S 与 B 不变最省事：容量 = S×E×B，把每一组的行数 E（相联度）翻倍，容量随之翻倍，而地址划分完全不用改，故选 C。A 增加 set 数会改变 s，需要重新设计地址译码与选择逻辑；B 增大 block 会改变 b，同样要改地址解析，而且块变大不命中处罚也会增加；D 显然不对。这也是实际处理器上常用提高相联度来扩大容量的原因。","tags":["高速缓存","扩容","相联度"],"options":["增加 set 数","增大 block","增加相联度","以上皆不是"],"answer":2,"kp":"高速缓存"},{"id":"m2024-17","source":"2024 期中","origin":"exam","lecture":13,"topic":"由命中率反推 cache 块大小","type":"single","difficulty":2,"stem":"某计算机内存空间为 32 Bytes（地址 0~31）。Cache 容量为 16 Bytes，初始状态为空。对访存地址序列 0、2、4、8、12、14（十进制，单位 Byte，每次读一个字节）其命中率为 33.3%，则该 Cache 的 block 大小是：","code":null,"explanation":"6 次访问命中率 33.3% 意味着命中 2 次。逐一代入：若 B=4，则块为 [0-3]、[4-7]、[8-11]、[12-15]，访问 0 不命中（调入 [0-3]）、2 命中、4 不命中、8 不命中、12 不命中（调入 [12-15]）、14 命中，共命中 2 次，恰为 2/6 = 33.3%。若 B=2，每个地址各自成块，6 次全部不命中；若 B=8，块为 [0-7]、[8-15]，命中 2、4、12、14 共 4 次（66.7%）。所以只能是 B=4，选 B。踩坑点：命中率要换算成“命中次数”再逐块模拟，注意同一块内的其它地址也会因此受益。","tags":["高速缓存","块大小","命中率"],"options":["2 bytes","4 bytes","8 bytes","以上皆不是"],"answer":1,"kp":"高速缓存"},{"id":"s2025b-22","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"Cache 三种不命中的名称","type":"multi","difficulty":2,"stem":"高速缓存（Cache）的三种未命中（Miss）分别是什么？（不定项选择，全部选对才得分）","code":null,"explanation":"三种不命中的唯一正确划分是：冷启动（义务）不命中——该块第一次被访问，缓存里必然没有；容量不命中——工作集大于缓存容量，反复被访问的块被挤出；冲突不命中——多个经常使用的块映射到同一个组（直接映射或组相联的组内位置不足）而互相驱逐。答「写不命中」是把「缺失的读写处理策略」与「不命中的分类」混淆了；「指令不命中/译码不命中」更是杜撰。判断不命中类型时，可以问：如果缓存无限大还会有这次缺失吗？有 → 冷启动；没有，但把组数加大会消失 → 冲突；两者都不是 → 容量。","tags":["Cache","不命中分类","三项缺失"],"options":["冷启动不命中（义务不命中），Cold / Compulsory miss","容量不命中，Capacity miss","冲突不命中，Conflict miss","写不命中，Write miss","指令不命中，Instruction miss","译码不命中，Decode miss"],"answer":[0,1,2],"kp":"高速缓存"},{"id":"s2025b-23","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"冲突不命中的典型场景","type":"single","difficulty":2,"stem":"下列哪种情形属于冲突不命中（Conflict miss）？","code":null,"explanation":"冲突不命中的本质是「映射方式的限制」：若直接映射，任何两个组号相同的块都必须争用同一个位置；即便是 8 路组相联，同一个组里也只能容纳 8 个块，第 9 个热点块映射进来就会驱逐别人。选项 B 是冷启动不命中（第一次必然缺失），选项 C 是容量不命中（即使组数很多也会缺失），选项 D 是写不命中，与前三种分类不在同一维度。做题时可用「把缓存改成全相联，缺失会不会消失」来区分：会消失的是冲突不命中。","tags":["Cache","冲突不命中","直接映射"],"options":["多个经常使用的块映射到同一个组，组内位置不足，它们互相驱逐","第一次访问某个数据块，缓存中肯定没有它","程序的工作集大于缓存的容量，块被反复挤出","写操作时缓存中没有对应的块"],"answer":0,"kp":"高速缓存"},{"id":"s2025b-24","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"直接映射 Cache 的命中与不命中统计","type":"single","difficulty":3,"stem":"对下面的 Cache 依次访问地址序列（十进制，每次访问 1 个字节）：18、40、50、16、43、48。这个过程中该高速缓存共发生几次命中、几次不命中？","code":"系统参数：地址空间 64 字节（地址 6 位 = tag 2 位 + set 2 位 + offset 2 位）；\n直接映射 Cache 容量 16 字节，块大小 B = 4 字节；写分配 + 写返回策略。\n初始状态（Tag 用二进制表示）：\n  v  Tag  Block\nset0  1   11   Mem[48-51]\nset1  1   00   Mem[4-7]\nset2  1   10   Mem[40-43]\nset3","explanation":"先分解每个地址（6 位：t t s s o o）：18 = 010010 → tag 01、set 00、off 10；40 = 101000 → tag 10、set 10、off 00；50 = 110010 → tag 11、set 00、off 10；16 = 010000 → tag 01、set 00、off 00；43 = 101011 → tag 10、set 10、off 11；48 = 110000 → tag 11、set 00、off 00。逐次判断：18 访问 set0，当前 tag = 11，不命中（冲突），装入 Mem[16-19] 且 tag 记为 01；40 访问 set2，tag 恰好是 10，命中；50 访问 set0，tag 是 01，不命中，装入 Mem[48-51]，tag 记为 11；16 访问 set0，tag 是 11，不命中，装入 Mem[16-19]，tag 记为 01；43 访问 set2，tag 是 10，命中；48 访问 set0，tag 是 01，不命中，装入 Mem[48-51]，tag 记为 11。合计命中 2 次（40、43）、不命中 4 次，与官方答案一致。","tags":["Cache","直接映射","命中率"],"options":["2 次命中、4 次不命中","4 次命中、2 次不命中","3 次命中、3 次不命中","1 次命中、5 次不命中"],"answer":0,"kp":"高速缓存"},{"id":"s2025b-25","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"Cache 状态表的更新结果","type":"single","difficulty":3,"stem":"承接上一题的访问序列 18、40、50、16、43、48。全部访问结束后，set0 中存放的是哪个内存块？","code":"初始状态：\n  v  Tag  Block\nset0  1   11   Mem[48-51]\nset1  1   00   Mem[4-7]\nset2  1   10   Mem[40-43]\nset3\n序列：18 40 50 16 43 48（每次 1 字节）","explanation":"set0 在本次序列中被访问了三次：18（tag 01，装入 Mem[16-19]）、50（tag 11，装入 Mem[48-51]）、16（tag 01，装入 Mem[16-19]）、48（tag 11，装入 Mem[48-51]）——注意 18 与 16 的 tag 都是 01（同一个块 Mem[16-19]），50 与 48 的 tag 都是 11（同一个块 Mem[48-51]），它们交替命中同一个 set，所以每次都在「冲突不命中」后互相驱逐。最后一次访问 48 装入的正是 Mem[48-51]，因此最终 set0 存放 Mem[48-51]，恰好与初始状态相同（这是个巧合，不代表中间没有发生替换）。Mem[52-55] 属于 set1，序列中没有任何地址落在 set1/set3 上，它们的初始内容保持不变。","tags":["Cache","替换过程","直接映射"],"options":["Mem[48-51]","Mem[16-19]","Mem[52-55]","set0 为空（v = 0）"],"answer":0,"kp":"高速缓存"},{"id":"s2025b-26","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"写返回策略下的写回判断","type":"judge","difficulty":3,"stem":"承接上面的 Cache 访问序列（18、40、50、16、43、48，全部是每次访问 1 个字节的读操作，Cache 采用写分配 + 写返回策略）。判断：整个过程中没有任何脏块需要写回内存。","code":"初始状态：\n  v  Tag  Block\nset0  1   11   Mem[48-51]\nset1  1   00   Mem[4-7]\nset2  1   10   Mem[40-43]\nset3\n序列：18 40 50 16 43 48","explanation":"「写返回」的含义是：只有被修改过（脏）的块在替换时才需要写回内存，干净的块直接丢弃即可。本题的六个访问全部是读取，没有任何字节被写入，因此被驱逐的块始终是干净的，替换时不会产生写回流量——所以该判断为「真」。这也提示我们：写返回策略相比写直达能显著减少内存写流量，但代价是需要为每一行维护脏位（dirty bit），并在替换时承担一次写回。若序列中出现了写操作（例如 18 的写命中），情况就会改变，被修改过的块在下次被驱逐时必须写回。","tags":["写返回","脏位","Cache"],"options":null,"answer":true,"kp":"高速缓存"},{"id":"s2025b-27","source":"2025 第 2 次阶段测验","origin":"exam","lecture":13,"topic":"现代 CPU 各级 Cache 的容量","type":"single","difficulty":2,"stem":"Intel Core i7 CPU 的 L2 Cache 容量，最有可能是下面哪一种？","code":null,"explanation":"现代 i7 的层次结构大致是：L1 数据/指令 Cache 各 32 kB（选项 B 是典型的 L1 容量），L2 每核 256 kB，L3 为多核共享、容量 8 MB 甚至更大（选项 D 是典型的 L3 容量）。因此 L2 最有可能是 256 kB。记住这个数量级有助于理解层次结构的设计：越靠近 CPU 容量越小、越快越贵；每往下一级容量大约放大一个数量级。4 kB 太小，连早期的 L1 都不止这个规模。","tags":["Cache","存储层次","L2"],"options":["4 kB","32 kB","256 kB","8 MB"],"answer":2,"kp":"高速缓存"},{"id":"gen-c13-01","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"缓存参数与地址划分","type":"single","difficulty":1,"stem":"Intel Core i7 的 L1 数据缓存为 32 KB、8 路组相联、块大小 64 字节，讲义把地址长度取为 47 位。对地址 0x00007f7262a1e010，它的块内偏移和组索引分别是：","code":null,"explanation":"先按讲义第 13 讲「Example: Core i7 L1 Data Cache」的方法算参数：块大小 B = 64，所以偏移 b = 6 位；组数 S = C/(E×B) = 32768/(8×64) = 64，所以组索引 s = 6 位；标签位数 t = 47 − 6 − 6 = 35。再看地址 0x…e010，低 16 位是 0xe010 = 1110 0000 0001 0000b：最低 6 位 010000b = 0x10 是块内偏移；接下来的 6 位（第 6~11 位）全是 0，即组索引 0x0；剩下的高位构成标签 0x7f7262a1e（讲义「Example: Core i7 L1 Data Cache」的结果完全一致）。选项 B、C 把偏移与组索引的位置搞混；选项 D 直接把块大小 64（即 0x40）当成了偏移值。","tags":["缓存参数","地址划分","i7"],"options":["块内偏移 0x10，组索引 0x0","块内偏移 0x10，组索引 0x10","块内偏移 0x0，组索引 0x10","块内偏移 0x40，组索引 0x0"],"answer":0,"kp":"高速缓存"},{"id":"gen-c13-02","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"直接映射缓存的命中率","type":"single","difficulty":2,"stem":"一个直接映射缓存：地址 4 位（地址空间 16 字节）、S = 4 组、每组 E = 1 路、块大小 B = 2 字节。按字节读取的访问序列是 0、1、7、8、0。这个序列的命中率是：","code":"地址 4 位:  t = 1 位,  s = 2 位,  b = 1 位\n块 0: M[0-1]   块 1: M[2-3]   块 2: M[4-5]   块 3: M[6-7]\n块 4: M[8-9]   块 5: M[10-11] 块 6: M[12-13] 块 7: M[14-15]\n\n访问序列（每次读 1 字节，括号内为二进制地址）:\n0 [0000], 1 [0001], 7 [0111], 8 [1000], 0 [0000]","explanation":"按讲义第 13 讲「Direct-Mapped Cache Simulation」的分析方法：直接映射下组索引取地址的中间两位（第 1~2 位），标签取最高 1 位。逐次分析：0[0000] 组 0、标签 0，缓存为空 → 缺失，装入 M[0-1]；1[0001] 组 0、标签 0 → 命中；7[0111] 组 1（第 2 位为 1）、标签 0 → 缺失，装入 M[6-7]；8[1000] 组 0、标签 1 → 与组 0 中标签 0 的那一行不匹配 → 缺失，把 M[0-1] 替换掉；0[0000] 组 0、标签 0 → 组 0 里现在是标签 1 的块 → 再次缺失。即 5 次访问 4 次缺失、1 次命中，命中率 = 1/5 = 20%，与讲义「Direct-Mapped Cache Simulation」的 miss, hit, miss, miss, miss 一致。作为对照，把同一序列放到 2 路组相联（S=2、E=2、B=2）上时块 0 不会被块 8 驱逐，结果是 miss, hit, miss, miss, hit，命中率 40%。","tags":["直接映射","命中率","缓存模拟"],"options":["20%","40%","60%","80%"],"answer":0,"kp":"高速缓存"},{"id":"gen-c13-03","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"组相联与 LRU 替换","type":"single","difficulty":3,"stem":"某缓存有 2 个组、每组 2 路、块大小 4 字节，按字节寻址（地址 8 位）。访问序列（字节地址）为 0x00、0x04、0x08、0x00、0x10，替换策略为 LRU。最后一次访问 0x10 发生缺失时被驱逐的块是：","code":null,"explanation":"先按讲义第 13 讲「E-way Set Associative Cache」的方法做地址划分：块大小 4 字节 → 偏移 b = 2 位；2 个组 → 组索引 s = 1 位，取地址的第 2 位；标签 t = 8 − 2 − 1 = 5 位，即组号 = (addr >> 2) & 1、标签 = addr >> 3。逐次访问：(1) 0x00 → 组 0、标签 0，缺失，装入组 0 第 1 路；(2) 0x04 → 组 1、标签 0，缺失，装入组 1；(3) 0x08 → 组 0、标签 1，缺失，装入组 0 第 2 路，此时组 0 已满（标签 0 与标签 1）；(4) 0x00 → 组 0、标签 0，命中，并把标签 0 所在行更新为最近使用（MRU）；(5) 0x10 → 组 0（(0x10>>2)&1 = 0）、标签 2，缺失，需要在组 0 中驱逐最久未使用的行，即第 (3) 步装入、之后再没被引用过的标签 1 行，也就是地址 0x08~0x0B 所在的块。选项 A 的那一行刚在第 (4) 步命中，是 MRU，不会被驱逐；选项 B 在组 1，与本组无关；选项 D 的块从未被访问过。","tags":["组相联","LRU","替换策略"],"options":["地址 0x00~0x03 所在的块","地址 0x04~0x07 所在的块","地址 0x08~0x0B 所在的块","地址 0x0C~0x0F 所在的块"],"answer":2,"kp":"高速缓存"},{"id":"gen-c13-04","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"AMAT 计算","type":"single","difficulty":2,"stem":"某缓存的命中时间为 2 个时钟周期，缺失代价为 80 个时钟周期，程序的缓存命中率为 95%。该缓存的平均访存时间（AMAT）是：","code":null,"explanation":"AMAT = 命中时间 + 缺失率 × 缺失代价 = 2 + (1 − 0.95) × 80 = 2 + 4 = 6 个时钟周期。讲义第 13 讲用类似算例说明为什么性能指标要看「缺失率」：命中时间 1 周期、缺失代价 100 周期时，97% 命中率的 AMAT 是 1 + 0.03×100 = 4 周期，99% 命中率只有 1 + 0.01×100 = 2 周期——命中率只差 2 个百分点，平均访存时间却相差一倍，因为缺失代价比命中时间大两个数量级。选项 B（4 周期）只算了 0.05 × 80 的缺失部分、忘记加命中时间；选项 C（78 周期）错把命中率 95% 当作缺失率乘上缺失代价；选项 D（82 周期）直接把缺失代价加到命中时间上，忽略了它只以 5% 的概率发生。","tags":["AMAT","缺失代价","命中率"],"options":["6 个周期","4 个周期","78 个周期","82 个周期"],"answer":0,"kp":"高速缓存"},{"id":"gen-c13-05","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"缓存写策略","type":"single","difficulty":1,"stem":"关于缓存的写命中与写缺失策略，下列说法正确的是：","code":null,"explanation":"讲义第 13 讲「What about writes?」把两种决策组合起来：写命中时可以写直达（立即写到下一级）或写回（推迟到该行被替换时再写）；写缺失时可以写分配（先把块取进缓存再修改）或非写分配（直接写到下一级、不载入缓存）。实际系统常见的两套搭配就是「写直达 + 非写分配」和「写回 + 写分配」，后者需要给每行增加一个脏位记录是否被写过。选项 B 错在脏位是写回策略才需要的（写直达时缓存与下一级始终一致）；选项 C 把「写分配」和非写分配解释反了；选项 D 错在写回策略下写命中的动作只是更新块内容并把脏位置 1（脏位是「粘性」的，只有在该行被驱逐时才清 0），整块写回发生在驱逐时。","tags":["写策略","脏位","写分配"],"options":["写回（write-back）配写分配（write-allocate）是常见组合，写直达（write-through）配非写分配（no-write-allocate）也是常见组合","写直达必须配合脏位（dirty bit）使用，因为需要记录哪一行被改写过","非写分配是指写命中时先更新缓存、再把数据写到下一级存储器","写回策略要求每次写命中都立刻把整块写回下一级存储器"],"answer":0,"kp":"高速缓存"},{"id":"gen-c13-06","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"矩阵乘法的缺失分析","type":"multi","difficulty":2,"stem":"关于矩阵乘法不同循环顺序的缓存缺失（设缓存块能容纳 4 个 double、矩阵规模远大于缓存），下列说法正确的有（多选）：","code":null,"explanation":"讲义第 13 讲「Miss Rate Analysis for Matrix Multiply」的结论表：ijk（及 jik）内层循环是 B 列方向、A 行方向、C 固定，缺失约为 0.25 + 1.0 + 0 = 1.25 次/迭代；kij（及 ikj）内层循环三个矩阵都按行方向访问，缺失约为 0 + 0.25 + 0.25 = 0.5 次/迭代；jki（及 kji）内层循环对 A、C 都是列方向，缺失约为 1.0 + 0 + 1.0 = 2.0 次/迭代，是六种写法里最差的。因此选项 C 说反了（kij 是 0.5 而不是 2.0）。选项 E 错在循环重排改变的正是访存地址的步长，而步长直接决定空间局部性——把 B 的访问从列方向改成行方向，就能把 1.0 次/迭代的必然缺失降到 0.25 次/迭代。","tags":["矩阵乘法","缺失率","循环重排"],"options":["C 语言数组按行主序存放，内层循环沿行方向以步长 1 访问时可以充分利用空间局部性","ijk 版本的内层循环对 B 是列方向访问、每次迭代都必然缺失，把 A、B、C 合起来约为每迭代 1.25 次缺失","kij 版本的内层循环对 A、B 都是列方向访问，缺失约为每迭代 2.0 次","jki 与 kji 版本的内层循环对 A、C 都是列方向访问，缺失约为每迭代 2.0 次，是三种里最差的","循环重排只会影响时间局部性，与空间局部性无关"],"answer":[0,1,3],"kp":"高速缓存"},{"id":"gen-c13-07","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"步长与缺失率模型","type":"judge","difficulty":1,"stem":"判断：以双字（8 字节）为单位的访问步长 s 不超过 8 时，64 字节块缓存的缺失率可以近似为 s/8；当 s 超过 8 时，缺失率恒为 1（每次访问都缺失）。","code":null,"explanation":"讲义第 13 讲「Cache Block Size Effects from Memory Mountain」给出的模型曲线是：块大小 64 字节时一个块能装 8 个双字，步长 s（以 8 字节为单位）不超过 8 时，平均每访问 8/s 次才会用到一个新的块，于是缺失率 ≈ s/8（s=1 时约 1/8，s=8 时正好每次访问都落在新块上、缺失率为 1）；当 s>8 时，相邻两次访问分别落在不同块中且不会复用，缺失率固定为 1，读吞吐量降到最低。这条规律就是把「空间局部性」量化的结果，也解释了为什么内层循环要尽量以步长 1 访问连续内存。","tags":["步长","缺失率","空间局部性"],"options":null,"answer":true,"kp":"高速缓存"},{"id":"gen-c13-08","source":"自编 · 第 13 讲","origin":"created","lecture":13,"topic":"相联度与缺失类型","type":"judge","difficulty":2,"stem":"判断：若某程序在容量为 C 的直接映射缓存上出现了容量缺失（capacity miss），那么在其他参数不变的前提下把相联度提高到 8 路，就一定能让这些缺失消失。","code":null,"explanation":"容量缺失的成因是程序当前的工作集（活跃块集合）大于整个缓存的容量，与块的放置策略无关；提高相联度只能减少冲突缺失（多个块被迫映射到同一行或同一小组而互相驱逐），对容量缺失无效。要消除容量缺失只能增大缓存容量，或者改写程序缩小工作集。讲义第 12、13 讲把三类缺失区分得很清楚：冷启动缺失是每个块第一次访问的必然代价，冲突缺失由放置策略引起，容量缺失由工作集大小引起。也正因如此，「0、8、0、8」这类交替引用改成 2 路组相联就能救活（冲突缺失消失），而「工作集 100 个块、缓存只有 10 个块」的程序换什么相联度都没用。","tags":["容量缺失","冲突缺失","相联度"],"options":null,"answer":false,"kp":"高速缓存"},{"id":"f2014-07","source":"2014 期末","origin":"exam","lecture":14,"topic":"编译器安全优化策略","type":"single","difficulty":1,"stem":"根据编译器安全优化的策略，如下手工程序代码的优化，哪个达不到优化效果？","code":null,"explanation":"循环展开能减少循环控制开销并给指令级并行留出空间；把中间结果保存在寄存器里可以消除多余的存储器引用；拆出多个累加变量能打破累加链上的数据相关——这三者都是教材列举的标准优化手段。相反，“把函数调用移到循环内”会把原本只执行一次的计算变成每次迭代都执行，恰恰与“代码移动（把循环不变的计算移到循环外）”背道而驰，只会更慢。该题亦见于 2015 年期末（选项顺序不同），此处按最早出现的年份收录。","tags":["程序优化","代码移动","循环展开"],"options":["循环展开，以减少循环的迭代次数","将函数调用移到循环内，以提高程序的模块性","消除不必要的存储器引用，减少访存开销","分离多个累计变量，以提高并行性"],"answer":1,"kp":"程序优化"},{"id":"f2016-05","source":"2016 期末","origin":"exam","lecture":14,"topic":"循环不变量外提（strlen 提升）","type":"single","difficulty":2,"stem":"对于下面这段程序，哪个描述是正确的","code":"void upper(char *s)\n{\n    for (int i = 0; i < strlen(s); i++)\n        if (s[i] >= 'a' && s[i] <= 'z')\n            s[i] += ('A' - 'a');\n}","explanation":"原循环每轮都重新调用 strlen 从头扫描整个字符串，总代价是 O(N²)（不是 O(NlogN)），A 错。把 strlen 提到循环外只扫描一次，循环体本身是线性的，总时间变为 O(N)，与长度线性相关，B 对。C、D 都把讨论引向局部性：这一改动消除的是每轮重复扫描（访问次数与访问的时间分布都变了），而“时间局部性”刻画的正是同一数据被反复访问的程度，因此“不影响时间局部性”的说法站不住；题目要考查的是“使运行时间与长度线性相关”这一代码移动带来的效果，故选 B。","tags":["程序优化","代码移动","局部性"],"options":["假设 s 的长度为 N，该程序的时间复杂度为 O(NlogN)","将 “for(int i=0; i<strlen(s); i++){}” 修改为 “int len = strlen(s); for(int i=0; i<len; i++){}” 可以使程序运行时间与 s 的长度线性相关","B 选项中的修改策略不影响程序的空间局部性与时间局部性","B 选项中的修改策略仅影响程序的空间局部性，不影响时间局部性"],"answer":1,"kp":"程序优化"},{"id":"f2021-06","source":"2021 期末","origin":"exam","lecture":14,"topic":"程序优化的限制（浮点不可结合）","type":"single","difficulty":2,"stem":"以下关于程序设计优化的说法，错误的是：","code":null,"explanation":"C 错误（本题选它）：浮点加法/乘法不满足结合律与分配律，改变运算顺序会改变舍入结果，破坏程序语义，因此大多数编译器（按语言标准的默认设置）不会擅自重排浮点合并运算；程序员需要显式优化或使用 -ffast-math 之类放宽语义的选项才可能让编译器这样做。A 对：循环展开可以减少循环控制开销，并为指令调度、进一步减少关键路径上的操作数创造条件。B 对：把单一累积变量拆成多个（如 sum1、sum2、…）可以打破串行的加法依赖链，提高指令级并行度。D 对：展开过度会增加寄存器压力、代码体积和指令缓存压力，性能可能反而下降。踩坑点：整数运算可以自由重排（在模运算意义下），浮点不行。","tags":["程序优化","循环展开","浮点结合律"],"options":["循环展开有助于进一步变换代码，减少关键路径上的操作数量。","分离多个累积变量计算可以提高并行性。","大多数编译器会改变浮点数的合并运算（如加法和乘法）顺序以提高程序性能。","循环展开的程度增加并不一定能改善程序运行效率，反而会变差。"],"answer":2,"kp":"程序优化"},{"id":"lab2025-34","source":"2025 Lab 测验","origin":"exam","lecture":14,"topic":"矩阵转置的分块（blocking）优化","type":"single","difficulty":3,"stem":"CacheLab Part B 中，朴素的逐行扫描转置（for i ... for j ... B[j][i] = A[i][j]）性能不佳，因为它在写入矩阵 B 时具有很差的空间局部性。Blocking（分块）策略的核心思想是如何解决这个问题的？","code":null,"explanation":"分块的核心是把大矩阵切成「能放进缓存的小块」，然后在块内完成读写，使得被载入缓存的数据在被替换之前就被充分利用（时间局部性），块内相邻元素又满足空间局部性，从而显著减少不命中（C 对）。选项 A 只是把差局部性从 B 转移到 A，没有解决问题（转置中总有一侧的访问步长很大）。选项 B 的对角线处理是**避免冲突不命中**的技巧（尤其 32×32 的 8 路组相联），属于分块之后的进一步微调，而不是分块的定义。选项 D 描述的是循环展开加局部变量缓存，虽然也有帮助，但它的出发点是减少对同一内存位置的反复访问，而不是分块。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["CacheLab","分块","矩阵转置","局部性"],"options":["交换 i 和 j 循环的顺序改为逐列扫描，这样 A 的访问变差，但 B 的访问具有良好的空间局部性","一次只处理一个对角线元素，使用局部变量存储它以避免冲突不命中，然后再处理非对角线元素","将大矩阵划分为适合装入缓存的小子矩阵（块）。一次只对一个块做转置，可以最大化局部性：重复使用刚从 A 读入缓存的数据，同时改善对 B 对应块写入的局部性","利用 12 个局部变量，一次性从 A 读取 12 个元素，转置后再把这 12 个元素写入 B 的不同行中"],"answer":2,"kp":"高速缓存"},{"id":"m2013-14","source":"2013 期中","origin":"exam","lecture":14,"topic":"程序性能优化的常见误区","type":"multi","difficulty":3,"stem":"下面哪些选项是**错误**的？","code":null,"explanation":"A 错：时间复杂度只描述增长趋势，常数因子、实际输入规模与缓存行为都会影响绝对时间，小 N 时 O(N) 算法完全可能更快。B 错：整数的结合律在补码回绕意义下成立，但浮点加法不满足结合律（舍入误差不同），而且存在内存别名时重排也可能改变语义，所以「总是可以使用」不成立。C 对（因此不是答案）：展开级数过大可能导致寄存器溢出（spill）、指令缓存缺失、代码膨胀，性能反而下降。D 错：预测准确率取决于程序的分支方向分布，若程序中大量分支是跳转的，则「总预测跳转」更准，没有任何方向的预测策略是普遍更优的。","tags":["程序优化","浮点结合律","分支预测"],"options":["同一个任务采用时间复杂度为 O(logN) 的算法一定比采用 O(N) 的算法的执行时间短","编译器进行程序优化时，总是可以使用算术结合律来减少计算量","增大循环展开（loop unrolling）的级数，有可能降低程序的执行性能（即增加执行时间）","分支预测时，「总是预测不跳转」（branch not taken）一定比「总是预测跳转」（branch taken）预测准确率高"],"answer":[0,1,3],"kp":"程序优化"},{"id":"m2013-15","source":"2013 期中","origin":"exam","lecture":14,"topic":"编译器可自动完成的优化变换","type":"multi","difficulty":3,"stem":"以下哪些程序优化编译器**总是**可以自动进行？（假设 int i、int j、int A[N]、int B[N]、int m 都是局部变量，N 是整型常量，int foo(int) 是一个函数）","code":"A. 优化前: for (j = 0; j < N; j++) m += i*N*j;\n   优化后: int temp = i*N; for (j = 0; j < N; j++) m += temp*j;\n\nB. 优化前: for (j = 0; j < N; j++) B[i] *= A[j];\n   优化后: int temp = B[i]; for (j = 0; j < N; j++) temp *= A[j]; B[i] = temp;\n\nC. 优化前: for (j = 0; j < N; j++) m = (m + A[j]) + B[j];\n   优化后: for (j = 0; j < N; j++) m = m + (A[j] + B[j]);\n\nD. 优化前: for (j = 0; j < foo(N); j++) m++;\n   优化后: int temp = foo(N); for (j = 0; j < temp; j++) m++;","explanation":"A 可以：i*N 是循环不变量，把它提到循环外（代码外提/减少重复计算）不改变语义，因为 i、N 都是局部 int 且循环体内没有写 i。B 不可以：编译器无法证明 A[j] 不会与 B[i] 别名（A、B 都是传入的数组指针，可能指向同一块内存），把 B[i] 累积到临时变量再写回会改变语义（memory aliasing）。C 可以：m、A[j]、B[j] 都是 int，重结合律在补码回绕语义下等价（本题官方答案即认为可以）。D 不可以：foo 是函数调用，编译器无法保证它没有副作用（如修改全局变量、打印输出），也不能保证每次调用返回相同结果，因此既不能把 foo(N) 提到循环外，也不能把它当循环不变量。踩坑点：别名与函数副作用是阻止编译器自动优化的两大障碍；浮点运算还需要额外考虑结合律不成立（见 2015 年同类题的 C 选项）。","tags":["循环不变量","内存别名","函数副作用"],"options":["A","B","C","D"],"answer":[0,2],"kp":"程序优化"},{"id":"m2014-12","source":"2014 期中","origin":"exam","lecture":14,"topic":"程序性能与指令级并行","type":"single","difficulty":2,"stem":"下面关于程序性能的说法中，哪种是正确的？","code":null,"explanation":"A 错：只有功能部件空闲还不够，程序本身必须存在可并行的指令（数据流允许并行执行），且受关键路径限制。B 错：复杂度只反映增长趋势，常数因子与实际输入规模会让小 N 时 O(N) 算法更快。C 错：转移预测可能失败，预测错误要冲刷流水线，错误代价正是预测技术的主要成本。D 对：展开级数过大可能超出寄存器数量导致溢出（spill）写栈、代码膨胀导致指令缓存缺失，性能可能下降。踩坑点：优化不是「越多越好」，展开级数要与寄存器资源匹配。","tags":["指令级并行","分支预测","循环展开"],"options":["处理器内只要有多个功能部件空闲，就能实现指令并行，从而提高程序性能","同一个任务采用时间复杂度为 O(logN) 算法一定比采用复杂度为 O(N) 算法的执行时间短","转移预测总是能带来好处，不会产生额外代价，对提高程序性能有帮助","增大循环展开（loop unrolling）的级数，有可能降低程序的性能（即增加执行时间）"],"answer":3,"kp":"程序优化"},{"id":"m2014-13","source":"2014 期中","origin":"exam","lecture":14,"topic":"编译器可自动完成的优化变换","type":"single","difficulty":3,"stem":"仅考虑以下代码，哪个程序优化是编译器**总是**可以自动进行的？（假设 int i、int j、int A[N]、int B[N]、int m、int *p 都是局部变量，N 是整型常量，int foo(int) 是一个函数）","code":"A. 优化前: for (j = 0; j < N; j++) B[i] *= A[j];\n   优化后: int temp = B[i]; for (j = 0; j < N; j++) temp *= A[j]; B[i] = temp;\n\nB. 优化前: for (j = 0; j < N; j++) m += i*N*j;\n   优化后: int temp = i*N; for (j = 0; j < N; j++) m += temp*j;\n\nC. 优化前: i = foo(N); j = foo(N); if (*p != 0) m = j;\n   优化后: j = foo(N); if (*p != 0) m = j;\n\nD. 优化前: for (j = 0; j < foo(N); j++) m++;\n   优化后: int temp = foo(N); for (j = 0; j < temp; j++) m++;","explanation":"B 可以：i*N 是循环不变量，提到循环外不改变语义（i、N 均为局部 int，循环体内不修改 i）。A 不可以：编译器无法证明 A[j] 不会与 B[i] 别名（两个数组指针可能指向同一块内存），把 B[i] 缓存在临时变量里再写回会改变语义。C 不可以：消除第一次 foo(N) 调用依赖「foo 没有副作用且可重复求值」，普通函数调用不满足（可能修改全局变量、做 I/O）。D 不可以：把 foo(N) 提到循环外同样假设了函数无副作用，循环条件里的调用可能每次都产生新结果。踩坑点：内存别名与函数副作用是编译器自动优化的两大障碍；只有纯粹的局部变量算术才容易被优化。","tags":["循环不变量","内存别名","函数副作用"],"options":["A","B","C","D"],"answer":1,"kp":"程序优化"},{"id":"m2015-16","source":"2015 期中","origin":"exam","lecture":14,"topic":"编译器可自动完成的优化变换","type":"single","difficulty":3,"stem":"以下哪个程序优化编译器**总是**可以自动进行？（假设 int i、int j、int A[N]、int B[N]、float m 都是局部变量，N 是整型常量，int foo(int) 是一个函数）","code":"A. 优化前: for (j = 0; j < N; j++) m += i*N*j;\n   优化后: int temp = i*N; for (j = 0; j < N; j++) m += temp*j;\n\nB. 优化前: for (j = 0; j < N; j++) B[i] *= A[j];\n   优化后: int temp = B[i]; for (j = 0; j < N; j++) temp *= A[j]; B[i] = temp;\n\nC. 优化前: for (j = 0; j < N; j++) m = (m + A[j]) + B[j];\n   优化后: for (j = 0; j < N; j++) m = m + (A[j] + B[j]);\n\nD. 优化前: for (j = 0; j < foo(N); j++) m++;\n   优化后: int temp = foo(N); for (j = 0; j < temp; j++) m++;","explanation":"A 可以：i*N 是纯整数循环不变量（i、N 都是局部 int），提到循环外只是减少重复计算，不涉及浮点结合律，语义完全不变。B 不可以：编译器无法证明 A[j] 与 B[i] 不别名（两个数组指针可能指向同一内存），把 B[i] 放进临时变量再写回可能改变语义。C 不可以：m 是 float，浮点加法不满足结合律，(m+A[j])+B[j] 与 m+(A[j]+B[j]) 的舍入结果可能不同，编译器不能擅自重结合（除非开启 -ffast-math 这类放宽语义的选项）。D 不可以：foo 是函数调用，可能有副作用或每次返回不同结果，不能提到循环外。踩坑点：整数结合律与浮点结合律的区别、内存别名、函数副作用，是编译器自动优化不可逾越的三道坎。","tags":["循环不变量","浮点结合律","内存别名"],"options":["A","B","C","D"],"answer":0,"kp":"程序优化"},{"id":"m2017-12","source":"2017 期中","origin":"exam","lecture":14,"topic":"循环不变量外提与过程调用副作用","type":"single","difficulty":3,"stem":"假设已有声明 `int i, j; const int n; int r; int a[n], b[n]; int mul(int, int);`，下列「优化前 → 优化后」的变换中，编译器**一般不会**进行的是：","code":null,"explanation":"C 不行：把 `mul(n, i)` 提到循环外属于循环不变量外提，它要求该表达式每次求值结果相同，且**求值本身没有副作用**；但 mul 是普通函数，编译器无法确定它是否修改了全局变量、n、i 或其它可访问内存（也难以保证它每次都返回相同的值），因此一般不敢外提——这正是「过程调用是优化的障碍」的典型例子。A 是强度削弱（n*8 → n<<3）加循环不变量外提，n 是 const int、操作数是局部数组，安全可做。B 只是整数乘法的重新结合，C 语言中有符号溢出属未定义行为，因此允许重排。D 把「每次读改写 a[0]」改成「先累加到局部变量再一次性写回」，读的 a[j]（j≥1）与 a[0] 是不同元素，不会改变语义。","tags":["程序优化","循环不变量外提","过程调用副作用"],"options":["优化前：\nfor (j = 0; j < n; ++j)\n    a[n * 8] += b[j];\n优化后：\nint tmp = (n << 3);\nfor (j = 0; j < n; ++j)\n    a[tmp] += b[j];","优化前：\nfor (j = 0; j < n; ++j)\n    r = (r * a[j]) * b[j];\n优化后：\nfor (j = 0; j < n; ++j)\n    r = r * (a[j] * b[j]);","优化前：\nfor (j = 0; j < n; ++j)\n    a[mul(n, i) + j] = b[j];\n优化后：\nint ni = mul(n, i);\nfor (j = 0; j < n; ++j)\n    a[ni + j] = b[j];","优化前：\nfor (j = 1; j < n; ++j)\n    a[0] += a[j];\n优化后：\nint tmp = 0;\nfor (j = 1; j < n; ++j)\n    tmp += a[j];\na[0] += tmp;"],"answer":2,"kp":"控制流与条件码"},{"id":"m2018-09","source":"2018 期中","origin":"exam","lecture":14,"topic":"编译器可安全进行的优化","type":"single","difficulty":3,"stem":"假设已有声明 `int i, sum, *p, *q, *r; const int n = 100; float a[n], b[n], c[n]; int foo(int); void bar();`，以下哪项程序优化编译器**总是**可以进行？","code":null,"explanation":"C 总可以做：n 是 const int = 100，`sum += i*4` 中 i 每次加 1，把「每次乘 4」强度削弱为「每次加 4」并把上界换成 N = n*4，只是循环变量的换算，不涉及别名与副作用，恒等价。A 不行：浮点加法**不满足结合律**，`a[i] += b[i]; a[i] += c[i];` 与先算 `b[i]+c[i]` 再一次累加的结果可能不同，编译器默认不许改（除非开启 -ffast-math 之类）。B 不行：p、q、r 都是指针，可能指向同一地址（别名），此时先算 `*q+*r` 再一次性写入的结果与两次自增不同。D 不行：`foo(n)` 是函数调用，可能有副作用或每次返回值不同，不能提到循环外只算一次。踩坑点：编译器优化的三大障碍就是**别名、副作用、浮点结合律**。","tags":["循环优化","别名与副作用","浮点结合律"],"options":["优化前：\nfor (i = 0; i < n; ++i) {\n    a[i] += b[i];\n    a[i] += c[i];\n}\n优化后：\nfloat tmp;\nfor (i = 0; i < n; ++i) {\n    tmp = b[i] + c[i];\n    a[i] += tmp;\n}","优化前：\n*p += *q;\n*p += *r;\n优化后：\nint tmp;\ntmp = *q + *r;\n*p += tmp;","优化前：\nfor (i = 0; i < n; ++i)\n    sum += i * 4;\n优化后：\nint N = n * 4;\nfor (i = 0; i < N; i += 4)\n    sum += i;","优化前：\nfor (i = 0; i < foo(n); ++i)\n    bar();\n优化后：\nint tmp = foo(n);\nfor (i = 0; i < tmp; ++i)\n    bar();"],"answer":2,"kp":"程序优化"},{"id":"m2019-12","source":"2019 期中","origin":"exam","lecture":14,"topic":"程序优化的常见误区","type":"single","difficulty":2,"stem":"针对程序优化，请挑出下面**唯一正确**的陈述：","code":null,"explanation":"C 正确：过程间优化要求编译器掌握被调函数不会修改调用者可见的外部状态；**全局变量**是外部可见状态，任何函数调用都可能修改它，因此编译器不敢跨调用缓存它、也不敢随意重排对它的访问，这正是跨过程优化的主要障碍之一。A 错：如果 CPU 本身有硬件乘除法，用移位加法模拟反而更慢、指令条数更多。B 错：提升效率最有效的手段是换更好的**算法与数据结构**，调高优化级别只是常数级的改进。D 错：a 与 b 可能是别名（甚至 a == b），此时即使 *a 与 *b 指向同一处，两种写法结果也不同——例如 a == b、*a 初值为 v 时，前者得到 4v 而后者得到 3v。踩坑点：别名的存在使很多「看起来显然」的改写失效。","tags":["程序优化","别名","过程间优化"],"options":["用 add/sub 和 shift 替代 multiply/divide 永远能提高程序的运行速度。","最有效的提高程序运行效率的方法是提高 compiler 的优化级别。","跨 procedure 优化的障碍之一是因为使用了全局变量。","程序中，`*a += *b; *a += *b;` 永远可以用 `*a += 2*(*b);` 代替。"],"answer":2,"kp":"程序优化"},{"id":"m2019-13","source":"2019 期中","origin":"exam","lecture":14,"topic":"循环展开的原理与代价","type":"single","difficulty":2,"stem":"对于 loop unrolling 这种优化技巧，请指出下面哪一个陈述是**错误**的：","code":null,"explanation":"B 错误：仅仅把循环体复制若干份（拆散）并不能带来性能提升，反而会因代码膨胀、取指压力增大而变慢；loop unrolling 真正起作用的是「展开之后再做**并行重组**」——把相互独立的累加拆到多个累加器上，缩短关键路径，从而利用处理器的多条执行流水线。A 描述的正是「去相关 + 重组」，C 说的是利用处理器并行能力，D 指出收益有上限（寄存器、重排序资源有限，代码膨胀有代价），三者都成立。官方解析也强调「简单地拆散 loop 并不能提高运行速度，只有拆散后做并行合并才能提高」。","tags":["循环展开","并行重组","关键路径"],"options":["Loop-unrolling 的原理是将尽量多的循环操作去掉相关性并重组，从而提高循环操作的并行性。","Loop-unrolling 是一种将循环操作拆散的技术。","Loop-unrolling 可以利用目标处理器的并行处理能力。","支持 Loop-unrolling 是有代价的，没有限制地增加并行支路数反而会降低运算速度。"],"answer":1,"kp":"程序优化"},{"id":"m2020-08","source":"2020 期中","origin":"exam","lecture":14,"topic":"编译器可安全进行的优化","type":"single","difficulty":3,"stem":"仅考虑以下代码，哪个代码片段在当前主流编译器的标准优化选项下一定会被优化？（假设 int i, int j, int A[N], int B[N], int *p 都是局部变量，int foo(int) 是一个函数）","code":"A) 优化前: for (j = 0; j < N; j++) B[i] *= A[j];\n   优化后: int temp = B[i]; for (j = 0; j < N; j++) temp *= A[j]; B[i] = temp;\nB) 优化前: for (j = 0; j < N; j++) m += i*N*j;\n   优化后: temp = i*N; for (j = 0; j < N; j++) m += temp * j;\nC) 优化前: i = foo(N); j = foo(N)+1; if (i != j) m = j;\n   优化后: m = j;\nD) 优化前: if (m == 1) { i = 3; j = 4; } else { i = 4; j = 3; } m = i + j;\n   优化后: m = 7;","explanation":"B 正确：i*N 是循环不变量，提到循环外（temp = i*N）后每次循环只剩一次乘法和一次加法，整数的乘法与加法满足结合、分配律，且这里只有标量变量 i、m、j，不存在别名问题，编译器一定能做。A 错：数组 A 与 B 可能存在别名（例如 B 恰好是 A 的一部分），把 B[i] 缓存到 temp 里再最后写回会改变语义。C 错：foo 可能有副作用（修改全局变量、输出等），两次调用的结果未必相同，不能把调用与判断一并删除。D 错：i、j 在后面的代码中可能还要使用，删除它们的定值只保留 m = 7 是非法优化。踩坑点：判断优化是否合法要看是否存在别名、函数是否有副作用、被删除的赋值是否还有别处使用。","tags":["程序优化","循环不变量","别名"],"options":["A：把数组累加临时存入局部变量 temp","B：把循环不变的 i*N 提到循环外","C：把两次 foo(N) 调用与条件判断一起删掉","D：把分支中 i、j 的赋值删掉，直接算 m = 7"],"answer":1,"kp":"程序优化"},{"id":"m2021-13","source":"2021 期中","origin":"exam","lecture":14,"topic":"编译器总能进行的优化","type":"single","difficulty":3,"stem":"假设已有声明 int i, int j, float x, int y, const int n, int a[n], int b[n], int *p, int *q, int *r, int foo(int)，以下哪项程序优化编译器总是可以进行：","code":"A: for (i = 0; i < n; i++) x = (x + a[j]) + b[j];\n   ==> for (i = 0; i < n; i++) x = x + (a[j] + b[j]);\nB: *p += *q;  *p += *r;\n   ==> int tmp; tmp = *q + *r; *p += tmp;\nC: for (i = 0; i < foo(n); i++) sum += i;\n   ==> int tmp = foo(n); for (i = 0; i < tmp; i++) sum += i;\nD: for (i = 0; i < n; i++) y = (y * a[j]) * b[j];\n   ==> for (i = 0; i < n; i++) y = y * (a[j] * b[j]);","explanation":"D 正确：整数乘法满足结合律（在补码回绕意义下也保持一致），只改变 (y*a[j])*b[j] 到 y*(a[j]*b[j]) 的结合顺序不会改变结果，编译器总可以做。A 错：浮点加法不满足结合律，改变结合顺序会改变舍入结果，编译器不允许。B 错：p、q、r 可能互相别名（例如 p == q），合并两次对 *p 的读改写会改变语义；即使不考虑别名，*p += *q; *p += *r 与 *p += (*q + *r) 的溢出行为也可能不同。C 错：foo 可能有副作用（修改全局变量、输出等），把调用提到循环外只执行一次会改变程序行为。踩坑点：判断优化是否合法要看三点——是否有别名、是否有副作用、所用代数律是否成立。","tags":["程序优化","别名","结合律"],"options":["A：改变浮点加法的结合顺序","B：把对 *p 的两次修改合并为一次","C：把循环条件中的函数调用 foo(n) 提到循环外","D：改变整数乘法的结合顺序"],"answer":3,"kp":"程序优化"},{"id":"m2022-12","source":"2022 期中","origin":"exam","lecture":14,"topic":"程序优化的限制因素","type":"single","difficulty":2,"stem":"下面说法正确的是：","code":null,"explanation":"C 正确：算法的渐进复杂度决定了程序性能的量级上限（例如把 O(n²) 换成 O(n log n)），因此在做常数级优化之前首先要关注算法本身。A 错：循环展开次数过多会造成代码膨胀、寄存器压力上升甚至寄存器溢出，性能反而下降，并非越多越好。B 错：函数调用和内存别名确实限制了编译器的优化空间，但并非“无法跨越”——函数内联就是跨越函数调用障碍的典型优化。D 错：程序性能的终极限制是吞吐量界限（由功能部件的容量与数量决定），不是延迟界限。踩坑点：教材明确区分延迟界限与吞吐量界限，后者才是终极上限。","tags":["程序优化","循环展开","吞吐量界限"],"options":["随着循环展开次数越多，分支预测次数更少，指令调度空间更大，代码性能更好。","编译优化无法跨越函数调用和内存别名的阻碍。","算法的渐进复杂度对于程序优化十分重要。","由于处理器硬件带来的延迟界限（latency bound）是程序性能的终极限制。"],"answer":2,"kp":"程序优化"},{"id":"m2023-19","source":"2023 期中","origin":"exam","lecture":14,"topic":"循环展开与浮点结合律","type":"single","difficulty":2,"stem":"针对程序优化，下面说法正确的是：","code":null,"explanation":"D 正确：double 的加法不满足结合律，每次加法都要舍入，交换遍历顺序会改变求和顺序从而改变结果，编译器不允许做这种改写。A 错：能否用指令级并行提速取决于数据依赖形成的关键路径长度，功能部件空闲并不等于可以并行。B 错：循环展开能减少循环开销并扩大调度空间，但展开次数过大导致代码膨胀、寄存器压力上升（寄存器溢出），性能反而下降。C 错：当 a 与 b 指向同一地址时，*b 会随 *a 改变，*a += *b; *a += *b; 与 *a += (*b)<<1 的结果不同，存在内存别名时不能这样改写。踩坑点：优化的合法性前提是没有别名、没有副作用、所用代数律成立（浮点加法无结合律）。","tags":["程序优化","循环展开","内存别名"],"options":["当处理器内部存在多个功能部件空闲时，就可以通过指令并行提高程序性能。","循环展开的原理是将尽量多的循环操作去掉相关性并重组，展开次数越多，代码性能更好。","a 和 b 都是 int*，*a+=*b; *a+=*b; 这段代码总是可以用 *a+=(*b)<<1; 代替。","编译器不会把二重循环中交换 i、j 两层循环的写法自动优化（即把先行后列遍历改成先列后行的遍历）。"],"answer":3,"kp":"程序优化"},{"id":"m2024-15","source":"2024 期中","origin":"exam","lecture":14,"topic":"程序优化的正确性与安全性","type":"single","difficulty":2,"stem":"假设已有声明 int a, int b, int i, int* pa, int* pb, float fa, float fb, float fc, char s[100], int f()，以及 #include<string.h>，以下优化正确的是：","code":"原程序 / 优化程序：\nA: int c = *pa; *pa = *pb; *pb = c;        ==>  *pb ^= *pa; *pa ^= *pb; *pb ^= *pa;\nB: a = f(); b = f(); int sum = a+b;       ==>  a = f(); int sum = a+a;\nC: for(i = 0; i < strlen(s); ++i) sum += s[i]-'a';\n   ==>  int len = strlen(s); for(i = 0; i < len; ++i) sum += s[i]-'a';\nD: float ret = fa*fc + fb*fc;             ==>  float ret = (fa+fb)*fc;","explanation":"C 正确：strlen 没有副作用，且循环体内不修改 s，把 strlen(s) 提升到循环外（循环不变代码外提）后语义完全不变，是编译器总可以做的安全优化。A 错：异或交换要求 pa 与 pb 指向不同位置，若 pa == pb，三步异或会把该位置清零，语义被破坏，编译器不能做这种替换。B 错：f() 可能有副作用（修改全局变量、输出、读文件等），调用两次与调用一次并不等价。D 错：浮点乘法不满足分配律，由于舍入误差，fa*fc + fb*fc 与 (fa+fb)*fc 的结果可能不同，编译器不允许改写。踩坑点：优化的合法前提是没有别名、没有副作用、代数律成立。","tags":["程序优化","别名","浮点结合律"],"options":["A：用三步异或交换代替借助临时变量的交换","B：把两次调用 f() 改成一次调用加 a+a","C：把循环条件中的 strlen(s) 提到循环外","D：把 fa*fc + fb*fc 提取公因式改成 (fa+fb)*fc"],"answer":2,"kp":"程序优化"},{"id":"s2025b-28","source":"2025 第 2 次阶段测验","origin":"exam","lecture":14,"topic":"编译器优化的过程调用限制","type":"single","difficulty":3,"stem":"编译优化时会遇到「过程调用」限制。下列关于该限制原因的解释，最准确的是：","code":null,"explanation":"编译器的优化必须保证程序的**可观察行为**不变，而它只能看到当前编译单元（通常是一个 .c 文件）。过程调用是一个「黑盒」：被调用的函数可能修改全局变量、静态变量、堆内存或文件，即产生副作用；也可能因为全局状态的改变而在相同参数下返回不同结果。因此编译器不敢把循环里的调用提到循环外（代码移动）、不敢用一次调用的结果替换后续调用（公共子表达式消除）、也不敢假定调用之间的内存内容不变。若想让编译器放开手脚，可以用 `inline` 提示内联、把函数定义放进同一编译单元，或使用 `-flto` 之类的跨模块优化。","tags":["编译器优化","过程调用","副作用"],"options":["过程调用可能带有「副作用」，例如修改全局变量或静态变量；即使给定相同的参数，过程的返回值也可能不同（受全局状态影响），因此编译器不能随意把调用搬移、删除或反复利用其结果","过程调用的执行开销太大，编译器必须避免生成调用指令","过程调用会破坏栈帧，编译器无法分析栈上的数据","过程调用无法被内联，所以编译器必须放弃一切优化"],"answer":0,"kp":"程序优化"},{"id":"s2025b-29","source":"2025 第 2 次阶段测验","origin":"exam","lecture":14,"topic":"编译器优化的存储器别名限制","type":"single","difficulty":3,"stem":"编译优化时会遇到「存储器别名（memory aliasing）」限制。下列关于该限制原因的解释，最准确的是：","code":null,"explanation":"典型例子是交换函数的错误优化：`void swap(long *xp, long *yp) { *xp = *xp + *yp; *yp = *xp - *yp; *xp = *xp - *yp; }` 在 xp 与 yp 相等（别名）时结果是 0 而不是交换，所以编译器不能把它化简为「先保存再赋值」的等价形式，也无法把 `*dest = ...` 提到循环外。C 语言标准允许通过不同类型的指针访问同一内存，编译器只能保守地认为「任何写内存的语句都可能改变其它指针指向的值」。规避手段是 `restrict` 关键字、局部变量缓存（把 `*dest` 累加到局部变量，循环结束后只写一次）等。","tags":["编译器优化","存储器别名","restrict"],"options":["两个看起来不同的内存引用（例如指向不同变量的两个指针）可能实际上指向同一块内存，而 C 语言允许这种写法且编译器不会检查，因此编译器不能随意假设它们互不相干而做优化","编译器无法为内存区域分配别名，因此必须把所有变量都放在栈上","指针变量不能被重命名，导致寄存器分配效果变差","别名会让 Cache 的命中率下降，所以编译器必须禁用循环优化"],"answer":0,"kp":"程序优化"},{"id":"gen-c14-01","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"优化编译器的能力边界","type":"single","difficulty":1,"stem":"关于优化编译器（如 GCC）能做与不能做的事，下列说法正确的是：","code":null,"explanation":"讲义第 14 讲「Optimizing Compilers」明确列出：编译器负责寄存器分配、代码选择与调度、死代码消除、消除小的低效，但**通常不会改善渐近复杂度**（选择更好的算法是程序员的责任），所以 B 错。A 也错：多路并行累积需要打破顺序依赖，讲义 p.33 指出「Compilers often cannot make these transformations」，其中一条原因就是 D 所说的浮点不满足结合律与分配律。D 恰好说反了：正因为浮点不满足结合律，编译器不敢自动重结合，只能由程序员手工改写（p.48 的 2×1a 展开）。C 对应讲义 p.20「Limitations of Optimizing Compilers」：分析只在过程内进行、只基于静态信息、拿不准时必须保守。","tags":["优化编译器","保守性","过程间分析"],"options":["只要编译器能证明循环边界，它就会自动做多路并行累积（多个累加器）","编译器会自动把时间复杂度为 $O(N^2)$ 的算法替换成 $O(N\\log N)$ 的算法","编译器必须保证不改变程序行为，拿不准时只能保守处理；而且它的大部分分析只在单个过程内进行，一般不跨文件做过程间分析","编译器会利用浮点加法的结合律，自动把累加链重新结合以提高并行度"],"answer":2,"kp":"课程概述与性能"},{"id":"gen-c14-02","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"代码移动（code motion）","type":"single","difficulty":1,"stem":"把 `set_row` 内层循环中的 `a[n*i+j]` 改写成先算 `long ni = n*i;` 再在循环里用 `a[ni+j]`，这种变换属于哪一类机器无关优化？","code":"void set_row(double *a, double *b, long i, long n)\n{\n    long j;\n    for (j = 0; j < n; j++)\n        a[n*i + j] = b[j];\n}\n\n/* 优化后：把 n*i 提到循环外（等价于 int ni = n*i;）*/\nvoid set_row_opt(double *a, double *b, long i, long n)\n{\n    long j;\n    long ni = n * i;\n    for (j = 0; j < n; j++)\n        a[ni + j] = b[j];\n}","explanation":"讲义第 14 讲「Generally Useful Optimizations → Code Motion」给出的正是这个例子：在循环里每次迭代都重复计算 `n*i`，而它在循环中恒为同一结果，因此把计算移到循环外，降低执行频率，这就是代码移动（预计算）。A（强度削弱）指的是用移位/加法替换代价高的乘除，例如 `16*x` 写成 `x << 4`，或把循环中的 `n*i` 改成每次 `ni += n`（p.8）；注意本题只是把乘法提到循环外做一次，不是把乘法换成加法。B（公共子表达式消除）针对的是同一表达式被重复计算，例如用 `inj = i*n+j` 复用三个下标表达式（p.9）。C（循环展开）改变的是每次迭代处理的元素个数，与本题无关。","tags":["代码移动","循环不变量","机器无关优化"],"options":["强度削弱（strength reduction）","公共子表达式消除（common subexpression elimination）","循环展开（loop unrolling）","代码移动 / 预计算（code motion, precomputation）"],"answer":3,"kp":"程序优化"},{"id":"gen-c14-03","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"强度削弱与公共子表达式消除","type":"single","difficulty":2,"stem":"下列变换中，属于**强度削弱**（strength reduction）的是：","code":null,"explanation":"讲义第 14 讲「Reduction in Strength」的定义是：用更简单的操作替换代价高的操作，典型做法是用移位/加法代替乘除，例如 `16*x` 写成 `x << 4`；同一页还给出「Recognize sequence of products」，把循环里反复出现的 `n*i` 改成在外层循环里累加 `ni += n`，这都是强度削弱，所以 C 正确。D 是代码移动（code motion）。A 是公共子表达式消除：只算一次 `i*n+j`，其余下标用 `inj-n`、`inj+n`、`inj±1` 得到，把 3 次乘法降为 1 次（p.9）。B 是循环展开（p.46）。注意强度削弱的收益是机器相关的，取决于乘除指令的具体代价。","tags":["强度削弱","移位","公共子表达式"],"options":["把 `val[(i-1)*n+j]`、`val[(i+1)*n+j]`、`val[i*n+j-1]`、`val[i*n+j+1]` 改写为基于 `inj = i*n+j` 的加减","把内层循环一次处理 2 个元素，并在循环后补齐剩余元素","把 `16*x` 改写为 `x << 4`，并把两层循环中的 `a[n*i+j]` 改为维护递增的 `ni`（每次 `ni += n`）","把内层循环中不变的 `n*i` 提到外层循环之外只算一次"],"answer":2,"kp":"程序优化"},{"id":"gen-c14-04","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"内存别名对优化的阻碍","type":"single","difficulty":3,"stem":"下列程序运行结束后，`B[0]`、`B[1]`、`B[2]`（也就是 `A[3]`、`A[4]`、`A[5]`）的值依次是：","code":"/* 把 n×n 矩阵 a 的每行求和存入向量 b */\nvoid sum_rows1(double *a, double *b, long n) {\n    long i, j;\n    for (i = 0; i < n; i++) {\n        b[i] = 0;\n        for (j = 0; j < n; j++)\n            b[i] += a[i*n + j];\n    }\n}\n\nint main(void) {\n    double A[9] = { 0,   1,   2,\n                    4,   8,  16,\n                    32,  64, 128 };\n    double *B = A + 3;   /* B 与 A 发生别名！ */\n    sum_rows1(A, B, 3);\n}","explanation":"关键是 `B = A+3` 造成内存别名：`b[i]` 就是 `a[3+i]`，而内层循环又在读 `a[i*3+j]`，两者可能指向同一元素。i=0 时 `b[0]` 即 `a[3]`：先置 0，再累加 a[0]+a[1]+a[2] = 0+1+2 = 3。i=1 时 `b[1]` 即 `a[4]`：先置 0，然后依次 `a[4] += a[3](=3)` 得到 3、`a[4] += a[4](=3)` 得到 6、`a[4] += a[5](=16)` 得到 22——注意第二次累加把刚写进去的值又加了一遍。i=2 时 `b[2]` 即 `a[5]`：置 0 后加 a[6]=32、a[7]=64、a[8]=128 得 224。所以结果是 3、22、224。A 选项 3、28、224 是无别名（把结果暂存到局部变量 `val` 再写回 `b[i]`，即讲义 sum_rows2）时的正确答案，正好说明别名会改变语义；B 的 19 是把自累加那一步漏掉；C 是没有执行任何写操作的原数组值。正因为存在这种可能，编译器不敢把 `b[i] += ...` 优化成局部累加，这就是「优化阻碍 #2：Memory Aliasing」（讲义 p.28-31）。","tags":["内存别名","优化阻碍","局部变量累加"],"options":["3、28、224","3、19、224","4、8、16","3、22、224"],"answer":3,"kp":"程序优化"},{"id":"gen-c14-05","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"循环展开与多路并行累积","type":"single","difficulty":2,"stem":"关于循环展开（loop unrolling）与多路并行累积（separate accumulators），下列说法正确的是：","code":null,"explanation":"讲义第 14 讲 p.47 的表格显示：2×1 展开对 Double FP 乘法**没有**帮助（仍是 5.01，等于延迟下界），因为它仍然是同一条顺序依赖链 `x = (x OP d[i]) OP d[i+1]`，所以 A 错。p.48-50 指出，只有把表达式重结合并配合多路累加，才能让下一次迭代的运算提前开始；p.53 给出结论：N 个元素、延迟 D 时，K 条独立依赖链下 CPE 约为 `D/K`，B 正确。p.54 说明 L 必须是 K 的倍数（而不是相等），L 与 K 不相等时结果依然正确，只是效率不同，所以 C 错。p.54-55 还说明存在「收益递减」：最终受执行单元吞吐限制（Double FP 乘法的吞吐下界是 0.50 CPE，K=10 时实测 0.51），不可能无限降低，所以 D 错。","tags":["循环展开","多路累积","指令级并行"],"options":["只要把循环体一次处理 2 个元素（2×1 展开），Double FP 乘法就能从 5.01 CPE 降到 2.51 CPE","用 K 个独立累加器把依赖链拆成 K 条后，理论 CPE 约为 $D/K$（$D$ 为运算延迟），但最终会撞上功能部件的吞吐上界","展开因子 L 必须等于累加器个数 K，否则结果不正确","不断增大展开因子 L，CPE 就可以无限降低"],"answer":1,"kp":"程序优化"},{"id":"gen-c14-06","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"优化阻碍因素","type":"multi","difficulty":2,"stem":"下列哪些情况会妨碍编译器做优化（即构成讲义所说的「优化阻碍」）？","code":null,"explanation":"讲义第 14 讲把优化阻碍归纳为两类：**过程调用**与**内存别名**。A 属于前者：p.21-27 用 `lower()` 中的 `strlen(s)` 说明，编译器把过程调用当成黑盒，若 `strlen` 有副作用或依赖全局状态，就不能把它移到循环外，结果程序从线性退化到 $O(N^2)$，只能靠内联或程序员自己做代码移动。B 属于后者：p.28-31 的 `sum_rows1` 中因为可能别名，编译器不敢把 `b[i] += ...` 变成局部累加。C 是 p.33 强调的另一类阻碍：浮点不满足结合律、分配律，重结合会改变结果，编译器不能自动做（讲义把它与过程间分析并列，作为编译器无法完成的关键变换之一）。D 与优化无关，`for` 与 `while` 编译后都是比较加条件跳转。E 也不成立：下标是变量照样能做强度削弱，p.8 的例子正是把 `n*i` 换成递增的 `ni`。","tags":["过程调用","内存别名","浮点结合律"],"options":["循环条件里反复调用 `strlen(s)` 这类过程，编译器必须假设过程可能有副作用","同一块内存可能通过不同的指针被访问（内存别名）","浮点数的加法和乘法不满足结合律，编译器不能随意重结合","源程序使用 `for` 循环而不是 `while` 循环","循环体内数组下标是变量而不是常量，因此无法做强度削弱"],"answer":[0,1,2],"kp":"程序优化"},{"id":"gen-c14-07","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"重结合与浮点运算的非结合性","type":"judge","difficulty":2,"stem":"把累加写成 `x = x OP (d[i] OP d[i+1])` 并配合多路累加器，可以打破顺序依赖、提高指令级并行度；但对于浮点加/乘，重结合会改变运算结果，因此编译器一般不会自动做这类变换，需要程序员手工改写。","code":null,"explanation":"讲义第 14 讲 p.48 专门提问「Can this change the result of the computation?」，答案是「Yes, for FP」，因为浮点加法/乘法不满足结合律：`(a+b)+c` 与 `a+(b+c)` 的舍入结果可能不同。也正因为如此，p.49-50 中 2×1a 重结合写法的加速（整数乘、FP 加、FP 乘几乎快一倍）必须由程序员显式写出，编译器不会擅自把 `x=(x OP d[i]) OP d[i+1]` 改写成 `x = x OP (d[i] OP d[i+1])`。反过来说，整数加法在模 $2^w$ 意义下满足结合律，重结合不改变结果，所以编译器在整数上做这类变换是允许的（尽管有符号溢出的语言细节另需讨论）。这正是「必须理解系统才能优化性能」的典型例子：编译器受语义约束，硬件却依赖并行度。","tags":["重结合","浮点非结合","指令级并行"],"options":null,"answer":true,"kp":"浮点数"},{"id":"gen-c14-08","source":"自编 · 第 14 讲","origin":"created","lecture":14,"topic":"延迟下界与 CPE 估算","type":"fill","difficulty":3,"stem":"在 Intel Haswell 上，Double FP 乘法的延迟为 5 个周期（吞吐下界为 0.5 CPE）。若采用 4 路独立累加器（K=4）的展开方式，在尚未撞上吞吐上界之前，理论 CPE 约为 $D/K$。请填入该值（保留两位小数）____","code":null,"explanation":"讲义第 14 讲 p.53 推导：N 个元素、每步运算延迟 D、用 K 个独立累加器得到 K 条互不依赖的运算链，所需周期约为 $(N/K+1)\\cdot D$，因此 CPE $\\approx D/K$。Haswell 上 Double FP 乘法 D=5，K=4 时 $5/4=1.25$；p.55 的实测表格中「K=4、L=4」一格正好是 1.25，与公式吻合。注意这只是延迟下界；当累加器数量继续增大（K=10、L=10 时降到 0.51），性能就由功能部件吞吐限制（此例 0.50 CPE）决定，不可能继续按 $D/K$ 下降。这类「先算延迟下界、再看吞吐上界」的估算方法是第 14 讲的核心技能。","tags":["CPE","延迟下界","吞吐上界","多路累积"],"options":null,"answer":["1.25"],"kp":"程序优化"},{"id":"f2013-06","source":"2013 期末","origin":"exam","lecture":15,"topic":"强符号重复定义导致链接错误","type":"single","difficulty":2,"stem":"已知 main.c 中定义了 `int i = 0;`，foo.c 中定义了 `int i = 1;`，且 foo.c 中的函数 `foo()` 打印变量 i。该程序编译链接的结果是：","code":"/* main.c */\nint i = 0;\nint main()\n{\n    foo();\n    return 0;\n}\n\n/* foo.c */\nint i = 1;\nvoid foo()\n{\n    printf(\"%d\", i);\n}","explanation":"两个文件里的 i 都是已初始化的全局变量，属于强符号；符号解析阶段看到两个同名的强定义，链接器直接报 multiple definition of `i`，因此是链接错误。（若其中一个是 static，则两份 i 各自内部链接、互不干扰；若其中一个未初始化，则是弱符号，链接器可以任选其一，程序仍能链接。）选项“编译错误”只在严格 C99 下因隐式声明 printf 才可能出现（原卷印刷版引号有误，当年也接受 A），但本题核心考点是强符号重复定义；段错误与运行期随机取值都无从谈起。","tags":["链接","强符号","符号解析"],"options":["编译错误","链接错误","段错误","有时打印输出 1，有时打印输出 0"],"answer":1,"kp":"链接"},{"id":"f2013-07","source":"2013 期末","origin":"exam","lecture":15,"topic":"哪些符号不需要重定位","type":"single","difficulty":2,"stem":"在链接时，对于什么样的符号一定不需要进行重定位？","code":null,"explanation":"重定位要修改的是目标文件中“引用了别处定义的符号”的那些指令或数据。A 的函数在另一个模块定义，调用处必须重定位；B 的全局变量放在 .data/.bss，机器码里通过符号引用它，同样要重定位；D 的 static 局部变量虽有内部链接，但仍分配在 .data 中，指令依旧要靠重定位或固定偏移去访问它（链接器仍需处理其地址）。只有 C——函数内不带 static 的自动变量——被分配在栈上或寄存器中，访问它靠 %rsp/%rbp 相对偏移，与模块的加载地址无关，所以一定不需要重定位。","tags":["重定位","局部变量","作用域"],"options":["不同 C 语言源文件中定义的函数","同一 C 语言源文件中定义的全局变量","同一函数中定义时不带 static 的变量","同一函数中定义时带有 static 的变量"],"answer":2,"kp":"链接"},{"id":"f2014-10","source":"2014 期末","origin":"exam","lecture":15,"topic":"静态库的链接顺序","type":"single","difficulty":2,"stem":"下列关于静态库链接的描述中，错误的是","code":null,"explanation":"静态库（.a）是按需提取的：链接器只把“被引用且能解决当前未定义符号”的成员模块拷贝进可执行文件，A 对。由于链接器按命令行从左到右扫描，库一般应放在引用它的目标文件之后，B 是通用准则。库之间若相互引用就必须按依赖顺序排列，必要时还要重复出现，C 对。D 错：相互调用的库在命令行必须重复出现（例如 -la -lb -la），只出现一次会残留未定义引用。该题与 2015 年期末第 4 题互为“选错误/选正确”的镜像题，此处按最早出现的年份收录。","tags":["静态库","链接顺序","未定义引用"],"options":["链接时，链接器只拷贝静态库中被程序引用的目标模块","使用库的一般准则是将它们放在命令行的结尾","如果库不是相互独立的，那么它们必须排序","每个库在命令行只须出现一次即可"],"answer":3,"kp":"链接"},{"id":"f2014-11","source":"2014 期末","origin":"exam","lecture":15,"topic":"静态全局变量在 ELF 中的位置","type":"single","difficulty":3,"stem":"在 foo.c 中的函数外添加语句 `static int count = 0xdeadbeef;`，编译为 foo.o 后，它会影响到 ELF 可重定位目标文件中的哪些除 .text 以外的字段？","code":null,"explanation":"带 static 的文件作用域变量是本地符号，初值非零且可写，因此分配在 .data（不是只读的 .rodata，也不是初值为 0 的 .bss）。它在符号表中占一项（记为本地符号，链接器仍需知道它存在），但因为初值已知、地址由本模块自身决定，不需要任何重定位记录，所以不会产生 .rel.data。只有引用了外部符号或需要在链接/加载时确定地址的数据才需要重定位项。","tags":["ELF","静态变量","符号表"],"options":[".rodata",".data, .symtab",".data, .symtab, .rel.data",".rodata, .symtab, .rel.data"],"answer":1,"kp":"链接"},{"id":"f2015-04","source":"2015 期末","origin":"exam","lecture":15,"topic":"静态库链接的规则","type":"single","difficulty":2,"stem":"以下关于静态库链接的描述中，正确的是","code":null,"explanation":"链接器按需提取：只拷贝被引用且能解决未定义符号的库成员，A 错。把库放在命令行结尾只是通用准则，静态库也可以出现在引用它的目标文件之前（只要后面还有引用了它的目标文件），B 的“必须”太绝对。库之间若存在相互引用（不独立），就必须按依赖顺序排列，必要时还需重复出现，C 表述的排序规则正确。D 错：相互调用的库在命令行必须重复出现。该题与 2014 年期末第 10 题互为镜像（一个问“错误”、一个问“正确”）。","tags":["静态库","链接顺序","符号解析"],"options":["链接时，链接器会拷贝静态库中的所有目标模块。","使用库的时候必须把它们放在命令行的结尾处。","如果库不是相互独立的，那么它们必须排序。","每个库在命令行只须出现一次即可。"],"answer":2,"kp":"链接"},{"id":"f2015-05","source":"2015 期末","origin":"exam","lecture":15,"topic":"字符串常量所在的段","type":"single","difficulty":1,"stem":"在 foo.c 中包含 `int foo(void) { int error = printf(\"You ran into a problem!\\n\"); return error; }`，经过编译和链接之后，字符串 “You ran into a problem!\\n” 会出现在哪个段中？","code":null,"explanation":"字符串字面量不可修改，属于只读数据，汇编器把它放进 .rodata 段（用 .LC0 之类的标号引用），机器代码里只保存它的地址。.bss 存放未初始化或初值为 0 的全局/静态变量；.data 存放已初始化的可写全局/静态变量；.text 存放机器代码。踩坑点：字符串常量不是可写的 .data。","tags":["ELF","rodata","字符串常量"],"options":[".bss",".data",".rodata",".text"],"answer":2,"kp":"链接"},{"id":"f2016-07","source":"2016 期末","origin":"exam","lecture":15,"topic":"extern 声明继承内部链接","type":"single","difficulty":3,"stem":"C 源文件 f1.c 和 f2.c 的代码如下，编译链接生成可执行文件后执行，输出结果为","code":"// f1.c\n#include <stdio.h>\nstatic int var = 100;\nint main(void)\n{\n    extern int var;\n    extern void f();\n    f();\n    printf(\"%d\\n\", var);\n    return 0;\n}\n\n// f2.c\nint var = 200;\nvoid f()\n{\n    var++;\n}","explanation":"f1.c 顶层的 var 带 static，是内部链接的全局变量。main 里的 `extern int var;` 在块作用域中声明，而在文件作用域中已经存在一个内部链接的同名声明，按 C 语言规则该标识符继续具有内部链接——也就是说它引用的仍是值为 100 的那个 var。f2.c 里的 var 是另一个具有外部链接的对象，f() 把它从 200 加到 201，只影响 f2.c 自己的 var，不会影响 main 打印的值。故输出 100。踩坑点：extern 不一定指向“外部的那个符号”，它会继承可见的内部链接声明。","tags":["链接","static","extern"],"options":["100","200","201","链接错误"],"answer":0,"kp":"链接"},{"id":"f2016-08","source":"2016 期末","origin":"exam","lecture":15,"topic":".data 与 .bss 的地址布局","type":"single","difficulty":3,"stem":"C 源文件 m1.c 和 m2.c 如下，编译链接后执行 `$ gcc -o a.out m2.c m1.c ; ./a.out`，已知第一次 printf 输出 &a1 = 0x1083020，则后面的两个输出最可能为","code":"// m1.c\n#include <stdio.h>\nint a1;\nint a2 = 2;\nextern int a4;\nvoid hello()\n{\n    printf(\"%p \", &a1);\n    printf(\"%p \", &a2);\n    printf(\"%p\\n\", &a4);\n}\n\n// m2.c\nint a4 = 10;\nint main()\n{\n    extern void hello();\n    hello();\n    return 0;\n}","explanation":"a1 未初始化，位于 .bss；a2、a4 已初始化，位于 .data，而 .data 的地址低于 .bss。链接器按输入文件在命令行上出现的顺序摆放数据段：m2.c 在前，所以 a4 先占 0x1083018，接着 m1.c 的 a2 占 0x108301c，再往后才是 .bss 中的 a1（即题目给出的 0x1083020，正好高出 4 字节）。因此输出顺序为 &a1 = 0x1083020、&a2 = 0x108301c、&a4 = 0x1083018，选 D。A 把顺序弄反，B、C 与已知的 0x1083020 不衔接。踩坑点：未初始化的全局变量进 .bss，不占文件空间但要占地址。","tags":["ELF","data/bss","链接顺序"],"options":["0x1083018, 0x108301c","0x1083028, 0x1083024","0x1083024, 0x1083028","0x108301c, 0x1083018"],"answer":3,"kp":"内存安全与攻击"},{"id":"f2017-06","source":"2017 期末","origin":"exam","lecture":15,"topic":"同名不同类型的 COMMON 符号","type":"single","difficulty":3,"stem":"C 源文件 f1.c 和 f2.c 的代码如下，运行下面的命令后得到的结果是","code":"// f1.c\n#include <stdio.h>\nvoid f();\nint x;\nint main(void)\n{\n    x = 1;\n    f();\n    printf(\"%x\\n\", x);\n    return 0;\n}\n\n// f2.c\nfloat x;\nvoid f()\n{\n    x = 2;\n}\n\n$ gcc f1.c f2.c\n$ ./a.out","explanation":"两个文件里的 x 都未初始化，在传统 GCC 的默认设置（-fcommon）下都被编译成 COMMON 符号（一种弱符号），链接器把它们合并到同一块存储，不会报重复定义。main 先把整数 1 写入该地址，随后 f() 把 float 2.0 写进同一地址：2.0f 的位模式是 0x40000000，于是按 %x 把同一块内存当整数打印得到 40000000。选 3f800000 是 float 1.0 的位模式；选 1、2 则误以为两个 x 是各自独立的变量。踩坑点：C 允许同名不同类型的“临时定义”共存，链接器只看存储；新版 GCC（10 起默认 -fno-common）会报重复定义而使链接失败。","tags":["链接","COMMON 符号","浮点位模式"],"options":["1","2","3f800000","40000000"],"answer":3,"kp":"链接"},{"id":"f2017-07","source":"2017 期末","origin":"exam","lecture":15,"topic":"链接的基本性质","type":"single","difficulty":3,"stem":"下面关于链接的说法，正确的是","code":null,"explanation":"静态库的设计目的就是按需提取：链接器只把被引用且能解决未定义符号的成员模块拷贝进可执行文件，D 对。A 不准确：GNU 链接器面对多个同名 COMMON（未初始化全局）符号时会选择占用空间最大的那个，而不是简单地“取遇到的第一个”。B 不严谨：链接不仅发生在编译之后（静态链接），还发生在加载时（动态链接）乃至运行时（dlopen），教材专门把链接分为这三个时机。C 错：未初始化的静态变量放在 .bss，只有已初始化的才在 .data。","tags":["链接","静态库","COMMON 符号"],"options":["Linux 链接器在处理多重定义的同名弱符号时，选择链接时遇到的第一个符号","链接发生在源代码编译之后、可执行目标程序运行之前","C 程序静态局部变量和静态全局变量都在 ELF 可重定位目标文件的 .data 段","链接器构造可执行目标文件时，只复制静态库里被应用程序引用的目标模块"],"answer":3,"kp":"链接"},{"id":"f2018-04","source":"2018 期末","origin":"exam","lecture":15,"topic":"链接基础：符号解析、强/弱符号与打桩","type":"single","difficulty":3,"stem":"下列关于链接技术的描述，错误的是：","code":null,"explanation":"A 错（本题选它）：全局符号定义“不恰当”并不必然在链接时报错。只有多个强符号同名才会触发链接错误；强符号与弱符号同名时链接器静默选择强符号，多个弱符号同名时也只会静默选取其中一个，很多情况下连警告都没有。B 对：Linux 默认链接器（binutils ld）在多个同名弱符号中确实按“占用空间最大”的原则挑选，避免小定义覆盖大定义造成数据被截断。C 对：编译时打桩要把桩函数插进源文件，因此必须有源码；链接时打桩要替换 .o 中的符号引用，因此需要可重定位目标文件；运行时打桩依赖 LD_PRELOAD 与动态链接，只需可执行文件即可。D 对：这正是链接器符号解析与重定位两大任务的标准描述。踩坑点：不要以为“不恰当定义”一定会报错——链接器只在强符号冲突时报错。","tags":["链接","强符号弱符号","打桩","重定位"],"options":["在 Linux 系统中，对程序中全局符号的不恰当定义，会在链接时刻进行报告。","在使用 Linux 的默认链接器时，如果有多个弱符号同名，那么会从这些弱符号中任意选择一个占用空间最大的符号。","编译时打桩（interpositioning）需要能够访问程序的源代码，链接时打桩需要能够访问程序的可重定位对象文件，运行时打桩只需要能够访问可执行目标文件。","链接器的两个主要任务是符号解析和重定位。符号解析将目标文件中的全局符号都绑定到唯一的定义，重定位确定每个符号的最终内存地址，并修改对那些目标的引用。"],"answer":0,"kp":"链接"},{"id":"f2019-06","source":"2019 期末","origin":"exam","lecture":15,"topic":"哪些符号（引用）需要重定位","type":"single","difficulty":3,"stem":"在链接时，对于下列哪些符号需要进行重定位？\n(1) 不同 C 语言源文件中定义的函数\n(2) 同一 C 语言源文件中定义的全局变量\n(3) 同一函数中定义时不带 static 的变量\n(4) 同一函数中定义时带有 static 的变量","code":null,"explanation":"(1) 需要：跨模块调用的函数在汇编时无法确定地址，必须由链接器重定位（汇编器会为 call 生成 R_X86_64_PLT32/PC32 重定位条目）。(2) 需要：同一源文件里的全局变量位于数据段（.data/.bss/COMMON），而引用它的指令在代码段（.text），两个节在链接后才确定地址，汇编器必须留下重定位条目。(3) 不需要：函数内部不带 static 的普通局部变量分配在栈上，用 %rbp/%rsp 相对寻址，编译期就能确定偏移，不存在重定位。(4) 需要：带 static 的局部变量其实存放在 .data/.bss 中（是带局部链接属性的符号），引用它同样跨节，需要重定位条目（虽然它的地址在链接时即可确定，不再需要动态解析，但重定位条目仍然是存在的）。因此答案是 (1)(2)(4)，选 C。踩坑点：判断标准不是“全局还是局部”，而是“引用是否跨越了编译阶段能确定的地址范围”。","tags":["链接","重定位","static变量"],"options":["(1)(3)","(2)(4)","(1)(2)(4)","(1)(2)(3)(4)"],"answer":2,"kp":"链接"},{"id":"f2020-07","source":"2020 期末","origin":"exam","lecture":15,"topic":"打桩、共享库与程序入口点","type":"single","difficulty":2,"stem":"下列关于链接的描述，正确的是：","code":null,"explanation":"D 正确：共享库会被加载到不可预知的地址，因此必须用 -fpic/-fPIC 让编译器生成位置无关代码（PIC，用 GOT/PLT 做间接引用）。A 错：只有编译时打桩需要源代码；链接时打桩只需可重定位目标文件，运行时打桩只需可执行文件（配合 LD_PRELOAD）。B 错：可执行目标文件里仍然保留一些伪节条目，例如 ABS 用于保存文件名等绝对符号，UNDEF 也可能存在（动态链接的未定义符号），并非“不再有”。C 错：程序的入口点是 _start（由 crt0.o/crt1.o 提供），_start 再去准备参数并调用 __libc_start_main，后者才调用 main；说入口点就是 __libc_start_main 的第一条指令不对。踩坑点：-fpic/-fPIC、_start、打桩的三种时机，都是链接一章的高频考点。","tags":["链接","打桩","共享库","入口点"],"options":["打桩（interpositioning）机制需要能够访问程序的源代码。","链接器生成的文件不再有 ABS、UNDEF 和 COMMON 伪节。","对于 GlibC 和 GCC 生成的程序，其入口点位于 __libc_start_main 函数的第一条指令处。","用户使用 GCC 进行共享库的编译必须使用 -fpic 选项指示生成位置无关代码。"],"answer":3,"kp":"链接"},{"id":"f2020-08","source":"2020 期末","origin":"exam","lecture":15,"topic":"跨模块符号类型不一致的后果","type":"single","difficulty":3,"stem":"文件 f1.c 和 f2.c 的 C 源代码如下图所示，用 gcc -Og -o f f1.c f2.c 编译后运行 ./f，这个过程中会出现的情况是：","code":"// f1.c\n#include <stdio.h>\nextern float x;\nextern void f();\nint main()\n{\n  f();\n  printf(\"%d \\n\", (int)x);\n  return 0;\n}\n\n// f2.c\nint x = 0;\nvoid f()\n{\n  x++;\n}","explanation":"选 B（输出 0）。编译器是分别处理各个 .c 文件的：编译 f1.c 时它只相信 extern float x 这个声明，把它当浮点数读取；编译 f2.c 时 x 是 int，f() 对它做整数自增。编译器彼此看不到对方的类型信息，链接器也不做类型检查，因此不会有编译或链接错误（A、D 错）。链接后 x 位于 .data 且初值为整数 0，调用 f() 后它的 4 个字节变为整数 1，即二进制 00000001。而 f1.c 里的 printf 把这 4 个字节解释成 IEEE 单精度浮点数，得到约 1.4×10^-45 这个极小的正数，再强制转换成 int 就截断成 0，所以输出 0（B 对，C 错）。踩坑点：C 语言允许跨模块声明与定义类型不一致而不报错，这属于典型的“未定义行为”，也是链接器不做类型检查的经典例子。","tags":["链接","跨模块声明","类型不一致","未定义行为"],"options":["编译错误","输出 0","输出 1","链接错误"],"answer":1,"kp":"链接"},{"id":"f2021-09","source":"2021 期末","origin":"exam","lecture":15,"topic":"Linux 二进制工具链的用途","type":"single","difficulty":1,"stem":"以下关于 Linux 系统上处理可执行文件的工具的说法错误的是：","code":null,"explanation":"C 错误（本题选它）：ls 只是列出文件的元数据（类型、权限、大小、时间等），这些元数据里并不包含“文本还是二进制”的编码属性，因此无法据此判断文件类型；要判断文件类型应当使用 file（或 grep 之类的启发式工具）。A 对：objdump -dj .text file 可以反汇编 .text 节中的机器码。B 对：readelf -S 显示节头部表，readelf -l 显示程序头部表，用于查看节与段的信息。D 对：gdb 可以加载可执行文件、下断点、单步执行并查看寄存器与内存。踩坑点：不要把 ls -l 的“文件类型字符”与文本/二进制属性混为一谈。","tags":["链接","objdump","readelf","gdb"],"options":["使用 objdump 反汇编 .text 节的机器码。","使用 readelf 读取文件的节头部表（section header）和程序头部表（program header）。","使用 ls 查询文件是文本文件还是二进制文件。","使用 gdb 加载可执行文件、设置断点，然后单步调试运行。"],"answer":2,"kp":"链接"},{"id":"f2021-10","source":"2021 期末","origin":"exam","lecture":15,"topic":"static 变量、.bss 与链接顺序的影响","type":"single","difficulty":3,"stem":"对如下两个 C 程序，用 gcc 生成对应的 .o 模块，链接在一起得到 a.out 可执行程序。则下列说法正确的是：","code":"// main.c\n#include <stdio.h>\nstatic int a;\nint main() {\n  int *func();\n  printf(\"%ld\\n\", func() - &a);\n  return 0;\n}\n\n// util.c\nint a = 0;\nint *func() {\n  return &a;\n}","explanation":"D 正确：A、B、C 都不对。A 错：main.c 中的 a 带有 static，是只在本模块可见的局部符号，链接器会直接把它放进 .bss（未初始化的数据），不会使用 COMMON 伪节——COMMON 只用于“未初始化的全局变量”（让多个模块的同名弱定义可以合并）。B 错：util.c 中的 int a = 0 是已定义且被显式初始化为 0 的全局变量，GCC 把它放在 .bss 而不是 COMMON（.comm 只用于未初始化或暂定定义的全局变量）。C 错：链接时命令行中 .o 文件的先后顺序会改变最终 a.out 中两个同名符号（main.o 中 static 的 a 与 util.o 中全局的 a，二者是不同的符号）的相对布局，因此 func()-&a 的输出值可能随链接顺序变化，而且完全可能等于 0（例如两者恰好被分配到相邻甚至相同的地址区间时），说“结果都一样且必不为 0”不成立。踩坑点：static 变量是局部符号；显式初始化为 0 的全局变量进 .bss；同名但链接属性不同的变量互不冲突，输出依赖具体布局。","tags":["链接","static","COMMON","bss"],"options":["在 main.o 中，符号 a 位于 .COMMON 伪节。","在 util.o 中，符号 a 位于 .COMMON 伪节。","无论怎样链接和运行 a.out，输出的结果都一样，但必不为 0。","以上说法都不正确。"],"answer":3,"kp":"链接"},{"id":"f2021-11","source":"2021 期末","origin":"exam","lecture":15,"topic":"动态链接、PLT/GOT 与 -ldl 的顺序","type":"single","difficulty":3,"stem":"在标准 Linux 系统中，以下程序可以使用 gcc dl.c -ldl 编译生成 a.out 可执行文件并正常运行。如果缺少了 -ldl 选项，链接时会报错 undefined reference to 'dlopen' 等信息。基于对动态链接的正确理解，请分析出以下说法中错误的一项是：","code":"// dl.c\n#include <dlfcn.h>\n\nconst char *path = \"/lib/libc.so\";\nint (*printf)(const char *x);\n\nint main() {\n  // 加载共享库\n  void *handle = dlopen(path, RTLD_NOW);\n  // 解析符号 \"printf\" 并返回地址\n  printf = dlsym(handle, \"printf\");\n  // 调用\n  printf(\"2022 is just around the corner.\\n\");\n  // 关闭共享库\n  dlclose(handle);\n}","explanation":"B 错误（本题选它）：本程序里 printf 只是一个自定义的、未初始化的全局函数指针变量（第 6 行 int (*printf)(const char *x);），它不是标准库里的 printf 函数，对它取地址/赋值都是普通的变量访问，因此 a.out 中并不存在针对它的 PLT/GOT 条目（它也不需要动态解析）。A 对：省略 -ldl 就报 dlopen 未定义，说明 dlopen 的定义来自 libdl.so，其 .dynsym（动态链接符号表）中必然有 dlopen 这个条目。C 对：dlopen 是从共享库动态解析的，程序需要为它准备 PLT 条目和 GOT 条目（默认延迟绑定/立即绑定视选项而定）。D 对：GCC 按命令行顺序解析库，遇到 -ldl 时还没有任何未解析的符号，因此 -ldl 不起作用，dlopen/dlsym/dlclose 仍然未定义，链接依然报错。踩坑点：链接器只解析“当前已被引用”的符号，库必须放在使用它的目标文件之后。","tags":["动态链接","PLT/GOT","-ldl","共享库"],"options":["该机器上 libdl.so 模块中包含符号名为 dlopen 的动态链接符号表条目。","在 a.out 文件中包含 printf 的 PLT 条目和相应的 GOT 条目。","在 a.out 文件中包含 dlopen 的 PLT 条目和相应的 GOT 条目。","如果使用 gcc -ldl dl.c 编译程序，会在链接时发生错误。"],"answer":1,"kp":"链接"},{"id":"f2021-34","source":"2021 期末","origin":"exam","lecture":15,"topic":"由重定位条目反推符号及其 .bss 偏移","type":"fill","difficulty":3,"stem":"使用 objdump -dx f1.o f2.o 看到如下代码（f1.o 中 main 的片段）。据此可以确定 <main+0x1f> 处的重定位条目是针对哪个符号的重定位？同时该符号定义在 f1.o 中相对于 .bss 节的偏移量是多少（填 16 进制）？","code":"/* 已知源码：\n   f1.c:  const int total = 1 << 30;\n          static int count = 0;\n          static Point pnt;\n          int iter;\n          int main() { for (iter = 0; iter < total; ++iter) {\n                         rand_point(&pnt);\n                         count += if_inside(&pnt); } ... }\n*/\n# objdump 重定位条目格式：OFFSET: TYPE  VALUE\n# f1.o\n0000000000000000 <main>:\n... # 省略无关代码\n 17: e8 00 00 00 00     callq  1c <main+0x1c>\n         18: R_X86_64_PLT32    rand_point-0x4\n 1c: 48 8d 3d 00 00 00 00  lea 0x0(%rip),%rdi\n         1f: R_X86_64_PC32     .bss+0xc\n 23: e8 00 00 00 00     callq  28 <main+0x28>\n         24: R_X86_64_PLT32    if_inside-0x4\n 28: 89 c2               mov %eax,%edx","explanation":"1c 处的 lea 是在准备调用 rand_point 的第一个参数（Point *），即 &pnt；紧接着的 1f 处重定位条目正是给这条 lea 的 4 字节位移字段用的，其目标为 .bss+0xc。由于 f1.c 中放进 .bss 的静态数据只有 count 和 pnt，而此处取的是“调用 rand_point 的参数地址”，所以符号是 pnt。设 pnt 相对 .bss 的偏移为 x：lea 采用 RIP 相对寻址，指令执行时 %rip 指向下一条指令（即 0x20），两种写法（.bss+0xc 与 .bss+x）对应的引用地址相同，于是有等式 0xc + %rip(0x4) = x，即 x = 0xc + 0x4 = 0x10。所以符号是 pnt，偏移量为 0x10。踩坑点：RIP 相对寻址的基准是“下一条指令的地址”，要把指令长度（此处 4 字节）加到重定位字段的偏移上。","tags":["重定位","RIP相对寻址","bss","objdump"],"options":null,"answer":["pnt；偏移量 0x10","pnt, 0x10","pnt；0x10"],"kp":"内存安全与攻击"},{"id":"f2021-35","source":"2021 期末","origin":"exam","lecture":15,"topic":"链接后 PLT32 重定位结果的推算","type":"fill","difficulty":3,"stem":"已链接得到的 a.out 中，f1.o 里 <main+0x17> 处（相对 main 起点）的指令变成 11a1: e8 69 00 00 00 callq <rand_point>。那么 a.out 中 <main+0x23> 处的指令将变成 11ad: e8 ______ callq <if_inside>，请写出下划线处的 4 个字节（16 进制）。","code":"链接前（f1.o）：\n 17: e8 00 00 00 00   callq 1c <main+0x1c>     [18: R_X86_64_PLT32 rand_point-0x4]\n 1c: 48 8d 3d 00 00 00 00  lea 0x0(%rip),%rdi  [1f: R_X86_64_PC32 .bss+0xc]\n 23: e8 00 00 00 00   callq 28 <main+0x28>     [24: R_X86_64_PLT32 if_inside-0x4]\n\n链接后：\n 11a1: e8 69 00 00 00   callq <rand_point>\n (待求) 11ad: e8 __ __ __ __  callq <if_inside>\n\n已知 f2.o 中：0000000000000000 <rand_point>，0000000000000074 <if_inside>","explanation":"两次调用都采用 PC 相对（PLT32 与 PC32 同等看待）的重定位，其结果是“目标地址 − 引用处下一条指令的地址”。已知链接后 rand_point 与 if_inside 的相对距离在同一个 f2.o 中保持不变：if_inside − rand_point = 0x74。第一条 call 占 5 字节，位于 11a1，于是它的“下一条指令地址”是 11a6，重定位值 0x69 意味着 rand_point = 0x11a6 + 0x69。第二条 call 位于 11ad，下一条指令地址是 0x11b2，所以它对 if_inside 的重定位值 = if_inside − 0x11b2 = (0x11a6 + 0x69 + 0x74) − 0x11b2 = 0x11b2 − 0x11b2 + 0x69 + 0x74 − 0x4... 直接把关系整
