的字节序列是 49 20 6c 6f 76 65 20 49 43 53 21；(2) %p 用于输出一个指针的值。程序运行的输出是：","code":"union U{\n    char x[12];\n    char *p;\n} u;\n\nint main() {\n    strcpy(u.x, \"I love ICS!\");\n    printf(\"%p\\n\", u.p);\n    return 0;\n}","explanation":"union U 的成员 x[12] 与指针 p 共享同一段起始内存。strcpy 把 \"I love ICS!\" 的 13 个字节（含结尾的 '\\0'）依次写入 u.x 的起始处，x86-64 又是小端法，所以读取 u.p 时是把最前面的 8 个字节按小端解释成一个 64 位指针：最低地址的 0x49 成为最低字节，最高地址的 0x49（第 8 个字节）成为最高字节，得到 0x492065766f6c2049，选 D。A 把 13 个字节当成一个大整数（相当于 104 位，不是指针），C 虽然只取 8 字节却按大端法理解，B 的字节序完全颠倒。踩坑点：指针本身也是从内存按小端法读出来的，%p 只会打印这 8 个字节。","tags":["union","小端法","指针"],"options":["0x49206c6f76652049435321","0x215343492065766f6c2049","0x49206c6f76652049","0x492065766f6c2049"],"answer":3,"kp":"数据布局与对齐"},{"id":"m2021-03","source":"2021 期中","origin":"exam","lecture":2,"topic":"异或累加的性质","type":"single","difficulty":2,"stem":"阅读如下一段代码，问运行这段代码后的输出是什么：","code":"int s = 0;\nfor (int i = 0; i < 32; i++)\n    s = s ^ i;\nprintf(\"%d\", s);","explanation":"异或满足交换律与结合律，可以把 0~31 两两配对：对任意整数 m，有 (2m) ^ (2m+1) = 1，0~31 正好能配成 16 对，每对异或结果为 1，而偶数个 1 异或起来等于 0，所以输出 0，选 A。也可以逐项找规律：s 的前几项为 0, 1, 3, 0, 4, 1, 7, 0, …，每 4 项回到一次 0，而 31 ≡ 3 (mod 4)，恰好落在“0”上。踩坑点：不要逐项硬算 32 次，用异或的配对性质最快；B、C、D 都是把某个中间结果误当成了最终结果。","tags":["异或","交换律","循环"],"options":["0","1","4","16"],"answer":0,"kp":"控制流与条件码"},{"id":"m2021-04","source":"2021 期中","origin":"exam","lecture":2,"topic":"算术右移与除法的取整差异","type":"single","difficulty":3,"stem":"阅读如下一段代码，问运行这段代码后的输出是什么：","code":"int x = 0x2021;\nint y = -x;\nint z = (x / 2) - (x >> 1) + (y / 2) - (y >> 1);\nprintf(\"%d\", z);","explanation":"x = 0x2021 = 8225 是正奇数：x / 2 向零舍入得 4112，x >> 1 向下取整也得 4112，两项相减为 0。y = -8225 是负奇数：y / 2 向零舍入得 -4112，而 y >> 1 向下取整得 -4113，两项相减为 (-4112) - (-4113) = 1。所以 z = 0 + 1 = 1，选 C。踩坑点：算术右移是向下（向负无穷）取整，除法是向零取整，只有当被除数为负且不能整除时两者才相差 1；本题用一对正负数把两种舍入方向都考了一遍。","tags":["算术右移","向零舍入","取整方向"],"options":["-1","0","1","2"],"answer":2,"kp":"浮点数"},{"id":"m2021-14","source":"2021 期中","origin":"exam","lecture":2,"topic":"小端法下 short 的补码表示","type":"fill","difficulty":2,"stem":"假设某 x86-64 机器在地址 0x100 和 0x101 处存储的数据用二进制表示分别为 [1010 1100]₂ 和 [1111 1011]₂。又假设 x 是一个 short 类型的变量，其地址为 0x100。则 x 的十六进制补码表示是什么？","code":null,"explanation":"x86-64 采用小端法：地址 0x100 存放的是低位字节 1010 1100₂ = 0xAC，地址 0x101 存放的是高位字节 1111 1011₂ = 0xFB，所以这个 16 位 short 的位模式是 0xFBAC。它的最高位为 1，说明是负数；按补码取反加一得 0x0453 = 1108，即 x = -1108。踩坑点：忘记小端法会写成 0xACFB（那样会被解释成正数 44283）；题目只要求给出十六进制的位模式，不必换算成十进制。","tags":["小端法","补码","short"],"options":null,"answer":["0xfbac","fbac"],"kp":"整数与位运算"},{"id":"m2021-15","source":"2021 期中","origin":"exam","lecture":2,"topic":"sizeof 引发的无符号转换","type":"judge","difficulty":2,"stem":"设整型变量采用 32 位补码表示，表达式「(-5) + sizeof(int) < 0」为真。请判断该说法是否正确。","code":null,"explanation":"错误。sizeof 的返回类型是 size_t，属于无符号类型，因此 (-5) + sizeof(int) 中 int 会被隐式转换成无符号数：-5 变成 2^32 - 5，加上 sizeof(int) = 4 后回绕得到 2^32 - 1 = UINT_MAX，是一个极大的正数，表达式 UINT_MAX < 0 为假。踩坑点：有符号与无符号混用时有符号数会被提升为无符号，负数于是变成巨大的正数；只要看到 sizeof 参与运算，就要先想到这个陷阱。","tags":["sizeof","无符号","隐式转换"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2022-01","source":"2022 期中","origin":"exam","lecture":2,"topic":"负数上的取负、取反、除法与右移","type":"single","difficulty":3,"stem":"已知 a 是 int 类型变量，表达式 a < 0 为真，下列选项中一定为真的表达式是：","code":null,"explanation":"A 错：a = TMin = 0x80000000 时，-a 回绕后仍是 TMin，是负数，不满足 -a > 0。B 错：a = -1 时 ~a = 0，不满足 > 0。C 错：a = -1 时 -1/2 向零舍入得 0，不满足 < 0。D 对：算术右移一位在最左侧补符号位，负数右移的结果符号位一定还是 1，因此必然小于 0（a = -1 得 -1，a = TMin 得 0xC0000000，都满足）。踩坑点：TMin 取负会溢出、-1 的除法和取反都恰好得 0，是本题设置的两个典型反例。","tags":["补码","算术右移","向零舍入"],"options":["-a > 0","~a > 0","(a / 2) < 0","(a >> 1) < 0"],"answer":3,"kp":"整数与位运算"},{"id":"m2022-03","source":"2022 期中","origin":"exam","lecture":2,"topic":"有符号与无符号的混合比较","type":"single","difficulty":3,"stem":"假设在 C 语言中有如下声明，则下列表达式结果为真的是：","code":"int i = 0x80000000;\nunsigned u = 0x80000001;\nshort s = 0x8001;","explanation":"A 错：(int)u 把 0x80000001 解读为 -2147483647，而 i = -2147483648，i 比它小 1，所以 i > (int)u 为假。B 错：i - 1 先按补码回绕成 0x7FFFFFFF（正数），再与 unsigned 的 u 比较时被转成 0x7FFFFFFF，小于 u = 0x80000001。C 错：比较时 i 被转成 unsigned 0x80000000，而 (unsigned)-1 = 0xFFFFFFFF，左边大于右边，故 < 为假。D 对：s 与 u 比较时先符号扩展为 int 0xFFFF8001，再转成 unsigned 得 0xFFFF8001，显然大于 u = 0x80000001。踩坑点：有符号和无符号混合运算时统一转成无符号，负数的位模式会变成极大的正数，比较结果与直觉相反。","tags":["无符号","符号扩展","隐式转换"],"options":["i > (int)u","i - 1 > u","(unsigned)-1 < i","s > u"],"answer":3,"kp":"整数与位运算"},{"id":"m2022-04","source":"2022 期中","origin":"exam","lecture":2,"topic":"sizeof 的无符号性、移位与浮点位级比较","type":"single","difficulty":3,"stem":"下列说法正确的是：","code":null,"explanation":"B 对：(x >> 1) << 1 相当于把最低位清零、其余位保持，结果必然不大于 x。A 错：sizeof 返回无符号类型，sizeof(b) - sizeof(a) = 1 - 4 会回绕成一个极大的无符号数，不满足 < 0。C 错：把浮点数按位模式当有符号整数比较，只在符号位相同（同为正或同为负且…）时才与数值比较一致；对负数，位模式越大数值反而越小，所以一般不成立。D 错：双精度的阶码 11 位、偏置 1023，规格化数的真实阶范围是 [-1022, 1023]；单精度才是 [-126, 127]，选项给出的 [-127, 126] 两者都不是。踩坑点：无符号减法回绕、负浮点数的位模式序反转，是两个高频陷阱。","tags":["sizeof","移位","浮点比较"],"options":["在 64 位机器上有 int 型变量 a 和 char 型变量 b，则 sizeof(b) - sizeof(a) < 0 为真","若 x 为整型，则 (x >> 1) << 1 <= x 为真","假设 a, b 为 32 位浮点数，ia, ib 是分别与 a, b 位级表示相同的 32 位有符号整型数，则 a < b 等价于 ia < ib","双精度浮点数所能表示的规格化数的阶码范围为 [-127, 126]"],"answer":1,"kp":"整数与位运算"},{"id":"m2023-01","source":"2023 期中","origin":"exam","lecture":2,"topic":"整型的位级表示与混合类型比较","type":"single","difficulty":3,"stem":"假设在 C 语言中有如下声明，则下列表达式结果为真的是：","code":"unsigned u = 0x7FFFFFFF;\nint i = 0x80000000;\nshort s = 0x7FFF;","explanation":"A 错：int 与 unsigned 混合比较时会把 int 隐式转成 unsigned，i = 0x80000000 转换后仍是 0x80000000，而 u = 0x7FFFFFFF，所以 i > u，A 不成立。B 错：-i 与 i 的位级表示完全相同（都是 0x80000000 = TMin，取负仍是自身），二者相等而不是大于。C 对：(short)i 把 0x80000000 截断为低 16 位得到 0；右侧 s + 1 按 int 计算为 0x00008000 = 32768，比较按 int 进行，0 < 32768 成立。D 错：(unsigned)s 先把 short 按符号扩展为 int 0x00007FFF（s 最高位为 0，是正数），再转成 unsigned 仍是 0x00007FFF，小于 u。踩坑点：混合类型运算会按“更宽的无符号类型”统一，且 short→int→unsigned 的扩展顺序会影响结果。","tags":["补码","符号扩展","隐式类型转换"],"options":["i < u","-i > i","(short)i < s + (int)1","(unsigned)s > u"],"answer":2,"kp":"整数与位运算"},{"id":"m2023-02","source":"2023 期中","origin":"exam","lecture":2,"topic":"整数运算规则与溢出判断","type":"single","difficulty":3,"stem":"下列说法中，正确的是：","code":null,"explanation":"A 错：x 可能为 0（0 作除数会出错），而且 x = -1、z = TMin 时 z / x 也会溢出，所以这个判据并不总成立。B 错：x < -1 时算术右移使数值更小（更负），例如 (-2) >> 1 = -1，而 -1 <= -2 为假。C 错：算术右移是向下（向负无穷）取整，除法是向零取整，x 为负奇数时两者不同，例如 (-1) >> 1 = -1，而 (-1) / 2 = 0。D 对：-x = (~x) + 1，若 x 最低的 k 位为 0、第 k 位为 1，则 ~x 最低 k 位为 1、第 k 位为 0，加 1 产生进位后 -x 的最低 k 位仍为 0、第 k 位为 1，与 x 恰好相反；两者按位与只剩第 k 位为 1，即 x & (-x) = 1 << k，这正是 lowbit 运算的原理。踩坑点：移位与除法在负数上的舍入方向不同，这是最常考的细节。","tags":["算术右移","向零舍入","lowbit"],"options":["对于 int 类型的变量 x，y，z，在执行 z = x * y 后可以用 z / x == y 来判断乘法运算是否没有发生溢出","对于 int 类型的变量 x，(x >> 1) <= x 总为真","对于 int 类型的变量 x，(x >> 1) == (x / 2) 总为真","对于 int 类型的变量 x，总存在一个 k，使得 x & (-x) 的结果等于 1 << k"],"answer":3,"kp":"整数与位运算"},{"id":"m2023-10","source":"2023 期中","origin":"exam","lecture":2,"topic":"lowbit 运算","type":"single","difficulty":1,"stem":"二进制有许多奇妙的应用，其中一个经典运算叫 lowbit，即 lowbit(x) = x & (-x)。问 x = 12 时，lowbit(12) 计算得到：","code":null,"explanation":"12 的二进制是 1100₂，-12 由取反加一得到，按位与只保留最低位的那个 1：1100₂ & (…0100₂) = 0100₂ = 4，故选 B。也可以直接套结论：x & (-x) 等于 1 << k，其中 k 是 x 中最低位 1 的下标（从 0 开始计），12 的最低位 1 在下标 2，故结果为 4。踩坑点：误以为取的是最高位的 1（会得到 8），或以为结果与奇偶性有关。","tags":["lowbit","位运算","补码"],"options":["8","4","2","0"],"answer":1,"kp":"整数与位运算"},{"id":"m2023-13","source":"2023 期中","origin":"exam","lecture":2,"topic":"补码位模式与十进制运算回绕","type":"single","difficulty":3,"stem":"阅读如下一段代码，请问运行这段代码后的输出是什么：","code":"int a = -15;\nunsigned b = 0xfffffff0;\nprintf(\"%d\", ((int)0x80000001 + a) - ((unsigned)0x80000002 + b))","explanation":"按 32 位补码逐项算位模式：a = -15 的位模式是 0xFFFFFFF1，于是 (int)0x80000001 + a 的位模式为 0x80000001 + 0xFFFFFFF1 = 0x7FFFFFF2（加法按模 2^32 回绕）。右侧 (unsigned)0x80000002 + b 中 b = 0xFFFFFFF0，无符号相加得 0x17FFFFFF2，截断为 32 位同样得到 0x7FFFFFF2。最后做减法时因为右侧是无符号类型，左侧也被隐式转换成 unsigned，两个相同的位模式相减得到 0，所以输出 0，选 A。踩坑点：负数的十进制值与它的位模式要分开考虑，补码加法会按模 2^32 回绕；若试图用十进制直接计算会得到 -2147483662 之类的中间值而被 C、D 误导。","tags":["补码","无符号运算","回绕"],"options":["0","1","-2147483647","-2147483647 - 1"],"answer":0,"kp":"整数与位运算"},{"id":"m2023-14","source":"2023 期中","origin":"exam","lecture":2,"topic":"sizeof 的无符号类型陷阱","type":"single","difficulty":3,"stem":"已知 sizeof 操作返回 unsigned 类型，在某按字节编址、大端法存储的机器上运行下面代码，得到的输出为：","code":"char s[16] = \"I love ICS2023!\";\nfor (int i = sizeof(s); i - sizeof(char) >= 0; i -= sizeof(char)) {\n    printf(\"%c\", s[i - 1]);\n}","explanation":"sizeof 的结果类型是 size_t，属于无符号类型。循环条件 i - sizeof(char) >= 0 中，int 与无符号数运算时 i 会被隐式转换为无符号数：当 i 减到 0 时，0 - 1 变为 UINT_MAX（无符号极大值），条件 >= 0 恒成立，于是 i 继续递减为负数，s[i-1] 越界访问内存，循环永远不会结束，故选 D。A、B 都假设循环会正常走完 16 次并打印整个字符串（题设的“大端法”是干扰项，字符数组的存储顺序与大小端无关）；C 也不对，因为前若干次迭代确实会输出字符，只是之后停不下来。踩坑点：有符号数与 sizeof 混用导致的隐式无符号转换是经典陷阱。","tags":["sizeof","隐式转换","无符号"],"options":["I love ICS2023!","!3202SCI evol I","没有输出，程序直接结束","循环不会停止，字符数组越界"],"answer":3,"kp":"控制流与条件码"},{"id":"m2024-01","source":"2024 期中","origin":"exam","lecture":2,"topic":"移位与按位运算的恒等性","type":"single","difficulty":3,"stem":"在 x86-64 机器上，产生随机的 32 位有符号整数 `x` 和 `y`。下列表达式中不恒为真的是：","code":null,"explanation":"A 恒真：算术右移再左移等价于把最低位清零，结果不会超过原值。B 恒真：分两种情况——x 非 0 时 x|-x 的符号位一定是 1，算术右移 31 位得到 -1，加 1 得 0，恰等于 !x；x 为 0 时 x|-x=0，右移得 0，加 1 得 1，也等于 !x。D 恒真：因为 ~x = -x-1，所以 (~x)-y = -x-1-y = -y-1-x = (~y)-x，两个异或项完全相同，再由异或的交换律知两边恒等。只有 C 不恒真：取反例 x = TMin = 0x80000000、y = 0，此时 -x = TMin < 0 为真，而 -y = 0 < TMin 为假，两边不等。踩坑点：TMin 取负仍等于自身是唯一的例外，只有想到这个特殊值才能构造反例。","tags":["补码","移位","位运算"],"options":["((x >> 1) << 1) <= x","((x | -x) >> 31) + 1 == !x","(-x < y) == (-y < x)","(x ^ y ^ ((~x) - y)) == (y ^ x ^ ((~y) - x))"],"answer":2,"kp":"整数与位运算"},{"id":"m2024-02","source":"2024 期中","origin":"exam","lecture":2,"topic":"小端法与指针算术","type":"single","difficulty":3,"stem":"在 x86-64 机器上运行如下代码，输出是（提示：'0','1',…,'9' 的 ASCII 码分别是 0x30, 0x31, …, 0x39）：","code":"char A[12] = \"19260817\";\nchar B[12] = \"20241104\";\nvoid *x = (void *)&A;\nvoid *y = 2 + (void *)&B;\nunsigned short P = *(unsigned short *)x;\nunsigned short Q = *(unsigned short *)y;\nprintf(\"0x%04x\", (unsigned short)(P - Q));","explanation":"x 指向 A[0]，P 读入 A[0]、A[1] 两个字节 0x31、0x39，小端法下组成 0x3931；y = (char*)&B + 2 指向 B[2]（void* 的偏移按字节计），Q 读入 0x32、0x34，小端法下为 0x3432。于是 P - Q = 0x3931 - 0x3432 = 0x04ff，按 unsigned short 输出即 0x04ff，选 B。若忘记小端法，会按 0x3139 - 0x3234 = 0xff05 误选 A；若以为 +2 是按某种元素步长偏移，就会得到 C 或 D 这类无意义的字节组合。踩坑点：字节序与指针偏移这两件事要同时处理对。","tags":["小端法","指针运算","ASCII"],"options":["0xff05","0x04ff","0x0822","0x0800"],"answer":1,"kp":"数据布局与对齐"},{"id":"s2025a-01","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"二进制位模式转十进制","type":"fill","difficulty":1,"stem":"两个 8 位二进制数 `10110101` 和 `01011100`，分别记为 a 和 b。a 转换为十进制表示为多少？","code":null,"explanation":"按位展开：2^7+2^5+2^4+2^2+2^0 = 128+32+16+4+1 = 181。注意题目问的是这 8 位位模式按无符号读出来的十进制值，所以答案是 181；如果把它当成 8 位补码（最高位为 1 表示负数），数值应为 181-256 = -75，两者不要混淆。位模式本身没有符号，符号是解释方式带来的。","tags":["进制转换","位模式","补码"],"options":null,"answer":["181"],"kp":"整数与位运算"},{"id":"s2025a-02","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"二进制转十六进制","type":"fill","difficulty":1,"stem":"两个 8 位二进制数 `10110101` 和 `01011100`，分别记为 a 和 b。b 转换为十六进制表示为多少？","code":null,"explanation":"十六进制每一位对应 4 个二进制位，从低位起每 4 位一组：`01011100` 分成 `0101` 与 `1100`，前者是 5，后者是 12 即 C，因此结果是 0x5C。反之，十六进制转二进制时也应每 1 位拆成 4 位，这样能避免常见的位数错位错误。批卷说明规定：用十六进制表示时没写 0x 不扣分。","tags":["进制转换","十六进制"],"options":null,"answer":["0x5C","5C","0x5c","5c"],"kp":"整数与位运算"},{"id":"s2025a-03","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"按位与运算","type":"fill","difficulty":1,"stem":"a = `10110101`，b = `01011100`。a 和 b 做按位与操作 a&b，结果用十六进制表示是多少？","code":null,"explanation":"逐位与：10110101 & 01011100 = 00010100。按 4 位一组看就是 0001 与 0100，即 0x14。按位与的规则是「两个都为 1 才为 1」，所以原数中只要有一位是 0，结果的对应位就是 0。用十进制核对：181 & 92 = 20 = 0x14，两种算法互相印证。","tags":["位运算","按位与"],"options":null,"answer":["0x14","14","0x014"],"kp":"整数与位运算"},{"id":"s2025a-04","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"逻辑非运算 !!b","type":"fill","difficulty":1,"stem":"b = `01011100`（即 0x5C）。用 C 语言中的逻辑「非」操作计算 `!!b`，结果用十六进制表示是多少？","code":null,"explanation":"C 语言的 `!` 是逻辑非：先把操作数当作「零/非零」判断，结果为 0 或 1。b = 0x5C 非零，所以 `!b` = 0，再取一次非得到 `!!b` = 1，写成十六进制就是 0x01。注意 `!` 与按位取反 `~` 完全不同：`~b` 会把每一位都翻转，结果是 0xA3，而 `!!b` 只输出 0 或 1，这是把任意值规格化成布尔值的常用写法。","tags":["逻辑运算","布尔值规格化"],"options":null,"answer":["0x01","1","0x1","01"],"kp":"整数与位运算"},{"id":"s2025a-05","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"有符号数与无符号数比较","type":"single","difficulty":2,"stem":"将 C 语言中的两个常量比较大小：`-10` 和 `10U`，二者的关系是？","code":null,"explanation":"当有符号数与无符号数混合比较时，C 语言会把有符号数按位模式重新解释为无符号数：-10 的补码是 0xFFFFFFF6，解释成无符号数是 4294967286，远大于 10，所以结果是「大于」。这是典型的隐蔽陷阱：数学上 -10 < 10，但机器上比较结果相反。要避免踩坑，应显式写成 `-10 > 10` 之前先强制转换，例如 `(int)10U` 或直接用有符号常量 10 做比较。","tags":["有符号与无符号","整型转换","补码"],"options":["大于","小于","等于"],"answer":0,"kp":"整数与位运算"},{"id":"s2025a-06","source":"2025 第 1 次阶段测验","origin":"exam","lecture":2,"topic":"整型提升与符号扩展","type":"fill","difficulty":2,"stem":"分析下面这段 C 语言代码，`iy` 的首字节的值用十六进制表示是多少？","code":"short int y = -12;\nint iy = (int) y;","explanation":"-12 的 16 位补码是 0xFFF4。short 转 int 是符号扩展：最高位为 1，所以高 16 位全部补 1，得到 0xFFFFFFF4，按从高位到低位书写的「首字节」是 0xFF，本题官方答案即取此意。（若把「首字节」理解为小端机器上最低地址处的那个字节，则应为 0xF4——这正是本题的争议点，答题时以题目的高位字节读法为准。）","tags":["符号扩展","整型提升","补码"],"options":null,"answer":["0xFF","FF","0xff","ff"],"kp":"整数与位运算"},{"id":"gen-c02-01","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"补码编码与十六进制","type":"single","difficulty":1,"stem":"在 16 位补码（`short`）表示下，十进制数 -15213 的十六进制表示是：","code":null,"explanation":"15213 的二进制是 0011 1011 0110 1101，即十六进制 0x3B6D（这是选项 B，正数 15213 的编码）。求 -15213 的补码：取 0x3B6D 的按位取反得 0xC492，再加 1 得 0xC493，也可用 2^16 - 15213 = 65536 - 15213 = 50323 = 0xC493 验证。选项 C 是只对低字节取反而未加 1 的常见错误；选项 D 是从最高字节就开始错的乱值。注意补码的最高位为 1 表示负数，0xC493 的最高位正是 1，符合负数预期。对应第 2 讲「Encoding Integers：B2T 与 B2U」一节，讲义中 y = -15213 的编码即 C4 93。","tags":["补码","十六进制","编码"],"options":["0xC493","0x3B6D","0xC413","0x9493"],"answer":0,"kp":"整数与位运算"},{"id":"gen-c02-02","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"逻辑右移与算术右移","type":"single","difficulty":1,"stem":"对 8 位位向量 `10100010` 执行算术右移 2 位（每移一位都在左侧复制最高位）后，得到的十六进制值是：","code":null,"explanation":"算术右移在左侧复制符号位。10100010 的符号位是 1，右移 1 位得 11010001，再右移 1 位得 11101000 = 0xE8（作为 8 位补码即 -24，而 -94/4 = -23.5 向下取整为 -24，验证一致）。选项 A 的 0x28 = 00101000 是逻辑右移（左侧补 0）的结果，是最常见的混淆项；选项 C 0x68 = 01101000 相当于只复制了一个 1；选项 D 根本不是移位结果。要注意 C 中对有符号数右移是算术右移、对无符号数是逻辑右移，而移位量小于 0 或不小于字长属于未定义行为。对应第 2 讲「Shift Operations：Logical vs. Arithmetic」一节。","tags":["移位","算术右移","补码"],"options":["0x28","0xE8","0x68","0x8A"],"answer":1,"kp":"整数与位运算"},{"id":"gen-c02-03","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"C 语言隐式类型转换与比较","type":"single","difficulty":2,"stem":"在 32 位 `int`、`unsigned int` 的平台上，下列 C 表达式中值为 1（真）的是：","code":null,"explanation":"一旦表达式中同时出现有符号与无符号整数，有符号数会被隐式转换为无符号数，比较运算也不例外。选项 A：-1 转为 4294967295U，4294967295 < 0 为假。选项 B：-2147483647-1 就是 INT_MIN（写成两段是为了避免常量 2147483648 被提升为 long），它转为 2147483648U，于是 2147483647U < 2147483648U 为真，故 B 是唯一为真的表达式。选项 C：两个有符号数比较，-1 < -2 为假。选项 D：-2 转为 4294967294U，4294967295 < 4294967294 为假。踩坑点在于「负数转无符号后变成极大正数」，会让一切比较关系反转。对应第 2 讲「Casting Surprises」一节中的 32 位常量比较表。","tags":["隐式转换","无符号","比较"],"options":["`-1 < 0U`","`2147483647U < -2147483647-1`","`-1 < -2`","`(unsigned)-1 < -2`"],"answer":1,"kp":"整数与位运算"},{"id":"gen-c02-04","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"截断（truncation）","type":"single","difficulty":2,"stem":"在 x86-64/Linux（`int` 4 字节、`short` 2 字节）上执行下列代码后，y 的值是：","code":"int x = 53191;\nshort sx = (short) x;   /* 截断为 16 位 */\nint y = sx;             /* 再扩展回 32 位 */","explanation":"53191 的十六进制是 0xCFC7，二进制 1100 1111 1100 0111。`(short)` 截断只保留低 16 位，仍是 0xCFC7，但按 16 位补码解释，最高位为 1，值为 0xCFC7 - 2^16 = 53191 - 65536 = -12345。再把 short 扩展回 int 时做符号扩展，得到 0xFFFFCFC7，其值仍然是 -12345。选项 A 误以为截断不影响数值；选项 C 是随意把符号翻倍；选项 D 忽略了最高位的符号。规律是：截断到 w 位相当于对 2^w 取模，再按补码重新解释，因此结果可能会变号。对应第 2 讲「Truncation: Simple Example」与「Summary: Expanding, Truncating」一节。","tags":["截断","符号扩展","补码"],"options":["53191","-12345","-53191","12345"],"answer":1,"kp":"整数与位运算"},{"id":"gen-c02-05","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"算术右移与除法的差异","type":"single","difficulty":3,"stem":"对 `int` 型变量 x，表达式 `x >> 3 == x / 8` 在什么情况下不成立？","code":null,"explanation":"C 的整数除法向零取整，而算术右移 x >> 3 是向 -∞ 取整：右移丢掉的低位被直接丢弃，相当于加上符号位后的 floor(x/8)。当 x ≥ 0 时两者一致；当 x < 0 且 x 是 8 的倍数时也一致（如 -16 >> 3 = -2 且 -16/8 = -2）；但当 x < 0 且不能整除时就不一致，例如 x = -1：-1 >> 3 = -1（二进制全 1），而 -1/8 = 0。选项 B 错，正数时两者总相等；选项 C 错，TMin 是 8 的倍数，反而相等；选项 D 正是被这个题目戳破的常见误解。若要给编译器用移位实现除法，必须为负数补上偏置：`(x + (1<<3) - 1) >> 3`。对应第 2 讲整数 C 陷阱列表中的 `x >> 3 == x/8`，以及「Power-of-2 Divide with Shift」一节。","tags":["算术右移","除法","取整"],"options":["当 x 为负数且不能被 8 整除时","当 x 为正数且不能被 8 整除时","只有当 x 等于 TMin 时","恒成立，因为算术右移就是除以 8"],"answer":0,"kp":"整数与位运算"},{"id":"gen-c02-06","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"补码与无符号运算规律","type":"multi","difficulty":2,"stem":"关于无符号数与补码数的运算，下列说法正确的有：","code":null,"explanation":"选项 A 正确：补码加法与无符号加法都是「按位相加、丢弃最高进位」，位级行为完全相同，讲义中特别指出 `s = (int)((unsigned)u + (unsigned)v)` 与 `t = u + v` 得到相同结果。选项 B 错误：正因为位级行为一致，x86-64 只有一条 `addq`，指令层面不区分有符号与无符号，只有比较、右移、除法才需要区分。选项 C 正确：算术右移在左侧复制符号位，等于 floor(x/2^k)，例如 -1 >> 3 仍是 -1。选项 D 正确：这是扩展的基本规则，`short` 转 `int` 时 -15213 的 0xC493 会变成 0xFFFFC493，而 `unsigned short` 转 `int` 则补 0。选项 E 错误且方向恰好说反：C 的规定是「有符号向无符号转换」，即 int 被重新解释为 unsigned，这正是 `-1 < 0U` 为假的根源。对应第 2 讲「Summary: Arithmetic Basic Rules」「Sign Extension」与「Casting Surprises」三节。","tags":["补码","无符号","符号扩展","溢出"],"options":["无符号加法与补码加法在机器位级上执行的是同一个加法，只是对结果的解释不同","编译器必须为有符号加法和无符号加法生成不同的加法指令","有符号数右移采用算术右移时，负数右移相当于向 -∞ 方向取整","从较短类型扩展到较长类型时，有符号数在高位复制符号位，无符号数在高位补 0","当表达式中同时出现 `int` 与 `unsigned int` 时，`unsigned int` 会被转换成 `int` 再参与运算"],"answer":[0,2,3],"kp":"整数与位运算"},{"id":"gen-c02-07","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"小端字节序","type":"judge","difficulty":2,"stem":"在 x86-64（小端）机器上，执行 `int x = 0x01234567;`。若 `&x` 的值为 0x100，则内存地址 0x100、0x101、0x102、0x103 处的字节依次是 67、45、23、01。","code":null,"explanation":"判断正确。x86-64 采用小端（Little Endian）字节序：最低有效字节存放在最低地址。0x01234567 的最低有效字节是 0x67，所以它放在 0x100；接着 0x45 放在 0x101，0x23 放在 0x102，最高有效字节 0x01 放在 0x103。若在大端（Big Endian，如老式 Sun、网络字节序）机器上，则依次是 01 23 45 67。教材中的 show_bytes 例子里，`int a = 15213;` 打印出的顺序就是 6d 3b 00 00，同样体现了「低位字节在低地址」。注意字符串（char 数组）不受字节序影响，因为每个字符只占 1 字节。对应第 2 讲「Byte Ordering」与「show_bytes Execution Example」一节。","tags":["字节序","小端","内存布局"],"options":null,"answer":true,"kp":"整数与位运算"},{"id":"gen-c02-08","source":"自编 · 第 2 讲","origin":"created","lecture":2,"topic":"TMin 取负溢出","type":"fill","difficulty":3,"stem":"在 32 位补码的机器上，设 `int x = -2147483648;`（即 INT_MIN），请写出表达式 `-x` 的十进制值。","code":null,"explanation":"32 位补码的取值范围是不对称的：TMin = -2^31 = -2147483648，TMax = 2^31-1 = 2147483647。取负在机器上实现为「取反加一」，对 0x80000000 取反得 0x7FFFFFFF，加 1 又回到 0x80000000，仍被解释为 -2147483648，即数学上的 +2^31 无法用 32 位补码表示，发生了溢出。这解释了讲义整数题单里 `x >= 0 => -x <= 0` 为什么不成立（x = TMin 时 -x 仍是负数），以及 `|TMin| = TMax + 1` 的不对称性。踩坑点：不能简单地认为「负数取负一定是正数」。对应第 2 讲「Numeric Ranges」与「Arithmetic: Basic Rules」一节。","tags":["TMin","取负","溢出","补码"],"options":null,"answer":["-2147483648","-2^31","0x80000000"],"kp":"整数与位运算"},{"id":"f2013-01","source":"2013 期末","origin":"exam","lecture":3,"topic":"浮点格式参数变化的影响","type":"single","difficulty":2,"stem":"对于 IEEE 浮点数，如果减少 1 位指数位，将其用于小数部分，将会产生怎样的效果？","code":null,"explanation":"指数位变少，阶码能覆盖的范围变小，因此可表示的最大实数（绝对值）变小、最小可表示的正数变大；小数位增加使有效数字更多，精度更高。同时指数位被削减后，全 0/全 1 阶码所对应的非规格化数、无穷与 NaN 占掉了更多比例，能被“真实数值”使用的位模式反而减少，所以实数个数是减少而不是增加。A 错在“更多数量的实数值”，B 错在“数量没有变化”（位模式总数固定为 2^w，但可表示的不同实数个数会随字段划分而变），D 显然不成立。踩坑点：不要把“位模式总数”与“能表示的不同实数个数”混为一谈。","tags":["IEEE 754","阶码","精度"],"options":["能表示更多数量的实数值，但实数值取值范围比原来小了。","能表示的实数数量没有变化，但数值的精度更高了。","能表示的最大实数变小，最小的实数变大，但数值的精度更高。","以上说法都不正确。"],"answer":2,"kp":"浮点数"},{"id":"f2013-19","source":"2013 期末","origin":"exam","lecture":3,"topic":"自定义 IEEE 浮点格式的编码","type":"fill","difficulty":3,"stem":"考虑一种遵从 IEEE 规范的浮点格式，包含 3 位指数位、4 位小数位和 1 位符号位，指数偏置值为 3。请写出十进制数 **-15.5** 的 8 位二进制表示。","code":null,"explanation":"-15.5 为负，符号位 s = 1。15.5 = 1.9375 × 2^3，真实阶为 3，加上偏置 3 得阶码字段 E = 6 = 110₂；小数部分 M = 0.9375 = 15/16 = 1111₂（隐藏位使有效数为 1.1111）。拼起来就是 1 | 110 | 1111 = 11101111。验算：(-1)^1 × 1.1111₂ × 2^(6-3) = -1.9375 × 8 = -15.5，正确。踩坑点：偏置值要加在真实阶上得到“无符号”的阶码字段，4 位小数恰好能精确表示 15/16。","tags":["IEEE 754","偏置值","规格化数"],"options":null,"answer":["11101111"],"kp":"浮点数"},{"id":"f2013-20","source":"2013 期末","origin":"exam","lecture":3,"topic":"浮点编码中的就近舍入","type":"fill","difficulty":3,"stem":"同一格式（1 位符号、3 位指数、4 位小数、偏置 3）下，把十进制数 63/128（= 0.4921875）按“就近舍入、偶数优先”的规则编码，其 8 位二进制表示是什么？","code":null,"explanation":"63/128 = 0.4921875 = 1.96875 × 2^(-2)，真实阶为 -2，加偏置 3 得阶码字段 E = 1 = 001₂，符号位为 0，隐藏位给出有效数 1.96875。4 位小数能表示 1.9375（1111）或进位后的 2.0（即 010 | 0000），两者与 1.96875 的距离都恰好是 0.03125，按“就近舍入到偶数”的规则应选最低有效位为 0 的 2.0，于是编码为 0 | 010 | 0000 = 00100000，对应值 1/2。踩坑点：这种情况下必须进位并同时调整阶码，简单截断成 1111 是错的。","tags":["IEEE 754","舍入","就近偶数"],"options":null,"answer":["00100000"],"kp":"浮点数"},{"id":"f2014-02","source":"2014 期末","origin":"exam","lecture":3,"topic":"IEEE 浮点格式的字段划分与特殊值","type":"single","difficulty":2,"stem":"下面关于 IEEE 浮点数标准说法正确的是","code":null,"explanation":"位宽固定只说明位模式总数固定（2^w），但“能表示的不同实数个数”会随阶码/小数位的划分而改变（±0、非规格化数、Inf/NaN 各占掉一些模式），故 A 错。最大数由阶码位数决定、最小正数由阶码下界与非规格化数决定，11 位格式若把更多位分给小数、更少给阶码，其最大数可能比 10 位格式还小、最小正数可能更大，所以 B、C 中的“一定”不成立。D 可行：若该 7 位格式取 1 位符号 + 2 位阶码 + 4 位小数，“0111000”的阶码为全 1 而小数非 0，正是 NaN。","tags":["IEEE 754","NaN","阶码与小数位"],"options":["在位数一定的情况下，不论怎么分配 exponent bits 和 fraction bits，所能表示的数的个数是不变的","如果甲类浮点数有 10 位，乙类浮点数有 11 位，那么甲所能表示的最大数一定比乙小","如果甲类浮点数有 10 位，乙类浮点数有 11 位，那么甲所能表示的最小正数一定比乙小","“0111000”可能是 7 位浮点数的 NAN 表示"],"answer":3,"kp":"浮点数"},{"id":"f2015-02","source":"2015 期末","origin":"exam","lecture":3,"topic":"单精度浮点数的位模式","type":"single","difficulty":2,"stem":"单精度浮点数 27.5 实际存储在内存中的十六进制数值为（阶码 8 位，尾数 23 位）","code":null,"explanation":"27.5 = 11011.1₂ = 1.10111₂ × 2^4，符号位 0，阶码字段 = 127 + 4 = 131 = 10000011₂，小数字段 = 10111 后补 0。按每 4 位一组写成十六进制：0100 0001 1101 1100 0000… = 0x41DC0000。0x41EE0000 对应 29.75；0x425C0000 约为 55；0x025C0000 的阶码太小。踩坑点：阶码用的是偏置表示（bias = 127），不是补码。","tags":["IEEE 754","单精度","偏置阶码"],"options":["0x41ee0000","0x425c0000","0x41dc0000","0x025c0000"],"answer":2,"kp":"浮点数"},{"id":"f2016-02","source":"2016 期末","origin":"exam","lecture":3,"topic":"补码小数字段的浮点格式","type":"single","difficulty":3,"stem":"现有一个二进制浮点的表示规则：E 为指数部分，3 比特，bias 为 3；M 为小数部分，5 比特，采用二进制补码表示形式，且取值 ½ ≤ |M| < 1；s 是符号位；该形式包含一个值为 1 的隐藏位。如果用该形式表示 +5，s、E 和 M 分别是","code":null,"explanation":"该格式的值 = (-1)^s × (1 + M) × 2^(E-3)，把 5 位补码小数解释为 -b4 + b3/2 + b2/4 + b1/8 + b0/16。A：M = 01100 = 0.75，得 1.75 × 2^(4-3) = 3.5 ≠ 5。B：M = 00100 = 0.25，不满足 ½ ≤ |M| 的约束。C：M = 11010 = -1 + 0.5 + 0.125 = -0.375，同样不满足 |M| ≥ ½。D：M = 10101 = -1 + 0.25 + 0.0625 = -0.6875，|M| = 0.6875 满足约束，且 (1 - 0.6875) × 2^(7-3) = 0.3125 × 16 = 5，正确。踩坑点：小数位是补码，M 可以为负，隐藏位表示的是 1 + M 而不是 1 + |M|。","tags":["浮点格式","补码小数","隐藏位"],"options":["0, 100, 01100","0, 101, 00100","0, 110, 11010","0, 111, 10101"],"answer":3,"kp":"整数与位运算"},{"id":"f2017-02","source":"2017 期末","origin":"exam","lecture":3,"topic":"浮点阶码采用偏置表示的原因","type":"single","difficulty":2,"stem":"浮点数的阶码没有设计成补码的形式的原因是","code":null,"explanation":"阶码采用“无符号值 + 偏置（bias）”的表示后，非负浮点数的位模式按无符号整数解释时，其大小顺序与浮点数值的顺序完全一致，于是用整数比较电路就能直接比较两个浮点数的大小（IEEE 754 早期甚至有专门的浮点比较指令），也就是为了方便排序。用补码会破坏这种单调性。同时偏置表示让全 0 与全 1 的阶码自然留给非规格化数和 Inf/NaN，但这是附带好处，不是主要原因；A、C 与阶码编码方式无关。","tags":["IEEE 754","偏置阶码","浮点比较"],"options":["为了加快四则运算","为了方便排序","为了保存更多数值","为了表示特殊值"],"answer":1,"kp":"浮点数"},{"id":"f2019-01","source":"2019 期末","origin":"exam","lecture":3,"topic":"浮点加法不满足结合律与编译优化限制","type":"single","difficulty":2,"stem":"已知浮点运算表达式：t = a + b; x = t + c; y = d + t; 下列表达式中，x、y 不能都得到相同的计算结果的是：","code":null,"explanation":"参考计算的语义是：先算一次 t = a+b（只舍入一次），再分别求 t+c 与 d+t。逐个看选项：A 中 x = a+b+c 按左结合等于 (a+b)+c = t+c，与参考一致；但 y = d+a+b 按左结合等于 (d+a)+b，它先把 d 与 a 相加并舍入，再与 b 相加，与参考的 d+(a+b) 相比多了一次舍入、且加法的“配对”不同，浮点加法不满足结合律，因此一般得不到相同结果——这一项就是答案。B、D 中的 y 都写成 d+(a+b)，等于 d+t，与参考完全一致（D 的 x 也显式写成 (a+b)+c）。C 中 x = c+(a+b) = c+t，虽然加法次序与 t+c 相反，但 IEEE 浮点加法满足交换律（a+b 与 b+a 逐位相同），所以结果相同；y = a+b+d = (a+b)+d = t+d，同样只依赖交换律。所以只有 A 不能保证两个表达式都得相同结果。踩坑点：浮点加法可交换但不可结合，这一点也是编译器不敢随意重排浮点表达式（2021 年试题曾专门考过）的原因。","tags":["浮点数","结合律","舍入"],"options":["x = a + b + c;  y = d + a + b;","x = a + b + c;  y = d + (a + b);","x = c + (a + b);  y = a + b + d;","x = (a + b) + c;  y = d + (a + b);"],"answer":0,"kp":"浮点数"},{"id":"f2020-04","source":"2020 期末","origin":"exam","lecture":3,"topic":"类型转换中的溢出与舍入","type":"single","difficulty":1,"stem":"下列哪种类型转换既可能导致溢出、又可能导致舍入？","code":null,"explanation":"B（float 转 int）二者皆有可能：float 只有 24 位有效位，绝对值超过 2^24+1 的整数无法精确表示，因此转成 int 时小数部分被截断（舍入）；而当浮点值超出 int 的表示范围（如 1e10 或 NaN）时，转换结果溢出/未定义（x86 上通常得到 INT_MIN）。A 错：int 的取值范围远小于 float 的最大值（约 3.4×10^38），不会溢出，但 int 的 32 位有效位多于 float 的 24 位，会发生舍入（例如 16777217 转 float 变成 16777216）。C 错：double 有 53 位有效位且指数范围更大，int 转 double 既不舍入也不溢出。D 错：float 转 double 是精确的（double 的有效位和指数范围都更大），既不舍入也不溢出。踩坑点：判断“是否舍入”看有效位数，判断“是否溢出”看指数范围。","tags":["类型转换","浮点表示","舍入","溢出"],"options":["int 转 float","float 转 int","int 转 double","float 转 double"],"answer":1,"kp":"整数与位运算"},{"id":"f2021-01","source":"2021 期末","origin":"exam","lecture":3,"topic":"整数/浮点运算律的成立范围","type":"single","difficulty":2,"stem":"现定义了如下变量：int x, y, z; float fx, fy, fz; 则以下表达式不恒为真的是（其中 fx、fy 均不为无穷或非数，NaN 和 int 类型溢出按照模运算处理）：","code":null,"explanation":"D 不恒为真（本题选它）：浮点乘法不满足分配律，典型反例是“大数吃小数”——当 fx+fz 与 fy 相比量级差别很大时，(fx+fy)*fz 在求 (fx+fy) 时已经把小的加数舍入掉，而 fx*fz + fy*fz 分别保留了各自的量级，两者结果可能不同。A 恒真：题目已说明整数溢出按模 2^32 处理，模运算下的乘法满足交换律。B 恒真：模运算下乘法对加法满足分配律。C 恒真：IEEE 浮点加法满足交换律（fx+fy 与 fy+fx 的舍入结果逐位相同），浮点只有结合律和分配律不成立。踩坑点：浮点运算“可交换、不可结合、不可分配”，这也正是编译器不敢随意重排浮点表达式的原因。","tags":["浮点数","分配律","舍入"],"options":["x * y == y * x","(x + y) * z == x * z + y * z","fx + fy == fy + fx","(fx + fy) * fz == fx * fz + fy * fz"],"answer":3,"kp":"浮点数"},{"id":"f2024-01","source":"2024 期末","origin":"exam","lecture":3,"topic":"4 位浮点(float4)与整数位模式的相互转换","type":"single","difficulty":3,"stem":"假想一类“半字节数”（4-bit）的数据类型，包含有符号整数（int4，补码表示）与浮点数（float4）。float4 基于 IEEE 浮点格式：1 个符号位、2 个阶码位（k=2）、1 个小数位（n=1）。函数 `f2b(f)` 返回 f 的二进制位模式（例如 f 的位模式为 0100 时返回 int4 值 4），函数 `f2i(f)` 返回把 f 的值向零舍入后的 int4 结果。下面的 `fun()` 从 0000 到 1111 枚举所有非 NaN、非 ±INF 的 float4 可表示值并比较两个函数的返回值。请问 `f2b(f)` 与 `f2i(f)` 相等时，f 的二进制表示是：① 0000 ② 0001 ③ 1000 ④ 1101","code":"int4 f2b(float4 f) {\n  union {\n    int4 d;\n    float4 f;\n  } temp;\n  temp.f = f;\n  return temp.d;\n}\n\nint4 f2i(float4 f) {\n  return (int4) f;\n}\n\nvoid fun() {\n  for (float4 f from 4'b0000 to 4'b1111) {\n    if (isnan(f) || isinf(f)) continue;\n    if (f2b(f) == f2i(f)) printf(\"Success!\\n\");\n  }\n}","explanation":"float4 只有 4 位，阶码位 k=2，偏移量 Bias = 2^(k-1)-1 = 1，非规格化数的最小指数为 1-Bias = 0。逐项验证四个候选：① 0000 的阶码与小数全为 0，值为 +0.0，f2b 得到位模式 0000 即 int4 的 0，f2i 得到 (int4)0.0 = 0，相等，① 正确。② 0001 阶码为 00、小数为 1，是非规格化数 0.1₂×2^0 = 1/2；f2b 得到位模式 0001 即 int4 的 1，而 f2i 把 0.5 向零舍入得 0，二者不等，② 错误。③ 1000 是符号位为 1、阶码与小数全 0 的 −0.0；f2b 得到位模式 1000，按补码解释是 −8，而 f2i 得到 (int4)(−0.0) = 0，二者不等，③ 错误（这是本题最大的坑：同一个位模式按整数和按浮点解释含义完全不同，−0.0 不会返回 −0）。④ 1101 符号 1、阶码 10₂=2、小数 1，值为 −1.1₂×2^(2−1) = −3；f2b 得到位模式 1101，按补码解释恰好是 −3，f2i 得到 (int4)(−3.0) = −3，相等，④ 正确。所以只有 ①④ 满足，选 D。选项 A 漏掉了 ④；选项 C 错把 ③（−0.0）算了进去；选项 B 同时错收 ②（0.5 被向零舍入为 0，但位模式是 1）与 ③。","tags":["IEEE浮点格式","非规格化数","补码","向零舍入","联合体"],"options":["①","①②④","①③","①④"],"answer":3,"kp":"浮点数"},{"id":"lab2025-13","source":"2025 Lab 测验","origin":"exam","lecture":3,"topic":"浮点数减半与非规格化过渡","type":"single","difficulty":3,"stem":"下面给出了 float_half 函数的代码，该函数返回单精度浮点数 f 的一半（0.5*f）的位模式。哪一个选项正确给出了 (1) 和 (2) 处应当填写的值？","code":"/*\n * float_half - Return bit-level equivalent of expression 0.5*f for\n *   floating point argument f.\n *   When argument is NaN, return argument.\n */\nunsigned float_half(unsigned uf) {\n  unsigned sign = uf >> 31;\n  unsigned exp  = (uf >> 23) & 0xFF;\n  unsigned frac = uf & 0x7FFFFF;\n  /* Only roundup case will be when rounding to even */\n  unsigned roundup = (frac & 0x3) == 3;\n  if (exp == 0) {\n    /* Denormalized. Must halve fraction */\n    frac = (frac >> 1) + roundup;\n  } else if (exp < 0xFF) {\n    /* Normalized. Decrease exponent */\n    exp--;\n    if (exp == 0) {\n      /* Denormalize adding back leading one */\n      frac = (frac >> 1) + roundup + _____(1)_____;\n    }\n  }\n  /* NaN Infinity do not require any changes */\n  return (sign << 31) | (exp << _____(2)_____) | frac;\n}","explanation":"(1) 处处理的是「规格化数除以 2 后阶码减小到 0，需要变成非规格化数」的情形：原来隐含的前导 1 现在必须显式写进尾数域。除以 2 相当于把有效数右移一位，隐含的 1 移入尾数域的最高位 bit22，对应的掩码正是 1 << 22 = 0x400000（0x800000 是 bit23，已经不属于 23 位尾数范围，故 A、B 错）。由 0x400000 也可验证：非规格化数的值等于 frac × 2^-149，而阶码为 1 的规格化数除以 2 后正是 2^-126/2 = 2^-127，对应 frac = 2^22。(2) 处是把处理后的 8 位 exp 重新拼接回 bit30~bit23，必须左移 23 位，故选 23 而不是 8。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["IEEE 754","非规格化数","float_half"],"options":["(1) 0x800000  (2) 8","(1) 0x800000  (2) 23","(1) 0x400000  (2) 8","(1) 0x400000  (2) 23"],"answer":3,"kp":"浮点数"},{"id":"m2012-05","source":"2012 期中","origin":"exam","lecture":3,"topic":"非规格化浮点数","type":"single","difficulty":1,"stem":"非规格化（denormalized）浮点数的特点是：","code":null,"explanation":"非规格化数的阶码字段全 0，此时指数按 E = 1 - Bias 解释（单精度为 -126），有效位数 M = 0.frac 而不是默认的 1.frac，因此它们的绝对值都严格小于最小的规格化数，用于表示非常接近 0 的数，并让 0 附近的表示间隔保持均匀（还包括正负两个零）。B 描述的是最大规格化数附近的量级；C 错误，非规格化数完全可以在数轴上标出；D 错误，只有 frac 也全 0 时才表示 ±0。","tags":["IEEE 754","非规格化数","阶码"],"options":["非常接近 0（绝对值很小）","远离 0（绝对值很大）","无法在数轴上表示","其值就是 0"],"answer":0,"kp":"浮点数"},{"id":"m2012-08","source":"2012 期中","origin":"exam","lecture":3,"topic":"自定义浮点格式中的 NaN 判定","type":"single","difficulty":2,"stem":"某 8 位浮点数格式为「1 位符号 + 3 位阶码 + 4 位小数」。下列哪一组位模式表示 NaN？","code":null,"explanation":"按 IEEE 754 规则，阶码字段全 1 且小数字段非 0 表示 NaN：0 111 1111 的阶码为 111（全 1）、小数为 1111（非 0），故它是 NaN，选 B。A 的阶码 000 全 0，是（非规格化的）很小的数；C 的阶码 100（非全 0 也非全 1）是规格化数，E = 4-3 = 1、M = 1.00，值等于 2；D 的阶码全 1 但小数全 0，表示无穷大 -∞。踩坑点：阶码全 1 时，小数是否为 0 决定了它是无穷还是 NaN。","tags":["IEEE 754","NaN","无穷大"],"options":["1 000 1111","0 111 1111","0 100 0000","1 111 0000"],"answer":1,"kp":"浮点数"},{"id":"m2012-14","source":"2012 期中","origin":"exam","lecture":3,"topic":"IEEE 浮点编码与就近舍入到偶数","type":"fill","difficulty":3,"stem":"考虑一种 5 位浮点格式（按 IEEE 格式原理，但**没有符号位**，只能表示非负数）：阶码字段 k = 3 位，偏置值 Bias = 3；小数字段 n = 2 位。数值 V = M × 2^E，规格化时 E = e - Bias、M = 1.frac，非规格化时 E = 1 - Bias、M = 0.frac。舍入采用 round-to-even。请写出十进制数 15/2 在该格式下的编码（按「阶码字段 小数字段」的顺序，用 0/1 表示）。","code":null,"explanation":"15/2 = 7.5 = 1.875 × 2^2 = 1.111B × 2^2，但该格式的小数字段只有 2 位，1.875 需要 3 位有效小数，无法精确表示。7.5 恰好落在两个可表示值 1.11B×2^2 = 7（阶码 101、小数 11）与 1.00B×2^3 = 8（阶码 110、小数 00）的正中间：E = 2 时 M 每步 0.25，值为 4、5、6、7；E = 3 时值为 8、10、12、14。按 round-to-even 要取「尾数最低位为 0」的那个，即 1.00B × 2^3 = 8，阶码字段 e = E + Bias = 3 + 3 = 6 = 110，小数字段 00，故编码为 110 00。作为对照，3 = 1.10B×2^1 → 100 10（精确）；3/16 = 0.11B×2^-2 → 000 11（非规格化、精确）；9 = 1.001B×2^3 需要 3 位小数，落于 1.00×2^3 = 8（尾数偶）与 1.01×2^3 = 10 之间，舍入到 8 → 110 00。","tags":["IEEE 754","round-to-even","阶码偏置"],"options":null,"answer":["110 00","11000"],"kp":"浮点数"},{"id":"m2013-03","source":"2013 期中","origin":"exam","lecture":3,"topic":"就近舍入到偶数","type":"single","difficulty":2,"stem":"对 $x = 1\\frac18$ 与 $y = 1\\frac38$ 保留二进制小数点后 2 位（round to nearest even，就近舍入到偶数），结果正确的是：","code":null,"explanation":"x = 1⅛ = 1.001B，保留 2 位小数时恰好落在 1.00B 与 1.01B 的正中间，按「取尾数最低位为偶数」的规则舍向 1.00B = 1。y = 1⅜ = 1.011B，落在 1.01B 与 1.10B 的正中间，尾数最低位为 0 的是 1.10B = 1½。故结果是 x = 1、y = 1½，选 D。若一律按「四舍五入（进位）」处理会得到 1.01B = 1¼ 和 1.10B = 1½；若一律舍去（truncate）会得到 1 和 1.01B；A、B、C 都至少在某一项上取错方向。踩坑点：round-to-even 只在「恰好位于中间」时才看奇偶，其他情况仍取最近的可表示值。","tags":["round-to-even","二进制小数","舍入"],"options":["x = 1¼，y = 1¼","x = 1，y = 1¼","x = 1¼，y = 1½","x = 1，y = 1½"],"answer":3,"kp":"浮点数"},{"id":"m2013-22","source":"2013 期中","origin":"exam","lecture":3,"topic":"单精度浮点数的十六进制编码","type":"fill","difficulty":2,"stem":"按 IEEE 754 单精度格式（1 位符号 s、8 位阶码 exp、23 位小数 frac，偏置值 127）表示数值 $-\\frac32$，请写出其十六进制表示（形如 0x????????）。","code":null,"explanation":"-3/2 = -(1.5) = -1.1B × 2^0，所以符号位 s = 1，阶码字段 exp = E + Bias = 0 + 127 = 127 = 0111 1111B，小数字段为 100 0000 0000 0000 0000 0000（0.1B 即最高小数位为 1，其余为 0）。拼起来：1 01111111 10000000000000000000000，按 4 位一组写成十六进制就是 1011 1111 1100 0000 0000 0000 0000 0000 = 0xBFC00000。作为对照，该卷另一小问 2^-149 是最小的非规格化数：阶码字段全 0、小数的最低位为 1，编码为 0x00000001（E = 1-127 = -126，M = 2^-23，值 = 2^-149）。踩坑点：小数字段只存 1.frac 中「点」后面的部分，隐含的前导 1 不写入；阶码要用偏置后的无符号值。","tags":["IEEE 754","单精度","十六进制编码"],"options":null,"answer":["0xBFC00000","BFC00000","0xbfc00000","0xBFC00000H"],"kp":"浮点数"},{"id":"m2014-17","source":"2014 期中","origin":"exam","lecture":3,"topic":"单精度浮点数的十六进制编码","type":"fill","difficulty":2,"stem":"按 IEEE 754 单精度格式（1 位符号 s、8 位阶码 exp、23 位小数 frac，偏置值 127）表示数值 -12.5，请写出其十六进制表示（形如 0x????????）。","code":null,"explanation":"12.5 = 1100.1B = 1.1001B × 2^3，符号为负，故符号位 s = 1，阶码字段 exp = E + Bias = 3 + 127 = 130 = 1000 0010B，小数字段取 1.1001B 中「点」后的 1001 再补 0，得到 100 1000 0000 0000 0000 0000。拼起来：1 10000010 10010000000000000000000，按 4 位分组为 1100 0001 0100 1000 0000 0000 0000 0000 = 0xC1480000。作为对照，该卷另一小问 0.375 = 1.1B × 2^-2：exp = -2 + 127 = 125 = 0111 1101B，编码为 0x3EC00000。踩坑点：先规格化成 1.xxxB × 2^E 再算阶码；负数的十六进制首位一定 ≥ 8（符号位为 1）。","tags":["IEEE 754","单精度","十六进制编码"],"options":null,"answer":["0xC1480000","C1480000","0xc1480000","0xC1480000H"],"kp":"浮点数"},{"id":"m2015-01","source":"2015 期中","origin":"exam","lecture":3,"topic":"浮点表示的最大绝对误差","type":"single","difficulty":3,"stem":"给定一个实数，会因为把它表示成单精度浮点数而发生误差。不考虑 NaN 和 Inf 的情况，该绝对误差的最大值是多少？（参考信息：单精度浮点数阶码 8 位，尾数 23 位）","code":null,"explanation":"单精度最大阶码字段为 254，对应指数 E = 254 - 127 = 127；尾数 23 位意味着在该量级上相邻两个可表示数（ulp）的间隔是 2^-23 × 2^127 = 2^104。舍入误差最大出现在待表示值恰好落在两个可表示数正中间时，此时误差为半个 ulp，即 2^103，故选 A。选项 B 是 ulp 本身（把「最大误差」当成「间隔」）；C、D 是把指数误当成非规格化的最小值（2^-126 量级）算出来的结果。踩坑点：绝对误差的最大值由「最大指数 + 尾数位数」共同决定，与最小规格化数无关；换个角度，相对误差的最大值才是 2^-24。","tags":["IEEE 754","舍入误差","ulp"],"options":["$2^{103}$","$2^{104}$","$2^{230}$","$2^{231}$"],"answer":0,"kp":"浮点数"},{"id":"m2015-04","source":"2015 期中","origin":"exam","lecture":3,"topic":"浮点数的单调性与精度","type":"single","difficulty":3,"stem":"关于浮点数，以下说法正确的是：","code":null,"explanation":"D 正确：a > b 求值为 0 意味着 a ≤ b、或参与比较的是 NaN（比较一律为 0）。对 a ≤ b 的一般情形，IEEE 浮点加法满足单调性（舍入函数单调不减），故 a+x ≤ b+x，即 a+x > b+x 不成立；若出现 NaN/Inf，比较同样恒为 0，结论依然成立。A 错：当 a、b 是 Inf 或运算产生 NaN 时（例如 a=+Inf、x=-Inf），a > b 可能为 1 而 a+x > b+x 为 0。B、C 错：精度更高的运算并不保证结果一定更精确，中间结果的舍入偏差方向是偶然的，可能出现「双精度算完再舍入」反而不如单精度直接舍入的结果。踩坑点：只有「不成立 → 不成立」这个方向在含 NaN/Inf 的全体浮点数上都成立。","tags":["IEEE 754","单调性","精度"],"options":["给定任意浮点数 a、b 和 x，如果 a > b 成立（求值为 1），则一定 a+x > b+x 成立","不考虑结果为 NaN、Inf 或运算过程发生溢出的情况，高精度浮点数一定得到比低精度浮点数更精确或相同的结果","不考虑输入为 NaN、Inf 的情况，高精度浮点数一定得到比低精度浮点数更精确或相同的结果","给定任意浮点数 a、b 和 x，如果 a > b 不成立（求值为 0），则一定 a+x > b+x 不成立"],"answer":3,"kp":"浮点数"},{"id":"m2015-18","source":"2015 期中","origin":"exam","lecture":3,"topic":"浮点下溢与自乘","type":"single","difficulty":3,"stem":"变量定义：int x、y；unsigned ux = x；double d（保证不是 NaN 或 Inf）。关系符只能从下面前提推出时才算「恒成立」：<、>、==、!=、以上都不恒成立。本题：如果 `d < 0`，则 `d * d` ___ 0。","code":null,"explanation":"直觉上负数自乘应该为正，但浮点运算存在下溢：若 d 的绝对值极小（例如 -1e-200），d*d ≈ 1e-400 小于最小可表示的非规格化数，结果被舍入为 +0，此时 d*d > 0 为假、d*d != 0 也为假。另一方面，只要 d 不是极小值，d*d 就是正数，此时 < 为假、== 为假。因此没有任何一个关系恒成立，选 E。对比同卷第 5 小题「d < 0 则 d*2 < 0 且 != 0」：乘以 2 只是把阶码加一，不会下溢，所以那两个关系都恒成立。踩坑点：浮点乘法可能下溢到 0，也可能上溢到 +Inf，判断恒等式时必须把这些边界情况考虑进去。","tags":["浮点下溢","非规格化数","不定项"],"options":["< （小于）","> （大于）","== （等于）","!= （不等于）","以上都不恒成立（E）"],"answer":4,"kp":"浮点数"},{"id":"m2015-21","source":"2015 期中","origin":"exam","lecture":3,"topic":"12 位浮点格式的表示密度","type":"fill","difficulty":3,"stem":"考虑一种 12 位的浮点数，遵循 IEEE 浮点格式原理：符号位（s）1 位，阶码字段（exp）4 位，小数字段（frac）7 位（阶码偏置值为 7）。请问在区间 [2, 3) 中包含多少个用该规则可以**精确表示**的浮点数？","code":null,"explanation":"[2,3) 中的规格化数其值形如 1.f × 2^E，要落在 [2,3) 必须 E = 1，即阶码字段 = E + Bias = 1 + 7 = 8 = 1000B。此时 M = 1.f 的取值范围是 [1,2)，对应数值 [2,4)；要限制在 [2,3) 需要 M ∈ [1, 1.5)，即小数字段 frac 的最高位必须为 0，其余 6 位任意：共有 2^6 = 64 个。作为对照，[1,2) 对应 E = 0（阶码 0111），frac 的 7 位全部可用，共 2^7 = 128 个，正好是本问的两倍。踩坑点：同一阶码区间内能表示的浮点个数是均匀的（间距相同），跨区间时密度才减半；不要把 [2,3) 的长度误当成决定因素。","tags":["IEEE 754","表示密度","12 位浮点"],"options":null,"answer":["64"],"kp":"浮点数"},{"id":"m2015-22","source":"2015 期中","origin":"exam","lecture":3,"topic":"非规格化数的编码","type":"fill","difficulty":3,"stem":"考虑一种 12 位的浮点数，遵循 IEEE 浮点格式原理：符号位（s）1 位，阶码字段（exp）4 位，小数字段（frac）7 位（阶码偏置值为 7）。请写出数值 $-\\frac{1}{8192}$ 的二进制表示（按「符号位 阶码字段 小数字段」的顺序，用 0/1 表示，中间可用空格分隔）。","code":null,"explanation":"1/8192 = 2^-13。该格式的最小指数（规格化时为 1-7 = -6）不足以表示 2^-13，必须用非规格化数：阶码字段全 0，E = 1 - Bias = -6，M = 0.frac = frac/2^7。要得到 2^-13 = M × 2^-6，需要 M = 2^-7，即 frac = 0000001（只有最低位为 1）。符号为负，所以完整编码是 1 0000 0000001，即 1 000000000001B（十六进制 0x801）。作为对照，该格式能表示的最小正数（也是最小非规格化数）是 0 0000 0000001 = 2^-6 × 2^-7 = 2^-13 = 1/8192，最大的非规格化数是 0 0000 1111111，最小的正规格化数是 0 0001 0000000 = 2^-6。踩坑点：非规格化数没有隐含的前导 1，阶码固定为 1 - Bias，指数是按这个规则硬性规定的。","tags":["非规格化数","IEEE 754","二进制表示"],"options":null,"answer":["1 0000 0000001","100000000001","1 0000 000 0001"],"kp":"浮点数"},{"id":"m2016-16","source":"2016 期中","origin":"exam","lecture":3,"topic":"单精度浮点数的编码","type":"fill","difficulty":2,"stem":"若按 IEEE 754 单精度浮点数格式（1 位符号位、8 位阶码 exp、23 位小数 frac）表示 -8.25，结果是（用 16 进制表示）：","code":null,"explanation":"-8.25 = -(1.00001)₂ × 2³。符号位 s = 1；阶码字段 = E + bias = 3 + 127 = 130 = 1000 0010；小数段取规格化后的小数部分 .00001，左对齐补满 23 位得 000 0100 0000 0000 0000 0000（即 1/32 对应第 4 位为 1）。拼起来是 1100 0001 0000 0100 0000 0000 0000 0000，即 0xC1040000。踩坑点：偏置值是 127 而不是 128；小数段要左对齐（即紧接隐含的 1 之后），不能右对齐。","tags":["IEEE 754","单精度","阶码偏置"],"options":null,"answer":["C1040000","0xC1040000","c1040000"],"kp":"浮点数"},{"id":"m2016-17","source":"2016 期中","origin":"exam","lecture":3,"topic":"最大非规格化数的通式","type":"fill","difficulty":3,"stem":"若采用基于 IEEE 754 的浮点表示方法，阶码字段 exp 占 k 位、小数字段 frac 占 n 位，则**最大的非规格化正数**是（用含 n、k 的表达式表示）：","code":null,"explanation":"非规格化数的阶码字段全 0，其数值为 frac × 2^(1-bias)，其中 bias = 2^(k-1) - 1，故指数 1 - bias = 2 - 2^(k-1)。要取最大，就让 frac 全为 1（共 n 位），其值为 1 - 2^(-n)。因此最大非规格化正数 = (1 - 2^(-n)) × 2^(2 - 2^(k-1))。踩坑点：非规格化数的指数是 1 - bias 而不是 -bias（这样能与规格化数平滑衔接）；另外不要把 frac 全 1 误写成 1.111…（非规格化数没有隐含的前导 1）。这个结果与 2017 年选择题中的「最小规格化正数 2^(2-2^(k-1))」正好是同一格式的两端。","tags":["IEEE 754","非规格化数","阶码偏置"],"options":null,"answer":["(1-2^-n)*2^(2-2^(k-1))","(1-2^{-n})*2^{2-2^{k-1}}","(1-2^-n)×2^(2-2^(k-1))"],"kp":"浮点数"},{"id":"m2016-24","source":"2016 期中","origin":"exam","lecture":3,"topic":"int 加法溢出与浮点转换的顺序","type":"judge","difficulty":2,"stem":"在 64 位机器上，`x`、`y` 是 `random_int()` 返回的随机 `int` 值，`dx = (double)x`、`dy = (double)y`。表达式 `dx + dy == (double)(y+x)` 是否**恒成立**？","code":"int x = random_int();\nint y = random_int();\ndouble dx = (double)x;\ndouble dy = (double)y;","explanation":"不恒成立。关键在右边：y + x 先做的是 **int 加法**，会按 32 位补码回绕，之后才把结果转换成 double；左边则先把两个 int 各自精确地转成 double 再做实数加法。取 x = y = 2147483647：左边 = 4294967294.0，右边因 int 溢出使 y+x = -2，(double)(-2) = -2.0，两者不等。踩坑点：不要以为 double 有 53 位有效位就万事大吉——错误发生在 int 加法阶段，转换还没开始结果就已经错了。","tags":["浮点转换","整型溢出","求值顺序"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2017-03","source":"2017 期中","origin":"exam","lecture":3,"topic":"最小规格化正数的通式","type":"single","difficulty":3,"stem":"若采用基于 IEEE 754 的浮点表示方法，阶码字段（exp）占据 k 位、小数字段（frac）占据 n 位，则**最小的规格化（normalized）正数**是（结果用含 n、k 的表达式表示）：","code":null,"explanation":"最小规格化正数要求阶码字段取最小值 1（全 0 属非规格化数），此时 E = 1 - bias = 1 - (2^(k-1)-1) = 2 - 2^(k-1)；小数段 frac 取全 0，加上规格化数隐含的前导 1，有效数字恰为 1.0，故值为 2^(2-2^(k-1))，选 B。A、D 都多乘了 (1-2^(-n))，那是**非规格化数**才有的形式——2016 年填空题考的最大非规格化正数正是 (1-2^(-n)) × 2^(2-2^(k-1))，两者只差这个因子；C 的指数里多减了 n，数值与小数位数无关，属干扰项。踩坑点：规格化数的隐含 1 不能丢；非规格化数没有隐含 1，指数也换成 1-bias。（本题选项的数学表达式在 PDF 抽取时上下标错乱，此处按官方解析与标准 IEEE 754 形式还原。）","tags":["IEEE 754","规格化数","阶码偏置"],"options":["(1-2^-n) × 2^(2-2^(k-1))","1 × 2^(2-2^(k-1))","2 × 2^(2-2^(k-1)-n)","(1-2^-n) × 2^(2-2^(k+1))"],"answer":1,"kp":"浮点数"},{"id":"m2017-15","source":"2017 期中","origin":"exam","lecture":3,"topic":"由位模式反推自定义浮点格式","type":"fill","difficulty":3,"stem":"考虑一种基于 IEEE 754 的 9 位浮点表示格式 A：1 位符号位、k 位阶码位、n 位小数位，阶码偏移量（bias）为 2^(k-1) - 1。已知 -9/16 的位模式可以表示为 `101100010`，则 k 和 n 分别是多少？","code":null,"explanation":"-9/16 = -0.5625 = -1.001₂ × 2^(-1)，是规格化数，位模式写为 1 | 0110 | 0010。9 位 = 1 + k + n，从模式中可直接数出阶码段 4 位（0110）、小数段 4 位（0010），故 k = 4、n = 4。校验：bias = 2^3 - 1 = 7，阶码字段 0110₂ = 6，E = 6 - 7 = -1 ✓；小数段 0010 配上隐含的前导 1 得 1.001₂ = 1.125，1.125 × 2^(-1) = 0.5625 = 9/16，符号为负 ✓，完全吻合。踩坑点：位数不能靠猜，要用隐含 1 与 bias 反算验证。","tags":["IEEE 754","自定义浮点格式","阶码偏置"],"options":null,"answer":["k=4, n=4","4 和 4","k=4 n=4","4,4"],"kp":"浮点数"},{"id":"m2017-16","source":"2017 期中","origin":"exam","lecture":3,"topic":"最大非规格化数的数值","type":"fill","difficulty":2,"stem":"在 9 位浮点格式 A（1 位符号位、k = 4 位阶码、n = 4 位小数，阶码偏移量为 2^(k-1) - 1 = 7）中，**最大的非规格化数**的十进制数值是多少？（可写成分数）","code":null,"explanation":"非规格化数的阶码字段全 0（0000），此时指数固定为 1 - bias = 1 - 7 = -6，数值 = frac × 2^(-6)。要取最大就让 frac 全为 1，即 frac = 1111₂ = 15，但 4 位小数把 15 解读为 15/16，所以值 = 15/16 × 2^(-6) = 15/1024 = 0.0146484375。踩坑点：非规格化数**没有**隐含的前导 1，指数也不是 0 - bias 而是 1 - bias；最容易错的是把 frac 全 1 当成 1.1111₂ 或把分母写成 2^6 的整数倍。官方答案为 15/1024。","tags":["非规格化数","IEEE 754","最小指数"],"options":null,"answer":["15/1024","0.0146484375","15×2^-10"],"kp":"浮点数"},{"id":"m2017-17","source":"2017 期中","origin":"exam","lecture":3,"topic":"浮点格式中阶码与小数位的权衡","type":"fill","difficulty":3,"stem":"在 9 位浮点格式 A（1 位符号、k = 4 位阶码、n = 4 位小数、偏移量 7）中，若把格式改为 1 位符号、k+1 = 5 位阶码、n-1 = 3 位小数，那么可表示的**实数个数**会怎样变化？数值的**精度**会怎样变化？（回答「增加/降低/不变」）","code":null,"explanation":"位模式总数不变（2^9 = 512），但阶码位数增加 1 位使可表示的**指数范围翻倍**，同时原本用作 NaN/无穷的部分编码变成了可用的规格化数（特殊值数量减少），所以能表示的不同实数值个数**增加**；小数位数减少 1 位意味着有效数字从 4 位降到 3 位，相邻可表示数之间的间距变大，**精度降低**。官方解析即「小数位变少后，NaN 的数量减少了，所以实数数量增加，数值精度降低」。踩坑点：位模式总数不变并不等于可表示实数个数不变，还要考虑指数范围与特殊编码的重新分配——这正是浮点格式中「范围与精度此消彼长」的体现。","tags":["浮点格式","精度与范围","NaN"],"options":null,"answer":["实数个数增加，精度降低","数量增加，精度降低","实数个数增加；精度降低"],"kp":"浮点数"},{"id":"m2018-01","source":"2018 期中","origin":"exam","lecture":3,"topic":"类型转换中的溢出与舍入","type":"single","difficulty":2,"stem":"下列哪种类型转换**既可能导致溢出、又可能导致舍入**？","code":null,"explanation":"按 CSAPP 的类型转换表格：float 转 int 时，若浮点数超出了 int 的表示范围就会**溢出**（结果不可预测/未定义），而带小数的浮点数赋给整型时会**朝零舍入（截断）**丢掉小数，所以两种问题都可能出现，选 B。int 转 float 只会**舍入**（单精度尾数只有 24 位有效位，超过 2^24 的整数无法精确表示），但 int 的取值范围远小于 float 的指数范围，不会溢出。int 转 double 一定**精确**（53 位有效位足以表示所有 32 位整数）。float 转 double 既不溢出（double 范围更大）也不损失有效位。踩坑点：只有目的类型「容不下」源值时才叫溢出，只有源值「精度不够」被丢弃时才叫舍入。","tags":["类型转换","舍入","溢出"],"options":["int 转 float","float 转 int","int 转 double","float 转 double"],"answer":1,"kp":"整数与位运算"},{"id":"m2018-13","source":"2018 期中","origin":"exam","lecture":3,"topic":"前导零计算中浮点常数 w 的取值范围","type":"single","difficulty":3,"stem":"在用浮点技巧实现「计算 32 位无符号数前导零个数」的 `nlz` 函数时，需要先把 `unsigned x` 转成 double 并加上一个小常数 w（`double y = (double)x + w;`），再通过 `memcpy` 取出 y 的 IEEE 754 位模式来推算前导零个数。已知原实现取 w = 0.5，则下列哪个 w 也能使结果保持正确？","code":"int nlz(unsigned x) {\n    double w = 0.5;\n    double y = (double)x + w;\n    long long z;\n    memcpy(&z, &y, sizeof(y));\n    return 1054 - (z >> 52);\n}","explanation":"该技巧要求 y 的阶码与 x 的最高有效位位置一一对应：x = 0 时 y 必须落在 [0.5, 1) 内（阶码对应 2^0），x > 0 时 x + w 必须仍落在与 x 相同的二进制区间 [2^k, 2^(k+1)) 内。前者要求 w ≥ 0.5——否则 x = 0 时 y = w < 0.5，阶码偏小、算出的前导零偏大；后者要求 w < 1——否则 x + w 可能进位到下一个 2 的幂，使阶码加 1、前导零少算 1。因此可行范围是 [0.5, 1)，只有 0.9 符合，选 C。0.2、0.3 会让 x = 0 时出错；1.2 会在 x 接近 2^k 时因进位而偏移。官方解析也指出「w 的取值范围为 [0.5, 1)，因此只有 c 符合要求」。","tags":["前导零计数","IEEE 754 阶码","浮点位技巧"],"options":["0.2","0.3","0.9","1.2"],"answer":2,"kp":"浮点数"},{"id":"m2018-14","source":"2018 期中","origin":"exam","lecture":3,"topic":"利用双精度阶码计算前导零","type":"fill","difficulty":3,"stem":"下面这个用浮点技巧计算 32 位无符号数前导零个数的函数中，`return` 语句的两个横线处应分别填什么？（提示：只需填数字与运算符；y 为双精度数，其 IEEE 754 位模式中阶码位于第 52~62 位，阶码偏置为 1023）","code":"int nlz(unsigned x) {\n    double w = 0.5;\n    double y = (double)x + w;\n    long long z;\n    memcpy(&z, &y, sizeof(y));\n    return ______ - (z >> ______);\n}","explanation":"把 y 的位模式当作 64 位整数 z 后，`z >> 52` 恰好得到「符号位 + 11 位阶码」拼成的整数，其值 = 1023 + E（y 为正数，符号位为 0，不影响）。当 x 的最高有效位在第 k 位时（前导零个数为 31 - k），y = x + 0.5 的指数 E = k（w ∈ [0.5,1) 保证 x = 0 时 y ∈ [0.5,1)、E = -1 也成立），于是 nlz(x) = 31 - k = 31 - ((z>>52) - 1023) = 1054 - (z >> 52)。所以两空分别填 1054 和 52。校验：x = 0 时 y = 0.5，z>>52 = 1022，1054 - 1022 = 32 = nlz(0) ✓；x 的最高位在第 31 位时 z>>52 = 1054，结果为 0 ✓。踩坑点：常数 1054 = 1023 + 31 来自「偏置 + 最高位下标」，不是 1023，也不是 1024。","tags":["前导零计数","双精度阶码","位技巧"],"options":null,"answer":["1054 - (z >> 52)","1054-(z>>52)","1054, 52"],"kp":"浮点数"},{"id":"m2019-03","source":"2019 期中","origin":"exam","lecture":3,"topic":"单精度的精确整数范围","type":"single","difficulty":3,"stem":"运行下面的代码，输出结果是（其中 float 类型表示 IEEE 754 规定的浮点数，包括 1 位符号、8 位阶码和 23 位尾数）：","code":"for (float f = 1; ; f = f + 1)\n{\n    if (f + 1 - f != (float)1)\n    {\n        printf(\"%.0f\\n\", f);\n        break;\n    }\n}","explanation":"单精度有 23 位小数位，加上隐含的前导 1 共 24 位有效数字，因此所有绝对值不超过 2^24 的整数都能被**精确**表示，此时 f + 1 - f 严格等于 1，循环继续。当 f 增到 2^24 = 16777216 时，在该量级下相邻可表示数的间隔（ulp）已经是 2，加 1 只是半个 ulp，f + 1 被舍入回 f 本身，于是 f + 1 - f = 0 ≠ 1，循环退出并打印 16777216，选 B。A（2^23）是「有效数字的位数」而不是精确范围的上界；C 早已超出单精度能精确表示整数的范围；D 忽略了舍入会使条件成立。踩坑点：能精确表示所有 32 位整数的类型是 double（53 位有效位）而不是 float。","tags":["IEEE 754","舍入","浮点精度边界"],"options":["8388608（=2^23）","16777216（=2^24）","2147483647（=2^31-1）","程序为死循环，没有输出"],"answer":1,"kp":"浮点数"},{"id":"m2019-19","source":"2019 期中","origin":"exam","lecture":3,"topic":"负零的位模式","type":"fill","difficulty":2,"stem":"假设采用 IEEE 754 单精度浮点数标准，32 位模式 0x80000000 所表示的十进制数值是：","code":null,"explanation":"0x80000000 的二进制为 1 0000 0000 0000 … 0000：符号位 s = 1，阶码字段全 0，小数段也全 0。按 IEEE 754 规定，阶码全 0 且小数全 0 表示**零**，而符号位为 1 则得到**负零**（-0.0）。负零与正零在数值比较上相等（0.0 == -0.0 为真），但符号位不同，可用 1/x 的符号或 signbit() 区分。踩坑点：不要把符号位当成有效数值位算出 -2^31 之类的数，也不要把非规格化数的规则套在「阶码全 0、小数全 0」这个特例上。官方答案为 -0。","tags":["IEEE 754","负零","零的编码"],"options":null,"answer":["-0.0","-0","负零","-0.0f"],"kp":"浮点数"},{"id":"m2019-20","source":"2019 期中","origin":"exam","lecture":3,"topic":"单精度位模式的十进制解码","type":"fill","difficulty":2,"stem":"假设采用 IEEE 754 单精度浮点数标准，32 位模式 0x41180000 所表示的十进制数值是：","code":null,"explanation":"0x41180000 = 0100 0001 0001 1000 0000 0000 0000 0000。符号位为 0（正数）；阶码字段 1000 0010₂ = 130，故 E = 130 - 127 = 3；小数段 001 1000 … 表示 0.0011₂ = 1/8 + 1/16 = 3/16。数值 = (1 + 3/16) × 2^3 = 1.1875 × 8 = 9.5，与官方答案一致。踩坑点：①小数段是二进制分数，不能按十进制小数理解；②别忘掉规格化数隐含的前导 1（有效数字是 1.0011₂ 而不是 0.0011₂）；③阶码要减偏置 127，而不是 128。","tags":["IEEE 754","单精度解码","隐含前导 1"],"options":null,"answer":["9.5","+9.5"],"kp":"浮点数"},{"id":"m2019-21","source":"2019 期中","origin":"exam","lecture":3,"topic":"浮点加法不满足结合律","type":"judge","difficulty":3,"stem":"在 IEEE 754 浮点运算（单精度，1 位符号、8 位阶码、23 位尾数）下，表达式 `(2 + 2^50) - 2^50 != 2 + (2^50 - 2^50)` 的值是否为**真**？","code":null,"explanation":"为真，两个结果确实不同。单精度只有 23 位小数位（有效数字 24 位），2^50 与 2 相差 48 个二进制数量级，远超精度能分辨的范围，因此左边括号里的 2 + 2^50 会被**舍入回 2^50**，于是左边 = 2^50 - 2^50 = 0；右边先算 2^50 - 2^50 = 0，再加 2 得 2。0 ≠ 2，故不等式成立（官方答案「是」）。这说明浮点加法**不满足结合律**，也正是编译器不能随意重排浮点表达式的根本原因。踩坑点：不是「大数减小数出错」，而是「小数加到很大的数上会被直接吃掉」。","tags":["浮点舍入","结合律","精度"],"options":null,"answer":true,"kp":"浮点数"},{"id":"m2019-22","source":"2019 期中","origin":"exam","lecture":3,"topic":"累加多个小量与 ulp","type":"judge","difficulty":3,"stem":"在 IEEE 754 浮点运算（单精度，1 位符号、8 位阶码、23 位尾数）下，表达式 `2^25 + 1 + 1 + 1 + 1 == 2^25 + 4` 的值是否为**真**？","code":null,"explanation":"为假（官方答案「否」）。单精度有 24 位有效数字，在 2^25 这个量级上相邻可表示数之间的间隔（ulp）是 4，因此把 1 加到 2^25 上会被舍入回 2^25——连续四次加 1 的结果仍然是 2^25（每次加 1 都被「吃掉」），左边等于 2^25。而右边 2^25 + 4 恰好是下一个可表示的数（4 = 1 个 ulp，可以精确表示），等于 2^25 + 4。两者不等。踩坑点：这是「多次累加小量 ≠ 一次加上它们的和」的经典例子（也是浮点求和前应先排序、或使用 Kahan 求和的原因）；注意 1 与 2^25 相差 25 个数量级，而 4 = 2^2 只相差 23 个数量级，正好落在可表示范围内。","tags":["浮点累加","ulp","舍入误差"],"options":null,"answer":false,"kp":"浮点数"},{"id":"m2020-15","source":"2020 期中","origin":"exam","lecture":3,"topic":"float 有效位数与不可精确表示的最小正整数","type":"fill","difficulty":3,"stem":"在 x86-64 上运行如下代码，则 float 类型不可以精确表示的最小正整数是多少？","code":"int a = 33554442; // 2^25+10\nint b = a + 5;\nfor (; a < b; a++) {\n    float f = a;\n    printf(\"%d \", (int)f - a);\n}","explanation":"float 有 23 位小数字段，加上规格化数隐含的前导 1，共 24 位有效数字，因此所有绝对值不超过 2^24 = 16777216 的整数都能被精确表示。而 2^24 + 1 = 16777217 需要 25 位有效数字（1.000…001₂ × 2^24，中间那个 1 落在第 25 位上），只能舍入到最近的 2^24（尾数为偶数），无法精确表示。所以最小不能被 float 精确表示的正整数是 2^24 + 1。踩坑点：有效位数是 24 位而不是 23 位（隐含的 1 也要计入），所以边界是 2^24 而不是 2^23；本题前面那段代码正是通过打印 (int)f - a 来展示超过 2^24 后舍入误差的出现。","tags":["float","有效位数","舍入误差"],"options":null,"answer":["2^24+1","16777217","2**24+1"],"kp":"浮点数"},{"id":"m2021-02","source":"2021 期中","origin":"exam","lecture":3,"topic":"浮点位模式变换与大小比较","type":"single","difficulty":3,"stem":"函数 g 定义如下，则对于两个 float 型变量 a, b，有 a < b 是 g(a) < g(b) 的：","code":"int g(float f) {\n    union {\n        float f;\n        int i;\n    } x;\n    x.f = f;\n    return x.i ^ ((1u << (x.i < 0 ? 31 : 0)) - 1);\n}","explanation":"表达式 x.i ^ ((1u << (x.i < 0 ? 31 : 0)) - 1) 的作用是：若位模式最高位为 0（非负浮点数），右移 0 位得 1，减 1 为 0，异或后不变；若最高位为 1（负浮点数），1<<31 减 1 得 0x7FFFFFFF，异或相当于把符号位清零、其余位取反，于是负数被映射到 0 以上的区间。这样得到的整数与浮点数的大小顺序完全一致，所以 a、b 都是“有意义”的浮点数时，a < b 与 g(a) < g(b) 等价，a < b 是充分的。但它不是必要的：当 a、b 是 NaN 时任何比较都为假；当 a、b 是 +0.0 与 -0.0 时，g(+0.0) = 0、g(-0.0) = 0xFFFFFFFF = -1，取 a = -0.0、b = +0.0 就有 g(a) < g(b) 成立而 a < b 为假。所以 a < b 是 g(a) < g(b) 的充分不必要条件，选 B。踩坑点：正负零与 NaN 是浮点比较中仅有的两类“反常”取值。","tags":["浮点位模式","NaN","大小比较"],"options":["充分必要条件","充分不必要条件","必要不充分条件","不必要不充分条件"],"answer":1,"kp":"浮点数"},{"id":"m2021-16","source":"2021 期中","origin":"exam","lecture":3,"topic":"自定义浮点格式的最大规格化数","type":"fill","difficulty":2,"stem":"考虑一种新的遵从 IEEE 规范的浮点格式系统，该浮点数系统包含 1 位符号、4 位阶码、7 位尾数。该浮点数系统所能表示的最大规格化数的十进制值是多少？","code":null,"explanation":"阶码 4 位，偏置为 2^(4-1) - 1 = 7。最大规格化数的阶码字段取 1110（1111 保留给 ±∞ 与 NaN），真实阶 e = 14 - 7 = 7；尾数字段取全 1，得 1.1111111₂ = 2 - 2^-7 = 255/128。所以最大值为 (255/128) × 2^7 = 255。踩坑点：阶码字段不能取全 1；计算尾数时不要漏掉规格化数隐含的前导 1。","tags":["IEEE 754","最大规格化数","偏置"],"options":null,"answer":["255"],"kp":"浮点数"},{"id":"m2022-02","source":"2022 期中","origin":"exam","lecture":3,"topic":"浮点运算的代数性质","type":"single","difficulty":3,"stem":"对于 float 类型变量 a, b, c 下列说法正确的是：","code":null,"explanation":"D 对：IEEE 浮点加法满足交换律（舍入是对称的），a + b 与 b + a 会产生完全相同的位模式，所以 a+b == 0.0 时必有 b+a == 0.0。A 错：c 取 +∞ 时 a + c = b + c = +∞，而 ∞ > ∞ 为假；c 取 NaN 时比较同样不成立。B 错：c 为 NaN 时 a == b 可能成立，但 a + c == b + c 不成立（NaN 与任何数比较都为假）。C 错：浮点加法不满足结合律，(a+b)+c 与 (c+b)+a 的中间舍入过程不同，结果可能不等。踩坑点：浮点加法有交换律，但没有结合律、没有分配律，且与无穷、NaN 的组合会破坏不等式的传递。","tags":["浮点运算","交换律","NaN"],"options":["若 a > b，则 a + c > b + c","若 a == b，则 a + c == b + c","若 a + b + c == 0.0，则 c + b + a == 0.0","若 a + b == 0.0，则 b + a == 0.0"],"answer":3,"kp":"浮点数"},{"id":"m2022-18","source":"2022 期中","origin":"exam","lecture":3,"topic":"自定义 8 位浮点数的解码","type":"fill","difficulty":3,"stem":"类似 IEEE 浮点数标准定义了一种 8 位浮点数，符号位、阶码位和尾数位长度分别为 1、3、4。若某数的浮点十六进制表示为 0xBD，则该数的十进制大小是多少？","code":null,"explanation":"0xBD 展开为 1011 1101₂，按 1|3|4 切分：符号位 1 表示负数；阶码字段 011₂ = 3，偏置为 2^(3-1) - 1 = 3，真实阶 e = 3 - 3 = 0；尾数字段 1101₂ = 13/16 = 0.8125。所以数值 = -(1 + 0.8125) × 2^0 = -1.8125，写成分数是 -29/16。踩坑点：偏置是 2^(k-1)-1（k=3 时为 3，不是 4）；最高位是符号位，容易忘记取负；规格化数还有隐含的前导 1。","tags":["IEEE 754","浮点解码","偏置"],"options":null,"answer":["-1.8125","-29/16"],"kp":"浮点数"},{"id":"m2022-19","source":"2022 期中","origin":"exam","lecture":3,"topic":"浮点数大小比较（未知位）","type":"fill","difficulty":2,"stem":"已知两个 8 位浮点数（1 位符号、3 位阶码、4 位尾数）A 和 B，A 的浮点表示为 010000xx，B 的浮点表示为 00111x11，其中 x 表示该位未知。则 A ______ B（请填“小于”“大于”“等于”或“无法判断”）。","code":null,"explanation":"A 与 B 的符号位都是 0，都是正数，因此先比较阶码。A 的位模式 010000xx 中阶码字段是紧随符号位之后的 3 位，即 100₂ = 4，真实阶 e = 4 - 3 = 1；B 的位模式 00111x11 中阶码字段是 011₂ = 3，真实阶 e = 3 - 3 = 0。真实阶 1 > 0，阶码大的数一定更大，所以无论未知位 x 取什么值都有 A > B。踩坑点：正数比较要先看阶码再看尾数，不能只比较尾数；符号位相同时浮点位模式的大小与数值大小一致，但符号位不同时结论相反。","tags":["浮点比较","阶码","未知位"],"options":null,"answer":["大于"],"kp":"浮点数"},{"id":"m2022-20","source":"2022 期中","origin":"exam","lecture":3,"topic":"整数转换为小位宽浮点格式时的上溢","type":"fill","difficulty":3,"stem":"某 8 位浮点数（1 位符号、3 位阶码、4 位尾数）中，若某个 unsigned char 类型数的十六进制表示为 0x6E（即十进制 110），那么用该浮点格式表示该数时的位模式是什么？","code":null,"explanation":"该格式的最大有限值出现在阶码字段取 110（真实阶 6-3 = 3）且尾数全 1 时，即 1.9375 × 2^3 = 15.5。而 0x6E = 110 远大于 15.5，已经超出该格式能表示的范围，按 IEEE-754 的规则应上溢为 +∞，其位模式是符号位 0、阶码字段全 1（111）、尾数全 0，即 01110000。所以答案不是某个有限值，而是上溢后的无穷大。踩坑点：不能因为“8 位格式看起来装得下 110”就直接写编码，必须先算出该格式的最大有限值；另外阶码全 1 且尾数全 0 表示的是无穷大，而不是最大有限数。","tags":["浮点上溢","无穷大","类型转换"],"options":null,"answer":["01110000","0 111 0000"],"kp":"浮点数"},{"id":"m2022-21","source":"2022 期中","origin":"exam","lecture":3,"topic":"由 1.0 的编码反推浮点格式参数","type":"fill","difficulty":3,"stem":"考虑另一个符合 IEEE-754 标准的 16 位浮点系统，包含 1 位符号、m 位阶码、n 位尾数。已知实数 1 在该浮点格式系统中的位级表示为 0x3c00，则 m = ______（只需填一个十进制数字）。","code":null,"explanation":"实数 1 的规格化表示是“符号位为 0、阶码字段等于偏置 2^(m-1)-1、尾数全 0”。0x3c00 = 0011 1100 0000 0000₂，即符号位 0 后跟 15 位。若 m = 5，偏置为 2^4 - 1 = 15 = 01111₂，位模式为 0|01111|0000000000，正好是 0x3C00；若 m = 4，偏置为 7 = 0111₂，位模式为 0|0111|00000000000 = 0x3800，与 0x3c00 不符；若 m = 6，偏置为 31 = 011111₂，位模式为 0|011111|000000000 = 0x3E00，也不符。所以 m = 5、n = 10（这正是 IEEE 半精度 binary16 的参数）。踩坑点：用偏置的定义去反推 m 最稳妥，只数 1 的个数容易出错。","tags":["IEEE 754","偏置","half precision"],"options":null,"answer":["5"],"kp":"浮点数"},{"id":"m2023-03","source":"2023 期中","origin":"exam","lecture":3,"topic":"浮点数运算与表示范围","type":"single","difficulty":2,"stem":"对于 float 类型的变量 a，b，下列说法正确的是：","code":null,"explanation":"B 对：float 有 1 位符号、8 位阶码（偏置 127）、23 位小数，最小正规格化数为 2^(1-127) = 2^-126，最小正非规格化数为 2^-23 × 2^-126 = 2^-149，所以能精确表示的最小正数确实是 2^-149。A 错：浮点加法会舍入，例如 a = 1e20、b = 1.0 时 a + b 舍回 1e20，(a+b) - a = 0 ≠ b。C 错：当 |a| 超出 int 的范围（如 1e20）时转换会溢出，a 是小数时则会被截断，两种情况下 (int)a == a 都不成立。D 错：a 为正无穷或负无穷时，任何有限 b 相加都不会得到 0（只有 ∞ 与 -∞ 相加，结果是 NaN），因此不存在这样的 b。","tags":["IEEE 754","非规格化数","浮点舍入"],"options":["假设 a，b 不是 NaN，则 (a + b) - a == b 总为真","a 的小数字段长度为 23 位，所以它能精确表示的最小正数是 2^-149","假设 a 表示的是一个整数，那么 (int)a == a 总为真","假设 a 不是 NaN，则存在 b 的取值使得 a + b == 0 为真"],"answer":1,"kp":"浮点数"},{"id":"m2023-12","source":"2023 期中","origin":"exam","lecture":3,"topic":"类型转换中的舍入与溢出","type":"single","difficulty":3,"stem":"在下列类型转换的过程中可能会发生舍入，但绝对不会发生溢出的是：","code":null,"explanation":"A 正确：float 的指数范围（最大约 3.4×10^38）远大于 64 位整数能表示的范围，所以 unsigned long long 转 float 绝不会溢出；但 float 只有 24 位有效数字，超过 2^24 的整数部分位会被舍入，恰好满足“可能舍入、绝不溢出”。B 错：float 转 unsigned 时，负数和超过 UINT_MAX 的数都超出范围，结果是未定义/溢出。C 错：double 转 float 时，绝对值超过 float 最大值的数会变成 ±∞，属于溢出。D 错：int 转 short 直接截断高 16 位，超出 short 范围的数其值会被改变，也是溢出。踩坑点：向“范围更大”的浮点类型转换只损失精度，向“范围更小”的类型转换则可能溢出。","tags":["类型转换","舍入","溢出"],"options":["unsigned long long 转 float","float 转 unsigned","double 转 float","int 转 short"],"answer":0,"kp":"整数与位运算"},{"id":"m2023-20","source":"2023 期中","origin":"exam","lecture":3,"topic":"FP8 E5M2 的最大规格化数","type":"fill","difficulty":2,"stem":"Nvidia H100 引入的 FP8 数据类型 E5M2 遵守 IEEE-754 标准，包含 1 位符号、5 位阶码、2 位尾数（尾数即书本上的 fraction）。该数据类型能表示的最大规格化数的二进制表示是什么？（按 符号位|阶码|尾数 的顺序写出 8 位）","code":null,"explanation":"E5M2 的阶码 5 位，偏置为 2^(5-1) - 1 = 15。要让数值最大，阶码字段取 11110（11111 被保留给 ±∞ 和 NaN），对应真实阶 e = 30 - 15 = 15；尾数字段取全 1，得到 1.11₂ = 1.75。于是位模式为 0|11110|11，即 01111011，数值等于 1.75 × 2^15 = 57344。踩坑点：把阶码字段写成 11111 会得到无穷大而不是最大有限值；也要注意尾数只有 2 位，1.11₂ 就是它能表示的最大尾数。","tags":["FP8","IEEE 754","规格化数"],"options":null,"answer":["01111011","0 11110 11"],"kp":"浮点数"},{"id":"m2023-21","source":"2023 期中","origin":"exam","lecture":3,"topic":"FP8 E5M2 的最大非规格化数","type":"fill","difficulty":3,"stem":"Nvidia H100 引入的 FP8 数据类型 E5M2 遵守 IEEE-754 标准，包含 1 位符号、5 位阶码、2 位尾数。该数据类型能表示的最大的非规格化数的二进制表示是什么？（按 符号位|阶码|尾数 的顺序写出 8 位）","code":null,"explanation":"非规格化数的阶码字段固定为 00000，其指数固定为 1 - bias = 1 - 15 = -14，数值为 ±0.f × 2^-14，尾数没有隐含的前导 1。要让数值最大，符号位取 0，2 位尾数取全 1 即 0.11₂ = 0.75，于是位模式为 0|00000|11 = 00000011，数值为 0.75 × 2^-14。它是 E5M2 能表示的最小的正规格化数（2^-14）以下最大的数，也是所有非规格化数中最大的。踩坑点：非规格化数的指数固定为 1-bias，不能按 0-bias 计算。","tags":["FP8","非规格化数","位模式"],"options":null,"answer":["00000011","0 00000 11"],"kp":"浮点数"},{"id":"m2023-22","source":"2023 期中","origin":"exam","lecture":3,"topic":"E4M3 回收特殊值后的最大规格化数","type":"fill","difficulty":3,"stem":"在 Nvidia 的设计中，E4M3（1 位符号、4 位阶码、3 位尾数）放弃了 IEEE-754 标准：只保留“阶码与尾数全为 1”这一种位模式作为 NaN，其余原本用于特殊值的位模式都用来表示规格化数。该数据类型能表示的最大规格化数的十进制值是多少？","code":null,"explanation":"回收特殊值后，阶码字段可以取到 1111，偏置仍为 2^(4-1) - 1 = 7，对应真实阶 e = 15 - 7 = 8；但尾数不能取全 1（1111|111 被保留为 NaN），最大只能取 110，即 1.110₂ = 1.75。于是最大规格化数为 1.75 × 2^8 = 448。作为对比，遵循 IEEE-754 时阶码 1111 表示 ±∞/NaN，最大只能取到 1.875 × 2^7 = 240，两者之比 448/240 ≈ 1.87，舍入到整数为 2 倍。踩坑点：Nvidia 的方案是“用更大的动态范围换掉大部分特殊值”，要记得恰好排除掉的那一个 NaN 位模式。","tags":["FP8","E4M3","动态范围"],"options":null,"answer":["448"],"kp":"浮点数"},{"id":"m2023-23","source":"2023 期中","origin":"exam","lecture":3,"topic":"int8 到 E4M3 的溢出判断","type":"judge","difficulty":2,"stem":"在 H100 GPU 上用 Nvidia 的 E4M3（最大规格化数为 448）表示 int8（8 位有符号整数）时，会发生溢出。请判断该说法是否正确。","code":null,"explanation":"错误。E4M3 能表示的最大规格化数是 448，可以表示到 ±448 的范围，而 int8 的取值只有 -128~127，全部落在 E4M3 的可表示范围内，绝对值最小的负边界 -128 也远大于 -448，所以不会发生溢出。判断溢出的依据是数值范围，而不是精度。踩坑点：不要把“位宽相同”误当成“范围相同”，int8 与 E4M3 的 8 位里，浮点格式把大部分位给了阶码，范围反而比整数大得多。","tags":["int8","E4M3","溢出"],"options":null,"answer":false,"kp":"整数与位运算"},{"id":"m2023-24","source":"2023 期中","origin":"exam","lecture":3,"topic":"int8 到 E4M3 的舍入","type":"judge","difficulty":2,"stem":"在 H100 GPU 上用 Nvidia 的 E4M3（1 位符号、4 位阶码、3 位尾数）表示 int8（8 位有符号整数）时，会发生舍入。请判断该说法是否正确。","code":null,"explanation":"正确。E4M3 的尾数只有 3 位，加上隐含的前导 1 共 4 位有效数字，能精确表示的整数只到 16；int8 的范围是 -128~127，凡是有效位数超过 4 位的整数都必须舍入到最近的可表示值。例如 127 = 1.111111₂ × 2^6，只保留 3 位小数时恰好是中间值 1.111|111₂，按向偶数舍入得到 1.000₂ × 2^7 = 128（128 是 E4M3 可精确表示的）。所以会发生舍入。踩坑点：不溢出并不代表能精确表示，范围看阶码、精度看尾数，两者要分开判断。","tags":["int8","E4M3","舍入"],"options":null,"answer":true,"kp":"浮点数"},{"id":"m2023-25","source":"2023 期中","origin":"exam","lecture":3,"topic":"浮点加法顺序对结果的影响","type":"fill","difficulty":3,"stem":"E5M2 格式（1 位符号、5 位阶码、2 位尾数）可以精确表示 -1.25、1.5、1/16、1/32 这四个数。把这四个数相加时，由于浮点加法的舍入与结合顺序有关，结果可能有多种。可能得到的最小计算结果是多少？（写成分数）","code":null,"explanation":"取计算顺序 ((1/32 + 1/16) + 1.5) + (-1.25)：先算 1/32 + 1/16 = 3/32 = 0.09375，它能被 E5M2 精确表示；加 1.5 得 1.59375，此时结果落在 [1,2) 区间，E5M2 在该区间的相邻可表示数间隔为 2^-2 × 2^0 = 0.25（即 1.5 与 1.75），1.59375 更接近 1.5，舍入为 1.5；最后加 -1.25 得 0.25 = 1/4，可以被精确表示。因此最小可能结果是 1/4。踩坑点：浮点加法不满足结合律，只有通过调整相加顺序让中间结果向小的一侧舍入，才能得到最小结果（最大结果为 3/8，来自 0.34375 恰好位于 0.3125 与 0.375 中间时按向偶数舍入取 0.375）。","tags":["浮点加法","结合律","向偶数舍入"],"options":null,"answer":["1/4","0.25"],"kp":"浮点数"},{"id":"m2024-03","source":"2024 期中","origin":"exam","lecture":3,"topic":"浮点格式中阶码位数与可表示实数值数量","type":"single","difficulty":3,"stem":"熟悉的标准浮点格式 float 共有 32 位，其阶码字段和小数字段分别为 k=8 位和 n=23 位。如果我们维持 float 的总位数不变，但阶码字段变为 k'=10 位，则下列说法中正确的是：","code":null,"explanation":"总位数固定为 32 位，所以 k'=10 时小数字段只剩 n'=21 位。位模式的总数永远是 2^32，但其中被用于特殊值（±∞ 与各种 NaN）的位模式变少了：NaN 的个数是 2×(2^n - 1)，n 从 23 降到 21 后，NaN 的个数大约只剩原来的四分之一。也就是说，多出来的位模式被用来表示普通实数（规格化数与非规格化数），因此能表示的实数值数量是变多的，选 A。B 把“位模式总数”误当成“实数值个数”；C 方向相反，误以为精度下降就意味着实数值变少；D 则忽视了位模式总数固定这一前提，本题是可比较的。踩坑点：阶码变宽牺牲的是精度与范围划分，并不减少实数值的总个数。","tags":["IEEE 754","阶码","NaN"],"options":["修改后能表示的实数值的数量更多了","修改后能表示的实数值的数量不变","修改后能表示的实数值的数量更少了","无法确定"],"answer":0,"kp":"浮点数"},{"id":"m2024-18","source":"2024 期中","origin":"exam","lecture":3,"topic":"小端字节序与 IEEE-754 解码","type":"fill","difficulty":2,"stem":"内存中从地址 0x7ffc3608bf40 开始的 4 个字节依次为 00 00 70 40（十六进制，按地址从小到大排列）。若按 IEEE-754 单精度浮点数的编码方式解释，该处的十进制数值是多少？","code":null,"explanation":"x86-64 采用小端法，按地址递增读到的 00 00 70 40 组成的 32 位位模式是 0x40700000。按 IEEE-754 单精度拆分：符号位 0（正数），阶码字段 0b1000_0000 = 128，减去偏置 127 得真实阶 e = 1；小数字段是低 23 位 0b111_0000…，即 0.875，于是尾数为 1.875。最终数值 = 1.875 × 2^1 = 3.75。踩坑点：若忽略小端法，会读成 0x00007040，那是一个极小的非规格化数，答案会完全错误；本题正是同时考查字节序与浮点编码。","tags":["小端法","IEEE 754","浮点解码"],"options":null,"answer":["3.75"],"kp":"浮点数"},{"id":"m2024-19","source":"2024 期中","origin":"exam","lecture":3,"topic":"自定义 8 位浮点格式的最小正规格化数","type":"fill","difficulty":2,"stem":"基于 IEEE-754 标准定义一种 8 位浮点数，符号位、阶码位和尾数位长度分别为 1、5、2。该格式能表示的最小正规格化数的十进制数值是多少（写成 2 的幂的形式即可）？","code":null,"explanation":"阶码 5 位，按 IEEE-754 规则偏置为 2^(5-1) - 1 = 15。最小正规格化数的阶码字段取 00001（00000 被保留给非规格化数与 0），对应真实阶 e = 1 - 15 = -14，尾数全 0（即 1.00），所以数值为 2^-14。踩坑点：若把非规格化数的指数规律（1 - bias = -14 再加前导 0）套到规格化数上，会误得 2^-15；另外不能把阶码字段 00000 当成最小规格化数。","tags":["IEEE 754","规格化数","偏置"],"options":null,"answer":["2^-14","2^(-14)","2-14","2**-14","0.00006103515625"],"kp":"浮点数"},{"id":"m2024-20","source":"2024 期中","origin":"exam","lecture":3,"topic":"自定义浮点格式中的 NaN 计数","type":"fill","difficulty":1,"stem":"基于 IEEE-754 标准定义一种 8 位浮点数，符号位、阶码位和尾数位长度分别为 1、5、2。只考虑符号位为 0 的情况，该格式能表示多少个 NaN？","code":null,"explanation":"IEEE-754 中 NaN 的判定条件是阶码字段全 1 且小数字段非 0。符号位固定为 0 时，阶码字段只能取 11111，2 位小数字段可取值 01、10、11（00 表示 +∞），共 3 种，所以有 3 个 NaN。若把小数字段 00（+∞）也算进去会得到 4 个，这是常见错误；若忘记“小数非零”的条件同样会算错。","tags":["IEEE 754","NaN","特殊值"],"options":null,"answer":["3"],"kp":"浮点数"},{"id":"m2024-21","source":"2024 期中","origin":"exam","lecture":3,"topic":"union 位级转换与向零舍入","type":"fill","difficulty":3,"stem":"有 `union { float f; int i; } converter;`，执行 `converter.f = value;` 后，若 value 的值是 -1104.5，则 `printf(\"%d\\n\", (int)converter.f + (converter.i >> 31));` 的输出为多少？","code":null,"explanation":"(int)converter.f 是数值转换，规则为向零舍入，-1104.5 变成 -1104。converter.i 与 converter.f 共享同一段位模式：int 与 float 的最高位都是符号位，所以 -1104.5 对应的 converter.i 是负数，算术右移 31 位得到全 1，即 -1。两者相加为 -1104 + (-1) = -1105。这个写法的意义是把“向零舍入”修正为“向负无穷舍入”：当数值为负且不是整数时，结果比直接转换小 1，非负时右移结果为 0，不影响原值。踩坑点：把 converter.i >> 31 当成 1、0 或 (unsigned) 意义下的值。","tags":["union","向零舍入","算术右移"],"options":null,"answer":["-1105"],"kp":"浮点数"},{"id":"m2024-22","source":"2024 期中","origin":"exam","lecture":3,"topic":"自定义浮点格式的最大负非规格化数","type":"fill","difficulty":3,"stem":"基于 IEEE-754 标准定义一种 8 位浮点数，符号位、阶码位和尾数位长度分别为 1、5、2。该格式可表示的最大的负非规格化数（不考虑 -0）的二进制表示是什么？（按 符号位|阶码|尾数 的顺序写出 8 位）","code":null,"explanation":"非规格化数的阶码字段固定为 00000，其值为 ±0.f × 2^(1-15) = ±0.f × 2^-14。“最大的负非规格化数”指所有负数中数值最大、也就是最接近 0 的那个，其绝对值必须最小但不能是 0，因此 2 位小数字段取最小值 01（取 00 得到的是 -0，题目已排除）。于是位模式为 1|00000|01，即 10000001。踩坑点：把小数字段取成 11 会得到绝对值最大的负非规格化数 10000011；把符号位与数值大小的关系搞反则会写成 00000001。","tags":["IEEE 754","非规格化数","位模式"],"options":null,"answer":["10000001","1 00000 01"],"kp":"浮点数"},{"id":"s2025a-07","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"IEEE 754 无穷大编码","type":"fill","difficulty":1,"stem":"在 IEEE 754 标准中，单精度浮点数的编码结构为：符号位 1 位、阶码 8 位、尾数 23 位。正无穷（+∞）的编码用十六进制表示是多少？","code":null,"explanation":"正无穷要求：符号位 s = 0；阶码 8 位全为 1，即 0xFF；尾数 23 位全为 0。拼起来是 0 11111111 00000000000000000000000，按 4 位一组写成十六进制即 0x7F800000。对应的负无穷是 0xFF800000，而 NaN 要求阶码全 1 且尾数非 0（例如 0x7FC00000）。这三个值都是规格化/非规格化之外的「特殊值」，判断时先看阶码再看尾数。","tags":["IEEE 754","特殊值","浮点编码"],"options":null,"answer":["0x7F800000","7F800000","0x7f800000","7f800000"],"kp":"浮点数"},{"id":"s2025a-08","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"IEEE 754 解码：符号位","type":"fill","difficulty":2,"stem":"将编码 `0xA1100000` 对应到表达式 v = (-1)^s × M × 2^E，其中的符号位 s 等于多少？请用十进制表示。","code":null,"explanation":"0xA1100000 的最高位（bit 31）是十六进制首位 A = 1010 的最高位 1，所以 s = 1，该数为负数。读浮点位模式时的固定顺序是：先取 bit31 作符号，再取 bit30~bit23 作阶码，最后取 bit22~bit0 作尾数。0xA1100000 拆开是 1 | 01000010 | 00100000000000000000000（也可写成 1 | 0x42 | 0x100000）。","tags":["IEEE 754","浮点解码","符号位"],"options":null,"answer":["1"],"kp":"浮点数"},{"id":"s2025a-09","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"IEEE 754 解码：规格化尾数 M","type":"fill","difficulty":3,"stem":"将编码 `0xA1100000` 对应到表达式 v = (-1)^s × M × 2^E，其中的尾数 M 等于多少？请用十进制表示。","code":null,"explanation":"0xA1100000 的尾数域是低 23 位，等于 0x100000 = 2^20，即只有从高位数起的第 3 位是 1（对应权值 2^-3 = 0.125）。因为是规格化数，隐含前导 1，所以 M = 1 + 0.125 = 1.125。规律是：尾数域第 k 位（从 bit22 开始数）为 1 时贡献 2^-(k+1)。","tags":["IEEE 754","尾数","规格化数"],"options":null,"answer":["1.125"],"kp":"浮点数"},{"id":"s2025a-10","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"IEEE 754 解码：阶码 E 与偏置","type":"fill","difficulty":3,"stem":"将编码 `0xA1100000` 对应到表达式 v = (-1)^s × M × 2^E，其中的阶码 E 等于多少？请用十进制表示。","code":null,"explanation":"0xA1100000 的阶码域是 bit30~bit23，等于 0x42 = 66。单精度的偏置量 Bias = 2^(8-1)-1 = 127，所以真实阶码 E = 66 - 127 = -61。即该浮点数的值为 -1.125 × 2^-61。牢记 Bias 公式：单精度 127、双精度 1023，计算 E 时务必减去偏置，这是浮点解码最常见的失分点。","tags":["IEEE 754","阶码","偏置量"],"options":null,"answer":["-61"],"kp":"浮点数"},{"id":"s2025a-11","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"向偶数舍入","type":"fill","difficulty":2,"stem":"按照「向偶数舍入」的规则，将二进制数 `101.111100` 保留小数点后三位，结果是多少？","code":null,"explanation":"截断点为 101.111|100，被丢弃的部分是 100，恰好等于「一半」，此时用向偶数舍入规则：看保留部分的末位，它是 1（奇数），所以进 1，得到 101.111 + 0.001 = 110.000（发生了进位连锁，111 全变 0）。这个规则也叫 round-to-even / 银行家舍入，目的是让大量舍入的误差期望为 0，避免每次都向上舍入导致偏差累积。","tags":["浮点舍入","向偶数舍入"],"options":null,"answer":["110.000","110.0","110.0000","110"],"kp":"浮点数"},{"id":"s2025a-12","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"向偶数舍入","type":"fill","difficulty":2,"stem":"按照「向偶数舍入」的规则，将二进制数 `101.100100` 保留小数点后三位，结果是多少？","code":null,"explanation":"截断点为 101.100|100，丢弃部分是 100，正好是一半，于是看向保留部分的末位：它是 0（偶数），所以直接舍去，结果保持 101.100。与上一小题对比可以看出向偶数舍入的关键：当且仅当恰好处于两个可表示值的正中间时，才用「末位取偶」决定取舍；不足一半舍、超过一半进，这两条与普通四舍五入一致。","tags":["浮点舍入","向偶数舍入"],"options":null,"answer":["101.100","101.10","101.1"],"kp":"浮点数"},{"id":"s2025a-13","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"int 与 double/float 转换的精度","type":"judge","difficulty":2,"stem":"在 int 为 32 位补码、float 为 32 位 IEEE、double 为 64 位 IEEE 的机器上，`int x = random(); double dx = (double) x;`。判断表达式是否恒为真：`(float) x == (float) dx`。","code":null,"explanation":"恒为真。int 的 32 位取值范围完全可以被 double 的 53 位有效位精确表示，因此 (double)x 是一次无误差的转换；此后 (float)dx 是把同一个实数值由 double 舍入到 float，(float)x 是把同一个整数值由 int 舍入到 float。两种路径对同一个精确实数做同样的「就近舍入」，结果必然相同。注意这里没有出现任何「先丢精度再丢一次」的情况，因为 double 这一环是无损的。","tags":["浮点转换","舍入","精度"],"options":null,"answer":true,"kp":"浮点数"},{"id":"s2025a-14","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"浮点加法结合律","type":"judge","difficulty":3,"stem":"在 int 为 32 位补码、float 为 32 位 IEEE、double 为 64 位 IEEE 的机器上，`int x,y,z = random(); double dx=(double)x, dy=(double)y, dz=(double)z;`。判断表达式是否恒为真：`(dx + dy) + dz == dx + (dy + dz)`。","code":null,"explanation":"恒为真，但原因是本题的特殊条件而非「浮点加法满足结合律」。dx、dy、dz 都是 32 位整数被 double 精确表示的结果；两个这样的数相加，结果绝对值不超过 2^32，仍在 double 的 53 位有效位范围内，因此这一步也是精确的；再加第三个数，绝对值不超过 2^32+2^31 量级，同样精确。两次分组的中间结果都精确，所以两种结合顺序给出同一个数。若换成一般的浮点数（例如 1e20 + 1 - 1e20），结合律就会失效——浮点加法本身不满足结合律。","tags":["浮点加法","结合律","精度"],"options":null,"answer":true,"kp":"浮点数"},{"id":"s2025a-15","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"浮点乘法结合律与溢出舍入","type":"judge","difficulty":3,"stem":"在 int 为 32 位补码、float 为 32 位 IEEE、double 为 64 位 IEEE 的机器上，`int x,y,z = random(); double dx=(double)x, dy=(double)y, dz=(double)z;`。判断表达式是否恒为真：`(dx * dy) * dz == dx * (dy * dz)`。","code":null,"explanation":"不恒为真。两个 32 位整数相乘最多需要 64 位有效数字（例如两个约 2^30 的数相乘），double 只有 53 位有效位，因此中间乘积一般要被舍入；不同的结合顺序会让舍入发生在不同的中间结果上，误差传播不同。另外乘法还可能溢出到无穷大：例如 x 很大、y 很大、z 很小，(dx*dy) 可能先变成 +∞，而 dx*(dy*dz) 仍是有限值。所以绝不能对浮点乘法套用整数乘法的结合律。","tags":["浮点乘法","结合律","溢出"],"options":null,"answer":false,"kp":"浮点数"},{"id":"s2025a-16","source":"2025 第 1 次阶段测验","origin":"exam","lecture":3,"topic":"浮点除法与 NaN","type":"judge","difficulty":2,"stem":"在 int 为 32 位补码、float 为 32 位 IEEE、double 为 64 位 IEEE 的机器上，`int x,y,z = random(); double dx=(double)x, dy=(double)y, dz=(double)z;`。判断表达式是否恒为真：`dx/dx == dz/dz`。","code":null,"explanation":"不恒为真。当 x = 0 时 dx = 0.0，0.0/0.0 的结果是 NaN；而 NaN 与任何值（包括它自己）比较都不相等。于是只要 x = 0 而 z ≠ 0，左边是 NaN、右边是 1.0，表达式为假。即使浮点数除法本身没有整数除零的陷阱，NaN 的「不等于自身」特性依然会破坏这类恒等式；另外若 dx、dz 都为 0，两边都是 NaN，NaN == NaN 仍为假。","tags":["浮点除法","NaN","IEEE 754"],"options":null,"answer":false,"kp":"浮点数"},{"id":"gen-c03-01","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"IEEE 754 单精度解码","type":"single","difficulty":1,"stem":"某个单精度 `float` 的位模式是 `0xC0A00000`，它表示的值是：","code":null,"explanation":"0xC0A00000 的二进制是 1100 0000 1010 0000 0000 0000 0000 0000。按 1+8+23 划分：符号位 s = 1（负数），阶码字段 exp = 1000 0001 = 129，尾数字段 frac = 010 0000 ... 。单精度 Bias = 2^7-1 = 127，所以 E = 129 - 127 = 2；规格化数尾数隐含前导 1，M = 1.010(二进制) = 1 + 1/4 = 1.25。于是 v = (-1)^s × M × 2^E = -1.25 × 4 = -5.0。选项 B 忘了符号位；选项 C 漏乘 2^E；选项 D 把 M 算成 1.01 以外的值。这是讲义中的标准解码例子，对应第 3 讲「C float Decoding Example」。","tags":["IEEE754","解码","规格化数"],"options":["-5.0","+5.0","-1.25","-2.5"],"answer":0,"kp":"浮点数"},{"id":"gen-c03-02","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"特殊值：NaN 与无穷","type":"single","difficulty":1,"stem":"在 IEEE 754 单精度格式中，若阶码字段 exp 全为 1、尾数字段 frac 不全为 0，则该编码表示：","code":null,"explanation":"IEEE 754 把 exp 全 1 的编码留给特殊值：frac 全 0 且 s=0 表示 +∞、s=1 表示 -∞；frac 非 0 则表示 NaN（Not a Number），用于表示无法确定数值的情形，例如 sqrt(-1)、∞-∞、∞×0。选项 A 对应 exp 全 0 且 frac 全 0；选项 D 对应 exp 全 0 且 frac 非 0（此时 E 按 1-Bias 计算、尾数隐含前导 0，是最接近 0 的一批等间距数）；选项 B 是 frac 全 0 的情形。注意 NaN 参与的任何比较都返回假（包括 NaN == NaN），所以浮点比较不能简单地照搬无符号整数比较。对应第 3 讲「Special Values」一节。","tags":["IEEE754","NaN","特殊值"],"options":["+0 或 -0","+∞ 或 -∞","NaN（非数）","非规格化数"],"answer":2,"kp":"浮点数"},{"id":"gen-c03-03","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"非规格化数解码","type":"single","difficulty":2,"stem":"位模式为 `0x001C0000` 的单精度 `float` 所表示的值是：","code":null,"explanation":"0x001C0000 = 0000 0000 0001 1100 0000 ...，符号位 s = 0，阶码字段 exp = 0000 0000 全 0，因此这是非规格化数：E 固定为 1 - Bias = 1 - 127 = -126，尾数隐含前导 0。frac = 001 1100 0...，即 0.00111(二进制) = 1/8 + 1/16 + 1/32 = 7/32 = 7 × 2^(-5)。所以 v = 7 × 2^(-5) × 2^(-126) = 7 × 2^(-131) ≈ 2.57×10^(-39)。选项 B 把非规格化数当规格化数（隐含 1，且 M=1.25），并且用错了指数；选项 C 的 2^(-129) 是把 E 误当成 -126 但尾数权重算错；选项 D 忽略了 frac 非 0。注意非规格化数存在的意义是让 0 附近也有等间距的数，实现从 0 到最小规格化数的平滑过渡。对应第 3 讲「Denormalized Values」与「C float Decoding Example #2」。","tags":["非规格化数","解码","Bias"],"options":["7 × 2^(-131)（约 2.57 × 10^(-39)）","1.25 × 2^(-126)","7 × 2^(-129)","+0.0"],"answer":0,"kp":"浮点数"},{"id":"gen-c03-04","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"向偶数舍入","type":"single","difficulty":2,"stem":"在默认的「向偶数舍入（round-to-even）」模式下，把值 2 5/8（即 2.625，二进制 10.101）舍入到 1/4（小数点后 2 位二进制），结果是：","code":null,"explanation":"二进制 10.101 位于 10.10 与 10.11 的正中间（小数点后第 3 位是 1，右侧被丢弃的位恰好是 100...，属于正好一半的情形）。向偶数舍入的规则是：恰好一半时取最低有效位为 0（偶数）的那个。10.10 的最低位是 0（偶数），值为 2.5；10.11 的最低位是 1（奇数），值为 2.75。因此选 2.5。选项 A 属于「小于一半往下舍」的情形（例如 10.00011 舍到 2.0）；选项 C 是向上取整的结果；选项 D 对应讲义中 2 7/8 = 10.111 的舍入（大于一半，往上去到 11.00 = 3）。向偶数舍入是 IEEE 754 的默认模式，因为它统计上无偏，而其他模式会让大量同号数据求和时产生系统性偏差。对应第 3 讲「Rounding Binary Numbers」一节。","tags":["舍入","向偶数舍入","二进制小数"],"options":["2.0","2.5","2.75","3.0"],"answer":1,"kp":"浮点数"},{"id":"gen-c03-05","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"浮点乘法不满足结合律","type":"single","difficulty":3,"stem":"在 C 中令 `float a = 1e20f, b = 1e20f, c = 1e-20f;`。关于表达式 `(a * b) * c` 与 `a * (b * c)` 的值，下列说法正确的是：","code":null,"explanation":"单精度 float 的最大规格化数约为 3.4×10^38。先算左式：(a*b) = 1e20×1e20 = 1e40，远远超过可表示范围，按 IEEE 754 规则上溢得到 +∞；再乘 c 得 +∞ × 1e-20 = +∞。右式先算 b*c = 1e20×1e-20 = 1e0 ≈ 1.0f，再用 a 乘得约 1e20f，完全正常。这说明浮点乘法不满足结合律，根源是溢出的可能性和舍入的不精确性；讲义还给出分配律失效的例子：1e20*(1e20-1e20) = 0.0 而 1e20*1e20 - 1e20*1e20 = NaN。选项 A 正是被戳破的误解；选项 C、D 把两个表达式的命运搞反了。踩坑点：编译器也正因为此不敢随意重排浮点运算。对应第 3 讲「Mathematical Properties of FP Mult」一节。","tags":["浮点数","结合律","上溢"],"options":["两者都约等于 1e20f，因为乘法满足结合律","前者为 +∞（结果上溢），后者约等于 1e20f","两者都是 +∞","前者约等于 1e20f，后者为 +∞"],"answer":1,"kp":"浮点数"},{"id":"gen-c03-06","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"IEEE 754 编码规则与性质","type":"multi","difficulty":2,"stem":"关于 IEEE 754 浮点表示，下列说法正确的有：","code":null,"explanation":"选项 A 正确：非规格化时 E = 1 - Bias（单精度 -126），这样能保证最大的非规格化数与最小的规格化数平滑衔接、且 0 附近等间距。选项 B 正确：规格化数 M = 1.xxx，frac 全 0 时 M = 1.0，frac 全 1 时 M = 2.0-ε，这个隐含的 1 是「白送」的一位精度。选项 C 正确：这是特殊值的定义。选项 D 错误：浮点加法不满足结合律，讲义给出 (3.14+1e10)-1e10 = 0 而 3.14+(1e10-1e10) = 3.14。选项 E 错误：虽然 IEEE 编码设计得「几乎」可以按无符号整数比较，但必须先比较符号位、还要处理 -0 == +0、以及 NaN 会让比较结果异常，不能直接套用。对应第 3 讲「Three kinds of floating point numbers」与「Special Properties of the IEEE Encoding」两节。","tags":["IEEE754","非规格化数","NaN","结合律"],"options":["非规格化数的阶码字段全为 0，其有效阶 E 按 1 - Bias 计算而不是 0 - Bias","规格化数的尾数隐含前导 1，因此当 frac 全为 0 时 M = 1.0","exp 全为 1 且 frac 全为 0 表示 ±∞，exp 全为 1 且 frac 非 0 表示 NaN","浮点加法满足结合律，可以像整数一样自由调整括号","浮点数的位模式可以直接用小端无符号整数比较指令来比大小，无需任何额外处理"],"answer":[0,1,2],"kp":"浮点数"},{"id":"gen-c03-07","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"负零的编码","type":"judge","difficulty":2,"stem":"在 IEEE 754 单精度格式中，位模式 `0x80000000` 表示 -0.0。","code":null,"explanation":"判断正确。0x80000000 = 1000 0000 0000 0000 ...，符号位 s = 1，阶码字段 exp = 0000 0000 全 0，尾数字段 frac 全 0。按定义 exp 全 0 且 frac 全 0 表示零值，符号位决定是 +0 还是 -0，所以该模式是 -0.0。IEEE 754 特意区分 +0 和 -0，是因为在某些运算中符号有意义，例如 1.0/(+0.0) = +∞ 而 1.0/(-0.0) = -∞；同时 -0 == +0 在比较时为真（只是位模式不同）。踩坑点：不要因为「零就是零」而认为只有一个零编码，整数里 0 只有一种编码，浮点里有两种。对应第 3 讲「Denormalized Values」中「Note distinct values: +0 and -0」以及「Special Values」一节。","tags":["IEEE754","负零","特殊值"],"options":null,"answer":true,"kp":"浮点数"},{"id":"gen-c03-08","source":"自编 · 第 3 讲","origin":"created","lecture":3,"topic":"单精度编码（float 15213.0）","type":"fill","difficulty":3,"stem":"请写出十进制数 15213.0 作为单精度 `float` 的 32 位位模式（用十六进制表示，形如 `0x????????`）。","code":null,"explanation":"第一步：15213 = 1110 1101 1011 01(二进制)，即 11101101101101，共 14 位。规格化为 1.1101101101101 × 2^13，所以 E = 13，M = 1.1101101101101。第二步：阶码字段 Exp = E + Bias = 13 + 127 = 140 = 10001100(二进制)；尾数字段 frac 取 M 小数点后的 13 位再补 10 个 0，得 11011011011010000000000。第三步：拼接 s(0) + exp(10001100) + frac(11011011011010000000000)，即 0100 0110 0110 1101 1011 0100 0000 0000 = 0x466DB400。可以用 Python 的 struct.pack('>f', 15213.0).hex() 验证得到 466db400。常见错误是把 Exp 直接写成 13（漏加 Bias）、或把 M 的前导 1 也写进 frac 造成位数不对。对应第 3 讲「Normalized Encoding Example」。","tags":["IEEE754","编码","Bias"],"options":null,"answer":["0x466DB400","0x466db400","466DB400"],"kp":"浮点数"},{"id":"f2013-03","source":"2013 期末","origin":"exam","lecture":4,"topic":"用 leal 完成线性算术运算","type":"single","difficulty":2,"stem":"已知变量 x 的值已经存放在寄存器 `%eax` 中，现在想把 `5x+7` 的值计算出来并存放到寄存器 `%ebx` 中，如果不允许使用乘法和除法指令，则至少需要多少条 IA-32 指令完成该任务？","code":null,"explanation":"leal 的作用是算出地址表达式的值，形如 D(Rb,Ri,S)，其中比例因子 S 只能是 1、2、4、8。把 x 同时用作基址和变址、比例取 4、再加上偏移 7，就得到 x + 4x + 7 = 5x+7，一条 `leal 7(%eax,%eax,4), %ebx` 即可完成。若改用 movl 与 addl 组合，至少也要两条以上，而且“乘 5”本身还要拆成移位与加法。踩坑点：leal 只能生成形如“基址 + 变址*1/2/4/8 + 常数”的表达式，本题的 5 = 1+4 恰好可以一条搞定。","tags":["leal","比例变址","寻址方式"],"options":["1 条","3 条","2 条","4 条"],"answer":0,"kp":"机器级编程基础"},{"id":"f2015-01","source":"2015 期末","origin":"exam","lecture":4,"topic":"栈指针变化的指令","type":"single","difficulty":1,"stem":"下面哪条指令不会引起 esp 的变化？","code":null,"explanation":"movl %esp,%ebp 只是把栈指针的值复制到帧指针寄存器，%esp 的值完全没变（被改写的只有 %ebp）。pushl %ebp 使 %esp 减 4；call 把返回地址压栈，%esp 也会减（64 位下是减 8）；subl $20,%esp 直接修改栈指针，为局部变量开辟空间。踩坑点：题目问的是 esp 是否变化，%ebp 的变化不算。","tags":["栈","esp","push/call"],"options":["movl %esp, %ebp","pushl %ebp","call printf","subl $20, %esp"],"answer":0,"kp":"数据布局与对齐"},{"id":"f2015-03","source":"2015 期末","origin":"exam","lecture":4,"topic":"x86 寻址方式的合法性","type":"single","difficulty":1,"stem":"下面哪条指令不是 X86 正确的寻址方式","code":null,"explanation":"x86 的 mov 不允许“存储器到存储器”：D 的源操作数 (%eax) 和目的操作数 8(%ebx) 都是内存，非法。A 是把立即数写入内存单元；B 是把内存内容读入同一寄存器；C 是立即数写入比例变址寻址的内存单元（比例因子缺省为 1）。踩坑点：一条指令中最多只有一个操作数可以来自或去往内存。","tags":["寻址方式","mov","存储器操作数"],"options":["movl $34, (%eax)","movl (%eax), %eax","movl $23, 10(%edx, %eax)","movl (%eax), 8(%ebx)"],"answer":3,"kp":"机器级编程基础"},{"id":"f2017-01","source":"2017 期末","origin":"exam","lecture":4,"topic":"gdb 单步进入函数调用","type":"single","difficulty":1,"stem":"在 gdb 调试中，下一条指令是 `call func1`。下面哪条 gdb 指令能执行该指令并且停留在 func1 的第一条指令？","code":null,"explanation":"si（stepi）按机器指令单步执行，遇到 call 会进入被调用函数，因此执行完 call 后停在该函数的第一条指令；ni（nexti）同样单步执行一条指令，但把函数调用整体当作一步跳过，会停在 call 的下一条指令；br func1 只是设置断点，还需要 continue 才会真正运行；disas func1 只是反汇编显示，不执行程序。踩坑点：C 语言的 step/next 与汇编级的 si/ni 一一对应，本题明确说是“下一条指令”，属于汇编级调试。","tags":["gdb","调试","stepi"],"options":["br func1","si","ni","disas func1"],"answer":1,"kp":"过程调用与栈"},{"id":"f2018-22","source":"2018 期末","origin":"exam","lecture":4,"topic":"i++ 对应的机器级代码","type":"fill","difficulty":2,"stem":"给定如下程序。用给出的元素编号写出 i++ 编译后的汇编代码：可用的元素为 (a) mov  (b) add  (c) 0x601040  (d) %eax  (e) $0x1（例如回答 (a)(e)(d) 表示 mov $0x1, %eax）。","code":"#include <stdio.h>\n#include <pthread.h>\nint i = 0;\nint j = 0;\nvoid *do_stuff1(void *arg __attribute__((unused))) {\n  int a;\n  for (a = 0; a < 1000; a++)\n    { i++; j++; }\n  return NULL;\n}\nvoid *do_stuff2(void *arg __attribute__((unused))) {\n  int a;\n  for (a = 0; a < 1000; a++)\n    { j++; i++; }\n  return NULL;\n}","explanation":"全局变量 i 位于数据段（题目给出了它的地址 0x601040），对它的自增不是一条原子指令，而是“取数—加一—存回”三步：先把内存中的 i 装入寄存器：(a)(c)(d) 即 mov 0x601040, %eax；再用 add 把立即数 1 加到寄存器上：(b)(e)(d) 即 add $0x1, %eax；最后把结果写回内存：(a)(d)(c) 即 mov %eax, 0x601040。这三条指令之间可以被线程切换打断，正是它们共同构成了后面几问所说的数据竞争：如果两个线程都执行了第一步、再先后执行第二三步，一次自增就会被覆盖丢失。踩坑点：不要以为 i++ 是一条指令；在 x86-64 上即便存在 add $1, 0x601040 这种写法，编译出的典型形态仍是 load-add-store 三步。","tags":["机器级代码","全局变量自增","数据竞争"],"options":null,"answer":["mov 0x601040, %eax; add $0x1, %eax; mov %eax, 0x601040","(a)(c)(d) (b)(e)(d) (a)(d)(c)","movl 0x601040, %eax; addl $1, %eax; movl %eax, 0x601040"],"kp":"机器级编程基础"},{"id":"f2021-02","source":"2021 期末","origin":"exam","lecture":4,"topic":"x86-64 指令的合法性","type":"single","difficulty":1,"stem":"下列选项中是合法 x86-64 汇编指令的是：","code":null,"explanation":"B 合法：xorq %rsp,%rsp 把 %rsp 自己与自己异或，是一条完全合法的指令（语义上会把寄存器清零，这里只是举例合法写法）。A 不合法：立即数只能作为源操作数，不能作为 mov 的目标（立即数不是可写的位置）。C 不合法：x86 不允许一条 mov 同时有两个内存操作数（内存到内存必须经过寄存器中转）。D 不合法：内存寻址的比例因子只能是 1、2、4、8（对应 1/2/4/8 字节的元素大小），不能写 3。踩坑点：AT&T 格式中源在前、目标在后，且“立即数不能当目标、不能内存到内存、比例因子只能取 1/2/4/8”是三个最常见的合法性检查点。","tags":["汇编指令","寻址方式","操作数"],"options":["movq %rax, $1","xorq %rsp, %rsp","movq (%rax), (%rbx)","movq (%rax, %rbx, 3), %rcx"],"answer":1,"kp":"机器级编程基础"},{"id":"m2012-07","source":"2012 期中","origin":"exam","lecture":4,"topic":"mov 与 lea 的区别","type":"single","difficulty":2,"stem":"mov 指令与 lea 指令的区别是什么？","code":null,"explanation":"mov 的操作数是「内存中的值」，会把有效地址处的数据读出（或写入），即解引用；lea 只按寻址格式算出有效地址本身并写入目的寄存器，绝不访问内存，因此常用它做算术，例如 lea (%rdi,%rdi,4),%rdi 实现乘 5。A 把两者说反了。C、D 都说另一种不能做寄存器到寄存器的复制，这是错的：mov %rax,%rbx 与 lea (%rax),%rbx 都能完成寄存器搬运（后者只是顺手多算了一次地址）。","tags":["lea","mov","寻址"],"options":["lea 会解引用地址，而 mov 不会","mov 会解引用地址，而 lea 不会","lea 可以把一个寄存器复制到另一个寄存器，而 mov 不能","mov 可以把一个寄存器复制到另一个寄存器，而 lea 不能"],"answer":1,"kp":"机器级编程基础"},{"id":"m2013-05","source":"2013 期中","origin":"exam","lecture":4,"topic":"lea 实现乘法","type":"single","difficulty":2,"stem":"已知函数 `int x(int n) { return n * ____; }` 对应的汇编代码如下，横线上的数字应该是：","code":"lea (%rdi, %rdi, 4), %rdi\nlea (%rdi, %rdi, 1), %eax\nretq","explanation":"第一条 lea 用 base + index×scale 的格式算 %rdi = %rdi + 4×%rdi = 5n；第二条 lea (%rdi,%rdi,1) 算 %eax = %rdi + 1×%rdi = 2×(5n) = 10n，最后由 %eax 返回，所以空缺处是 10。选项 5 只看懂了第一条 lea；选项 2 只看懂了第二条；选项 4 是把比例因子 4 当成了乘数。踩坑点：lea 只能做「加一个位移」和「寄存器×{1,2,4,8}」的组合，编译器常用 5n = n + 4n、10n = 2×5n 这样的分解把乘法变成一两条 lea，这也是为什么 lea 常被当作算术指令使用。","tags":["lea","乘法优化","比例因子"],"options":["4","5","2","10"],"answer":3,"kp":"机器级编程基础"},{"id":"m2013-07","source":"2013 期中","origin":"exam","lecture":4,"topic":"x86 寻址方式的合法性","type":"multi","difficulty":2,"stem":"x86 体系结构的内存寻址方式有多种格式，下列哪些指令是正确的？","code":null,"explanation":"A 正确：把立即数 34 写入 %eax 指向的 4 字节内存单元。B 正确：把 (%eax) 处的 4 字节读回 %eax，源和目的同名并不冲突（先读后写）。C 正确：目的地址是 base + index + disp = %edx + %eax + 10，比例因子省略时默认为 1。D 错误：源和目的都是内存操作数，而 x86 的 mov 不允许「内存到内存」的直接传送，必须借助寄存器中转。踩坑点：AT&T 格式里立即数要写 $，没有 $ 的数字表示内存地址；同一指令中最多只能有一个内存操作数。","tags":["寻址方式","mov","内存到内存"],"options":["movl $34, (%eax)","movl (%eax), %eax","movl $23, 10(%edx, %eax)","movl (%eax), 8(%ebx)"],"answer":[0,1,2],"kp":"机器级编程基础"},{"id":"m2013-08","source":"2013 期中","origin":"exam","lecture":4,"topic":"x86 指令与调用约定辨析","type":"multi","difficulty":3,"stem":"关于 x86 体系结构，下面哪些说法是**错误**的？","code":null,"explanation":"A 错：leal 只是把有效地址算进目的寄存器，可以用于任意算术（如乘 5、乘 10），并不是只能算地址。B 对（因此不是答案）：x86-64 前 6 个整型参数用寄存器传递，超出 6 个的参数仍然通过栈传递。C 错：只有 callee-saved（被调用者保存）寄存器——%rbx、%rbp、%r12~%r15——在改动前需要保存，caller-saved 的临时寄存器（%rax、%rcx、%rdx、%rsi、%rdi、%r8~%r11 等）由调用者按需保存或在溢出时写栈，无需一律入栈。D 错：有符号比较要同时用到 ZF、SF 和 OF（`a < b` 由 SF^OF 判定），只靠 SF 与 ZF 无法处理溢出情形；无符号比较用 CF 与 ZF。该题亦见于 2015 年试卷（改问「正确的是」，答案为 B），本题保留最早的 2013 年版。","tags":["leal","调用约定","条件码"],"options":["leal 指令只能够用来计算内存地址","x86-64 机器可以使用栈来给函数传递参数","在一个函数内，改变任一寄存器的值之前必须先将其原始数据保存在栈内","判断两个寄存器中值的大小关系，只需要 SF（符号）和 ZF（零）两个条件码"],"answer":[0,2,3],"kp":"机器级编程基础"},{"id":"m2014-05","source":"2014 期中","origin":"exam","lecture":4,"topic":"寻址方式的合法性判断","type":"single","difficulty":2,"stem":"下列指令中，寻址方式**不正确**的是：","code":null,"explanation":"x86 的寻址格式是 disp(base, index, scale)，其中 base 必须是寄存器（可为空），index 必须是寄存器，scale 只能取 1、2、4、8。B 把常数 0xA 放在 base 的位置上（(0xA, %eax) 里逗号前是 base、逗号后是 index），非法，故选 B。A 正确：base 省略、index 为 %ecx、scale 为 8，目的操作数是 %ah。C 是「立即数减到 %bl」，其寻址格式本身没问题（题目印刷时省略了立即数前缀 $，但按选项语义它是被认可的正确项）。D 正确：base + index、scale 缺省为 1。踩坑点：常数只能出现在位移 disp 的位置，不能当作基址寄存器。","tags":["寻址方式","base-index-scale","x86 指令"],"options":["MOVB %ah, 0x20(, %ecx, 8)","LEAL (0xA, %eax), %ebx","SUBB 0x1B, %bl","INCL (%ebx, %eax)"],"answer":1,"kp":"机器级编程基础"},{"id":"m2015-06","source":"2015 期中","origin":"exam","lecture":4,"topic":"x86 寻址模式的合法写法","type":"single","difficulty":2,"stem":"下列寻址模式中，正确的是：","code":null,"explanation":"C 正确：「123」是不带寄存器的纯位移写法，等价于绝对地址 0x7B 处的内存引用（disp 单独出现是合法的寻址模式，只是编译器很少生成）。A 错：AT&T 格式里 disp(base, index, scale) 一旦写了逗号，index 就不能省略，(%eax, , 4) 的 index 为空、比例因子却给了 4，非法（只写基址应是 (%eax)）。B 错：比例因子只能取 1、2、4、8，3 非法。D 错：$1 表示立即数，而括号前的位移必须是常量数字（如 1(...)），$1(%ebx,%ebp,1) 把立即数当成了位移。踩坑点：合法的 scale ∈ {1,2,4,8}；立即数前缀 $ 不能出现在位移位置。","tags":["寻址模式","AT&T 语法","比例因子"],"options":["(%eax,   , 4)","(%eax, %esp, 3)","123","$1(%ebx, %ebp, 1)"],"answer":2,"kp":"机器级编程基础"},{"id":"m2016-05","source":"2016 期中","origin":"exam","lecture":4,"topic":"te
