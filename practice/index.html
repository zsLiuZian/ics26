vq 的 ALU 输入","type":"single","difficulty":2,"stem":"SEQ 执行 `rmmovq rA, D(rB)` 时用 ALU 计算有效地址 valE = valB + valC。按照讲义的 HCL 控制逻辑，此时 ALU 的两个输入 aluA、aluB 分别是：","code":null,"explanation":"讲义第 10 讲「ALU A Input」给出 `aluA = [ icode in {IRRMOVQ, IOPQ} : valA; icode in {IIRMOVQ, IRMMOVQ, IMRMOVQ} : valC; icode in {ICALL, IPUSHQ} : -8; icode in {IRET, IPOPQ} : 8; ]`，而 ALU 的 B 输入固定取 valB。于是访存类指令（irmovq/rmmovq/mrmovq）把常量 valC 放在 A 口、把基址寄存器值 valB 放在 B 口，ALUADD 得到 valB + valC，正好是 `D(rB)` 的有效地址。选项 A 是 OPq 算术逻辑指令的接法；选项 C 的 -8 用于 call/pushq（压栈方向减 8）；选项 D 用了 valP，与地址计算无关。","tags":["SEQ","ALU","rmmovq"],"options":["aluA = valA，aluB = valB","aluA = valC，aluB = valB","aluA = -8，aluB = valB","aluA = valP，aluB = valC"],"answer":1,"kp":"机器级编程基础"},{"id":"gen-c10-03","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"popq 的阶段计算","type":"single","difficulty":2,"stem":"在 SEQ 中执行 `popq %rbx`，执行前 %rsp = 0x100，且内存地址 0x100 处存放的 8 字节值为 0xABC。这条指令执行完毕后，%rsp 与 %rbx 的值分别是：","code":null,"explanation":"讲义第 10 讲「Stage Computation: popq」给出的步骤是：Decode 阶段 valA ← R[%rsp]、valB ← R[%rsp]；Execute 阶段 valE ← valB + 8（新栈指针）；Memory 阶段 valM ← M8[valA]，注意读的是旧的 %rsp 所指的内容；Write Back 阶段同时写两个寄存器：R[%rsp] ← valE、R[rA] ← valM。因此读到旧栈顶 0x100 处的 0xABC，%rbx = 0xABC，而 %rsp 递增 8 变成 0x108。选项 C 是 pushq/call 的方向（减 8 而不是加 8）；选项 A 忘了更新栈指针；选项 D 忘了把内存读出的值写回。","tags":["SEQ","popq","阶段计算"],"options":["%rsp = 0x100，%rbx = 0xABC","%rsp = 0x108，%rbx = 0xABC","%rsp = 0x0F8，%rbx = 0xABC","%rsp = 0x108，%rbx = 0"],"answer":1,"kp":"SEQ 顺序实现"},{"id":"gen-c10-04","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"条件传送的取消机制","type":"single","difficulty":2,"stem":"在 SEQ 中，若 `cmovXX rA, rB` 的条件码判断不成立（不应传送），硬件是怎样做到「不写回寄存器」的？","code":null,"explanation":"讲义第 10 讲「Stage Computation: Cond. Move」：条件传送先让 valA 原样通过 ALU（valE ← 0 + valA），然后在 Execute 阶段执行 `If !Cond(CC, ifun) rB ← 0xF`，即把目的寄存器号改成「无寄存器」；配合译码阶段的 dstE 控制逻辑 `icode in {IRRMOVQ} && Cnd : rB; 1 : RNONE;`，流水线不会激活任何寄存器写端口，效果等价于这条传送没发生。用 0xF 取消写是 Y86-64 的通用技巧（凡是本周期不该写寄存器就把 dstE/dstM 设为 RNONE），理解它对后面 PIPE 判断冒险时必须特判 0xF 很关键。选项 A 与 B 的差别正在于：SEQ 并没有设置「写使能」信号，只能靠改寄存器编号来取消。","tags":["SEQ","条件传送","RNONE"],"options":["在 Write Back 阶段把 valE 直接丢弃，写端口照常使能","在 Execute 阶段把目的寄存器编号 rB 改成 0xF（RNONE），由于 0xF 表示无寄存器，写端口就不会写入任何寄存器","在 Memory 阶段回滚寄存器文件的内容","把 PC 改成 valP，跳过这条指令的写回阶段"],"answer":1,"kp":"控制流与条件码"},{"id":"gen-c10-05","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"指令状态 Stat 的优先级","type":"single","difficulty":3,"stem":"SEQ 中指令状态的 HCL 定义是 `Stat = [ imem_error || dmem_error : SADR; !instr_valid : SINS; icode == IHALT : SHLT; 1 : SAOK; ]`。若某周期取指地址非法（imem_error = 1）且同时指令码无法识别（instr_valid = 0），则 Stat 的取值是：","code":null,"explanation":"HCL 的 case 表达式按书写顺序匹配，第一个成立的测试胜出。这里 `!instr_valid` 虽然也成立，但 `imem_error || dmem_error : SADR` 写在整个表达式的最前面，所以结果是 SADR（错误地址）而不是 SINS（非法指令）。这个顺序是有意设计的：PC 一旦跑到非法地址，从该地址读回的字节自然也不构成合法指令，此时报告「地址错误」比报告「非法指令」更贴近根因。讲义第 10 讲「Instruction Status」一页给出的正是这个顺序，Y86-64 的四种状态 AOK=1、HLT=2、ADR=3、INS=4 中，除 AOK 之外都要求停止程序执行。","tags":["SEQ","指令状态","HCL 优先级"],"options":["SINS","SHLT","SADR","SAOK"],"answer":2,"kp":"系统级 I/O"},{"id":"gen-c10-06","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"call/ret/跳转的阶段计算","type":"multi","difficulty":3,"stem":"关于 SEQ 中几条控制转移指令的执行过程，下列说法正确的有（多选）：","code":null,"explanation":"讲义第 10 讲「Stage Computation: call / ret / Jumps」：call 在 Execute 阶段算 valE ← valB + (-8)（valB 是旧 %rsp），Memory 阶段 M8[valE] ← valP 把返回点压栈，Write Back 更新 %rsp，PC 更新阶段无条件 PC ← valC（目标地址）；ret 先把 %rsp 加 8 得到 valE，同时 valM ← M8[valA] 从旧栈顶取出返回地址，最后 PC ← valM；jXX 在 Fetch 阶段读出 8 字节目标 valC 并算出 valP = PC + 9，Execute 阶段得到 Cnd，PC 更新用 `Cnd ? valC : valP`。选项 D 错在 Dest 是随指令一起在 Fetch 阶段读出的（作为 valC），jXX 根本不访问数据存储器——mem_read 只为 mrmovq、popq、ret 置位；选项 E 错在 halt 使 Stat = SHLT 并停止执行，PC 不再有实际作用。","tags":["SEQ","call","ret","跳转"],"options":["call Dest：Execute 阶段用 ALU 算 valE = valB + (-8)，Memory 阶段把 valP 写入 M8[valE]，PC 更新阶段 PC ← valC","ret：Memory 阶段从 M8[valA]（valA 是旧的 %rsp）读出返回地址，PC 更新阶段 PC ← valM","jXX Dest：Fetch 阶段 valP ← PC + 9，若分支条件不成立则 PC ← valP","jXX Dest 需要 mem_read 信号，因为它必须到数据存储器里取出跳转目标 Dest","halt 指令执行后会把 PC 更新为 valP，然后继续取指执行下一条指令"],"answer":[0,1,2],"kp":"过程调用与栈"},{"id":"gen-c10-07","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"SEQ 的性能局限","type":"judge","difficulty":1,"stem":"判断：在 SEQ 中，一条指令必须在同一个时钟周期内先后经过指令存储器、寄存器文件、ALU 和数据存储器，因此时钟周期要长到能容纳这些部件延迟之和，而各硬件单元在一个周期中大部分时间处于空闲状态。","code":null,"explanation":"这正是讲义第 10 讲「SEQ Summary — Limitations」的原话：为了在一个周期里完成取指、译码、执行、访存、写回，信号必须依次传播过 instruction memory、register file、ALU 和 data memory，时钟周期只能按这条最慢路径之和来定，所以 SEQ「Too slow to be practical」，并且「Hardware units only active for fraction of clock cycle」。这个观察正是下一讲把执行切成五级流水线（PIPE）的动机：用流水线寄存器把组合逻辑分段，让不同指令同时占用不同部件，从而在不缩短单条指令延迟的前提下大大提高吞吐率。","tags":["SEQ","时钟周期","性能局限"],"options":null,"answer":true,"kp":"SEQ 顺序实现"},{"id":"gen-c10-08","source":"自编 · 第 10 讲","origin":"created","lecture":10,"topic":"SEQ 程序执行结果","type":"fill","difficulty":2,"stem":"下面这段 Y86-64 程序从 0x000 开始执行（`je` 不跳转）。求 `rmmovq` 执行完毕后，内存地址 0x200 处存放的 8 字节内容（十六进制）。","code":"0x000:  irmovq $0x100, %rbx\n0x00a:  irmovq $0x200, %rdx\n0x014:  addq   %rdx, %rbx     # %rbx <-- ?\n0x016:  je     dest           # 不跳转\n0x01f:  rmmovq %rbx, 0(%rdx)  # M[0x200] <-- ?","explanation":"`addq %rdx, %rbx` 的语义是 R[rB] ← valB OP valA，其中 rB = %rbx 是目的寄存器、rA = %rdx 是源寄存器（Y86-64 的 OPq 把结果写回 rB），所以 %rbx ← 0x100 + 0x200 = 0x300，同时条件码被设置为 ZF=0、SF=0、OF=0（即讲义 SEQ 演示中的 CC ← 000）。条件码不满足 je，`je` 不跳转，PC 顺序走到 0x01f 的 `rmmovq %rbx, 0(%rdx)`：有效地址 valE = valB + valC = %rdx + 0 = 0x200，Memory 阶段执行 M8[0x200] ← valA = 0x300。所以答案是 0x300，与讲义第 10 讲 SEQ 操作演示中「M[0x200] ← 0x300」一致。","tags":["SEQ","addq","rmmovq","执行结果"],"options":null,"answer":["0x300","0x0000000000000300","768","0x0300"],"kp":"SEQ 顺序实现"},{"id":"f2014-06","source":"2014 期末","origin":"exam","lecture":11,"topic":"流水线的吞吐率与时延","type":"single","difficulty":1,"stem":"下面关于流水线的说法哪个是正确的","code":null,"explanation":"流水线让多条指令在时间上重叠执行，单位时间完成的指令数（吞吐率）提高，A 对。B 错：单条指令要依次经过所有流水级，还要额外付出各级流水寄存器的延迟，时延通常不降反升。C 错：加速比受“最慢一级 + 寄存器开销”、数据/控制冒险造成的停顿以及装载排空的影响，不可能总是等于级数。D 错：级数越深，寄存器延迟与冒险代价越大，收益会饱和甚至下降。","tags":["流水线","吞吐率","时延"],"options":["流水线提高了指令的吞吐率","流水线减少了指令时延","流水线获得的加速比总是等于流水线的级数","流水线越深，收益越大"],"answer":0,"kp":"流水线 PIPE"},{"id":"f2016-04","source":"2016 期末","origin":"exam","lecture":11,"topic":"流水线时钟周期的确定","type":"single","difficulty":1,"stem":"现有四级指令流水线，分别完成取指、取数、运算、传送结果 4 步操作，各步时间依次为 9ns、10ns、6ns、8ns，则流水线的操作周期应设计为多少 ns？","code":null,"explanation":"流水线的时钟周期必须容纳最慢的一级（实际还要加上流水寄存器的建立/传播延迟），否则最慢一级无法在一个周期内完成，流水线就会出错；本题最慢的是取数级 10ns，故周期取 10ns，吞吐率也由它决定。取 6、8、9 都会使最慢一级超时。踩坑点：流水线周期由“最长级 + 寄存器开销”决定，而不是平均值或最短级。","tags":["流水线","时钟周期","吞吐率"],"options":["6","8","9","10"],"answer":3,"kp":"流水线 PIPE"},{"id":"f2019-02","source":"2019 期末","origin":"exam","lecture":11,"topic":"流水线数据冒险的判定","type":"single","difficulty":1,"stem":"在本课程的 PIPE 流水线中，下列情况会出现数据冒险的是：","code":null,"explanation":"数据冒险的根源是“前面的指令要写、后面的指令要读同一个寄存器”：后一条指令在译码阶段就要读取源操作数，而前一条指令的结果可能还在流水线中没有写回，于是读到了旧值。因此正确描述是“当前指令会改变（写入）下一条指令的源操作数”，选 B。A、C、D 都不构成数据冒险：目的操作数被后面的指令写入并不会让前面的指令读到错误的值（后面写、前面读，时间上不冲突）；C、D 把读写方向说反了。踩坑点：x86/Y86 的 PIPE 支持数据前递，可以减轻但不能完全消除这类冒险（有时仍需气泡），判断依据始终是“先写后读”。","tags":["流水线","数据冒险","PIPE"],"options":["当前指令会改变下一条指令的目的操作数","当前指令会改变下一条指令的源操作数","下一条指令会改变当前指令的目的操作数","下一条指令会改变当前指令的源操作数"],"answer":1,"kp":"流水线 PIPE"},{"id":"f2020-26","source":"2020 期末","origin":"exam","lecture":11,"topic":"流水线时钟周期（含寄存器延迟）","type":"fill","difficulty":1,"stem":"有一个五级流水线处理器，和课程中的 PIPE 处理器类似，包含取指（F）、译码（D）、执行（E）、访存（M）、写回（W）五级。在理想设计情况下，流水线每一级的电路处理时间如下表所示，每两级流水线阶段之间插入的寄存器耗时为 1ns。请问流水线运行的时钟周期最快为多少 ns？","code":"F    D    E    M    W\n处理时间（ns） 8    5    9    8    4\n每两级之间插入的寄存器耗时：1ns","explanation":"流水线的时钟周期必须能容纳最慢的那一级，再加上级间寄存器的开销：最慢的一级是 E 阶段，需要 9ns，级间寄存器固定 1ns，所以时钟周期最快为 9 + 1 = 10ns。踩坑点：周期由“最慢级 + 寄存器延迟”决定，而不是各级时间之和；各级时间之和 34ns 是未流水化时的组合逻辑延迟，不能作为时钟周期。","tags":["流水线","时钟周期","寄存器延迟"],"options":null,"answer":["10","10ns","10 ns"],"kp":"SEQ 顺序实现"},{"id":"f2020-27","source":"2020 期末","origin":"exam","lecture":11,"topic":"PIPE 执行周期数（数据前递 + 分支预测）","type":"fill","difficulty":3,"stem":"需要执行如下 Y86-64 汇编代码，寄存器的初始状态如右下表格所示。流水线支持课上讲的数据前递（data forwarding），分支预测设计为“始终跳转”（predicted as taken），请问执行上述代码需要多少个时钟周期？","code":"0x000 t: mrmovq (%rdi), %rbx\n0x002    addq   %rbx, %rax\n0x004    addq   $8, %rdi\n0x006    addq   $1, %rcx\n0x008    xorq   $8, %rcx\n0x00a    jne    t\n\n寄存器初值：%rdi = 0x8008，%rax = 0，%rbx = 0，%rcx = 0","explanation":"循环结束条件：%rcx 每轮加 1，随后 xorq $8,%rcx 使它变成 rcx^8，jne 在 rcx≠8 时跳转，因此循环体共执行 8 次（rcx = 0..7 都跳回，rcx = 8 时退出）。循环体有 6 条指令。理想情况下每轮 6 个周期，但由于 mrmovq 的结果要被紧接着的 addq 使用（load-use 型数据冒险），即使有前递也必须插入 1 个气泡，于是每轮 6 + 1 = 7 个周期，8 轮共 56 个周期。循环退出时最后一次 jne 的预测（始终跳转）失败，产生额外的分支预测错误惩罚，加上流水线排空等尾随周期共 4 个周期，因此总计 56 + 4 = 60 个周期。踩坑点：① 循环次数由 xorq+cmov/jne 的语义决定（这里是 8 次）；② 装载-使用冒险必须停顿一拍；③ 预测错误有惩罚，但官方把惩罚与排空合并在尾随周期中计算。","tags":["PIPE","数据前递","分支预测","周期数"],"options":null,"answer":["60","60 周期","60个时钟周期"],"kp":"流水线 PIPE"},{"id":"f2020-28","source":"2020 期末","origin":"exam","lecture":11,"topic":"指令/数据缓存命中次数统计","type":"fill","difficulty":3,"stem":"现需要考虑实际执行时存储层次对流水线执行时间的影响：该处理器包含一个 L1 指令缓存（I-cache）和一个 L1 数据缓存（D-cache），两者都是直接映射（E=1）、总容量 32KB、块大小 32Byte，执行前均为空；取指（F）阶段指令在 I-cache 中需 1 个周期、否则需 10 个周期，访存（M）阶段数据在 D-cache 中需 1 个周期、否则需 10 个周期。请问执行上面的代码（同一段 Y86-64 汇编，%rdi=0x8008，循环 8 次）I-cache 命中多少次、D-cache 命中多少次？","code":"0x000 t: mrmovq (%rdi), %rbx\n0x002    addq   %rbx, %rax\n0x004    addq   $8, %rdi\n0x006    addq   $1, %rcx\n0x008    xorq   $8, %rcx\n0x00a    jne    t\n\nI-cache / D-cache：直接映射，32KB，块大小 32B（32KB/32B = 1024 组）\n%rdi 初值 0x8008（不是 32 字节对齐的起始边界）","explanation":"循环体 8 轮、每轮 6 条指令，共取指 48 次。6 条指令共 12 字节，全部落在同一个 32 字节的块内，因此 I-cache 只在第一次取指时不命中，其余 47 次全部命中。数据访问只有 mrmovq 一条（8 轮共 8 次），访问地址从 0x8008 开始每次加 8：0x8008、0x8010、…、0x8040。一个 32 字节的块可容纳 4 个 8 字节长整数，但起始地址 0x8008 并不是 32 字节对齐的块边界，这 8 次访问跨越了 3 个块（第一个块只含 2 个元素，中间块 4 个，最后一个块 2 个），每个块首次访问都不命中，所以 8 次访问中有 3 次不命中、5 次命中。合计不命中 1 + 3 = 4 次，每次额外 9 个周期，再叠加前面的 60 个周期，执行完该代码段共需 60 + 4×9 = 96 个周期。踩坑点：数据起始地址未对齐会让同样的访问次数跨更多缓存块，从而提高不命中率。","tags":["cache","命中率","对齐","访存惩罚"],"options":null,"answer":["I-cache 命中 47 次，D-cache 命中 5 次","47；5","I-cache 47 次，D-cache 5 次"],"kp":"高速缓存"},{"id":"f2021-04","source":"2021 期末","origin":"exam","lecture":11,"topic":"PIPE 中无前递时的数据冒险与 nop 填充","type":"single","difficulty":2,"stem":"在 Y86-64 PIPE 处理器中（不考虑数据前递），以下哪个指令序列会造成数据冒险？","code":"A:  irmovq $10, %rdx\n    addq   %rdx, %rax\n\nB:  irmovq $10, %rdx\n    nop\n    addq   %rdx, %rax\n\nC:  irmovq $10, %rdx\n    nop\n    nop\n    addq   %rdx, %rax","explanation":"这三个序列都存在同一个“写后读”的数据冒险：irmovq 要写 %rdx，而 addq 要读 %rdx。在不使用数据前递的 PIPE 中，写入发生在 W 阶段（第五个周期），而紧随其后的 addq 在 D 阶段（第二个周期）就要读取寄存器堆，因此必须等 irmovq 完成写回才能让 addq 译码。插入 n 个 nop 只是把 addq 往后推迟：序列 A 需要插入 3 个 nop，B 插了 1 个不够，C 插了 2 个也不够，所以 A、B、C 都仍会引发数据冒险，故选 D（只有当插入 3 个 nop、让 addq 的译码阶段落在 irmovq 的写回阶段之后时，才不再需要停顿）。踩坑点：插入的 nop 数必须使“使用数据的指令进入译码阶段时，产生数据的指令已完成写回”，本题中恰好需要 3 个。","tags":["PIPE","数据冒险","nop","寄存器读写时机"],"options":["序列 A 会造成数据冒险","序列 B 会造成数据冒险","序列 C 会造成数据冒险","以上三个选项都会引发数据冒险"],"answer":3,"kp":"流水线 PIPE"},{"id":"f2021-05","source":"2021 期末","origin":"exam","lecture":11,"topic":"流水线延迟、吞吐率与流水级数","type":"single","difficulty":1,"stem":"根据下图所示的流水线结构（各级延迟依次为 20ps、40ps、80ps、50ps，末级寄存器延迟 10ps），判断错误的选项是：","code":"流水线各级：20ps → 40ps → 80ps → 50ps，级间寄存器延迟 10ps（图示结构）","explanation":"D 错误（本题选它）：流水线越深，级间寄存器的数量越多，寄存器本身的延迟与建立/保持时间会累积，同时数据冒险、控制冒险带来的停顿比例上升，还要付出更多的前递/检测硬件代价，因此“越深一定越好”是错的，存在最优的流水深度。A 对：未流水化时一条指令的延迟是各级组合逻辑之和加末级寄存器延迟，即 20+40+80+50+10 = 200ps，对应每秒 200ps^-1 = 5GIPS 的吞吐率（理想情况下每周期出一条指令）。B 对：在任意两个单元之间插入寄存器就能把该数据通路切成两段，从而变为二级流水线。C 对：插入两个寄存器各带来 10ps 的额外延迟，理想情况下平均每条指令的处理时间最多减少约 2×10 = 20ps。踩坑点：流水化的收益受“最慢级 + 寄存器开销”限制，不是级数越多越好。","tags":["流水线","吞吐率","流水深度"],"options":["当前流水线的延迟为 (20ps+40ps+80ps+50ps+10ps)=200ps，吞吐率为 5GIPS。","可以通过插入寄存器的方式使这个流水线变为二级流水线。","倘若只能插入两个寄存器（延迟均为 10ps），那么该流水线处理每条指令的平均时间最多减少 20ps（假设每条指令平均使用一个周期的时间）。","流水线的级数越深，处理器就一定能获得越好的性能。"],"answer":3,"kp":"流水线 PIPE"},{"id":"f2024-02","source":"2024 期末","origin":"exam","lecture":11,"topic":"处理器体系结构：RISC/CISC、硬件复用、流水线异常与转发优先级","type":"single","difficulty":2,"stem":"下列关于处理器体系结构的说法，正确的是：","code":null,"explanation":"A 错：RISC 的理念是精简指令集并使用定长指令，便于单周期译码和流水线设计，指令长度可变是 CISC 的典型特征（课本中正是用“定长 vs 变长”对比 RISC 与 CISC）。B 错：恰好相反，硬件上复制逻辑块（加法器、ALU 等）的成本很高，所以设计者希望复用各类算术/逻辑单元；同时硬件中处理各种特殊情况要比软件处理困难得多，课本 P265 讲的就是“把特例交给软件处理、让硬件保持简单”的思想。C 对：流水线中异常要等到指令到达写回阶段（此时它才真正会改变体系结构状态）才生效，在此之前只需禁止该指令和它后面的指令更新条件码、写内存等产生永久影响的操作，这样就能实现精确异常，课本 P308 有相应论述。D 错：多个转发源指向同一目的寄存器时确实要定优先级，但应是“越靠前（越接近执行阶段、数据越新）的转发源优先级越高”，例如 d_srcA 命中 e_dstE 时用 e_valE，其次才是 M_valE、W_valE；选项把“靠前/靠后”说反了。","tags":["RISC-CISC","流水线异常","转发优先级","硬件复用"],"options":["RISC 的设计理念是精简指令，为了减少指令的数量，它使用的指令长度可变。","在设计处理器时，硬件上复制逻辑块的成本要比软件中复制代码的成本低得多，而且在硬件系统中处理各种特殊情况也比用软件处理简单。","在处理器的流水线中，异常指令在到达写回阶段之前，不用让异常事件影响流水线中的指令流，只需要禁止后面的指令更新条件码和修改内存等产生永久影响的操作即可。","在处理器的流水线中，在译码阶段需要处理转发（Forwarding）。如果有相同目标的多个转发源，赋予不同优先级是十分重要的，来自越靠后流水线阶段的转发源的优先级越高。"],"answer":2,"kp":"流水线 PIPE"},{"id":"f2024-03","source":"2024 期末","origin":"exam","lecture":11,"topic":"流水线寄存器插入与最大吞吐量","type":"single","difficulty":2,"stem":"现有 4 个组合逻辑单元 ①~④ 依次串接（①→②→③→④），输出接到寄存器 REG0，各单元与寄存器的延迟如下表。现在需要插入 2 个额外的流水线寄存器 REG1 和 REG2（延迟均为 20ps），则改造后流水线的最大吞吐量为______GIPS。","code":"单元/寄存器   延迟\n①            30ps\n②            40ps\n③            20ps\n④            45ps\nREG0         20ps\nREG1、REG2   各 20ps","explanation":"流水线的时钟周期由最长的一级决定，插 2 个寄存器就是把 4 个组合单元切成 3 段，应让最长段尽量短；同时每一级的延迟要包含该级末尾寄存器的 20ps 开销。逐种放法比较：切成 (①)(②③)(④) 时三级延迟为 30、40+20=60、45，加上寄存器延迟后是 50、80、65，最长 80ps；切成 (①②)(③)(④) 时是 30+40+20=90、20+20=40、45+20=65，最长 90ps；切成 (①)(②)(③④) 时是 30+20=50、40+20=60、20+45+20=85，最长 85ps。可见最优是把两个寄存器分别插在 ① 与 ② 之间、③ 与 ④ 之间，最长一级为 ②③ 两个单元加一个寄存器 = 40+20+20 = 80ps，最大吞吐量 = 1/80ps = 12.5 GIPS，选 B。A（16.7）对应 60ps，C（10）对应 100ps，D（8.33）对应 120ps，都是把寄存器插错位置或忘了把寄存器自身的 20ps 计入该级而得到的错误值。","tags":["流水线","吞吐量","流水线寄存器","关键路径"],"options":["16.7","12.5","10","8.33"],"answer":1,"kp":"流水线 PIPE"},{"id":"f2024-23","source":"2024 期末","origin":"exam","lecture":11,"topic":"PIPE 取指阶段 f_pc：分支预测失败的判定","type":"fill","difficulty":2,"stem":"在教材的 PIPE 处理器中，取指阶段的 PC 选择逻辑（HCL）如下，分支预测策略为“总是跳转”。请补全其中处理“预测失败”的那一项的条件（①）：","code":"word f_pc = [\n    M_icode == IJXX && ①____________ : M_valA;\n    W_icode == IRET : W_valM;\n    1 : F_predPC\n];","explanation":"这一行的含义是“分支预测失败”：处于访存阶段的指令是一条跳转指令（M_icode == IJXX），而它实际算出的条件 M_Cnd 为假，说明此前“总是跳转”的预测是错的，因此必须把取指地址改成顺序执行的下一条指令地址，也就是该跳转指令带来的 M_valA（对 IJXX 指令，valA 中保存的是 valP）。所以条件应填 `!M_Cnd`（等价写法 `~M_Cnd`、`M_Cnd == 0`）。常见错误：把它写成 `M_Cnd`，逻辑正好相反（变成预测正确时才跳回 M_valA）；或者把 M 阶段写成 E 阶段。还要记住两点：PIPE 中跳转指令到 M 阶段才真正决定 PC 选择，因此每次预测失败要插入 2 个气泡、付出 2 个周期的代价；写 M_valA 而不是 W_valM，是因为预测失败时跳转指令还需要 1 个周期才能把 M_valA 传到 W 阶段。","tags":["PIPE","f_pc","分支预测","M_Cnd"],"options":null,"answer":["!M_Cnd","~M_Cnd","M_Cnd == 0"],"kp":"流水线 PIPE"},{"id":"f2024-24","source":"2024 期末","origin":"exam","lecture":11,"topic":"PIPE 取指阶段 f_pc：ret 指令的返回地址来源","type":"fill","difficulty":2,"stem":"在教材的 PIPE 处理器中，取指阶段的 PC 选择逻辑（HCL）如下，分支预测策略为“总是跳转”。请补全其中处理 ret（IRET）指令的那一项（③）：","code":"word f_pc = [\n    M_icode == IJXX && !M_Cnd : M_valA;\n    W_icode == IRET : ③____________;\n    1 : F_predPC\n];","explanation":"ret 指令的返回地址存放在栈顶，只有等它在访存阶段从内存读出（得到 M_valM）、再到写回阶段时才最终确定，所以新的 PC 取写回阶段的访存结果 W_valM，这也正是教材 PIPE 中的写法（“Will get return PC when ret reaches write-back stage”）。常见错误：写 `M_valM`——ret 确实在 M 阶段读到返回地址，但取指阶段此时还拿不到经过流水线寄存器传递后的稳定值，教材实现选择在 W 阶段取值；写 `F_predPC` 或 `F_valP` 也不行，因为 PIPE 对 ret 不做预测，必须停下来等返回地址算出来（这正是 ret 会带来 3 个气泡、造成控制冒险的原因）。另外注意 HCL 中还要有 `IRET in { D_icode, E_icode, M_icode }` 之类的条件来控制流水线寄存器（D 阶段要插入气泡），只写 PC 选择逻辑是不够的。","tags":["PIPE","ret指令","W_valM","控制冒险"],"options":null,"answer":["W_valM","W_valM（ret 到达写回阶段时读出的返回地址）"],"kp":"过程调用与栈"},{"id":"f2024-25","source":"2024 期末","origin":"exam","lecture":11,"topic":"PIPE 上条件减一循环的周期数计算","type":"fill","difficulty":3,"stem":"在教材的 PIPE 处理器上加入上述 `cdeclXX` 指令（条件减一，条件码来自之前指令，条件含义同 cmovXX），分支预测策略为“总是跳转”。考虑下面的 Y86-64 代码（参数 x 放在 %rdi 中，结果通过 %rax 返回）。周期数从执行 bar 的第一条指令开始计算，直到返回指令 ret 完全通过流水线为止；在调用 bar 之前，处理器已经执行过足够多的 nop 指令。请问当参数 x=3 时，共需要执行多少个周期？（只填数字）","code":"# long bar(long x)\n# x in %rdi\nbar:\n    xorq    %rax, %rax\n    irmovq  $1, %rsi\n    rrmovq  %rsi, %r9\nLo:\n    xorq    %r9, %rsi\n    cdecle  %rdi\n    addq    %rdi, %rax\n    andq    %rdi, %rdi\n    jne     Lo\n    ret","explanation":"先看清循环行为。cdecle 是条件减一，条件码来自上一条会设置条件码的指令，即 `xorq %r9,%rsi`；进入循环时 %r9=1，%rsi 初值为 1：奇数次迭代 rsi ← 1^1 = 0，ZF=1，满足 le 条件，%rdi 减 1；偶数次迭代 rsi ← 0^1 = 1，ZF=0 且 SF=0，不满足 le，%rdi 保持不变。x=3 时 %rdi 依次为 2（第 1 次迭代）、2、1（第 3 次）、1、0（第 5 次），第 5 次迭代末尾 `andq %rdi,%rdi` 得到 0（ZF=1），`jne Lo` 不跳转，于是循环恰好执行 5 次后落到 ret。\n再数周期。周期数按“执行的指令条数 + 4（流水线充满与排空）+ 预测失败的代价”来算：bar 共有 3 条前置指令 + 5 次×(5 条循环体) + 1 条 ret = 29 条指令；“总是跳转”的预测在循环内的四次 jne 上都命中，只有最后一次 jne（实际不跳转）预测失败，PIPE 中每次预测失败插入 2 个气泡、代价 2 个周期。因此总周期数 = 29 + 4 + 2 = 35。常见错误：把预测失败代价记成 3（那是更深流水线或实验课改版的数值）；忘记把最后一次 jne 的预测失败算进去（得 33）；或不把 ret 排空（少 4 个周期）。","tags":["PIPE","周期数","分支预测","条件减一","循环展开分析"],"options":null,"answer":["35","35 个周期"],"kp":"控制流与条件码"},{"id":"lab2025-27","source":"2025 Lab 测验","origin":"exam","lecture":11,"topic":"从 SEQ 到五级流水线的演进","type":"single","difficulty":3,"stem":"在 ArchLab Part B 中，我们把架构从 SEQ 一步步改进到标准的五级流水线 pipe_std。下列说法中**错误**的一项是：","code":null,"explanation":"选 B：数据冒险是在流水线加深（相邻指令的重叠执行）过程中必然出现的**新问题**，解决手段是前递（forwarding）与暂停/插入气泡（stalling/bubble），而不是「增加寄存器」——增加流水线寄存器恰恰是把指令拆到不同阶段、使冒险产生的原因。A 正确：把一段很长的组合逻辑切成多级、在中间插入流水线寄存器，可以缩短每级的组合延迟，从而允许更高的时钟频率。C 正确：把访存从执行阶段独立出来后，ALU 运算与内存访问可以在不同阶段同时进行，提高了并行度与吞吐。D 正确：pipe_std 对条件跳转采用（总是）预测策略，预测错误时必须冲刷已取入的错误指令，这就是控制冒险的代价。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["流水线","数据冒险","分支预测"],"options":["随着架构的一步步改进，关键路径的长度逐渐变短，时钟频率可以逐渐提高","从 pipe_s2 演化到 pipe_s3a 的过程中引入了数据冒险，可通过增加寄存器解决","pipe_s4a 把架构中的执行阶段分离出来，使内存访问和 ALU 计算可以并行执行","标准的五级流水线 pipe_std 具有分支预测，可能发生分支预测错误"],"answer":1,"kp":"流水线 PIPE"},{"id":"lab2025-28","source":"2025 Lab 测验","origin":"exam","lecture":11,"topic":"ncopy 优化与加载—使用冒险的填充","type":"single","difficulty":3,"stem":"ArchLab Part C 中需要优化 ncopy.ys。下面两个代码片段分别截取自两位同学的 ncopy.ys（均运行在标准五级流水线架构上）。下列关于这两段代码性能的说法，正确的是？","code":"代码 S\nLoop:\n    mrmovq (%rdi), %r10\n    rmmovq %r10, (%rsi)\n    andq   %r10, %r10\n    jle    Skip\n    iaddq  $1, %rax\nSkip:\n    iaddq  $8, %rdi\n    iaddq  $8, %rsi\n    iaddq  $-1, %rdx\n    jg     Loop\n\n代码 T\nLoop:\n    mrmovq (%rdi), %r10\n    iaddq  $8, %rdi\n    rmmovq %r10, (%rsi)\n    iaddq  $8, %rsi\n    andq   %r10, %r10\n    jle    Skip\n    iaddq  $1, %rax\nSkip:\n    iaddq  $-1, %rdx\n    jg     Loop","explanation":"代码 S 中 `mrmovq (%rdi),%r10` 之后紧跟着就 `rmmovq %r10,(%rsi)` 与 `andq %r10,%r10`，两条指令都要用刚加载的 %r10，形成 load-use 依赖，流水线必须插入气泡（暂停），每个循环都付出额外周期。代码 T 把两条互不相关的指针自增指令 `iaddq $8,%rdi`、`iaddq $8,%rsi` 插到加载与使用之间，正好填满了本来要空转的时间槽（利用了指令级并行 ILP），于是 CPE 更低、性能更好（D 对）。A、B 的说法与流水线性能无关：缓存命中率由访存地址模式决定，指令的书写顺序不改变访问的地址序列；「iaddq 集中在一起」也不会带来流水线收益。C 错在「每条循环平均指令数变少」——两段代码的指令条数完全相同，差别只在调度顺序。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["ArchLab","load-use 冒险","指令调度","CPE"],"options":["代码 S 性能更优，因为把访问内存的指令集中在一起可以有效增加缓存命中率","代码 S 性能更优，因为把功能相似的指令（如 iaddq）集中在一起便于流水线优化","代码 T 性能更优，因为把部分公共指令提前执行，使每个循环中平均指令数量变少","代码 T 性能更优，因为把 iaddq 指令插入到了前面，避免了加载/使用（load-use）冒险的发生"],"answer":3,"kp":"流水线 PIPE"},{"id":"lab2025-29","source":"2025 Lab 测验","origin":"exam","lecture":11,"topic":"CPE 与 AC 的优化权衡","type":"single","difficulty":3,"stem":"在 ArchLab Part C 中，需要同时优化代码 ncopy.ys 和架构 ncopy.rs，评分标准基于 c = cpe + 2*ac。关于这一部分的优化策略，下列说法中正确的一项是？","code":null,"explanation":"ac（average cycles，基准周期数）与 cpe（每元素周期数）是**互相耦合**的两个指标：加深流水线能把每级的组合逻辑切得更细，从而缩短关键路径、降低 ac（提高时钟频率）；但级数变多会加大分支预测失败的惩罚、增加数据冒险的气泡数量，使 cpe 上升，所以 D 正确。A 错：cpe 强烈依赖架构设计（流水线深度、前递通路、分支预测等），不是「与架构无关」；B 错：只盯 ac 会牺牲 cpe，而评分里 cpe 权重更大，必须权衡；C 错：二者并不独立，正如 D 所描述的正是它们之间的权衡关系。优化的正确思路是：先用指令级手段（消除 load-use、循环展开、减少分支）把 cpe 压到接近 1，再在架构上适度调整 ac。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["ArchLab","CPE","AC","关键路径"],"options":["应该优先优化 cpe，因为 ac 的权重不大，且 cpe 不依赖于架构的设计","应该优先优化 ac，因为这样可以提高时钟频率，降低执行与调试的时间","cpe 和 ac 相互独立，优化 cpe 不会影响 ac，优化 ac 也不会影响 cpe","在 ncopy.rs 中添加更多的流水线阶段可以降低 ac，但可能使 cpe 增加"],"answer":3,"kp":"程序优化"},{"id":"lab2025-30","source":"2025 Lab 测验","origin":"exam","lecture":11,"topic":"在不增加 CPE 的前提下降低 AC","type":"single","difficulty":3,"stem":"某同学准备在标准五级流水线 pipe_std 的基础上进一步优化，运行 `./target/debug/ysim --arch pipe_std -I` 得到下面的信号传播层次（关键路径）信息。该同学进行下列哪一项优化，可以在降低 ac 的同时不使 cpe 显著增加？","code":"propagate order:\nlv.1: w_stall m_icode d_dstM m_dstM prog_stat mem_write d_srcB e_dstM\n      m_stall m_valE d_dstE w_dstM e_ifun e_stat e_icode d_stat f_pc aluB\n      mem_read e_valA m_dstE alufun w_bubble d_icode w_valE e_stall aluA\n      mem_data f_bubble d_srcA mem_addr d_valC d_ifun w_dstE w_valM prog_term\n      d_stall f_stall\nlv.2: imem alu dmem reg_file f_align f_icode f_ifun e_valE m_valM\n      m_stat d_rvalA d_rvalB instr_valid need_regids need_valC m_bubble\n      set_cc f_stat\nlv.3: ialign pc_inc reg_cc f_rA f_rB f_valC f_valP cc f_pred_pc\nlv.4: cond e_cnd d_bubble e_bubble e_dstE d_valA d_valB","explanation":"从传播层次看，关键路径集中在第 4 层（cond、e_cnd 等）与第 3 层的 cc、reg_cc，说明「条件码产生→分支条件计算」这条链路太长。把设置条件码从执行阶段移到访存阶段，可以利用访存阶段的时间裕量把这条链切短，从而降低 ac（时钟周期变短），而且流水线级数不变、指令条数不变，cpe 基本不受影响（D 对）。A 错：增加一条指令不会缩短已有指令的关键路径，还可能增加译码逻辑复杂度。B 错：缩短某条信号的路径属于底层逻辑重排/物理设计，不是架构层面可控的系统性手段。C 错：插入新阶段会改变流水线结构、加深流水线，从而增加冒险气泡与分支惩罚，反而可能使 cpe 上升。［同一套试卷亦收录于 2025 期末深度解析报告。］","tags":["ArchLab","关键路径","条件码","AC"],"options":["在架构中增加 iopq 指令，提高部分指令的执行效率","在架构中缩短 e_cnd、d_bubble 等信号的路径长度","在架构中于执行和访存阶段中间增加「设置条件码」阶段","在架构中将设置条件码从执行阶段改到访存阶段进行"],"answer":3,"kp":"程序优化"},{"id":"m2013-10","source":"2013 期中","origin":"exam","lecture":11,"topic":"流水线的基本性质","type":"multi","difficulty":2,"stem":"下面对流水线技术的描述，正确的是：","code":null,"explanation":"A 错：流水线提高的是吞吐率（单位时间完成的指令数），单条指令的**延迟反而变长**，因为要额外经过各级流水寄存器。B 错：加深流水线会带来更多流水寄存器开销、更大的冒险/预测错误代价，级数过深时性能反而下降，且延迟不会随级数无限降低。C 对：流水线的时钟周期由最慢的流水级决定，各段越均衡，时钟周期越短、吞吐率越高。D 对：数据冒险既可以用转发（转发不了时）也可以用暂停（插气泡）解决，load-use 冒险就是必须暂停的典型。","tags":["流水线","吞吐率","数据冒险"],"options":["流水线技术不仅能够提高指令的吞吐率，还能减少单条指令的执行时间","不断加深流水线级数，总能获得性能上的提升","流水级划分应尽量均衡，吞吐率会受到最慢的流水级影响","指令间的数据相关可能引发数据冒险，可通过数据转发或暂停流水线来解决"],"answer":[2,3],"kp":"流水线 PIPE"},{"id":"m2013-11","source":"2013 期中","origin":"exam","lecture":11,"topic":"PIPE 中的 load-use 冒险判断","type":"fill","difficulty":3,"stem":"在教材描述的流水线处理器（PIPE）上分别运行下面四段 Y86 程序（Program 1~4 依次在两条指令之间插入 0、1、2、3 条 nop）。请判断每段程序是否会因数据冒险导致流水线停顿（Stall）。按 Program 1、2、3、4 的顺序填写，选项取值为 Stall 或 No-Stall。","code":"# Program 1:\nmrmovl 8(%ebx), %edx\nrmmovl %edx, 16(%ecx)\n\n# Program 2:\nmrmovl 8(%ebx), %edx\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 3:\nmrmovl 8(%ebx), %edx\nnop\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 4:\nmrmovl 8(%ebx), %edx\nnop\nnop\nnop\nrmmovl %edx, 16(%ecx)","explanation":"mrmovl 是访存指令，其读出结果要到 M 阶段末尾才由 m_valM 提供，比 ALU 结果（E 阶段末尾的 e_valE）晚一个周期。PIPE 的 load-use 冒险条件是「E 阶段的指令为 mrmovl（或 popl）且其目的寄存器 d_srcA/d_srcB 正好是紧邻下一条指令要读的寄存器」。Program 1 中 rmmovl 紧跟 mrmovl，且 %edx 就是它的源寄存器 → 必须停一拍（Stall），等数据在 M 阶段就绪后再转发。Program 2 插入 1 条 nop 后，rmmovl 在译码阶段时 mrmovl 正好在 M 阶段，数据直接由 m_valM 转发即可，无需停顿；Program 3、4 间隔更长，同样不停顿。故答案依次为 Stall、No-Stall、No-Stall、No-Stall。踩坑点：只有「访存结果被紧邻指令使用」才需要停顿，ALU 结果被紧邻指令使用只需转发。","tags":["PIPE","load-use 冒险","Stall"],"options":null,"answer":["Stall, No-Stall, No-Stall, No-Stall","A,B,B,B","Stall No-Stall No-Stall No-Stall","Stall/No-Stall/No-Stall/No-Stall"],"kp":"流水线 PIPE"},{"id":"m2013-12","source":"2013 期中","origin":"exam","lecture":11,"topic":"PIPE 中是否发生数据转发","type":"fill","difficulty":3,"stem":"接上题的四段 Y86 程序（Program 1~4 依次插入 0、1、2、3 条 nop）。请判断流水线处理器内是否会产生数据转发（Forwarding），按 Program 1、2、3、4 的顺序填写，取值 Forwarding 或 No-Forwarding。","code":"# Program 1:\nmrmovl 8(%ebx), %edx\nrmmovl %edx, 16(%ecx)\n\n# Program 2:\nmrmovl 8(%ebx), %edx\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 3:\nmrmovl 8(%ebx), %edx\nnop\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 4:\nmrmovl 8(%ebx), %edx\nnop\nnop\nnop\nrmmovl %edx, 16(%ecx)","explanation":"Program 1 中 mrmovl 在 M 阶段末尾得到结果，停顿一拍后由 m_valM 转发给 rmmovl 的译码阶段（写入 d_valA），属于转发 + 暂停。Program 2 插入 1 条 nop：rmmovl 译码时 mrmovl 恰在 M 阶段，m_valM 同样直接送到译码阶段的源寄存器端口，需要转发但不需要停顿。Program 3 插入 2 条 nop：rmmovl 译码时 mrmovl 已到 W 阶段，由 W_valM 转发；仍属于转发。Program 4 插入 3 条 nop：rmmovl 译码时 mrmovl 已经写回寄存器文件并退出流水线，直接从寄存器文件读出即可，**不发生**转发。故依次为 Forwarding、Forwarding、Forwarding、No-Forwarding。踩坑点：只要源值能在 E 阶段（或译码阶段）之前由更晚的流水级提供，就构成转发；间隔足够远时值已在寄存器文件中，无需转发。","tags":["PIPE","转发","流水线寄存器"],"options":null,"answer":["Forwarding, Forwarding, Forwarding, No-Forwarding","A,A,A,B","Forwarding Forwarding Forwarding No-Forwarding"],"kp":"流水线 PIPE"},{"id":"m2013-13","source":"2013 期中","origin":"exam","lecture":11,"topic":"转发数据来源信号的选择","type":"fill","difficulty":3,"stem":"接上题的四段 Y86 程序（Program 1~4 依次插入 0、1、2、3 条 nop）。请指出流水线中用于转发的数据来源信号，若不进行转发则填 none。可选信号为 m_valM、W_valM、none，请按 Program 1、2、3、4 的顺序填写。","code":"# Program 1:\nmrmovl 8(%ebx), %edx\nrmmovl %edx, 16(%ecx)\n\n# Program 2:\nmrmovl 8(%ebx), %edx\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 3:\nmrmovl 8(%ebx), %edx\nnop\nnop\nrmmovl %edx, 16(%ecx)\n\n# Program 4:\nmrmovl 8(%ebx), %edx\nnop\nnop\nnop\nrmmovl %edx, 16(%ecx)","explanation":"访存指令的结果只在 M 阶段末尾由 m_valM 给出（E 阶段没有 ALU 结果可用）。Program 1 停一拍后，rmmovl 在译码阶段读源时 mrmovl 仍在 M 阶段，转发源是 m_valM。Program 2 不停顿，rmmovl 译码时 mrmovl 也恰在 M 阶段，转发源同样是 m_valM。Program 3 多插一条 nop，rmmovl 译码时 mrmovl 已进入 W 阶段，只能取 W_valM。Program 4 间隔 3 条 nop，值已写回寄存器文件，不需要转发，填 none。故依次为 m_valM、m_valM、W_valM、none。踩坑点：PIPE 的转发优先级是 e_valE > M_valE > m_valM > W_valE > W_valM（越靠近的流水级优先），而 load 的结果不存在于 e_valE 中，只能来自 m_valM 或 W_valM。","tags":["PIPE","转发优先级","load-use"],"options":null,"answer":["m_valM, m_valM, W_valM, none","A,A,B,C","m_valM m_valM W_valM none"],"kp":"流水线 PIPE"},{"id":"m2014-09","source":"2014 期中","origin":"exam","lecture":11,"topic":"流水线执行时间的计算","type":"single","difficulty":2,"stem":"若处理器实现了三级流水线，每一级流水线实际需要的运行时间分别为 2ns、2ns 和 1ns，则此处理器不停顿地执行完毕 10 条指令需要的时间为：","code":null,"explanation":"同步流水线中所有流水级由同一时钟驱动，时钟周期必须取最长的那一级，即 2ns。10 条指令的总时间 = (流水级数 + 指令数 - 1) × 时钟周期 = (3 + 10 - 1) × 2ns = 24ns，故选 D。如果把第三级按 1ns 单独计算（先 2+2+1 完成第一条，之后每 2ns 完成一条），会算出 5 + 9×2 = 23ns，这是忽略了「流水寄存器统一时钟」的异步假设。选项 21、22 对应其他算术错误（如 (2+2+1)×... 或漏算填充时间）。踩坑点：吞吐由最慢一级决定，不能按各级延迟之和直接累加。","tags":["流水线","时钟周期","吞吐率"],"options":["21ns","22ns","23ns","24ns"],"answer":3,"kp":"流水线 PIPE"},{"id":"m2014-11","source":"2014 期中","origin":"exam","lecture":11,"topic":"流水线与数据冒险的解决方式","type":"single","difficulty":2,"stem":"关于流水线技术的描述，正确的是：","code":null,"explanation":"A 对：遇到数据冒险时最保守的做法就是插入气泡（暂停）等待结果就绪，它总能保证结果正确，代价只是损失几个周期（有转发时暂停次数更少）。B 错：流水线提高吞吐率，但单条指令的延迟反而增加（要额外经过流水寄存器）。C 错：级数增加会引入更多流水寄存器延迟与冒险/预测失败代价，超过某个点后性能下降。D 错：流水级不均衡影响的是时钟周期与吞吐率，与控制冒险（分支预测失误）没有直接关系。踩坑点：区分「延迟」「吞吐」「冒险代价」三个概念。","tags":["流水线","数据冒险","吞吐率"],"options":["指令间数据相关引发的数据冒险，一定可以通过暂停流水线来解决","流水线技术不仅能够提高执行指令的吞吐率，还能减少单条指令的执行时间","增加流水线的级数，一定能获得性能上的提升","流水级划分应尽量均衡，不均衡的流水线会增加控制冒险"],"answer":0,"kp":"流水线 PIPE"},{"id":"m2015-10","source":"2015 期中","origin":"exam","lecture":11,"topic":"流水线的数据冒险与代价","type":"single","difficulty":2,"stem":"关于流水线技术的描述，**错误**的是：","code":null,"explanation":"C 错误：转发只能解决「结果已在流水线寄存器中产生、但还没写回寄存器文件」的相关，load-use 冒险中数据要到 M 阶段末尾才由 m_valM 得到，紧跟其后的指令在 E 阶段就需要该值，必须先暂停一拍再转发，所以「都可以通过转发解决」不成立。A 正确：流水化提高吞吐率的同时，单条指令要多经过若干流水寄存器，延迟变长。B 正确：级数减少意味着相关指令之间隔的流水级更少、更容易靠转发解决，需要暂停的情形减少。D 正确：一个时钟周期取多条指令、发射多条指令会扩大预测失败时需要冲刷的范围，控制冒险的代价上升。","tags":["流水线","load-use 冒险","控制冒险"],"options":["流水线技术能够提高执行指令的吞吐率，但也同时增加单条指令的执行时间","减少流水线的级数，能够减少数据冒险发生的几率","指令间数据相关引发的数据冒险，都可以通过 data forwarding 来解决","现代处理器支持一个时钟内取指、执行多条指令，会增加控制冒险的开销"],"answer":2,"kp":"流水线 PIPE"},{"id":"m2016-09","source":"2016 期中","origin":"exam","lecture":11,"topic":"流水线的吞吐率与流水级划分","type":"single","difficulty":2,"stem":"下面对流水线技术的描述，正确的是：","code":null,"explanation":"C 正确：流水线的时钟周期由最慢的一级决定，各级延迟越均衡吞吐率越高，这正是划分流水级的基本原则。A 错：流水线提高的是吞吐率（单位时间完成的指令数），由于级间增加了流水线寄存器，单条指令从进入流水线到执行完的**延迟**反而变大。B 错：级数加深会带来寄存器延迟、冒险增多、冲刷代价上升、时钟偏斜等问题，存在最优深度，并不总能提升性能。D 错：指令调度只能消除部分数据相关；遇到 load-use 相关而找不到可插入的独立指令时，仍必须暂停（靠前递加停顿解决），「总是可以通过调度解决」不成立。","tags":["流水线","吞吐率","流水级划分"],"options":["流水线技术不仅能够提高执行指令的吞吐率，还能减少单条指令的执行时间。","不断加深流水线级数，总能获得性能上的提升。","流水级划分应尽量均衡，吞吐率会受到最慢的流水级影响。","指令间的数据相关可能会引发流水线停顿，但总是可以通过调度指令来解决。"],"answer":2,"kp":"流水线 PIPE"},{"id":"m2016-10","source":"2016 期中","origin":"exam","lecture":11,"topic":"转移预测错误的检测与恢复","type":"single","difficulty":3,"stem":"某流水线数据通路采用「总是预测跳转」的转移预测策略。若预测错误，需要恢复流水线并从正确的目标地址开始取指。其中用来判断转移预测是否正确的两个信号是 ①、②，用来获得正确目标地址的信号是 ③。下列正确的是：","code":null,"explanation":"在教材的 PIPE 中，分支指令要到 **E 阶段**才知道条件是否成立（e_Cnd），到 **M 阶段**才真正算出跳转与否的结果 M_Bch，因此「预测错误」的条件由 M 阶段的 icode 与 M_Bch 共同判断（还要配合 E 阶段的 e_Cnd），① ② 应取 M_icode 与 M_Bch。恢复流水线需要的是**跳转目标地址**，它来自分支指令的 valC 并随 valA 一路传到 M 阶段，即 M_valA，故 ③ = M_valA，选 A。C、D 用 W 阶段信号会晚一拍、多冲刷一级；B、D 用 W_valM 取到的是访存读出的数据而不是跳转目标地址。踩坑点：区分「是否跳转的判定」与「跳转目标的取值」分别位于哪个阶段、哪个信号。","tags":["流水线控制","转移预测","misprediction"],"options":["① M_icode ② M_Bch ③ M_valA","① W_icode ② M_Bch ③ M_valA","① W_icode ② M_Bch ③ W_valM","① M_icode ② M_Bch ③ W_valM"],"answer":0,"kp":"SEQ 顺序实现"},{"id":"m2016-11","source":"2016 期中","origin":"exam","lecture":11,"topic":"流水线执行时间计算","type":"single","difficulty":2,"stem":"若处理器实现了三级流水线，每一级实际需要的运行时间分别为 1ns、2ns 和 3ns，则此处理器不停顿地执行完毕 10 条指令需要的时间为：","code":null,"explanation":"流水线的时钟周期必须取最慢的一级，即 3ns（否则慢的那一级来不及完成）。k 级流水线执行 n 条指令所需的时钟周期数为 k + (n-1) = 3 + 9 = 12，故总时间 = 12 × 3ns = 36ns，选 D。常见错误：把各级延迟当作可变（如按平均 2ns）会得到 24ns 之类的结果；12ns 是把 12 个周期误当成 12ns（忘了乘周期）；21ns 来自错误的周期取值。正确套路只有两步：周期 = max(各级延迟)，时钟数 = 级数 + 指令数 - 1。","tags":["流水线","时钟周期","执行时间计算"],"options":["21 ns","12 ns","24 ns","36 ns"],"answer":3,"kp":"流水线 PIPE"},{"id":"m2017-11","source":"2017 期中","origin":"exam","lecture":11,"topic":"流水线的延迟、深度与数据冒险","type":"single","difficulty":2,"stem":"关于流水线技术的描述，**错误**的是：","code":null,"explanation":"A 正确：流水线提高的是吞吐率，由于每级之间插入了流水线寄存器，单条指令从进入流水线到执行完的**延迟**反而变长。B 正确：级数加深会带来寄存器延迟、冒险与冲刷开销、时钟偏斜等问题，存在最优深度。D 正确：时钟周期由最慢一级决定，划分均衡才能提高吞吐率。C 错误：数据冒险（包括 load-use 冒险）**总能**靠前递加暂停来解决，区别只是性能代价；不存在「暂停也解决不了」的数据相关。踩坑点：C 把「解决起来代价大」偷换成了「不能解决」。","tags":["流水线","数据冒险","stall 与转发"],"options":["流水线技术能够提高执行指令的吞吐率，但也同时增加单条指令的执行时间","增加流水线级数，不一定能获得总体性能的提升","指令间数据相关引发的数据冒险，不一定可以通过暂停流水线来解决","流水级划分应尽量均衡，吞吐率会受到最慢的流水级影响，均衡的流水线能提高吞吐量"],"answer":2,"kp":"流水线 PIPE"},{"id":"m2019-11","source":"2019 期中","origin":"exam","lecture":11,"topic":"E_valA 前递分支的优先级顺序","type":"single","difficulty":3,"stem":"在 PIPE 的 Sel+FwdA 部件中，产生 E_valA 的 HCL 描述包含下列五个前递分支，它们按优先级从高到低书写（越靠前的分支在多个条件同时成立时越先被选中）。正确的顺序是：","code":"○1  d_srcA == e_dstE : e_valE\n○2  d_srcA == M_dstE : M_valE\n○3  d_srcA == M_dstM : m_valM\n○4  d_srcA == W_dstE : W_valE\n○5  d_srcA == W_dstM : W_valM","explanation":"HCL 的 case 表达式自上而下匹配，所以要把**最新的生产者排在前面**：同一周期里，E 阶段刚算出的结果（e_dstE → e_valE）比 M 阶段的新，M 阶段又比 W 阶段新；同一阶段中，来自内存的读结果（M_dstM → m_valM）要排在 ALU 结果（M_dstE → M_valE）之前，因为两条指令可能同时具备这两个目标寄存器，而真正需要前递的是访存结果。于是顺序为 e_dstE(○1) → M_dstM(○3) → M_dstE(○2) → W_dstM(○5) → W_dstE(○4)，即 ○1 ○3 ○2 ○5 ○4，选 B（官方答案亦为 B）。踩坑点：如果先匹配 W 阶段，就会把已经过期的旧值当作最新值前递出去，结果出错——这与寄存器堆写回时「W 阶段优先级最低」是同一个道理。","tags":["数据前递","HCL 优先级","PIPE"],"options":["○1 ○2 ○3 ○4 ○5","○1 ○3 ○2 ○5 ○4","○4 ○5 ○2 ○3 ○1","○5 ○4 ○3 ○2 ○1"],"answer":1,"kp":"流水线 PIPE"},{"id":"m2019-16","source":"2019 期中","origin":"exam","lecture":11,"topic":"load-use 冒险的检测电路","type":"fill","difficulty":3,"stem":"在 PIPE 处理器上运行以下 Y86-64 代码片段时，行 1 `mrmovq (%rdi), %r10` 与行 2 `rmmovq %r10, (%rsi)` 之间存在数据相关，它无法靠前递解决，需要增加冒险检测电路。请补全该电路的 HCL 描述（填出 `in` 后面花括号中的两个集合以及 `&&` 之前的 `E_icode in {...}` 条件）：","code":"Loop: mrmovq (%rdi), %r10   # line 1\n      rmmovq %r10, (%rsi)   # line 2\n      ...\n\nE_icode in { ______ } && ______ in { ______ }","explanation":"load-use 冒险的检测条件是：**E 阶段**的指令要从内存取数据（mrmovq 或 popq），并且它的目的寄存器 E_dstM 正好是 **D 阶段**指令要读的源寄存器（d_srcA 或 d_srcB）。因此完整写法是 `E_icode in {IMRMOVQ, IPOPQ} && E_dstM in {d_srcA, d_srcB}`（这是教材原文，官方答案一致）。检测到之后要停顿一个周期：让 F、D 保持不变（stall），同时向 E 插入气泡（bubble），等访存结果出来后由 M→E 的前递通路送过去。踩坑点：①只能检测目的来自**内存**的 E_dstM，ALU 结果（E_dstE）可以前递，不需要停顿；②IPOPQ 必须包含在内，因为 popq 的返回值同样来自内存。","tags":["load-use 冒险","冒险检测","HCL"],"options":null,"answer":["E_icode in {IMRMOVQ, IPOPQ} && E_dstM in {d_srcA, d_srcB}","{IMRMOVQ, IPOPQ} && E_dstM in {d_srcA, d_srcB}","IMRMOVQ,IPOPQ; E_dstM; d_srcA,d_srcB"],"kp":"流水线 PIPE"},{"id":"m2020-07","source":"2020 期中","origin":"exam","lecture":11,"topic":"分支预测、流水级划分与 CPI","type":"single","difficulty":3,"stem":"下列说法正确的是：","code":null,"explanation":"C 正确：普通（单发射）流水线每个周期最多启动一条指令，必然有 CPI ≥ 1，只有当处理器是超标量、多发射或超流水结构时 CPI 才可能小于 1，所以 CPI < 1 说明它一定不是普通流水线。A 错：SEQ 是单周期处理器，每条指令只执行一遍，根本不存在分支预测的问题，谈不上哪种预测策略更好。B 错：流水级划分不均衡会因最慢的一级拖慢时钟周期而降低吞吐量（并可能增加流水线寄存器的开销），但与“控制冒险”无关。D 错：rrmovq %rax,%rax 虽不修改标志位，但它仍然读、写寄存器，会引入数据相关（需要前递或停顿），因此不能替代真正无副作用的 nop。踩坑点：CPI < 1 是超标量处理器的标志，这一结论要记牢。","tags":["分支预测","流水线","CPI"],"options":["在 SEQ 机器中，我们采用预测跳转总是选择（always taken）的策略比从不选择（never taken）的策略要略好。","流水级划分应尽量均衡，不均衡的流水线会增加控制冒险。","如果一台机器的 CPI 小于 1，则它必然不是普通流水线结构。","由于 rrmovq %rax, %rax 不影响标记位，所以可使用其代替 nop 指令。"],"answer":2,"kp":"流水线 PIPE"},{"id":"m2021-08","source":"2021 期中","origin":"exam","lecture":11,"topic":"PIPE 中数据前递次数的统计","type":"single","difficulty":3,"stem":"在课本 Y86-64 的 PIPE 上执行以下的代码片段，一共使用到了多少次数据转发？假设在该段代码执行前和执行后 PIPE 都执行了足够多的 nop 指令。","code":"mrmovq 0(%rdx), %rax\naddq %rbx, %rax\nmrmovq 8(%rdx), %rcx\naddq %rcx, %rax\nirmovq $10, %rcx\naddq %rcx, %rax\nrmmovq %rax, 16(%rdx)","explanation":"逐条数：第 2 行 addq %rbx,%rax 要用第 1 行 mrmovq 的结果，而内存数据要到访存级才拿到，需停顿 1 个周期后经 m_valM 前递（1 次）；第 4 行 addq %rcx,%rax 要用第 3 行 mrmovq 8(%rdx),%rcx 的结果，同理停顿后前递（2 次）；第 4 行还要用第 2 行 addq 算出的 %rax，可用 M/E 级前递（3 次）；第 6 行 addq %rcx,%rax 要用第 5 行 irmovq $10,%rcx 的结果（4 次），还要用第 4 行 addq 算出的 %rax（5 次）；第 7 行 rmmovq %rax,16(%rdx) 要用第 6 行 addq 的 %rax（6 次）。共 6 次，选 D。踩坑点：Load/Use 冒险要先停顿再通过 m_valM 前递，停顿并不免除这次前递；两条指令之间的 addq 值通常可由 M 级前递提供。","tags":["PIPE","数据前递","Load/Use 冒险"],"options":["3","4","5","6"],"answer":3,"kp":"流水线 PIPE"},{"id":"m2022-11","source":"2022 期中","origin":"exam","lecture":11,"topic":"流水线吞吐量计算","type":"single","difficulty":2,"stem":"将一个延迟为 300ps 的组合逻辑划分为三级流水线，时钟寄存器的延迟为 20ps，则该流水线的吞吐量为：","code":null,"explanation":"划分成三级后每级的组合逻辑延迟为 300ps / 3 = 100ps，还要加上时钟寄存器的延迟 20ps，所以一个时钟周期是 120ps。吞吐量 = 1 / (120×10^-12 s) ≈ 8.33×10^9 次/秒 = 8.33 GIPS，选 B。A 是漏掉寄存器延迟（1/100ps = 10 GIPS）的典型错误；C、D 来自把 300ps 整体当成一个周期或错误地除以级数。踩坑点：流水周期的开销必须包含寄存器延迟，延迟界限与吞吐量界限的区分也常在此处出现。","tags":["流水线","吞吐量","寄存器延迟"],"options":["10GIPS","8.33GIPS","3.33GIPS","2.77GIPS"],"answer":1,"kp":"流水线 PIPE"},{"id":"m2024-09","source":"2024 期中","origin":"exam","lecture":11,"topic":"Y86-64 PIPE 数据前递次数统计","type":"single","difficulty":3,"stem":"在课本中 Y86-64 的 PIPE 处理器设计上执行如下代码片段，只考虑 d_valA 和 d_valB，假设在该段代码执行前和执行后 PIPE 处理器都执行了足够多的 nop 指令。请问一共使用到了多少次数据转发/前递（forwarding）：","code":"Test:\n    xorq %rax, %rax\n    irmovq 16, %rbx\n    subq %rax, %rbx\n    jl .L2\n    addq %rax, %rax\n    jmp .L3\n.L2:\n    addq %rbx, %rbx\n    addq %rbx, %rax\n    addq %rbx, %rcx\n.L3:\n    ret","explanation":"按行号数（把 Test: 记为第 1 行）：第 4 行 subq %rax,%rbx 在译码阶段同时需要第 2 行 xorq 写出的 %rax 与第 3 行 irmovq 写出的 %rbx，它们分别处在访存级和执行级，需要 2 次前递；第 5 行 jl 被预测为跳转，于是跳转目标第 9 行 addq %rbx,%rbx 被投机取出，它在译码阶段要使用第 4 行 subq 的结果（此时第 4 行在访存级），需要 1 次前递；第 10 行虽然也读 %rbx，但第 4 行已经进入写回级，且它随后会因分支预测错误被清除，不计入。合计 3 次，选 B。常见错误：完全不考虑分支预测会数成 2 次；把预测当作 not taken 也会得到 2 次；把 jl 误当成 jg 则会数成 5 次。","tags":["Y86-64","PIPE","数据前递"],"options":["2","3","4","5"],"answer":1,"kp":"流水线 PIPE"},{"id":"m2024-25","source":"2024 期中","origin":"exam","lecture":11,"topic":"PIPE 中 d_valA 的前递来源","type":"fill","difficulty":3,"stem":"在教材 Y86-64 PIPE 的 `d_valA` 选择逻辑中，当 `d_srcA == M_dstM` 时应当选择哪一个信号的值？","code":null,"explanation":"教材给出的 d_valA HCL 按优先级依次判断：D_icode 为 ICALL/IJXX 时用 D_valP；d_srcA == e_dstE 时用 e_valE；d_srcA == M_dstM 时用 m_valM（访存级刚从内存读出的数据）；d_srcA == M_dstE 时用 M_valE；d_srcA == W_dstM 时用 W_valM；d_srcA == W_dstE 时用 W_valE；都不满足则用寄存器堆读出的 d_rvalA。因此 M_dstM 对应 m_valM，它处理的正是“前一条指令是 mrmovq/popq，本条指令立刻要用该寄存器”的数据冒险。踩坑点：写成 M_valE（那是算出来的地址，不是内存中的数据）或漏掉这条前递通路。","tags":["PIPE","数据前递","HCL"],"options":null,"answer":["m_valM","M_valM"],"kp":"流水线 PIPE"},{"id":"m2024-26","source":"2024 期中","origin":"exam","lecture":11,"topic":"Load/Use 冒险的停顿周期数","type":"fill","difficulty":3,"stem":"在教材 Y86-64 的 PIPE 中依次执行 `mrmovq 0(%rcx),%rdx` 与 `pushq %rdx`，这会造成 Load/Use 数据冒险。按照教材原有的前递通路，为保证程序正确，流水线需要在两条指令之间插入几个气泡（即停顿几个周期）？","code":null,"explanation":"mrmovq 的数据要等到它进入访存（M）阶段才能由 m_valM 取回，而 pushq 在译码（D）阶段就要读出 %rdx 作为 valA（它在访存级把 valA 写进内存）。D 阶段早于 M 阶段，仅靠 e_valE / M_valE 这些前递无法及时提供数据，流水线只能暂停：把 D 阶段保持为 stall、并在 E 阶段插入一个气泡，让 mrmovq 前进到 M 阶段后 pushq 才译码，恰好停顿 1 个周期。教材随后增加了一条从 M 阶段前递到 E 阶段、用于选择 e_valA 的通路，才使这类指令对无需气泡。","tags":["PIPE","Load/Use 冒险","气泡"],"options":null,"answer":["1"],"kp":"流水线 PIPE"},{"id":"s2025b-10","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"流水线细分：延迟与吞吐的权衡","type":"single","difficulty":3,"stem":"某三级流水线结构，单条指令的延迟（从取指到写回的总时间）是 340 ps，流水线满负荷运转时每 180 ps 完成一条指令。如果能理想化地进一步细分流水级（不跨现有流水级重排电路、也不过度细分），恰好划分成均衡流水线，那么新的单条指令延迟与吞吐（每多少 ps 完成一条指令）分别是？","code":null,"explanation":"两个结论要分开理解。吞吐：原来每 180 ps 出结果，说明瓶颈流水级的延迟是 180 ps；把它均匀细分成 3 个 60 ps 的小级后，时钟周期降到 60 ps，于是每 60 ps 就能完成一条指令（吞吐提高 3 倍）。延迟：细分流水级必须在每两级之间插入新的流水线寄存器，寄存器本身有建立/传输时间开销，而且原来被合并在一起的组合逻辑被拆开后总延迟不再变小，因此单条指令的总延迟从 340 ps 上升到 420 ps。这正是流水线的核心权衡：吞吐提高的代价是单条指令延迟变长（也意味着分支预测失败的惩罚更大）。","tags":["流水线","吞吐量","延迟","流水线寄存器"],"options":["420 ps 与 60 ps","340 ps 与 60 ps","420 ps 与 180 ps","540 ps 与 60 ps"],"answer":0,"kp":"流水线 PIPE"},{"id":"s2025b-11","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"PIPE 中的数据冒险检测点","type":"single","difficulty":3,"stem":"阅读下面的 Y86-64 汇编代码。当它运行在 PIPE 处理器上时，`addq` 指令处于哪个流水级时才会检测到数据冒险？","code":"1  irmovq $1, %rax\n2  irmovq $2, %rax\n3  irmovq $3, %rdx\n4  addq   %rax, %rdx","explanation":"PIPE 的冒险检测逻辑放在译码阶段：指令在 D 级取出源寄存器编号后，与 E 级、M 级、W 级正在处理的指令的目的寄存器比较，发现冲突就产生前递控制信号或插入气泡。本题中 irmovq 每条占 10 字节，所以第 4 条 addq 在 D 级时，第 2 条 `irmovq $2,%rax` 恰好处于 M 级、第 3 条 irmovq 在 E 级、第 1 条 irmovq 在 W 级；addq 要读 %rax，正是由处在 M 级的第 2 条指令提供的。因此「在 D 级检测到冒险」是标准答案，而不是 F/E/M。","tags":["PIPE","数据冒险","译码阶段"],"options":["D（Decode，译码）","F（Fetch，取指）","E（Execute，执行）","M（Memory，访存）"],"answer":0,"kp":"流水线 PIPE"},{"id":"s2025b-12","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"PIPE 数据前递的来源与内容","type":"fill","difficulty":3,"stem":"承接上一题的 Y86-64 代码。addq 在译码阶段检测到数据冒险后运用了数据前递技术，其中处在 M 级的那条指令前递的数值是多少（作为操作数 %rax 的值）？请填十进制数字。","code":"1  irmovq $1, %rax\n2  irmovq $2, %rax\n3  irmovq $3, %rdx\n4  addq   %rax, %rdx","explanation":"当 addq 在 D 级时，流水线中各指令的位置是：第 1 条 irmovq 在 W（写回）级、第 2 条 irmovq 在 M（访存）级、第 3 条 irmovq 在 E（执行）级、addq 在 D 级。addq 需要 %rax，而最后一条写 %rax 的指令是第 2 条 `irmovq $2,%rax`，它当前位于 M 级，于是前递通路把它的 valE（即 2）送给 addq。注意这里体现了一个重要规则：离得最近的、位于 M 级的写者优先于 W 级的旧写者（第 1 条的 1 已被覆盖），所以一定要认准「最新一次写」而不是「最近一级的指令」。","tags":["PIPE","数据前递","冒险优先级"],"options":null,"answer":["2","0x2"],"kp":"流水线 PIPE"},{"id":"s2025b-13","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"load-use 相关的识别","type":"single","difficulty":2,"stem":"下列哪段 Y86-64 汇编代码存在 load-use（加载—使用）相关？","code":null,"explanation":"load-use 相关的定义是：前一条指令从内存加载数据到某寄存器（mrmovq / popq 等），紧接着的下一条指令就要读这个寄存器作为源操作数。选项 A 中 `mrmovq 0(%rdx),%rax` 把内存数据装入 %rax，下一条 `addq %rbx,%rax` 立刻使用它，正是 load-use 相关。选项 B 只是 irmovq 之间的写后写，不涉及内存加载；选项 C 是先写内存再读不同寄存器，没有相关；选项 D 是运算指令之间的写后读，可以用普通前递解决。","tags":["load-use 相关","PIPE","冒险"],"options":["mrmovq 0(%rdx), %rax\naddq   %rbx, %rax","irmovq $1, %rax\nirmovq $2, %rdx\naddq   %rax, %rdx","rmmovq %rax, 0(%rdx)\nmrmovq 0(%rdx), %rbx","addq   %rax, %rbx\nsubq   %rbx, %rcx"],"answer":0,"kp":"机器级编程基础"},{"id":"s2025b-14","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"load-use 相关为何不能只靠前递解决","type":"single","difficulty":3,"stem":"对于 `mrmovq 0(%rdx),%rax` 后紧跟 `addq %rbx,%rax` 这段代码，能否只用数据前递技术解决 load-use 相关？为什么？","code":null,"explanation":"普通的数据冒险之所以能靠前递消除停顿，是因为 ALU 结果在 E 级末就已算好，可以送给下一周期进入 E 级的指令。但 load 的结果要到 M 级末才从内存取出：当 addq 在 D 级需要 %rax 时，mrmovq 才刚进入 E 级，数据还不存在。PIPE 的做法是由冒险检测逻辑把 addq 暂停一个周期（插入一个气泡），让它推迟到 mrmovq 进入 M 级的下一周期再去 E 级，此时数据已经可以由 M 级前递过来。所以 load-use 至少需要 1 个气泡周期，这也是「加载—使用」特有的代价。注意有些教材把「前递 + 一个气泡」整体称为该相关的解决方案，因此若回答「前递可以部分解决」也有一定道理。","tags":["load-use 相关","前递","气泡"],"options":["不能。addq 在译码阶段就要使用 %rax，而 mrmovq 此时还在执行阶段，要再过一个周期才能在访存阶段取到数据，因此必须插入一个气泡","能。前递可以从 M 级直接送到 E 级，不需要任何停顿","能。PIPE 会自动调整这两条指令的执行顺序","不能。因为 load-use 相关会改变程序的语义，只能靠重写代码解决"],"answer":0,"kp":"流水线 PIPE"},{"id":"s2025b-15","source":"2025 第 2 次阶段测验","origin":"exam","lecture":11,"topic":"load-use 与 ret 的组合冒险","type":"single","difficulty":3,"stem":"下列哪段 Y86-64 汇编代码同时存在 load-use 相关与 ret 相关的组合冒险？","code":null,"explanation":"ret 指令有一个特殊性质：它必须等到访存阶段从栈顶读出返回地址，才知道下一条指令要从哪里取，因此任何在 ret 之前刚刚改写 %rsp 的指令都会让 ret 无法及时取指。选项 A 中 `mrmovq 0(%rdx),%rsp` 把内存数据装入栈指针，下一条就是 ret：既要等 load 的结果（load-use），又让 ret 的取指地址依赖这个尚未就绪的值，构成组合冒险，PIPE 对这种情况必须插入气泡并暂停取指。选项 B 装入的是 %rax 而不是 %rsp，ret 不受影响；选项 C 用 irmovq 写 %rsp，结果在 E 级就可用，PIPE 可通过前递/暂停简单处理，不是 load-use；选项 D 是普通的 load-use，与 ret 无关。","tags":["ret 冒险","load-use 相关","PIPE"],"options":["mrmovq 0(%rdx), %rsp\nret","mrmovq 0(%rdx), %rax\nret","irmovq $1, %rsp\nret","mrmovq 0(%rdx), %rax\nrmmovq %rax, 0(%rbx)"],"answer":0,"kp":"流水线 PIPE"},{"id":"gen-c11-01","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"流水线吞吐率与延迟","type":"single","difficulty":1,"stem":"某组合逻辑电路的总延迟为 300 ps，输出还要花 20 ps 存入寄存器。若把它等分成 3 级、级间插入流水线寄存器（每级组合逻辑 100 ps + 寄存器开销 20 ps），则流水线版本的时钟周期、单条操作总延迟（latency）和吞吐率分别是：","code":null,"explanation":"讲义第 11 讲开头的算例：非流水线版本的时钟周期是 300 + 20 = 320 ps，吞吐率 1/320 ps ≈ 3.12 GIPS；3 级流水线每级的时钟周期是 100 + 20 = 120 ps，吞吐率 1/120 ps ≈ 8.33 GIPS（每 120 ps 就能启动一条新操作）。但同一条操作要从第一级走到第三级、跨 3 个周期，因此延迟是 3 × 120 = 360 ps，反而比非流水线的 320 ps 更长——这就是流水线「提高吞吐率、增加延迟」的经典结论。选项 A 忽略了每级都要付出的寄存器开销；选项 B 是非流水线版本的数字；选项 D 把吞吐率与延迟写反了。","tags":["流水线","吞吐率","延迟"],"options":["100 ps、300 ps、10 GIPS","320 ps、320 ps、约 3.12 GIPS","120 ps、360 ps、约 8.33 GIPS","360 ps、120 ps、约 2.78 GIPS"],"answer":2,"kp":"流水线 PIPE"},{"id":"gen-c11-02","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"转发优先级","type":"single","difficulty":3,"stem":"下面四条指令依次执行，前三条 irmovq 都写 %rax。当最后一条 `rrmovq %rax, %rdx` 处于 Decode 阶段时，E、M、W 三个流水线寄存器里都能匹配到 %rax。按照 PIPE 的转发优先级，%rdx 最终得到：","code":"0x000:  irmovq $1, %rax\n0x00a:  irmovq $2, %rax\n0x014:  irmovq $3, %rax\n0x01e:  rrmovq %rax, %rdx","explanation":"讲义第 11 讲「Forwarding Priority」指出：当多个流水线阶段都匹配同一个源寄存器时，必须选取来自最早阶段（离 Decode 最近）的值，才能与串行执行语义一致，否则会把过时的值抢先转发。HCL 的顺序也体现了这一点：`d_srcA == e_dstE : e_valE;` 排在 `M_dstM / M_dstE / W_dstM / W_dstE` 之前。第四条指令在 Decode 阶段时，E 阶段是 `irmovq $3,%rax`（e_valE = 3）、M 阶段是第二条（2）、W 阶段是第一条（1），所以取 E 阶段的 3，%rdx ← 3，正好等于顺序执行时 %rax 的最终值。若优先级取反（例如让 W 优先），结果会变成 1，与串行语义不符。","tags":["转发","优先级","数据冒险"],"options":["0（寄存器文件中读到的旧值）","1（从写回阶段 W 转发）","2（从访存阶段 M 转发）","3（从执行阶段 E 转发）"],"answer":3,"kp":"流水线 PIPE"},{"id":"gen-c11-03","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"load/use 冒险的识别","type":"single","difficulty":2,"stem":"下列相邻的两条指令中，必须让流水线停顿一个周期（load/use 冒险）的是：","code":null,"explanation":"讲义第 11 讲给出的 load/use 检测条件是 `E_icode in {IMRMOVQ, IPOPQ} && E_dstM in {d_srcA, d_srcB}`：只有「从内存装入寄存器」的指令（mrmovq、popq）会触发。原因是装入的值要到 Memory 阶段结束才从数据存储器里出来，而使用它的指令在 Decode 阶段结束前就需要该操作数，转发来不及，只能由流水线控制把使用指令停在 Decode、向 Execute 注入一个 bubble。选项 A 是普通数据相关，值在 E 阶段由 ALU 生成，可用 E→D 转发解决，不需要停顿；选项 B 根本没有相关；选项 D 中 addq 的结果在 E 阶段即可转发给下一条指令，同样不需要停顿（只有值的来源是内存时才受制于访存阶段）。","tags":["load/use 冒险","停顿","转发"],"options":["irmovq $10, %rax 后接 addq %rax, %rbx","irmovq $10, %rax 后接 nop","mrmovq 0(%rdx), %rax 后接 addq %rax, %rbx","addq %rax, %rbx 后接 mrmovq 0(%rbx), %rcx"],"answer":2,"kp":"流水线 PIPE"},{"id":"gen-c11-04","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"PIPE 的 PC 预测策略","type":"single","difficulty":1,"stem":"讲义中 PIPE 采用的取指（PC）预测策略是：","code":null,"explanation":"讲义第 11 讲「Our Prediction Strategy」规定：不改变控制流的指令预测 next PC = valP，永远可靠；call 与无条件跳转预测 next PC = valC（目标地址），也永远可靠；条件跳转同样预测 valC，只有分支真的跳转时才正确，「Typically right 60% of time」；ret 不做预测，而是等它沿流水线走到 Write Back 时才把返回地址交给取指级（期间停顿取指）。选项 B 与讲义相反；选项 C 错在 ret 是靠停顿而不是预测 valP；选项 D 错在 call/jmp 预测的是 valC，且「其余指令不做预测」也不对——它们都预测 valP。","tags":["分支预测","控制冒险","PIPE"],"options":["条件跳转预测为 valC（跳转目标），因为讲义指出条件跳转大约有 60% 的情况会被执行","条件跳转预测为 valP（顺序下一条），因为大多数条件跳转不会跳转","ret 指令预测为 valP，因为返回点通常就在紧邻的下一条指令","call 与无条件跳转预测为 valP，其余指令不做预测"],"answer":0,"kp":"流水线 PIPE"},{"id":"gen-c11-05","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"流水线寄存器控制","type":"multi","difficulty":2,"stem":"关于 PIPE 处理各类冒险时流水线寄存器（F/D/E/M/W）的动作（normal / stall / bubble），下列说法正确的有（多选）：","code":null,"explanation":"讲义第 11 讲「Special Control Cases」表格给出的三行是：Processing ret → F stall、D bubble、E/M/W normal；Load/Use Hazard → F stall、D stall、E bubble、M/W normal；Mispredicted Branch → F normal、D bubble、E bubble、M/W normal。选项 D 与第三行矛盾：预测错误时取指级不停顿，因为 PC 选择逻辑会直接用 M_valA/M_valC 取出正确地址，被错误取到的两条指令在 D、E 两级被替换成 bubble 即可（代价 2 个周期）。选项 E 描述的是「正常模式」（Output = Input）；bubble 模式下寄存器输出被固定成 nop 的样子（如 icode = INOP、dstE = dstM = RNONE），而 stall 模式才是保持原值重发（Output = x）。","tags":["流水线控制","bubble","stall"],"options":["load/use 冒险：F 与 D 寄存器保持（stall），E 寄存器注入 bubble","ret 经过流水线时：F 寄存器保持（stall），D 寄存器注入 bubble","分支预测错误时：D 与 E 寄存器注入 bubble，F 寄存器保持 normal","分支预测错误时：F 寄存器也要注入 bubble，以便清掉取指级取到的错误指令","流水线寄存器处于 bubble 模式时，会把上游输入原样送到下游（即 Output = Input）"],"answer":[0,1,2],"kp":"流水线 PIPE"},{"id":"gen-c11-06","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"数据转发的原理","type":"multi","difficulty":2,"stem":"关于数据转发（forwarding / bypassing），下列说法正确的有（多选）：","code":null,"explanation":"讲义第 11 讲「Data Forwarding / Bypass Paths / Forwarding Priority」：朴素流水线要等到写回完成寄存器文件才有新值，而结果其实在 Execute 或 Memory 阶段就已产生，于是增加从 E、M、W 流水线寄存器到 Decode 阶段的旁路通路，转发源为 E: valE；M: valE、valM；W: valE、valM，并且这些值必须在 Decode 阶段结束前可用。多个来源同时命中时取最早阶段（E 优先于 M、W），否则会转发到过时的值。选项 C 错在 load/use 冒险里数据到 Memory 阶段才从内存取出，来不及在 Decode 结束前转发，必须停顿一个周期；选项 E 错在转发靠的是新增旁路多路选择器（选择 d_valA/d_valB 的来源），并不会改变寄存器文件本身的读写时序。","tags":["转发","旁路","PIPE"],"options":["转发源包括 E 阶段的 valE，以及 M 阶段的 valE、valM 和 W 阶段的 valE、valM","转发把值直接送到 Decode 阶段参与运算，所以该值必须在 Decode 阶段结束前就绪","有了转发之后，load/use 冒险也不再需要任何停顿","当多个流水线寄存器匹配同一个源寄存器时，应选择最早阶段的值，以匹配串行语义","转发是靠改造寄存器文件、使其在一个周期内既能读又能写来实现的"],"answer":[0,1,3],"kp":"流水线 PIPE"},{"id":"gen-c11-07","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"流水线控制组合 A","type":"judge","difficulty":3,"stem":"判断：当同一个周期里既出现「条件跳转预测错误」又出现「跳转目标处的 ret 需要停顿取指级」这两个特殊情况（讲义称为组合 A）时，PIPE 应按预测错误分支处理：F 寄存器保持（stall），D 与 E 寄存器注入 bubble。","code":null,"explanation":"讲义第 11 讲「Control Combination A」分析的正是这种少见情形：一个被预测为不跳转的分支，其跳转目标恰好是一条 ret。此时既满足 `E_icode == IJXX && !e_Cnd`（预测错误），又满足 `IRET in {D_icode, E_icode, M_icode}`（ret 需要停顿取指级）。讲义的结论是「Should handle as mispredicted branch」，对应动作是 F stall、D bubble、E bubble，因为 PC 选择逻辑本来就会用 M_valA（分支的 fall-through 地址）纠正取指，不需要额外的取指级停顿。作为对比，组合 B（load 写 %rsp 后紧跟 ret）要让 load/use 冒险取得优先：F stall、D stall（而不是 bubble），这正是第一版控制逻辑漏掉的微妙 bug，也是 corrected D_bubble 里要加 `&& !(E_icode in {IMRMOVQ, IPOPQ} && E_dstM in {d_srcA, d_srcB})` 的原因。","tags":["控制组合","预测错误","ret"],"options":null,"answer":true,"kp":"控制流与条件码"},{"id":"gen-c11-08","source":"自编 · 第 11 讲","origin":"created","lecture":11,"topic":"CPI 计算","type":"fill","difficulty":2,"stem":"PIPE 在不停顿时每个时钟周期完成一条指令（忽略流水线填充与排空的开销）。某程序共 200 条指令，执行过程中出现 25 次 load/use 冒险、10 次分支预测错误、5 次因 ret 造成的取指停顿，它们分别使执行多花 1、2、3 个周期。求该程序的 CPI（保留两位小数）。","code":null,"explanation":"讲义第 11 讲总结给出的代价是：load/use 冒险停顿 1 个周期，分支预测错误浪费 2 个周期（D、E 两级变成 bubble），ret 使取指级停顿 3 个周期（ret 要在 D、E、M 三级中走过）。于是额外周期 = 25 × 1 + 10 × 2 + 5 × 3 = 25 + 20 + 15 = 60；总周期 = 200 + 60 = 260；CPI = 260 / 200 = 1.30。可见即使是理想五级流水线，只要程序存在数据相关与控制相关，CPI 也会大于 1；反过来，转发能把绝大多数数据冒险的代价消成 0，这正是它能显著提升性能的原因。","tags":["CPI","性能计算","冒险代价"],"options":null,"answer":["1.30","1.3"],"kp":"流水线 PIPE"},{"id":"f2014-09","source":"2014 期末","origin":"exam","lecture":12,"topic":"局部性的判断","type":"single","difficulty":1,"stem":"在下面的代码中，变量 sum 具有的特性是","code":"int sumvec(int v[N])\n{\n    int i, sum = 0;\n    for (i = 0; i < N; i++)\n        sum += v[i];\n    return sum;\n}","explanation":"sum 是标量累加器，每轮迭代都对同一个地址反复读写（编译后一般常驻寄存器），因此具有很好的时间局部性；但它只有一个存储单元，谈不上空间局部性。具有良好的空间局部性的是顺序访问的数组 v[i]。题目问的是变量 sum 而不是数组 v，所以选 A。踩坑点：C 是把 v 的局部性算到了 sum 头上。","tags":["局部性","时间局部性","累加器"],"options":["良好的时间局部性","良好的空间局部性","同时具有良好的时间局部性和空间局部性","都不具有"],"answer":0,"kp":"存储层次与局部性"},{"id":"f2017-05","source":"2017 期末","origin":"exam","lecture":12,"topic":"磁盘容量的计算","type":"single","difficulty":2,"stem":"某个机械硬盘的部分指标数据如下：1024 bytes/sector、400 sectors/track（平均）、20000 tracks/surface、5 platters/disk，则该硬盘标称的容量最有可能是多少？","code":null,"explanation":"容量 = 每扇区字节数 × 每磁道扇区数 × 每面磁道数 × 面数 = 1024 × 400 × 20000 × (5 × 2) = 8.192 × 10^10 字节 ≈ 81.92 GB（按 10^9 计），厂商标称时用十进制单位，所以最接近的是 80 GB。若按 2^30 换算，8.192 × 10^10 字节 = 76.3 GiB，这正是选项 B 的来源——它表达的是同一个容量，但题目问的是“标称容量”，通常指厂商按十进制宣传的数值，故选 A。踩坑点：GB 与 GiB 相差约 7%，读题时要注意“标称”二字。","tags":["磁盘容量","扇区","单位换算"],"options":["80 GB","76 GB","40 GB","38 GB"],"answer":0,"kp":"存储层次与局部性"},{"id":"f2018-01","source":"2018 期末","origin":"exam","lecture":12,"topic":"局部性（时间/空间局部性）","type":"single","difficulty":1,"stem":"在如下的代码中，下列关于局部性的说法正确的是：","code":"int add(int *a, int n) {\n  int sum = 0;\n  for (int i = 0; i < n; ++i)\n    sum += a[i];\n  return sum;\n}","explanation":"局部性分两种：时间局部性指同一数据/指令被反复访问，空间局部性指访问某地址后紧接着访问其邻近地址。A 错：sum 是被反复读写的单个标量（每次循环都要读一次、写一次），它体现的是时间局部性；单个 int 只占一个存储单元，不存在“访问一个地址后访问其相邻地址”的模式，谈不上空间局部性。B 对：a[i] 按 i=0,1,2,… 顺序访问，相邻元素地址相邻，一次缓存块装入就能服务多次访问，空间局部性很好。C 错：这个循环对每个数组元素只访问一次（典型的流式/顺序访问），没有重复访问，所以没有时间局部性。D 因 A、C 错而不成立。踩坑点：不要看到“变量被反复访问”就写空间局部性，也不要混淆数组顺序访问（空间局部性）和数组被多次遍历（时间局部性）。","tags":["局部性","缓存","顺序访问"],"options":["变量 sum 具有良好的空间局部性","数组 a 具有良好的空间局部性","数组 a 具有良好的时间局部性","以上说法都正确"],"answer":1,"kp":"存储层次与局部性"},{"id":"f2019-05","source":"2019 期末","origin":"exam","lecture":12,"topic":"SRAM/DRAM/磁盘/SSD 的访问特性","type":"single","difficulty":2,"stem":"下述关于各类存储介质的讨论，哪个是错误的？","code":null,"explanation":"A 对：磁盘是机械式寻道+旋转延迟，访问延时取决于数据的位置（磁道、扇区），顺序访问能利用预取和连续扇区，性能远高于随机访问。B 错（本题选它）：DRAM 内部按“行/列矩阵”组织，访问时要先把整行送入行缓冲，命中行缓冲的连续访问（行内顺序访问）比跨行随机访问快得多，两者延时并不相同。C 对：SSD 的擦除必须以块为单位且代价很高，擦除延时比读延时高一个数量级左右。D 对：SRAM 用 6 个左右的晶体管存一位（不需要刷新），面积大、密度最低；DRAM 每比特只需一个晶体管加一个电容；SSD 用的闪存单元结构更紧凑，密度更高。踩坑点：“随机访问存储器”不代表随机访问与顺序访问一样快。","tags":["DRAM","SRAM","SSD","局部性"],"options":["磁盘访问的延时和数据所在位置有关，连续数据访问的性能高于随机数据访问","DRAM 是动态随机存储器，连续数据访问和随机数据访问延时是一样的","对 SSD 设备进行数据擦除操作的延时，远高于进行数据读取的延时","SRAM 是静态随机存储器，它的存储密度比 DRAM、SSD 都要低"],"answer":1,"kp":"存储层次与局部性"},{"id":"f2021-07","source":"2021 期末","origin":"exam","lecture":12,"topic":"磁盘容量与存储器层次结构的基本性质","type":"single","difficulty":2,"stem":"以下关于存储设备与存储器层次结构的说法，正确的是：","code":null,"explanation":"A 对：容量 = 盘面数 × 每面磁道数 × 每条磁道扇区数 × 每扇区字节数 = (5×2) × 10000 × 400 × 512 = 20.48×10^9 字节 = 20.48GB。B 错：SRAM 和 DRAM 都是易失性存储，断电后都会丢失数据（DRAM 还需要定期刷新）；两者的区别是速度、密度和是否刷新，而不是掉电保持。C 错：上层存储的内容不一定来自下层，例如寄存器里可以有临时计算结果、刚算出的值未必在内存中存在（“上一层是下一层子集”只是大致趋势，并非必然）。D 错：缓存恰恰利用了空间局部性——它按块（cache line）搬运数据，把被访问元素所在的整块都取进缓存，其中很多元素我们还没有访问过。踩坑点：层次结构的“包含关系”是大概率而非铁律，缓存同时利用时间局部性和空间局部性。","tags":["磁盘容量","存储器层次","SRAM/DRAM","局部性"],"options":["一个有 5 个盘片，每个面 10000 条磁道，每条磁道平均有 400 个扇区，每个扇区有 512 个字节的硬盘容量为 20.48GB。","SRAM 的存取速度快，但是断电后数据会丢失，DRAM 的存取速度较慢，但断电后数据不会丢失。","在存储器层次结构中，上一层存储的信息一定是下一层存储的信息的一个子集。","基于缓存的存储器层次结构只利用了程序的时间局部性，没有利用程序的空间局部性，因为缓存不会存储我们没访问过的元素。"],"answer":0,"kp":"存储层次与局部性"},{"id":"f2024-04","source":"2024 期末","origin":"exam","lecture":12,"topic":"RAM/ROM/SSD 与缓存替换策略","type":"single","difficulty":2,"stem":"下列关于存储设备的说法，正确的是：","code":null,"explanation":"A 错：RAM 分为 SRAM（静态）与 DRAM（动态）两类，它们的统称不是 SDRAM；SDRAM 是 synchronous DRAM（同步 DRAM）的缩写，只是 DRAM 的一种，不能用来概括 SRAM。B 错：ROM 是历史遗留的称呼，并非所有 ROM 都只能被写一次（PROM、EPROM、EEPROM、闪存都可以多次改写）；而且 ROM 与非易失性存储器（NVM）也不是同一个概念，不能直接画等号。C 对：SSD 的随机写比读慢，因为写之前往往需要擦除整个块，擦除耗时较长，而且如果要修改的页所在块中还有其他带有用数据的页，必须先把这些页复制到新块里（课本 P415 的论述）。D 错：说反了，直接映射缓存每一组只有一行，冲突时只能反复换入换出，比组相联更容易发生抖动（thrashing）；组相联正是为了降低冲突缺失才引入的。","tags":["SRAM-DRAM","ROM-NVM","SSD擦除","抖动"],"options":["随机访问存储器（Random-Access Memory，RAM）分为静态的和动态的，这两类也被统称为 SDRAM。","只读存储器（Read-Only Memory，ROM）只能被编程一次，也就是它们只能被写一次。只读存储器也被称为非易失性存储器。","固态硬盘（Solid State Disk, SSD）的随机写比读慢，因为擦除块需要较长的时间，如果写操作试图修改一个包含已有数据的页，那么这个块中所有带有有用数据的页都要被复制到一个新块中。","组相联高速缓存很容易产生“抖动”问题，因此我们引入了直接映射高速缓存。"],"answer":2,"kp":"存储层次与局部性"},{"id":"m2013-17","source":"2013 期中","origin":"exam","lecture":12,"topic":"数组与循环的局部性","type":"single","difficulty":2,"stem":"关于局部性（locality）的描述，**不正确**的是：","code":null,"explanation":"数组元素在内存中连续存放，顺序访问时相邻元素落在同一缓存块中，因此数组体现的是典型的**空间局部性**；只有当同一元素被反复访问（如循环中的累加变量、被多次引用的表项）时才体现时间局部性，所以「数组通常具有很好的时间局部性」不正确，选 A。循环体反复执行、同一批指令被多次取指与执行，因此循环具有良好的时间局部性（C 正确）；循环体的指令本身连续放在代码段中，取指时也有空间局部性（D 正确），B 也正确。该题亦见于 2015 年试卷（选项顺序不同，答案为 C），本题保留最早的 2013 年版。","tags":["局部性","数组","循环"],"options":["数组通常具有很好的时间局部性","数组通常具有很好的空间局部性","循环通常具有很好的时间局部性","循环通常具有很好的空间局部性"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2014-14","source":"2014 期中","origin":"exam","lecture":12,"topic":"存储器层次结构与访问延时","type":"single","difficulty":3,"stem":"以下关于存储结构的讨论，哪个是正确的？","code":null,"explanation":"增加一级存储（例如在 CPU 与主存之间加一层缓存）通常会使平均访问延时**下降**，因为命中时无需访问更慢的下一级，所以 A 的「一定不会下降」是错的。增加容量（例如把缓存做大）可以提高命中率，从而降低平均访问延时，所以 B 的「一定不会下降」也不对；而且「一定」这种绝对化的表述本身就很难成立。C 明显错误：新加的一级若发生缺失，访问必须再走下一级，延时会增加。因此三个说法都不正确，选 D。踩坑点：存储器层次结构的核心指标是「平均访问时间 = 命中时间 + 缺失率 × 缺失代价」，任何一层的变化都要从这个公式去分析。","tags":["存储器层次","平均访问时间","命中率"],"options":["增加额外一级存储，数据存取的延时一定不会下降","增加存储的容量，数据存取的延时一定不会下降","增加额外一级存储，数据存取的延时一定不会增加","以上选项都不正确"],"answer":3,"kp":"高速缓存"},{"id":"m2015-12","source":"2015 期中","origin":"exam","lecture":12,"topic":"存储器与磁盘的特性","type":"single","difficulty":2,"stem":"下面关于存储器的说法，**错误**的是：","code":null,"explanation":"D 错误：固态硬盘（SSD）的随机读通常明显快于随机写——写操作还要经历擦除、垃圾回收和写放大，因此不能说「随机读写性能基本相当」。A 正确：SDRAM 与前端总线同步、支持流水化的突发传输，比采用异步握手、一次只传一个数据的 FPM DRAM 快得多。B 正确：SDRAM 的行地址（RAS）与列地址（CAS）分两次复用同一组地址引脚传输，这也是「同步、突发、行列复用」设计的一部分。C 正确：典型磁盘的寻道时间约几毫秒，10 000 RPM 时的旋转延迟约 3ms，两者确实在同一数量级。踩坑点：存储器的「速度」比较要区分带宽与延迟；SSD 的读写不对称是它写性能瓶颈的根源。","tags":["SDRAM","磁盘","SSD"],"options":["SDRAM 的速度比 FPM DRAM 快","SDRAM 的 RAS 和 CAS 请求共享相同的地址引脚","磁盘的寻道时间和旋转延迟大致在一个数量级","固态硬盘的随机读写性能基本相当"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2015-13","source":"2015 期中","origin":"exam","lecture":12,"topic":"磁盘扇区传送时间","type":"single","difficulty":2,"stem":"某磁盘的旋转速率为 7200 RPM，每条磁道平均有 400 个扇区，则一个扇区的平均传送时间为：","code":null,"explanation":"转速 7200 RPM 表示每分钟转 7200 圈，一圈耗时 60/7200 s = 1/120 s ≈ 8.33 ms。一个扇区的传送时间就是盘片转过一个扇区所需的时间：8.33 ms ÷ 400 ≈ 0.0208 ms，约 0.02 ms，故选 A。B（0.01ms）是漏乘或把 400 当成 800 的结果；C、D 分别把结果乘了 1.5 和 2。踩坑点：传送时间 = 一圈时间 / 每磁道扇区数，与寻道时间、旋转延迟是不同的量；先算一圈时间（60/RPM）再除以扇区数是稳妥的算法。","tags":["磁盘","传送时间","RPM"],"options":["0.02 ms","0.01 ms","0.03 ms","0.04 ms"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2016-12","source":"2016 期中","origin":"exam","lecture":12,"topic":"存储层次与平均访问时间","type":"single","difficulty":2,"stem":"以下关于存储层次结构的说法，正确的是：","code":null,"explanation":"A、C 都用了「一定」：在 CPU 与内存之间加一级 cache 会改变的是**平均访问时间**（命中时更快、缺失时更慢），能否下降取决于命中率与缺失代价，因此「一定不会下降」和「一定不会增加」都不成立。B 同样绝对化：增大 cache 容量通常能提高命中率、从而降低平均访问延时（当然也可能因索引/比较变慢而增加命中时间），不能说「一定不会下降」。三个选项都错，故选 D。核心认识是：存储层次用「平均访问时间 = 命中时间 + 缺失率 × 缺失代价」衡量，任何结构调整都没有单向的「一定」结论。","tags":["存储层次","平均访问时间","命中率"],"options":["增加额外一级存储，数据存取的延时一定不会下降","增加存储的容量，数据存取的延时一定不会下降","增加额外一级存储，数据存取的延时一定不会增加","以上选项都不正确"],"answer":3,"kp":"高速缓存"},{"id":"m2016-13","source":"2016 期中","origin":"exam","lecture":12,"topic":"局部性：数组与循环","type":"single","difficulty":1,"stem":"关于局部性（locality）的描述，**不正确**的是：","code":null,"explanation":"循环体的指令被反复执行，体现了指令的时间局部性；循环体指令在内存中连续存放，又体现指令的空间局部性，所以 A、B 正确。数组元素按地址顺序连续存放，顺序访问数组体现的是**空间局部性**（D 正确）；但每个数组元素往往只被访问一次（例如求和），并不体现时间局部性，C 错误。只有当同一元素被反复读写时（如循环内的累加变量、矩阵乘法中的复用）才谈得上数据的时间局部性，数组本身并不等于时间局部性。","tags":["局部性","数组","循环"],"options":["循环通常具有很好的时间局部性","循环通常具有很好的空间局部性","数组通常具有很好的时间局部性","数组通常具有很好的空间局部性"],"answer":2,"kp":"存储层次与局部性"},{"id":"m2017-13","source":"2017 期中","origin":"exam","lecture":12,"topic":"存储器层次结构的组成","type":"single","difficulty":1,"stem":"以下计算机部件中，通常**不**用于存储器层次结构（memory hierarchy）的是：","code":null,"explanation":"教材给出的经典存储层次是「寄存器 → L1/L2/L3 高速缓存 → 主存（DRAM）→ 本地磁盘 → 远程存储」：寄存器和各级 cache 由 SRAM 实现，主存用 DRAM，本地磁盘（旋转磁盘或 SSD）作为层次中的下一级并充当虚拟内存的交换区与文件的后备存储。因此高速缓存、内存、硬盘都在层次结构之内；而 U 盘是可移动外设，不参与虚拟内存管理、不受操作系统按层次调度，不属于计算机内部存储层次的一环，故答案为 D。","tags":["存储层次","磁盘","SRAM/DRAM"],"options":["高速缓存","内存","硬盘","优盘（U 盘）"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2018-11","source":"2018 期中","origin":"exam","lecture":12,"topic":"SRAM/DRAM、SSD 与磁盘访问时间","type":"single","difficulty":3,"stem":"以下关于存储的描述中，正确的是：","code":null,"explanation":"B 正确：SSD 没有机械寻道，随机读性能远好于旋转磁盘；但写入前需要整块擦除（写放大），写速度明显低于读速度，单位容量价格更贵，且闪存单元有擦写寿命（会磨损）。A 错：SRAM 与 DRAM 的位置说反了——cache 用**SRAM**（快而贵），主存才用 **DRAM**。C 错：容量 = 2 面 × 10000 柱面 × 400 扇区 × 512 字节 = 4.096×10^9 字节 = 4.096GB（按 1GB = 10^9 字节计），远不到 8GB。D 错：平均旋转延迟是半个旋转周期 = 0.5 × (60/6000) s = 5ms，平均访问时间 ≈ 9 + 5 = 14ms；19ms 相当于把整个旋转周期都算进去了。","tags":["SRAM/DRAM","SSD","磁盘访问时间"],"options":["由于基于 SRAM 的内存性能与 CPU 的性能有很大差距，因此现代计算机使用更快的基于 DRAM 的高速缓存，试图弥补 CPU 和内存间性能的差距。","SSD 相对于旋转磁盘而言具有更好的读性能，但是 SSD 写的速度通常比读的速度慢得多，而且 SSD 比旋转磁盘单位容量的价格更贵，此外 SSD 底层基于 EEPROM 的闪存会磨损。","一个有 2 个盘片、10000 个柱面、每条磁道平均有 400 个扇区、每个扇区 512 字节的双面磁盘的容量为 8GB。","访问一个磁盘扇区的平均时间主要取决于寻道时间和旋转延迟，因此一个旋转速率为 6000RPM、平均寻道时间为 9ms 的磁盘的平均访问时间大约为 19ms。"],"answer":1,"kp":"存储层次与局部性"},{"id":"m2019-14","source":"2019 期中","origin":"exam","lecture":12,"topic":"标量循环缺少数据空间局部性","type":"single","difficulty":2,"stem":"一个不含数组和指针访问的循环通常**不能体现**以下哪种局部性？","code":null,"explanation":"循环里反复使用同一批**标量**变量（循环变量、累加器等），体现数据的时间局部性；循环体的指令被反复执行，体现指令的时间局部性；这些指令在内存中连续存放，顺序取指又体现指令的空间局部性。而**数据的空间局部性**来自「访问了某个数据后紧接着访问它附近的地址」，一般要有数组（或结构体、连续分配的指针目标）才谈得上；只有标量变量的循环里，相邻数据对象之间没有必然的地址邻接关系，因此体现不出数据的空间局部性，选 B。踩坑点：时间局部性靠「重复访问同一对象」，空间局部性靠「访问相邻对象」，标量循环只有前者。","tags":["局部性","标量与数组","顺序访问"],"options":["数据的时间局部性","数据的空间局部性","指令的时间局部性","指令的空间局部性"],"answer":1,"kp":"存储层次与局部性"},{"id":"m2019-15","source":"2019 期中","origin":"exam","lecture":12,"topic":"SRAM、DRAM 与固态硬盘","type":"single","difficulty":2,"stem":"以下关于存储器的说法中，正确的是：","code":null,"explanation":"A 正确（官方答案 A）：SRAM 用 6 个晶体管构成双稳态触发器，只要供电就能保持数据、无需刷新；DRAM 用 1 个晶体管加电容存储电荷，必须周期性刷新。相同工艺下 SRAM 单元面积更大、静态功耗与动态能耗都更高，正因如此 cache 才只能做得很小。B 错：高速缓存用 SRAM，主存用 DRAM。C 错：SDRAM 是「同步 DRAM」，只是 DRAM 的改进（与时钟同步、支持突发传输），并不具备 SRAM 的特点。D 错：SSD 的读速度明显高于写速度（写入要先整块擦除、存在写放大），两者并不相当。","tags":["SRAM","DRAM","SSD 读写"],"options":["SRAM 单元比 DRAM 单元的能耗更大","DRAM 通常用做高速缓存","SDRAM 同时具备 SRAM 和 DRAM 的特点","固态硬盘的读写速度基本相当"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2019-24","source":"2019 期中","origin":"exam","lecture":12,"topic":"冷启动失效与评测预热","type":"fill","difficulty":2,"stem":"在用 4×4 循环展开的 `test()` 函数评测存储系统性能时，实际评测中会先把 `test()` 运行一遍，然后再运行一次以获取评测数据。这是为了避免什么现象对评测结果的影响？","code":null,"explanation":"第一次运行时，cache 里还没有任何被访问的数据和指令，所有首次访问都会发生**冷启动失效**（又称强制失效、compulsory miss）——这是「数据从未被访问过」造成的必然缺失，与 cache 的容量和相联度都无关。如果直接用第一次的数据，结果里会包含这些一次性的缺失，无法反映稳定状态下的存储层次性能。先跑一遍把工作集预热（warm-up）到 cache 中，再测一次，剩下的缺失才只反映容量失效与冲突失效，数据才有可比性。官方答案为 cold miss。踩坑点：三种缺失（强制/容量/冲突）要分清，预热消除的是强制失效。","tags":["冷启动失效","cache 缺失分类","性能评测"],"options":null,"answer":["冷启动失效（cold miss / 强制失效 compulsory miss）","cold miss","强制失效","compulsory miss","冷启动缺失"],"kp":"高速缓存"},{"id":"m2020-09","source":"2020 期中","origin":"exam","lecture":12,"topic":"局部性的识别","type":"single","difficulty":1,"stem":"下面代码中不能体现以下哪种局部性：","code":"for (i = 0; i < 100; i++) {\n    a[0] = a[0] + i;\n}","explanation":"B 是本题答案：循环体自始至终只访问 a[0] 这一个数据元素，从未访问它附近（相邻地址）的其它元素，所以不体现数据的空间局部性。A 成立：同一个 a[0] 被反复访问，正是数据的时间局部性。C、D 成立：循环体的指令被反复取出（指令的时间局部性），且这些指令在内存中连续存放，一次取指就能用到同一条 cache line 中的相邻指令（指令的空间局部性）。踩坑点：空间局部性看的是“访问一个位置后，其邻近位置是否也会被访问”，本题的数组只有一个元素被用到。","tags":["局部性","空间局部性","数组"],"options":["数据的时间局部性","数据的空间局部性","指令的时间局部性","指令的空间局部性"],"answer":1,"kp":"存储层次与局部性"},{"id":"m2020-10","source":"2020 期中","origin":"exam","lecture":12,"topic":"SRAM/DRAM/SSD 的特性对比","type":"single","difficulty":2,"stem":"以下关于存储器的说法中，正确的是：","code":null,"explanation":"A 正确：SRAM 单元由 4~6 个晶体管构成，并依靠持续通电的双稳态电路保持数据，单位容量的能耗高于结构简单的 DRAM（1 个晶体管加 1 个电容，靠刷新维持）。B 错：高速缓存用的是 SRAM，因为 DRAM 太慢且需要刷新。C 错：DRAM 要等电容充放电、还要周期性刷新，访问速度比 SRAM 慢一个量级。D 错：SSD 的读速度通常明显快于写速度（写还涉及擦除、块复制和磨损均衡）。踩坑点：不要只记住“DRAM 便宜、SRAM 快”，还要记住 SRAM 的静态功耗更高、两者都是易失性存储。","tags":["SRAM","DRAM","SSD"],"options":["SRAM 单元比 DRAM 单元的能耗更大","DRAM 通常用做高速缓存","DRAM 单元比 SRAM 单元的速度更快","固态硬盘的读写速度基本相当"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2020-12","source":"2020 期中","origin":"exam","lecture":12,"topic":"SDRAM 命名与 SRAM/DRAM 的晶体管数","type":"single","difficulty":1,"stem":"以下关于存储器的说法中，正确的是：","code":null,"explanation":"B 正确：SRAM 单元通常需要 4~6 个晶体管来构成双稳态电路，而 DRAM 单元只要 1 个晶体管加 1 个电容，所以 SRAM 每比特的晶体管数更多、集成度更低、单位容量更贵。A 错：SDRAM 中的 S 指 Synchronous（同步），它是在 DRAM 基础上加了同步时钟接口，与 SRAM（Static）无关。C 错：DRAM 是易失性存储器，需要周期性刷新，断电后数据丢失。D 错：SSD 的读速度通常明显快于写速度。踩坑点：两个“S”的含义完全不同（Synchronous 对 Static）。","tags":["SDRAM","SRAM","DRAM"],"options":["SRAM 和 DRAM 的融合形成 SDRAM","SRAM 单元比 DRAM 单元的晶体管数目更多","DRAM 是一种非易失性存储器","固态硬盘的读写速度基本相当"],"answer":1,"kp":"存储层次与局部性"},{"id":"m2021-10","source":"2021 期中","origin":"exam","lecture":12,"topic":"DMA、磁盘扇区布局与 SSD 磨损","type":"single","difficulty":2,"stem":"下列有关存储器的说法中，正确的是：","code":null,"explanation":"C 正确：SSD 没有机械寻道，随机访问很快，但闪存块的擦写次数有限，因此需要通过平均磨损（wear leveling）逻辑把写操作分散到不同块上，延长使用寿命。A 错：DMA 是把磁盘数据直接传送到主存而不是寄存器，CPU 仍需从主存读取数据来使用。B 错：单个盘片、单个读写头时，属于同一逻辑块的扇区应当放在同一磁道且尽量相邻，这样才能减少寻道与旋转等待；分散到不同磁道反而增加寻道。D 错：SRAM 虽不需要刷新，但它是易失性存储器，断电后数据同样会丢失。踩坑点：“不需要刷新”不等于“非易失”。","tags":["DMA","SSD","SRAM"],"options":["DMA 技术是指，当需要磁盘中的数据时，比起将磁盘数据先传送到主存，可以直接将磁盘数据通过总线传送到寄存器中，以提升效率","对于只有一个盘片，一个读写头的旋转磁盘，在分配逻辑块时，最好让属于同一逻辑块的扇区均匀分布在不同磁道上，以减少读取一个逻辑块的时间","SSD 相比于旋转磁盘，不需要寻道，但更容易磨损，因此常使用平均磨损逻辑以提高 SSD 的寿命","SRAM 的电路可以无限期保持其状态，断电之后依旧可以保存信息，而 DRAM 需要周期性地刷新状态，断电后信息将消失"],"answer":2,"kp":"存储层次与局部性"},{"id":"m2021-11","source":"2021 期中","origin":"exam","lecture":12,"topic":"闪存的写前擦除特性","type":"single","difficulty":2,"stem":"下列有关存储器的说法中，错误的是：","code":null,"explanation":"D 错误，为本题答案：闪存写一个已经含有数据的页时，不能直接覆盖写，通常必须先把该块中所有有效页复制到一个已经擦除的新块，再写入新数据，因此写时间与该页是否已经有数据密切相关（空页可以直接写，含数据的页要先做块复制）。A 正确：磁盘访问时间由寻道、旋转、传送三部分构成。B 正确：磁盘控制器负责扇区映射与坏扇区管理，逻辑块抽象则向操作系统隐藏了磁盘的物理细节。C 正确：DRAM 与磁盘的性能提升远慢于 CPU，形成存储墙，故现代处理器大量使用多级高速缓存。踩坑点：闪存“擦除后写”的特性决定了写时间不固定。","tags":["闪存","SSD","存储层次"],"options":["旋转磁盘对扇区的访问时间有三个主要的部分：寻道时间、旋转时间和传送时间","在旋转磁盘中，磁盘控制器和逻辑块的设计理念有利于为操作系统隐藏磁盘的复杂性，同时也有利于对损坏的扇区进行管理","DRAM 和磁盘的性能发展滞后于 CPU，现代处理器为了弥补 CPU 的访存需求和内存延迟的差距，频繁地使用高速缓存","SSD 的闪存芯片包含若干个块，一个块由若干页组成，写入页的时间和该页是否包含数据（是否全为 1）无关"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2021-12","source":"2021 期中","origin":"exam","lecture":12,"topic":"循环程序中的局部性","type":"single","difficulty":1,"stem":"分析下面的 C 程序，以下关于局部性（locality）说法错误的是：","code":"int i = 0, a = 1, b = 1;\nfor (; i < 100; i++) {\n    a = a + b;\n    b = a + b;\n}","explanation":"D 错误，为本题答案：循环体被反复执行 100 次，同一批指令被多次取出，体现了指令的时间局部性；相邻的指令在内存中连续存放，每次取指都会用到同一条 cache line 中的其它指令，体现了指令的空间局部性；变量 a、b 在循环中被反复访问，体现了数据的时间局部性。所以 A、B、C 都成立，“以上都没有体现”是错的。踩坑点：循环是最典型的局部性来源，只要是循环，指令的时间与空间局部性几乎必然存在。","tags":["局部性","循环","指令局部性"],"options":["体现了数据的时间局部性","体现了指令的时间局部性","体现了指令的空间局部性","以上都没有体现"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2022-13","source":"2022 期中","origin":"exam","lecture":12,"topic":"磁盘、DMA、SSD 与 SRAM 的特性","type":"single","difficulty":1,"stem":"以下关于存储器的说法中，错误的是：","code":null,"explanation":"D 错误，为本题答案：SRAM 和 DRAM 都是易失性存储器，断电后数据都会丢失；SRAM 的特点是不需要刷新、访问快，而不是非易失。A 正确：提高旋转速率既缩短了等待目标扇区转到磁头下的旋转延迟，也提高了传送速率。B 正确：这正是 DMA 的定义，磁盘控制器直接与内存交换数据，CPU 只负责发起请求。C 正确：SSD 读通常比写快，因为写还涉及擦除、垃圾回收与磨损均衡。踩坑点：易失/非易失是 SRAM 与 DRAM 的共同属性，不要与“是否需要刷新”混淆。","tags":["SRAM","DMA","SSD"],"options":["对于旋转磁盘（rotating disk），可以通过提高旋转速率（rotational speed）的方式减少旋转时间（rotational latency）和传送时间（transfer time），从而降低访问时间（access time）。","在 CPU 向磁盘控制器（disk controller）发送读取数据请求后，磁盘控制器会读取指定扇区的内容，并将其传送到内存的指定位置，这一传送过程不需要 CPU 参与，称为 DMA（direct memory access）传送。","对于同一个 SSD，读取速度通常比写入速度快。","SRAM 是非易失性（nonvolatile）存储器，其数据在断电后不会丢失。"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2022-14","source":"2022 期中","origin":"exam","lecture":12,"topic":"SDRAM 命名与 DRAM 的组织方式","type":"single","difficulty":2,"stem":"以下关于存储器的说法中，错误的是：","code":null,"explanation":"A 错误，为本题答案：SDRAM 里的 S 指 Synchronous（同步），它是在 DRAM 基础上加了同步时钟接口的改进型 DRAM，与 SRAM（Static，静态）毫无关系。B 正确：DRAM 与磁盘的性能提升速度远慢于 CPU，形成“存储墙”，因此现代处理器用多级高速缓存来弥补访存延迟。C 正确：SRAM 单元需要 4~6 个晶体管，DRAM 只要 1 个晶体管加一个电容，所以 SRAM 集成度低、单位容量更贵。D 正确：把 DRAM 组织成二维阵列后行地址与列地址可以分时复用同一组引脚，显著减少地址引脚数。踩坑点：两个 S 含义完全不同，一个 Synchronous 一个 Static。","tags":["SDRAM","DRAM","存储墙"],"options":["SDRAM 同时具备 SRAM 和 DRAM 的特点。","DRAM 和磁盘的性能发展滞后于 CPU，现代处理器为了弥补 CPU 的访存需求和内存延迟的差距，频繁地使用高速缓存。","SRAM 单元比 DRAM 单元使用更多的晶体管，因而密集度低，而且更贵。","电路设计者将 DRAM 组织成二维阵列而不是线性数组的一个原因是降低芯片上地址引脚的数量。"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2023-16","source":"2023 期中","origin":"exam","lecture":12,"topic":"RAM 与 NVM 的特性","type":"single","difficulty":3,"stem":"关于 RAM（Random-access memory）和 NVM（Non-volatile memory）表述正确的是：","code":null,"explanation":"D 正确：3D XPoint/Optane 这类新型非易失介质可以按字节寻址（像内存一样作为字节设备被 CPU 直接访问），也可以按块组织（像盘一样用作块设备）。A 错：NVM 同样支持随机访问，它的特点是掉电不丢数据，而不是不能随机访问。B 错：DRAM 可以被用作缓存，例如嵌入式 DRAM 被用作 L3/L4 缓存。C 错：NVM 可以做主存，Optane DC 持久内存就插在内存总线上直接作为主存使用。E 错：并非所有 NVM 都需要先擦除后写，Optane 支持原处更新（in-place update），只有闪存才需要擦除后写。F 错：磁盘本身带有 32MB~128MB 的 DRAM 作为缓存，用于缓冲读写的数据。踩坑点：把闪存的“擦除后写”当成所有 NVM 的共性。","tags":["NVM","DRAM","3D XPoint"],"options":["RAM 支持随机访问，NVM 不支持随机访问；","DRAM 不能被用来做 Cache；","NVM 不能被用来做主存；","新介质（如 3D XPoint）既能作为块设备也能作为字节设备；","与 RAM 相比，所有 NVM 都遵循擦除后写（erase before write）的规则；","在磁盘系统的实现中不会使用到 DRAM；"],"answer":3,"kp":"存储层次与局部性"},{"id":"m2023-17","source":"2023 期中","origin":"exam","lecture":12,"topic":"磁盘访问时间与最短调度顺序","type":"single","difficulty":3,"stem":"假设一块 32MB 缓存、1TB 容量的磁盘配置为：Rotation rate = 7200 RPM，Average seek time = 9 ms，Average # sectors/track = 400。现磁头处在（Sector 0，Track 0）位置，请问访问（Sector 16, Track 1）、（Sector 48, Track 2）、（Sector 32, Track 1）、（Sector 16, Track 1）最短需要花多长时间？（Track 0、1、2 在一个 zone 内）","code":null,"explanation":"传送一个扇区的时间 = 60/7200 × (1/400) × 1000 ms = 0.02 ms；转过一个扇区的时间同样为 (1/400) × (60/7200) × 1000 = 0.02 ms。最短路径要沿旋转方向依次经过同一磁道上的扇区，再换道：(Sector 16, Track 1) → (Sector 32, Track 1) → (Sector 48, Track 2)，共 2 次寻道 2×9 = 18 ms，旋转等待 16+16+16 = 48 个扇区 × 0.02 = 0.96 ms，传送 3×0.02 = 0.06 ms，合计 18 + 0.96 + 0.06 = 19.02 ms，选 A。B 是随意编造的小数值；C、D 都多算了一次寻道或绕了整圈（400 个扇区）；E 少算一次寻道又多算旋转。踩坑点：同一 zone 内相邻磁道的扇区编号在旋转方向上是连续的，必须先按几何位置规划顺序再算时间。","tags":["磁盘","旋转延迟","传送时间"],"options":["19.02 ms","11.3 ms","29.3 ms","43.38 ms","35.7 ms"],"answer":0,"kp":"存储层次与局部性"},{"id":"m2024-12","source":"2024 期中","origin":"exam","lecture":12,"topic":"SRAM/DRAM/SSD/磁盘的特性","type":"single","difficulty":1,"stem":"以下关于存储设备的说法正确的是：","code":null,"explanation":"C 正确：SSD 没有机械寻道和旋转延迟，随机读写时不必像磁盘那样反复寻道，因此随机访问速度一般远快于旋转磁盘。A 错：SRAM 确实是双稳态、通电即可保持，但它和 DRAM 一样都是易失性存储器，断电后数据会丢失；“非易失性”指的是断电后仍能保存数据（如闪存、磁盘）。B 错：DRAM 每比特只要 1 个晶体管（电容存储），SRAM 需要 4~6 个，但 DRAM 需要周期性刷新且访问要等电容充放电，速度比 SRAM 慢一个量级。D 错：旋转磁盘在单位容量价格、写入寿命、长期断电保存等方面仍有优势，不能一概而论。","tags":["SRAM","DRAM","SSD"],"options":["SRAM 是双稳态的，只要有电就能保持它的值，所以是非易失性存储器","DRAM 每单元所需的晶体管数比 SRAM 少，所以 DRAM 速度一定比 SRAM 更快","随机读写时，SSD 无需像旋转磁盘一样进行多次寻道操作，一般速度更快","SSD 有速度快、耗能低等优点，所以任何情况下都应使用 SSD 而不是旋转磁盘"],"answer":2,"kp":"存储层次与局部性"},{"id":"m2024-13","source":"2024 期中","origin":"exam","lecture":12,"topic":"磁盘容量与访问时间估算","type":"single","difficulty":3,"stem":"考虑一个有 x 个盘片，每个扇区 y 字节，每个面 z 条磁道，每条磁道平均 w 个扇区，旋转速率 a RPM，平均寻道时间 b ms 的磁盘。则下列说法正确的是：","code":null,"explanation":"D 正确：教材给出的经验规律是“平均访问时间中寻道时间与旋转延迟大致相当”，据此可由平均寻道时间 b 反推旋转速率，即旋转半圈的时间约等于 b 毫秒，于是 a ≈ 60/b × 1/2 × 1000 RPM。A 错：容量按十进制换算应为 2wxyz / 10^9 GB，2^30 是 GiB 的换算方式。B 错：旋转延迟是等待目标扇区转到磁头下的时间，平均为半圈，即 60/a × 1/2 × 1000 ms，选项漏掉了 1/2。C 错：访问一个扇区的时间主要由寻道时间和旋转延迟构成；第一个字节的传送很慢，其余字节几乎不额外花时间，所以不能用“传送时间”来概括。","tags":["磁盘","旋转延迟","寻道时间"],"options":["磁盘容量为 2wxyz / 2^30 GB","访问一个磁盘扇区内容的平均时间为 (60/a * 1000 + 60/a/w * 1000 + b) ms","访问一个磁盘扇区中 512 个字节的时间主要是寻道时间和传送时间","假设旋转速率未知，在通常情况下我们可以简单估计 a = 60/b * 1/2 * 1000 RPM"],"answer":3,"kp":"存储层次与局部性"},{"id":"s2025b-16","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"SRAM 与 DRAM 的功耗对比","type":"fill","difficulty":1,"stem":"对比同样容量的 SRAM 和 DRAM，功耗更高的是哪一种？","code":null,"explanation":"SRAM 用 6 个晶体管组成的双稳态触发器保存每一位，不需要刷新，速度快，但单元面积大、静态功耗高；DRAM 用电容存电荷表示一个位，单元只需 1 个晶体管加 1 个电容，面积小、单位容量成本低，但电荷会泄漏，必须周期性刷新，读写也更慢。因此「功耗更高的是 SRAM、价格更低（每比特成本更低）的是 DRAM」。存储器层次结构正是利用这种「快而贵 vs 慢而便宜」的差异，把 SRAM 用作靠近 CPU 的 Cache、把 DRAM 用作主存。","tags":["SRAM","DRAM","存储器层次"],"options":null,"answer":["SRAM","sram"],"kp":"存储层次与局部性"},{"id":"s2025b-17","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"SRAM 与 DRAM 的成本对比","type":"fill","difficulty":1,"stem":"对比同样容量的 SRAM 和 DRAM，价格更低（单位容量成本更低）的是哪一种？","code":null,"explanation":"DRAM 的存储单元只需 1 个晶体管和 1 个电容，而 SRAM 需要 6 个晶体管，因此同样容量下 DRAM 的芯片面积小得多、单位比特成本更低。代价是 DRAM 需要刷新电路、访问延迟长、接口复杂。这条「成本—速度」的权衡是 Cache 能够存在的前提：用少量昂贵的 SRAM 缓存大量廉价 DRAM 中的热点数据，从而在平均意义上得到接近 SRAM 的速度和接近 DRAM 的价格。","tags":["DRAM","SRAM","成本"],"options":null,"answer":["DRAM","dram"],"kp":"存储层次与局部性"},{"id":"s2025b-18","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"ROM 的读写特性","type":"judge","difficulty":1,"stem":"判断对错：ROM 是只读存储器的简称，是非易失性存储器，掉电不会丢失数据，只能读不能写。","code":null,"explanation":"前半句正确：ROM 确实是只读存储器、属于非易失性存储、掉电不丢失数据。错在「只能读不能写」这一绝对化表述：现代 ROM 家族（PROM、EPROM、EEPROM、Flash）都是可以编程写入的，只是写入方式特殊——PROM 需要专用编程器一次性烧写，EPROM 要用紫外线擦除，EEPROM/Flash 可以电擦写，但写入速度远慢于读取，且擦写次数有限。因此「只能读不能写」不成立，本题答案为「错」。","tags":["ROM","非易失存储","Flash"],"options":null,"answer":false,"kp":"存储层次与局部性"},{"id":"s2025b-19","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"内存条中数据的跨芯片分布","type":"single","difficulty":3,"stem":"一根 DDR3 SDRAM 内存条的数据位宽是 64 bit，总容量 2 GB，由 8 颗内存芯片构成。若一个计算机系统只有这根内存条作为全部内存，那么往地址 0x01001000 写入一个 64 位数 0x12345678 时，这个数会放在内存条上从左向右数的第几颗（或哪几颗）内存芯片中？","code":null,"explanation":"内存条的总位宽 64 位是由 8 颗芯片「并联」拼出来的：每颗芯片只负责 64 位中的某 8 位（数据引脚交错连接），因此任意一次 64 位读写的 8 个字节会同时分散在 8 颗芯片上，每颗各贡献 8 位。这样做的原因是单颗芯片的位宽有限，把多颗并联可以让 8 颗芯片同时工作、一次并行取出 64 位，显著提高带宽；如果 64 位都放在一颗芯片里，就要串行输出，速度慢得多。地址 0x01001000 的低位则决定这一组 8 颗芯片中取的哪一行（bank/row），高位选择是哪一组芯片——注意地址的高位还会用于选择内存条的 rank。","tags":["DRAM","内存条","并行位宽"],"options":["分散存放在全部 8 颗芯片中，每颗芯片各存 8 位","全部存放在从左数第 1 颗芯片中（连续 64 位）","分散存放在第 1、2 两颗芯片中，每颗各存 32 位","存放在内存条的金手指（连接器）一侧，不占用芯片"],"answer":0,"kp":"存储层次与局部性"},{"id":"s2025b-20","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"SSD 与机械硬盘的对比","type":"multi","difficulty":2,"stem":"机械硬盘（HDD）和固态硬盘（SSD）对比，在主流产品形态下，下列属于 SSD 特点的是？（不定项选择，全部选对才得分）","code":null,"explanation":"SSD 以闪存芯片为介质，完全没有机械部件：随机读写速度远高于需要寻道的机械盘（A 对）；没有磁头盘片，不怕震动摔打（B 对）；无马达和磁头，运行时几乎无声（C 对）；可以做成 M.2 等小尺寸形态（D 对）。反观 E、F：「同容量价格更低」是 HDD 的优势，SSD 每 GB 成本仍高于机械盘；「写入寿命更长」也是 HDD 占优——闪存单元有擦写次数上限（P/E cycle），写入寿命有限，而机械盘的磁记录没有这种写入次数限制。因此正确答案是 ABCD。","tags":["SSD","机械硬盘","存储设备"],"options":["速度快","抗震耐摔","运行噪音小","体积小","同样容量的价格更低","支持写入的寿命更长"],"answer":[0,1,2,3],"kp":"存储层次与局部性"},{"id":"s2025b-21","source":"2025 第 2 次阶段测验","origin":"exam","lecture":12,"topic":"局部性原理的识别","type":"multi","difficulty":2,"stem":"下面这段代码中哪些地方体现了局部性原理，分别体现了什么类型的局部性？请选出所有正确说法。（不定项选择，全部选对才得分）","code":"int sum_array_rows(int a[M][N])\n{\n    int i, j, sum = 0;\n    for (i = 0; i < M; i++)\n        for (j = 0; j < N; j++)\n            sum += a[i][j];\n    return sum;\n}","explanation":"局部性分两类：时间局部性——刚被访问过的数据/指令很可能马上又被访问；空间局部性——地址相邻的数据/指令很可能接连被访问。逐项看：指令按地址顺序取下一条，是空间局部性；循环体一遍遍重复执行同样的指令，是时间局部性；sum 在每轮循环中被读又被写，是时间局部性；数组 a 按行优先顺序连续访问（a[i][j] 的地址随 j 递增），是空间局部性。E 错在数组元素在这里只被访问一次，没有时间局部性；F 把 i、j 的属性说反了，它们反复读写属于时间局部性。这也解释了为什么「按行访问」比「按列访问」快：行优先存储使得逐行扫描具有良好的空间局部性。","tags":["局部性","时间局部性","空间局部性"],"options":["顺序执行的指令序列体现了空间局部性","循环体内的指令反复被执行，体现了时间局部性","变量 sum 等被反复读写，体现了时间局部性","数组 a 中的数据按地址依次被读取，体现了空间局部性","数组 a 中的同一个元素被反复读取，体现了时间局部性","循环变量 i、j 被反复读写，体现了空间局部性"],"answer":[0,1,2,3],"kp":"存储层次与局部性"},{"id":"gen-c12-01","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"SRAM 与 DRAM 特性","type":"single","difficulty":1,"stem":"关于 SRAM 与 DRAM 的对比，下列说法正确的是：","code":null,"explanation":"讲义第 12 讲「SRAM vs DRAM Summary」表格：SRAM 每位用 6 或 8 个晶体管、访问时间约为 DRAM 的 1/10、不需要刷新、可能使用 EDC、成本约为 DRAM 的 100 倍，用于缓存；DRAM 每位只要 1 个晶体管加 1 个电容（电容上的电荷会泄漏，所以必须周期性刷新），访问时间约为 SRAM 的 10 倍、需要 EDC、成本低，用于主存和帧缓冲。选项 B 把两者的单元结构说反了；选项 C 把速度、成本和用途全说反了；选项 D 也颠倒：密度高、更容易出错的 DRAM 才是需要 EDC 的一方。","tags":["SRAM","DRAM","刷新"],"options":["SRAM 每位需要 6~8 个晶体管且不需要刷新；DRAM 每位只要 1 个晶体管加 1 个电容，但必须周期性刷新","DRAM 每位需要 6 个晶体管，SRAM 每位需要 1 个晶体管和 1 个电容","SRAM 因为便宜、容量大所以被用作主存，DRAM 因为速度快所以被用作缓存","DRAM 不需要错误检测与纠正（EDC），而 SRAM 一定需要"],"answer":0,"kp":"存储层次与局部性"},{"id":"gen-c12-02","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"磁盘访问时间计算","type":"single","difficulty":2,"stem":"某磁盘转速 6000 RPM，平均寻道时间 9 ms，平均每磁道 500 个扇区。按照讲义给出的三个分量公式，访问一个目标扇区的平均时间约为：","code":null,"explanation":"讲义第 12 讲「Disk Access Time」给出 Taccess = Tavgseek + Tavgrotation + Tavgtransfer。转速 6000 RPM 表示转一圈用 60/6000 s = 10 ms，平均旋转延迟是等待半圈，即 Tavgrotation = 5 ms；传输时间是读完一个扇区所需的旋转时间，Tavgtransfer = 一圈时间 / 每磁道扇区数 = 10 ms / 500 = 0.02 ms。于是 Taccess = 9 + 5 + 0.02 = 14.02 ms。选项 B（19.02 ms）是忘记把旋转延迟折半、直接用了整圈 10 ms 的错误；选项 A（9.02 ms）完全漏掉了旋转延迟和传输时间；选项 C（29.02 ms）把平均旋转延迟当成了两圈。这个例子也说明磁道访问时间由寻道和旋转延迟主导，扇区里第一个字节最贵、其余字节几乎免费。","tags":["磁盘","寻道时间","旋转延迟"],"options":["9.02 ms","19.02 ms","29.02 ms","14.02 ms"],"answer":3,"kp":"存储层次与局部性"},{"id":"gen-c12-03","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"数组访问的局部性","type":"single","difficulty":2,"stem":"下面的函数按列优先的顺序访问二维数组 a[M][N]（C 语言按行主序存放）。关于它相对数组 a 的局部性，正确的判断是：","code":"int sum_array_cols(int a[M][N])\n{\n    int i, j, sum = 0;\n    for (j = 0; j < N; j++)\n        for (i = 0; i < M; i++)\n            sum += a[i][j];\n    return sum;\n}","explanation":"C 数组按行主序连续存放，一行之内的元素才相邻。内层循环固定 j 而递增 i，访问的是 a[0][j]、a[1][j]、a[2][j]……相邻两次访问的地址相差 N×sizeof(int)，步长远大于一个缓存块，于是每次访问几乎都要缺失，空间局部性极差；讲义第 12 讲对这个函数的结论正是「Answer: no, unless M is very small」（M 很小时同一列的数据可能恰好都留在缓存里）。把两层循环交换、让 j 作内层循环，就变成步长 1 顺序扫描，才能利用空间局部性——这正是讲义紧接着用 `sum_array_3d` 让大家练习循环重排的原因。选项 C、D 都把访存步长理解错了。","tags":["局部性","行主序","循环重排"],"options":["空间局部性和时间局部性都很好，因为每个元素只被读一次","空间局部性很差：相邻两次访问的地址相差 N 个 int，除非 M 很小、整个数组都能放进缓存","空间局部性很好，因为内层循环以步长 1 扫描内存","它完全没有局部性，因为每次都访问同一列"],"answer":1,"kp":"数据布局与对齐"},{"id":"gen-c12-04","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"三维数组的循环重排","type":"single","difficulty":3,"stem":"下面这个函数要累加三维数组 a[M][N][N] 的所有元素。为了让内层循环以步长 1（连续地址）访问，应当怎样调整循环嵌套？","code":"int sum_array_3d(int a[M][N][N])\n{\n    int i, j, k, sum = 0;\n    for (i = 0; i < M; i++)\n        for (j = 0; j < N; j++)\n            for (k = 0; k < N; k++)\n                sum += a[k][i][j];\n    return sum;\n}","explanation":"三维数组 a[M][N][N] 在内存中按行主序排列，下标 k 是最内层维、变化最快，其次是 j，最后是 i；也就是说地址从快到慢的变化顺序是 k → j → i。当前代码最内层变化的是 k（它出现在 `a[k][i][j]` 的第一位），恰好是最慢变化的维，每步跨越 N×N 个元素，空间局部性最差。讲义第 12 讲对这个例子的答案就是「make j the inner loop」：把 j 放到最内层后，每次迭代 j 变化 1，访问地址连续，缓存命中率最高。选项 C 的「迭代次数相同」不代表访问顺序相同，局部性只取决于地址变化模式。","tags":["循环重排","空间局部性","三维数组"],"options":["把 i 作为最内层循环","把 j 作为最内层循环","保持现状即可，因为三层循环的迭代次数完全相同","把 k 放到最外层，i 保持最内层"],"answer":1,"kp":"数据布局与对齐"},{"id":"gen-c12-05","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"三种缓存缺失类型","type":"single","difficulty":2,"stem":"某直接映射缓存共有 4 行，程序的访存序列是块号 0、8、0、8、0、8……反复交替。即使缓存容量足以同时容纳这两个块，每次访问仍然缺失。这类缺失属于：","code":null,"explanation":"讲义第 12、13 讲都讲了三种缺失：冷启动（compulsory/cold）缺失是每个块第一次被引用时的必然缺失，因为缓存原本是空的；容量缺失是工作集（活跃块集合）整体大于缓存造成的；冲突缺失发生在缓存容量其实够用、但多个块被放置策略映射到同一行（或同一小组）而互相驱逐时。块 0 与块 8 满足 8 mod 4 = 0，在 4 行直接映射下都要占用第 0 行，于是交替引用时每次都被对方替换掉——这正是讲义举的例子「Referencing blocks 0, 8, 0, 8, 0, 8, ... would miss every time」。提高相联度（如改成 2 路组相联）可以消除这类冲突缺失，而容量缺失只能靠增大缓存或减小工作集来解决。","tags":["冲突缺失","直接映射","缓存容量"],"options":["冷启动（强制）缺失","冲突缺失","容量缺失","一致性缺失"],"answer":1,"kp":"高速缓存"},{"id":"gen-c12-06","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"存储技术趋势","type":"multi","difficulty":2,"stem":"关于存储技术与趋势，下列说法正确的有（多选）：","code":null,"explanation":"讲义第 12 讲「SSD Performance Characteristics / SSD Tradeoffs」：顺序访问快于随机访问是存储器层次的共同主题，实测数据是顺序读 2126 MB/s、顺序写 1880 MB/s、随机读 140 MB/s、随机写 59 MB/s；SSD 以页为单位读写，但页只有在所属块被擦除后才能写，擦除一个块约 1 ms，而且修改块内某页要先把其它页搬到新块，所以随机写明显更慢，闪存翻译层会先积累若干小写再合并成块写。SSD 的优点是没有机械部件、更快更省电，缺点是有擦写寿命（约 10 万次，靠 wear leveling 缓解），因此 C 错。磁盘的 Taccess 由寻道（典型 3~9 ms）与旋转延迟（半圈）主导，传输一个扇区只要 0.02 ms 量级，所以 D 对。DRAM 与 SRAM 都是易失性存储器，非易失的是 ROM/闪存等，E 错。","tags":["SSD","磁盘","存储趋势"],"options":["SSD 的顺序读吞吐量远高于随机读吞吐量（例如三星 940 EVO Plus 约 2126 MB/s 对 140 MB/s）","SSD 的页只能在其所属块被擦除后才能写入，而擦除一个块很慢（约 1 ms），因此随机写比随机读更慢","SSD 不存在磨损问题，因为它是纯电子器件、没有机械运动部件","磁盘的访问时间主要由寻道时间和旋转延迟决定，传输时间只占很小比例","DRAM 是非易失性存储器，断电后数据不会丢失"],"answer":[0,1,3],"kp":"存储层次与局部性"},{"id":"gen-c12-07","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"SSD 的读写特性","type":"judge","difficulty":1,"stem":"判断：SSD 的随机读吞吐量低于顺序读吞吐量，而且顺序写吞吐量低于随机写吞吐量。","code":null,"explanation":"讲义第 12 讲给出三星 940 EVO Plus 的实测数据：顺序读 2126 MB/s、顺序写 1880 MB/s、随机读 140 MB/s、随机写 59 MB/s。前半句「随机读低于顺序读」成立（140 < 2126），但后半句说反了——顺序写（1880 MB/s）远高于随机写（59 MB/s），因为随机写会频繁触发耗时的块擦除和整块数据搬移，而顺序写可以把连续页写在同一个块里。整个复合命题只要有一部分为假就为假，所以答案是「错」。记住这条贯穿存储器层次的规律：顺序访问总是优于随机访问；SSD 相对磁盘的优势主要体现在随机访问上，因为磁盘的随机访问要付出寻道和旋转延迟。","tags":["SSD","顺序访问","随机访问"],"options":null,"answer":false,"kp":"存储层次与局部性"},{"id":"gen-c12-08","source":"自编 · 第 12 讲","origin":"created","lecture":12,"topic":"Amdahl 定律与访存加速上限","type":"fill","difficulty":3,"stem":"某程序执行时间的 40% 花在处理主存缺失上，其余 60% 不受影响。若把主存访问延迟降低到原先的 1/4（只有这部分获得加速），按 Amdahl 定律，程序总执行时间的加速比约为多少（保留两位小数）？","code":null,"explanation":"Amdahl 定律：S = 1 / ((1 − f) + f / k)，其中 f 是被加速部分占总执行时间的比例，k 是该部分的加速倍数。这里 f = 0.4、k = 4，于是 S = 1 / (0.6 + 0.4/4) = 1 / (0.6 + 0.1) = 1/0.7 ≈ 1.43。结合讲义第 12 讲讨论的 CPU 与主存速度差距，它也说明了存储器层次结构为什么必须靠缓存「挡住」慢速主存：不可加速的 60% 构成加速上限——即使主存变得无限快（k → ∞），整体加速比也只有 1/0.6 ≈ 1.67。所以要获得实质性能提升，关注点应是提高缓存命中率、降低缺失率，而不是单纯堆砌某一层的速度。","tags":["Amdahl 定律","加速比","访存"],"options":null,"answer":["1.43","1.4286","10/7","1.43 倍"],"kp":"存储层次与局部性"},{"id":"f2013-04","source":"2013 期末","origin":"exam","lecture":13,"topic":"高速缓存行数与组数","type":"single","difficulty":1,"stem":"如果直接映射高速缓存（Cache）的大小是 4KB，并且块大小（block）为 32 字节，请问它每路（way）有多少行（line）？","code":null,"explanation":"直接映射就是 1 路组相联（E = 1），而每组每一路恰好有一行，所以“每路的行数”等于组数 S。由容量公式 C = S × E × B 得 S = 4096 / (1 × 32) = 128，即每路 128 行、共 128 组。选 64 是把块大小或路数重复除了一次；选 32 是直接拿块大小当行数；选 1 则把“路数 E = 1”当成了行数。踩坑点：先把组数 S 与路数 E 分清，再回答行数。","tags":["高速缓存","直接映射","组数"],"options":["128","64","32","1"],"answer":0,"kp":"高速缓存"},{"id":"f2013-05","source":"2013 期末","origin":"exam","lecture":13,"topic":"缓存冲突与替换次数","type":"single","difficulty":2,"stem":"块大小为 32 字节、共 128 组的直接映射高速缓存初始为空，数据访问地址序列（以字节为单位）为 0→4→16→132→232→4096→160，请问一共发生多少次替换？","code":null,"explanation":"直接映射的组号 =（地址/32）mod 128，也就是地址的第 5~11 位。各地址的块号依次为：0→0、4→0、16→0、132→4、232→7、4096→128、160→5，于是组号序列为 0、0、0、4、7、0、5。前三次访问都落在块 0 内（同一行），后两次 4、16 只是块内偏移不同，均命中；132、232、160 分别占用空行，属于强制不命中而非替换；只有 4096 与最初的 0 落在同一组（128 mod 128 = 0），把块 0 逐出，发生 1 次替换。踩坑点：0 与 4096 是“同组不同块”，不能因为首次访问 0 命中就以为 4096 也命中。","tags":["高速缓存","冲突不命中","组号计算"],"options":["0","1","2","3"],"answer":1,"kp":"高速缓存"},{"id":"f2014-08","source":"2014 期末","origin":"exam","lecture":13,"topic":"高速缓存的工作原理与层次设计","type":"single","difficulty":2,"stem":"通常情况下，下面的哪些表述是正确的？","code":null,"explanation":"缓存命中时返回的是“被请求的那一个字”，由地址中的块内偏移选中，而不是整块信息的内容，A 错。缓存的存在意义正是利用时间局部性（刚访问过的数据很可能再次被访问）与空间局部性，B 对。缓存由硬件自动管理，对程序员透明（除少数显式指令），C 错。层次越高越看重命中时间（L1 必须快），层次越低越看重命中率（L2/L3 要足够大），D 恰好说反了。","tags":["高速缓存","时间局部性","命中时间"],"options":["在一次读操作中，返回的内容由高速缓存中的信息块决定","高速缓存利用了时间局部性","大部分情况下，缓存需要用户程序采取显式的管理行为","一级高速缓存更看重命中率，二级高速缓存更看重命中时间"],"answer":1,"kp":"高速缓存"},{"id":"f2016-06","source":"2016 期末","origin":"exam","lecture":13,"topic":"组相联缓存的命中次数","type":"single","difficulty":3,"stem":"某机器内存为 8 位地址，cache 设计参数为 E=2、t=2、s=2、b=4，cache 块大小为 16 字节。cache 为空的初始状态下，数据访问的地址序列为 0→4→34→162→128→192→2（以字节为单位），请问一共发生多少次 cache 命中？","code":null,"explanation":"地址 8 位 = 标记 t(2 位) + 组索引 s(2 位) + 块偏移 b(4 位)，共 4 组、每组 2 路。把各地址写成「标记|组号|块偏移」：0 = 00|00|0000（组 0、标记 0）不命中；4 = 00|00|0100 与 0 同块，命中（1 次）；34 = 00|10|0010（组 2、标记 0）不命中；162 = 10|10|0010（组 2、标记 2）不命中；128 = 10|00|0000（组 0、标记 2）不命中；192 = 11|00|0000（组 0、标记 3）不命中，且组 0 两路已满需替换；2 = 00|00|0010（组 0、标记 0）此时标记 0 的行已被替换掉，不命中。合计只有 1 次命中。踩坑点：4 与 0 位于同一块内（只是块内偏移不同），因此算命中。","tags":["高速缓存","组相联","命中判断"],"options":["0","1","2","3"],"answer":1,"kp":"高速缓存"},{"id":"f2017-04","source":"2017 期末","origin":"exam","lecture":13,"topic":"组相联缓存的每路行数","type":"single","difficulty":2,"stem":"如果四路组相联的高速缓存大小是 32KB，并且块（block）大小为 32 字节，那么它每路（way）有多少行（line）？","code":null,"explanation":"容量公式 C = 组数 S × 路数 E × 块大小 B，所以 S = 32KB / (4 × 32B) = 32768 / 128 = 256 组。每组的每一路恰好有一行，因此每路有 256 行（全 cache 共 4 × 256 = 1024 行）。选 128 是忘掉除以路数（相当于按 1 路直接相除），选 64、32 则把块大小或路数重复乘除。踩坑点：先算组数 S，再回答“每路多少行”。","tags":["高速缓存","组相联","组数"],"options":["32","64","128","256"],"answer":3,"kp":"高速缓存"},{"id":"f2018-03","source":"2018 期末","origin":"exam","lecture":13,"topic":"缓存替换策略（LRU/FIFO/随机）","type":"single","difficulty":3,"stem":"下面关于缓存替换策略的说法哪个是正确的（N 为 cache 的大小）","code":null,"explanation":"A 错：FIFO 并不“总是”优于随机替换，两者在不同访存序列上互有胜负，说“总是”过于绝对。B 错：数组的顺序访问是流式访问，每个块只被访问一次，LRU 与 FIFO、随机替换在这种模式下几乎没有差别，替换策略的优劣只在存在重复访问（时间局部性）时才体现出来。C 对：LRU 在 N 行的缓存上产生 N+1 次 miss，说明访问序列中至少有 N+2 个互不相同的块：第一次访问必 miss，之后每换入一个不同的块都 miss，而最后必然还要访问到第一个块，无论采用哪种策略，该块在容量只有 N 时都不可能一直留在缓存里，所以至少还要再 miss 一次——因此任意策略至少产生 2 次 miss。D 错：对确定的替换策略，容量增大并不保证 miss 单调减少（Bélády 异常；FIFO 就可能出现容量变大反而 miss 变多的情况），LRU 因其栈式性质才具有单调性。踩坑点：LRU 不是万能药，随机替换也不是永远更差。","tags":["缓存替换","LRU","FIFO","miss率"],"options":["FIFO 的性能总是优于随机替换","LRU 适用于数组的顺序访问","假定 cache 初始状态为空，若某一输入片段使用 LRU 造成了 N+1 次 miss，则对任意策略至少产生两次 miss","对于同一确定性替换策略，增大 N 的大小一定减少 miss 次数"],"answer":2,"kp":"高速缓存"},{"id":"f2020-02","source":"2020 期末","origin":"exam","lecture":13,"topic":"组索引位位置对缓存行为的影响","type":"single","difficulty":3,"stem":"假设内存空间为 64 字节，考虑两个高速缓存系统 A 与 B。它们均有 s=E=b=2（即 2 位组索引、每组 2 行、块大小 2^2=4 字节），但高速缓存 A 要求组索引位在地址中间（地址 = tag｜index｜offset），而高速缓存 B 要求组索引位在地址的最高位（地址 = index｜tag｜offset）。设替换策略均采用 LRU，现考虑如下访存序列（十进制）：1, 7, 8, 3, 4。则下列说法中正确的个数为：\n①高速缓存 A 的容
