  function viewStats() {
    var total = QUESTIONS.length;
    var answered = QUESTIONS.filter(function (q) { return isAnswered(q.id); });
    var rightQ = QUESTIONS.filter(function (q) { return isRight(q.id); });
    var totalAttempts = 0, totalRight = 0;
    QUESTIONS.forEach(function (q) {
      var s = DB.stat[q.id]; if (s) { totalAttempts += s.r + s.w; totalRight += s.r; }
    });
    var wrongN = Object.keys(DB.wrong).length;

    var h = [];
    h.push('<div class="section-head"><h2>学习统计</h2><p>数据保存在本机浏览器中，换设备可用「导出数据」迁移</p>' +
           '<span class="spacer"></span><button class="btn btn-sm" id="openSettings">⚙️ 设置</button>' +
           '<button class="btn btn-sm" id="exportData">⬇️ 导出数据</button>' +
           '<button class="btn btn-sm" id="importData">⬆️ 导入数据</button></div>');

    h.push('<div class="grid g4" style="margin-bottom:20px">');
    h.push(statTile('题库覆盖率', Math.round(answered.length / total * 100) + '%', answered.length + ' / ' + total + ' 题已练过'));
    h.push(statTile('总正确率', totalAttempts ? Math.round(totalRight / totalAttempts * 100) + '%' : '—', '累计作答 ' + totalAttempts + ' 次'));
    h.push(statTile('完全掌握', rightQ.length, '答过且全对的题'));
    h.push(statTile('待攻克错题', wrongN, '错题本中的题目'));
    h.push('</div>');

    // 各讲次
    h.push('<div class="card" style="padding:20px 22px;margin-bottom:16px">');
    h.push('<div class="section-head" style="margin-bottom:14px"><h2 style="font-size:17px">各讲次掌握情况</h2>' +
           '<p>点击条目可直接进入该讲练习</p></div>');
    h.push('<div class="bar-chart">');
    LECTURES.forEach(function (l) {
      var qs = QUESTIONS.filter(function (q) { return q.lecture === l.n; });
      if (!qs.length) return;
      var ans = qs.filter(function (q) { return isAnswered(q.id); });
      var okN = qs.filter(function (q) { return isRight(q.id); });
      var p = ans.length ? okN.length / ans.length * 100 : 0;
      var cov = ans.length / qs.length * 100;
      h.push('<div class="bar-row">' +
        '<span class="bl" data-lec="' + l.n + '">第 ' + l.n + ' 讲 ' + esc(l.title) + '</span>' +
        '<span class="bar-track">' +
        (ans.length ? '<i class="bar-seg ok" style="width:' + p + '%"></i><i class="bar-seg bad" style="width:' + (100 - p) + '%"></i>'
                    : '<i class="bar-seg" style="width:0"></i>') +
        '</span>' +
        '<span class="bv">' + (ans.length ? Math.round(p) + '%' : '未练') + '</span></div>');
      void cov;
    });
    h.push('</div></div>');

    // 薄弱知识点
    var topics = {};
    QUESTIONS.forEach(function (q) {
      var s = DB.stat[q.id]; if (!s) return;
      var t = topics[q.kp] || (topics[q.kp] = { n: 0, r: 0, lec: q.lecture });
      t.n += s.r + s.w; t.r += s.r;
    });
    var weak = Object.keys(topics).filter(function (k) { return topics[k].n >= 2; })
      .map(function (k) { return { k: k, v: topics[k] }; })
      .sort(function (a, b) { return (a.v.r / a.v.n) - (b.v.r / b.v.n); }).slice(0, 12);

    h.push('<div class="grid g2">');
    h.push('<div class="card" style="padding:20px 22px">');
    h.push('<div class="section-head" style="margin-bottom:14px"><h2 style="font-size:17px">薄弱知识点 TOP 12</h2></div>');
    if (!weak.length) h.push('<p style="color:var(--text-3);font-size:13.5px">多练几题后这里会显示你的薄弱环节。</p>');
    else {
      h.push('<div class="bar-chart">');
      weak.forEach(function (w) {
        var p = w.v.r / w.v.n * 100;
        h.push('<div class="bar-row"><span class="bl" data-kpf="' + esc(w.k) + '" title="' + esc(w.k) + '">' + esc(w.k) + '</span>' +
          '<span class="bar-track"><i class="bar-seg ' + (p >= 60 ? 'ok' : 'bad') + '" style="width:' + p + '%"></i></span>' +
          '<span class="bv">' + Math.round(p) + '%</span></div>');
      });
      h.push('</div>');
    }
    h.push('</div>');

    h.push('<div class="card" style="padding:20px 22px">');
    h.push('<div class="section-head" style="margin-bottom:14px"><h2 style="font-size:17px">历史考试记录</h2></div>');
    if (!DB.papers.length) h.push('<p style="color:var(--text-3);font-size:13.5px">还没有考试记录，去「模拟考试」试试。</p>');
    else {
      h.push('<div style="display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto">');
      DB.papers.slice().reverse().forEach(function (p) {
        var d = new Date(p.ts);
        var s = Math.round(p.right / p.total * 100);
        h.push('<div style="display:flex;align-items:center;gap:12px;font-size:13px">' +
          '<span style="color:var(--text-3);font-family:var(--mono);font-size:11.5px;width:118px">' +
          d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</span>' +
          '<span class="tag ' + (s >= 80 ? 'tag-ok' : s >= 60 ? 'tag-warn' : 'tag-bad') + '">' + s + ' 分</span>' +
          '<span style="color:var(--text-2)">' + p.right + '/' + p.total + ' 题</span>' +
          '<span style="color:var(--text-3);margin-left:auto;font-family:var(--mono);font-size:11.5px">' + fmtTime(p.dur) + '</span>' +
          '</div>');
      });
      h.push('</div>');
    }
    h.push('</div></div>');

    // 讲次热力图
    h.push('<div class="card" style="padding:20px 22px;margin-top:16px">');
    h.push('<div class="section-head" style="margin-bottom:14px"><h2 style="font-size:17px">26 讲掌握热力图</h2>' +
           '<p>颜色越绿表示正确率越高，灰色表示还未练习</p></div>');
    h.push('<div class="heat-grid">');
    LECTURES.forEach(function (l) {
      var qs = QUESTIONS.filter(function (q) { return q.lecture === l.n; });
      var ans = qs.filter(function (q) { return isAnswered(q.id); });
      var okN = qs.filter(function (q) { return isRight(q.id); });
      var p = ans.length ? okN.length / ans.length : null;
      var bg, col;
      if (p === null) { bg = 'var(--surface-3)'; col = 'var(--text-3)'; }
      else {
        var hue = Math.round(p * 130);
        bg = 'hsl(' + hue + ' 68% ' + (p > .5 ? 82 : 88) + '%)';
        col = 'hsl(' + hue + ' 60% 28%)';

      h.push('<div class="heat-cell" data-lec="' + l.n + '" title="第 ' + l.n + ' 讲 ' + esc(l.title) + '（' +

  function exportData() {
    var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ics-quiz-progress-' + new Date().toISOString().slice(0, 10) + '.json';

  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result);
          DB.wrong = o.wrong || {}; DB.star = o.star || {}; DB.stat = o.stat || {};
          DB.notes = o.notes || {};
          DB.papers = o.papers || []; DB.settings = Object.assign(DB.settings, o.settings || {});
          saveDB(); applyTheme(); toast('数据导入成功', 'ok');
          rerenderAll();
        } catch (e) { toast('文件解析失败', 'bad'); }
      };
      r.readAsText(f);
    };
    inp.click();
  }

    home: viewHome,

  function go(name) {
    // 动态视图在进入时重新渲染，保证数据不是启动时的旧快照
    if (name === 'bank' || name === 'wrong' || name === 'star') {
      var bv = $('#view-' + name);
      if (bv) { bv.innerHTML = viewBank(name); bindBank(name); }
    } else if (name === 'home') {
      var hv = $('#view-home');
      if (hv) { hv.innerHTML = viewHome(); bindCommon(hv); }
    } else if (name === 'stats') {
      var sv = $('#view-stats');
      if (sv) { sv.innerHTML = viewStats(); bindCommon(sv); }
    } else if (name === 'lectures') {
      var lv = $('#view-lectures');
      if (lv) { lv.innerHTML = viewLectures(); bindCommon(lv); }
    } else if (name === 'exam') {
      syncExamPreview();
    }

    $$('.view').forEach(function (v) { v.classList.remove('active'); });
    var el = $('#view-' + name);
    if (el) el.classList.add('active');
    $$('.nav-item').forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-go') === name); });
    var title = {
      home: '首页', practice: '刷题', exam: '模拟考试', examrun: '考试中',
      examreport: '考试报告', bank: '题库浏览', wrong: '错题本', star: '收藏夹',
      stats: '学习统计', lectures: '讲义速览'
    }[name] || '';
    document.title = title ? (title + ' · ICS 刷题系统') : 'ICS 刷题系统';
    window.scrollTo(0, 0);
    // 计数徽标
    var wb = $('#wrongBadge');
    if (wb) {
      var n = Object.keys(DB.wrong).length;
      wb.textContent = n; wb.style.display = n ? '' : 'none';
    }
  }

  function rerenderAll() {
    var cur = $$('.view').filter(function (v) { return v.classList.contains('active'); })[0];
    var name = cur ? cur.id.replace('view-', '') : 'home';
    if (name === 'practice' || name === 'examrun' || name === 'examreport') return;
    go(name);
  }

  function bindCommon(root) {
    root = root || document;
    $$('[data-go]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        go(b.getAttribute('data-go'));
      });
    });
    $$('[data-lec]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var n = parseInt(b.getAttribute('data-lec'), 10);
        startPractice({ lecture: n, name: '第 ' + n + ' 讲 · ' + lecTitle(n) });
      });
    });
    $$('[data-topic]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        resetFilters(); F.topics = [b.getAttribute('data-topic')];
        startPractice({ name: '知识点：' + b.getAttribute('data-topic') });
      });
    });
    $$('[data-kpf]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        resetFilters(); F.kps = [b.getAttribute('data-kpf')];
        startPractice({ name: '知识点：' + b.getAttribute('data-kpf') });
      });
    });
    $$('[data-mode]', root).forEach(function (b) {
      b.addEventListener('click', function () { handleMode(b.getAttribute('data-mode')); });
    });
    var es = $('#openSettings'); if (es) es.addEventListener('click', viewSettings);
    var ed = $('#exportData'); if (ed) ed.addEventListener('click', exportData);
    var id = $('#importData'); if (id) id.addEventListener('click', importData);
  }

  function handleMode(m) {
    if (m === 'start-sequential') startPractice({ name: '顺序练习' });
    else if (m === 'start-random') startPractice({ shuffle: true, name: '随机练习' });
    else if (m === 'start-wrong') {
      if (!Object.keys(DB.wrong).length) { toast('错题本是空的，先去练习吧', 'warn'); return; }
      startPractice({ onlyWrong: true, shuffle: true, name: '错题重做' });
    }
    else if (m === 'start-star') {
      if (!Object.keys(DB.star).length) { toast('还没有收藏题目，点题目右上角 ★ 收藏', 'warn'); return; }
      startPractice({ onlyStar: true, shuffle: true, name: '收藏精练' });
    }
    else if (m === 'go-exam') { go('exam'); }
    else if (m === 'go-bank') { go('bank'); }
    else if (m === 'go-stats') { go('stats'); }
    else if (m === 'go-lectures') { go('lectures'); }
  }

  function bindBank(mode) {
    var v = $('#view-' + mode);
    if (!v) return;
    ['bankSearch', 'bankLec', 'bankKp', 'bankType', 'bankOrigin', 'bankSort'].forEach(function (idn) {
      var e = $('#' + idn);
      if (!e) return;
      var ev = idn === 'bankSearch' ? 'input' : 'change';
      var h = function () { BANK.page = 1; refreshBank(mode); };
      e.addEventListener(ev, idn === 'bankSearch' ? debounce(h, 200) : h);
    });
    $$('[data-bank-act]', v).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-bank-act');
        if (a === 'practice-wrong') startPractice({ onlyWrong: true, shuffle: true, name: '错题重做' });
        else if (a === 'practice-star') startPractice({ onlyStar: true, shuffle: true, name: '收藏精练' });
        else if (a === 'clear-wrong') {
          openModal('清空错题本？', '<p>将移除全部 ' + Object.keys(DB.wrong).length + ' 条错题记录，此操作不可撤销。</p>',
            [{ t: '取消', cls: 'btn' }, { t: '确认清空', cls: 'btn btn-danger', act: 'clear-wrong' }]);
        }
      });
    });
    refreshBank(mode);
  }

  function refreshBank(mode) {
    paintBank();

    $$('[data-qid]', v).forEach(function (c) {

  }

    ins.addEventListener('click', function () {
      ins.classList.toggle('on');
      ins.textContent = ins.classList.contains('on') ? '交卷后统一看解析' : '—';
    });
    $('#startExam').addEventListener('click', startExam);
    syncExamPreview();
  }

  function syncExamPreview() {
    var el = $('#examPreview');
    if (!el) return;
    var n = examCandidates().length;
    el.textContent = '当前范围可用题目：' + n + ' 道，将抽取 ' + Math.min(EXCFG.count, n) + ' 道';
  }

  function bindExamRunView() {
    var v = $('#view-examrun');
    bindExamRun();
  }

  function bindExamReport() {
    var v = $('#view-examreport');
    $$('[data-report]', v).forEach(function (b) {
      b.addEventListener('click', function () { renderReportList(b.getAttribute('data-report')); });
    });
  }

  /* ======================================================================
     16. 全局键盘
     ====================================================================== */

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      var cur = $$('.view').filter(function (v) { return v.classList.contains('active'); })[0];
      var name = cur ? cur.id.replace('view-', '') : '';

      if (e.key === 'Escape') { closeModals(); return; }

      if (name === 'practice') {
        var q = P.pool[P.idx];
        if (!q) return;
        if (/^[a-fA-F]$/.test(e.key) && (q.type === 'single' || q.type === 'multi')) {
          var i = LETTERS.indexOf(e.key.toUpperCase());
          if (i >= 0 && i < q.options.length) { e.preventDefault(); practicePick(q.id, i); }
        } else if (/^[1-6]$/.test(e.key) && (q.type === 'single' || q.type === 'multi')) {
          var i2 = parseInt(e.key, 10) - 1;
          if (i2 < q.options.length) { e.preventDefault(); practicePick(q.id, i2); }
        } else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); nextQ(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevQ(); }
        else if (e.key === 's' || e.key === 'S') { toggleStar(q.id); renderQArea(); }
      } else if (name === 'examrun' && E && !E.submitted) {
        var q2 = E.paper[E.idx];
        if (/^[a-fA-F]$/.test(e.key)) {
          var k = LETTERS.indexOf(e.key.toUpperCase());
          if (k >= 0 && k < q2.options.length) {
            e.preventDefault();
            if (q2.type === 'multi') {
              var cur2 = Array.isArray(E.answers[q2.id]) ? E.answers[q2.id].slice() : [];
              var kk = cur2.indexOf(k);
              if (kk >= 0) cur2.splice(kk, 1); else cur2.push(k);
              if (cur2.length) E.answers[q2.id] = cur2; else delete E.answers[q2.id];
            } else E.answers[q2.id] = k;
            renderExamRun();
          }
        } else if (e.key === 'ArrowRight') { if (E.idx < E.paper.length - 1) { E.idx++; renderExamRun(); } }
        else if (e.key === 'ArrowLeft') { if (E.idx > 0) { E.idx--; renderExamRun(); } }
      }
    });
  }

  function toggleStar(qid) {
    if (DB.star[qid]) { delete DB.star[qid]; toast('已取消收藏'); }
    else { DB.star[qid] = 1; toast('已收藏', 'ok'); }
    saveDB();
  }

  /* ======================================================================
     17. 全局委托点击（星级、modal 按钮等）
     ====================================================================== */

  function bindDelegates() {
    document.addEventListener('click', function (e) {
      var st = e.target.closest && e.target.closest('[data-star]');
      if (st) {
        var qid = st.getAttribute('data-star');
        toggleStar(qid);
        st.classList.toggle('on', !!DB.star[qid]);
        st.textContent = DB.star[qid] ? '★' : '☆';
        if ($$('.view').filter(function (v) { return v.classList.contains('active'); })[0].id === 'view-practice') renderQArea();
        return;
      }
      var ma = e.target.closest && e.target.closest('[data-mact]');
      if (ma) {
        var act = ma.getAttribute('data-mact');
        handleModalAct(act, ma.getAttribute('data-marg'));
        return;
      }
      var kpb = e.target.closest && e.target.closest('[data-kp]');
      if (kpb) { showKP(parseInt(kpb.getAttribute('data-kp'), 10)); return; }
      var dc = e.target.closest && e.target.closest('[data-detail-close]');
      if (dc) { closeModals(); return; }
      var dp = e.target.closest && e.target.closest('[data-detail-practice]');
      if (dp) {
        closeModals();
        var q = BY_ID[dp.getAttribute('data-detail-practice')];
        resetFilters();
        P.pool = [q]; P.order = [0]; P.idx = 0; P.states = {};
        P.ctxName = '单题练习 · ' + q.topic;
        go('practice'); renderPractice();
        return;
      }
      var dl = e.target.closest && e.target.closest('[data-detail-lec]');
      if (dl) {
        closeModals();
        var n = parseInt(dl.getAttribute('data-detail-lec'), 10);
        startPractice({ lecture: n, name: '第 ' + n + ' 讲 · ' + lecTitle(n) });
        return;
      }
      var setb = e.target.closest && e.target.closest('[data-set]');
      if (setb) {
        var key = setb.getAttribute('data-set'), val = setb.getAttribute('data-val');
        if (key === 'theme') DB.settings.theme = val;
        else DB.settings[key] = val === '1';
        saveDB(); applyTheme(); viewSettings();
        return;
      }
      if (e.target.closest && e.target.closest('[data-close-modal]')) closeModals();
    });
    $$('.modal-host').forEach(function (mh) {
      mh.addEventListener('mousedown', function (e) { if (e.target === mh) closeModals(); });
    });
    // 笔记自动保存（事件委托，输入过程中不会重绘，焦点不丢）
    document.addEventListener('input', debounce(function (e) {
      var t = e.target;
      if (!t || !t.getAttribute || !t.getAttribute('data-note')) return;
      var qid = t.getAttribute('data-note');
      var v = t.value;
      if (v && v.trim()) DB.notes[qid] = v; else delete DB.notes[qid];
      saveDB();
    }, 400));
  }

  function handleModalAct(act, arg) {
    if (act === 'go-practice') {
      closeModals();
      startPractice({ name: '顺序练习' });
      return;
    }
    if (act === 'kp-drill') {
      closeModals();
      var ln = parseInt(arg, 10);
      startPractice({ lecture: ln, name: '第 ' + ln + ' 讲 · ' + lecTitle(ln) });
      return;
    }
    if (act === 'quit-exam') { closeModals(); clearInterval(examTimer); E = null; go('exam'); return; }
    if (act === 'do-submit') { closeModals(); submitExam(); return; }
    if (act === 'clear-wrong') {
      DB.wrong = {}; saveDB(); closeModals();
      $('#view-wrong').innerHTML = viewBank('wrong'); bindBank('wrong'); go('wrong');
      toast('错题本已清空', 'ok'); return;
    }
    if (act === 'wrong-round') {
      closeModals();
      var wrongList = P.pool.filter(function (q) { return P.states[q.id] && P.states[q.id].done && !P.states[q.id].right; });
      if (!wrongList.length) { toast('本轮没有错题，厉害！', 'ok'); return; }
      P.pool = wrongList; P.order = wrongList.map(function (_, i) { return i; }); P.idx = 0; P.states = {};
      P.ctxName = '本轮错题重做'; renderPractice(); toast('已切换到本轮错题', 'ok'); return;
    }
    if (act === 'restart') {
      closeModals();
      P.states = {}; P.idx = 0; renderPractice(); return;
    }
    if (act === 'go-stats') { closeModals(); go('stats'); return; }
    if (act === 'close') { closeModals(); return; }
    closeModals();
  }

  /* ======================================================================
     18. 启动
     ====================================================================== */

  function boot() {
    loadDB();
    applyTheme();

    // 构建视图容器
    var views = ['home', 'practice', 'exam', 'examrun', 'examreport', 'bank', 'wrong', 'star', 'stats', 'lectures'];
    var shell = $('#views');
    shell.innerHTML = views.map(function (v) {
      if (v === 'practice') return '<section class="view" id="view-practice"><div class="practice-layout" id="practiceHost"></div></section>';
      if (v === 'examrun') return '<section class="view" id="view-examrun"><div id="examRunHost"></div></section>';
      if (v === 'examreport') return '<section class="view" id="view-examreport"><div id="examReportHost"></div></section>';
      return '<section class="view" id="view-' + v + '"></section>';
    }).join('');

    $('#view-home').innerHTML = viewHome();
    $('#view-exam').innerHTML = viewExam();
    $('#view-stats').innerHTML = viewStats();
    $('#view-lectures').innerHTML = viewLectures();
    $('#view-bank').innerHTML = viewBank('bank');
    $('#view-wrong').innerHTML = viewBank('wrong');
    $('#view-star').innerHTML = viewBank('star');

    bindCommon(document);
    bindBank('bank'); bindBank('wrong'); bindBank('star');
    bindExamView();
    bindDelegates();
    bindKeys();

    // 顶部按钮
    $('#themeBtn').addEventListener('click', function () {
      DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark';
      saveDB(); applyTheme();
    });
    $('#settingsBtn').addEventListener('click', viewSettings);
    $('#helpBtn').addEventListener('click', viewHelp);
    $('#printBtn').addEventListener('click', function () { window.print(); });

    $$('.nav-item').forEach(function (n) {
      n.addEventListener('click', function () {
        go(n.getAttribute('data-go'));
      });
    });

    go('home');
    var wb = $('#wrongBadge');
    var wn = Object.keys(DB.wrong).length;
    if (wb) { wb.textContent = wn; wb.style.display = wn ? '' : 'none'; }

    if (!QUESTIONS.length) {
      toast('题库为空，请先运行 build.py 生成数据', 'warn');
    }
  }

  // 暴露少量接口便于调试 / 单元测试
  window.ICSQuiz = {
    QUESTIONS: QUESTIONS, LECTURES: LECTURES, DB: DB, go: go, startPractice: startPractice,
    renderQuestion: renderQuestion, _pure: {
      mathHTML: mathHTML, rich: rich, checkAnswer: checkAnswer, normFill: normFill,
      answerText: answerText, filterQuestions: filterQuestions, buildPaper: buildPaper,
      shuffle: shuffle, dedupePool: null, P: P, F: F, EXCFG: EXCFG,
      viewBank: viewBank, BANK: BANK, resetFilters: resetFilters
    }
  };

  var HAS_DOM = (typeof document !== 'undefined' && document.getElementById);
  if (HAS_DOM) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();</script>
